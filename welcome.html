<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome - SABASABA Gospel Ministry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
width:100%;
height:100%;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#0b3d91,#1e90ff);
color:#ffffff;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.welcomeContainer{
width:100%;
max-width:430px;
text-align:center;
}

.ministryLogo{
width:95px;
height:95px;
margin:0 auto 20px;
border-radius:50%;
background:#ffffff;
color:#0b3d91;
display:flex;
align-items:center;
justify-content:center;
font-size:46px;
box-shadow:0 8px 25px rgba(0,0,0,.22);
}

h1{
font-size:27px;
line-height:1.3;
letter-spacing:.5px;
}

p{
margin-top:12px;
font-size:16px;
color:#e5f1ff;
line-height:1.5;
}

.actionButtons{
margin-top:34px;
display:flex;
flex-direction:column;
gap:14px;
}

.actionButton{
display:block;
padding:15px 20px;
border-radius:30px;
font-size:16px;
font-weight:bold;
text-decoration:none;
transition:transform .2s ease,background .2s ease;
}

.actionButton:hover{
transform:translateY(-2px);
}

.primaryButton{
background:#ffffff;
color:#0b3d91;
box-shadow:0 5px 16px rgba(0,0,0,.18);
}

.primaryButton:hover{
background:#f1f6ff;
}

.secondaryButton{
background:rgba(255,255,255,.16);
color:#ffffff;
border:2px solid rgba(255,255,255,.6);
}

.secondaryButton:hover{
background:rgba(255,255,255,.26);
}

.smallText{
margin-top:30px;
font-size:13px;
opacity:.82;
}

</style>
</head>

<body>

<main class="welcomeContainer">

  <div class="ministryLogo">
    ✝️
  </div>

  <h1>
    SABASABA GOSPEL MINISTRY
  </h1>

  <p>
    Join our Christian community to share testimonies,
    prayer requests, Bible study and encouragement with
    believers around the world.
  </p>

  <div class="actionButtons">

    <a
      href="register.html"
      class="actionButton primaryButton"
    >
      Create Account
    </a>

    <a
      href="login.html"
      class="actionButton secondaryButton"
    >
      Login
    </a>

  </div>

  <div class="smallText">
    Preaching Jesus Christ to the World
  </div>

</main>

</body>
</html>
