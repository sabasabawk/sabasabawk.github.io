<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="View followers of a Faith Connect member."
  >

  <title>
    Followers | SABASABA Gospel Ministry
  </title>

  <style>

    /* =====================================================
       PART 1 OF 6
       GENERAL PAGE AND TOP HEADER
    ===================================================== */


    /* =====================================================
       GENERAL RESET
    ===================================================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }


    :root{

      --primary:#087bd1;
      --primary-dark:#0667b1;
      --primary-light:#e9f5fd;

      --background:#eef3f8;
      --surface:#ffffff;

      --text:#1f2b34;
      --muted:#687680;

      --border:#dce4ea;

      --danger:#c84444;

      --shadow:
        0 6px 20px rgba(25,55,75,.10);

      --radius-large:22px;
      --radius-medium:16px;
      --radius-small:12px;

    }


    html{
      scroll-behavior:smooth;
    }


    body{

      min-height:100vh;

      background:var(--background);
      color:var(--text);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    button,
    input{
      font:inherit;
    }


    button{
      cursor:pointer;
    }


    a{
      color:inherit;
      text-decoration:none;
    }


    img{
      display:block;
      max-width:100%;
    }


    /* =====================================================
       TOP HEADER
    ===================================================== */

    .topHeader{

      position:sticky;
      top:0;
      z-index:1000;

      background:
        rgba(255,255,255,.96);

      border-bottom:
        1px solid var(--border);

      backdrop-filter:
        blur(12px);

    }


    .topHeaderInner{

      width:100%;
      max-width:760px;
      min-height:62px;

      margin:auto;
      padding:8px 14px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;

    }


    .backButton{

      width:42px;
      height:42px;
      flex-shrink:0;

      border:0;
      border-radius:50%;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#edf3f7;
      color:var(--text);

      font-size:23px;
      font-weight:900;

      transition:
        background .2s ease,
        transform .2s ease;

    }


    .backButton:hover{
      background:#dfeaf1;
    }


    .backButton:active{
      transform:scale(.95);
    }


    .headerTitleArea{

      min-width:0;
      flex:1;

    }


    .headerTitle{

      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      font-size:17px;
      font-weight:900;

    }


    .headerSubtitle{

      margin-top:2px;

      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      color:var(--muted);

      font-size:11px;
      font-weight:700;

    }


    .headerIcon{

      width:42px;
      height:42px;
      flex-shrink:0;

      border-radius:14px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:
        linear-gradient(
          145deg,
          var(--primary),
          #4ca9e5
        );

      color:#ffffff;

      font-size:20px;

      box-shadow:
        0 5px 14px rgba(8,123,209,.22);

    }


    /* =====================================================
       MAIN PAGE
    ===================================================== */

    .pageContainer{

      width:100%;
      max-width:760px;

      margin:auto;

      padding:
        18px
        14px
        40px;

    }


    /* =====================================================
       PAGE INTRODUCTION
    ===================================================== */

    .pageIntro{

      margin-bottom:16px;
      padding:20px;

      border-radius:var(--radius-large);

      background:
        linear-gradient(
          135deg,
          #087bd1,
          #45a9eb
        );

      color:#ffffff;

      box-shadow:
        0 8px 24px rgba(8,123,209,.22);

    }


    .pageIntroTitle{

      font-size:23px;
      font-weight:900;

    }


    .pageIntroText{

      margin-top:7px;

      font-size:12px;
      line-height:1.55;

      opacity:.93;

    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media(max-width:520px){

      .pageContainer{
        padding-left:10px;
        padding-right:10px;
      }

      .pageIntro{
        padding:17px;
      }

      .pageIntroTitle{
        font-size:21px;
      }

    }

  </style>
  <style>

    /* =====================================================
       PART 2 OF 6
       SEARCH BOX, FOLLOWER CARDS,
       LOADING AND EMPTY STATES
    ===================================================== */


    /* =====================================================
       SEARCH AREA
    ===================================================== */

    .searchCard{

      margin-bottom:16px;
      padding:14px;

      border:1px solid var(--border);
      border-radius:var(--radius-medium);

      background:var(--surface);

      box-shadow:var(--shadow);

    }


    .searchLabel{

      display:block;
      margin-bottom:8px;

      color:var(--muted);

      font-size:11px;
      font-weight:800;

    }


    .searchInput{

      width:100%;
      min-height:46px;

      padding:11px 13px;

      border:1px solid var(--border);
      border-radius:13px;

      background:#ffffff;
      color:var(--text);

      outline:none;

      font-size:14px;

      transition:
        border-color .2s ease,
        box-shadow .2s ease;

    }


    .searchInput:focus{

      border-color:var(--primary);

      box-shadow:
        0 0 0 3px rgba(8,123,209,.12);

    }


    /* =====================================================
       FOLLOWER COUNT BAR
    ===================================================== */

    .listSummary{

      margin-bottom:14px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;

    }


    .listSummaryTitle{

      font-size:16px;
      font-weight:900;

    }


    .listSummaryCount{

      min-width:34px;
      min-height:28px;

      padding:5px 10px;

      border-radius:999px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:var(--primary-light);
      color:var(--primary);

      font-size:11px;
      font-weight:900;

    }


    /* =====================================================
       FOLLOWERS LIST
    ===================================================== */

    .followersList{

      display:flex;
      flex-direction:column;
      gap:12px;

    }


    /* =====================================================
       FOLLOWER CARD
    ===================================================== */

    .followerCard{

      padding:13px;

      border:1px solid var(--border);
      border-radius:var(--radius-medium);

      display:flex;
      align-items:center;
      gap:12px;

      background:var(--surface);

      box-shadow:
        0 4px 14px rgba(30,60,80,.07);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;

    }


    .followerCard:hover{

      transform:translateY(-2px);

      border-color:#b8d8ec;

      box-shadow:
        0 8px 20px rgba(30,60,80,.11);

    }


    .followerAvatar{

      width:56px;
      height:56px;
      flex-shrink:0;

      border-radius:50%;

      object-fit:cover;

      background:#dfe7ec;

      border:3px solid #d8efff;

      cursor:pointer;

    }


    .followerInformation{

      min-width:0;
      flex:1;

    }


    .followerName{

      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      color:var(--text);

      font-size:15px;
      font-weight:900;

      cursor:pointer;

    }


    .followerName:hover{
      color:var(--primary);
      text-decoration:underline;
    }


    .followerCountry{

      margin-top:4px;

      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      color:var(--muted);

      font-size:11px;
      font-weight:700;

    }


    .followerAbout{

      margin-top:5px;

      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:2;

      overflow:hidden;

      color:#53616b;

      font-size:11px;
      line-height:1.4;

    }


    /* =====================================================
       CARD ACTIONS
    ===================================================== */

    .followerActions{

      flex-shrink:0;

      display:flex;
      align-items:center;
      gap:7px;

    }


    .viewProfileButton{

      min-height:38px;
      padding:8px 11px;

      border:0;
      border-radius:11px;

      background:var(--primary);
      color:#ffffff;

      font-size:10px;
      font-weight:900;

      transition:
        background .2s ease,
        transform .2s ease;

    }


    .viewProfileButton:hover{
      background:var(--primary-dark);
    }


    .viewProfileButton:active{
      transform:scale(.96);
    }


    /* =====================================================
       STATUS CARD
    ===================================================== */

    .statusCard{

      padding:28px 18px;

      border:1px solid var(--border);
      border-radius:var(--radius-medium);

      background:var(--surface);

      text-align:center;

      box-shadow:var(--shadow);

    }


    .statusIcon{

      margin-bottom:10px;

      font-size:31px;

    }


    .statusTitle{

      font-size:16px;
      font-weight:900;

    }


    .statusText{

      max-width:440px;
      margin:7px auto 0;

      color:var(--muted);

      font-size:12px;
      line-height:1.55;

    }


    .statusCard.error{

      border-color:#efc8c8;

      background:#fdecec;
      color:#a52f2f;

    }


    /* =====================================================
       HIDDEN ELEMENT
    ===================================================== */

    .hidden{
      display:none !important;
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media(max-width:520px){

      .followerCard{
        align-items:flex-start;
      }

      .followerAvatar{
        width:52px;
        height:52px;
      }

      .followerActions{
        align-self:center;
      }

      .viewProfileButton{
        padding-left:9px;
        padding-right:9px;
      }

    }


    @media(max-width:390px){

      .followerCard{
        flex-wrap:wrap;
      }

      .followerInformation{
        min-width:
          calc(100% - 68px);
      }

      .followerActions{
        width:100%;
      }

      .viewProfileButton{
        width:100%;
      }

    }

  </style>
</head>

<body>

  <!-- =====================================================
       PART 3 OF 6
       COMPLETE HTML PAGE STRUCTURE
  ====================================================== -->


  <!-- =====================================================
       TOP HEADER
  ====================================================== -->

  <header class="topHeader">

    <div class="topHeaderInner">

      <button
        id="backButton"
        class="backButton"
        type="button"
        aria-label="Go back"
      >
        ←
      </button>


      <div class="headerTitleArea">

        <div
          id="headerTitle"
          class="headerTitle"
        >
          Followers
        </div>

        <div class="headerSubtitle">
          Faith Connect
        </div>

      </div>


      <div class="headerIcon">
        👥
      </div>

    </div>

  </header>


  <!-- =====================================================
       MAIN PAGE
  ====================================================== -->

  <main class="pageContainer">


    <!-- =================================================
         PAGE INTRODUCTION
    ================================================== -->

    <section class="pageIntro">

      <h1 class="pageIntroTitle">
        👥 Followers
      </h1>

      <p
        id="pageIntroText"
        class="pageIntroText"
      >
        View people who follow this Faith Connect member.
      </p>

    </section>


    <!-- =================================================
         SEARCH
    ================================================== -->

    <section class="searchCard">

      <label
        class="searchLabel"
        for="searchFollowersInput"
      >
        Search followers
      </label>

      <input
        id="searchFollowersInput"
        class="searchInput"
        type="search"
        placeholder="Search by name or country..."
        autocomplete="off"
      >

    </section>


    <!-- =================================================
         LIST SUMMARY
    ================================================== -->

    <div class="listSummary">

      <h2 class="listSummaryTitle">
        People following this member
      </h2>

      <span
        id="followersTotal"
        class="listSummaryCount"
      >
        0
      </span>

    <!-- =================================================
         FOLLOWERS LIST
    ================================================== -->

    <section
      id="followersList"
      class="followersList"
      aria-live="polite"
    >

      <div class="statusCard">

        <div class="statusIcon">
          ⏳
        </div>

        <h3 class="statusTitle">

        <p class="statusText">
          Please wait while we load this member's followers.
        </p>

      </div>

    </section>

  </main>


  <!-- =====================================================
       OPEN JAVASCRIPT MODULE
  ====================================================== -->

  <script type="module">
/* =====================================================
   PART 4 OF 6
   FIREBASE, PAGE ELEMENTS, URL DATA
   AND GENERAL HELPER FUNCTIONS
===================================================== */


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import{
  auth,
  db,
  doc,
  getDoc,
  onAuthStateChanged
}from "./firebase.js";


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const backButton =
document.getElementById(
  "backButton"
);

const headerTitle =
document.getElementById(
  "headerTitle"
);

const pageIntroText =
document.getElementById(
  "pageIntroText"
);

const searchFollowersInput =
document.getElementById(
  "searchFollowersInput"
);

const followersTotal =
document.getElementById(
  "followersTotal"
);

const followersList =
document.getElementById(
  "followersList"
);


/* =====================================================
   PAGE STATE
===================================================== */

let currentUser =
null;

let profileOwner =
{};

let allFollowers =
[];

let filteredFollowers =
[];


/* =====================================================
   GET PROFILE OWNER UID
===================================================== */

const urlParameters =
new URLSearchParams(
  window.location.search
);

const memberUid =
urlParameters.get(
  "uid"
);


/* =====================================================
   HANDLE MISSING UID
===================================================== */

if(!memberUid){

  followersList.innerHTML = `

    <div class="statusCard error">

      <div class="statusIcon">
        ⚠️
      </div>

      <h3 class="statusTitle">
        Member not found
      </h3>

      <p class="statusText">
        The profile identification is missing.
      </p>

    </div>

  `;

  searchFollowersInput.disabled =
  true;

  throw new Error(
    "Missing member UID."
  );

}


/* =====================================================
   BACK BUTTON
===================================================== */

backButton.addEventListener(
  "click",
  function(){

    if(
      window.history.length > 1
    ){

      window.history.back();

    }else{

      window.location.href =
      `user-profile.html?uid=${encodeURIComponent(
        memberUid
      )}`;

    }

  }
);


/* =====================================================
   GET FIRST AVAILABLE VALUE
===================================================== */

function getFirstValue(
  ...values
){

  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value).trim();

    }

  }

  return "";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  const temporaryElement =
  document.createElement(
    "div"
  );

  temporaryElement.textContent =
  String(value || "");

  return temporaryElement.innerHTML;

}


/* =====================================================
   GET MEMBER INITIALS
===================================================== */

function getInitials(name){

  const cleanName =
  String(
    name || "Faith Member"
  ).trim();

  const nameParts =
  cleanName
  .split(/\s+/)
  .filter(Boolean);

  if(
    nameParts.length === 0
  ){

    return "F";

  }

  return nameParts
  .slice(0,2)
  .map(
    function(part){

      return part
      .charAt(0)
      .toUpperCase();

    }
  )
  .join("");

}


/* =====================================================
   SHOW LOADING STATE
===================================================== */

function showLoadingState(){

  followersList.innerHTML = `

    <div class="statusCard">

      <div class="statusIcon">
        ⏳
      </div>

      <h3 class="statusTitle">
        Loading followers
      </h3>

      <p class="statusText">
        Please wait while we load this member's followers.
      </p>

    </div>

  `;

}


/* =====================================================
   SHOW EMPTY STATE
===================================================== */

function showEmptyState(){

  followersList.innerHTML = `

    <div class="statusCard">

      <div class="statusIcon">
        👥
      </div>

      <h3 class="statusTitle">
        No followers yet
      </h3>

      <p class="statusText">
        This Faith Connect member does not have any followers yet.
      </p>

    </div>

  `;

}


/* =====================================================
   SHOW SEARCH EMPTY STATE
===================================================== */

function showSearchEmptyState(){

  followersList.innerHTML = `

    <div class="statusCard">

      <div class="statusIcon">
        🔍
      </div>

      <h3 class="statusTitle">
        No matching followers
      </h3>

      <p class="statusText">
        Try searching with another name or country.
      </p>

    </div>

  `;

}


/* =====================================================
   SHOW ERROR STATE
===================================================== */

function showErrorState(
  message
){

  followersList.innerHTML = `

    <div class="statusCard error">

      <div class="statusIcon">
        ⚠️
      </div>

      <h3 class="statusTitle">
        Followers could not load
      </h3>

      <p class="statusText">
        ${escapeHtml(
          message ||
          "Please check your internet connection and try again."
        )}
      </p>

    </div>

  `;

}


/* =====================================================
   OPEN MEMBER PROFILE
===================================================== */

function openMemberProfile(
  userId
){

  if(!userId){

    return;

  }

  window.location.href =
  `user-profile.html?uid=${encodeURIComponent(
    userId
  )}`;

}


/* =====================================================
   AUTHENTICATION
===================================================== */

onAuthStateChanged(
  auth,
  function(user){

    currentUser =
    user || null;

    loadFollowersPage();

  },
  function(error){

    console.error(
      "Authentication error:",
      error
    );

    currentUser =
    null;

    loadFollowersPage();

  }
);
/* =====================================================
   PART 5 OF 6
   LOAD PROFILE OWNER, FOLLOWER PROFILES
   AND RENDER FOLLOWER CARDS
===================================================== */


/* =====================================================
   LOAD FOLLOWERS PAGE
===================================================== */

async function loadFollowersPage(){

  showLoadingState();

  try{

    const ownerSnapshot =
    await getDoc(
      doc(
        db,
        "users",
        memberUid
      )
    );


    if(
      !ownerSnapshot.exists()
    ){

      showErrorState(
        "This member profile does not exist."
      );

      return;

    }


    profileOwner = {
      id:
      ownerSnapshot.id,

      ...ownerSnapshot.data()
    };


    const ownerName =
    getFirstValue(
      profileOwner.fullName,
      profileOwner.name,
      profileOwner.displayName,
      "Faith Connect Member"
    );


    headerTitle.textContent =
    `${ownerName}'s Followers`;


    pageIntroText.textContent =
    `View people who follow ${ownerName} on Faith Connect.`;


    const followerIds =
    Array.isArray(
      profileOwner.followers
    )
    ? profileOwner.followers
    : [];


    followersTotal.textContent =
    String(
      followerIds.length
    );


    if(
      followerIds.length === 0
    ){

      allFollowers =
      [];

      filteredFollowers =
      [];

      showEmptyState();

      return;

    }


    const followerProfiles =
    await Promise.all(

      followerIds.map(
        async function(followerId){

          try{

            const followerSnapshot =
            await getDoc(
              doc(
                db,
                "users",
                followerId
              )
            );


            if(
              !followerSnapshot.exists()
            ){

              return null;

            }


            return {

              id:
              followerSnapshot.id,

              ...followerSnapshot.data()

            };

          }catch(error){

            console.error(
              "Follower profile loading error:",
              error
            );

            return null;

          }

        }
      )

    );


    allFollowers =
    followerProfiles.filter(
      Boolean
    );


    filteredFollowers =
    [...allFollowers];


    followersTotal.textContent =
    String(
      allFollowers.length
    );


    if(
      allFollowers.length === 0
    ){

      showEmptyState();

      return;

    }


    renderFollowers();

  }catch(error){

    console.error(
      "Followers page loading error:",
      error
    );


    if(
      error?.code ===
      "permission-denied"
    ){

      showErrorState(
        "Firestore denied access to the followers information."
      );

    }else{

      showErrorState(
        "The followers could not be loaded. Please try again."
      );

    }

  }

}


/* =====================================================
   CREATE FOLLOWER CARD
===================================================== */

function createFollowerCard(
  follower
){

  const followerId =
  follower.id;


  const followerName =
  getFirstValue(
    follower.fullName,
    follower.name,
    follower.displayName,
    "Faith Connect Member"
  );


  const followerPicture =
  getFirstValue(
    follower.profilePicture,
    follower.picture,
    follower.photoURL,
    follower.photoUrl,
    "images/profile.png"
  );


  const followerCountry =
  getFirstValue(
    follower.country,
    follower.location
  );


  const followerAbout =
  getFirstValue(
    follower.about,
    follower.bio
  );


  const card =
  document.createElement(
    "article"
  );


  card.className =
  "followerCard";


  card.dataset.userId =
  followerId;


  const avatar =
  document.createElement(
    "img"
  );


  avatar.className =
  "followerAvatar";


  avatar.src =
  followerPicture;


  avatar.alt =
  `${followerName}'s profile picture`;


  avatar.loading =
  "lazy";


  avatar.addEventListener(
    "error",
    function(){

      avatar.src =
      "images/profile.png";

    },
    {
      once:true
    }
  );


  avatar.addEventListener(
    "click",
    function(){

      openMemberProfile(
        followerId
      );

    }
  );


  const information =
  document.createElement(
    "div"
  );


  information.className =
  "followerInformation";


  const nameElement =
  document.createElement(
    "div"
  );


  nameElement.className =
  "followerName";


  nameElement.textContent =
  followerName;


  nameElement.addEventListener(
    "click",
    function(){

      openMemberProfile(
        followerId
      );

    }
  );


  const countryElement =
  document.createElement(
    "div"
  );


  countryElement.className =
  "followerCountry";


  countryElement.textContent =
  followerCountry
  ? `🌍 ${followerCountry}`
  : "Faith Connect Member";


  information.appendChild(
    nameElement
  );


  information.appendChild(
    countryElement
  );


  if(followerAbout){

    const aboutElement =
    document.createElement(
      "div"
    );


    aboutElement.className =
    "followerAbout";


    aboutElement.textContent =
    followerAbout;


    information.appendChild(
      aboutElement
    );

  }


  const actions =
  document.createElement(
    "div"
  );


  actions.className =
  "followerActions";


  const viewProfileButton =
  document.createElement(
    "button"
  );


  viewProfileButton.type =
  "button";


  viewProfileButton.className =
  "viewProfileButton";


  viewProfileButton.textContent =
  "View Profile";


  viewProfileButton.addEventListener(
    "click",
    function(){

      openMemberProfile(
        followerId
      );

    }
  );


  actions.appendChild(
    viewProfileButton
  );


  card.appendChild(
    avatar
  );


  card.appendChild(
    information
  );


  card.appendChild(
    actions
  );


  return card;

}


/* =====================================================
   RENDER FOLLOWERS
===================================================== */

function renderFollowers(){

  followersList.innerHTML =
  "";


  followersTotal.textContent =
  String(
    filteredFollowers.length
  );


  if(
    filteredFollowers.length === 0
  ){

    if(
      searchFollowersInput.value.trim()
    ){

      showSearchEmptyState();

    }else{

      showEmptyState();

    }

    return;

  }


  filteredFollowers.forEach(
    function(follower){

      const followerCard =
      createFollowerCard(
        follower
      );


      followersList.appendChild(
        followerCard
      );

    }
  );

}


/* =====================================================
   SEARCH FOLLOWERS
===================================================== */

searchFollowersInput.addEventListener(
  "input",
  function(){

    const searchText =
    searchFollowersInput.value
    .trim()
    .toLowerCase();


    if(!searchText){

      filteredFollowers =
      [...allFollowers];

      renderFollowers();

      return;

    }


    filteredFollowers =
    allFollowers.filter(
      function(follower){

        const searchableName =
        getFirstValue(
          follower.fullName,
          follower.name,
          follower.displayName
        ).toLowerCase();


        const searchableCountry =
        getFirstValue(
          follower.country,
          follower.location
        ).toLowerCase();


        const searchableAbout =
        getFirstValue(
          follower.about,
          follower.bio
        ).toLowerCase();


        return (
          searchableName.includes(
            searchText
          ) ||
          searchableCountry.includes(
            searchText
          ) ||
          searchableAbout.includes(
            searchText
          )
        );

      }
    );


    renderFollowers();

  }
);
/* =====================================================
   PART 6 OF 6
   ACCESSIBILITY, PAGE CLEANUP
   AND FINAL CLOSING
===================================================== */


/* =====================================================
   KEYBOARD ACCESS FOR FOLLOWER CARDS
===================================================== */

followersList.addEventListener(
  "keydown",
  function(event){

    const followerCard =
    event.target.closest(
      ".followerCard"
    );


    if(!followerCard){

      return;

    }


    if(
      event.key !== "Enter" &&
      event.key !== " "
    ){

      return;

    }


    if(
      event.target.closest(
        "button"
      )
    ){

      return;

    }


    event.preventDefault();


    const followerId =
    followerCard.dataset.userId;


    openMemberProfile(
      followerId
    );

  }
);


/* =====================================================
   MAKE FOLLOWER CARDS KEYBOARD ACCESSIBLE
===================================================== */

function prepareFollowerCardAccessibility(){

  const followerCards =
  followersList.querySelectorAll(
    ".followerCard"
  );


  followerCards.forEach(
    function(card){

      card.setAttribute(
        "tabindex",
        "0"
      );


      card.setAttribute(
        "role",
        "link"
      );


      card.setAttribute(
        "aria-label",
        "Open member profile"
      );

    }
  );

}


/* =====================================================
   OBSERVE FOLLOWER LIST CHANGES
===================================================== */

const followersListObserver =
new MutationObserver(
  function(){

    prepareFollowerCardAccessibility();

  }
);


followersListObserver.observe(
  followersList,
  {
    childList:true
  }
);


/* =====================================================
   PROFILE IMAGE FALLBACK SAFEGUARD
===================================================== */

followersList.addEventListener(
  "error",
  function(event){

    const image =
    event.target.closest(
      ".followerAvatar"
    );


    if(!image){

      return;

    }


    image.src =
    "images/profile.png";

  },
  true
);


/* =====================================================
   CLEAR SEARCH WHEN RETURNING TO PAGE
===================================================== */

window.addEventListener(
  "pageshow",
  function(event){

    if(
      event.persisted
    ){

      searchFollowersInput.value =
      "";


      filteredFollowers =
      [...allFollowers];


      renderFollowers();

    }

  }
);


/* =====================================================
   CLEAN UP
===================================================== */

window.addEventListener(
  "pagehide",
  function(){

    followersListObserver.disconnect();

  }
);


/* =====================================================
   PAGE READY
===================================================== */

console.log(
  "Faith Connect followers page is ready."
);

</script>
