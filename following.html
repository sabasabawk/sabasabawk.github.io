<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="View people followed by a Faith Connect member."
  >

  <title>
    Following | SABASABA Gospel Ministry
  </title>

  <style>

    /* =====================================================
       PART 1 OF 6
       GENERAL PAGE AND TOP HEADER
    ===================================================== */


    /* =====================================================
       GENERAL RESET
    ===================================================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }


    :root{

      --primary:#087bd1;
      --primary-dark:#0667b1;
      --primary-light:#e9f5fd;

      --background:#eef3f8;
      --surface:#ffffff;

      --text:#1f2b34;
      --muted:#687680;

      --border:#dce4ea;

      --danger:#c84444;

      --shadow:
        0 6px 20px rgba(25,55,75,.10);

      --radius-large:22px;
      --radius-medium:16px;
      --radius-small:12px;

    }


    html{
      scroll-behavior:smooth;
    }


    body{

      min-height:100vh;

      background:var(--background);
      color:var(--text);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    button,
    input{
      font:inherit;
    }


    button{
      cursor:pointer;
    }


    a{
      color:inherit;
      text-decoration:none;
    }


    img{
      display:block;
      max-width:100%;
    }


    /* =====================================================
       TOP HEADER
    ===================================================== */

    .topHeader{

      position:sticky;
      top:0;
      z-index:1000;

      background:
        rgba(255,255,255,.96);

      border-bottom:
        1px solid var(--border);

      backdrop-filter:
        blur(12px);

    }


    .topHeaderInner{

      width:100%;
      max-width:760px;
      min-height:62px;

      margin:auto;
      padding:8px 14px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;

    }


    .backButton{

      width:42px;
      height:42px;
      flex-shrink:0;

      border:0;
      border-radius:50%;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#edf3f7;
      color:var(--text);

      font-size:23px;
      font-weight:900;

      transition:
        background .2s ease,
        transform .2s ease;

    }


    .backButton:hover{
      background:#dfeaf1;
    }


    .backButton:active{
      transform:scale(.95);
    }


    .headerTitleArea{

      min-width:0;
      flex:1;

    }


    .headerTitle{

      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      font-size:17px;
      font-weight:900;

    }


    .headerSubtitle{

      margin-top:2px;

      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      color:var(--muted);

      font-size:11px;
      font-weight:700;

    }


    .headerIcon{

      width:42px;
      height:42px;
      flex-shrink:0;

      border-radius:14px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:
        linear-gradient(
          145deg,
          var(--primary),
          #4ca9e5
        );

      color:#ffffff;

      font-size:20px;

      box-shadow:
        0 5px 14px rgba(8,123,209,.22);

    }


    /* =====================================================
       MAIN PAGE
    ===================================================== */

    .pageContainer{

      width:100%;
      max-width:760px;

      margin:auto;

      padding:
        18px
        14px
        40px;

    }


    /* =====================================================
       PAGE INTRODUCTION
    ===================================================== */

    .pageIntro{

      margin-bottom:16px;
      padding:20px;

      border-radius:var(--radius-large);

      background:
        linear-gradient(
          135deg,
          #087bd1,
          #45a9eb
        );

      color:#ffffff;

      box-shadow:
        0 8px 24px rgba(8,123,209,.22);

    }


    .pageIntroTitle{

      font-size:23px;
      font-weight:900;

    }


    .pageIntroText{

      margin-top:7px;

      font-size:12px;
      line-height:1.55;

      opacity:.93;

    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media(max-width:520px){

      .pageContainer{
        padding-left:10px;
        padding-right:10px;
      }

      .pageIntro{
        padding:17px;
      }

      .pageIntroTitle{
        font-size:21px;
      }

    }

  </style>
  <style>

    /* =====================================================
       PART 2 OF 6
       SEARCH BOX, FOLLOWING CARDS,
       LOADING AND EMPTY STATES
    ===================================================== */


    /* =====================================================
       SEARCH AREA
    ===================================================== */

    .searchCard{

      margin-bottom:16px;
      padding:14px;

      border:1px solid var(--border);
      border-radius:var(--radius-medium);

      background:var(--surface);

      box-shadow:var(--shadow);

    }


    .searchLabel{

      display:block;
      margin-bottom:8px;

      color:var(--muted);

      font-size:11px;
      font-weight:800;

    }


    .searchInput{

      width:100%;
      min-height:46px;

      padding:11px 13px;

      border:1px solid var(--border);
      border-radius:13px;

      background:#ffffff;
      color:var(--text);

      outline:none;

      font-size:14px;

      transition:
        border-color .2s ease,
        box-shadow .2s ease;

    }


    .searchInput:focus{

      border-color:var(--primary);

      box-shadow:
        0 0 0 3px rgba(8,123,209,.12);

    }


    /* =====================================================
       FOLLOWING COUNT BAR
    ===================================================== */

    .listSummary{

      margin-bottom:14px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;

    }


    .listSummaryTitle{

      font-size:16px;
      font-weight:900;

    }


    .listSummaryCount{

      min-width:34px;
      min-height:28px;

      padding:5px 10px;

      border-radius:999px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:var(--primary-light);
      color:var(--primary);

      font-size:11px;
      font-weight:900;

    }


    /* =====================================================
       FOLLOWING LIST
    ===================================================== */

    .followingList{

      display:flex;
      flex-direction:column;
      gap:12px;

    }


    /* =====================================================
       FOLLOWING MEMBER CARD
    ===================================================== */

    .followingCard{

      padding:13px;

      border:1px solid var(--border);
      border-radius:var(--radius-medium);

      display:flex;
      align-items:center;
      gap:12px;

      background:var(--surface);

      box-shadow:
        0 4px 14px rgba(30,60,80,.07);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;

    }


    .followingCard:hover{

      transform:translateY(-2px);

      border-color:#b8d8ec;

      box-shadow:
        0 8px 20px rgba(30,60,80,.11);

    }


    .followingAvatar{

      width:56px;
      height:56px;
      flex-shrink:0;

      border-radius:50%;

      object-fit:cover;

      background:#dfe7ec;

      border:3px solid #d8efff;

      cursor:pointer;

    }


    .followingInformation{

      min-width:0;
      flex:1;

    }


    .followingName{

      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      color:var(--text);

      font-size:15px;
      font-weight:900;

      cursor:pointer;

    }


    .followingName:hover{

      color:var(--primary);
      text-decoration:underline;

    }


    .followingCountry{

      margin-top:4px;

      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      color:var(--muted);

      font-size:11px;
      font-weight:700;

    }


    .followingAbout{

      margin-top:5px;

      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:2;

      overflow:hidden;

      color:#53616b;

      font-size:11px;
      line-height:1.4;

    }


    /* =====================================================
       CARD ACTIONS
    ===================================================== */

    .followingActions{

      flex-shrink:0;

      display:flex;
      align-items:center;
      gap:7px;

    }


    .viewProfileButton{

      min-height:38px;
      padding:8px 11px;

      border:0;
      border-radius:11px;

      background:var(--primary);
      color:#ffffff;

      font-size:10px;
      font-weight:900;

      transition:
        background .2s ease,
        transform .2s ease;

    }


    .viewProfileButton:hover{
      background:var(--primary-dark);
    }


    .viewProfileButton:active{
      transform:scale(.96);
    }


    /* =====================================================
       STATUS CARD
    ===================================================== */

    .statusCard{

      padding:28px 18px;

      border:1px solid var(--border);
      border-radius:var(--radius-medium);

      background:var(--surface);

      text-align:center;

      box-shadow:var(--shadow);

    }


    .statusIcon{

      margin-bottom:10px;

      font-size:31px;

    }


    .statusTitle{

      font-size:16px;
      font-weight:900;

    }


    .statusText{

      max-width:440px;
      margin:7px auto 0;

      color:var(--muted);

      font-size:12px;
      line-height:1.55;

    }


    .statusCard.error{

      border-color:#efc8c8;

      background:#fdecec;
      color:#a52f2f;

    }


    /* =====================================================
       HIDDEN ELEMENT
    ===================================================== */

    .hidden{
      display:none !important;
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media(max-width:520px){

      .followingCard{
        align-items:flex-start;
      }

      .followingAvatar{
        width:52px;
        height:52px;
      }

      .followingActions{
        align-self:center;
      }

      .viewProfileButton{
        padding-left:9px;
        padding-right:9px;
      }

    }


    @media(max-width:390px){

      .followingCard{
        flex-wrap:wrap;
      }

      .followingInformation{
        min-width:
          calc(100% - 68px);
      }

      .followingActions{
        width:100%;
      }

      .viewProfileButton{
        width:100%;
      }

    }

  </style>
</head>

<body>

  <!-- =====================================================
       PART 3 OF 6
       COMPLETE HTML PAGE STRUCTURE
  ====================================================== -->


  <!-- =====================================================
       TOP HEADER
  ====================================================== -->

  <header class="topHeader">

    <div class="topHeaderInner">

      <button
        id="backButton"
        class="backButton"
        type="button"
        aria-label="Go back"
      >
        ←
      </button>


      <div class="headerTitleArea">

        <div
          id="headerTitle"
          class="headerTitle"
        >
          Following
        </div>

        <div class="headerSubtitle">
          Faith Connect
        </div>

      </div>


      <div class="headerIcon">
        ➕
      </div>

    </div>

  </header>


  <!-- =====================================================
       MAIN PAGE
  ====================================================== -->

  <main class="pageContainer">


    <!-- =================================================
         PAGE INTRODUCTION
    ================================================== -->

    <section class="pageIntro">

      <h1 class="pageIntroTitle">
        ➕ Following
      </h1>

      <p
        id="pageIntroText"
        class="pageIntroText"
      >
        View people followed by this Faith Connect member.
      </p>

    </section>


    <!-- =================================================
         SEARCH
    ================================================== -->

    <section class="searchCard">

      <label
        class="searchLabel"
        for="searchFollowingInput"
      >
        Search following
      </label>

      <input
        id="searchFollowingInput"
        class="searchInput"
        type="search"
        placeholder="Search by name or country..."
        autocomplete="off"
      >

    </section>


    <!-- =================================================
         LIST SUMMARY
    ================================================== -->

    <div class="listSummary">

      <h2 class="listSummaryTitle">
        People this member follows
      </h2>

      <span
        id="followingTotal"
        class="listSummaryCount"
      >
        0
      </span>

    </div>


    <!-- =================================================
         FOLLOWING LIST
    ================================================== -->

    <section
      id="followingList"
      class="followingList"
      aria-live="polite"
    >

      <div class="statusCard">

        <div class="statusIcon">
          ⏳
        </div>

        <h3 class="statusTitle">
          Loading following
        </h3>

        <p class="statusText">
          Please wait while we load the people this member follows.
        </p>

      </div>

    </section>

  </main>


  <!-- =====================================================
       OPEN JAVASCRIPT MODULE
  ====================================================== -->

  <script type="module">
/* =====================================================
   PART 4 OF 6
   FIREBASE, PAGE ELEMENTS, URL DATA
   AND GENERAL HELPER FUNCTIONS
===================================================== */


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import{
  auth,
  db,
  doc,
  getDoc,
  onAuthStateChanged
}from "./firebase.js";


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const backButton =
document.getElementById(
  "backButton"
);

const headerTitle =
document.getElementById(
  "headerTitle"
);

const pageIntroText =
document.getElementById(
  "pageIntroText"
);

const searchFollowingInput =
document.getElementById(
  "searchFollowingInput"
);

const followingTotal =
document.getElementById(
  "followingTotal"
);

const followingList =
document.getElementById(
  "followingList"
);


/* =====================================================
   PAGE STATE
===================================================== */

let currentUser =
null;

let profileOwner =
{};

let allFollowing =
[];

let filteredFollowing =
[];


/* =====================================================
   GET PROFILE OWNER UID
===================================================== */

const urlParameters =
new URLSearchParams(
  window.location.search
);

const memberUid =
urlParameters.get(
  "uid"
);


/* =====================================================
   HANDLE MISSING UID
===================================================== */

if(!memberUid){

  followingList.innerHTML = `

    <div class="statusCard error">

      <div class="statusIcon">
        ⚠️
      </div>

      <h3 class="statusTitle">
        Member not found
      </h3>

      <p class="statusText">
        The profile identification is missing.
      </p>

    </div>

  `;

  searchFollowingInput.disabled =
  true;

  throw new Error(
    "Missing member UID."
  );

}


/* =====================================================
   BACK BUTTON
===================================================== */

backButton.addEventListener(
  "click",
  function(){

    if(
      window.history.length > 1
    ){

      window.history.back();

    }else{

      window.location.href =
      `user-profile.html?uid=${encodeURIComponent(
        memberUid
      )}`;

    }

  }
);


/* =====================================================
   GET FIRST AVAILABLE VALUE
===================================================== */

function getFirstValue(
  ...values
){

  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value).trim();

    }

  }

  return "";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  const temporaryElement =
  document.createElement(
    "div"
  );

  temporaryElement.textContent =
  String(value || "");

  return temporaryElement.innerHTML;

}


/* =====================================================
   SHOW LOADING STATE
===================================================== */

function showLoadingState(){

  followingList.innerHTML = `

    <div class="statusCard">

      <div class="statusIcon">
        ⏳
      </div>

      <h3 class="statusTitle">
        Loading following
      </h3>

      <p class="statusText">
        Please wait while we load the people this member follows.
      </p>

    </div>

  `;

}


/* =====================================================
   SHOW EMPTY STATE
===================================================== */

function showEmptyState(){

  followingList.innerHTML = `

    <div class="statusCard">

      <div class="statusIcon">
        ➕
      </div>

      <h3 class="statusTitle">
        Not following anyone yet
      </h3>

      <p class="statusText">
        This Faith Connect member is not following anyone yet.
      </p>

    </div>

  `;

}


/* =====================================================
   SHOW SEARCH EMPTY STATE
===================================================== */

function showSearchEmptyState(){

  followingList.innerHTML = `

    <div class="statusCard">

      <div class="statusIcon">
        🔍
      </div>

      <h3 class="statusTitle">
        No matching members
      </h3>

      <p class="statusText">
        Try searching with another name or country.
      </p>

    </div>

  `;

}


/* =====================================================
   SHOW ERROR STATE
===================================================== */

function showErrorState(
  message
){

  followingList.innerHTML = `

    <div class="statusCard error">

      <div class="statusIcon">
        ⚠️
      </div>

      <h3 class="statusTitle">
        Following list could not load
      </h3>

      <p class="statusText">
        ${escapeHtml(
          message ||
          "Please check your internet connection and try again."
        )}
      </p>

    </div>

  `;

}


/* =====================================================
   OPEN MEMBER PROFILE
===================================================== */

function openMemberProfile(
  userId
){

  if(!userId){

    return;

  }

  window.location.href =
  `user-profile.html?uid=${encodeURIComponent(
    userId
  )}`;

}


/* =====================================================
   AUTHENTICATION
===================================================== */

onAuthStateChanged(
  auth,
  function(user){

    currentUser =
    user || null;

    loadFollowingPage();

  },
  function(error){

    console.error(
      "Authentication error:",
      error
    );

    currentUser =
    null;

    loadFollowingPage();

  }
);
/* =====================================================
   PART 5 OF 6
   LOAD PROFILE OWNER, FOLLOWING PROFILES
   AND RENDER FOLLOWING CARDS
===================================================== */


/* =====================================================
   LOAD FOLLOWING PAGE
===================================================== */

async function loadFollowingPage(){

  showLoadingState();

  try{

    const ownerSnapshot =
    await getDoc(
      doc(
        db,
        "users",
        memberUid
      )
    );


    if(
      !ownerSnapshot.exists()
    ){

      showErrorState(
        "This member profile does not exist."
      );

      return;

    }


    profileOwner = {
      id:
      ownerSnapshot.id,

      ...ownerSnapshot.data()
    };


    const ownerName =
    getFirstValue(
      profileOwner.fullName,
      profileOwner.name,
      profileOwner.displayName,
      "Faith Connect Member"
    );


    headerTitle.textContent =
    `${ownerName}'s Following`;


    pageIntroText.textContent =
    `View people followed by ${ownerName} on Faith Connect.`;


    const followingIds =
    Array.isArray(
      profileOwner.following
    )
    ? profileOwner.following
    : [];


    followingTotal.textContent =
    String(
      followingIds.length
    );


    if(
      followingIds.length === 0
    ){

      allFollowing =
      [];

      filteredFollowing =
      [];

      showEmptyState();

      return;

    }


    const followingProfiles =
    await Promise.all(

      followingIds.map(
        async function(followingId){

          try{

            const followingSnapshot =
            await getDoc(
              doc(
                db,
                "users",
                followingId
              )
            );


            if(
              !followingSnapshot.exists()
            ){

              return null;

            }


            return {

              id:
              followingSnapshot.id,

              ...followingSnapshot.data()

            };

          }catch(error){

            console.error(
              "Following profile loading error:",
              error
            );

            return null;

          }

        }
      )

    );


    allFollowing =
    followingProfiles.filter(
      Boolean
    );


    filteredFollowing =
    [...allFollowing];


    followingTotal.textContent =
    String(
      allFollowing.length
    );


    if(
      allFollowing.length === 0
    ){

      showEmptyState();

      return;

    }


    renderFollowing();

  }catch(error){

    console.error(
      "Following page loading error:",
      error
    );


    if(
      error?.code ===
      "permission-denied"
    ){

      showErrorState(
        "Firestore denied access to the following information."
      );

    }else{

      showErrorState(
        "The following list could not be loaded. Please try again."
      );

    }

  }

}


/* =====================================================
   CREATE FOLLOWING CARD
===================================================== */

function createFollowingCard(
  followingMember
){

  const followingId =
  followingMember.id;


  const followingName =
  getFirstValue(
    followingMember.fullName,
    followingMember.name,
    followingMember.displayName,
    "Faith Connect Member"
  );


  const followingPicture =
  getFirstValue(
    followingMember.profilePicture,
    followingMember.picture,
    followingMember.photoURL,
    followingMember.photoUrl,
    "images/profile.png"
  );


  const followingCountry =
  getFirstValue(
    followingMember.country,
    followingMember.location
  );


  const followingAbout =
  getFirstValue(
    followingMember.about,
    followingMember.bio
  );


  const card =
  document.createElement(
    "article"
  );


  card.className =
  "followingCard";


  card.dataset.userId =
  followingId;


  const avatar =
  document.createElement(
    "img"
  );


  avatar.className =
  "followingAvatar";


  avatar.src =
  followingPicture;


  avatar.alt =
  `${followingName}'s profile picture`;


  avatar.loading =
  "lazy";


  avatar.addEventListener(
    "error",
    function(){

      avatar.src =
      "images/profile.png";

    },
    {
      once:true
    }
  );


  avatar.addEventListener(
    "click",
    function(){

      openMemberProfile(
        followingId
      );

    }
  );


  const information =
  document.createElement(
    "div"
  );


  information.className =
  "followingInformation";


  const nameElement =
  document.createElement(
    "div"
  );


  nameElement.className =
  "followingName";


  nameElement.textContent =
  followingName;


  nameElement.addEventListener(
    "click",
    function(){

      openMemberProfile(
        followingId
      );

    }
  );


  const countryElement =
  document.createElement(
    "div"
  );


  countryElement.className =
  "followingCountry";


  countryElement.textContent =
  followingCountry
  ? `🌍 ${followingCountry}`
  : "Faith Connect Member";


  information.appendChild(
    nameElement
  );


  information.appendChild(
    countryElement
  );


  if(followingAbout){

    const aboutElement =
    document.createElement(
      "div"
    );


    aboutElement.className =
    "followingAbout";


    aboutElement.textContent =
    followingAbout;


    information.appendChild(
      aboutElement
    );

  }


  const actions =
  document.createElement(
    "div"
  );


  actions.className =
  "followingActions";


  const viewProfileButton =
  document.createElement(
    "button"
  );


  viewProfileButton.type =
  "button";


  viewProfileButton.className =
  "viewProfileButton";


  viewProfileButton.textContent =
  "View Profile";


  viewProfileButton.addEventListener(
    "click",
    function(){

      openMemberProfile(
        followingId
      );

    }
  );


  actions.appendChild(
    viewProfileButton
  );


  card.appendChild(
    avatar
  );


  card.appendChild(
    information
  );


  card.appendChild(
    actions
  );


  return card;

}


/* =====================================================
   RENDER FOLLOWING
===================================================== */

function renderFollowing(){

  followingList.innerHTML =
  "";


  followingTotal.textContent =
  String(
    filteredFollowing.length
  );


  if(
    filteredFollowing.length === 0
  ){

    if(
      searchFollowingInput.value.trim()
    ){

      showSearchEmptyState();

    }else{

      showEmptyState();

    }

    return;

  }


  filteredFollowing.forEach(
    function(followingMember){

      const followingCard =
      createFollowingCard(
        followingMember
      );


      followingList.appendChild(
        followingCard
      );

    }
  );

}


/* =====================================================
   SEARCH FOLLOWING
===================================================== */

searchFollowingInput.addEventListener(
  "input",
  function(){

    const searchText =
    searchFollowingInput.value
    .trim()
    .toLowerCase();


    if(!searchText){

      filteredFollowing =
      [...allFollowing];

      renderFollowing();

      return;

    }


    filteredFollowing =
    allFollowing.filter(
      function(followingMember){

        const searchableName =
        getFirstValue(
          followingMember.fullName,
          followingMember.name,
          followingMember.displayName
        ).toLowerCase();


        const searchableCountry =
        getFirstValue(
          followingMember.country,
          followingMember.location
        ).toLowerCase();


        const searchableAbout =
        getFirstValue(
          followingMember.about,
          followingMember.bio
        ).toLowerCase();


        return (
          searchableName.includes(
            searchText
          ) ||
          searchableCountry.includes(
            searchText
          ) ||
          searchableAbout.includes(
            searchText
          )
        );

      }
    );


    renderFollowing();

  }
);
/* =====================================================
   PART 6 OF 6
   ACCESSIBILITY, IMAGE FALLBACK,
   PAGE CLEANUP AND FINAL CLOSING
===================================================== */


/* =====================================================
   KEYBOARD ACCESS FOR FOLLOWING CARDS
===================================================== */

followingList.addEventListener(
  "keydown",
  function(event){

    const followingCard =
    event.target.closest(
      ".followingCard"
    );


    if(!followingCard){

      return;

    }


    if(
      event.key !== "Enter" &&
      event.key !== " "
    ){

      return;

    }


    if(
      event.target.closest(
        "button"
      )
    ){

      return;

    }


    event.preventDefault();


    const followingId =
    followingCard.dataset.userId;


    openMemberProfile(
      followingId
    );

  }
);


/* =====================================================
   MAKE FOLLOWING CARDS KEYBOARD ACCESSIBLE
===================================================== */

function prepareFollowingCardAccessibility(){

  const followingCards =
  followingList.querySelectorAll(
    ".followingCard"
  );


  followingCards.forEach(
    function(card){

      card.setAttribute(
        "tabindex",
        "0"
      );


      card.setAttribute(
        "role",
        "link"
      );


      card.setAttribute(
        "aria-label",
        "Open member profile"
      );

    }
  );

}


/* =====================================================
   OBSERVE FOLLOWING LIST CHANGES
===================================================== */

const followingListObserver =
new MutationObserver(
  function(){

    prepareFollowingCardAccessibility();

  }
);


followingListObserver.observe(
  followingList,
  {
    childList:true
  }
);


/* =====================================================
   PROFILE IMAGE FALLBACK SAFEGUARD
===================================================== */

followingList.addEventListener(
  "error",
  function(event){

    const image =
    event.target.closest(
      ".followingAvatar"
    );


    if(!image){

      return;

    }


    image.src =
    "images/profile.png";

  },
  true
);


/* =====================================================
   CLEAR SEARCH WHEN RETURNING TO PAGE
===================================================== */

window.addEventListener(
  "pageshow",
  function(event){

    if(
      event.persisted
    ){

      searchFollowingInput.value =
      "";


      filteredFollowing =
      [...allFollowing];


      renderFollowing();

    }

  }
);


/* =====================================================
   CLEAN UP
===================================================== */

window.addEventListener(
  "pagehide",
  function(){

    followingListObserver.disconnect();

  }
);


/* =====================================================
   PAGE READY
===================================================== */

console.log(
  "Faith Connect following page is ready."
);

</script>
