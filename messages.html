<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Messages | SABASABA Gospel Ministry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.header{
background:#0066cc;
color:white;
padding:25px;
border-radius:18px;
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:32px;
margin-bottom:10px;
}

.header p{
font-size:17px;
}

.search{
margin-bottom:20px;
}

.search input{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

.chat-list{
display:flex;
flex-direction:column;
gap:15px;
}

.chat-card{
display:flex;
align-items:center;
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
cursor:pointer;
transition:.3s;
}

.chat-card:hover{
transform:translateY(-3px);
}

.avatar{
width:60px;
height:60px;
border-radius:50%;
background:#0066cc;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
margin-right:15px;
}

.chat-info{
flex:1;
}

.chat-info h3{
color:#0066cc;
margin-bottom:5px;
}

.chat-info p{
color:#666;
font-size:15px;
}

.time{
font-size:13px;
color:gray;
}

.new-chat{
position:fixed;
bottom:25px;
right:25px;
width:65px;
height:65px;
border-radius:50%;
border:none;
background:#0066cc;
color:white;
font-size:34px;
cursor:pointer;
box-shadow:0 5px 12px rgba(0,0,0,.25);
}

.new-chat:hover{
background:#004d99;
}

.back{
text-align:center;
margin-top:30px;
}

.back button{
background:#0066cc;
color:white;
padding:12px 24px;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
}

.back button:hover{
background:#004d99;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>💬 Private Messages</h1>

<p>Chat privately with other believers.</p>

</div>

<div class="search">

<input
type="text"
placeholder="Search conversations...">

</div>

<div class="chat-list">

<div class="chat-card">

<div class="avatar">
👤
</div>

<div class="chat-info">

<h3>No conversations yet</h3>

<p>Your private chats will appear here.</p>

</div>

<div class="time">
--
</div>

</div>

</div>

<button
class="new-chat"
onclick="window.location.href='search.html'">

+

</button>

<div class="back">

<a href="community.html">

<button>

⬅ Back to Community

</button>

</a>

</div>

</div>

</body>
</html>
