<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Private Messages | SABASABA Gospel Ministry
</title>

<style>

/* =====================================================
   FACEBOOK-STYLE EDGE-TO-EDGE CLEAN DESIGN
===================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f0f2f5;
color:#050505;
min-height:100vh;
}

.container{
max-width:680px;
margin:auto;
padding:0 0 110px 0;
}

.brandLabel{
color:#1877f2;
font-weight:bold;
font-size:11px;
letter-spacing:.5px;
text-transform:uppercase;
margin-bottom:2px;
}

.header{
background:#ffffff;
color:#050505;
padding:16px 14px;
border-bottom:1px solid #e4e6eb;
text-align:left;
box-shadow:none;
border-radius:0;
}

.header h1{
font-size:20px;
margin-bottom:2px;
color:#050505;
}

.header p{
font-size:13px;
color:#65676b;
line-height:1.4;
}

#messageBadge{
background:#e41e3f;
color:white;
border-radius:50px;
padding:2px 6px;
font-size:11px;
display:none;
margin-left:6px;
vertical-align:middle;
}

.search{
background:#ffffff;
padding:10px 12px;
border-bottom:1px solid #e4e6eb;
margin-bottom:0;
}

.search input{
width:100%;
padding:10px 16px;
border-radius:20px;
border:none;
font-size:15px;
outline:none;
background:#f0f2f5;
color:#050505;
}

.search input:focus{
background:#e4e6eb;
}

.status-message{
display:none;
text-align:center;
padding:12px;
margin:10px;
border-radius:8px;
background:#fff3cd;
color:#765d00;
font-size:13px;
}

.chat-list{
display:flex;
flex-direction:column;
background:#ffffff;
}

.chat-card{
display:flex;
align-items:center;
gap:12px;
background:white;
padding:12px 14px;
border-bottom:1px solid #e4e6eb;
border-radius:0;
box-shadow:none;
cursor:pointer;
transition:background .2s;
position:relative;
}

.chat-card:hover{
background:#f2f4f7;
transform:none;
box-shadow:none;
}

.chat-card:active{
background:#e4e6eb;
transform:none;
}

.avatar-wrapper{
width:48px;
height:48px;
min-width:48px;
position:relative;
}

.avatar{
width:48px;
height:48px;
border-radius:50%;
background:#e5e9ed;
color:#65676b;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
overflow:hidden;
border:none;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.online-dot{
position:absolute;
right:0;
bottom:0;
width:12px;
height:12px;
border-radius:50%;
background:#8b9aaa;
border:2px solid white;
}

.online-dot.online{
background:#31a24c;
}

.chat-info{
flex:1;
min-width:0;
}

.chat-name-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
}

.chat-info h3{
color:#050505;
font-size:15px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.chat-message{
color:#65676b;
font-size:13px;
margin-top:2px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
max-width:100%;
}

.chat-message.unread{
font-weight:bold;
color:#050505;
}

.chat-side{
display:flex;
flex-direction:column;
align-items:flex-end;
gap:4px;
min-width:50px;
}

.time{
font-size:11px;
color:#65676b;
white-space:nowrap;
}

.unread-badge{
display:none;
min-width:18px;
height:18px;
padding:0 5px;
border-radius:20px;
background:#0084ff;
color:white;
font-size:11px;
font-weight:bold;
align-items:center;
justify-content:center;
}

.empty-card{
background:white;
padding:40px 20px;
border-radius:0;
text-align:center;
box-shadow:none;
border-bottom:1px solid #e4e6eb;
}

.empty-icon{
width:64px;
height:64px;
margin:0 auto 12px;
border-radius:50%;
background:#f0f2f5;
color:#65676b;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}

.empty-card h3{
color:#050505;
font-size:17px;
margin-bottom:6px;
}

.empty-card p{
color:#65676b;
font-size:13px;
line-height:1.4;
max-width:320px;
margin:0 auto;
}

.loading{
background:white;
padding:30px;
border-radius:0;
text-align:center;
color:#65676b;
box-shadow:none;
border-bottom:1px solid #e4e6eb;
font-size:14px;
}

.new-chat{
position:fixed;
bottom:20px;
right:16px;
width:52px;
height:52px;
border-radius:50%;
border:none;
background:#1877f2;
color:white;
font-size:26px;
line-height:1;
cursor:pointer;
box-shadow:0 4px 12px rgba(0,0,0,.25);
z-index:20;
transition:transform .2s;
display:flex;
align-items:center;
justify-content:center;
}

.new-chat:hover{
transform:scale(1.05);
}

.new-chat:active{
transform:scale(.95);
}

.back{
text-align:center;
margin:20px 14px 0;
}

.back-button{
display:inline-block;
background:#ffffff;
color:#050505;
padding:10px 20px;
border:1px solid #ccd0d5;
border-radius:8px;
font-size:14px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
transition:background .2s;
}

.back-button:hover{
background:#f0f2f5;
}

@media(max-width:600px){

.container{
padding:0;
padding-bottom:100px;
}

.header{
padding:12px;
}

.header h1{
font-size:18px;
}

.chat-card{
padding:10px 12px;
}

.avatar-wrapper,
.avatar{
width:44px;
height:44px;
min-width:44px;
}

.chat-info h3{
font-size:14px;
}

.new-chat{
width:48px;
height:48px;
right:12px;
bottom:70px;
font-size:24px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="brandLabel">Faith Connect</div>

<h1>
💬 Private Messages

<span id="messageBadge">
0
</span>

</h1>

<p>
Chat privately with other believers.
</p>

</div>

<div
class="status-message"
id="statusMessage">
</div>

<div class="search">

<input
type="search"
id="conversationSearch"
placeholder="Search conversations..."
autocomplete="off"
aria-label="Search conversations">

</div>

<div
class="chat-list"
id="chatList">

<div class="loading">
Loading your conversations...
</div>

</div>

<button
class="new-chat"
id="newChatButton"
type="button"
title="Start a new conversation"
aria-label="Start a new conversation">
+
</button>

<div class="back">

<a
href="feed.html"
class="back-button">
← Back to Community
</a>

</div>

</div>

<script type="module">

import {
auth,
db,
collection,
collectionGroup,
query,
where,
orderBy,
onSnapshot,
onAuthStateChanged,
doc,
getDoc
} from "./firebase.js";

const badge =
document.getElementById("messageBadge");

const chatList =
document.getElementById("chatList");

const searchInput =
document.getElementById("conversationSearch");

const statusMessage =
document.getElementById("statusMessage");

const newChatButton =
document.getElementById("newChatButton");

let currentUser = null;
let allConversations = [];
let unsubscribeConversations = null;
let unsubscribeUnreadMessages = null;

let authGeneration = 0;

newChatButton.addEventListener("click",()=>{
window.location.href="findmembers.html";
});

function showStatus(message){
statusMessage.textContent=message;
statusMessage.style.display="block";
}

function hideStatus(){
statusMessage.textContent="";
statusMessage.style.display="none";
}

function escapeHTML(value){
return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function formatTime(timestamp){
if(!timestamp){
return "";
}
let date;
if(typeof timestamp.toDate==="function"){
date=timestamp.toDate();
}else{
date=new Date(timestamp);
}
if(Number.isNaN(date.getTime())){
return "";
}
const now=new Date();
const sameDay=
date.toDateString()===now.toDateString();
if(sameDay){
return date.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});
}
const yesterday=new Date();
yesterday.setDate(now.getDate()-1);
if(date.toDateString()===yesterday.toDateString()){
return "Yesterday";
}
return date.toLocaleDateString([],{
day:"numeric",
month:"short"
});
}

function isUserOnline(profile){
return profile.online===true ||
profile.isOnline===true ||
String(profile.status || "").toLowerCase()==="online";
}

function getLastMessagePreview(conversationData){
const textPreview=
conversationData.lastMessage ||
conversationData.lastMessageText;
if(textPreview){
return textPreview;
}
const mediaType=
String(conversationData.lastMessageType || "").toLowerCase();
if(mediaType==="image"){
return "📷 Picture";
}
if(mediaType==="video"){
return "🎥 Video";
}
if(mediaType==="audio" || mediaType==="voice"){
return "🎤 Voice message";
}
if(mediaType==="file"){
return "📄 Document";
}
return "Tap to open conversation";
}

function showEmptyState(searching=false){
chatList.innerHTML=`
<div class="empty-card">
<div class="empty-icon">
💬
</div>
<h3>
${searching
? "No matching conversations"
: "No conversations yet"}
</h3>
<p>
${searching
? "Try searching for a different name or message."
: "Tap the blue + button to find a believer and start a private conversation."}
</p>
</div>
`;
}

function renderConversations(conversations){
chatList.innerHTML="";
if(conversations.length===0){
showEmptyState(searchInput.value.trim()!=="");
return;
}

for(const conversation of conversations){
const {
uid,
name,
photo,
online,
lastMessage,
time,
unreadCount
}=conversation;

const safeUid=encodeURIComponent(uid);
const safeName=escapeHTML(name);
const safePhoto=escapeHTML(photo);
const safeMessage=escapeHTML(
lastMessage || "Tap to open conversation"
);

const photoHTML=safePhoto
? `<img src="${safePhoto}" alt="${safeName}"
onerror="this.style.display='none';
this.parentElement.textContent='👤';">`
: "👤";

const card=document.createElement("div");
card.className="chat-card";
card.setAttribute("role","button");
card.setAttribute("tabindex","0");

card.innerHTML=`
<div class="avatar-wrapper">
<div class="avatar">
${photoHTML}
</div>
<span class="online-dot ${online ? "online" : ""}">
</span>
</div>
<div class="chat-info">
<div class="chat-name-row">
<h3>
${safeName}
</h3>
</div>
<p class="chat-message ${unreadCount > 0 ? "unread" : ""}">
${safeMessage}
</p>
</div>
<div class="chat-side">
<span class="time">
${escapeHTML(time)}
</span>
<span
class="unread-badge"
style="${unreadCount > 0 ? "display:flex;" : ""}">
${unreadCount > 99 ? "99+" : unreadCount}
</span>
</div>
`;

const openChat=()=>{
window.location.href=
`chat.html?uid=${safeUid}`;
};

card.addEventListener("click",openChat);
card.addEventListener("keydown",(event)=>{
if(event.key==="Enter" || event.key===" "){
event.preventDefault();
openChat();
}
});

chatList.appendChild(card);
}
}

function applySearch(){
const term=
searchInput.value
.trim()
.toLowerCase();
if(!term){
renderConversations(allConversations);
return;
}
const filtered=
allConversations.filter(conversation=>{
return conversation.name
.toLowerCase()
.includes(term) ||
String(conversation.lastMessage || "")
.toLowerCase()
.includes(term);
});
renderConversations(filtered);
}

searchInput.addEventListener(
"input",
applySearch
);

async function buildConversations(
conversationsSnapshot,
unreadSnapshot
){
const unreadCounts=new Map();
unreadSnapshot.forEach(messageDoc=>{
const conversationId=
messageDoc.ref.parent.parent?.id;
if(!conversationId){
return;
}
const previous=
unreadCounts.get(conversationId) || 0;
unreadCounts.set(
conversationId,
previous+1
);
});

const conversations=[];
for(const conversationDoc of conversationsSnapshot.docs){
const data=conversationDoc.data();
const conversationId=conversationDoc.id;

const participants=
Array.isArray(data.participants)
? data.participants
: [];

const otherUid=
participants.find(
uid=>uid!==currentUser.uid
);

if(!otherUid){
continue;
}

let onlineStatus=false;
let profilePhoto="";
let profileName="";

try{
const userSnapshot=
await getDoc(doc(db,"users",otherUid));
if(userSnapshot.exists()){
const profile=userSnapshot.data();
onlineStatus=isUserOnline(profile);
profilePhoto=
profile.photoURL ||
profile.photoUrl ||
profile.profilePicture ||
profile.profilePic ||
profile.profileImage ||
profile.avatar ||
profile.photo ||
"";
profileName=
profile.displayName ||
profile.name ||
profile.fullName ||
"";
}
}catch(error){
console.error(
"Could not load profile for:",
otherUid,
error
);
}

const name=
profileName ||
data.participantNames?.[otherUid] ||
"Community Member";

const photo=
profilePhoto ||
data.participantPictures?.[otherUid] ||
"";

conversations.push({
uid:otherUid,
name,
photo,
online:onlineStatus,
lastMessage:
getLastMessagePreview(data),
time:formatTime(data.updatedAt),
timestamp:
data.updatedAt?.toMillis?.() ||
new Date(data.updatedAt || 0).getTime(),
unreadCount:
unreadCounts.get(conversationId) || 0
});
}

conversations.sort(
(a,b)=>b.timestamp-a.timestamp
);

allConversations=conversations;

const totalUnread=
conversations.reduce(
(total,item)=>total+item.unreadCount,
0
);

if(totalUnread>0){
badge.style.display="inline-block";
badge.textContent=
totalUnread>99 ? "99+" : totalUnread;
}else{
badge.style.display="none";
badge.textContent="0";
}

applySearch();
}

onAuthStateChanged(auth,(user)=>{
authGeneration += 1;
const thisGeneration = authGeneration;

if(unsubscribeConversations){
unsubscribeConversations();
}

if(unsubscribeUnreadMessages){
unsubscribeUnreadMessages();
}

if(!user){
currentUser=null;
allConversations=[];
badge.style.display="none";
chatList.innerHTML=`
<div class="empty-card">
<div class="empty-icon">
🔒
</div>
<h3>
Please sign in
</h3>
<p>
You must sign in before using private messages.
</p>
</div>
`;
showStatus(
"Please sign in to view your private conversations."
);
return;
}

hideStatus();
currentUser=user;

let latestConversationsSnapshot=null;
let latestUnreadSnapshot=null;

const refreshConversations=()=>{
if(
latestConversationsSnapshot &&
latestUnreadSnapshot
){
buildConversations(
latestConversationsSnapshot,
latestUnreadSnapshot
).catch(error=>{
console.error(
"Conversation loading error:",
error
);
showStatus(
"Some conversations could not be loaded."
);
});
}
};

const conversationsQuery=query(
collection(db,"conversations"),
where("participants","array-contains",user.uid),
orderBy("updatedAt","desc")
);

unsubscribeConversations=
onSnapshot(
conversationsQuery,
(snapshot)=>{
if(thisGeneration !== authGeneration){
return;
}
latestConversationsSnapshot=snapshot;
hideStatus();
refreshConversations();
},
(error)=>{
if(thisGeneration !== authGeneration){
return;
}
console.error(
"Conversations listener error:",
error
);
chatList.innerHTML=`
<div class="empty-card">
<div class="empty-icon">
⚠️
</div>
<h3>
Messages could not be loaded
</h3>
<p>
Please check your internet connection and Firebase permissions.
</p>
</div>
`;
showStatus(
"Unable to load private messages."
);
}
);

const unreadMessagesQuery=query(
collectionGroup(db,"messages"),
where("receiverId","==",user.uid),
where("read","==",false)
);

unsubscribeUnreadMessages=
onSnapshot(
unreadMessagesQuery,
(snapshot)=>{
if(thisGeneration !== authGeneration){
return;
}
latestUnreadSnapshot=snapshot;
refreshConversations();
},
(error)=>{
if(thisGeneration !== authGeneration){
return;
}
console.warn(
"Unread-message listener error:",
error
);
latestUnreadSnapshot={
forEach(){
},
docs:[]
};
refreshConversations();
}
);
});

</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then((registration) => {
          console.log('Service Worker registered successfully:', registration.scope);
        })
        .catch((error) => {
          console.error('Service Worker registration failed:', error);
        });
    });
  }
</script>

</body>
</html>
