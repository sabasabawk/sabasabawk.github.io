<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Private Messages | SABASABA Gospel Ministry
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
color:#222;
min-height:100vh;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
padding-bottom:120px;
}

.header{
background:#0066cc;
color:white;
padding:28px 20px;
border-radius:18px;
text-align:center;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,102,204,.18);
}

.header h1{
font-size:32px;
margin-bottom:10px;
}

.header p{
font-size:17px;
line-height:1.5;
}

#messageBadge{
background:#e60023;
color:white;
border-radius:50px;
padding:4px 9px;
font-size:14px;
display:none;
margin-left:6px;
vertical-align:middle;
}

.search{
margin-bottom:20px;
}

.search input{
width:100%;
padding:15px 16px;
border-radius:12px;
border:1px solid #c8c8c8;
font-size:16px;
outline:none;
background:white;
}

.search input:focus{
border-color:#0066cc;
box-shadow:0 0 0 3px rgba(0,102,204,.12);
}

.status-message{
display:none;
text-align:center;
padding:12px;
margin-bottom:15px;
border-radius:10px;
background:#fff3cd;
color:#765d00;
}

.chat-list{
display:flex;
flex-direction:column;
gap:14px;
}
.chat-card{
display:flex;
align-items:center;
gap:13px;
background:white;
padding:14px;
border-radius:16px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
cursor:pointer;
transition:transform .2s,box-shadow .2s;
position:relative;
}

.chat-card:hover{
transform:translateY(-2px);
box-shadow:0 6px 16px rgba(0,0,0,.12);
}

.chat-card:active{
transform:scale(.99);
}

.avatar-wrapper{
width:62px;
height:62px;
min-width:62px;
position:relative;
}

.avatar{
width:62px;
height:62px;
border-radius:50%;
background:#0877d1;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
overflow:hidden;
border:2px solid #e8f2ff;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.online-dot{
position:absolute;
right:1px;
bottom:2px;
width:16px;
height:16px;
border-radius:50%;
background:#a5a5a5;
border:3px solid white;
}

.online-dot.online{
background:#18b653;
}

.chat-info{
flex:1;
min-width:0;
}

.chat-name-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.chat-info h3{
color:#0066cc;
font-size:18px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.chat-message{
color:#666;
font-size:15px;
margin-top:5px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
max-width:100%;
}

.chat-message.unread{
font-weight:bold;
color:#222;
}

.chat-side{
display:flex;
flex-direction:column;
align-items:flex-end;
gap:8px;
min-width:55px;
}

.time{
font-size:12px;
color:#777;
white-space:nowrap;
}

.unread-badge{
display:none;
min-width:23px;
height:23px;
padding:0 7px;
border-radius:20px;
background:#e60023;
color:white;
font-size:12px;
font-weight:bold;
align-items:center;
justify-content:center;
}

.empty-card{
background:white;
padding:30px 20px;
border-radius:18px;
text-align:center;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.empty-icon{
width:85px;
height:85px;
margin:0 auto 15px;
border-radius:50%;
background:#0877d1;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
}

.empty-card h3{
color:#0066cc;
font-size:21px;
margin-bottom:8px;
}

.empty-card p{
color:#666;
font-size:16px;
line-height:1.5;
}

.loading{
background:white;
padding:25px;
border-radius:16px;
text-align:center;
color:#666;
box-shadow:0 3px 12px rgba(0,0,0,.07);
}
.new-chat{
position:fixed;
bottom:25px;
right:25px;
width:66px;
height:66px;
border-radius:50%;
border:none;
background:#0066cc;
color:white;
font-size:38px;
line-height:1;
cursor:pointer;
box-shadow:0 6px 17px rgba(0,0,0,.28);
z-index:20;
transition:.2s;
}

.new-chat:hover{
background:#004d99;
transform:scale(1.05);
}

.new-chat:active{
transform:scale(.95);
}

.back{
text-align:center;
margin-top:30px;
}

.back-button{
display:inline-block;
background:#0066cc;
color:white;
padding:13px 25px;
border:none;
border-radius:11px;
font-size:17px;
cursor:pointer;
text-decoration:none;
}

.back-button:hover{
background:#004d99;
}

@media(max-width:600px){

.container{
padding:16px;
padding-bottom:115px;
}

.header{
padding:26px 15px;
}

.header h1{
font-size:30px;
}

.chat-card{
padding:13px 11px;
}

.avatar-wrapper,
.avatar{
width:58px;
height:58px;
min-width:58px;
}

.chat-info h3{
font-size:17px;
}

.new-chat{
width:64px;
height:64px;
right:20px;
bottom:22px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>
💬 Private Messages

<span id="messageBadge">
0
</span>

</h1>

<p>
Chat privately with other believers.
</p>

</div>

<div
class="status-message"
id="statusMessage">
</div>

<div class="search">

<input
type="search"
id="conversationSearch"
placeholder="Search conversations..."
autocomplete="off"
aria-label="Search conversations">

</div>

<div
class="chat-list"
id="chatList">

<div class="loading">
Loading your conversations...
</div>

</div>

<button
class="new-chat"
id="newChatButton"
type="button"
title="Start a new conversation"
aria-label="Start a new conversation">
+
</button>

<div class="back">

<a
href="feed.html"
class="back-button">
← Back to Community
</a>

</div>

</div>
<script type="module">

/*
   FIX: this page used to query a flat top-level
   "messages" collection with senderId/receiverId
   fields — but chat.html actually saves every
   message under conversations/{conversationId}/messages,
   and keeps a running summary (last message, names,
   pictures, timestamps) on the conversation document
   itself. Because of that mismatch, this inbox could
   only ever show empty or stale results, even while
   people were actively chatting in chat.html.

   This version reads from the same structure
   chat.html actually writes to:
   - The conversation list comes from the
     "conversations" collection (one doc per
     conversation, already kept up to date by
     chat.html's updateConversationSummary()).
   - Unread counts come from a collection-group query
     across every conversation's "messages"
     subcollection, grouped back to its parent
     conversation ID.

   NOTE: collectionGroup queries require an import
   from firebase.js. If firebase.js does not already
   re-export "collectionGroup" from the Firebase SDK,
   add it there — otherwise the unread-count listener
   below will fail (the conversation list itself does
   not depend on it and will still work).
*/

import {
auth,
db,
collection,
collectionGroup,
query,
where,
orderBy,
onSnapshot,
onAuthStateChanged,
doc,
getDoc
} from "./firebase.js";

const badge =
document.getElementById("messageBadge");

const chatList =
document.getElementById("chatList");

const searchInput =
document.getElementById("conversationSearch");

const statusMessage =
document.getElementById("statusMessage");

const newChatButton =
document.getElementById("newChatButton");

let currentUser = null;
let allConversations = [];
let unsubscribeConversations = null;
let unsubscribeUnreadMessages = null;

newChatButton.addEventListener("click",()=>{
window.location.href="findmembers.html";
});

function showStatus(message){

statusMessage.textContent=message;
statusMessage.style.display="block";

}

function hideStatus(){

statusMessage.textContent="";
statusMessage.style.display="none";

}

function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function formatTime(timestamp){

if(!timestamp){
return "";
}

let date;

if(typeof timestamp.toDate==="function"){
date=timestamp.toDate();
}else{
date=new Date(timestamp);
}

if(Number.isNaN(date.getTime())){
return "";
}

const now=new Date();

const sameDay=
date.toDateString()===now.toDateString();

if(sameDay){

return date.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});

}

const yesterday=new Date();
yesterday.setDate(now.getDate()-1);

if(date.toDateString()===yesterday.toDateString()){
return "Yesterday";
}

return date.toLocaleDateString([],{
day:"numeric",
month:"short"
});

}

function isUserOnline(profile){

return profile.online===true ||
profile.isOnline===true ||
String(profile.status || "").toLowerCase()==="online";

}

/*
   Turns a conversation's stored last-message fields
   (written by chat.html's updateConversationSummary)
   into the same kind of preview text the old version
   showed, including a friendly label when the last
   message was media rather than text.
*/
function getLastMessagePreview(conversationData){

const textPreview=
conversationData.lastMessage ||
conversationData.lastMessageText;

if(textPreview){
return textPreview;
}

const mediaType=
String(conversationData.lastMessageType || "").toLowerCase();

if(mediaType==="image"){
return "📷 Picture";
}

if(mediaType==="video"){
return "🎥 Video";
}

if(mediaType==="audio" || mediaType==="voice"){
return "🎤 Voice message";
}

if(mediaType==="file"){
return "📄 Document";
}

return "Tap to open conversation";

}

function showEmptyState(searching=false){

chatList.innerHTML=`

<div class="empty-card">

<div class="empty-icon">
💬
</div>

<h3>
${searching
? "No matching conversations"
: "No conversations yet"}
</h3>

<p>
${searching
? "Try searching for a different name or message."
: "Tap the blue + button to find a believer and start a private conversation."}
</p>

</div>

`;

}

function renderConversations(conversations){

chatList.innerHTML="";

if(conversations.length===0){

showEmptyState(searchInput.value.trim()!=="");
return;

}

for(const conversation of conversations){

const {
uid,
name,
photo,
online,
lastMessage,
time,
unreadCount
}=conversation;

const safeUid=encodeURIComponent(uid);
const safeName=escapeHTML(name);
const safePhoto=escapeHTML(photo);
const safeMessage=escapeHTML(
lastMessage || "Tap to open conversation"
);

const photoHTML=safePhoto
? `<img src="${safePhoto}" alt="${safeName}"
onerror="this.style.display='none';
this.parentElement.textContent='👤';">`
: "👤";

const card=document.createElement("div");

card.className="chat-card";
card.setAttribute("role","button");
card.setAttribute("tabindex","0");

card.innerHTML=`

<div class="avatar-wrapper">

<div class="avatar">
${photoHTML}
</div>

<span class="online-dot ${online ? "online" : ""}">
</span>

</div>

<div class="chat-info">

<div class="chat-name-row">

<h3>
${safeName}
</h3>

</div>

<p class="chat-message ${unreadCount > 0 ? "unread" : ""}">
${safeMessage}
</p>

</div>

<div class="chat-side">

<span class="time">
${escapeHTML(time)}
</span>

<span
class="unread-badge"
style="${unreadCount > 0 ? "display:flex;" : ""}">
${unreadCount > 99 ? "99+" : unreadCount}
</span>

</div>

`;

const openChat=()=>{

window.location.href=
`chat.html?uid=${safeUid}`;

};

card.addEventListener("click",openChat);

card.addEventListener("keydown",(event)=>{

if(event.key==="Enter" || event.key===" "){
event.preventDefault();
openChat();
}

});

chatList.appendChild(card);

}

}

function applySearch(){

const term=
searchInput.value
.trim()
.toLowerCase();

if(!term){

renderConversations(allConversations);
return;

}

const filtered=
allConversations.filter(conversation=>{

return conversation.name
.toLowerCase()
.includes(term) ||

String(conversation.lastMessage || "")
.toLowerCase()
.includes(term);

});

renderConversations(filtered);

}

searchInput.addEventListener(
"input",
applySearch
);

/*
   Builds the inbox list from:
   - conversationsSnapshot: one doc per conversation
     the current user is part of, already containing
     the other member's name/picture and the last
     message (kept current by chat.html).
   - unreadSnapshot: every unread message addressed to
     the current user, across every conversation's
     "messages" subcollection (a collection-group
     query), used only to compute the per-conversation
     unread badge count.
*/
async function buildConversations(
conversationsSnapshot,
unreadSnapshot
){

const unreadCounts=new Map();

unreadSnapshot.forEach(messageDoc=>{

/*
   Each message lives at
   conversations/{conversationId}/messages/{messageId},
   so its conversation ID is the grandparent
   document's ID.
*/

const conversationId=
messageDoc.ref.parent.parent?.id;

if(!conversationId){
return;
}

const previous=
unreadCounts.get(conversationId) || 0;

unreadCounts.set(
conversationId,
previous+1
);

});

const conversations=[];

for(const conversationDoc of conversationsSnapshot.docs){

const data=conversationDoc.data();
const conversationId=conversationDoc.id;

const participants=
Array.isArray(data.participants)
? data.participants
: [];

const otherUid=
participants.find(
uid=>uid!==currentUser.uid
);

if(!otherUid){
continue;
}

let onlineStatus=false;

try{

const userSnapshot=
await getDoc(doc(db,"users",otherUid));

if(userSnapshot.exists()){

onlineStatus=
isUserOnline(userSnapshot.data());

}

}catch(error){

console.error(
"Could not load online status for:",
otherUid,
error
);

}

const name=
data.participantNames?.[otherUid] ||
"Community Member";

const photo=
data.participantPictures?.[otherUid] ||
"";

conversations.push({

uid:otherUid,

name,

photo,

online:onlineStatus,

lastMessage:
getLastMessagePreview(data),

time:formatTime(data.updatedAt),

timestamp:
data.updatedAt?.toMillis?.() ||
new Date(data.updatedAt || 0).getTime(),

unreadCount:
unreadCounts.get(conversationId) || 0

});

}

/*
   The Firestore query below already orders by
   updatedAt, but this keeps the list correctly
   sorted even while unread counts are still
   arriving from the second listener.
*/
conversations.sort(
(a,b)=>b.timestamp-a.timestamp
);

allConversations=conversations;

const totalUnread=
conversations.reduce(
(total,item)=>total+item.unreadCount,
0
);

if(totalUnread>0){

badge.style.display="inline-block";

badge.textContent=
totalUnread>99 ? "99+" : totalUnread;

}else{

badge.style.display="none";
badge.textContent="0";

}

applySearch();

}

onAuthStateChanged(auth,(user)=>{

if(unsubscribeConversations){
unsubscribeConversations();
}

if(unsubscribeUnreadMessages){
unsubscribeUnreadMessages();
}

if(!user){

currentUser=null;
allConversations=[];

badge.style.display="none";

chatList.innerHTML=`

<div class="empty-card">

<div class="empty-icon">
🔒
</div>

<h3>
Please sign in
</h3>

<p>
You must sign in before using private messages.
</p>

</div>

`;

showStatus(
"Please sign in to view your private conversations."
);

return;
}

hideStatus();

currentUser=user;

let latestConversationsSnapshot=null;
let latestUnreadSnapshot=null;

const refreshConversations=()=>{

if(
latestConversationsSnapshot &&
latestUnreadSnapshot
){

buildConversations(
latestConversationsSnapshot,
latestUnreadSnapshot
).catch(error=>{

console.error(
"Conversation loading error:",
error
);

showStatus(
"Some conversations could not be loaded."
);

});

}

};

/*
   One document per conversation the current user
   is part of — this is what chat.html keeps up to
   date every time a message is sent.
*/
const conversationsQuery=query(
collection(db,"conversations"),
where("participants","array-contains",user.uid),
orderBy("updatedAt","desc")
);

unsubscribeConversations=
onSnapshot(
conversationsQuery,
(snapshot)=>{

latestConversationsSnapshot=snapshot;
refreshConversations();

},
(error)=>{

console.error(
"Conversations listener error:",
error
);

chatList.innerHTML=`

<div class="empty-card">

<div class="empty-icon">
⚠️
</div>

<h3>
Messages could not be loaded
</h3>

<p>
Please check your internet connection and Firebase permissions.
</p>

</div>

`;

showStatus(
"Unable to load private messages."
);

}
);

/*
   Collection-group query across every
   conversation's "messages" subcollection, for
   messages addressed to the current user that are
   still unread. If this requires a Firestore index,
   Firebase will log a direct link to create it in
   the browser console.
*/
const unreadMessagesQuery=query(
collectionGroup(db,"messages"),
where("receiverId","==",user.uid),
where("read","==",false)
);

unsubscribeUnreadMessages=
onSnapshot(
unreadMessagesQuery,
(snapshot)=>{

latestUnreadSnapshot=snapshot;
refreshConversations();

},
(error)=>{

console.warn(
"Unread-message listener error:",
error
);

/*
   Continue showing conversations even when the
   unread query needs a Firebase index or when
   collectionGroup is not yet exported from
   firebase.js.
*/
latestUnreadSnapshot={
forEach(){
},
docs:[]
};

refreshConversations();

}
);

});

</script>

</body>
</html>
