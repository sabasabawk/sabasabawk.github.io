<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Photos | Sabasaba Gospel Ministry</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .photos-header {
            background: #ffffff;
            padding: 16px;
            border-bottom: 1px solid #dddddd;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .photos-header h1 {
            margin: 0;
            font-size: 22px;
        }

        .photos-header p {
            margin: 5px 0 0;
            color: #666666;
            font-size: 14px;
        }

        .photos-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
        }
    </style>
</head>

<body>

    <header class="photos-header">
        <h1>Ministry Photos</h1>
        <p>Pictures shared on the Community Wall</p>
    </header>

    <main class="photos-container">

        <section id="photosGallery" class="photos-gallery">
            <!-- Picture posts will appear here -->
        </section>

        <p id="photosMessage" class="photos-message">
            Loading photos...
        </p>

    </main>

</body>
</html>
