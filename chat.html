<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="description"
content="Private Christian messaging for SABASABA Gospel Ministry"
>

<title>
Private Chat | SABASABA Gospel Ministry
</title>
<style>

/* =====================================================
   GENERAL RESET
===================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
width:100%;
height:100%;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#eef3f8;
display:flex;
flex-direction:column;
overflow:hidden;
}


/* =====================================================
   CHAT HEADER
===================================================== */

.chat-header{
display:flex;
align-items:center;
gap:13px;
padding:14px 16px;
background:#0066cc;
color:#ffffff;
box-shadow:0 2px 8px rgba(0,0,0,.15);
z-index:10;
}

.back-button{
width:44px;
height:44px;
border:none;
border-radius:50%;
background:rgba(255,255,255,.18);
color:#ffffff;
font-size:25px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
flex-shrink:0;
}

.back-button:hover{
background:rgba(255,255,255,.3);
}

.chat-avatar{
width:58px;
height:58px;
border-radius:50%;
object-fit:cover;
background:#ffffff;
border:2px solid rgba(255,255,255,.85);
flex-shrink:0;
}

.chat-header-info{
flex:1;
min-width:0;
}

.chat-name{
font-size:21px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.chat-status{
margin-top:4px;
font-size:13px;
color:#dcecff;
}


/* =====================================================
   MESSAGE AREA
===================================================== */

.chat-area{
flex:1;
overflow-y:auto;
display:flex;
flex-direction:column;
padding:18px 14px 28px;
background:#f5f7fb;
scroll-behavior:smooth;
}

.empty-message{
margin:auto;
padding:30px 20px;
text-align:center;
color:#777777;
font-size:17px;
line-height:1.6;
}


/* =====================================================
   MESSAGE ROWS
===================================================== */

.message-row{
width:100%;
display:flex;
margin:7px 0;
}

.mine-row{
justify-content:flex-end;
}

.other-row{
justify-content:flex-start;
}


/* =====================================================
   MESSAGE BUBBLES
===================================================== */

.message-bubble{
position:relative;
max-width:78%;
padding:12px 15px 8px;
border-radius:17px;
font-size:16px;
line-height:1.45;
word-wrap:break-word;
overflow-wrap:anywhere;
box-shadow:0 1px 4px rgba(0,0,0,.1);
}

.mine{
background:#0066cc;
color:#ffffff;
border-bottom-right-radius:5px;
padding-right:42px;
}

.other{
background:#e5e5ea;
color:#111111;
border-bottom-left-radius:5px;
padding-right:42px;
}

.message-text{
white-space:pre-wrap;
}

.message-time{
display:block;
margin-top:6px;
font-size:11px;
opacity:.72;
text-align:right;
}


/* =====================================================
   THREE-DOT MESSAGE MENU
===================================================== */

.message-menu-button{
position:absolute;
top:5px;
right:7px;
width:29px;
height:29px;
border:none;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
cursor:pointer;
}

.mine .message-menu-button{
background:rgba(255,255,255,.18);
color:#ffffff;
}

.other .message-menu-button{
background:rgba(0,0,0,.07);
color:#333333;
}

.message-menu-button:hover{
opacity:.8;
}

.message-menu{
display:none;
position:absolute;
top:39px;
right:6px;
min-width:175px;
padding:6px;
background:#ffffff;
border-radius:11px;
box-shadow:0 6px 20px rgba(0,0,0,.22);
z-index:30;
}

.message-menu.show{
display:block;
}

.message-option{
width:100%;
padding:10px 12px;
border:none;
border-radius:7px;
background:#ffffff;
font-size:14px;
font-weight:bold;
text-align:left;
cursor:pointer;
}

.delete-for-me{
color:#555555;
}

.delete-for-everyone{
color:#d93025;
}

.message-option:hover{
background:#f2f4f7;
}


/* =====================================================
   INPUT AREA
===================================================== */

.input-area{
display:flex;
align-items:center;
gap:10px;
padding:11px 13px;
background:#ffffff;
border-top:1px solid #d9e0e8;
box-shadow:0 -2px 8px rgba(0,0,0,.05);
}

.message-input{
flex:1;
min-width:0;
padding:13px 17px;
border:1px solid #c7d0da;
border-radius:25px;
font-size:16px;
outline:none;
}

.message-input:focus{
border-color:#0066cc;
box-shadow:0 0 0 3px rgba(0,102,204,.12);
}

.send-button{
padding:12px 21px;
border:none;
border-radius:25px;
background:#0066cc;
color:#ffffff;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.send-button:hover{
background:#004f9e;
}

.send-button:disabled{
background:#8ba8c5;
cursor:not-allowed;
}


/* =====================================================
   MOBILE DESIGN
===================================================== */

@media(max-width:600px){

.chat-header{
padding:12px;
gap:10px;
}

.back-button{
width:42px;
height:42px;
}

.chat-avatar{
width:54px;
height:54px;
}

.chat-name{
font-size:19px;
}

.chat-area{
padding:16px 10px 24px;
}

.message-bubble{
max-width:84%;
font-size:16px;
}

.input-area{
padding:10px;
}

.send-button{
padding:12px 17px;
}

}
/button>

</footer>
/* =====================================================
   EMOJI PICKER
===================================================== */

.input-area{
position:relative;
}

.emoji-button{
width:44px;
height:44px;
border:none;
border-radius:50%;
background:#eef3f8;
font-size:23px;
cursor:pointer;
flex-shrink:0;
}

.emoji-button:hover{
background:#dde7f1;
}

.emoji-picker{
display:none;
position:absolute;
left:10px;
bottom:68px;
width:260px;
max-height:220px;
overflow-y:auto;
padding:10px;
background:#ffffff;
border:1px solid #d9e0e8;
border-radius:14px;
box-shadow:0 8px 24px rgba(0,0,0,.18);
z-index:50;
grid-template-columns:repeat(6,1fr);
gap:7px;
}

.emoji-picker.show{
display:grid;
}

.emoji-picker button{
border:none;
background:#f4f6f8;
border-radius:8px;
font-size:24px;
padding:7px;
cursor:pointer;
}

.emoji-picker button:hover{
background:#e4ebf2;
}
</style>

</head>
<body>

<!-- =====================================================
     CHAT HEADER
===================================================== -->

<header class="chat-header">

<button
type="button"
id="backButton"
class="back-button"
aria-label="Back to private messages"
>
←
</button>

<img
id="chatAvatar"
class="chat-avatar"
src="images/profile.png"
alt="Member profile picture"
>

<div class="chat-header-info">

<div
id="chatName"
class="chat-name"
>
Loading...
</div>

<div
id="chatStatus"
class="chat-status"
>
Private Christian conversation
</div>

</div>

</header>


<!-- =====================================================
     MESSAGE AREA
===================================================== -->

<main
id="chatArea"
class="chat-area"
>

<div class="empty-message">

No messages yet.<br>

Start your Christian conversation.

</div>

</main>


<!-- =====================================================
     MESSAGE INPUT AREA
===================================================== -->

<footer class="input-area">

<button
id="emojiButton"
class="emoji-button"
type="button"
aria-label="Open emoji picker"
>
😊
</button>

<div
id="emojiPicker"
class="emoji-picker"
>
<button type="button">😀</button>
<button type="button">😁</button>
<button type="button">😂</button>
<button type="button">😊</button>
<button type="button">😍</button>
<button type="button">🥰</button>
<button type="button">😇</button>
<button type="button">🙏</button>
<button type="button">❤️</button>
<button type="button">👍</button>
<button type="button">👏</button>
<button type="button">🔥</button>
<button type="button">🎉</button>
<button type="button">💪</button>
<button type="button">📖</button>
<button type="button">✝️</button>
</div>

<input
id="messageInput"
class="message-input"
type="text"
maxlength="2000"
placeholder="Type your message..."
autocomplete="off"
aria-label="Type your message"
>

<button
id="sendButton"
class="send-button"
type="button"
>
Send
</button>

</footer>

<script type="module">
/* =====================================================
   PART 3 OF 6
   FIREBASE SETUP
===================================================== */

import{
auth,
db,
collection,
doc,
getDoc,
addDoc,
setDoc,
query,
orderBy,
onSnapshot,
serverTimestamp,
deleteDoc,
updateDoc,
arrayUnion,
onAuthStateChanged
}
from "./firebase.js";


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const backButton =
document.getElementById("backButton");

const chatAvatar =
document.getElementById("chatAvatar");

const chatName =
document.getElementById("chatName");

const chatStatus =
document.getElementById("chatStatus");

const chatArea =
document.getElementById("chatArea");

const messageInput =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendButton");


/* =====================================================
   VARIABLES
===================================================== */

const params =
new URLSearchParams(window.location.search);

const otherUid =
params.get("uid");

let currentUser = null;

let unsubscribeMessages = null;

let sendingMessage = false;


/* =====================================================
   CHECK URL
===================================================== */

if(!otherUid){

alert("Chat member not found.");

window.location.href =
"privatemessages.html";

}


/* =====================================================
   BACK BUTTON
===================================================== */

backButton.onclick=function(){

window.location.href=
"privatemessages.html";

};


/* =====================================================
   LOAD MEMBER
===================================================== */

async function loadMember(){

try{

const memberSnap =
await getDoc(
doc(db,"users",otherUid)
);

if(!memberSnap.exists()){

chatName.textContent =
"Unknown Member";

chatStatus.textContent =
"Profile unavailable";

return;

}

const member =
memberSnap.data();

chatName.textContent =
member.fullName ||
member.name ||
member.displayName ||
"Community Member";

chatAvatar.src =
member.profilePicture ||
member.profileImage ||
member.picture ||
member.photoURL ||
"images/profile.png";

chatAvatar.onerror=function(){

chatAvatar.src=
"images/profile.png";

};

chatStatus.textContent =
"Private Christian conversation";

}catch(error){

console.error(error);

chatName.textContent =
"Community Member";

chatStatus.textContent =
"Private Christian conversation";

}

}


/* =====================================================
   LOGIN
===================================================== */

onAuthStateChanged(
auth,
async(user)=>{

if(!user){

window.location.href=
"login.html";

return;

}

currentUser=user;

await loadMember();

loadMessages();

}
);
/* =====================================================
   PART 4 OF 6
   LOAD AND DISPLAY MESSAGES
===================================================== */


/* =====================================================
   FORMAT MESSAGE TIME
===================================================== */

function formatMessageTime(timestamp){

if(!timestamp){
return "Sending...";
}

const date =
timestamp.toDate
? timestamp.toDate()
: new Date(timestamp);

return date.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

}


/* =====================================================
   CLOSE ALL MESSAGE MENUS
===================================================== */

function closeAllMessageMenus(){

document
.querySelectorAll(".message-menu.show")
.forEach((menu)=>{

menu.classList.remove("show");

});

}


/* =====================================================
   CREATE ONE MESSAGE
===================================================== */

function createMessageElement(
messageDocument
){

const messageData =
messageDocument.data();

const messageId =
messageDocument.id;

const isMine =
messageData.senderId === currentUser.uid;


/* MESSAGE ROW */

const messageRow =
document.createElement("div");

messageRow.className =
isMine
? "message-row mine-row"
: "message-row other-row";


/* MESSAGE BUBBLE */

const messageBubble =
document.createElement("div");

messageBubble.className =
isMine
? "message-bubble mine"
: "message-bubble other";


/* MESSAGE TEXT */

const messageText =
document.createElement("div");

messageText.className =
"message-text";

messageText.textContent =
messageData.message || "";

messageBubble.appendChild(
messageText
);


/* MESSAGE TIME */

const messageTime =
document.createElement("span");

messageTime.className =
"message-time";

messageTime.textContent =
formatMessageTime(
messageData.timestamp
);

messageBubble.appendChild(
messageTime
);


/* =====================================================
   MESSAGE MENU BUTTON
===================================================== */

const menuButton =
document.createElement("button");

menuButton.type =
"button";

menuButton.className =
"message-menu-button";

menuButton.textContent =
"⋮";

menuButton.setAttribute(
"aria-label",
"Message options"
);


/* =====================================================
   MESSAGE MENU
===================================================== */

const messageMenu =
document.createElement("div");

messageMenu.className =
"message-menu";


/* =====================================================
   DELETE FOR ME
===================================================== */

const deleteForMeButton =
document.createElement("button");

deleteForMeButton.type =
"button";

deleteForMeButton.className =
"message-option delete-for-me";

deleteForMeButton.textContent =
"🗑 Delete for me";

deleteForMeButton.addEventListener(
"click",
function(event){

event.stopPropagation();

messageMenu.classList.remove(
"show"
);

confirmDeleteForMe(
messageId
);

}
);

messageMenu.appendChild(
deleteForMeButton
);


/* =====================================================
   DELETE FOR EVERYONE
   ONLY FOR MY OWN MESSAGE
===================================================== */

if(isMine){

const deleteForEveryoneButton =
document.createElement("button");

deleteForEveryoneButton.type =
"button";

deleteForEveryoneButton.className =
"message-option delete-for-everyone";

deleteForEveryoneButton.textContent =
"🗑 Delete for everyone";

deleteForEveryoneButton.addEventListener(
"click",
function(event){

event.stopPropagation();

messageMenu.classList.remove(
"show"
);

confirmDeleteForEveryone(
messageId,
messageData
);

}
);

messageMenu.appendChild(
deleteForEveryoneButton
);

}


/* =====================================================
   OPEN MESSAGE MENU
===================================================== */

menuButton.addEventListener(
"click",
function(event){

event.stopPropagation();

const isOpen =
messageMenu.classList.contains(
"show"
);

closeAllMessageMenus();

if(!isOpen){

messageMenu.classList.add(
"show"
);

}

}
);


/* ADD MENU TO MESSAGE */

messageBubble.appendChild(
menuButton
);

messageBubble.appendChild(
messageMenu
);


/* ADD MESSAGE TO ROW */

messageRow.appendChild(
messageBubble
);

return messageRow;

}


/* =====================================================
   LOAD REAL-TIME MESSAGES
===================================================== */

function loadMessages(){

if(unsubscribeMessages){

unsubscribeMessages();

}

const messagesQuery =
query(
collection(db,"messages"),
orderBy("timestamp","asc")
);

unsubscribeMessages =
onSnapshot(
messagesQuery,
(snapshot)=>{

chatArea.innerHTML = "";

let foundMessage =
false;

snapshot.forEach(
(messageDocument)=>{

const messageData =
messageDocument.data();


/* CHECK WHETHER MESSAGE BELONGS TO THIS CHAT */

const belongsToThisChat =

(
messageData.senderId === currentUser.uid &&
messageData.receiverId === otherUid
)

||

(
messageData.senderId === otherUid &&
messageData.receiverId === currentUser.uid
);


/* CHECK WHETHER USER DELETED IT FOR THEMSELVES */

const deletedFor =
Array.isArray(messageData.deletedFor)
? messageData.deletedFor
: [];

const deletedForCurrentUser =
deletedFor.includes(
currentUser.uid
);


if(
!belongsToThisChat ||
deletedForCurrentUser
){

return;

}

foundMessage =
true;

const messageElement =
createMessageElement(
messageDocument
);

chatArea.appendChild(
messageElement
);

}
);


/* EMPTY CHAT */

if(!foundMessage){

chatArea.innerHTML = `
<div class="empty-message">
No messages yet.<br>
Start your Christian conversation.
</div>
`;

}


/* AUTO-SCROLL */

requestAnimationFrame(
()=>{

chatArea.scrollTop =
chatArea.scrollHeight;

}
);

},
(error)=>{

console.error(
"Message loading error:",
error
);

chatArea.innerHTML = `
<div class="empty-message">
Messages could not be loaded.<br>
Please check your internet connection.
</div>
`;

}
);

}


/* =====================================================
   CLOSE MENU WHEN CLICKING ELSEWHERE
===================================================== */

document.addEventListener(
"click",
function(){

closeAllMessageMenus();

}
);
/* =====================================================
   PART 5 OF 6
   DELETE MESSAGE FUNCTIONS
===================================================== */


/* =====================================================
   DELETE FOR ME
   Hides the message only from the current user
===================================================== */

function confirmDeleteForMe(messageId){

const confirmed =
confirm(
"Delete this message only from your chat?"
);

if(!confirmed){
return;
}

deleteMessageForMe(
messageId
);

}


async function deleteMessageForMe(messageId){

if(!currentUser){
return;
}

try{

const messageReference =
doc(
db,
"messages",
messageId
);

await updateDoc(
messageReference,
{
deletedFor:arrayUnion(
currentUser.uid
)
}
);

}catch(error){

console.error(
"Delete for me error:",
error
);

alert(
"Message could not be deleted. Please try again."
);

}

}


/* =====================================================
   DELETE FOR EVERYONE
   Only the sender may completely delete the message
===================================================== */

function confirmDeleteForEveryone(
messageId,
messageData
){

if(!currentUser){
return;
}

if(
messageData.senderId !== currentUser.uid
){

alert(
"You can only delete your own messages for everyone."
);

return;

}

const confirmed =
confirm(
"Delete this message for everyone?"
);

if(!confirmed){
return;
}

deleteMessageForEveryone(
messageId,
messageData
);

}


async function deleteMessageForEveryone(
messageId,
messageData
){

if(!currentUser){
return;
}

if(
messageData.senderId !== currentUser.uid
){

alert(
"You are not allowed to delete this message for everyone."
);

return;

}

try{

await deleteDoc(
doc(
db,
"messages",
messageId
)
);

}catch(error){

console.error(
"Delete for everyone error:",
error
);

alert(
"Message could not be deleted for everyone. Please try again."
);

}

}


/* =====================================================
   UPDATE CONVERSATION SUMMARY
   Used after sending a new message
===================================================== */

async function updateConversationSummary(
senderId,
receiverId,
messageText
){

const conversationId =
[senderId,receiverId]
.sort()
.join("_");

const conversationReference =
doc(
db,
"conversations",
conversationId
);

await setDoc(
conversationReference,
{
participants:[
senderId,
receiverId
],

lastMessage:
messageText,

lastSenderId:
senderId,

updatedAt:
serverTimestamp()
},
{
merge:true
}
);

}


/* =====================================================
   CREATE RECEIVER NOTIFICATION
===================================================== */

async function createMessageNotification(
receiverId,
messageText
){

try{

await addDoc(
collection(
db,
"notifications"
),
{
userId:
receiverId,

senderId:
currentUser.uid,

type:
"privateMessage",

message:
messageText,

read:
false,

createdAt:
serverTimestamp()
}
);

}catch(error){

console.error(
"Notification error:",
error
);

}

}
/* =====================================================
   PART 6 OF 6
   SEND MESSAGES
===================================================== */


/* =====================================================
   SEND ONE MESSAGE
===================================================== */

async function sendMessage(){

if(
!currentUser ||
!otherUid ||
sendingMessage
){
return;
}

const messageText =
messageInput.value.trim();

if(!messageText){
return;
}

sendingMessage = true;

sendButton.disabled = true;

messageInput.disabled = true;

try{

await addDoc(
collection(
db,
"messages"
),
{
senderId:
currentUser.uid,

receiverId:
otherUid,

message:
messageText,

timestamp:
serverTimestamp(),

deletedFor:[]
}
);

await updateConversationSummary(
currentUser.uid,
otherUid,
messageText
);

await createMessageNotification(
otherUid,
messageText
);

messageInput.value = "";

}catch(error){

console.error(
"Send message error:",
error
);

alert(
"Message could not be sent. Please check your internet connection and try again."
);

}finally{

sendingMessage = false;

sendButton.disabled = false;

messageInput.disabled = false;

messageInput.focus();

}

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.addEventListener(
"click",
sendMessage
);


/* =====================================================
   PRESS ENTER TO SEND
===================================================== */

messageInput.addEventListener(
"keydown",
function(event){

if(
event.key === "Enter" &&
!event.shiftKey
){

event.preventDefault();

sendMessage();

}

}
);


/* =====================================================
   PAGE CLEANUP
===================================================== */

window.addEventListener(
"beforeunload",
function(){

if(unsubscribeMessages){

unsubscribeMessages();

}

}
);


/* =====================================================
   FOCUS MESSAGE INPUT
===================================================== */

window.addEventListener(
"load",
function(){

messageInput.focus();

}
);
/* =====================================================
   EMOJI PICKER
===================================================== */

.input-area{
position:relative;
}

.emoji-button{
width:44px;
height:44px;
border:none;
border-radius:50%;
background:#eef3f8;
font-size:23px;
cursor:pointer;
flex-shrink:0;
}

.emoji-button:hover{
background:#dde7f1;
}

.emoji-picker{
display:none;
position:absolute;
left:10px;
bottom:68px;
width:260px;
max-height:220px;
overflow-y:auto;
padding:10px;
background:#ffffff;
border:1px solid #d9e0e8;
border-radius:14px;
box-shadow:0 8px 24px rgba(0,0,0,.18);
z-index:50;
grid-template-columns:repeat(6,1fr);
gap:7px;
}

.emoji-picker.show{
display:grid;
}

.emoji-picker button{
border:none;
background:#f4f6f8;
border-radius:8px;
font-size:24px;
padding:7px;
cursor:pointer;
}

.emoji-picker button:hover{
background:#e4ebf2;
}
</script>

</body>

</html>
