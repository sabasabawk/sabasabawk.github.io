<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<meta
name="description"
content="Private Christian messaging for SABASABA Gospel Ministry"
>

<title>
Private Chat | SABASABA Gospel Ministry
</title>

<style>

/* =====================================================
   GENERAL RESET
===================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
width:100%;
height:100%;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#eef3f8;
display:flex;
flex-direction:column;
overflow:hidden;
color:#111111;
}

button,
input{
font-family:inherit;
}


/* =====================================================
   CHAT HEADER
===================================================== */

.chat-header{
display:flex;
align-items:center;
gap:12px;
padding:12px 15px;
background:#0066cc;
color:#ffffff;
box-shadow:0 2px 8px rgba(0,0,0,.16);
z-index:20;
flex-shrink:0;
}

.back-button{
width:43px;
height:43px;
border:none;
border-radius:50%;
background:rgba(255,255,255,.18);
color:#ffffff;
font-size:25px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
flex-shrink:0;
}

.back-button:hover{
background:rgba(255,255,255,.30);
}

.avatar-wrapper{
position:relative;
flex-shrink:0;
}

.chat-avatar{
width:56px;
height:56px;
border-radius:50%;
object-fit:cover;
background:#ffffff;
border:2px solid rgba(255,255,255,.88);
display:block;
}

.online-dot{
position:absolute;
right:1px;
bottom:2px;
width:15px;
height:15px;
border-radius:50%;
background:#8b9aaa;
border:3px solid #0066cc;
}

.online-dot.online{
background:#20c66b;
}

.chat-header-info{
flex:1;
min-width:0;
}

.chat-name{
font-size:20px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.chat-status{
margin-top:4px;
font-size:13px;
color:#dcecff;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}


/* =====================================================
   CHAT AREA
===================================================== */

.chat-area{
flex:1;
overflow-y:auto;
display:flex;
flex-direction:column;
padding:16px 12px 25px;
background:#f5f7fb;
scroll-behavior:smooth;
}

.empty-message{
margin:auto;
padding:30px 20px;
text-align:center;
color:#777777;
font-size:16px;
line-height:1.6;
}

.loading-message{
margin:auto;
padding:25px;
text-align:center;
color:#666666;
font-size:16px;
}


/* =====================================================
   MESSAGE ROWS
===================================================== */

.message-row{
width:100%;
display:flex;
margin:7px 0;
}

.mine-row{
justify-content:flex-end;
}

.other-row{
justify-content:flex-start;
}


/* =====================================================
   MESSAGE BUBBLES
===================================================== */

.message-bubble{
position:relative;
max-width:78%;
padding:11px 14px 8px;
border-radius:17px;
font-size:16px;
line-height:1.45;
word-wrap:break-word;
overflow-wrap:anywhere;
box-shadow:0 1px 4px rgba(0,0,0,.10);
}

.mine{
background:#0066cc;
color:#ffffff;
border-bottom-right-radius:5px;
padding-right:42px;
}

.other{
background:#e5e5ea;
color:#111111;
border-bottom-left-radius:5px;
padding-right:42px;
}

.message-text{
white-space:pre-wrap;
}

.message-footer{
display:flex;
align-items:center;
justify-content:flex-end;
gap:5px;
margin-top:6px;
min-height:15px;
}

.message-time{
font-size:11px;
opacity:.72;
white-space:nowrap;
}

.message-status{
font-size:12px;
font-weight:bold;
line-height:1;
white-space:nowrap;
}

.status-sent{
opacity:.72;
}

.status-delivered{
opacity:.85;
}

.status-read{
color:#a8e2ff;
}


/* =====================================================
   PHOTO MESSAGE
===================================================== */

.message-image{
display:block;
width:100%;
max-width:320px;
max-height:360px;
object-fit:cover;
border-radius:12px;
cursor:pointer;
background:#dfe5eb;
}

.media-caption{
margin-top:8px;
white-space:pre-wrap;
}


/* =====================================================
   VIDEO MESSAGE
===================================================== */

.message-video-wrapper{
position:relative;
width:100%;
max-width:320px;
border-radius:12px;
overflow:hidden;
background:#000000;
cursor:pointer;
}

.message-video{
display:block;
width:100%;
max-height:360px;
background:#000000;
}

.video-open-overlay{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.12);
pointer-events:none;
}

.video-play-icon{
width:58px;
height:58px;
border-radius:50%;
background:rgba(0,0,0,.62);
color:#ffffff;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
padding-left:4px;
}


/* =====================================================
   VOICE MESSAGE
===================================================== */

.voice-message{
display:flex;
align-items:center;
gap:9px;
min-width:230px;
max-width:310px;
}

.voice-message audio{
width:100%;
max-width:270px;
height:42px;
}

.voice-label{
font-size:12px;
opacity:.78;
margin-top:5px;
}


/* =====================================================
   MESSAGE OPTIONS MENU
===================================================== */

.message-menu-button{
position:absolute;
top:5px;
right:7px;
width:29px;
height:29px;
border:none;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
cursor:pointer;
z-index:5;
}

.mine .message-menu-button{
background:rgba(255,255,255,.18);
color:#ffffff;
}

.other .message-menu-button{
background:rgba(0,0,0,.07);
color:#333333;
}

.message-menu-button:hover{
opacity:.82;
}

.message-menu{
display:none;
position:absolute;
top:39px;
right:6px;
min-width:185px;
padding:6px;
background:#ffffff;
border-radius:11px;
box-shadow:0 6px 20px rgba(0,0,0,.22);
z-index:40;
}

.message-menu.show{
display:block;
}

.message-option{
width:100%;
padding:11px 12px;
border:none;
border-radius:7px;
background:#ffffff;
font-size:14px;
font-weight:bold;
text-align:left;
cursor:pointer;
}

.message-option:hover{
background:#f2f4f7;
}

.delete-for-me{
color:#555555;
}

.delete-for-everyone{
color:#d93025;
}


/* =====================================================
   MEDIA PREVIEW AREA
===================================================== */

.media-preview-area{
display:none;
position:relative;
padding:10px 13px;
background:#ffffff;
border-top:1px solid #d9e0e8;
flex-shrink:0;
}

.media-preview-area.show{
display:block;
}

.preview-content{
display:flex;
align-items:center;
gap:12px;
padding:9px;
background:#f3f6f9;
border-radius:12px;
}

.preview-image{
width:85px;
height:85px;
border-radius:10px;
object-fit:cover;
background:#dde4eb;
}

.preview-video{
width:120px;
height:85px;
border-radius:10px;
object-fit:cover;
background:#000000;
}

.preview-audio{
width:100%;
max-width:300px;
}

.preview-details{
flex:1;
min-width:0;
}

.preview-type{
font-size:14px;
font-weight:bold;
color:#333333;
}

.preview-name{
margin-top:5px;
font-size:13px;
color:#6d7782;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.remove-preview-button{
position:absolute;
top:5px;
right:8px;
width:31px;
height:31px;
border:none;
border-radius:50%;
background:#d93025;
color:#ffffff;
font-size:18px;
cursor:pointer;
}


/* =====================================================
   UPLOAD PROGRESS
===================================================== */

.upload-progress-area{
display:none;
padding:8px 13px 10px;
background:#ffffff;
border-top:1px solid #e1e6eb;
flex-shrink:0;
}

.upload-progress-area.show{
display:block;
}

.progress-info{
display:flex;
justify-content:space-between;
align-items:center;
font-size:13px;
color:#555555;
margin-bottom:6px;
}

.progress-track{
width:100%;
height:8px;
border-radius:8px;
background:#dfe5eb;
overflow:hidden;
}

.progress-bar{
width:0%;
height:100%;
background:#0066cc;
transition:width .2s ease;
}


/* =====================================================
   MESSAGE INPUT AREA
===================================================== */

.input-area{
position:relative;
display:flex;
align-items:center;
gap:7px;
padding:10px 11px;
background:#ffffff;
border-top:1px solid #d9e0e8;
box-shadow:0 -2px 8px rgba(0,0,0,.05);
flex-shrink:0;
}

.icon-button{
width:42px;
height:42px;
border:none;
border-radius:50%;
background:#eef3f8;
font-size:21px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
flex-shrink:0;
}

.icon-button:hover{
background:#dde7f1;
}

.icon-button.recording{
background:#d93025;
color:#ffffff;
animation:pulseRecording 1.1s infinite;
}

@keyframes pulseRecording{

0%{
box-shadow:0 0 0 0 rgba(217,48,37,.40);
}

70%{
box-shadow:0 0 0 10px rgba(217,48,37,0);
}

100%{
box-shadow:0 0 0 0 rgba(217,48,37,0);
}

}

.message-input{
flex:1;
min-width:0;
padding:12px 15px;
border:1px solid #c7d0da;
border-radius:24px;
font-size:16px;
outline:none;
}

.message-input:focus{
border-color:#0066cc;
box-shadow:0 0 0 3px rgba(0,102,204,.12);
}

.send-button{
padding:12px 18px;
border:none;
border-radius:24px;
background:#0066cc;
color:#ffffff;
font-size:15px;
font-weight:bold;
cursor:pointer;
flex-shrink:0;
}

.send-button:hover{
background:#004f9e;
}

.send-button:disabled{
background:#8ba8c5;
cursor:not-allowed;
}


/* =====================================================
   ATTACHMENT MENU
===================================================== */

.attachment-menu{
display:none;
position:absolute;
left:50px;
bottom:65px;
width:190px;
padding:7px;
background:#ffffff;
border:1px solid #d9e0e8;
border-radius:13px;
box-shadow:0 8px 24px rgba(0,0,0,.18);
z-index:55;
}

.attachment-menu.show{
display:block;
}

.attachment-option{
width:100%;
display:flex;
align-items:center;
gap:10px;
padding:11px 12px;
border:none;
border-radius:8px;
background:#ffffff;
font-size:15px;
text-align:left;
cursor:pointer;
}

.attachment-option:hover{
background:#f0f4f8;
}

.attachment-option-icon{
font-size:21px;
}


/* =====================================================
   EMOJI PICKER
===================================================== */

.emoji-picker{
display:none;
position:absolute;
left:8px;
bottom:65px;
width:280px;
max-width:calc(100vw - 16px);
max-height:235px;
overflow-y:auto;
padding:10px;
background:#ffffff;
border:1px solid #d9e0e8;
border-radius:14px;
box-shadow:0 8px 24px rgba(0,0,0,.18);
z-index:60;
grid-template-columns:repeat(6,1fr);
gap:7px;
}

.emoji-picker.show{
display:grid;
}

.emoji-picker button{
border:none;
background:#f4f6f8;
border-radius:8px;
font-size:24px;
padding:7px 4px;
cursor:pointer;
}

.emoji-picker button:hover{
background:#e4ebf2;
}


/* =====================================================
   VOICE RECORDING PANEL
===================================================== */

.voice-recording-panel{
display:none;
align-items:center;
justify-content:space-between;
gap:10px;
padding:10px 13px;
background:#fff5f4;
border-top:1px solid #f0c1bd;
flex-shrink:0;
}

.voice-recording-panel.show{
display:flex;
}

.recording-indicator{
display:flex;
align-items:center;
gap:9px;
font-size:14px;
font-weight:bold;
color:#b3261e;
}

.recording-dot{
width:12px;
height:12px;
border-radius:50%;
background:#d93025;
animation:recordingBlink 1s infinite;
}

@keyframes recordingBlink{

0%,
100%{
opacity:1;
}

50%{
opacity:.25;
}

}

.recording-time{
font-variant-numeric:tabular-nums;
}

.recording-actions{
display:flex;
gap:8px;
}

.recording-action-button{
padding:9px 14px;
border:none;
border-radius:20px;
font-size:14px;
font-weight:bold;
cursor:pointer;
}

.cancel-recording-button{
background:#e6e9ed;
color:#333333;
}

.stop-recording-button{
background:#d93025;
color:#ffffff;
}


/* =====================================================
   FULL-SCREEN MEDIA VIEWER
===================================================== */

.media-viewer{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.94);
z-index:9999;
align-items:center;
justify-content:center;
padding:60px 15px 20px;
}

.media-viewer.show{
display:flex;
}

.viewer-close-button{
position:absolute;
top:15px;
right:16px;
width:44px;
height:44px;
border:none;
border-radius:50%;
background:rgba(255,255,255,.16);
color:#ffffff;
font-size:28px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
z-index:3;
}

.viewer-close-button:hover{
background:rgba(255,255,255,.28);
}

.viewer-image{
display:none;
max-width:100%;
max-height:100%;
object-fit:contain;
border-radius:5px;
}

.viewer-video{
display:none;
width:min(100%,900px);
max-height:100%;
background:#000000;
}


/* =====================================================
   HIDDEN FILE INPUTS
===================================================== */

.hidden-file-input{
display:none;
}


/* =====================================================
   MOBILE DESIGN
===================================================== */

@media(max-width:700px){

.chat-header{
padding:11px 12px;
gap:9px;
}

.back-button{
width:41px;
height:41px;
}

.chat-avatar{
width:52px;
height:52px;
}

.chat-name{
font-size:18px;
}

.chat-status{
font-size:12px;
}

.chat-area{
padding:14px 9px 22px;
}

.message-bubble{
max-width:86%;
font-size:15px;
}

.message-image,
.message-video-wrapper{
max-width:270px;
}

.voice-message{
min-width:210px;
}

.input-area{
padding:9px 8px;
gap:5px;
}

.icon-button{
width:39px;
height:39px;
font-size:19px;
}

.message-input{
padding:11px 13px;
font-size:15px;
}

.send-button{
padding:11px 14px;
font-size:14px;
}

.emoji-picker{
left:6px;
bottom:61px;
}

.attachment-menu{
left:44px;
bottom:61px;
}

.media-viewer{
padding:58px 8px 15px;
}

}


@media(max-width:390px){

.chat-avatar{
width:48px;
height:48px;
}

.chat-name{
font-size:17px;
}

.icon-button{
width:37px;
height:37px;
}

.send-button{
padding:10px 11px;
}

.message-input{
padding:10px 11px;
}

.message-image,
.message-video-wrapper{
max-width:235px;
}

}

</style>

</head>

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

doc,

/* =====================================================
   CLOUDINARY SETTINGS
===================================================== */

/* =====================================================
   FORMAT MESSAGE TIME
===================================================== */

function formatMessageTime(timestamp){

if(!timestamp){

return "";

}

let messageDate;

if(typeof timestamp.toDate === "function"){

messageDate =
timestamp.toDate();

}else{

messageDate =
new Date(timestamp);

}

if(
Number.isNaN(
messageDate.getTime()
)
){

return "";

}

return messageDate.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

}


/* =====================================================
   FORMAT LAST SEEN
===================================================== */

function formatLastSeen(timestamp){

if(!timestamp){

return "Offline";

}

let lastSeenDate;

if(typeof timestamp.toDate === "function"){

lastSeenDate =
timestamp.toDate();

}else{

lastSeenDate =
new Date(timestamp);

}

if(
Number.isNaN(
lastSeenDate.getTime()
)
){

return "Offline";

}

const now =
new Date();

const differenceMilliseconds =
now.getTime() -
lastSeenDate.getTime();

const differenceMinutes =
Math.floor(
differenceMilliseconds / 60000
);

if(differenceMinutes < 1){

return "Last seen just now";

}

if(differenceMinutes < 60){

return `Last seen ${differenceMinutes} minute${
differenceMinutes === 1 ? "" : "s"
} ago`;

}

const differenceHours =
Math.floor(
differenceMinutes / 60
);

if(differenceHours < 24){

return `Last seen ${differenceHours} hour${
differenceHours === 1 ? "" : "s"
} ago`;

}

const today =
new Date(
now.getFullYear(),
now.getMonth(),
now.getDate()
);

const lastSeenDay =
new Date(
lastSeenDate.getFullYear(),
lastSeenDate.getMonth(),
lastSeenDate.getDate()
);

const differenceDays =
Math.floor(
(today - lastSeenDay) /
86400000
);

if(differenceDays === 1){

return `Last seen yesterday at ${
lastSeenDate.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
)
}`;

}

return `Last seen ${
lastSeenDate.toLocaleDateString(
[],
{
day:"numeric",
month:"short",
year:
lastSeenDate.getFullYear() !==
now.getFullYear()
?
"numeric"
:
undefined
}
)
} at ${
lastSeenDate.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
)
}`;

}

/* =====================================================
   IMAGE FILE VALIDATION
===================================================== */

function validateImageFile(file){

if(!file){

return false;

}

if(!file.type.startsWith("image/")){

alert(
"Please select a valid picture."
);

return false;

}

const maximumImageSize =
12 * 1024 * 1024;

if(file.size > maximumImageSize){

alert(
"The picture is too large. Please select a picture smaller than 12 MB."
);

return false;

}

return true;

}


/* =====================================================
   VIDEO FILE VALIDATION

}

100 * 1024 * 1024;

if(file.size > maximumVideoSize){

alert(
"The video is too large. Please select a video smaller than 100 MB."
);

return false;

}

return true;

}

/* =====================================================
   CLOUDINARY MEDIA UPLOAD
===================================================== */

function uploadMediaToCloudinary(file){

return new Promise(
(resolve,reject) => {

if(!file){

reject(
new Error("No media file selected.")
);

return;

}

const formData =
new FormData();

formData.append(
"file",
file
);

formData.append(
"upload_preset",
CLOUDINARY_UPLOAD_PRESET
);

formData.append(
"folder",
"sabasaba_private_chat"
);

const uploadRequest =
new XMLHttpRequest();

uploadRequest.open(
"POST",
CLOUDINARY_UPLOAD_URL,
true
);


/* =====================================================
   CLOUDINARY UPLOAD PROGRESS
===================================================== */

uploadRequest.upload.addEventListener(
"progress",
(event) => {

if(!event.lengthComputable){

return;

}

const uploadPercent =
(event.loaded / event.total) * 100;

updateUploadProgress(
uploadPercent,
selectedMediaType === "audio"
?
"Uploading voice message..."
:
selectedMediaType === "video"
?
"Uploading video..."
:
"Uploading picture..."
);

}
);


/* =====================================================
   CLOUDINARY UPLOAD SUCCESS
===================================================== */

uploadRequest.addEventListener(
"load",
() => {

let responseData = null;

try{

responseData =
JSON.parse(
uploadRequest.responseText
);

}catch(error){

reject(
new Error(
"Cloudinary returned an invalid response."
)
);

return;

}

if(
uploadRequest.status >= 200 &&
uploadRequest.status < 300 &&
responseData?.secure_url
){

updateUploadProgress(
100,
"Upload complete"
);

resolve({
url:responseData.secure_url,
publicId:responseData.public_id || "",
resourceType:responseData.resource_type || "",
format:responseData.format || "",
duration:responseData.duration || 0
});

return;

}

const cloudinaryErrorMessage =
responseData?.error?.message ||
"Cloudinary upload failed.";

reject(
new Error(
cloudinaryErrorMessage
)
);

}
);


/* =====================================================
   CLOUDINARY UPLOAD ERROR
===================================================== */

uploadRequest.addEventListener(
"error",
() => {

reject(
new Error(
"Unable to upload media. Check your internet connection."
)
);

}
);

)

);

/* =====================================================
   FORMAT RECORDING TIME
===================================================== */

function formatRecordingTime(seconds){

const safeSeconds =
Math.max(
0,
Math.floor(seconds)
);

const minutes =
Math.floor(
safeSeconds / 60
);

const remainingSeconds =
safeSeconds % 60;

return `${String(minutes).padStart(
2,
"0"
)}:${String(remainingSeconds).padStart(
2,
"0"
)}`;

}


/* =====================================================
   UPDATE RECORDING TIMER
===================================================== */

function updateRecordingTimer(){

recordingTime.textContent =
formatRecordingTime(
recordingSeconds
);

}


/* =====================================================
   START RECORDING TIMER
===================================================== */

function startRecordingTimer(){

recordingSeconds =
0;

updateRecordingTimer();

recordingTimerInterval =
window.setInterval(
() => {

recordingSeconds += 1;

updateRecordingTimer();

const maximumRecordingSeconds =
300;

if(
recordingSeconds >=
maximumRecordingSeconds
){

stopVoiceRecording();

}

},
1000
);

}


/* =====================================================
   STOP RECORDING TIMER
===================================================== */

function stopRecordingTimer(){

if(recordingTimerInterval){

window.clearInterval(
recordingTimerInterval
);

recordingTimerInterval =
null;

}

}


/* =====================================================
   CHOOSE AUDIO MIME TYPE
===================================================== */

function getSupportedAudioMimeType(){

const possibleTypes = [

"audio/webm;codecs=opus",

"audio/webm",

"audio/ogg;codecs=opus",

"audio/mp4"

];

for(
const mimeType
of possibleTypes
){

if(
window.MediaRecorder &&
MediaRecorder.isTypeSupported(
mimeType
)
){

return mimeType;

}

}

return "";

}


/* =====================================================
   GET AUDIO FILE EXTENSION
===================================================== */

function getAudioFileExtension(mimeType){

if(
mimeType.includes(
"ogg"
)
){

return "ogg";

}

if(
mimeType.includes(
"mp4"
)
){

return "m4a";

}

return "webm";

}


/* =====================================================
   RELEASE MICROPHONE STREAM
===================================================== */

function releaseRecordingStream(){

if(recordingStream){

recordingStream
.getTracks()
.forEach((track) => {

track.stop();

});

recordingStream =
null;

}

}


/* =====================================================
   RESET RECORDING INTERFACE
===================================================== */

function resetRecordingInterface(){

isRecording =
false;

voiceButton.classList.remove(
"recording"
);

);

stopRecordingTimer();

recordingSeconds =

}


/* =====================================================
   START VOICE RECORDING
===================================================== */

async function startVoiceRecording(){

if(sendingMessage){

return;

}

closeInputMenus();

if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

alert(
"Voice recording is not supported by this browser."
);

return;

}

if(
typeof MediaRecorder === "undefined"
){

alert(
"Voice recording is not supported on this device."
);

return;

}

try{

clearSelectedMedia();

recordingStream =
await navigator.mediaDevices.getUserMedia({
audio:true
});

const supportedMimeType =
getSupportedAudioMimeType();

const mediaRecorderOptions =
supportedMimeType
?
{
mimeType:supportedMimeType
}
:
undefined;

mediaRecorder =
new MediaRecorder(
recordingStream,
mediaRecorderOptions
);

recordedAudioChunks =
[];

recordedAudioBlob =
null;

recordedAudioFile =
null;


/* =====================================================
   COLLECT AUDIO DATA
===================================================== */

mediaRecorder.addEventListener(
"dataavailable",
(event) => {

if(
event.data &&
event.data.size > 0
){

recordedAudioChunks.push(
event.data
);

}

}
);


/* =====================================================
   COMPLETE AUDIO RECORDING
===================================================== */

mediaRecorder.addEventListener(
"stop",
() => {

const finalMimeType =
mediaRecorder.mimeType ||
supportedMimeType ||
"audio/webm";

recordedAudioBlob =
new Blob(
recordedAudioChunks,
{
type:finalMimeType
}
);

recordedAudioChunks =
[];

if(
recordedAudioBlob.size === 0
){

resetRecordingInterface();

alert(
"No sound was recorded. Please try again."
);

return;

}

const audioExtension =
getAudioFileExtension(
finalMimeType
);

const audioFilename =
`voice-message-${Date.now()}.${audioExtension}`;

recordedAudioFile =
new File(
[recordedAudioBlob],
audioFilename,
{
type:finalMimeType
}
);

resetRecordingInterface();

showAudioPreview(
recordedAudioFile
);

}
);


/* =====================================================
   RECORDING ERROR
===================================================== */

mediaRecorder.addEventListener(
"error",
(event) => {

console.error(
"Voice recording error:",
event.error
);

resetRecordingInterface();

alert(
"Voice recording failed. Please try again."
);

}
);

mediaRecorder.start(
250
);

isRecording =
true;

voiceButton.classList.add(
"recording"
);

voiceRecordingPanel.classList.add(
"show"
);

startRecordingTimer();

}catch(error){

console.error(
"Unable to start voice recording:",
error
);

resetRecordingInterface();

if(
error?.name ===
"NotAllowedError"
){

alert(
"Microphone permission was denied. Please allow microphone access and try again."
);

return;

}

if(
error?.name ===
"NotFoundError"
){

alert(
"No microphone was found on this device."
);

return;

}

alert(
"Unable to start voice recording."
);

}

}


/* =====================================================
   STOP VOICE RECORDING
===================================================== */

function stopVoiceRecording(){

if(
!isRecording ||
!mediaRecorder
){

return;

}

if(
mediaRecorder.state !==
"inactive"
){

mediaRecorder.stop();

}

isRecording =
false;

voiceButton.classList.remove(
"recording"
);

voiceRecordingPanel.classList.remove(
"show"
);

stopRecordingTimer();

}


/* =====================================================
   CANCEL VOICE RECORDING
===================================================== */

function cancelVoiceRecording(){

if(!isRecording){

resetRecordingInterface();

return;

}

if(mediaRecorder){

mediaRecorder.ondataavailable =
null;

mediaRecorder.onstop =
null;

if(
mediaRecorder.state !==
"inactive"
){

mediaRecorder.stop();

}

}

recordedAudioChunks =
[];

recordedAudioBlob =
null;

recordedAudioFile =
null;

resetRecordingInterface();

}

===================================================== */

function loadMessages(){

if(
!currentUser ||
!conversationId
){

return;

}

if(unsubscribeMessages){

unsubscribeMessages();

unsubscribeMessages =
null;

}

const messagesQuery =
query(
getMessagesCollectionReference(),
orderBy(
"timestamp",
"asc"
)
);

unsubscribeMessages =
onSnapshot(
messagesQuery,
async (messagesSnapshot) => {

chatArea.innerHTML =
"";

if(messagesSnapshot.empty){

chatArea.innerHTML = `

<div class="empty-message">

No messages yet.<br>

Start this private conversation.

</div>

`;

return;

}

const receiptUpdates =
[];

messagesSnapshot.forEach(
(messageSnapshot) => {

const messageId =
messageSnapshot.id;

const messageData =
messageSnapshot.data();

const messageElement =
createMessageElement(
messageId,
messageData
);

if(messageElement){

chatArea.appendChild(
messageElement
);

}

if(
messageData.senderId !==
currentUser.uid
){

receiptUpdates.push(
updateIncomingMessageReceipts(
messageId,
messageData
)
);

}

}
);

await Promise.allSettled(
receiptUpdates
);

scrollToLatestMessage();

},
(error) => {

console.error(
"Unable to load messages:",
error
);

chatArea.innerHTML = `

<div class="empty-message">

Unable to load this conversation.<br>

Please check your connection and refresh the page.

</div>

`;

}
);

}

otherUid,

receiverId:
otherUid,

senderId:
currentUser.uid,

senderName:
senderName,

senderPicture:
senderPicture,

type:
"private_message",

message:
notificationMessage,

conversationId:
conversationId,

messageId:
messageId || "",

read:
false,

timestamp:
serverTimestamp(),

createdAt:
serverTimestamp()
}
);

}catch(error){

console.error(
"Unable to create message notification:",
error
);

}

}


/* =====================================================
   SET SEND INTERFACE STATE
===================================================== */

function setSendingState(
isSending
){

sendingMessage =
isSending;

sendButton.disabled =
isSending;

messageInput.disabled =
isSending;

emojiButton.disabled =
isSending;

attachmentButton.disabled =
isSending;

voiceButton.disabled =
isSending;

removePreviewButton.disabled =
isSending;

sendButton.textContent =
isSending
?
"Sending..."
:
"Send";

}


/* =====================================================
   CREATE MESSAGE DOCUMENT
===================================================== */

async function createMessageDocument({
messageText,
mediaType,
mediaUrl,
mediaPublicId,
mediaFormat,
mediaDuration
}){

const senderName =
getProfileName(
currentProfile,
currentUser.displayName ||
currentUser.email ||
"Member"
);

const senderPicture =
getProfilePicture(
currentProfile
);

const messageReference =
await addDoc(
getMessagesCollectionReference(),
{
senderId:
currentUser.uid,

receiverId:
otherUid,

message:
messageText || "",

text:
messageText || "",

mediaType:
mediaType || "none",

mediaUrl:
mediaUrl || "",

mediaPublicId:
mediaPublicId || "",

mediaFormat:
mediaFormat || "",

mediaDuration:
mediaDuration || 0,

senderName:
senderName,

senderPicture:
senderPicture,

timestamp:
serverTimestamp(),

createdAt:
serverTimestamp(),

delivered:
false,

read:
false,

deletedFor:
[]
}
);

return messageReference;

}


/* =====================================================
   PREPARE AND SEND MESSAGE
===================================================== */

async function sendMessage(){

if(
sendingMessage ||
!currentUser ||
!otherUid ||
!conversationId
){

return;

}

if(isRecording){

alert(
"Please stop the voice recording before sending."
);

return;

}

const messageText =
messageInput.value.trim();

const hasMedia =
selectedMediaFile &&
selectedMediaType !== "none";

if(
!messageText &&
!hasMedia
){

messageInput.focus();

return;

}

setSendingState(
true
);

closeInputMenus();

let finalMediaUrl = "";

let finalMediaPublicId = "";

let finalMediaFormat = "";

let finalMediaDuration = 0;

try{

if(hasMedia){

updateUploadProgress(
0,
selectedMediaType === "audio"
?
"Uploading voice message..."
:
selectedMediaType === "video"
?
"Uploading video..."
:
"Uploading picture..."
);

const uploadResult =
await uploadMediaToCloudinary(
selectedMediaFile
);

finalMediaUrl =
uploadResult.url;

finalMediaPublicId =
uploadResult.publicId;

finalMediaFormat =
uploadResult.format;

finalMediaDuration =
uploadResult.duration;

uploadedMediaUrl =
finalMediaUrl;

uploadedMediaPublicId =
finalMediaPublicId;

}

const messageReference =
await createMessageDocument({
messageText:
messageText,

mediaType:
hasMedia
?
selectedMediaType
:
"none",

mediaUrl:
finalMediaUrl,

mediaPublicId:
finalMediaPublicId,

mediaFormat:
finalMediaFormat,

mediaDuration:
finalMediaDuration
});

await Promise.allSettled([

updateConversationSummary({
messageText:
messageText,

mediaType:
hasMedia
?
selectedMediaType
:
"none",

mediaUrl:
finalMediaUrl,

messageId:
messageReference.id
}),

createMessageNotification({
messageText:
messageText,

mediaType:
hasMedia
?
selectedMediaType
:
"none",

messageId:
messageReference.id
})

]);

messageInput.value =
"";

clearSelectedMedia();

messageInput.focus();

scrollToLatestMessage();

}catch(error){

console.error(
"Unable to send message:",
error
);

resetUploadProgress();

alert(
error?.message ||
"Unable to send the message. Please try again."
);

}finally{

setSendingState(
false
);

}

}
/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.addEventListener(
"click",
() => {

sendMessage();

}
);


/* =====================================================
   ENTER KEY TO SEND
===================================================== */

messageInput.addEventListener(
"keydown",
(event) => {

if(
event.key === "Enter" &&
!event.shiftKey
){

event.preventDefault();

sendMessage();

}

}
);


/* =====================================================
   REFRESH READ RECEIPTS WHEN INPUT IS FOCUSED
===================================================== */

messageInput.addEventListener(
"focus",
() => {

markVisibleConversationAsRead();

}
);


/* =====================================================
   UPDATE ONLINE STATUS WHEN WINDOW GAINS FOCUS
===================================================== */

window.addEventListener(
"focus",
async () => {

if(!currentUser){

return;

}

await setCurrentUserOnline();

await markVisibleConversationAsRead();

}
);


/* =====================================================
   UPDATE ONLINE STATUS WHEN WINDOW LOSES FOCUS
===================================================== */

window.addEventListener(
"blur",
async () => {

if(!currentUser){

return;

}

await setCurrentUserOffline();

}
);


/* =====================================================
   CLOSE VIEWER WHEN BACK BUTTON IS PRESSED
===================================================== */

window.addEventListener(
"popstate",
() => {

if(
mediaViewer.classList.contains(
"show"
)
){

resetMediaViewer();

}

}
);


/* =====================================================
   IMAGE VIEWER ERROR
===================================================== */

viewerImage.addEventListener(
"error",
() => {

alert(
"Unable to open this picture."
);

resetMediaViewer();

}
);


/* =====================================================
   VIDEO VIEWER ERROR
===================================================== */

viewerVideo.addEventListener(
"error",
() => {

alert(
"Unable to play this video."
);

resetMediaViewer();

}
);


/* =====================================================
   STOP OTHER AUDIO PLAYERS
===================================================== */

chatArea.addEventListener(
"play",
(event) => {

if(
event.target.tagName !== "AUDIO"
){

return;

}

chatArea
.querySelectorAll("audio")
.forEach((audioPlayer) => {

if(
audioPlayer !== event.target
){

audioPlayer.pause();

}

});

},
true
);


/* =====================================================
   STOP OTHER VIDEOS
===================================================== */

chatArea.addEventListener(
"play",
(event) => {

if(
event.target.tagName !== "VIDEO"
){

return;

}

chatArea
.querySelectorAll("video")
.forEach((videoPlayer) => {

if(
videoPlayer !== event.target
){

videoPlayer.pause();

}

});

},
true
);


/* =====================================================
   CLEAN UP BEFORE PAGE CLOSE
===================================================== */

function cleanUpChatPage(){

if(unsubscribeMessages){

unsubscribeMessages();

unsubscribeMessages =
null;

}

if(unsubscribeOtherUser){

unsubscribeOtherUser();

unsubscribeOtherUser =
null;

}

if(isRecording){

cancelVoiceRecording();

}else{

releaseRecordingStream();

stopRecordingTimer();

}

releasePreviewUrl();

resetMediaViewer();

}


/* =====================================================
   PAGE HIDE CLEANUP
===================================================== */

window.addEventListener(
"pagehide",
() => {

cleanUpChatPage();

}
);


/* =====================================================
   BEFORE UNLOAD CLEANUP
===================================================== */

window.addEventListener(
"beforeunload",
() => {

cleanUpChatPage();

}
);


/* =====================================================
   INITIAL INPUT STATE
===================================================== */

messageInput.focus();

updateRecordingTimer();

resetUploadProgress();

</script>

</body>

</html>
