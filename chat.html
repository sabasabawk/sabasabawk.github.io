<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
background:#0066cc;
color:white;
padding:15px;
display:flex;
align-items:center;
gap:15px;
}

.avatar{
width:55px;
height:55px;
border-radius:50%;
object-fit:cover;
background:white;
}

.name{
font-size:20px;
font-weight:bold;
}

.chatArea{
flex:1;
overflow-y:auto;
padding:20px;
background:#f5f7fb;
display:flex;
flex-direction:column;
}

.empty{
text-align:center;
color:#777;
margin-top:80px;
}

.message{
max-width:70%;
padding:12px 16px;
margin:8px 0;
border-radius:15px;
word-wrap:break-word;
}

.mine{
align-self:flex-end;
background:#0066cc;
color:white;
}

.other{
align-self:flex-start;
background:#e5e5ea;
color:black;
}

.inputArea{
display:flex;
padding:15px;
background:white;
border-top:1px solid #ddd;
}

.inputArea input{
flex:1;
padding:12px;
border:1px solid #ccc;
border-radius:25px;
font-size:16px;
outline:none;
}

.inputArea button{
margin-left:10px;
padding:12px 22px;
border:none;
border-radius:25px;
background:#0066cc;
color:white;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<img
id="chatAvatar"
class="avatar"
src="images/profile.png">

<div
class="name"
id="chatName">

Loading...

</div>

</div>

<div
class="chatArea"
id="chatArea">

<div class="empty">

No messages yet.<br>
Start your Christian conversation.

</div>

</div>

<div class="inputArea">

<input
id="message"
type="text"
placeholder="Type your message...">

<button id="sendBtn">

Send

</button>

</div>

<script type="module">
import {
auth,
db,
doc,
getDoc,
collection,
addDoc,
query,
where,
orderBy,
onSnapshot,
serverTimestamp,
setDoc,
onAuthStateChanged
} from "./firebase.js";

const params = new URLSearchParams(window.location.search);
const otherUid = params.get("uid");

const chatName = document.getElementById("chatName");
const chatAvatar = document.getElementById("chatAvatar");
const chatArea = document.getElementById("chatArea");
const messageInput = document.getElementById("message");
const sendBtn = document.getElementById("sendBtn");

let currentUser = null;

onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href="login.html";
return;

}

currentUser = user;

const userSnap = await getDoc(
doc(db,"users",otherUid)
);

if(userSnap.exists()){

const other = userSnap.data();

chatName.innerText =
other.fullName || "Unknown User";

chatAvatar.src =
other.profilePicture || "images/profile.png";

}

loadMessages();

});
function loadMessages(){

const q = query(
collection(db,"messages"),
orderBy("timestamp","asc")
);

onSnapshot(q,(snapshot)=>{

chatArea.innerHTML="";

let found = false;

snapshot.forEach((messageDoc)=>{

const msg = messageDoc.data();

if(

(msg.senderId===currentUser.uid &&
msg.receiverId===otherUid)

||

(msg.senderId===otherUid &&
msg.receiverId===currentUser.uid)

){

found = true;

const div = document.createElement("div");

div.className =
"message " +
(msg.senderId===currentUser.uid ? "mine" : "other");

div.textContent = msg.message;

chatArea.appendChild(div);

}

});

if(!found){

chatArea.innerHTML = `
<div class="empty">
No messages yet.<br>
Start your Christian conversation.
</div>
`;

}

chatArea.scrollTop = chatArea.scrollHeight;

});

}

sendBtn.addEventListener("click", async()=>{

const text = messageInput.value.trim();

if(text==="") return;

try{

// Save message
await addDoc(collection(db,"messages"),{

senderId: currentUser.uid,
receiverId: otherUid,
message: text,
timestamp: serverTimestamp()

});

// Update conversation
const ids = [currentUser.uid,otherUid].sort();

const conversationId = ids[0] + "_" + ids[1];

await setDoc(
doc(db,"conversations",conversationId),
{

participants: ids,
lastMessage: text,
lastSender: currentUser.uid,
timestamp: serverTimestamp()

}

);

// Create notification
await addDoc(collection(db,"notifications"),{

userId: otherUid,
senderId: currentUser.uid,
title: "New Message",
message: text,
read: false,
timestamp: serverTimestamp()

});

messageInput.value="";

}catch(error){

alert(error.message);

}

});
</script>

</body>
</html>
