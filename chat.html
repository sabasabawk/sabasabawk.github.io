<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Chat</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef3f8;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
background:#0066cc;
color:white;
padding:15px;
display:flex;
align-items:center;
gap:15px;
}

.avatar{
width:50px;
height:50px;
border-radius:50%;
background:white;
}

.name{
font-size:20px;
font-weight:bold;
}

.chatArea{
flex:1;
overflow-y:auto;
padding:20px;
background:#f5f7fb;
}

.empty{
text-align:center;
color:#777;
margin-top:80px;
}

.inputArea{
display:flex;
padding:15px;
background:white;
border-top:1px solid #ddd;
}

.inputArea input{
flex:1;
padding:12px;
border:1px solid #ccc;
border-radius:25px;
font-size:16px;
}

.inputArea button{
margin-left:10px;
padding:12px 22px;
border:none;
border-radius:25px;
background:#0066cc;
color:white;
font-size:16px;
cursor:pointer;
}

.inputArea button:hover{
background:#004d99;
}

</style>

</head>

<body>

<div class="header">

<img id="chatAvatar" class="avatar" src="images/profile.png">

<div class="name" id="chatName">

Loading...

</div>

</div>

<div class="chatArea" id="chatArea">

<div class="empty">

No messages yet.<br>

Start your Christian conversation.

</div>

</div>

<div class="inputArea">

<input
type="text"
id="message"
placeholder="Type your message...">

<button id="sendBtn">

Send

</button>

</div>
<script type="module">

import {
auth,
db,
doc,
getDoc,
collection,
addDoc,
query,
where,
orderBy,
onSnapshot,
serverTimestamp,
onAuthStateChanged
} from "./firebase.js";

const params = new URLSearchParams(window.location.search);
const otherUid = params.get("uid");

const chatName = document.getElementById("chatName");
const chatAvatar = document.getElementById("chatAvatar");
const chatArea = document.getElementById("chatArea");
const messageInput = document.getElementById("message");
const sendBtn = document.getElementById("sendBtn");

let currentUser = null;
onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href="login.html";
return;

}

try{

const userSnap = await getDoc(
doc(db,"users",otherUid)
);

if(userSnap.exists()){

const data = userSnap.data();

chatName.innerText =
data.fullName || "Unknown User";

chatAvatar.src =
data.profilePicture || "images/profile.png";

}

}catch(error){

alert(error.message);

}

});

</script>
</body>
</html>
