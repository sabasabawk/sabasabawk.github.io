<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat | Faith Connect</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="chat-header">
    <div class="chat-user-info">
      <a href="feed.html" class="icon-btn" style="margin-right:4px;">←</a>
      <img id="partnerAvatar" class="chat-avatar" src="https://via.placeholder.com/40" alt="Avatar">
      <div>
        <div id="partnerName" class="chat-user-name">Loading...</div>
        <div id="partnerStatus" class="chat-status">Active now</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="startVoiceCall">📞</button>
      <button class="icon-btn" id="startVideoCall">📹</button>
    </div>
  </header>

  <!-- Messages List -->
  <main class="chat-messages" id="chatMessages">
    <!-- Messages dynamically inject here -->
  </main>

  <!-- Dynamic Status Panels (Hidden by Default) -->
  <div id="recordingBar" class="recording-bar hidden-panel">
    <span>🎙️ Recording Audio: <span id="recTimer">00:00</span></span>
    <div>
      <button class="rec-btn" id="cancelRecBtn" style="background:#65676b;">Cancel</button>
      <button class="rec-btn" id="stopRecBtn">Send Voice</button>
    </div>
  </div>

  <div id="uploadStatus" class="recording-bar hidden-panel" style="background:#e7f3ff; color:#1877f2;">
    <span>⏳ Uploading media... <span id="uploadPercent">0%</span></span>
  </div>

  <!-- Emoji Popover -->
  <div id="emojiPicker" class="popover-panel">
    <div class="emoji-grid">
      <span class="emoji-item">😀</span><span class="emoji-item">😂</span><span class="emoji-item">😍</span><span class="emoji-item">🥰</span>
      <span class="emoji-item">🙏</span><span class="emoji-item">❤️</span><span class="emoji-item">👍</span><span class="emoji-item">🔥</span>
      <span class="emoji-item">🙌</span><span class="emoji-item">✨</span><span class="emoji-item">🕊️</span><span class="emoji-item">📖</span>
      <span class="emoji-item">⛪</span><span class="emoji-item">😊</span><span class="emoji-item">😭</span><span class="emoji-item">👏</span>
    </div>
  </div>

  <!-- Attachment Options Popover -->
  <div id="attachmentPicker" class="popover-panel">
    <div class="attachment-options">
      <label class="attach-btn">
        <div class="attach-icon">📷</div>
        <span>Photo</span>
        <input type="file" id="photoInput" accept="image/*" class="hidden-panel">
      </label>
      <label class="attach-btn">
        <div class="attach-icon">🎥</div>
        <span>Video</span>
        <input type="file" id="videoInput" accept="video/*" class="hidden-panel">
      </label>
      <label class="attach-btn">
        <div class="attach-icon">📁</div>
        <span>File</span>
        <input type="file" id="fileInput" class="hidden-panel">
      </label>
    </div>
  </div>

  <!-- Bottom Message Bar -->
  <footer class="chat-input-bar">
    <button class="icon-btn" id="toggleEmoji">😊</button>
    <button class="icon-btn" id="toggleAttach">📎</button>
    <button class="icon-btn" id="micBtn">🎙️</button>
    
    <div class="input-wrapper">
      <input type="text" id="msgInput" class="chat-input" placeholder="Type your message...">
    </div>
    
    <button class="send-btn" id="sendBtn">➤</button>
  </footer>

  <!-- Incoming / Outgoing Call Overlay (Hidden by Default) -->
  <div id="callModal" class="call-modal hidden-panel">
    <img id="callAvatar" class="chat-avatar" style="width:90px; height:90px; margin-bottom:16px;" src="https://via.placeholder.com/90">
    <h2 id="callUserName" style="font-size:20px; margin-bottom:8px;">Faith Connect Member</h2>
    <p id="callStateText" style="color:#aaa; margin-bottom:24px;">Calling...</p>
    <button id="endCallBtn" style="background:#d32f2f; color:#fff; border:none; padding:12px 28px; border-radius:24px; font-weight:bold; cursor:pointer;">End Call</button>
  </div>

  <script type="module">
    import { db, auth, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, getDoc, onAuthStateChanged } from "./firebase.js";

    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get("userId");

    const messagesContainer = document.getElementById("chatMessages");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    
    const partnerNameEl = document.getElementById("partnerName");
    const partnerAvatarEl = document.getElementById("partnerAvatar");

    const toggleEmojiBtn = document.getElementById("toggleEmoji");
    const emojiPicker = document.getElementById("emojiPicker");
    const toggleAttachBtn = document.getElementById("toggleAttach");
    const attachmentPicker = document.getElementById("attachmentPicker");

    let currentAuthUser = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.replace("login.html");
        return;
      }
      currentAuthUser = user;
      if (targetUserId) {
        loadPartnerInfo(targetUserId);
        listenForMessages(user.uid, targetUserId);
      }
    });

    async function loadPartnerInfo(uid) {
      try {
        const userDoc = await getDoc(doc(db, "users", uid));
        if (userDoc.exists()) {
          const data = userDoc.data();
          partnerNameEl.innerText = data.name || data.fullName || "Faith Connect Member";
          partnerAvatarEl.src = data.picture || data.profilePicture || "https://via.placeholder.com/40";
        }
      } catch (err) {
        console.error("Error loading partner:", err);
      }
    }

    function listenForMessages(currentUid, partnerUid) {
      const chatId = currentUid < partnerUid ? `${currentUid}_${partnerUid}` : `${partnerUid}_${currentUid}`;
      const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));

      onSnapshot(q, (snapshot) => {
        let html = "";
        snapshot.forEach((docSnap) => {
          const m = docSnap.data();
          const isSent = m.senderId === currentUid;
          const time = m.timestamp?.toDate ? m.timestamp.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";

          let mediaHTML = "";
          if (m.mediaUrl) {
            if (m.mediaType === "video") {
              mediaHTML = `<video src="${m.mediaUrl}" controls class="msg-media"></video>`;
            } else {
              mediaHTML = `<img src="${m.mediaUrl}" class="msg-media" alt="Media">`;
            }
          }

          html += `
            <div class="msg-row ${isSent ? 'sent' : 'received'}">
              <div class="msg-bubble">
                ${m.text ? escapeHTML(m.text) : ''}
                ${mediaHTML}
              </div>
              <div class="msg-time">${time}</div>
            </div>
          `;
        });
        messagesContainer.innerHTML = html;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      });
    }

    sendBtn.addEventListener("click", sendMessage);
    msgInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });

    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || !currentAuthUser || !targetUserId) return;

      const chatId = currentAuthUser.uid < targetUserId ? `${currentAuthUser.uid}_${targetUserId}` : `${targetUserId}_${currentAuthUser.uid}`;
      msgInput.value = "";

      try {
        await addDoc(collection(db, "chats", chatId, "messages"), {
          senderId: currentAuthUser.uid,
          receiverId: targetUserId,
          text: text,
          timestamp: serverTimestamp()
        });
      } catch (err) {
        console.error("Send error:", err);
      }
    }

    toggleEmojiBtn.addEventListener("click", () => {
      emojiPicker.classList.toggle("active");
      attachmentPicker.classList.remove("active");
    });

    toggleAttachBtn.addEventListener("click", () => {
      attachmentPicker.classList.toggle("active");
      emojiPicker.classList.remove("active");
    });

    document.querySelectorAll(".emoji-item").forEach(item => {
      item.addEventListener("click", () => {
        msgInput.value += item.innerText;
        emojiPicker.classList.remove("active");
      });
    });

    function escapeHTML(str) {
      return String(str || "").replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
