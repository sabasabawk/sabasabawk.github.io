<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<meta
  name="description"
  content="Private Christian messaging for SABASABA Gospel Ministry."
>

<title>
Private Chat | SABASABA Gospel Ministry
</title>

<link rel="stylesheet" href="chat.css?v=20261006">
</head>

<body>

<!-- =====================================================
   PART 4 OF 10
   COMPLETE HTML PAGE STRUCTURE
===================================================== -->


<!-- =====================================================
   CHAT HEADER
===================================================== -->

<header class="chatHeader">

  <button
    id="backButton"
    class="backButton"
    type="button"
    aria-label="Go back"
  >
    ←
  </button>


  <div class="avatarWrapper">

    <img
      id="chatAvatar"
      class="chatAvatar"
      src="images/profile.png"
      alt="Member profile picture"
    >

    <span
      id="onlineDot"
      class="onlineDot"
      aria-hidden="true"
    ></span>

  </div>


  <div class="chatHeaderInformation">

    <div
      id="chatName"
      class="chatName"
    >
      Loading member...
    </div>

    <div
      id="chatStatus"
      class="chatStatus"
    >
      Checking status...
    </div>

  </div>


  <div class="headerActions">

    <button
      id="voiceCallButton"
      class="voiceCallButton"
      type="button"
      aria-label="Start voice call"
      title="Voice call"
      disabled
    >
      📞
    </button>

<button
  id="videoCallButton"
  class="videoCallButton"
  type="button"
  aria-label="Start video call"
  title="Video call"
  disabled
>
  📹
</button>
    <button
      id="headerOptionsButton"
      class="headerOptionsButton"
      type="button"
      aria-label="Open chat options"
      title="Chat options"
    >
      ⋮
    </button>

  </div>


  <!-- =================================================
       HEADER OPTIONS MENU
  ================================================== -->

  <div
    id="headerOptionsMenu"
    class="headerOptionsMenu"
  >

    <button
      id="viewProfileButton"
      class="headerOptionButton"
      type="button"
    >
      👤 View Profile
    </button>


    <button
      id="clearChatButton"
      class="headerOptionButton"
      type="button"
    >
      🧹 Clear Chat for Me
    </button>

  </div>

</header>


<!-- =====================================================
   CHAT PAGE
===================================================== -->

<main class="chatPage">


  <!-- =================================================
       MESSAGES AREA
  ================================================== -->

  <section
    id="chatArea"
    class="chatArea"
    aria-live="polite"
    aria-label="Private conversation"
  >

    <div class="loadingMessage">
      Loading conversation...
    </div>

  </section>


  <!-- =================================================
       TYPING INDICATOR
  ================================================== -->

  <div
    id="typingIndicator"
    class="typingIndicator"
    aria-live="polite"
  >

    <span id="typingMemberName">
      Member
    </span>

    <span>is typing</span>

    <span class="typingDot"></span>
    <span class="typingDot"></span>
    <span class="typingDot"></span>

  </div>


  <!-- =================================================
       REPLYING TO A FAITH MOMENT
  ================================================== -->

  <section
    id="momentReplyPreviewArea"
    class="momentReplyPreviewArea"
  >

    <div
      id="momentReplyThumbnail"
      class="momentReplyThumbnail"
    ></div>

    <div class="momentReplyText">

      <div class="momentReplyLabel">
        Replying to
        <span id="momentReplyAuthorName"></span>'s
        Faith Moment
      </div>

      <div
        id="momentReplySnippet"
        class="momentReplySnippet"
      ></div>

    </div>

    <button
      id="cancelMomentReplyButton"
      class="cancelMomentReplyButton"
      type="button"
      aria-label="Cancel replying to this Faith Moment"
    >
      ×
    </button>

  </section>


  <!-- =================================================
       MEDIA PREVIEW
  ================================================== -->

  <section
    id="mediaPreviewArea"
    class="mediaPreviewArea"
  >

    <button
      id="removePreviewButton"
      class="removePreviewButton"
      type="button"
      aria-label="Remove selected media"
    >
      ×
    </button>


    <div
      id="previewContent"
      class="previewContent"
    ></div>

  </section>


  <!-- =================================================
       UPLOAD PROGRESS
  ================================================== -->

  <section
    id="uploadProgressArea"
    class="uploadProgressArea"
  >

    <div class="progressInformation">

      <span id="uploadProgressText">
        Uploading media...
      </span>

      <span id="uploadProgressPercent">
        0%
      </span>

    </div>


    <div class="progressTrack">

      <div
        id="progressBar"
        class="progressBar"
      ></div>

    </div>

  </section>


  <!-- =================================================
       VOICE RECORDING PANEL
  ================================================== -->

  <section
    id="voiceRecordingPanel"
    class="voiceRecordingPanel"
  >

    <div class="recordingIndicator">

      <span class="recordingDot"></span>

      <span>
        Recording:
      </span>

      <span
        id="recordingTime"
        class="recordingTime"
      >
        00:00
      </span>

    </div>


    <div class="recordingActions">

      <button
        id="cancelRecordingButton"
        class="recordingActionButton cancelRecordingButton"
        type="button"
      >
        Cancel
      </button>


      <button
        id="stopRecordingButton"
        class="recordingActionButton stopRecordingButton"
        type="button"
      >
        Stop
      </button>

    </div>

  </section>


  <!-- =================================================
       MESSAGE INPUT AREA
  ================================================== -->

  <footer class="inputArea">


    <!-- Emoji button -->

    <button
      id="emojiButton"
      class="iconButton"
      type="button"
      aria-label="Open emoji picker"
      title="Emoji"
    >
      😊
    </button>


    <!-- Attachment button -->

    <button
      id="attachmentButton"
      class="iconButton"
      type="button"
      aria-label="Attach media"
      title="Attach media"
    >
      📎
    </button>


    <!-- Voice recording button -->

    <button
      id="voiceButton"
      class="iconButton"
      type="button"
      aria-label="Record voice message"
      title="Record voice message"
    >
      🎤
    </button>


    <!-- =================================================
         EMOJI PICKER
    ================================================== -->

    <div
      id="emojiPicker"
      class="emojiPicker"
    >

      <button type="button">😀</button>
      <button type="button">😁</button>
      <button type="button">😂</button>
      <button type="button">🤣</button>
      <button type="button">😊</button>
      <button type="button">😍</button>

      <button type="button">🥰</button>
      <button type="button">😘</button>
      <button type="button">😇</button>
      <button type="button">🙏</button>
      <button type="button">❤️</button>
      <button type="button">👍</button>

      <button type="button">👏</button>
      <button type="button">🔥</button>
      <button type="button">🎉</button>
      <button type="button">💪</button>
      <button type="button">🙌</button>
      <button type="button">🤝</button>

      <button type="button">📖</button>
      <button type="button">✝️</button>
      <button type="button">⛪</button>
      <button type="button">🕊️</button>
      <button type="button">🌍</button>
      <button type="button">🌞</button>

      <button type="button">😢</button>
      <button type="button">😭</button>
      <button type="button">😔</button>
      <button type="button">🤗</button>
      <button type="button">💖</button>
      <button type="button">✨</button>

    </div>


    <!-- =================================================
         ATTACHMENT MENU
    ================================================== -->

    <div
      id="attachmentMenu"
      class="attachmentMenu"
    >

        class="attachmentOption"
        type="button"
      >

        <span class="attachmentOptionIcon">
          📷

        <span>
          Select Picture

      </button>


      <button
        id="selectVideoButton"
        class="attachmentOption"
        type="button"
      >

        <span class="attachmentOptionIcon">
          🎥
        </span>

        <span>
          Select Video
        </span>

      </button>
<button
  id="selectFileButton"
  class="attachmentOption"
  type="button"
>

  <span class="attachmentOptionIcon">
    📄
  </span>

  <span>
    Select File
  </span>

</button>
    </div>


    <!-- =================================================
         MESSAGE TEXT
    ================================================== -->

    <!-- =================================================
         SEND BUTTON
    ================================================== -->

    <button

      type="button"

</main>


<!-- =====================================================
   HIDDEN FILE INPUTS
===================================================== -->

<input

>

>

<!-- =====================================================
   FULL-SCREEN MEDIA VIEWER
===================================================== -->

<div
  id="mediaViewer"
  class="mediaViewer"
  role="dialog"
  aria-modal="true"
  aria-hidden="true"
  aria-label="Full-screen media viewer"
>

    id="viewerCloseButton"
    class="viewerCloseButton"
    type="button"
    aria-label="Close media viewer"
  >
    ×
  </button>


  <img
    id="viewerImage"
    class="viewerImage"
    alt="Full-screen shared picture"
  >


  <video
    id="viewerVideo"
    class="viewerVideo"
    controls
    playsinline
  ></video>

</div>


<!-- =====================================================
   BUSY OVERLAY
===================================================== -->

<div
  id="chatBusyOverlay"
  class="chatBusyOverlay"
  aria-hidden="true"
>

  <div class="chatBusyCard">

    <div class="chatBusyIcon">
      ⏳
    </div>

    <div
      id="chatBusyText"
      class="chatBusyText"
    >
      Please wait...
    </div>

  </div>

</div>

<!-- =====================================================
   INCOMING VOICE CALL OVERLAY
===================================================== -->

<div
  id="incomingCallOverlay"
  class="incomingCallOverlay"
  aria-hidden="true"
>

  <div class="incomingCallCard">

    <div
  id="incomingCallTitle"
  class="incomingCallTitle"
>
  Incoming Voice Call
</div>


    <div class="incomingCallerAvatarFrame">

      <img
        id="incomingCallerAvatar"
        class="incomingCallerAvatar"
        src="images/profile.png"
        alt="Incoming caller profile picture"
      >

    </div>


    <div
      id="incomingCallerName"
      class="incomingCallerName"
    >
      Faith Connect Member
    </div>


    <div class="incomingCallText">
      is calling you...
    </div>


    <div class="incomingCallActions">

      <div class="incomingCallAction">

        <button
          id="declineIncomingCallButton"
          class="incomingCallActionButton decline"
          type="button"
          aria-label="Decline incoming call"
        >
          📵
        </button>

        <span class="incomingCallActionLabel">
          Decline
        </span>

      </div>


      <div class="incomingCallAction">

        <button
          id="acceptIncomingCallButton"
          class="incomingCallActionButton accept"
          type="button"
          aria-label="Accept incoming call"
        >
          📞
        </button>

        <span class="incomingCallActionLabel">
          Accept
        </span>

      </div>

    </div>

  </div>

</div>

<!-- =====================================================
   OPEN JAVASCRIPT MODULE
===================================================== -->

<script>
/* Startup watchdog: shows a clear message on screen if chat.js
   is old, incomplete, missing or blocked (instead of staying on
   "Loading conversation..." forever). */
(function(){
  function show(text){
    var area=document.getElementById("chatArea");
    var box='<div style="margin:20px;padding:16px;border-radius:14px;background:#fdecec;color:#8a1f1f;font:700 14px/1.6 Arial,sans-serif;text-align:left">'+text+'</div>';
    if(area){ area.innerHTML=box; } else { document.body.insertAdjacentHTML("afterbegin",box); }
  }
  window.addEventListener("error",function(e){
    if(window.__chatLoaderRan) return;
    show("Chat file problem: "+(e.message||"error")+"<br>File: "+String(e.filename||"").split("/").pop()+" (line "+(e.lineno||"?")+"). Upload chat.js again.");
  });
  setTimeout(function(){
    if(!window.__chatLoaderRan){
      show("chat.js did not start. It is missing, old or incomplete. Upload the new chat.js (small loader, about 2 KB) and chat-part1.js to chat-part4.js, then reload.");
    }
  },7000);
})();
</script>
<script type="module" src="chat.js?v=20261006"></script>

</body>

</html>
