/* =====================================================
   PART 1 OF 10
   GENERAL PAGE, CHAT HEADER

/* =====================================================
   GENERAL RESET
===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}


html,
body{
  width:100%;
  height:100%;
}


body{

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#eef3f8;
  color:#111111;

  display:flex;
  flex-direction:column;

  overflow:hidden;

}


button,
input,
textarea{
  font-family:inherit;
}


button{
  cursor:pointer;
}


button,
a{
  -webkit-tap-highlight-color:transparent;
}


img,
video{
  display:block;
  max-width:100%;
}


/* =====================================================
   ACCESSIBILITY
===================================================== */

button:focus-visible,
input:focus-visible,
textarea:focus-visible{

  outline:
    3px solid
    rgba(255,255,255,.40);

  outline-offset:3px;

}


/* =====================================================
   CHAT HEADER
===================================================== */

.chatHeader{

  position:relative;
  z-index:100;

  flex-shrink:0;

  min-height:70px;

  padding:10px 13px;

  display:flex;
  align-items:center;
  gap:10px;

  background:
    linear-gradient(
      135deg,
      #087bd1,
      #005cae
    );

  color:#ffffff;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.18);

}


/* =====================================================
   BACK BUTTON
===================================================== */

.backButton{

  width:43px;
  height:43px;
  flex-shrink:0;

  border:0;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    rgba(255,255,255,.18);

  color:#ffffff;

  font-size:24px;
  font-weight:900;

  transition:
    background .2s ease,
    transform .2s ease;

}


.backButton:hover{

  background:
    rgba(255,255,255,.30);

}


.backButton:active{
  transform:scale(.95);
}


/* =====================================================
   MEMBER AVATAR
===================================================== */

.avatarWrapper{

  position:relative;

  flex-shrink:0;

}


.chatAvatar{

  width:54px;
  height:54px;

  border-radius:50%;

  object-fit:cover;

  background:#ffffff;

  border:
    2px solid
    rgba(255,255,255,.90);

  cursor:pointer;

}


/* =====================================================
   ONLINE STATUS DOT
===================================================== */

.onlineDot{

  position:absolute;

  right:1px;
  bottom:1px;

  width:15px;
  height:15px;

  border-radius:50%;

  background:#8b9aaa;

  border:
    3px solid
    #087bd1;

}


.onlineDot.online{
  background:#20c66b;
}


/* =====================================================
   MEMBER HEADER INFORMATION
===================================================== */

.chatHeaderInformation{

  min-width:0;
  flex:1;

}


.chatName{

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  font-size:19px;
  font-weight:900;
  line-height:1.25;

  cursor:pointer;

}


.chatName:hover{
  text-decoration:underline;
}


.chatStatus{

  margin-top:4px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  color:#dcecff;

  font-size:12px;
  font-weight:700;

}


/* =====================================================
   HEADER ACTIONS
===================================================== */

.headerActions{

  flex-shrink:0;

  display:flex;
  align-items:center;
  gap:7px;

}


/* =====================================================
   VOICE CALL BUTTON
===================================================== */

  width:44px;
  height:44px;

  border:0;
  border-radius:50%;

  align-items:center;
  justify-content:center;

    rgba(255,255,255,.18);

  color:#ffffff;

  font-size:21px;

    transform .2s ease;

  background:

.voiceCallButton:active{

/* =====================================================
   CHAT PAGE LAYOUT
===================================================== */

.chatPage{

  min-height:0;
  flex:1;

  display:flex;
  flex-direction:column;

  background:#f5f7fb;

/* =====================================================
   CHAT AREA
===================================================== */

.chatArea{

  min-height:0;

/* =====================================================
   GET FIRST AVAILABLE VALUE
===================================================== */

function getFirstValue(
  ...values
){

  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value).trim();

    }

  }

  return "";

}


/* =====================================================
   CREATE SAFE CONVERSATION ID
===================================================== */

function createConversationId(
  firstUid,
  secondUid
){

  return [
    firstUid,
    secondUid
  ]
  .sort()
  .join("_");

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  const temporaryElement =
  document.createElement(
    "div"
  );


  temporaryElement.textContent =
  String(
    value ?? ""
  );


  return temporaryElement.innerHTML;

}

/* =====================================================
   FORMAT MESSAGE TIME
===================================================== */

function formatMessageTime(
  timestamp
){

  if(!timestamp){

    return "";

  }


  let messageDate;


  if(
    typeof timestamp.toDate ===
    "function"
  ){

    messageDate =
    timestamp.toDate();

  }else if(
    timestamp.seconds
  ){

    messageDate =
    new Date(
      timestamp.seconds * 1000
    );

  }else{

    messageDate =
    new Date(timestamp);

  }


  if(
    Number.isNaN(
      messageDate.getTime()
    )
  ){

    return "";

  }


  return messageDate
  .toLocaleTimeString(
    [],
    {
      hour:
      "2-digit",

      minute:
      "2-digit"
    }
  );

}


/* =====================================================
   FORMAT MESSAGE DATE
===================================================== */

function formatMessageDate(
  timestamp
){

  if(!timestamp){

    return "Today";

  }


  let messageDate;


  if(
    typeof timestamp.toDate ===
    "function"
  ){

    messageDate =
    timestamp.toDate();

  }else if(
    timestamp.seconds
  ){

    messageDate =
    new Date(
      timestamp.seconds * 1000
    );

  }else{

    messageDate =
    new Date(timestamp);

  }


  if(
    Number.isNaN(
      messageDate.getTime()
    )
  ){

    return "Today";

  }


  const today =
  new Date();


  const yesterday =
  new Date();


  yesterday.setDate(
    today.getDate() - 1
  );


  if(
    messageDate.toDateString() ===
    today.toDateString()
  ){

    return "Today";

  }


  if(
    messageDate.toDateString() ===
    yesterday.toDateString()
  ){

    return "Yesterday";

  }


  return messageDate
  .toLocaleDateString(
    [],
    {
      day:
      "numeric",

      month:
      "short",

      year:
      "numeric"
    }
  );

}


/* =====================================================
   FORMAT LAST SEEN
===================================================== */

function formatLastSeen(
  timestamp
){

  if(!timestamp){

    return "Offline";

  }


  let lastSeenDate;


  if(
    typeof timestamp.toDate ===
    "function"
  ){

    lastSeenDate =
    timestamp.toDate();

  }else if(
    timestamp.seconds
  ){

    lastSeenDate =
    new Date(
      timestamp.seconds * 1000
    );

  }else{

    lastSeenDate =
    new Date(timestamp);

  }


  if(
    Number.isNaN(
      lastSeenDate.getTime()
    )
  ){

    return "Offline";

  }


  const now =
  new Date();


  const differenceMinutes =
  Math.floor(
    (
      now.getTime() -
      lastSeenDate.getTime()
    ) / 60000
  );


  if(differenceMinutes < 1){

    return "Last seen just now";

  }


  if(differenceMinutes < 60){

    return `Last seen ${differenceMinutes} minute${
      differenceMinutes === 1
      ? ""
      : "s"
    } ago`;

  }


  const differenceHours =
  Math.floor(
    differenceMinutes / 60
  );


  if(differenceHours < 24){

    return `Last seen ${differenceHours} hour${
      differenceHours === 1
      ? ""
      : "s"
    } ago`;

  }


  return `Last seen ${
    lastSeenDate.toLocaleDateString(
      [],
      {
        day:
        "numeric",

        month:
        "short"
      }
    )
  } at ${
    lastSeenDate.toLocaleTimeString(
      [],
      {
        hour:
        "2-digit",

        minute:
        "2-digit"
      }
    )
  }`;

}

    profileData?.lastSeen

/* =====================================================
   PREPARE PRIVATE CONVERSATION
===================================================== */

async function prepareConversation(){

  if(!currentUser){

    return;

  }


  if(!otherUid){

    showChatError(
      "Unable to open this conversation because the member identification is missing."
    );

    chatName.textContent =
    "Member not found";


    chatStatus.textContent =
    "Invalid chat link";


    return;

  }


  if(
    otherUid ===
    currentUser.uid
  ){

    showChatError(
      "You cannot open a private conversation with your own account."
    );


    chatName.textContent =
    "Your profile";


    chatStatus.textContent =
    "Private chat unavailable";


    return;

  }


  conversationId =
  createConversationId(
    currentUser.uid,
    otherUid
  );


  try{

    await Promise.all(
      [
        loadCurrentUserProfile(),
        loadOtherMemberProfile()
      ]
    );


    await setCurrentUserOnline();


    watchOtherMemberStatus();


    startTypingListener();


    loadMessages();


    enableChatControls();


    messageInput.focus();

  }catch(error){

    console.error(

/* =====================================================
   LISTEN FOR INCOMING VOICE CALLS
===================================================== */

function stopIncomingCallListener(){

  if(
    typeof unsubscribeIncomingCalls ===
    "function"
  ){

    unsubscribeIncomingCalls();

  }

  unsubscribeIncomingCalls =
  null;

}


function startIncomingCallListener(){

  stopIncomingCallListener();


  if(!currentUser){

    return;

  }


  const incomingCallsQuery =
  query(
    collection(
      db,
      "voiceCalls"
    ),
    where(
      "receiverId",
      "==",
      currentUser.uid
    )
  );


  unsubscribeIncomingCalls =
  onSnapshot(

    incomingCallsQuery,

    function(snapshot){

      snapshot.docChanges()
      .forEach(
        function(change){

          const incomingCallId =
          change.doc.id;


          const incomingCall =
          change.doc.data();


          const callStatusValue =
          String(
            incomingCall.status ||
            ""
          ).toLowerCase();


          /* Hide an overlay when the call ends */

          if(
            incomingCallId ===
            currentIncomingCallId &&
            callStatusValue !==
            "ringing"
          ){

            hideIncomingCallOverlay();

            return;

          }


          /* Ignore calls that are not ringing */

          if(
            callStatusValue !==
            "ringing" ||
            incomingCall.receiverId !==
            currentUser.uid
          ){

            return;

          }


          /* Avoid displaying the same call twice */

          if(
            incomingCallId ===
            currentIncomingCallId
          ){

            return;

          }


          openedIncomingCallId =
          incomingCallId;


          /* Confirm that overlay elements exist */

          if(
            !incomingCallOverlay ||
            !incomingCallerName ||
            !incomingCallerAvatar ||
            !acceptIncomingCallButton ||
            !declineIncomingCallButton
          ){

            console.error(
              "Incoming-call overlay elements are missing."
            );

            return;

          }


          showIncomingCallOverlay(
            incomingCallId,
            incomingCall
          );

        }
      );

    },

    function(error){

      console.error(
        "Incoming voice-call listener error:",
        error
      );


      if(
        error?.code ===
        "permission-denied"
      ){

        console.error(
          "Firebase rules denied access to incoming voice calls."
        );

      }

    }

  );

}

/* =====================================================
   FORMAT FILE SIZE
===================================================== */

function formatFileSize(
  bytes
){

  const safeBytes =
  Number(bytes) || 0;


  if(safeBytes < 1024){

    return `${safeBytes} B`;

  }


  if(safeBytes < 1024 * 1024){

    return `${(
      safeBytes / 1024
    ).toFixed(1)} KB`;

  }


  return `${(
    safeBytes /
    (
      1024 * 1024
    )
  ).toFixed(1)} MB`;

}


/* =====================================================
   GET FILE EXTENSION
===================================================== */

function getFileExtension(
  fileName
){

  const safeName =
  String(
    fileName || ""
  );


  const lastDotIndex =
  safeName.lastIndexOf(
    "."
  );


  if(
    lastDotIndex === -1 ||
    lastDotIndex ===
    safeName.length - 1
  ){

    return "";

  }


  return safeName
  .slice(
    lastDotIndex + 1
  )
  .toLowerCase();

}

/* =====================================================
   UPLOAD MEDIA TO CLOUDINARY
===================================================== */

function uploadMediaToCloudinary(
  file
){

  return new Promise(
    function(resolve,reject){

      if(!file){

        reject(
  new Error(
    "No file was selected."
  )
);


        return;

      }


      const formData =
      new FormData();


      formData.append(
        "file",
        file
      );


      formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
      );


      formData.append(
        "folder",
        "sabasaba_private_chat"
      );


      const uploadRequest =
      new XMLHttpRequest();


      uploadRequest.open(
        "POST",
        CLOUDINARY_UPLOAD_URL,
        true
      );


      uploadRequest.upload.addEventListener(
        "progress",
        function(event){

          if(
            !event.lengthComputable
          ){

            return;

          }


          const uploadPercent =
          (
            event.loaded /
            event.total
          ) * 100;


          updateUploadProgress(
  uploadPercent,
  selectedMediaType ===
  "audio"
  ? "Uploading voice message..."
  : selectedMediaType ===
    "video"
  ? "Uploading video..."
  : selectedMediaType ===
    "file"
  ? "Uploading document..."
  : "Uploading picture..."
);

        }
      );


      uploadRequest.addEventListener(
        "load",
        function(){

          let responseData =
          null;


          try{

            responseData =
            JSON.parse(
              uploadRequest.responseText
            );

          }catch(error){

            reject(
              new Error(
                "Cloudinary returned an invalid response."
              )
            );


            return;

          }


          if(
            uploadRequest.status >=
            200 &&
            uploadRequest.status <
            300 &&
            responseData?.secure_url
          ){

            updateUploadProgress(
              100,
              "Upload complete"
            );


            resolve(
  {
    url:
    responseData.secure_url,

    publicId:
    responseData.public_id ||
    "",

    resourceType:
    responseData.resource_type ||
    "",

    format:
    responseData.format ||
    selectedFileExtension ||
    "",

    duration:
    responseData.duration ||
    0,

    originalFilename:
    responseData.original_filename ||
    selectedFileName ||
    ""
  }
);


            return;

          }


          reject(
            new Error(
              responseData?.error?.message ||
              "Cloudinary upload failed."
            )
          );

        }
      );


      uploadRequest.addEventListener(
        "error",
        function(){

          reject(
            new Error(
              "Unable to upload media. Check your internet connection."
            )
          );

        }
      );


      uploadRequest.addEventListener(
        "abort",
        function(){

          reject(
            new Error(
              "The media upload was cancelled."
            )
          );

        }
      );


      uploadRequest.send(
        formData
      );

    }
  );

}

/* =====================================================
   FORMAT RECORDING TIME
===================================================== */

function formatRecordingTime(
  seconds
){

  const safeSeconds =
  Math.max(
    0,
    Math.floor(seconds)
  );


  const minutes =
  Math.floor(
    safeSeconds / 60
  );


  const remainingSeconds =
  safeSeconds % 60;


  return `${String(minutes).padStart(
    2,
    "0"
  )}:${String(remainingSeconds).padStart(
    2,
    "0"
  )}`;

}


/* =====================================================
   UPDATE RECORDING TIMER
===================================================== */

function updateRecordingTimer(){

  recordingTime.textContent =
  formatRecordingTime(
    recordingSeconds
  );

}


/* =====================================================
   START RECORDING TIMER
===================================================== */

function startRecordingTimer(){

  stopRecordingTimer();


  recordingSeconds =
  0;


  updateRecordingTimer();


  recordingTimerInterval =
  window.setInterval(
    function(){

      recordingSeconds +=
      1;


      updateRecordingTimer();


      const maximumRecordingSeconds =
      300;


      if(
        recordingSeconds >=
        maximumRecordingSeconds
      ){

        stopVoiceRecording();

      }

    },
    1000
  );

}


/* =====================================================
   STOP RECORDING TIMER
===================================================== */

function stopRecordingTimer(){

  if(
    recordingTimerInterval
  ){

    window.clearInterval(
      recordingTimerInterval
    );

  }


  recordingTimerInterval =
  null;

}


/* =====================================================
   CHOOSE SUPPORTED AUDIO TYPE
===================================================== */

function getSupportedAudioMimeType(){

  const possibleTypes = [

    "audio/webm;codecs=opus",

    "audio/webm",

    "audio/ogg;codecs=opus",

    "audio/mp4"

  ];


  for(
    const mimeType
    of possibleTypes
  ){

    if(
      window.MediaRecorder &&
      MediaRecorder.isTypeSupported(
        mimeType
      )
    ){

      return mimeType;

    }

  }


  return "";

}


/* =====================================================
   GET AUDIO FILE EXTENSION
===================================================== */

function getAudioFileExtension(
  mimeType
){

  const normalizedType =
  String(
    mimeType || ""
  ).toLowerCase();


  if(
    normalizedType.includes(
      "ogg"
    )
  ){

    return "ogg";

  }


  if(
    normalizedType.includes(
      "mp4"
    )
  ){

    return "m4a";

  }


  return "webm";

}


/* =====================================================
   RELEASE MICROPHONE STREAM
===================================================== */

function releaseRecordingStream(){

  if(
    !recordingStream
  ){

    return;

  }


  recordingStream
  .getTracks()
  .forEach(
    function(track){

      track.stop();

    }
  );


  recordingStream =
  null;

}


/* =====================================================
   RESET RECORDING INTERFACE
===================================================== */

function resetRecordingInterface(){

  isRecording =
  false;


  voiceButton.classList.remove(
    "recording"
  );


  voiceRecordingPanel.classList.remove(
    "show"
  );


  stopRecordingTimer();


  recordingSeconds =
  0;


  updateRecordingTimer();


  releaseRecordingStream();

}


/* =====================================================
   START VOICE RECORDING
===================================================== */

async function startVoiceRecording(){

  if(
    sendingMessage ||
    !chatIsReady
  ){

    return;

  }


  closeInputMenus();


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    alert(
      "Voice recording is not supported by this browser."
    );


    return;

  }


  if(
    typeof MediaRecorder ===
    "undefined"
  ){

    alert(
      "Voice recording is not supported on this device."
    );


    return;

  }


  try{

    clearSelectedMedia();


    recordingStream =
    await navigator.mediaDevices
    .getUserMedia(
      {
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        },

        video:false
      }
    );


    const supportedMimeType =
    getSupportedAudioMimeType();


    const mediaRecorderOptions =
    supportedMimeType
    ? {
        mimeType:
        supportedMimeType
      }
    : undefined;


    mediaRecorder =
    new MediaRecorder(
      recordingStream,
      mediaRecorderOptions
    );


    recordedAudioChunks =
    [];


    recordedAudioBlob =
    null;


    recordedAudioFile =
    null;


    mediaRecorder.addEventListener(
      "dataavailable",
      function(event){

        if(
          event.data &&
          event.data.size > 0
        ){

          recordedAudioChunks.push(
            event.data
          );

        }

      }
    );


    mediaRecorder.addEventListener(
      "stop",
      function(){

        const finalMimeType =
        mediaRecorder.mimeType ||
        supportedMimeType ||
        "audio/webm";


        recordedAudioBlob =
        new Blob(
          recordedAudioChunks,
          {
            type:
            finalMimeType
          }
        );


        recordedAudioChunks =
        [];


        if(
          recordedAudioBlob.size ===
          0
        ){

          resetRecordingInterface();


          alert(
            "No sound was recorded. Please try again."
          );


          return;

        }


        const audioExtension =
        getAudioFileExtension(
          finalMimeType
        );


        const audioFilename =
        `voice-message-${Date.now()}.${audioExtension}`;


        recordedAudioFile =
        new File(
          [
            recordedAudioBlob
          ],
          audioFilename,
          {
            type:
            finalMimeType
          }
        );


        resetRecordingInterface();


        showAudioPreview(
          recordedAudioFile
        );

      }
    );


    mediaRecorder.addEventListener(
      "error",
      function(event){

        console.error(
          "Voice recording error:",
          event.error
        );


        resetRecordingInterface();


        alert(
          "Voice recording failed. Please try again."
        );

      }
    );


    mediaRecorder.start(
      250
    );


    isRecording =
    true;


    voiceButton.classList.add(
      "recording"
    );


    voiceRecordingPanel.classList.add(
      "show"
    );


    startRecordingTimer();

  }catch(error){

    console.error(
      "Unable to start voice recording:",
      error
    );


    resetRecordingInterface();


    if(
      error?.name ===
      "NotAllowedError"
    ){

      alert(
        "Microphone permission was denied. Allow microphone access and try again."
      );


      return;

    }


    if(
      error?.name ===
      "NotFoundError"
    ){

      alert(
        "No microphone was found on this device."
      );


      return;

    }


    if(
      error?.name ===
      "NotReadableError"
    ){

      alert(
        "The microphone is already being used by another app."
      );


      return;

    }


    alert(
      "Unable to start voice recording."
    );

  }

}


/* =====================================================
   STOP VOICE RECORDING
===================================================== */

function stopVoiceRecording(){

  if(
    !isRecording ||
    !mediaRecorder
  ){

    return;

  }


  if(
    mediaRecorder.state !==
    "inactive"
  ){

    mediaRecorder.stop();

  }


  isRecording =
  false;


  voiceButton.classList.remove(
    "recording"
  );


  voiceRecordingPanel.classList.remove(
    "show"
  );


  stopRecordingTimer();

}


/* =====================================================
   CANCEL VOICE RECORDING
===================================================== */

function cancelVoiceRecording(){

  if(!mediaRecorder){

    resetRecordingInterface();


    return;

  }


  try{

    mediaRecorder.ondataavailable =
    null;


    mediaRecorder.onstop =
    null;


    if(
      mediaRecorder.state !==
      "inactive"
    ){

      mediaRecorder.stop();

    }

  }catch(error){

    console.error(
      "Voice recording cancellation error:",
      error
    );

  }


  recordedAudioChunks =
  [];


  recordedAudioBlob =
  null;


  recordedAudioFile =
  null;


  clearSelectedMedia();


  resetRecordingInterface();

}

      className:

function appendMessageContent(
  messageBubble,
  messageData
){

  const mediaType =
  getMessageMediaType(
    messageData
  );


  let mediaElement =
  null;


  if(
    mediaType ===
    "image"
  ){

    mediaElement =
    createImageMessageElement(
      messageData
    );

  }else if(
    mediaType ===
    "video"
  ){

    mediaElement =
    createVideoMessageElement(
      messageData
    );

  }else if(
    mediaType ===
    "audio" ||
    mediaType ===
    "voice"
  ){

    mediaElement =
    createVoiceMessageElement(
      messageData
    );

  }
  else if(
  mediaType ===
  "file"
){

  mediaElement =
  createFileMessageElement(
    messageData
  );

}

  if(mediaElement){

    messageBubble.appendChild(
      mediaElement
    );


    const captionElement =
    createMediaCaptionElement(
      messageData
    );


    if(captionElement){

      messageBubble.appendChild(
        captionElement
      );

    }


    return;

  }


  const textElement =
  createTextMessageElement(
    messageData
  );


  if(textElement){

    messageBubble.appendChild(
      textElement
    );

  }

}

    deleteForEveryoneButton.type =
    "button";


    deleteForEveryoneButton.className =
    "messageOption deleteForEveryone";


    deleteForEveryoneButton.textContent =
    "Delete for everyone";


    deleteForEveryoneButton.addEventListener(
      "click",
      async function(){

        messageMenu.classList.remove(
          "show"
        );


        await deleteMessageForEveryone(
          messageId
        );

      }
    );


    messageMenu.appendChild(
      deleteForEveryoneButton
    );

  }


  /* Open or close message menu */

  menuButton.addEventListener(
    "click",
    function(event){

      event.stopPropagation();

      messageMenu.classList.contains(
        "show"
      );


      closeAllMessageMenus();


      if(!menuWasOpen){

        messageMenu.classList.add(
          "show"
        );

      }

    }
  );


  return {
    menuButton,
    messageMenu
  };

/* =====================================================
   CREATE COMPLETE MESSAGE ELEMENT
===================================================== */

function createMessageElement(
  messageId,
  messageData
){

  if(
    !currentUser ||
    !messageId
  ){

    return null;

  }


  const senderId =
  getFirstValue(
    messageData.senderId,
    messageData.userId,
    messageData.authorId
  );


  const isMine =
  senderId ===
  currentUser.uid;


  const deletedFor =
  Array.isArray(
    messageData.deletedFor
  )
  ? messageData.deletedFor
  : [];


  /* Do not show messages deleted for this user */

  if(
    deletedFor.includes(
      currentUser.uid
    )
  ){

    return null;

  }


  const messageRow =
  document.createElement(
    "div"
  );


  messageRow.className =
  isMine
  ? "messageRow mineRow"
  : "messageRow otherRow";


  messageRow.dataset.messageId =
  messageId;


  const messageBubble =
  document.createElement(
    "div"
  );


  messageBubble.className =
  isMine
  ? "messageBubble mine"
  : "messageBubble other";


  /* Message options */

  const {
    menuButton,
    messageMenu
  } =
  createMessageMenu(
    messageId,
    isMine
  );


  messageBubble.appendChild(
    menuButton
  );


  messageBubble.appendChild(
    messageMenu
  );


  /* Message content */

  if(
    messageData.deletedForEveryone ===
    true
  ){

    messageBubble.appendChild(
      createDeletedMessageContent()
    );

  }else{

    appendMessageContent(
      messageBubble,
      messageData
    );

  }


  /* Footer */

  messageBubble.appendChild(
    createMessageFooter(
      messageData,
      isMine
    )
  );


  messageRow.appendChild(
    messageBubble
  );


  return messageRow;

}

/* =====================================================

===================================================== */

async function markMessageAsDelivered(
  messageId,
  messageData
){

  if(
    !currentUser ||
    !conversationId ||
    !messageId
  ){

    return;

  }


  if(
    messageData.senderId ===
    currentUser.uid
  ){

    return;

  }


  if(
    messageData.delivered ===
    true
  ){

    return;

  }


  try{

    await updateDoc(
      doc(
        db,
        "conversations",
        conversationId,
        "messages",
        messageId
      ),
      {

        delivered:
        true,

        deliveredAt:
        serverTimestamp()

      }
    );

  }catch(error){

    console.error(
      "Unable to mark message as delivered:",
      error
    );

  }

}


/* =====================================================
   MARK MESSAGE AS READ
===================================================== */

async function markMessageAsRead(
  messageId,
  messageData
){

  if(
    !currentUser ||
    !conversationId ||
    !messageId
  ){

    return;

  }


  if(
    messageData.senderId ===
    currentUser.uid
  ){

    return;

  }


  if(
    messageData.read ===
    true
  ){

    return;

  }


  if(
    document.visibilityState !==

  ){

    return;

  }


  try{

        "conversations",
        conversationId,
        "messages",
        messageId
      ),
      {

        delivered:
        true,

        deliveredAt:
        messageData.deliveredAt ||
        serverTimestamp(),

        read:
        true,

        readAt:
        serverTimestamp()

      }
    );

  }catch(error){

    console.error(
      "Unable to mark message as read:",
      error
    );

  }

}


/* =====================================================
   UPDATE INCOMING MESSAGE RECEIPTS
===================================================== */

async function updateIncomingMessageReceipts(
  messageId,
  messageData
){

  if(
    !currentUser ||
    messageData.senderId ===
    currentUser.uid
  ){

    return;

  }


  await markMessageAsDelivered(
    messageId,
    messageData
  );


  if(
    document.visibilityState ===
    "visible"
  ){

    await markMessageAsRead(
      messageId,
      messageData
    );

  }

}


/* =====================================================
   MARK ALL VISIBLE MESSAGES AS READ
===================================================== */

async function markVisibleConversationAsRead(){

  if(
    !currentUser ||
    !conversationId ||
    document.visibilityState !==
    "visible"
  ){

    return;

  }


  const visibleMessageRows =
  chatArea.querySelectorAll(
    "[data-message-id]"
  );


  for(
    const messageRow
    of visibleMessageRows
  ){

    const messageId =
    messageRow.dataset.messageId;


    if(!messageId){

      continue;

    }


    try{

      const messageReference =
      doc(
        db,
        "conversations",
        conversationId,
        "messages",
        messageId
      );


      const messageSnapshot =
      await getDoc(
        messageReference
      );


      if(
        !messageSnapshot.exists()
      ){

        continue;

      }


      const messageData =
      messageSnapshot.data();


      if(
        messageData.senderId !==
        currentUser.uid &&
        messageData.read !==
        true
      ){

        await updateDoc(
          messageReference,
          {

            delivered:
            true,

            deliveredAt:
            messageData.deliveredAt ||
            serverTimestamp(),

            read:
            true,

            readAt:
            serverTimestamp()

          }
        );

      }

    }catch(error){

      console.error(
        "Unable to update visible message:",
        error
      );

    }

  }

}

/* =====================================================
   RENDER ALL MESSAGES
===================================================== */

async function renderMessages(
  messagesSnapshot
){

  const userWasNearBottom =
  (
    chatArea.scrollHeight -
    chatArea.scrollTop -
    chatArea.clientHeight
  ) < 150;


  chatArea.innerHTML =
  "";


  if(
    messagesSnapshot.empty
  ){

    renderEmptyConversation();


    return;

  }


  let lastDateLabel =
  "";


  let newMessageIndicatorAdded =
  false;


  const receiptUpdates =
  [];


  messagesSnapshot.forEach(
    function(messageSnapshot){

      const messageId =
      messageSnapshot.id;


      const messageData =
      messageSnapshot.data();


      const dateLabel =
      formatMessageDate(
        messageData.timestamp ||
        messageData.createdAt
      );


      if(
        dateLabel !==
        lastDateLabel
      ){

        chatArea.appendChild(
          createMessageDateDivider(
            dateLabel
          )
        );


        lastDateLabel =
        dateLabel;

      }


      if(
        !newMessageIndicatorAdded &&
        messageIsUnread(
          messageData
        )
      ){

        chatArea.appendChild(
          createNewMessageIndicator()
        );


        newMessageIndicatorAdded =
        true;

      }


      const messageElement =
      createMessageElement(
        messageId,
        messageData
      );


      if(messageElement){

        chatArea.appendChild(
          messageElement
        );

      }


      if(
        currentUser &&
        messageData.senderId !==
        currentUser.uid
      ){

        receiptUpdates.push(
          updateIncomingMessageReceipts(
            messageId,
            messageData
          )
        );

      }

    }
  );


  if(
    receiptUpdates.length > 0
  ){

    await Promise.allSettled(
      receiptUpdates
    );

  }


  if(
    userWasNearBottom ||
    newMessageIndicatorAdded
  ){

    scrollToLatestMessage();

  }

}


/* =====================================================
   LOAD REAL-TIME MESSAGES
===================================================== */

function loadMessages(){

  if(
    !currentUser ||
    !conversationId
  ){

    return;

  }


  stopMessagesListener();


  chatArea.innerHTML = `

    <div class="loadingMessage">

      Loading conversation...

    </div>

  `;


  const messagesQuery =
  query(
    getMessagesCollectionReference(),
    orderBy(
      "timestamp",
      "asc"
    )
  );


  unsubscribeMessages =
  onSnapshot(

    messagesQuery,

    async function(messagesSnapshot){

      try{

        await renderMessages(
          messagesSnapshot
        );

      }catch(error){

        console.error(
          "Message rendering error:",
          error
        );


        renderMessageLoadError();

      }

    },

    function(error){

      console.error(
        "Unable to load messages:",
        error
      );


      renderMessageLoadError();

    }

  );

}

async function deleteMessageForEveryone(
  messageId
){

  if(
    !currentUser ||
    !conversationId
  ){
    return;
  }

  const confirmed =
  window.confirm(
    "Delete this message for everyone?"
  );

/* =====================================================
   GET MESSAGE PREVIEW
===================================================== */

function getMessagePreview(
  messageText,
  mediaType
){

  const cleanedMessage =
  String(
    messageText || ""
  ).trim();


  if(cleanedMessage){

    return cleanedMessage.length > 80
    ? `${cleanedMessage.slice(
        0,
        80
      )}...`
    : cleanedMessage;

  }


  if(mediaType === "image"){

    return "📷 Picture";

  }


  if(mediaType === "video"){

    return "🎥 Video";

  }


  if(
    mediaType === "audio" ||
    mediaType === "voice"
  ){

    return "🎤 Voice message";

  }

  if(mediaType === "file"){

  return selectedFileName
  ? `📄 ${selectedFileName}`
  : "📄 Document";

}
  return "New message";

}

        participantNames:
        {
          [currentUser.uid]:
          currentUserName,

          [otherUid]:
          otherUserName
        },

        participantPictures:
        {
          [currentUser.uid]:
          currentUserPicture,

          [otherUid]:
          otherUserPicture
        },

        lastMessage:
        previewText,

        lastMessageText:
        messageText || "",

        lastMessageType:
        mediaType || "none",

        lastMediaUrl:
        mediaUrl || "",

        lastMessageId:
        messageId || "",

        lastSenderId:
        currentUser.uid,

        updatedAt:
        serverTimestamp()

      },
      {
        merge:true
      }
    );

  }catch(error){

    console.error(
      "Conversation summary update error:",
      error
    );

  }

}


/* =====================================================
   CREATE PRIVATE MESSAGE NOTIFICATION
===================================================== */

async function createMessageNotification(
  {
    messageText,
    mediaType,
    messageId
  }
){

  if(
    !currentUser ||
    !otherUid
  ){

    return;

  }


  const senderName =
  getProfileName(
    currentProfile,
    getFirstValue(
      currentUser.displayName,
      currentUser.email,
      "Member"
    )
  );


  const senderPicture =
  getProfilePicture(
    currentProfile
  );


  const notificationMessage =
  getMessagePreview(
    messageText,
    mediaType
  );


  try{

    await addDoc(
      collection(
        db,
        "notifications"
      ),
      {

        recipientId:
        otherUid,

        receiverId:
        otherUid,

        userId:
        otherUid,

        senderId:
        currentUser.uid,

        senderName:
        senderName,

        senderPicture:
        senderPicture,

        type:
        "private_message",

        message:
        notificationMessage,

        conversationId:
        conversationId,

        messageId:
        messageId || "",

        targetUrl:
        `chat.html?uid=${encodeURIComponent(
          currentUser.uid
        )}`,

        read:
        false,

        timestamp:
        serverTimestamp(),

        createdAt:
        serverTimestamp()

      }
    );

  }catch(error){

    console.error(
      "Private-message notification error:",
      error
    );

  }

}


/* =====================================================
   RESET COMPOSER AFTER SENDING
===================================================== */

function resetMessageComposer(){

  messageInput.value =
  "";


  messageInput.style.height =
  "auto";


  clearSelectedMedia();


  currentUserTyping =
  false;


  window.clearTimeout(
    typingStopTimer
  );


  updateTypingStatus(
    false
  );


  messageInput.focus();

}


/* =====================================================
   SEND PRIVATE MESSAGE
===================================================== */

async function sendMessage(){

  if(
    sendingMessage ||
    !chatIsReady ||
    !currentUser ||
    !otherUid ||
    !conversationId
  ){

    return;

  }


  if(isRecording){

    alert(
      "Stop or cancel the voice recording before sending."
    );


    return;

  }


  const messageText =
  messageInput.value.trim();


  const hasMedia =
  Boolean(
    selectedMediaFile &&
    selectedMediaType !==
    "none"
  );


  if(
    !messageText &&
    !hasMedia
  ){

    messageInput.focus();


    return;

  }


  setSendingState(
    true
  );


  let finalMediaUrl =
  "";


  let finalMediaPublicId =
  "";


  let finalMediaFormat =
  "";


  let finalMediaDuration =
  0;


  try{

    if(hasMedia){

      updateUploadProgress(
  0,
  selectedMediaType ===
  "audio"
  ? "Uploading voice message..."
  : selectedMediaType ===
    "video"
  ? "Uploading video..."
  : selectedMediaType ===
    "file"
  ? "Uploading document..."
  : "Uploading picture..."
);


      const uploadResult =
      await uploadMediaToCloudinary(
        selectedMediaFile
      );


      finalMediaUrl =
      uploadResult.url;


      finalMediaPublicId =
      uploadResult.publicId;


      finalMediaFormat =
      uploadResult.format;


      finalMediaDuration =
      uploadResult.duration;


      uploadedMediaUrl =
      finalMediaUrl;


      uploadedMediaPublicId =
      finalMediaPublicId;

    }


    const finalMediaType =
    hasMedia
    ? selectedMediaType
    : "none";


    const messageReference =
    await createMessageDocument(
      {

        messageText:
        messageText,

        mediaType:
        finalMediaType,

        mediaUrl:
        finalMediaUrl,

        mediaPublicId:
        finalMediaPublicId,

        mediaFormat:
        finalMediaFormat,

        mediaDuration:
finalMediaDuration,

fileName:
finalMediaType === "file"
? selectedFileName
: "",

fileSize:
finalMediaType === "file"
? selectedFileSize
: 0,

fileExtension:
finalMediaType === "file"
? selectedFileExtension
: ""

      }
    );


    await Promise.allSettled(
      [

        updateConversationSummary(
          {

            messageText:
            messageText,

            mediaType:
            finalMediaType,

            mediaUrl:
            finalMediaUrl,

            messageId:
            messageReference.id

          }
        ),


        createMessageNotification(
          {

            messageText:
            messageText,

            mediaType:
            finalMediaType,

            messageId:
            messageReference.id

          }
        )

      ]
    );


    resetMessageComposer();


    scrollToLatestMessage();

  }catch(error){

    console.error(
      "Private-message sending error:",
      error
    );


    resetUploadProgress();


    if(
      error?.code ===
      "permission-denied"
    ){

      alert(
        "Firebase denied permission to send this message."
      );

    }else{

      alert(
        error?.message ||
        "Unable to send the message. Please try again."
      );

    }

  }finally{

    setSendingState(
      false
    );

  }

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.addEventListener(
  "click",
  function(){

    sendMessage();

  }
);


/* =====================================================
   ENTER KEY TO SEND
===================================================== */

messageInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();


      sendMessage();

    }

  }
);


/* =====================================================
   CLOSE VIEWER WITH BROWSER BACK
===================================================== */

window.addEventListener(
  "popstate",
  function(){

    if(
      mediaViewer.classList.contains(
        "show"
      )
    ){

      resetMediaViewer();

    }

  }
);


/* =====================================================
   RESTORE PAGE WHEN RETURNING
===================================================== */

window.addEventListener(
  "pageshow",
  async function(event){

    if(!event.persisted){

      return;

    }


    sendingMessage =
    false;


    hideBusyOverlay();


    resetUploadProgress();


    if(
      currentUser &&
      conversationId
    ){

      await setCurrentUserOnline();


      watchOtherMemberStatus();


      startTypingListener();


      loadMessages();


      enableChatControls();

    }

  }
);


/* =====================================================
   INITIAL INTERFACE
===================================================== */

messageInput.style.height =
"auto";


resetUploadProgress();


hideBusyOverlay();


/* =====================================================
   PAGE READY
===================================================== */

console.log(
  "Faith Connect private chat with voice calling is ready."
);


</script>
