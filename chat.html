<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Chat</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef3f8;
display:flex;
flex-direction:column;
height:100vh;
}

.header{
background:#0066cc;
color:white;
padding:15px;
display:flex;
align-items:center;
gap:15px;
}

.avatar{
width:50px;
height:50px;
border-radius:50%;
background:white;
}

.name{
font-size:20px;
font-weight:bold;
}

.chatArea{
flex:1;
overflow-y:auto;
padding:20px;
background:#f5f7fb;
display:flex;
flex-direction:column;
}

.empty{
text-align:center;
color:#777;
margin-top:80px;
}

.inputArea{
display:flex;
padding:15px;
background:white;
border-top:1px solid #ddd;
}

.inputArea input{
flex:1;
padding:12px;
border:1px solid #ccc;
border-radius:25px;
font-size:16px;
}

.inputArea button{
margin-left:10px;
padding:12px 22px;
border:none;
border-radius:25px;
background:#0066cc;
color:white;
font-size:16px;
cursor:pointer;
}

.inputArea button:hover{
background:#004d99;
}

</style>

</head>

<body>

<div class="header">

<img id="chatAvatar" class="avatar" src="images/profile.png">

<div class="name" id="chatName">

Loading...

</div>

</div>

<div class="chatArea" id="chatArea">

<div class="empty">

No messages yet.<br>

Start your Christian conversation.

</div>

</div>

<div class="inputArea">

<input
type="text"
id="message"
placeholder="Type your message...">

<button id="sendBtn">

Send

</button>

</div>
<script type="module">

import {
auth,
db,
doc,
getDoc,
collection,
addDoc,
getDocs,
updateDoc,
writeBatch,
query,
where,
orderBy,
onSnapshot,
serverTimestamp,
onAuthStateChanged
} from "./firebase.js";

const params = new URLSearchParams(window.location.search);
const otherUid = params.get("uid");

const chatName = document.getElementById("chatName");
const chatAvatar = document.getElementById("chatAvatar");
const chatArea = document.getElementById("chatArea");
const messageInput = document.getElementById("message");
const sendBtn = document.getElementById("sendBtn");

let currentUser = null;
onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href="login.html";
return;

}

currentUser = user;
// Mark notifications as read
const notificationQuery = query(
collection(db,"notifications"),
where("userId","==",user.uid),
where("senderId","==",otherUid),
where("read","==",false)
);

const notificationSnapshot = await getDocs(notificationQuery);

const batch = writeBatch(db);

notificationSnapshot.forEach((notificationDoc)=>{

batch.update(notificationDoc.ref,{
read:true
});

});

await batch.commit();
sendBtn.addEventListener("click", async ()=>{

const text = messageInput.value.trim();

if(text=="") return;

try{

await addDoc(collection(db,"messages"),{

senderId: currentUser.uid,
receiverId: otherUid,
message: text,
timestamp: serverTimestamp()

});

// Create notification
await addDoc(collection(db,"notifications"),{

userId: otherUid,
senderId: currentUser.uid,
title: "New Message",
message: text,
read: false,
timestamp: serverTimestamp()

});
await addDoc(collection(db,"notifications"),{

userId: otherUid,
senderId: currentUser.uid,
title: "New Message",
message: text,
timestamp: serverTimestamp(),
read: false

});
messageInput.value="";

}catch(error){

alert(error.message);

}
});
const q = query(
collection(db,"messages"),
orderBy("timestamp")
);

onSnapshot(q,(snapshot)=>{

chatArea.innerHTML="";

snapshot.forEach((doc)=>{

const msg = doc.data();

if(

(msg.senderId===currentUser.uid &&
msg.receiverId===otherUid)

||

(msg.senderId===otherUid &&
msg.receiverId===currentUser.uid)

){

const mine =
msg.senderId===currentUser.uid;

chatArea.innerHTML += `

<div style="
display:flex;
justify-content:${mine?"flex-end":"flex-start"};
margin:10px 0;
">

<div style="
background:${mine?"#0066cc":"#e5e5ea"};
color:${mine?"white":"black"};
padding:12px 16px;
border-radius:15px;
max-width:70%;
word-wrap:break-word;
">

${msg.message}

</div>

</div>

`;

}

});

chatArea.scrollTop = chatArea.scrollHeight;

});
try{

const userSnap = await getDoc(
doc(db,"users",otherUid)
);

if(userSnap.exists()){

const data = userSnap.data();

chatName.innerText =
data.fullName || "Unknown User";

chatAvatar.src =
data.profilePicture || "images/profile.png";

}

}catch(error){

alert(error.message);

}

});

</script>
</body>
</html>
