<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="description"
content="Private Christian chat on SABASABA Gospel Ministry"
>

<title>
Private Chat | SABASABA Gospel Ministry
</title>


<style>

/* =====================================================
   GENERAL PAGE
===================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
width:100%;
height:100%;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#eef3f8;
display:flex;
flex-direction:column;
overflow:hidden;
}


/* =====================================================
   CHAT HEADER
===================================================== */

.header{
display:flex;
align-items:center;
gap:14px;
padding:15px 18px;
background:#0066cc;
color:#ffffff;
box-shadow:0 2px 8px rgba(0,0,0,.12);
z-index:10;
}

.back-button{
width:42px;
height:42px;
display:flex;
align-items:center;
justify-content:center;
border:none;
border-radius:50%;
background:rgba(255,255,255,.18);
color:#ffffff;
font-size:24px;
cursor:pointer;
flex-shrink:0;
}

.back-button:hover{
background:rgba(255,255,255,.28);
}

.avatar{
width:58px;
height:58px;
border-radius:50%;
object-fit:cover;
background:#ffffff;
border:2px solid rgba(255,255,255,.8);
flex-shrink:0;
}

.header-info{
min-width:0;
flex:1;
}

.name{
font-size:21px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.status{
margin-top:4px;
font-size:13px;
color:#dbeaff;
}


/* =====================================================
   CHAT AREA
===================================================== */

.chatArea{
flex:1;
overflow-y:auto;
padding:20px 16px 28px;
background:#f5f7fb;
display:flex;
flex-direction:column;
scroll-behavior:smooth;
}

.empty{
margin:auto;
padding:30px 20px;
color:#777;
font-size:16px;
line-height:1.6;
text-align:center;
}


/* =====================================================
   MESSAGE ROW
===================================================== */

.message-row{
width:100%;
display:flex;
margin:7px 0;
}

.message-row.mine-row{
justify-content:flex-end;
}

.message-row.other-row{
justify-content:flex-start;
}


/* =====================================================
   MESSAGE BUBBLE
===================================================== */

.message{
position:relative;
max-width:76%;
padding:12px 15px 8px;
border-radius:17px;
word-wrap:break-word;
overflow-wrap:anywhere;
line-height:1.45;
font-size:16px;
box-shadow:0 1px 3px rgba(0,0,0,.08);
}

.mine{
background:#0066cc;
color:#ffffff;
border-bottom-right-radius:5px;
padding-right:42px;
}

.other{
background:#e5e5ea;
color:#111111;
border-bottom-left-radius:5px;
}


/* =====================================================
   MESSAGE TEXT AND TIME
===================================================== */

.message-text{
white-space:pre-wrap;
}

.message-time{
display:block;
margin-top:6px;
font-size:11px;
opacity:.72;
text-align:right;
}


/* =====================================================
   MESSAGE MENU BUTTON
===================================================== */

.message-menu-button{
position:absolute;
top:6px;
right:7px;
width:29px;
height:29px;
display:flex;
align-items:center;
justify-content:center;
border:none;
border-radius:50%;
background:rgba(255,255,255,.17);
color:#ffffff;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.message-menu-button:hover{
background:rgba(255,255,255,.28);
}


/* =====================================================
   DELETE MENU
===================================================== */

.message-menu{
display:none;
position:absolute;
top:39px;
right:7px;
min-width:145px;
padding:6px;
background:#ffffff;
border-radius:10px;
box-shadow:0 5px 18px rgba(0,0,0,.22);
z-index:20;
}

.message-menu.show{
display:block;
}

.delete-message-button{
width:100%;
padding:10px 12px;
border:none;
border-radius:7px;
background:#ffffff;
color:#d93025;
font-size:14px;
font-weight:bold;
text-align:left;
cursor:pointer;
}

.delete-message-button:hover{
background:#fff0ef;
}


/* =====================================================
   INPUT AREA
===================================================== */

.inputArea{
display:flex;
align-items:center;
gap:10px;
padding:12px 14px;
background:#ffffff;
border-top:1px solid #d9e0e8;
box-shadow:0 -2px 8px rgba(0,0,0,.05);
}

.inputArea input{
flex:1;
min-width:0;
padding:13px 17px;
border:1px solid #c7d0da;
border-radius:25px;
font-size:16px;
outline:none;
background:#ffffff;
}

.inputArea input:focus{
border-color:#0066cc;
box-shadow:0 0 0 3px rgba(0,102,204,.12);
}

.inputArea button{
padding:12px 22px;
border:none;
border-radius:25px;
background:#0066cc;
color:#ffffff;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.inputArea button:hover{
background:#004f9e;
}

.inputArea button:disabled{
background:#8ba8c5;
cursor:not-allowed;
}


/* =====================================================
   MOBILE DESIGN
===================================================== */

@media(max-width:600px){

.header{
padding:12px;
gap:10px;
}

.avatar{
width:52px;
height:52px;
}

.name{
font-size:18px;
}

.chatArea{
padding:16px 10px 22px;
}

.message{
max-width:82%;
font-size:16px;
}

.inputArea{
padding:10px;
}

.inputArea button{
padding:12px 17px;
}

}

</style>

</head>
<body>


<!-- =====================================================
     CHAT HEADER
===================================================== -->

<div class="header">

<button
type="button"
id="backButton"
class="back-button"
aria-label="Go back"
>
←
</button>


<img
id="chatAvatar"
class="avatar"
src="images/profile.png"
alt="Member profile picture"
>


<div class="header-info">

<div
class="name"
id="chatName"
>
Loading...
</div>


<div
class="status"
id="chatStatus"
>
Private Christian conversation
</div>

</div>

</div>


<!-- =====================================================
     CHAT MESSAGES
===================================================== -->

<div
class="chatArea"
id="chatArea"
>

<div class="empty">

No messages yet.<br>

Start your Christian conversation.

</div>

</div>


<!-- =====================================================
     MESSAGE INPUT
===================================================== -->

<div class="inputArea">

<input
id="messageInput"
type="text"
maxlength="2000"
placeholder="Type your message..."
autocomplete="off"
>


<button
type="button"
id="sendButton"
>

Send

</button>

</div>


<script type="module">
/* =====================================================
   PART 3 OF 6
   FIREBASE SETUP AND CHAT MEMBER DETAILS
===================================================== */


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  auth,
  db,
  doc,
  getDoc,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  setDoc,
  deleteDoc,
  onAuthStateChanged
} from "./firebase.js";


/* =====================================================
   URL INFORMATION
===================================================== */

const pageParameters =
new URLSearchParams(
  window.location.search
);


const otherUid =
pageParameters.get(
  "uid"
);


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const backButton =
document.getElementById(
  "backButton"
);


const chatName =
document.getElementById(
  "chatName"
);


const chatAvatar =
document.getElementById(
  "chatAvatar"
);


const chatStatus =
document.getElementById(
  "chatStatus"
);


const chatArea =
document.getElementById(
  "chatArea"
);


const messageInput =
document.getElementById(
  "messageInput"
);


const sendButton =
document.getElementById(
  "sendButton"
);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser =
null;


let unsubscribeMessages =
null;


let messageSending =
false;


/* =====================================================
   CHECK CHAT MEMBER ID
===================================================== */

if(!otherUid){

  alert(
    "The selected chat member could not be found."
  );


  window.location.replace(
    "privatemessages.html"
  );

}


/* =====================================================
   BACK BUTTON
===================================================== */

backButton.addEventListener(
  "click",
  function(){

    window.location.href =
    "privatemessages.html";

  }
);


/* =====================================================
   LOAD OTHER MEMBER PROFILE
===================================================== */

async function loadChatMember(){

  try{

    const memberReference =
    doc(
      db,
      "users",
      otherUid
    );


    const memberSnapshot =
    await getDoc(
      memberReference
    );


    if(!memberSnapshot.exists()){

      chatName.textContent =
      "Unknown Member";


      chatStatus.textContent =
      "Member profile unavailable";


      chatAvatar.src =
      "images/profile.png";


      return;

    }


    const member =
    memberSnapshot.data();


    chatName.textContent =
    member.fullName ||
    member.name ||
    member.displayName ||
    "Community Member";


    chatAvatar.src =
    member.profilePicture ||
    member.picture ||
    member.photoURL ||
    "images/profile.png";


    chatAvatar.onerror =
    function(){

      chatAvatar.src =
      "images/profile.png";

    };


    chatStatus.textContent =
    "Private Christian conversation";

  }catch(error){

    console.error(
      "Member profile loading error:",
      error
    );


    chatName.textContent =
    "Community Member";


    chatStatus.textContent =
    "Private Christian conversation";


    chatAvatar.src =
    "images/profile.png";

  }

}


/* =====================================================
   AUTHENTICATION
===================================================== */

onAuthStateChanged(
  auth,
  async(user)=>{

    if(!user){

      window.location.replace(
        "login.html"
      );

      return;

    }


    currentUser =
    user;


    if(
      currentUser.uid === otherUid
    ){

      alert(
        "You cannot open a private chat with yourself."
      );


      window.location.replace(
        "privatemessages.html"
      );

      return;

    }


    await loadChatMember();


    loadMessages();

  }
);
/* =====================================================
   PART 4 OF 6
   LOAD AND DISPLAY PRIVATE MESSAGES
===================================================== */


/* =====================================================
   FORMAT MESSAGE TIME
===================================================== */

function formatMessageTime(timestamp){

  if(!timestamp){
    return "Sending...";
  }


  const messageDate =
  timestamp.toDate
  ? timestamp.toDate()
  : new Date(timestamp);


  return messageDate.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =====================================================
   CLOSE ALL MESSAGE MENUS
===================================================== */

function closeAllMessageMenus(){

  const openMenus =
  document.querySelectorAll(
    ".message-menu.show"
  );


  openMenus.forEach((menu)=>{

    menu.classList.remove(
      "show"
    );

  });

}


/* =====================================================
   CREATE ONE MESSAGE BUBBLE
===================================================== */

function createMessageElement(
  messageDocument
){

  const messageData =
  messageDocument.data();


  const messageId =
  messageDocument.id;


  const isMine =
  messageData.senderId ===
  currentUser.uid;


  const messageRow =
  document.createElement(
    "div"
  );


  messageRow.className =
  isMine
  ? "message-row mine-row"
  : "message-row other-row";


  const messageBubble =
  document.createElement(
    "div"
  );


  messageBubble.className =
  isMine
  ? "message mine"
  : "message other";


  const messageText =
  document.createElement(
    "div"
  );


  messageText.className =
  "message-text";


  messageText.textContent =
  messageData.message ||
  "";


  messageBubble.appendChild(
    messageText
  );


  const messageTime =
  document.createElement(
    "span"
  );


  messageTime.className =
  "message-time";


  messageTime.textContent =
  formatMessageTime(
    messageData.timestamp
  );


  messageBubble.appendChild(
    messageTime
  );


  /* ===================================================
     DELETE MENU FOR OWN MESSAGES ONLY
  =================================================== */

  if(isMine){

    const menuButton =
    document.createElement(
      "button"
    );


    menuButton.type =
    "button";


    menuButton.className =
    "message-menu-button";


    menuButton.innerHTML =
    "⋮";


    menuButton.setAttribute(
      "aria-label",
      "Message options"
    );


    const messageMenu =
    document.createElement(
      "div"
    );


    messageMenu.className =
    "message-menu";


    const deleteButton =
    document.createElement(
      "button"
    );


    deleteButton.type =
    "button";


    deleteButton.className =
    "delete-message-button";


    deleteButton.textContent =
    "🗑 Delete message";


    menuButton.addEventListener(
      "click",
      function(event){

        event.stopPropagation();


        const menuWasOpen =
        messageMenu.classList.contains(
          "show"
        );


        closeAllMessageMenus();


        if(!menuWasOpen){

          messageMenu.classList.add(
            "show"
          );

        }

      }
    );


    deleteButton.addEventListener(
      "click",
      function(event){

        event.stopPropagation();


        messageMenu.classList.remove(
          "show"
        );


        confirmMessageDeletion(
          messageId,
          messageData
        );

      }
    );


    messageMenu.appendChild(
      deleteButton
    );


    messageBubble.appendChild(
      menuButton
    );


    messageBubble.appendChild(
      messageMenu
    );

  }


  messageRow.appendChild(
    messageBubble
  );


  return messageRow;

}


/* =====================================================
   LOAD MESSAGES FROM FIRESTORE
===================================================== */

function loadMessages(){

  if(unsubscribeMessages){

    unsubscribeMessages();

  }


  const messagesQuery =
  query(
    collection(
      db,
      "messages"
    ),
    orderBy(
      "timestamp",
      "asc"
    )
  );


  unsubscribeMessages =
  onSnapshot(
    messagesQuery,
    (snapshot)=>{

      chatArea.innerHTML =
      "";


      let foundMessage =
      false;


      snapshot.forEach(
        (messageDocument)=>{

          const messageData =
          messageDocument.data();


          const messageBelongsToChat =

          (
            messageData.senderId ===
            currentUser.uid

            &&

            messageData.receiverId ===
            otherUid
          )

          ||

          (
            messageData.senderId ===
            otherUid

            &&

            messageData.receiverId ===
            currentUser.uid
          );


          if(!messageBelongsToChat){
            return;
          }


          foundMessage =
          true;


          const messageElement =
          createMessageElement(
            messageDocument
          );


          chatArea.appendChild(
            messageElement
          );

        }
      );


      if(!foundMessage){

        chatArea.innerHTML = `
          <div class="empty">
            No messages yet.<br>
            Start your Christian conversation.
          </div>
        `;

      }


      requestAnimationFrame(
        ()=>{

          chatArea.scrollTop =
          chatArea.scrollHeight;

        }
      );

    },
    (error)=>{

      console.error(
        "Message loading error:",
        error
      );


      chatArea.innerHTML = `
        <div class="empty">
          Messages could not be loaded.<br>
          Please check your internet connection.
        </div>
      `;

    }
  );

}


/* =====================================================
   CLOSE MENU WHEN USER CLICKS ELSEWHERE
===================================================== */

document.addEventListener(
  "click",
  function(){

    closeAllMessageMenus();

  }
);
/* =====================================================
   PART 5 OF 6
   DELETE PRIVATE MESSAGES
===================================================== */


/* =====================================================
   CONFIRM MESSAGE DELETION
===================================================== */

function confirmMessageDeletion(
  messageId,
  messageData
){

  if(!currentUser){
    return;
  }


  if(
    messageData.senderId !==
    currentUser.uid
  ){

    alert(
      "You can delete only messages that you sent."
    );

    return;

  }


  const confirmed =
  window.confirm(
    "Are you sure you want to delete this message?"
  );


  if(!confirmed){
    return;
  }


  deletePrivateMessage(
    messageId
  );

}


/* =====================================================
   DELETE MESSAGE FROM FIRESTORE
===================================================== */

async function deletePrivateMessage(
  messageId
){

  try{

    const messageReference =
    doc(
      db,
      "messages",
      messageId
    );


    const messageSnapshot =
    await getDoc(
      messageReference
    );


    if(!messageSnapshot.exists()){

      alert(
        "This message no longer exists."
      );

      return;

    }


    const messageData =
    messageSnapshot.data();


    if(
      messageData.senderId !==
      currentUser.uid
    ){

      alert(
        "You are not allowed to delete this message."
      );

      return;

    }


    await deleteDoc(
      messageReference
    );


    await updateConversationAfterDeletion();


  }catch(error){

    console.error(
      "Message deletion error:",
      error
    );


    alert(
      "The message could not be deleted. Please try again."
    );

  }

}


/* =====================================================
   UPDATE CONVERSATION AFTER DELETION
===================================================== */

async function updateConversationAfterDeletion(){

  try{

    const participantIds =
    [
      currentUser.uid,
      otherUid
    ].sort();


    const conversationId =
    participantIds[0] +
    "_" +
    participantIds[1];


    const messagesQuery =
    query(
      collection(
        db,
        "messages"
      ),
      orderBy(
        "timestamp",
        "asc"
      )
    );


    let latestMessage =
    null;


    const temporaryUnsubscribe =
    onSnapshot(
      messagesQuery,
      async(snapshot)=>{

        temporaryUnsubscribe();


        snapshot.forEach(
          (messageDocument)=>{

            const messageData =
            messageDocument.data();


            const belongsToConversation =

            (
              messageData.senderId ===
              currentUser.uid

              &&

              messageData.receiverId ===
              otherUid
            )

            ||

            (
              messageData.senderId ===
              otherUid

              &&

              messageData.receiverId ===
              currentUser.uid
            );


            if(belongsToConversation){

              latestMessage =
              messageData;

            }

          }
        );


        const conversationReference =
        doc(
          db,
          "conversations",
          conversationId
        );


        if(latestMessage){

          await setDoc(
            conversationReference,
            {
              participants:
              participantIds,

              lastMessage:
              latestMessage.message ||
              "Message",

              lastSender:
              latestMessage.senderId,

              timestamp:
              latestMessage.timestamp ||
              serverTimestamp()
            },
            {
              merge:true
            }
          );

        }else{

          await setDoc(
            conversationReference,
            {
              participants:
              participantIds,

              lastMessage:
              "No messages yet",

              lastSender:
              "",

              timestamp:
              serverTimestamp()
            },
            {
              merge:true
            }
          );

        }

      },
      (error)=>{

        console.error(
          "Conversation update error:",
          error
        );

      }
    );

  }catch(error){

    console.error(
      "Conversation refresh error:",
      error
    );

  }

}
/* =====================================================
   PART 6 OF 6
   SEND MESSAGES
===================================================== */

async function sendMessage(){

  if(messageSending){
    return;
  }

  const text =
  messageInput.value.trim();

  if(text===""){
    return;
  }

  messageSending = true;
  sendButton.disabled = true;

  try{

    // Save message
    await addDoc(
      collection(db,"messages"),
      {
        senderId:currentUser.uid,
        receiverId:otherUid,
        message:text,
        timestamp:serverTimestamp()
      }
    );

    // Update conversation
    const ids =
    [
      currentUser.uid,
      otherUid
    ].sort();

    const conversationId =
    ids[0] + "_" + ids[1];

    await setDoc(
      doc(db,"conversations",conversationId),
      {
        participants:ids,
        lastMessage:text,
        lastSender:currentUser.uid,
        timestamp:serverTimestamp()
      },
      {
        merge:true
      }
    );

    // Create notification
    await addDoc(
      collection(db,"notifications"),
      {
        userId:otherUid,
        senderId:currentUser.uid,
        title:"New Message",
        message:text,
        read:false,
        timestamp:serverTimestamp()
      }
    );

    messageInput.value="";

    messageInput.focus();

  }catch(error){

    console.error(error);

    alert(
      "Unable to send the message. Please try again."
    );

  }

  messageSending = false;
  sendButton.disabled = false;

}


/* =====================================================
   BUTTON CLICK
===================================================== */

sendButton.addEventListener(
  "click",
  sendMessage
);


/* =====================================================
   PRESS ENTER TO SEND
===================================================== */

messageInput.addEventListener(
  "keydown",
  function(event){

    if(event.key==="Enter"){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   CLOSE OPEN MENUS WHEN ESC IS PRESSED
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key==="Escape"){

      closeAllMessageMenus();

    }

  }
);


/* =====================================================
   CLEAN UP LISTENERS
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    if(unsubscribeMessages){

      unsubscribeMessages();

    }

  }
);

</script>

</body>
</html>
