<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Member Profile | SABASABA Gospel Ministry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
}

.container{
max-width:800px;
margin:30px auto;
padding:20px;
}

.profileCard{

background:white;
border-radius:20px;
padding:30px;
box-shadow:0 4px 12px rgba(0,0,0,.10);

}

.cover{

height:180px;
background:linear-gradient(135deg,#0066cc,#004d99);
border-radius:18px;
position:relative;

}

.profilePhoto{

width:150px;
height:150px;
border-radius:50%;
border:6px solid white;
object-fit:cover;
background:#ddd;
position:absolute;
left:50%;
bottom:-75px;
transform:translateX(-50%);

}

.profileBody{

margin-top:90px;
text-align:center;

}

.profileBody h1{

font-size:32px;
color:#0066cc;
margin-bottom:10px;

}

.info{

font-size:17px;
color:#666;
margin:10px 0;

}

.about{

margin-top:25px;
padding:20px;
background:#f8f8f8;
border-radius:12px;
line-height:1.8;
font-size:17px;
color:#444;

}

.buttonRow{

margin-top:30px;
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;

}

.btn{

padding:14px 28px;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
color:white;

}

.messageBtn{

background:#0066cc;

}

.prayBtn{

background:#28a745;

}

.backBtn{

background:#777;

}

.empty{

text-align:center;
font-size:18px;
color:#777;
padding:40px;

}

@media(max-width:700px){

.profilePhoto{

width:120px;
height:120px;
bottom:-60px;

}

.profileBody{

margin-top:70px;

}

.profileBody h1{

font-size:27px;

}

.buttonRow{

flex-direction:column;

}

.btn{

width:100%;

}

}

</style>

</head>

<body>

<div class="container">

<div class="profileCard">

<div class="cover">

<img
id="profilePhoto"
class="profilePhoto"
src="images/profile.png">

</div>

<div class="profileBody">

<h1 id="fullName">

Loading...

</h1>

<div
class="info"
id="country">

</div>

<div
class="info"
id="email">

</div>

<div
class="info"
id="joined">

</div>

<div
class="about"
id="about">

Loading profile...

</div>

<div class="buttonRow">

<button
class="btn messageBtn"
id="messageBtn">

💬 Message

</button>

<button
class="btn prayBtn"
id="prayBtn">

🙏 Pray Together

</button>

<button
class="btn backBtn"
onclick="history.back()">

⬅ Back

</button>

</div>

</div>

</div>

</div>
<script type="module">

import{
  auth,
  db,
  collection,
  addDoc,
  doc,
  getDoc,
  onAuthStateChanged
}from "./firebase.js";

import{
  serverTimestamp
}from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* ========================================
   PAGE ELEMENTS
======================================== */

const nameInput =
document.getElementById("name");

const categoryInput =
document.getElementById("category");

const postInput =
document.getElementById("post");

const publishBtn =
document.getElementById("publishBtn");

const messageBox =
document.getElementById("message");


/* ========================================
   USER INFORMATION
======================================== */

let currentUser = null;

let currentProfile = null;


/* ========================================
   CHECK LOGIN AND LOAD PROFILE
======================================== */

onAuthStateChanged(auth,async(user)=>{

  if(!user){

    location.href = "login.html";
    return;

  }

  currentUser = user;

  await loadCurrentProfile();

});


/* ========================================
   LOAD PROFILE FROM FIRESTORE
======================================== */

async function loadCurrentProfile(){

  try{

    const profileReference =
    doc(db,"users",currentUser.uid);

    const profileSnapshot =
    await getDoc(profileReference);


    if(profileSnapshot.exists()){

      currentProfile =
      profileSnapshot.data();

    }else{

      currentProfile = {};

    }


    const savedName = getFirstValue(

      currentProfile.fullName,
      currentProfile.name,
      currentProfile.displayName,
      currentUser.displayName,
      ""

    );


    if(savedName && nameInput){

      nameInput.value = savedName;

    }

  }catch(error){

    console.error(
      "Profile loading error:",
      error
    );

    currentProfile = {};

    alert(
      "Your profile information could not be loaded."
    );

  }

}


/* ========================================
   PUBLISH COMMUNITY POST
======================================== */

async function publishPost(){

  if(!currentUser){

    alert(
      "Please wait while your account is loading."
    );

    return;

  }


  const enteredName =
  nameInput.value.trim();

  const selectedCategory =
  categoryInput.value;

  const enteredPost =
  postInput.value.trim();


  if(enteredName === ""){

    alert(
      "Please enter your name."
    );

    nameInput.focus();
    return;

  }


  if(enteredPost === ""){

    alert(
      "Please write your post."
    );

    postInput.focus();
    return;

  }


  const profilePicture = getFirstValue(

    currentProfile?.profilePicture,
    currentUser.photoURL,
    "images/profile.png"

  );


  const profileName = getFirstValue(

    currentProfile?.fullName,
    enteredName,
    currentUser.displayName,
    "Anonymous"

  );


  const profileCountry = getFirstValue(

    currentProfile?.country,
    ""

  );


  publishBtn.disabled = true;

  publishBtn.innerText =
  "Publishing...";


  if(messageBox){

    messageBox.innerHTML =
    "Publishing your post...";

  }


  try{

    await addDoc(

      collection(db,"communityPosts"),

      {

        userId:
        currentUser.uid,

        uid:
        currentUser.uid,

        name:
        profileName,

        fullName:
        profileName,

        country:
        profileCountry,

        category:
        selectedCategory,

        post:
        enteredPost,

        text:
        enteredPost,

        picture:
        profilePicture,

        profilePicture:
        profilePicture,

        date:
        new Date().toLocaleString(),

        timestamp:
        serverTimestamp(),

        likes:
        0,

        comments:
        []

      }

    );


    const currentPostTotal =

    parseInt(
      localStorage.getItem("posts")
    ) || 0;


    localStorage.setItem(

      "posts",

      String(currentPostTotal + 1)

    );


    if(messageBox){

      messageBox.innerHTML =

      "✅ Your post has been published successfully!";

    }


    postInput.value = "";


    setTimeout(()=>{

      location.href = "feed.html";

    },1200);

  }catch(error){

    console.error(
      "Publishing error:",
      error
    );


    if(messageBox){

      messageBox.innerHTML =

      "❌ The post could not be published.";

    }


    alert(
      getFriendlyErrorMessage(error)
    );

  }finally{

    publishBtn.disabled = false;

    publishBtn.innerText =
    "Publish Post";

  }

}


/* ========================================
   GET FIRST AVAILABLE VALUE
======================================== */

function getFirstValue(...values){

  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value).trim();

    }

  }

  return "";

}


/* ========================================
   FRIENDLY ERROR MESSAGE
======================================== */

function getFriendlyErrorMessage(error){

  if(
    error.code ===
    "permission-denied"
  ){

    return "Firebase did not allow this post to be saved. Please check your Firestore security rules.";

  }


  if(
    error.code ===
    "unavailable"
  ){

    return "The internet connection is unavailable. Please check your connection and try again.";

  }


  return error.message ||
  "The post could not be published.";

}


/* ========================================
   PUBLISH BUTTON
======================================== */

if(publishBtn){

  publishBtn.addEventListener(
    "click",
    publishPost
  );

}else{

  console.error(
    "The publishBtn element was not found."
  );

}

</script>

</body>

</html>
