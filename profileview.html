<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Member Profile | SABASABA Gospel Ministry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
}

.container{
max-width:800px;
margin:30px auto;
padding:20px;
}

.profileCard{

background:white;
border-radius:20px;
padding:30px;
box-shadow:0 4px 12px rgba(0,0,0,.10);

}

.cover{

height:180px;
background:linear-gradient(135deg,#0066cc,#004d99);
border-radius:18px;
position:relative;

}

.profilePhoto{

width:150px;
height:150px;
border-radius:50%;
border:6px solid white;
object-fit:cover;
background:#ddd;
position:absolute;
left:50%;
bottom:-75px;
transform:translateX(-50%);

}

.profileBody{

margin-top:90px;
text-align:center;

}

.profileBody h1{

font-size:32px;
color:#0066cc;
margin-bottom:10px;

}

.info{

font-size:17px;
color:#666;
margin:10px 0;

}

.about{

margin-top:25px;
padding:20px;
background:#f8f8f8;
border-radius:12px;
line-height:1.8;
font-size:17px;
color:#444;

}

.buttonRow{

margin-top:30px;
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;

}

.btn{

padding:14px 28px;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
color:white;

}

.messageBtn{

background:#0066cc;

}

.prayBtn{

background:#28a745;

}

.backBtn{

background:#777;

}

.empty{

text-align:center;
font-size:18px;
color:#777;
padding:40px;

}

@media(max-width:700px){

.profilePhoto{

width:120px;
height:120px;
bottom:-60px;

}

.profileBody{

margin-top:70px;

}

.profileBody h1{

font-size:27px;

}

.buttonRow{

flex-direction:column;

}

.btn{

width:100%;

}

}

</style>

</head>

<body>

<div class="container">

<div class="profileCard">

<div class="cover">

<img
id="profilePhoto"
class="profilePhoto"
src="images/profile.png">

</div>

<div class="profileBody">

<h1 id="fullName">

Loading...

</h1>

<div
class="info"
id="country">

</div>

<div
class="info"
id="email">

</div>

<div
class="info"
id="joined">

</div>

<div
class="about"
id="about">

Loading profile...

</div>

<div class="buttonRow">

<button
class="btn messageBtn"
id="messageBtn">

💬 Message

</button>

<button
class="btn prayBtn"
id="prayBtn">

🙏 Pray Together

</button>

<button
class="btn backBtn"
onclick="history.back()">

⬅ Back

</button>

</div>

</div>

</div>

</div>
<script type="module">

import{
  auth,
  db,
  doc,
  getDoc,
  onAuthStateChanged
}from "./firebase.js";


/* ========================================
   PAGE ELEMENTS
======================================== */

const photo =
document.getElementById("profilePhoto");

const fullName =
document.getElementById("fullName");

const country =
document.getElementById("country");

const email =
document.getElementById("email");

const joined =
document.getElementById("joined");

const about =
document.getElementById("about");

const messageBtn =
document.getElementById("messageBtn");

const prayBtn =
document.getElementById("prayBtn");


/* ========================================
   GET MEMBER ID FROM URL
======================================== */

const params =
new URLSearchParams(
  window.location.search
);

const uid =
params.get("uid");


/* ========================================
   CHECK LOGIN
======================================== */

onAuthStateChanged(auth,async(user)=>{

  if(!user){

    location.href = "login.html";
    return;

  }


  if(!uid || uid === "undefined" || uid === "null"){

    showProfileError(
      "Member not found",
      "No valid member was selected."
    );

    return;

  }


  await loadProfile();

});


/* ========================================
   LOAD MEMBER PROFILE
======================================== */

async function loadProfile(){

  try{

    fullName.innerText =
    "Loading...";

    about.innerText =
    "Loading profile...";


    const profileReference =
    doc(db,"users",uid);

    const profileSnapshot =
    await getDoc(profileReference);


    if(!profileSnapshot.exists()){

      showProfileError(
        "Member not found",
        "This member's profile does not exist."
      );

      return;

    }


    const data =
    profileSnapshot.data();


    photo.src =
    data.profilePicture ||
    "images/profile.png";


    fullName.innerText =
    data.fullName ||
    data.name ||
    "Unknown Member";


    country.innerText =

    "🌍 " +
    (
      data.country ||
      "Country not provided"
    );


    email.innerText =

    "📧 " +
    (
      data.email ||
      "Email not provided"
    );


    joined.innerText =
    "📅 Member of SABASABA Gospel Ministry";


    about.innerText =

    data.about ||
    "This member has not added an introduction yet.";


  }catch(error){

    console.error(
      "Profile loading error:",
      error
    );


    showProfileError(
      "Unable to load profile",
      getFriendlyErrorMessage(error)
    );

  }

}


/* ========================================
   BROKEN PROFILE PICTURE
======================================== */

if(photo){

  photo.addEventListener("error",()=>{

    const fallback =
    new URL(
      "images/profile.png",
      location.href
    ).href;

    if(photo.src !== fallback){

      photo.src =
      "images/profile.png";

    }

  });

}


/* ========================================
   MESSAGE BUTTON
======================================== */

if(messageBtn){

  messageBtn.addEventListener("click",()=>{

    if(!uid){

      alert(
        "This member is not available."
      );

      return;

    }


    location.href =

    "chat.html?uid=" +
    encodeURIComponent(uid);

  });

}


/* ========================================
   PRAY BUTTON
======================================== */

if(prayBtn){

  prayBtn.addEventListener("click",()=>{

    alert(
      "🙏 Pray Together is coming soon.\n\n" +
      "This feature will allow believers " +
      "to pray together and send prayer requests."
    );

  });

}


/* ========================================
   SHOW PROFILE ERROR
======================================== */

function showProfileError(title,message){

  photo.src =
  "images/profile.png";

  fullName.innerText =
  title;

  country.innerText =
  "🌍 Profile unavailable";

  email.innerText =
  "📧 Information unavailable";

  joined.innerText =
  "";

  about.innerText =
  message;

}


/* ========================================
   FRIENDLY ERROR MESSAGE
======================================== */

function getFriendlyErrorMessage(error){

  if(error.code === "permission-denied"){

    return "Firebase did not allow this profile to be viewed. Check your Firestore security rules.";

  }


  if(error.code === "unavailable"){

    return "The profile could not be loaded because the internet connection is unavailable.";

  }


  return error.message ||
  "The member profile could not be loaded.";

}

</script>

</body>

</html>
