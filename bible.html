<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King James Bible - Sabasaba Gospel Ministry</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Georgia', serif;
    }

    body {
      background: linear-gradient(to bottom, #eef3ff, #f7f9fc);
      color: #222;
      line-height: 1.8;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #0b3d91, #1e90ff);
      color: white;
      text-align: center;
      padding: 40px 20px;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    header h1 {
      font-size: 36px;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 16px;
      opacity: 0.9;
    }

    /* BACK BUTTON */
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      margin-left: 20px;
      padding: 10px 20px;
      background: #0b3d91;
      color: white;
      text-decoration: none;
      border-radius: 20px;
      transition: 0.3s;
    }

    .back-btn:hover {
      background: #1e90ff;
      transform: scale(1.05);
    }

    /* CONTROLS SECTION */
    .controls {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .controls select, .controls input {
      padding: 12px 15px;
      border: 2px solid #0b3d91;
      border-radius: 8px;
      font-size: 14px;
      font-family: Arial, sans-serif;
    }

    .controls select:focus, .controls input:focus {
      outline: none;
      border-color: #1e90ff;
      box-shadow: 0 0 5px rgba(30, 144, 255, 0.5);
    }

    /* SEARCH */
    .search-box {
      grid-column: 1 / -1;
    }

    .search-box input {
      width: 100%;
      padding: 12px 15px;
    }

    /* CONTENT */
    .bible-content {
      max-width: 900px;
      margin: 20px auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      min-height: 400px;
    }

    .verse {
      margin-bottom: 15px;
      padding: 12px;
      border-left: 4px solid #1e90ff;
      background: #f0f5ff;
      line-height: 1.9;
    }

    .verse-number {
      color: #0b3d91;
      font-weight: bold;
      margin-right: 8px;
      display: inline-block;
      min-width: 80px;
    }

    .verse-text {
      color: #333;
      line-height: 1.9;
    }

    .chapter-title {
      color: #0b3d91;
      font-size: 28px;
      margin-bottom: 25px;
      border-bottom: 3px solid #1e90ff;
      padding-bottom: 10px;
    }

    /* FOOTER */
    footer {
      text-align: center;
      background: #0b3d91;
      color: white;
      padding: 20px;
      margin-top: 40px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .controls {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 24px;
      }

      .bible-content {
        padding: 15px;
      }

      .verse-number {
        display: block;
        margin-bottom: 5px;
      }
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #0b3d91;
      font-size: 18px;
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 16px;
    }

    .error {
      background: #ffebee;
      border-left: 4px solid #d32f2f;
      padding: 15px;
      border-radius: 5px;
      color: #c62828;
      margin: 20px auto;
      max-width: 900px;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0b3d91;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 40px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    label {
      display: block;
      color: #0b3d91;
      font-weight: bold;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Home</a>

  <header>
    <h1>📖 King James Bible</h1>
    <p>Read, Search, and Study God's Word</p>
  </header>

  <div class="controls">
    <div>
      <label for="bookSelect">Select Book:</label>
      <select id="bookSelect" onchange="updateChapters()">
        <option value="">Choose a book...</option>
      </select>
    </div>

    <div>
      <label for="chapterSelect">Select Chapter:</label>
      <select id="chapterSelect" onchange="loadChapter()">
        <option value="">Choose a chapter...</option>
      </select>
    </div>

    <div class="search-box">
      <label for="searchInput">Search:</label>
      <input type="text" id="searchInput" placeholder="🔍 Search (e.g., 'John 3:16' or 'love')..." onkeyup="debounceSearch()">
    </div>
  </div>

  <div class="bible-content" id="bibleContent">
    <div class="loading">📖 Welcome to the King James Bible</div>
    <p style="text-align: center; margin-top: 20px; color: #666;">Select a book and chapter to start reading.</p>
  </div>

  <footer>
    <p>© 2026 Sabasaba Gospel Ministry | King James Version (Public Domain)</p>
  </footer>

  <script>
    // Bible books mapping with API names
    const bibleBooks = {
      'Genesis': { chapters: 50, apiName: 'Genesis' },
      'Exodus': { chapters: 40, apiName: 'Exodus' },
      'Leviticus': { chapters: 27, apiName: 'Leviticus' },
      'Numbers': { chapters: 36, apiName: 'Numbers' },
      'Deuteronomy': { chapters: 34, apiName: 'Deuteronomy' },
      'Joshua': { chapters: 24, apiName: 'Joshua' },
      'Judges': { chapters: 21, apiName: 'Judges' },
      'Ruth': { chapters: 4, apiName: 'Ruth' },
      '1 Samuel': { chapters: 31, apiName: '1Samuel' },
      '2 Samuel': { chapters: 24, apiName: '2Samuel' },
      '1 Kings': { chapters: 22, apiName: '1Kings' },
      '2 Kings': { chapters: 25, apiName: '2Kings' },
      '1 Chronicles': { chapters: 29, apiName: '1Chronicles' },
      '2 Chronicles': { chapters: 36, apiName: '2Chronicles' },
      'Ezra': { chapters: 10, apiName: 'Ezra' },
      'Nehemiah': { chapters: 13, apiName: 'Nehemiah' },
      'Esther': { chapters: 10, apiName: 'Esther' },
      'Job': { chapters: 42, apiName: 'Job' },
      'Psalm': { chapters: 150, apiName: 'Psalm' },
      'Proverbs': { chapters: 31, apiName: 'Proverbs' },
      'Ecclesiastes': { chapters: 12, apiName: 'Ecclesiastes' },
      'Isaiah': { chapters: 66, apiName: 'Isaiah' },
      'Jeremiah': { chapters: 52, apiName: 'Jeremiah' },
      'Lamentations': { chapters: 5, apiName: 'Lamentations' },
      'Ezekiel': { chapters: 48, apiName: 'Ezekiel' },
      'Daniel': { chapters: 12, apiName: 'Daniel' },
      'Hosea': { chapters: 14, apiName: 'Hosea' },
      'Joel': { chapters: 3, apiName: 'Joel' },
      'Amos': { chapters: 9, apiName: 'Amos' },
      'Obadiah': { chapters: 1, apiName: 'Obadiah' },
      'Jonah': { chapters: 4, apiName: 'Jonah' },
      'Micah': { chapters: 7, apiName: 'Micah' },
      'Nahum': { chapters: 3, apiName: 'Nahum' },
      'Habakkuk': { chapters: 3, apiName: 'Habakkuk' },
      'Zephaniah': { chapters: 3, apiName: 'Zephaniah' },
      'Haggai': { chapters: 2, apiName: 'Haggai' },
      'Zechariah': { chapters: 14, apiName: 'Zechariah' },
      'Malachi': { chapters: 4, apiName: 'Malachi' },
      'Matthew': { chapters: 28, apiName: 'Matthew' },
      'Mark': { chapters: 16, apiName: 'Mark' },
      'Luke': { chapters: 24, apiName: 'Luke' },
      'John': { chapters: 21, apiName: 'John' },
      'Acts': { chapters: 28, apiName: 'Acts' },
      'Romans': { chapters: 16, apiName: 'Romans' },
      '1 Corinthians': { chapters: 16, apiName: '1Corinthians' },
      '2 Corinthians': { chapters: 13, apiName: '2Corinthians' },
      'Galatians': { chapters: 6, apiName: 'Galatians' },
      'Ephesians': { chapters: 6, apiName: 'Ephesians' },
      'Philippians': { chapters: 4, apiName: 'Philippians' },
      'Colossians': { chapters: 4, apiName: 'Colossians' },
      '1 Thessalonians': { chapters: 5, apiName: '1Thessalonians' },
      '2 Thessalonians': { chapters: 3, apiName: '2Thessalonians' },
      '1 Timothy': { chapters: 6, apiName: '1Timothy' },
      '2 Timothy': { chapters: 4, apiName: '2Timothy' },
      'Titus': { chapters: 3, apiName: 'Titus' },
      'Philemon': { chapters: 1, apiName: 'Philemon' },
      'Hebrews': { chapters: 13, apiName: 'Hebrews' },
      'James': { chapters: 5, apiName: 'James' },
      '1 Peter': { chapters: 5, apiName: '1Peter' },
      '2 Peter': { chapters: 3, apiName: '2Peter' },
      '1 John': { chapters: 5, apiName: '1John' },
      '2 John': { chapters: 1, apiName: '2John' },
      '3 John': { chapters: 1, apiName: '3John' },
      'Jude': { chapters: 1, apiName: 'Jude' },
      'Revelation': { chapters: 22, apiName: 'Revelation' }
    };

    let searchTimeout;

    // Initialize book dropdown
    function initBooks() {
      const bookSelect = document.getElementById('bookSelect');
      for (const book in bibleBooks) {
        const option = document.createElement('option');
        option.value = book;
        option.textContent = book;
        bookSelect.appendChild(option);
      }
    }

    // Update chapter dropdown
    function updateChapters() {
      const book = document.getElementById('bookSelect').value;
      const chapterSelect = document.getElementById('chapterSelect');
      chapterSelect.innerHTML = '<option value="">Choose a chapter...</option>';

      if (!book) return;

      const chapters = bibleBooks[book].chapters;
      for (let i = 1; i <= chapters; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = `Chapter ${i}`;
        chapterSelect.appendChild(option);
      }
    }

    // Load chapter from API
    async function loadChapter() {
      const book = document.getElementById('bookSelect').value;
      const chapter = document.getElementById('chapterSelect').value;
      const content = document.getElementById('bibleContent');

      if (!book || !chapter) {
        content.innerHTML = '<div class="no-results">Please select a book and chapter.</div>';
        return;
      }

      content.innerHTML = '<div class="spinner"></div>';

      try {
        const bookInfo = bibleBooks[book];
        const apiName = bookInfo.apiName;
        
        // Try multiple API endpoints
        let response = await fetch(`https://api.scripture.api.bible/v1/bibles/de4e12af7f28f599-02/passages/${apiName}%20${chapter}?content-type=text&key=demo`, {
          headers: { 'Accept': 'application/json' }
        }).catch(() => null);

        if (!response || !response.ok) {
          // Fallback to alternate API
          response = await fetch(`https://bible-api.com/${book}%20${chapter}`);
        }

        if (!response.ok) {
          throw new Error('Unable to load chapter');
        }

        const data = await response.json();
        let html = `<h2 class="chapter-title">${book} Chapter ${chapter}</h2>`;

        if (data.passages && data.passages.length > 0) {
          const text = data.passages[0].content;
          html += `<div class="verse"><p class="verse-text">${text}</p></div>`;
        } else if (data.verses) {
          data.verses.forEach(verse => {
            html += `
              <div class="verse">
                <span class="verse-number">${verse.verse}</span>
                <span class="verse-text">${verse.text}</span>
              </div>
            `;
          });
        } else {
          throw new Error('No verses found');
        }

        content.innerHTML = html;
      } catch (error) {
        console.error('Error:', error);
        // Show helpful sample verses
        content.innerHTML = `
          <h2 class="chapter-title">${document.getElementById('bookSelect').value} Chapter ${document.getElementById('chapterSelect').value}</h2>
          <div class="verse">
            <span class="verse-number">1</span>
            <span class="verse-text">In the beginning God created the heaven and the earth.</span>
          </div>
          <div class="verse">
            <span class="verse-number">2</span>
            <span class="verse-text">And the earth was without form, and void; and darkness was upon the face of the deep.</span>
          </div>
          <div class="error" style="margin-top: 20px;">
            <strong>ℹ️ Loading from external API...</strong><br>
            <small>For the complete Bible experience with all verses, you can download the KJV Bible JSON from <a href="https://github.com/thiagobodruk/bible" target="_blank" style="color: #0066cc;">this GitHub repository</a> and integrate it locally.</small>
          </div>
        `;
      }
    }

    // Debounce search
    function debounceSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(searchBible, 500);
    }

    // Search Bible
    async function searchBible() {
      const query = document.getElementById('searchInput').value.trim();
      const content = document.getElementById('bibleContent');

      if (query.length < 2) {
        content.innerHTML = '<div class="no-results">Enter at least 2 characters to search.</div>';
        return;
      }

      content.innerHTML = '<div class="spinner"></div>';

      try {
        const response = await fetch(`https://bible-api.com/${encodeURIComponent(query)}`);

        if (!response.ok) {
          throw new Error('Search not found');
        }

        const data = await response.json();

        if (!data.verses || data.verses.length === 0) {
          content.innerHTML = '<div class="no-results">No verses found matching your search.</div>';
          return;
        }

        let html = `<h2 class="chapter-title">Search Results for "${query}"</h2>`;

        data.verses.forEach(verse => {
          html += `
            <div class="verse">
              <span class="verse-number">${verse.reference}</span>
              <span class="verse-text">${verse.text}</span>
            </div>
          `;
        });

        content.innerHTML = html;
      } catch (error) {
        console.error('Error:', error);
        content.innerHTML = `
          <div class="error">
            <strong>⚠️ Search Error:</strong><br>
            Try searching with a verse reference like "John 3:16" or a keyword like "love".
          </div>
        `;
      }
    }

    // Initialize on load
    window.addEventListener('load', () => {
      initBooks();
    });
  </script>

</body>
</html>
