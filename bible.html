<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King James Bible - Sabasaba Gospel Ministry</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Georgia', serif;
    }

    body {
      background: linear-gradient(to bottom, #eef3ff, #f7f9fc);
      color: #222;
      line-height: 1.8;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #0b3d91, #1e90ff);
      color: white;
      text-align: center;
      padding: 40px 20px;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    header h1 {
      font-size: 36px;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 16px;
      opacity: 0.9;
    }

    /* BACK BUTTON */
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      margin-left: 20px;
      padding: 10px 20px;
      background: #0b3d91;
      color: white;
      text-decoration: none;
      border-radius: 20px;
      transition: 0.3s;
    }

    .back-btn:hover {
      background: #1e90ff;
      transform: scale(1.05);
    }

    /* CONTROLS SECTION */
    .controls {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .controls select, .controls input {
      padding: 12px 15px;
      border: 2px solid #0b3d91;
      border-radius: 8px;
      font-size: 14px;
      font-family: Arial, sans-serif;
    }

    .controls select:focus, .controls input:focus {
      outline: none;
      border-color: #1e90ff;
      box-shadow: 0 0 5px rgba(30, 144, 255, 0.5);
    }

    /* SEARCH */
    .search-box {
      grid-column: 1 / -1;
    }

    .search-box input {
      width: 100%;
      padding: 12px 15px;
    }

    /* CONTENT */
    .bible-content {
      max-width: 900px;
      margin: 20px auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      min-height: 400px;
    }

    .verse {
      margin-bottom: 15px;
      padding: 12px;
      border-left: 4px solid #1e90ff;
      background: #f0f5ff;
      line-height: 1.9;
    }

    .verse-number {
      color: #0b3d91;
      font-weight: bold;
      margin-right: 8px;
      display: inline-block;
      min-width: 100px;
    }

    .verse-text {
      color: #333;
      line-height: 1.9;
    }

    .chapter-title {
      color: #0b3d91;
      font-size: 28px;
      margin-bottom: 25px;
      border-bottom: 3px solid #1e90ff;
      padding-bottom: 10px;
    }

    .book-name {
      color: #0b3d91;
      font-size: 20px;
      margin-top: 15px;
      margin-bottom: 10px;
    }

    /* FOOTER */
    footer {
      text-align: center;
      background: #0b3d91;
      color: white;
      padding: 20px;
      margin-top: 40px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .controls {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 24px;
      }

      .bible-content {
        padding: 15px;
      }

      .verse-number {
        display: block;
        margin-bottom: 5px;
      }
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #0b3d91;
      font-size: 18px;
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 16px;
    }

    .error {
      background: #ffebee;
      border-left: 4px solid #d32f2f;
      padding: 15px;
      border-radius: 5px;
      color: #c62828;
      margin: 20px auto;
      max-width: 900px;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0b3d91;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 40px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Home</a>

  <header>
    <h1>📖 King James Bible</h1>
    <p>Read, Search, and Study God's Word</p>
  </header>

  <div class="controls">
    <div>
      <label for="bookSelect" style="color: #0b3d91; font-weight: bold;">Select Book:</label>
      <select id="bookSelect" onchange="updateChapters()">
        <option value="">Choose a book...</option>
      </select>
    </div>

    <div>
      <label for="chapterSelect" style="color: #0b3d91; font-weight: bold;">Select Chapter:</label>
      <select id="chapterSelect" onchange="loadChapter()">
        <option value="">Choose a chapter...</option>
      </select>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Search Bible (e.g., 'John 3:16' or 'love')..." onkeyup="searchBible()">
    </div>
  </div>

  <div class="bible-content" id="bibleContent">
    <div class="loading">📖 Welcome to the King James Bible</div>
    <p style="text-align: center; margin-top: 20px; color: #666;">Select a book and chapter to start reading.</p>
  </div>

  <footer>
    <p>© 2026 Sabasaba Gospel Ministry | King James Version (Public Domain) | Powered by Bible API</p>
  </footer>

  <script>
    // Complete list of Bible books with chapter counts
    const bibleBooks = {
      'Genesis': 50, 'Exodus': 40, 'Leviticus': 27, 'Numbers': 36, 'Deuteronomy': 34,
      'Joshua': 24, 'Judges': 21, 'Ruth': 4, '1 Samuel': 31, '2 Samuel': 24,
      '1 Kings': 22, '2 Kings': 25, '1 Chronicles': 29, '2 Chronicles': 36, 'Ezra': 10,
      'Nehemiah': 13, 'Esther': 10, 'Job': 42, 'Psalm': 150, 'Proverbs': 31,
      'Ecclesiastes': 12, 'Isaiah': 66, 'Jeremiah': 52, 'Lamentations': 5, 'Ezekiel': 48,
      'Daniel': 12, 'Hosea': 14, 'Joel': 3, 'Amos': 9, 'Obadiah': 1,
      'Jonah': 4, 'Micah': 7, 'Nahum': 3, 'Habakkuk': 3, 'Zephaniah': 3,
      'Haggai': 2, 'Zechariah': 14, 'Malachi': 4, 'Matthew': 28, 'Mark': 16,
      'Luke': 24, 'John': 21, 'Acts': 28, 'Romans': 16, '1 Corinthians': 16,
      '2 Corinthians': 13, 'Galatians': 6, 'Ephesians': 6, 'Philippians': 4, 'Colossians': 4,
      '1 Thessalonians': 5, '2 Thessalonians': 3, '1 Timothy': 6, '2 Timothy': 4, 'Titus': 3,
      'Philemon': 1, 'Hebrews': 13, 'James': 5, '1 Peter': 5, '2 Peter': 3,
      '1 John': 5, '2 John': 1, '3 John': 1, 'Jude': 1, 'Revelation': 22
    };

    // Initialize book dropdown
    function initBooks() {
      const bookSelect = document.getElementById('bookSelect');
      for (const book in bibleBooks) {
        const option = document.createElement('option');
        option.value = book;
        option.textContent = book;
        bookSelect.appendChild(option);
      }
    }

    // Update chapter dropdown
    function updateChapters() {
      const book = document.getElementById('bookSelect').value;
      const chapterSelect = document.getElementById('chapterSelect');
      chapterSelect.innerHTML = '<option value="">Choose a chapter...</option>';

      if (!book) return;

      const chapters = bibleBooks[book];
      for (let i = 1; i <= chapters; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = `Chapter ${i}`;
        chapterSelect.appendChild(option);
      }
    }

    // Load chapter from API
    async function loadChapter() {
      const book = document.getElementById('bookSelect').value;
      const chapter = document.getElementById('chapterSelect').value;
      const content = document.getElementById('bibleContent');

      if (!book || !chapter) {
        content.innerHTML = '<div class="no-results">Please select a book and chapter.</div>';
        return;
      }

      content.innerHTML = '<div class="spinner"></div>';

      try {
        // Using Bible API
        const reference = `${book} ${chapter}`;
        const response = await fetch(`https://bible-api.com/${encodeURIComponent(reference)}?translation=kjv`);
        
        if (!response.ok) {
          throw new Error('Chapter not found');
        }

        const data = await response.json();

        if (!data.verses || data.verses.length === 0) {
          content.innerHTML = '<div class="no-results">No verses found for this chapter.</div>';
          return;
        }

        let html = `<h2 class="chapter-title">${data.reference}</h2>`;
        
        data.verses.forEach(verse => {
          html += `
            <div class="verse">
              <span class="verse-number">${verse.verse}</span>
              <span class="verse-text">${verse.text}</span>
            </div>
          `;
        });

        content.innerHTML = html;
      } catch (error) {
        console.error('Error:', error);
        content.innerHTML = `
          <div class="error">
            <strong>⚠️ Error loading chapter:</strong><br>
            ${error.message}<br><br>
            <small>Try another chapter or book.</small>
          </div>
        `;
      }
    }

    // Search Bible
    async function searchBible() {
      const query = document.getElementById('searchInput').value.trim();
      const content = document.getElementById('bibleContent');

      if (query.length < 2) {
        content.innerHTML = '<div class="no-results">Enter at least 2 characters to search.</div>';
        return;
      }

      content.innerHTML = '<div class="spinner"></div>';

      try {
        const response = await fetch(`https://bible-api.com/${encodeURIComponent(query)}?translation=kjv`);
        
        if (!response.ok) {
          throw new Error('Search not found');
        }

        const data = await response.json();

        if (!data.verses || data.verses.length === 0) {
          content.innerHTML = '<div class="no-results">No verses found matching your search.</div>';
          return;
        }

        let html = `<h2 class="chapter-title">Search Results: "${query}"</h2>`;
        
        data.verses.forEach(verse => {
          html += `
            <div class="verse">
              <span class="verse-number">${verse.reference}</span>
              <span class="verse-text">${verse.text}</span>
            </div>
          `;
        });

        content.innerHTML = html;
      } catch (error) {
        console.error('Error:', error);
        content.innerHTML = `
          <div class="error">
            <strong>⚠️ Search Error:</strong><br>
            ${error.message}<br><br>
            <small>Try searching with a verse reference like "John 3:16" or a keyword.</small>
          </div>
        `;
      }
    }

    // Initialize on load
    window.addEventListener('load', () => {
      initBooks();
    });
  </script>

</body>
</html>
