<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King James Bible - Sabasaba Gospel Ministry</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Georgia', serif;
    }

    body {
      background: linear-gradient(to bottom, #eef3ff, #f7f9fc);
      color: #222;
      line-height: 1.8;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #0b3d91, #1e90ff);
      color: white;
      text-align: center;
      padding: 40px 20px;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    header h1 {
      font-size: 36px;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 16px;
      opacity: 0.9;
    }

    /* BACK BUTTON */
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: #0b3d91;
      color: white;
      text-decoration: none;
      border-radius: 20px;
      transition: 0.3s;
    }

    .back-btn:hover {
      background: #1e90ff;
      transform: scale(1.05);
    }

    /* CONTROLS SECTION */
    .controls {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
    }

    .controls select, .controls input {
      padding: 10px 15px;
      border: 2px solid #0b3d91;
      border-radius: 8px;
      font-size: 14px;
      font-family: Arial, sans-serif;
    }

    .controls select:focus, .controls input:focus {
      outline: none;
      border-color: #1e90ff;
      box-shadow: 0 0 5px rgba(30, 144, 255, 0.5);
    }

    /* SEARCH */
    .search-box {
      grid-column: 1 / -1;
    }

    .search-box input {
      width: 100%;
      padding: 12px 15px;
    }

    /* CONTENT */
    .bible-content {
      max-width: 900px;
      margin: 20px auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      min-height: 400px;
    }

    .verse {
      margin-bottom: 15px;
      padding: 10px;
      border-left: 4px solid #1e90ff;
      background: #f0f5ff;
    }

    .verse-number {
      color: #0b3d91;
      font-weight: bold;
      margin-right: 8px;
    }

    .verse-text {
      color: #333;
      line-height: 1.8;
    }

    .chapter-title {
      color: #0b3d91;
      font-size: 24px;
      margin-bottom: 20px;
      border-bottom: 3px solid #1e90ff;
      padding-bottom: 10px;
    }

    .book-name {
      color: #0b3d91;
      font-size: 20px;
      margin-top: 15px;
      margin-bottom: 10px;
    }

    /* FOOTER */
    footer {
      text-align: center;
      background: #0b3d91;
      color: white;
      padding: 20px;
      margin-top: 40px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .controls {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 24px;
      }

      .bible-content {
        padding: 15px;
      }
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #0b3d91;
      font-size: 18px;
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Home</a>

  <header>
    <h1>📖 King James Bible</h1>
    <p>Read, Search, and Study God's Word</p>
  </header>

  <div class="controls">
    <select id="bookSelect" onchange="loadChapter()">
      <option value="">Select a Book...</option>
    </select>

    <select id="chapterSelect" onchange="loadChapter()">
      <option value="">Select a Chapter...</option>
    </select>

    <select id="verseSelect" onchange="goToVerse()">
      <option value="">Go to Verse...</option>
    </select>

    <input type="text" id="searchInput" placeholder="🔍 Search the Bible..." onkeyup="searchBible()">
  </div>

  <div class="bible-content" id="bibleContent">
    <div class="loading">Loading Bible...</div>
  </div>

  <footer>
    <p>© 2026 Sabasaba Gospel Ministry | King James Version (Public Domain)</p>
  </footer>

  <script>
    // Bible data structure - KJV simplified version
    const bibleData = {
      'Genesis': 50,
      'Exodus': 40,
      'Leviticus': 27,
      'Numbers': 36,
      'Deuteronomy': 34,
      'Joshua': 24,
      'Judges': 21,
      'Ruth': 4,
      '1 Samuel': 31,
      '2 Samuel': 24,
      '1 Kings': 22,
      '2 Kings': 25,
      '1 Chronicles': 29,
      '2 Chronicles': 36,
      'Ezra': 10,
      'Nehemiah': 13,
      'Esther': 10,
      'Job': 42,
      'Psalm': 150,
      'Proverbs': 31,
      'Ecclesiastes': 12,
      'Isaiah': 66,
      'Jeremiah': 52,
      'Lamentations': 5,
      'Ezekiel': 48,
      'Daniel': 12,
      'Hosea': 14,
      'Joel': 3,
      'Amos': 9,
      'Obadiah': 1,
      'Jonah': 4,
      'Micah': 7,
      'Nahum': 3,
      'Habakkuk': 3,
      'Zephaniah': 3,
      'Haggai': 2,
      'Zechariah': 14,
      'Malachi': 4,
      'Matthew': 28,
      'Mark': 16,
      'Luke': 24,
      'John': 21,
      'Acts': 28,
      'Romans': 16,
      '1 Corinthians': 16,
      '2 Corinthians': 13,
      'Galatians': 6,
      'Ephesians': 6,
      'Philippians': 4,
      'Colossians': 4,
      '1 Thessalonians': 5,
      '2 Thessalonians': 3,
      '1 Timothy': 6,
      '2 Timothy': 4,
      'Titus': 3,
      'Philemon': 1,
      'Hebrews': 13,
      'James': 5,
      '1 Peter': 5,
      '2 Peter': 3,
      '1 John': 5,
      '2 John': 1,
      '3 John': 1,
      'Jude': 1,
      'Revelation': 22
    };

    // Placeholder verses - In production, load from API or file
    const verses = {
      'John:3:16': 'For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.',
      'Romans:8:28': 'And we know that all things work together for good to them that love God, to them who are the called according to his purpose.',
      'Philippians:4:13': 'I can do all things through Christ which strengtheneth me.',
      'Psalm:23:1': 'The LORD is my shepherd; I shall not want.'
    };

    // Initialize book dropdown
    function initBooks() {
      const bookSelect = document.getElementById('bookSelect');
      for (const book in bibleData) {
        const option = document.createElement('option');
        option.value = book;
        option.textContent = book;
        bookSelect.appendChild(option);
      }
    }

    // Update chapter dropdown
    function updateChapters() {
      const book = document.getElementById('bookSelect').value;
      const chapterSelect = document.getElementById('chapterSelect');
      chapterSelect.innerHTML = '<option value="">Select a Chapter...</option>';

      if (!book) return;

      const chapters = bibleData[book];
      for (let i = 1; i <= chapters; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = `Chapter ${i}`;
        chapterSelect.appendChild(option);
      }
    }

    // Load chapter
    function loadChapter() {
      const book = document.getElementById('bookSelect').value;
      const chapter = document.getElementById('chapterSelect').value;
      const content = document.getElementById('bibleContent');

      if (!book || !chapter) {
        content.innerHTML = '<div class="no-results">Please select a book and chapter.</div>';
        return;
      }

      // Display sample content
      content.innerHTML = `
        <h2 class="chapter-title">${book} Chapter ${chapter}</h2>
        <div class="verse">
          <span class="verse-number">${book} ${chapter}:1-3 (KJV)</span>
          <p class="verse-text">This is where the full chapter verses would display. To use the complete Bible database, integrate with an API like:</p>
        </div>
        <div class="verse">
          <span class="verse-number">📌 API Options:</span>
          <p class="verse-text">
            1. API.Bible (biblestudytools.com)<br>
            2. Scripture.API.Bible<br>
            3. ESV Bible API<br>
            Or load a local JSON file with all verses.
          </p>
        </div>
      `;
    }

    // Search Bible
    function searchBible() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const content = document.getElementById('bibleContent');

      if (query.length < 2) {
        content.innerHTML = '<div class="no-results">Enter at least 2 characters to search.</div>';
        return;
      }

      // Search in sample verses
      const results = Object.entries(verses)
        .filter(([key, text]) => text.toLowerCase().includes(query))
        .map(([key, text]) => {
          const [book, chapter, verse] = key.split(':');
          return `
            <div class="verse">
              <span class="verse-number">${book} ${chapter}:${verse}</span>
              <p class="verse-text">${text}</p>
            </div>
          `;
        });

      if (results.length === 0) {
        content.innerHTML = '<div class="no-results">No verses found matching your search.</div>';
      } else {
        content.innerHTML = `<h2 class="chapter-title">Search Results (${results.length})</h2>` + results.join('');
      }
    }

    // Go to specific verse
    function goToVerse() {
      const verse = document.getElementById('verseSelect').value;
      if (verse && verses[verse]) {
        const [book, chapter, verseNum] = verse.split(':');
        document.getElementById('bookSelect').value = book;
        updateChapters();
        document.getElementById('chapterSelect').value = chapter;
        searchBible();
      }
    }

    // Initialize on load
    window.addEventListener('load', () => {
      initBooks();
      document.getElementById('bibleContent').innerHTML = `
        <h2 class="chapter-title">Welcome to the King James Bible</h2>
        <div class="verse">
          <p class="verse-text">
            Select a book and chapter from the dropdown menu above to begin reading God's Word. 
            You can also search for specific verses or passages using the search function.
          </p>
        </div>
        <div class="verse" style="background: #fff0f0; border-left-color: #d32f2f;">
          <p class="verse-text">
            <strong>💡 To load the complete Bible:</strong><br>
            This page currently uses a simplified structure. To load all verses, integrate with a free Bible API 
            or download the complete KJV text from Project Gutenberg and convert it to JSON format.
          </p>
        </div>
      `;
    });
  </script>

</body>
</html>
