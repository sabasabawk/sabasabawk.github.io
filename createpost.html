<script type="module">
/* =====================================================
   PART 3 OF 6

/* =====================================================

import {

} from "./firebase.js";

/* =====================================================
   CLOUDINARY SETTINGS
===================================================== */

const cloudName =
"glq2nymz";


const uploadPreset =
"sabasaba_community";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser =
null;


let currentProfile =
{};


let selectedMediaFile =
null;


let selectedMediaType =
"none";


let mediaPreviewUrl =
"";


let activeUploadRequest =
null;


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const nameInput =
document.getElementById(
  "name"
);


const categoryInput =
document.getElementById(
  "category"
);


const postInput =
document.getElementById(
  "post"
);


const mediaFileInput =
document.getElementById(
  "mediaFile"
);


const choosePhotoBtn =
document.getElementById(

);


const chooseVideoBtn =
document.getElementById(

);


const mediaPreview =
document.getElementById(
  "mediaPreview"
);


const previewContent =
document.getElementById(
  "previewContent"
);


const previewFileName =
document.getElementById(
  "previewFileName"
);


const removeMediaBtn =
document.getElementById(
  "removeMediaBtn"
);


const uploadArea =
document.getElementById(
  "uploadArea"
);


const uploadProgress =
document.getElementById(
  "uploadProgress"
);


const uploadText =
document.getElementById(
  "uploadText"
);


const publishBtn =
document.getElementById(

);


const messageElement =
document.getElementById(
  "message"
);


/* =====================================================
   GET FIRST AVAILABLE VALUE
===================================================== */

function getFirstValue(...values){

  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value).trim();

    }

  }

  return "";

}


/* =====================================================
   DISPLAY STATUS MESSAGE
===================================================== */

function showMessage(
  message,
  type = "error"
){

  messageElement.textContent =
  message;


  messageElement.className =
  type === "success"
  ? "success-message"
  : "error-message";

}


/* =====================================================
   CLEAR STATUS MESSAGE
===================================================== */

function clearMessage(){

  messageElement.textContent =
  "";


  messageElement.className =
  "";

}


/* =====================================================
   RESET UPLOAD DISPLAY
===================================================== */

function resetUploadDisplay(){

  uploadArea.style.display =
  "none";


  uploadProgress.style.width =
  "0%";


  uploadText.textContent =
  "Preparing upload...";

}


/* =====================================================
   ENABLE PUBLISH BUTTON
===================================================== */

function enablePublishButton(){

  publishBtn.disabled =
  false;


  publishBtn.textContent =
  "📢 Publish Post";

}


/* =====================================================
   DISABLE PUBLISH BUTTON
===================================================== */

function disablePublishButton(){

  publishBtn.disabled =
  true;


  publishBtn.textContent =
  "Publishing...";

}
/* =====================================================
   PART 4 OF 6
   AUTHENTICATION, PROFILE LOADING
   AND OPENING THE PHONE GALLERY
===================================================== */


/* =====================================================
   LOAD CURRENT USER PROFILE
===================================================== */

async function loadCurrentProfile(){

  currentProfile =
  {};


  if(!currentUser){

    return;

  }


  try{

    const profileReference =
    doc(
      db,
      "users",
      currentUser.uid
    );


    const profileSnapshot =
    await getDoc(
      profileReference
    );


    if(profileSnapshot.exists()){

      currentProfile =
      profileSnapshot.data();


      const savedName =
      getFirstValue(
        currentProfile.name,
        currentProfile.fullName,
        currentProfile.displayName,
        currentUser.displayName
      );


      if(savedName){

        nameInput.value =
        savedName;

      }

    }

  }catch(error){

    console.error(
      "Profile loading error:",
      error
    );

  }

}


/* =====================================================
   AUTHENTICATION STATE
===================================================== */

onAuthStateChanged(
  auth,
  async function(user){

    if(!user){

      window.location.replace(
        "login.html"
      );

      return;

    }


    currentUser =
    user;


    await loadCurrentProfile();

  }
);


/* =====================================================
   OPEN PHOTO OR VIDEO PICKER
===================================================== */

function openMediaPicker(mediaType){

  clearMessage();


  mediaFileInput.value =
  "";


  if(mediaType === "image"){

    mediaFileInput.accept =
    "image/*";

  }else if(mediaType === "video"){

    mediaFileInput.accept =
    "video/*";

  }else{

    mediaFileInput.accept =
    "image/*,video/*";

  }


  mediaFileInput.click();

}


/* =====================================================
   CHOOSE PHOTO BUTTON
===================================================== */

choosePhotoBtn.addEventListener(
  "click",
  function(){

    openMediaPicker(
      "image"
    );

  }
);


/* =====================================================
   CHOOSE VIDEO BUTTON
===================================================== */

chooseVideoBtn.addEventListener(
  "click",
  function(){

    openMediaPicker(
      "video"
    );

  }
);


/* =====================================================
   OPEN REQUESTED PICKER FROM COMMUNITY WALL
===================================================== */

function openRequestedMediaPicker(){

  const parameters =
  new URLSearchParams(
    window.location.search
  );


  const requestedMedia =
  parameters.get(
    "media"
  );


  if(
    requestedMedia !== "image" &&
    requestedMedia !== "video"
  ){

    return;

  }


  window.setTimeout(
    function(){

      openMediaPicker(
        requestedMedia
      );

    },
    400
  );

}


/* =====================================================
   RUN REQUESTED PICKER AFTER PAGE LOAD
===================================================== */

window.addEventListener(
  "load",
  function(){

    openRequestedMediaPicker();

  }
);
/* =====================================================
   PART 5 OF 6
   MEDIA SELECTION, PREVIEW
   AND CLOUDINARY UPLOAD
===================================================== */


/* =====================================================
   MEDIA FILE SELECTION
===================================================== */

mediaFileInput.addEventListener(
  "change",
  function(event){

    clearMessage();


    const file =
    event.target.files[0];


    if(!file){

      clearSelectedMedia();

      return;

    }


    const isImage =
    file.type.startsWith(
      "image/"
    );


    const isVideo =
    file.type.startsWith(
      "video/"
    );


    if(
      !isImage &&
      !isVideo
    ){

      showMessage(
        "Please select a valid photo or video."
      );


      clearSelectedMedia();

      return;

    }


    const maximumImageSize =
    10 * 1024 * 1024;


    const maximumVideoSize =
    100 * 1024 * 1024;


    if(
      isImage &&
      file.size > maximumImageSize
    ){

      showMessage(
        "The selected photo is too large. Photos must be 10 MB or smaller."
      );


      clearSelectedMedia();

      return;

    }


    if(
      isVideo &&
      file.size > maximumVideoSize
    ){

      showMessage(
        "The selected video is too large. Videos must be 100 MB or smaller."
      );


      clearSelectedMedia();

      return;

    }


    selectedMediaFile =
    file;


    selectedMediaType =
    isImage
    ? "image"
    : "video";


    if(mediaPreviewUrl){

      URL.revokeObjectURL(
        mediaPreviewUrl
      );

    }


    mediaPreviewUrl =
    URL.createObjectURL(
      file
    );


    showMediaPreview();

  }
);


/* =====================================================
   SHOW MEDIA PREVIEW
===================================================== */

function showMediaPreview(){

  previewContent.innerHTML =
  "";


  previewFileName.textContent =
  selectedMediaFile
  ? selectedMediaFile.name
  : "";


  if(
    selectedMediaType === "image"
  ){

    const image =
    document.createElement(
      "img"
    );


    image.src =
    mediaPreviewUrl;


    image.alt =
    "Selected photo preview";


    image.loading =
    "lazy";


    previewContent.appendChild(
      image
    );

  }


  if(
    selectedMediaType === "video"
  ){

    const video =
    document.createElement(
      "video"
    );


    video.src =
    mediaPreviewUrl;


    video.controls =
    true;


    video.playsInline =
    true;


    video.preload =
    "metadata";


    previewContent.appendChild(
      video
    );

  }


  mediaPreview.style.display =
  "block";

}


/* =====================================================
   CLEAR SELECTED MEDIA
===================================================== */

function clearSelectedMedia(){

  selectedMediaFile =
  null;


  selectedMediaType =
  "none";


  mediaFileInput.value =
  "";


  previewContent.innerHTML =
  "";


  previewFileName.textContent =
  "";


  mediaPreview.style.display =
  "none";


  if(mediaPreviewUrl){

    URL.revokeObjectURL(
      mediaPreviewUrl
    );


    mediaPreviewUrl =
    "";

  }

}


/* =====================================================
   REMOVE MEDIA BUTTON
===================================================== */

removeMediaBtn.addEventListener(
  "click",
  function(){

    if(activeUploadRequest){

      activeUploadRequest.abort();


      activeUploadRequest =
      null;

    }


    resetUploadDisplay();


    clearSelectedMedia();


    clearMessage();

  }
);


/* =====================================================
   CLOUDINARY UPLOAD FUNCTION
   (IMAGES: SINGLE REQUEST — VIDEOS: CHUNKED WITH RETRY)
===================================================== */

const CHUNK_SIZE =
6 * 1024 * 1024;


function generateUploadId(){

  return (
    "upload-" +
    Date.now() +
    "-" +
    Math.random().toString(16).slice(2)
  );

}


async function uploadPostMedia(file){

  if(!currentUser){

    throw new Error(
      "You must sign in before uploading media."
    );

  }


  if(!file){

    return {

      mediaType:
      "none",

      mediaUrl:
      "",

      mediaName:
      ""

    };

  }


  const resourceType =
  file.type.startsWith(
    "video/"
  )
  ? "video"
  : "image";


  uploadArea.style.display =
  "block";


  uploadProgress.style.width =
  "0%";


  uploadText.textContent =
  "Uploading media: 0%";


  if(resourceType === "video"){

    return uploadVideoInChunks(
      file
    );

  }


  return uploadImageDirect(
    file
  );

}


/* =====================================================
   IMAGE UPLOAD (SINGLE REQUEST, UNCHANGED BEHAVIOUR)
===================================================== */

function uploadImageDirect(file){

  const uploadUrl =
  `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`;


  const formData =
  new FormData();


  formData.append(
    "file",
    file
  );


  formData.append(
    "upload_preset",
    uploadPreset
  );


  return new Promise(
    function(resolve,reject){

      const request =
      new XMLHttpRequest();


      activeUploadRequest =
      request;


      request.open(
        "POST",
        uploadUrl,
        true
      );


      request.timeout =
      300000;


      request.upload.addEventListener(
        "progress",
        function(event){

          if(!event.lengthComputable){

            return;

          }


          const progress =
          Math.round(
            (
              event.loaded /
              event.total
            ) * 100
          );


          uploadProgress.style.width =
          `${progress}%`;


          uploadText.textContent =
          `Uploading media: ${progress}%`;

        }
      );


      request.addEventListener(
        "load",
        function(){

          activeUploadRequest =
          null;


          try{

            const response =
            JSON.parse(
              request.responseText
            );


            if(
              request.status < 200 ||
              request.status >= 300
            ){

              throw new Error(
                response?.error?.message ||
                "Cloudinary rejected the media upload."
              );

            }


            if(!response.secure_url){

              throw new Error(
                "Cloudinary did not return a media link."
              );

            }


            uploadProgress.style.width =
            "100%";


            uploadText.textContent =
            "Media uploaded successfully.";


            resolve({

              mediaType:
              "image",

              mediaUrl:
              response.secure_url,

              mediaName:
              file.name

            });

          }catch(error){

            console.error(
              "Cloudinary response error:",
              error
            );


            uploadText.textContent =
            "Media upload failed.";


            reject(error);

          }

        }
      );


      request.addEventListener(
        "error",
        function(){

          activeUploadRequest =
          null;


          uploadText.textContent =
          "Media upload failed.";


          reject(
            new Error(
              "The media upload failed because of a network error."
            )
          );

        }
      );


      request.addEventListener(
        "timeout",
        function(){

          activeUploadRequest =
          null;


          uploadText.textContent =
          "Media upload timed out.";


          reject(
            new Error(
              "The media upload took too long. Please try again."
            )
          );

        }
      );


      request.addEventListener(
        "abort",
        function(){

          activeUploadRequest =
          null;


          uploadText.textContent =
          "Media upload cancelled.";


          reject(
            new Error(
              "The media upload was cancelled."
            )
          );

        }
      );


      request.send(
        formData
      );

    }
  );

}


/* =====================================================
   SEND ONE VIDEO CHUNK
===================================================== */

function uploadChunk(
  file,
  start,
  end,
  totalSize,
  uploadId,
  uploadUrl
){

  return new Promise(
    function(resolve,reject){

      const chunk =
      file.slice(
        start,
        end
      );


      const formData =
      new FormData();


      formData.append(
        "file",
        chunk
      );


      formData.append(
        "upload_preset",
        uploadPreset
      );


      const request =
      new XMLHttpRequest();


      activeUploadRequest =
      request;


      request.open(
        "POST",
        uploadUrl,
        true
      );


      request.timeout =
      120000;


      request.setRequestHeader(
        "X-Unique-Upload-Id",
        uploadId
      );


      request.setRequestHeader(
        "Content-Range",
        `bytes ${start}-${end - 1}/${totalSize}`
      );


      request.upload.addEventListener(
        "progress",
        function(event){

          if(!event.lengthComputable){

            return;

          }


          const bytesSoFar =
          start +
          event.loaded;


          const progress =
          Math.min(
            99,
            Math.round(
              (
                bytesSoFar /
                totalSize
              ) * 100
            )
          );


          uploadProgress.style.width =
          `${progress}%`;


          uploadText.textContent =
          `Uploading video: ${progress}%`;

        }
      );


      request.addEventListener(
        "load",
        function(){

          activeUploadRequest =
          null;


          if(
            request.status < 200 ||
            request.status >= 300
          ){

            let errorMessage =
            "Cloudinary rejected part of the video upload.";


            try{

              const response =
              JSON.parse(
                request.responseText
              );


              errorMessage =
              response?.error?.message ||
              errorMessage;

            }catch(parseError){

              /* keep default message */

            }


            reject(
              new Error(
                errorMessage
              )
            );


            return;

          }


          try{

            const response =
            JSON.parse(
              request.responseText
            );


            resolve(
              response
            );

          }catch(error){

            reject(
              new Error(
                "Cloudinary sent an unreadable response."
              )
            );

          }

        }
      );


      request.addEventListener(
        "error",
        function(){

          activeUploadRequest =
          null;


          reject(
            new Error(
              "network-error"
            )
          );

        }
      );


      request.addEventListener(
        "timeout",
        function(){

          activeUploadRequest =
          null;


          reject(
            new Error(
              "network-error"
            )
          );

        }
      );


      request.addEventListener(
        "abort",
        function(){

          activeUploadRequest =
          null;


          reject(
            new Error(
              "cancelled"
            )
          );

        }
      );


      request.send(
        formData
      );

    }
  );

}


/* =====================================================
   SEND ONE VIDEO CHUNK, RETRYING ON DROPPED CONNECTIONS
===================================================== */

async function uploadChunkWithRetry(
  file,
  start,
  end,
  totalSize,
  uploadId,
  uploadUrl,
  maxAttempts
){

  let lastError =
  null;


  for(
    let attempt = 1;
    attempt <= maxAttempts;
    attempt++
  ){

    try{

      return await uploadChunk(
        file,
        start,
        end,
        totalSize,
        uploadId,
        uploadUrl
      );

    }catch(error){

      lastError =
      error;


      if(error.message === "cancelled"){

        throw error;

      }


      if(attempt < maxAttempts){

        uploadText.textContent =
        `Connection interrupted. Retrying part of the video (${attempt}/${maxAttempts - 1})...`;


        await new Promise(
          function(resolveDelay){

            window.setTimeout(
              resolveDelay,
              1500 * attempt
            );

          }
        );

      }

    }

  }


  if(
    lastError &&
    lastError.message === "network-error"
  ){

    throw new Error(
      "The video upload kept failing because of a network error, even after retrying. Please try a smaller video or a stronger connection."
    );

  }


  throw lastError;

}


/* =====================================================
   VIDEO UPLOAD (SPLIT INTO CHUNKS)
===================================================== */

async function uploadVideoInChunks(file){

  const uploadUrl =
  `https://api.cloudinary.com/v1_1/${cloudName}/video/upload`;


  const uploadId =
  generateUploadId();


  const totalSize =
  file.size;


  let start =
  0;


  let lastResponse =
  null;


  uploadText.textContent =
  "Uploading video: 0%";


  while(start < totalSize){

    const end =
    Math.min(
      start + CHUNK_SIZE,
      totalSize
    );


    lastResponse =
    await uploadChunkWithRetry(
      file,
      start,
      end,
      totalSize,
      uploadId,
      uploadUrl,
      4
    );


    start =
    end;

  }


  if(
    !lastResponse ||
    !lastResponse.secure_url
  ){

    throw new Error(
      "Cloudinary did not return a media link for the video."
    );

  }


  uploadProgress.style.width =
  "100%";


  uploadText.textContent =
  "Media uploaded successfully.";


  return {

    mediaType:
    "video",

    mediaUrl:
    lastResponse.secure_url,

    mediaName:
    file.name

  };

}

/* =====================================================
   PUBLISH POST FUNCTION
===================================================== */

async function publishPost(){

  if(!currentUser){

    showMessage(
      "Please wait while your account loads."
    );

    return;

  }


  const name =
  nameInput.value.trim();


  const category =
  categoryInput.value;


  const post =
  postInput.value.trim();


  if(name === ""){

    showMessage(
      "Please enter your name."
    );


    nameInput.focus();

    return;

  }


  if(
    post === "" &&
    !selectedMediaFile
  ){

    showMessage(
      "Please write a message or attach a photo or video."
    );


    postInput.focus();

    return;

  }


  if(post.length > 5000){

    showMessage(
      "Your post is too long. Please use 5,000 characters or fewer."
    );

    return;

  }


/* =====================================================
   GET PROFILE PICTURE
===================================================== */

  const savedPicture =
  getFirstValue(
    currentProfile?.profilePicture,
    currentProfile?.picture,
    currentProfile?.photoURL,
    currentProfile?.photoUrl,
    currentProfile?.profileImage,
    currentProfile?.profilePhoto,
    currentProfile?.imageUrl,
    currentProfile?.avatar,
    currentUser.photoURL,
    ""
  );


  const picture =
  savedPicture &&
  !savedPicture.startsWith(
    "data:image/"
  )
  ? savedPicture
  : "images/profile.png";


  disablePublishButton();


  clearMessage();


  try{


/* =====================================================
   UPLOAD MEDIA TO CLOUDINARY
===================================================== */

    const mediaResult =
    await uploadPostMedia(
      selectedMediaFile
    );


    const imageUrl =
    mediaResult.mediaType === "image"
    ? mediaResult.mediaUrl
    : "";


    const videoUrl =
    mediaResult.mediaType === "video"
    ? mediaResult.mediaUrl
    : "";


/* =====================================================
   SAVE POST TO FIRESTORE
===================================================== */

    await addDoc(
      collection(
        db,
        "communityPosts"
      ),
      {

        userId:
        currentUser.uid,

        authorId:
        currentUser.uid,

        uid:
        currentUser.uid,

        name:
        name,

        fullName:
        name,

        category:
        category,

        post:
        post,

        message:
        post,

        timestamp:
        serverTimestamp(),

        likes:
        [],

        commentCount:
        0,

        picture:
        picture,

        profilePicture:
        picture,

        mediaType:
        mediaResult.mediaType,

        mediaUrl:
        mediaResult.mediaUrl,

        mediaName:
        mediaResult.mediaName,

        imageUrl:
        imageUrl,

        videoUrl:
        videoUrl

      }
    );


/* =====================================================
   UPDATE LOCAL POST TOTAL
===================================================== */

    let totalPosts =
    parseInt(
      localStorage.getItem(
        "posts"
      )
    ) || 0;


    localStorage.setItem(
      "posts",
      totalPosts + 1
    );


/* =====================================================
   SHOW SUCCESS MESSAGE
===================================================== */

    showMessage(
      "✅ Your post has been published successfully!",
      "success"
    );


/* =====================================================
   RESET FORM
===================================================== */

    postInput.value =
    "";


    clearSelectedMedia();


    resetUploadDisplay();


    publishBtn.textContent =
    "✅ Published";


/* =====================================================
   RETURN TO COMMUNITY WALL
===================================================== */

    window.setTimeout(
      function(){

        window.location.replace(
          "feed.html"
        );

      },
      900
    );

  }catch(error){

    console.error(
      "Post publishing error:",
      error
    );


    resetUploadDisplay();


    showMessage(
      error.message ||
      "The post could not be published."
    );


    enablePublishButton();

  }

}


/* =====================================================
   PUBLISH BUTTON
===================================================== */

publishBtn.addEventListener(
  "click",
  publishPost
);


/* =====================================================
   CTRL + ENTER TO PUBLISH
===================================================== */

postInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.ctrlKey &&
      event.key === "Enter"
    ){

      event.preventDefault();


      publishPost();

    }

  }
);


/* =====================================================
   PREVENT DOUBLE SUBMISSION
===================================================== */

window.addEventListener(
  "pageshow",
  function(){

    if(!activeUploadRequest){

      enablePublishButton();

    }

  }
);


/* =====================================================
   CLEAN PREVIEW WHEN LEAVING PAGE
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    if(mediaPreviewUrl){

      URL.revokeObjectURL(
        mediaPreviewUrl
      );

    }


    if(activeUploadRequest){

      activeUploadRequest.abort();

    }

  }
);


/* =====================================================
   END OF MODULE
===================================================== */

</script>
