<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Create and publish a post on the SABASABA Gospel Ministry Community Wall">

<title>Create Post | SABASABA Gospel Ministry</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

<style>

/* =====================================================
   EDGE-TO-EDGE CLEAN DESIGN
===================================================== */

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f0f2f5;
  color:#050505;
  min-height:100vh;
}

button,input,select,textarea{font-family:inherit}

button{-webkit-tap-highlight-color:transparent;cursor:pointer}


/* ---------- CONTAINER ---------- */

.container{
  width:100%;
  max-width:680px;
  margin:0 auto;
  padding:0 0 90px 0;
  background:#f0f2f5;
}


/* ---------- HEADER ---------- */

.header{
  background:#ffffff;
  color:#050505;
  padding:16px 14px;
  border-bottom:1px solid #e4e6eb;
  text-align:left;
}

h1{margin:0 0 2px;text-align:left;color:#050505;font-size:20px}

.page-description{
  margin:0;
  color:#65676b;
  font-size:13px;
  line-height:1.4;
  text-align:left;
}


/* ---------- FORM ---------- */

.form-body{
  background:#ffffff;
  padding:14px;
  border-bottom:1px solid #e4e6eb;
}

label{
  display:block;
  margin-top:12px;
  color:#050505;
  font-weight:bold;
  font-size:13px;
}

label:first-of-type{margin-top:0}

input,select,textarea{
  width:100%;
  margin-top:6px;
  padding:10px 12px;
  border:1px solid #ccd0d5;
  border-radius:6px;
  background:#ffffff;
  color:#050505;
  font-size:14px;
  outline:none;
}

input:focus,select:focus,textarea:focus{border-color:#1877f2}

textarea{min-height:140px;resize:vertical;line-height:1.4}


/* ---------- EMOJI ---------- */

.emojiToolbarRow{margin-top:8px;position:relative;display:flex;align-items:center}

.emojiToggleButton{
  width:34px;height:34px;border:none;border-radius:50%;
  background:transparent;color:#1877f2;font-size:18px;
  display:flex;align-items:center;justify-content:center;
}

.emojiToggleButton:hover{background:#e7f3ff}

.emojiPicker{
  position:absolute;left:0;top:40px;z-index:40;
  width:260px;max-width:calc(100vw - 20px);max-height:200px;
  overflow-y:auto;display:none;padding:8px;
  border:1px solid #e4e6eb;border-radius:12px;
  grid-template-columns:repeat(6,1fr);gap:6px;
  background:#ffffff;box-shadow:0 4px 16px rgba(0,0,0,.15);
}

.emojiPicker.show{display:grid}

.emojiPicker button{
  min-height:34px;border:0;border-radius:6px;
  background:transparent;font-size:20px;
}

.emojiPicker button:hover{background:#f0f2f5}


/* ---------- MEDIA OPTIONS ---------- */

.media-options{
  padding:12px 14px;
  background:#ffffff;
  border-bottom:1px solid #e4e6eb;
}

.media-options-title{margin:0;color:#050505;font-weight:bold;font-size:14px}

.media-picker-buttons{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;
}

.media-picker-button{
  width:100%;padding:9px 10px;
  border:1px solid #ccd0d5;border-radius:6px;
  background:#f0f2f5;color:#050505;
  font-size:13px;font-weight:bold;cursor:pointer;
  transition:background .2s;
}

.media-picker-button:hover{background:#e4e6eb}
.media-picker-button:disabled{opacity:.6;cursor:not-allowed}

.media-help{margin:8px 0 0;color:#65676b;font-size:11px;line-height:1.3}


/* ---------- MEDIA PREVIEW ---------- */

#mediaPreview{
  display:none;
  padding:12px 14px;
  background:#ffffff;
  border-bottom:1px solid #e4e6eb;
  text-align:center;
}

#mediaPreview video{
  display:block;width:100%;max-height:360px;
  object-fit:contain;border-radius:8px;background:#000000;
}

.preview-name{margin:8px 0 0;color:#65676b;font-size:12px;word-break:break-word}


/* ---------- PHOTO GRID ---------- */

#imagePreviewGrid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:left;
}

.imagePreviewTile{
  position:relative;aspect-ratio:1/1;overflow:hidden;
  border-radius:6px;background:#000000;
}

.imagePreviewTile img{display:block;width:100%;height:100%;object-fit:cover}

.imagePreviewRemoveButton,
.imagePreviewEditButton{
  position:absolute;top:4px;width:24px;height:24px;
  border:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.7);color:#ffffff;line-height:1;cursor:pointer;
}

.imagePreviewRemoveButton{right:4px;font-size:12px;font-weight:bold}
.imagePreviewEditButton{left:4px;font-size:11px}

.imagePreviewRemoveButton:hover{background:rgba(176,0,32,.9)}
.imagePreviewEditButton:hover{background:#1877f2}

.addMorePhotosTile{
  aspect-ratio:1/1;border:2px dashed #ccd0d5;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  background:#f0f2f5;color:#1877f2;
  font-size:22px;font-weight:bold;cursor:pointer;
}

.addMorePhotosTile:hover{background:#e4e6eb;border-color:#1877f2}


/* ---------- PHOTO EDITOR ---------- */

.photoEditorModal{
  display:none;position:fixed;inset:0;z-index:2000;
  background:#000000;flex-direction:column;
}

.photoEditorModal.show{display:flex}

.photoEditorHeader{
  flex:0 0 auto;display:flex;align-items:center;
  justify-content:space-between;padding:12px 14px;background:#111111;
}

.photoEditorHeaderButton{
  border:0;background:none;color:#ffffff;
  font-size:15px;font-weight:bold;padding:4px 8px;cursor:pointer;
}

.photoEditorDoneButton{color:#4fb0ff}
.photoEditorCounterText{color:#cccccc;font-size:12px}

.photoEditorImageArea{
  flex:1 1 auto;position:relative;overflow:hidden;
  min-height:0;background:#000000;
}

.photoEditorImageArea img{display:block;max-width:100%}

.photoEditorToolbar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:10px 12px;overflow-x:auto;background:#111111;
}

.photoEditorToolButton{
  flex:0 0 auto;padding:8px 12px;
  border:1px solid rgba(255,255,255,.3);border-radius:18px;
  background:transparent;color:#ffffff;font-size:13px;
  cursor:pointer;white-space:nowrap;
}

.photoEditorAspectButton.active{background:#1877f2;border-color:#1877f2}

.photoEditorSkipButton{margin-left:auto;color:#ffb703;border-color:rgba(255,183,3,.4)}


/* ---------- BUTTONS ---------- */

.action-card{background:#ffffff;padding:12px 14px;border-bottom:1px solid #e4e6eb}

.publish-button{
  width:100%;padding:10px 16px;border:none;border-radius:6px;
  background:#1877f2;color:#ffffff;
  font-size:15px;font-weight:bold;cursor:pointer;transition:background .2s;
}

.publish-button:hover{background:#166fe5}
.publish-button:disabled{background:#e4e6eb;color:#8d949e;cursor:not-allowed}

.remove-media-button{
  margin-top:10px;padding:7px 12px;border:none;border-radius:6px;
  background:#fdecec;color:#b00020;
  font-size:13px;font-weight:bold;cursor:pointer;
}

.remove-media-button:hover{background:#fcd1d1}

.back{margin-top:16px;text-align:center;padding:0 14px}
.back a{display:block;text-decoration:none}

.back-button{
  display:block;width:100%;padding:10px 16px;
  border:1px solid #ccd0d5;border-radius:8px;
  background:#ffffff;color:#050505;
  font-size:14px;font-weight:bold;cursor:pointer;transition:background .2s;
}

.back-button:hover{background:#f0f2f5}


/* ---------- UPLOAD PROGRESS ---------- */

#uploadArea{
  display:none;padding:12px 14px;
  background:#ffffff;border-bottom:1px solid #e4e6eb;
}

.progress-container{
  width:100%;height:10px;overflow:hidden;
  background:#e4e6eb;border-radius:20px;
}

#uploadProgress{width:0%;height:100%;background:#1877f2;transition:width .2s ease}

#uploadText{margin:6px 0 0;color:#65676b;font-size:12px;text-align:center}


/* ---------- MESSAGES ---------- */

#message{
  min-height:20px;padding:10px 14px;
  font-size:13px;font-weight:bold;line-height:1.4;text-align:center;
  background:#ffffff;border-bottom:1px solid #e4e6eb;
}

.success-message{color:#31a24c;background:#eaf7ee !important}
.error-message{color:#b00020;background:#fdecec !important}
.info-message{color:#1877f2;background:#e7f3ff !important}


/* ---------- MOBILE ---------- */

@media(max-width:600px){
  .header{padding:12px}
  h1{font-size:18px}
  textarea{min-height:120px}
}

@media(max-width:480px){
  .media-picker-buttons{grid-template-columns:1fr}
}

</style>

</head>


<body>

    <button type="button" class="photoEditorToolButton photoEditorAspectButton active" data-ratio="free">Free</button>
    <button type="button" class="photoEditorToolButton photoEditorAspectButton" data-ratio="1">1:1</button>
    <button type="button" class="photoEditorToolButton photoEditorAspectButton" data-ratio="0.8">4:5</button>
    <button type="button" class="photoEditorToolButton photoEditorAspectButton" data-ratio="1.7778">16:9</button>

    <button type="button" id="photoEditorSkipButton" class="photoEditorToolButton photoEditorSkipButton">Skip editing</button>
  </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE + IMAGEKIT
===================================================== */

import {
  auth,
  db,
  collection,
  addDoc,
  doc,
  getDoc,
  onAuthStateChanged
} from "./firebase.js";

import {
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const imagekitPublicKey = "public_RMynf3IEhbVAkjTfzqWnp5moKCY=";
const imagekitAuthEndpoint = "https://sabasabawk-github-io.vercel.app/api/imagekit-auth";
const imagekitUploadUrl = "https://upload.imagekit.io/api/v1/files/upload";

const MAXIMUM_PHOTOS_PER_POST = 10;
const MAXIMUM_PHOTO_BYTES = 10 * 1024 * 1024;
const MAXIMUM_VIDEO_BYTES = 100 * 1024 * 1024;
const AUTH_TIMEOUT_MS = 15000;


/* =====================================================
   STATE
===================================================== */

let currentUser = null;
let currentProfile = {};

let selectedImageFiles = [];
let selectedImagePreviewUrls = [];
let selectedVideoFile = null;
let selectedVideoPreviewUrl = "";
let selectedMediaType = "none";
let activeUploadRequest = null;
let isPublishing = false;

let photoEditorCropper = null;
let photoEditorMode = "queue";
let photoEditorSingleIndex = -1;
let photoEditQueueFiles = [];
let photoEditQueueEditedFiles = [];
let photoEditQueuePosition = 0;
let photoEditorActiveObjectUrl = "";


/* =====================================================
   ELEMENTS
===================================================== */

const $ = (id) => document.getElementById(id);

const nameInput = $("name");
const categoryInput = $("category");
const postInput = $("post");
const emojiToggleButton = $("emojiToggleButton");
const emojiPicker = $("emojiPicker");
const mediaFileInput = $("mediaFile");
const choosePhotoBtn = $("choosePhotoBtn");
const chooseVideoBtn = $("chooseVideoBtn");
const mediaPreview = $("mediaPreview");
const imagePreviewGrid = $("imagePreviewGrid");
const previewContent = $("previewContent");
const previewFileName = $("previewFileName");
const removeMediaBtn = $("removeMediaBtn");
const uploadArea = $("uploadArea");
const uploadProgress = $("uploadProgress");
const uploadText = $("uploadText");
const publishBtn = $("publishBtn");
const messageElement = $("message");

const photoEditorModal = $("photoEditorModal");
const photoEditorImage = $("photoEditorImage");
const photoEditorCounter = $("photoEditorCounter");
const photoEditorCancelButton = $("photoEditorCancelButton");
const photoEditorDoneButton = $("photoEditorDoneButton");
const photoEditorSkipButton = $("photoEditorSkipButton");
const photoEditorRotateLeftButton = $("photoEditorRotateLeftButton");
const photoEditorRotateRightButton = $("photoEditorRotateRightButton");
const photoEditorAspectButtons = document.querySelectorAll(".photoEditorAspectButton");


/* =====================================================
   HELPERS
===================================================== */

function getFirstValue(...values) {
  for (const value of values) {
    if (value !== undefined && value !== null && String(value).trim() !== "") {
      return String(value).trim();
    }
  }
  return "";
}

function showMessage(message, type = "error") {
  messageElement.textContent = message;
  messageElement.className =
    type === "success" ? "success-message" :
    type === "info" ? "info-message" :
    "error-message";
}

function clearMessage() {
  messageElement.textContent = "";
  messageElement.className = "";
}

function resetUploadDisplay() {
  uploadArea.style.display = "none";
  uploadProgress.style.width = "0%";
  uploadText.textContent = "Preparing upload...";
}

function setPublishing(active) {
  isPublishing = active;
  publishBtn.disabled = active;
  publishBtn.textContent = active ? "Publishing..." : "📢 Publish Post";
  choosePhotoBtn.disabled = active;
  chooseVideoBtn.disabled = active;
}

/* Checks that this device can actually play the chosen video */
function canBrowserPlayVideo(file) {
  return new Promise((resolve) => {
    const v = document.createElement("video");
    const url = URL.createObjectURL(file);
    let finished = false;

    const done = (ok) => {
      if (finished) return;
      finished = true;
      URL.revokeObjectURL(url);
      resolve(ok);
    };

    v.preload = "metadata";
    v.muted = true;
    v.onloadedmetadata = () => done(v.videoWidth > 0);
    v.onerror = () => done(false);
    setTimeout(() => done(false), 8000);
    v.src = url;
  });
}


/* =====================================================
   EMOJI PICKER
===================================================== */

emojiToggleButton.addEventListener("click", (event) => {
  event.stopPropagation();
  emojiPicker.classList.toggle("show");
});

emojiPicker.querySelectorAll("button").forEach((emojiOption) => {
  emojiOption.addEventListener("click", () => {
    const emoji = emojiOption.textContent;
    const start = postInput.selectionStart ?? postInput.value.length;
    const end = postInput.selectionEnd ?? postInput.value.length;

    postInput.value = postInput.value.slice(0, start) + emoji + postInput.value.slice(end);

    const newPosition = start + emoji.length;
    postInput.focus();
    postInput.setSelectionRange(newPosition, newPosition);
    emojiPicker.classList.remove("show");
  });
});

document.addEventListener("click", (event) => {
  if (!emojiPicker.contains(event.target) && event.target !== emojiToggleButton) {
    emojiPicker.classList.remove("show");
  }
});


/* =====================================================
   PROFILE + AUTH
===================================================== */

async function loadCurrentProfile() {
  currentProfile = {};
  if (!currentUser) return;

  try {
    const snapshot = await getDoc(doc(db, "users", currentUser.uid));

    if (snapshot.exists()) {
      currentProfile = snapshot.data();

      const savedName = getFirstValue(
        currentProfile.name, currentProfile.fullName,
        currentProfile.displayName, currentUser.displayName
      );

      if (savedName) nameInput.value = savedName;
    }
  } catch (error) {
    console.error(error);
  }
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.replace("login.html");
    return;
  }

  currentUser = user;
  await loadCurrentProfile();
});


/* =====================================================
   MEDIA PICKER
===================================================== */

function openMediaPicker(mediaType) {
  clearMessage();
  mediaFileInput.value = "";

  if (mediaType === "image") {
    mediaFileInput.accept = "image/*";
    mediaFileInput.multiple = true;
  } else if (mediaType === "video") {
    mediaFileInput.accept = "video/*";
    mediaFileInput.multiple = false;
  } else {
    mediaFileInput.accept = "image/*,video/*";
    mediaFileInput.multiple = false;
  }

  mediaFileInput.click();
}

choosePhotoBtn.addEventListener("click", () => openMediaPicker("image"));
chooseVideoBtn.addEventListener("click", () => openMediaPicker("video"));


/* =====================================================
   PHOTO EDITOR
===================================================== */

function destroyPhotoEditorCropper() {
  if (photoEditorCropper) {
    photoEditorCropper.destroy();
    photoEditorCropper = null;
  }

  if (photoEditorActiveObjectUrl) {
    URL.revokeObjectURL(photoEditorActiveObjectUrl);
    photoEditorActiveObjectUrl = "";
  }
}

function openPhotoEditorModal(imageUrl, counterText, showSkipButton) {
  photoEditorCounter.textContent = counterText;
  photoEditorSkipButton.style.display = showSkipButton ? "inline-block" : "none";

  photoEditorAspectButtons.forEach((b) =>
    b.classList.toggle("active", b.dataset.ratio === "free")
  );

  photoEditorModal.classList.add("show");
  photoEditorModal.setAttribute("aria-hidden", "false");

  destroyPhotoEditorCropper();

  photoEditorActiveObjectUrl = imageUrl;
  photoEditorImage.src = imageUrl;

  photoEditorImage.onload = () => {
    photoEditorCropper = new Cropper(photoEditorImage, {
      viewMode: 1,
      dragMode: "move",
      autoCropArea: 1,
      background: false,
      responsive: true,
      aspectRatio: NaN
    });
  };
}

function closePhotoEditorModal() {
  photoEditorModal.classList.remove("show");
  photoEditorModal.setAttribute("aria-hidden", "true");
  destroyPhotoEditorCropper();
}

function getCroppedImageFile(originalFile) {
  return new Promise((resolve) => {
    if (!photoEditorCropper) {
      resolve(originalFile);
      return;
    }

    const canvas = photoEditorCropper.getCroppedCanvas({
      maxWidth: 2048,
      maxHeight: 2048,
      imageSmoothingQuality: "high"
    });

    if (!canvas) {
      resolve(originalFile);
      return;
    }

    canvas.toBlob((blob) => {
      if (!blob) {
        resolve(originalFile);
        return;
      }

      resolve(new File([blob], originalFile.name, { type: "image/jpeg" }));
    }, "image/jpeg", 0.9);
  });
}

function startPhotoEditQueue(files) {
  photoEditorMode = "queue";
  photoEditQueueFiles = files;
  photoEditQueueEditedFiles = [];
  photoEditQueuePosition = 0;
  showNextQueuedPhotoInEditor();
}

function showNextQueuedPhotoInEditor() {
  if (photoEditQueuePosition >= photoEditQueueFiles.length) {
    closePhotoEditorModal();
    finishPhotoEditQueue();
    return;
  }

  const file = photoEditQueueFiles[photoEditQueuePosition];

  openPhotoEditorModal(
    URL.createObjectURL(file),
    `Edit photo ${photoEditQueuePosition + 1} of ${photoEditQueueFiles.length}`,
    true
  );
}

function finishPhotoEditQueue() {
  selectedImageFiles = photoEditQueueEditedFiles;
  selectedImagePreviewUrls = selectedImageFiles.map((file) => URL.createObjectURL(file));
  selectedMediaType = selectedImageFiles.length > 0 ? "image" : "none";

  if (selectedImageFiles.length === 0) {
    clearSelectedMedia();
    return;
  }

  showMediaPreview();
}

function openPhotoEditorForIndex(index) {
  photoEditorMode = "single";
  photoEditorSingleIndex = index;

  const file = selectedImageFiles[index];
  if (!file) return;

  openPhotoEditorModal(
    URL.createObjectURL(file),
    `Edit photo ${index + 1} of ${selectedImageFiles.length}`,
    false
  );
}

photoEditorRotateLeftButton.addEventListener("click", () => photoEditorCropper?.rotate(-90));
photoEditorRotateRightButton.addEventListener("click", () => photoEditorCropper?.rotate(90));

photoEditorAspectButtons.forEach((button) => {
  button.addEventListener("click", () => {
    photoEditorAspectButtons.forEach((b) => b.classList.remove("active"));
    button.classList.add("active");

    if (photoEditorCropper) {
      const ratio = button.dataset.ratio;
      photoEditorCropper.setAspectRatio(ratio === "free" ? NaN : parseFloat(ratio));
    }
  });
});

photoEditorCancelButton.addEventListener("click", () => {
  if (photoEditorMode === "queue") {
    if (!window.confirm("Discard selected photos?")) return;

    closePhotoEditorModal();
    photoEditQueueFiles = [];
    photoEditQueueEditedFiles = [];
    return;
  }

  closePhotoEditorModal();
});

photoEditorSkipButton.addEventListener("click", () => {
  if (photoEditorMode !== "queue") return;

  photoEditQueueEditedFiles.push(photoEditQueueFiles[photoEditQueuePosition]);
  photoEditQueuePosition++;
  closePhotoEditorModal();
  showNextQueuedPhotoInEditor();
});

photoEditorDoneButton.addEventListener("click", async () => {
  if (photoEditorMode === "queue") {
    const edited = await getCroppedImageFile(photoEditQueueFiles[photoEditQueuePosition]);
    photoEditQueueEditedFiles.push(edited);
    photoEditQueuePosition++;
    closePhotoEditorModal();
    showNextQueuedPhotoInEditor();
    return;
  }

  const original = selectedImageFiles[photoEditorSingleIndex];

  if (!original) {
    closePhotoEditorModal();
    return;
  }

  const edited = await getCroppedImageFile(original);

  URL.revokeObjectURL(selectedImagePreviewUrls[photoEditorSingleIndex]);
  selectedImageFiles[photoEditorSingleIndex] = edited;
  selectedImagePreviewUrls[photoEditorSingleIndex] = URL.createObjectURL(edited);

  closePhotoEditorModal();
  showMediaPreview();
});


/* =====================================================
   FILE SELECTION
===================================================== */

mediaFileInput.addEventListener("change", async (event) => {
  clearMessage();

  const files = Array.from(event.target.files || []);
  if (files.length === 0) return;

  const firstFile = files[0];
  const isImageBatch = firstFile.type.startsWith("image/");
  const isVideo = files.length === 1 && firstFile.type.startsWith("video/");

  if (!isImageBatch && !isVideo) {
    showMessage("Please select valid photos or a video.");
    return;
  }

  /* ----- PHOTOS ----- */
  if (isImageBatch) {
    clearSelectedMedia();

    const validFiles = files.filter(
      (f) => f.type.startsWith("image/") && f.size <= MAXIMUM_PHOTO_BYTES
    );

    const filesToUse = validFiles.slice(0, MAXIMUM_PHOTOS_PER_POST);

    if (filesToUse.length === 0) {
      showMessage("Selected photos exceed 10 MB or are invalid.");
      return;
    }

    startPhotoEditQueue(filesToUse);
    return;
  }

  /* ----- VIDEO ----- */
  clearSelectedMedia();

  if (firstFile.size > MAXIMUM_VIDEO_BYTES) {
    showMessage("Video must be 100 MB or smaller.");
    return;
  }

  showMessage("Checking your video...", "info");

  const playable = await canBrowserPlayVideo(firstFile);

  if (!playable) {
    mediaFileInput.value = "";
    showMessage(
      "This video format can't be played. Record or convert it to MP4 (H.264) and try again."
    );
    return;
  }

  clearMessage();

  selectedVideoFile = firstFile;
  selectedVideoPreviewUrl = URL.createObjectURL(firstFile);
  selectedMediaType = "video";
  showMediaPreview();
});


/* =====================================================
   PREVIEW
===================================================== */

function showMediaPreview() {
  imagePreviewGrid.innerHTML = "";
  previewContent.innerHTML = "";
  previewFileName.textContent = "";

  if (selectedMediaType === "image") {
    selectedImagePreviewUrls.forEach((previewUrl, index) => {
      const tile = document.createElement("div");
      tile.className = "imagePreviewTile";

      tile.innerHTML = `
        <img src="${previewUrl}" alt="Photo ${index + 1}" loading="lazy">
        <button type="button" class="imagePreviewEditButton" aria-label="Edit">✏️</button>
        <button type="button" class="imagePreviewRemoveButton" aria-label="Remove">✕</button>
      `;

      tile.querySelector(".imagePreviewEditButton")
        .addEventListener("click", () => openPhotoEditorForIndex(index));

      tile.querySelector(".imagePreviewRemoveButton")
        .addEventListener("click", () => removeSelectedImageAt(index));

      imagePreviewGrid.appendChild(tile);
    });

    if (selectedImageFiles.length < MAXIMUM_PHOTOS_PER_POST) {
      const addMoreTile = document.createElement("button");
      addMoreTile.type = "button";
      addMoreTile.className = "addMorePhotosTile";
      addMoreTile.textContent = "＋";
      addMoreTile.addEventListener("click", () => openMediaPicker("image"));
      imagePreviewGrid.appendChild(addMoreTile);
    }

    previewFileName.textContent =
      `${selectedImageFiles.length} photo${selectedImageFiles.length === 1 ? "" : "s"} selected`;

    mediaPreview.style.display = "block";
    return;
  }

  if (selectedMediaType === "video") {
    const video = document.createElement("video");
    video.src = selectedVideoPreviewUrl;
    video.controls = true;
    video.playsInline = true;
    previewContent.appendChild(video);

    previewFileName.textContent = selectedVideoFile ? selectedVideoFile.name : "";
    mediaPreview.style.display = "block";
  }
}

function removeSelectedImageAt(indexToRemove) {
  URL.revokeObjectURL(selectedImagePreviewUrls[indexToRemove]);

  selectedImageFiles = selectedImageFiles.filter((_, i) => i !== indexToRemove);
  selectedImagePreviewUrls = selectedImagePreviewUrls.filter((_, i) => i !== indexToRemove);

  if (selectedImageFiles.length === 0) {
    clearSelectedMedia();
    return;
  }

  showMediaPreview();
}

function clearSelectedMedia() {
  selectedImageFiles = [];
  selectedImagePreviewUrls.forEach((url) => URL.revokeObjectURL(url));
  selectedImagePreviewUrls = [];

  if (selectedVideoPreviewUrl) URL.revokeObjectURL(selectedVideoPreviewUrl);

  selectedVideoFile = null;
  selectedVideoPreviewUrl = "";
  selectedMediaType = "none";
  mediaFileInput.value = "";

  imagePreviewGrid.innerHTML = "";
  previewContent.innerHTML = "";
  previewFileName.textContent = "";
  mediaPreview.style.display = "none";
}

removeMediaBtn.addEventListener("click", () => {
  if (activeUploadRequest) {
    activeUploadRequest.abort();
    activeUploadRequest = null;
  }

  resetUploadDisplay();
  clearSelectedMedia();
  clearMessage();
});


/* =====================================================
   IMAGEKIT UPLOAD
===================================================== */

async function getImagekitAuthParameters() {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), AUTH_TIMEOUT_MS);

  try {
    const response = await fetch(imagekitAuthEndpoint, { signal: controller.signal });

    if (!response.ok) {
      throw new Error(`Could not authenticate upload (${response.status}).`);
    }

    return await response.json();

  } catch (error) {
    if (error.name === "AbortError") {
      throw new Error("The upload server did not respond. Please try again.");
    }
    throw error;

  } finally {
    clearTimeout(timer);
  }
}

async function uploadSingleFileToImagekit(file, onProgress) {
  const authParameters = await getImagekitAuthParameters();

  return new Promise((resolve, reject) => {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("fileName", file.name);
    formData.append("publicKey", imagekitPublicKey);
    formData.append("signature", authParameters.signature);
    formData.append("expire", authParameters.expire);
    formData.append("token", authParameters.token);
    formData.append("folder", "/sabasaba-community");

    const request = new XMLHttpRequest();
    activeUploadRequest = request;

    request.open("POST", imagekitUploadUrl, true);
    request.timeout = 300000;

    request.upload.addEventListener("progress", (event) => {
      if (event.lengthComputable && typeof onProgress === "function") {
        onProgress(Math.round((event.loaded / event.total) * 100));
      }
    });

    request.addEventListener("load", () => {
      activeUploadRequest = null;

      try {
        const response = JSON.parse(request.responseText);

        if (request.status < 200 || request.status >= 300) {
          throw new Error(response?.message || "Upload failed.");
        }

        if (!response.url) throw new Error("No URL returned.");

        resolve({ url: response.url, name: file.name });

      } catch (error) {
        reject(error);
      }
    });

    request.addEventListener("error", () => {
      activeUploadRequest = null;
      reject(new Error("Network error. Check your connection and try again."));
    });

    request.addEventListener("timeout", () => {
      activeUploadRequest = null;
      reject(new Error("Upload timed out. Check your connection and try again."));
    });

    request.addEventListener("abort", () => {
      activeUploadRequest = null;
      reject(new Error("Upload cancelled."));
    });

    request.send(formData);
  });
}

async function uploadPostMedia() {
  if (!currentUser) throw new Error("Please sign in.");

  if (selectedMediaType === "none") {
    return { mediaType: "none", mediaUrl: "", mediaName: "", imageUrls: [] };
  }

  uploadArea.style.display = "block";
  uploadProgress.style.width = "0%";
  uploadText.textContent = "Preparing upload...";

  if (selectedMediaType === "image") {
    const total = selectedImageFiles.length;
    const uploadedUrls = [];

    for (let i = 0; i < total; i++) {
      const result = await uploadSingleFileToImagekit(selectedImageFiles[i], (progress) => {
        uploadProgress.style.width = `${progress}%`;
        uploadText.textContent = `Uploading photo ${i + 1} of ${total}: ${progress}%`;
      });

      uploadedUrls.push(result.url);
    }

    uploadProgress.style.width = "100%";
    uploadText.textContent = "Photos uploaded successfully.";

    return {
      mediaType: "image",
      mediaUrl: uploadedUrls[0] || "",
      mediaName: `${total} photos`,
      imageUrls: uploadedUrls
    };
  }

  const videoResult = await uploadSingleFileToImagekit(selectedVideoFile, (progress) => {
    uploadProgress.style.width = `${progress}%`;
    uploadText.textContent = `Uploading video: ${progress}%`;
  });

  uploadProgress.style.width = "100%";
  uploadText.textContent = "Video uploaded successfully.";

  return {
    mediaType: "video",
    mediaUrl: videoResult.url,
    mediaName: videoResult.name,
    imageUrls: []
  };
}


/* =====================================================
   PUBLISH
===================================================== */

async function publishPost() {
  if (isPublishing) return;

  if (!currentUser) {
    showMessage("Please wait for account loading.");
    return;
  }

  const name = nameInput.value.trim();
  const category = categoryInput.value;
  const post = postInput.value.trim();

  if (name === "") {
    showMessage("Please enter your name.");
    nameInput.focus();
    return;
  }

  const hasMedia =
    (selectedMediaType === "image" && selectedImageFiles.length > 0) ||
    (selectedMediaType === "video" && selectedVideoFile);

  if (post === "" && !hasMedia) {
    showMessage("Please write a message or attach media.");
    postInput.focus();
    return;
  }

  const savedPicture = getFirstValue(
    currentProfile?.profilePicture, currentProfile?.picture,
    currentProfile?.photoURL, currentUser.photoURL, ""
  );

  const picture =
    savedPicture && !savedPicture.startsWith("data:image/")
      ? savedPicture
      : "images/profile.png";

  setPublishing(true);
  clearMessage();

  try {
    const mediaResult = await uploadPostMedia();
    const imageUrls = mediaResult.mediaType === "image" ? mediaResult.imageUrls : [];

    await addDoc(collection(db, "communityPosts"), {
      userId: currentUser.uid,
      authorId: currentUser.uid,
      uid: currentUser.uid,
      name: name,
      fullName: name,
      category: category,
      post: post,
      message: post,
      timestamp: serverTimestamp(),
      likes: [],
      commentCount: 0,
      picture: picture,
      profilePicture: picture,
      mediaType: mediaResult.mediaType,
      mediaUrl: mediaResult.mediaUrl,
      mediaName: mediaResult.mediaName,
      imageUrl: imageUrls[0] || "",
      imageUrls: imageUrls,
      videoUrl: mediaResult.mediaType === "video" ? mediaResult.mediaUrl : ""
    });

    const totalPosts = parseInt(localStorage.getItem("posts")) || 0;
    localStorage.setItem("posts", totalPosts + 1);

    showMessage("✅ Your post has been published successfully!", "success");
    postInput.value = "";
    clearSelectedMedia();
    resetUploadDisplay();
    publishBtn.textContent = "✅ Published";

    window.setTimeout(() => {
      window.location.replace("feed.html");
    }, 900);

  } catch (error) {
    console.error(error);
    resetUploadDisplay();
    showMessage(error.message || "Failed to publish post.");
    setPublishing(false);
  }
}

publishBtn.addEventListener("click", publishPost);

postInput.addEventListener("keydown", (event) => {
  if (event.ctrlKey && event.key === "Enter") {
    event.preventDefault();
    publishPost();
  }
});

</script>
