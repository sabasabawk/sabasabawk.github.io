<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Post</title>

<style>

body{
font-family:Arial,sans-serif;
background:#eef3f8;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#0066cc;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:12px;
margin-top:6px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

textarea{
height:180px;
resize:vertical;
}

button{
margin-top:20px;
background:#0066cc;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
font-size:18px;
}

button:hover{
background:#004d99;
}

#message{
margin-top:20px;
font-size:18px;
font-weight:bold;
color:green;
text-align:center;
}

.back{
text-align:center;
margin-top:30px;
}

.back a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>✍️ Create a Post</h1>

<label>Your Name</label>

<input type="text" id="name" placeholder="Enter your name">

<label>Category</label>

<select id="category">

<option>Encouragement</option>

<option>Bible Verse</option>

<option>Prayer Request</option>

<option>Testimony</option>

<option>Announcement</option>

<option>Question</option>

</select>

<label>Your Post</label>

<textarea id="post" placeholder="Write your message here..."></textarea>

<label>Add Photo (Coming Soon)</label>

<input type="file" disabled>

<button id="publishBtn">📢 Publish Post</button>

<p id="message"></p>

<div class="back">

<a href="feed.html">

<button type="button">
  ⬅ Back to Community
</button>

</a>

</div>

</div>

<script type="module">

import {
  auth,
  db,
  collection,
  addDoc,
  doc,
  getDoc,
  onAuthStateChanged
} from "./firebase.js";

import {
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


let currentUser = null;
let currentProfile = null;


/* ========================================
   CHECK LOGGED-IN USER
======================================== */

onAuthStateChanged(auth, async(user)=>{

  if(!user){

    location.href = "login.html";
    return;

  }

  currentUser = user;

  await loadCurrentProfile();

});


/* ========================================
   LOAD USER PROFILE
======================================== */

async function loadCurrentProfile(){

  try{

    /*
      Change "users" below only if your
      member profiles use another collection name.
    */

    const profileReference =
    doc(db,"users",currentUser.uid);

    const profileSnapshot =
    await getDoc(profileReference);


    if(profileSnapshot.exists()){

      currentProfile =
      profileSnapshot.data();

      const savedName =
      getFirstValue(
        currentProfile.name,
        currentProfile.fullName,
        currentProfile.displayName,
        currentUser.displayName
      );

      if(savedName){

        document.getElementById("name").value =
        savedName;

      }

    }else{

      currentProfile = {};

    }

  }catch(error){

    console.error(
      "Profile loading error:",
      error
    );

    currentProfile = {};

  }

}


/* ========================================
   PUBLISH POST
======================================== */

async function publishPost(){

  if(!currentUser){

    alert(
      "Please wait while your account loads."
    );

    return;

  }


  const name =
  document
  .getElementById("name")
  .value
  .trim();


  const category =
  document
  .getElementById("category")
  .value;


  const post =
  document
  .getElementById("post")
  .value
  .trim();


  if(name === "" || post === ""){

    alert(
      "Please enter your name and write a post."
    );

    return;

  }


  if(post.length > 5000){

    alert(
      "Your post is too long. Please use 5,000 characters or fewer."
    );

    return;

  }


  const savedPicture =
  getFirstValue(

    currentProfile?.profilePicture,
    currentProfile?.picture,
    currentProfile?.photoURL,
    currentProfile?.profileImage,
    currentProfile?.profilePhoto,
    currentUser.photoURL,
    ""

  );


  /*
    Never copy a Base64 image into Firestore.
  */

  const picture =

  savedPicture &&
  !savedPicture.startsWith("data:image/")

  ? savedPicture

  : "images/profile.png";


  try{

    await addDoc(

      collection(
        db,
        "communityPosts"
      ),

      {

        userId:
        currentUser.uid,

        name:
        name,

        category:
        category,

        post:
        post,

        timestamp:
        serverTimestamp(),

        likes:
        0,

        picture:
        picture

      }

    );


    let totalPosts =
    parseInt(
      localStorage.getItem("posts")
    ) || 0;


    localStorage.setItem(
      "posts",
      totalPosts + 1
    );


    document
    .getElementById("message")
    .innerHTML =

    "✅ Your post has been published successfully!";


    document
    .getElementById("post")
    .value = "";


    setTimeout(()=>{

      location.href =
      "feed.html";

    },1200);

  }catch(error){

    console.error(
      "Post publishing error:",
      error
    );


    alert(
      error.message ||
      "The post could not be published."
    );

  }

}


/* ========================================
   GET FIRST AVAILABLE VALUE
======================================== */

function getFirstValue(...values){

  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value).trim();

    }

  }

  return "";

}


/* ========================================
   PUBLISH BUTTON
======================================== */

document
.getElementById("publishBtn")
.addEventListener(
  "click",
  publishPost
);

</script>
</body>
</html>
