<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="description"
  content="Create and publish a post on the Sabasaba Gospel Ministry Community Wall"
>

<title>
  Create Post | Sabasaba Gospel Ministry
</title>


<style>

/* =====================================================
   GENERAL PAGE
===================================================== */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef3f8;
  color:#222;
}

button,
input,
select,
textarea{
  font-family:inherit;
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:25px;
  background:#ffffff;
  border-radius:16px;
  box-shadow:0 4px 14px rgba(0,0,0,.1);
}


/* =====================================================
   PAGE TITLE
===================================================== */

h1{
  margin:0 0 8px;
  text-align:center;
  color:#0066cc;
  font-size:28px;
}

.page-description{
  margin:0 0 25px;
  text-align:center;
  color:#666;
  font-size:14px;
  line-height:1.5;
}


/* =====================================================
   FORM ELEMENTS
===================================================== */

label{
  display:block;
  margin-top:16px;
  color:#333;
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  margin-top:7px;
  padding:12px;
  border:1px solid #c8d1dc;
  border-radius:9px;
  background:#ffffff;
  font-size:16px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#0066cc;
  box-shadow:0 0 0 3px rgba(0,102,204,.12);
}

textarea{
  height:180px;
  resize:vertical;
  line-height:1.5;
}


/* =====================================================
   MEDIA SELECTION
===================================================== */

.media-options{
  margin-top:18px;
  padding:16px;
  background:#f7f9fc;
  border:1px solid #dce4ec;
  border-radius:11px;
}

.media-options label{
  margin-top:0;
}

.media-help{
  margin:8px 0 0;
  color:#666;
  font-size:13px;
  line-height:1.5;
}


/* =====================================================
   MEDIA PREVIEW
===================================================== */

#mediaPreview{
  display:none;
  margin-top:16px;
  padding:12px;
  background:#f7f9fc;
  border:1px solid #dce4ec;
  border-radius:11px;
  text-align:center;
}

#mediaPreview img,
#mediaPreview video{
  display:block;
  width:100%;
  max-height:430px;
  object-fit:contain;
  border-radius:9px;
  background:#000000;
}

.preview-name{
  margin:10px 0 0;
  color:#555;
  font-size:13px;
  word-break:break-word;
}


/* =====================================================
   BUTTONS
===================================================== */

.publish-button{
  width:100%;
  margin-top:20px;
  padding:13px 20px;
  border:none;
  border-radius:9px;
  background:#0066cc;
  color:#ffffff;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.publish-button:hover{
  background:#004f9e;
}

.publish-button:disabled{
  background:#8da9c4;
  cursor:not-allowed;
}

.remove-media-button{
  margin-top:12px;
  padding:9px 16px;
  border:none;
  border-radius:8px;
  background:#d93025;
  color:#ffffff;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.remove-media-button:hover{
  background:#aa2118;
}

.back-button{
  display:block;
  width:100%;
  margin-top:12px;
  padding:12px 20px;
  border:none;
  border-radius:9px;
  background:#e7edf4;
  color:#1f2933;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.back-button:hover{
  background:#d8e2ec;
}


/* =====================================================
   UPLOAD PROGRESS
===================================================== */

#uploadArea{
  display:none;
  margin-top:17px;
  padding:14px;
  background:#f7f9fc;
  border:1px solid #dce4ec;
  border-radius:10px;
}

.progress-container{
  width:100%;
  height:13px;
  overflow:hidden;
  background:#dce4ec;
  border-radius:20px;
}

#uploadProgress{
  width:0%;
  height:100%;
  background:#0066cc;
  transition:width .2s ease;
}

#uploadText{
  margin:9px 0 0;
  color:#555;
  font-size:14px;
  text-align:center;
}


/* =====================================================
   SUCCESS AND ERROR MESSAGES
===================================================== */

#message{
  min-height:24px;
  margin-top:18px;
  font-size:16px;
  font-weight:bold;
  line-height:1.5;
  text-align:center;
}

.success-message{
  color:#138a36;
}

.error-message{
  color:#d93025;
}


/* =====================================================
   BACK SECTION
===================================================== */

.back{
  margin-top:20px;
  text-align:center;
}

.back a{
  text-decoration:none;
}


/* =====================================================
   MOBILE DESIGN
===================================================== */

@media(max-width:600px){

  body{
    padding:12px;
  }

  .container{
    padding:20px 16px;
    border-radius:13px;
  }

  h1{
    font-size:24px;
  }

  textarea{
    height:160px;
  }

}

</style>

</head>
<body>

<div class="container">

<h1>
✍️ Create a Post
</h1>

<p class="page-description">

Share encouragement, Bible verses,
testimonies, prayer requests,
announcements, questions,
photos and videos with the
SABASABA Gospel Ministry community.

</p>


<!-- =====================================================
     YOUR NAME
===================================================== -->

<label for="name">

Your Name

</label>

<input
type="text"
id="name"
placeholder="Enter your name"
autocomplete="name"
>


<!-- =====================================================
     POST CATEGORY
===================================================== -->

<label for="category">

Category

</label>

<select id="category">

<option value="Encouragement">
Encouragement
</option>

<option value="Bible Verse">
Bible Verse
</option>

<option value="Prayer Request">
Prayer Request
</option>

<option value="Testimony">
Testimony
</option>

<option value="Announcement">
Announcement
</option>

<option value="Question">
Question
</option>

</select>


<!-- =====================================================
     POST MESSAGE
===================================================== -->

<label for="post">

Your Post

</label>

<textarea
id="post"
maxlength="5000"
placeholder="Write your message here..."
></textarea>


<!-- =====================================================
     PHOTO OR VIDEO
===================================================== -->

<div class="media-options">

<label for="mediaFile">

Add Photo or Video

</label>

<input
type="file"
id="mediaFile"
accept="image/*,video/*"
>

<p class="media-help">

You may attach one photo
or one video.

Photos:
Maximum 10 MB.

Videos:
Maximum 100 MB.

</p>

</div>


<!-- =====================================================
     MEDIA PREVIEW
===================================================== -->

<div id="mediaPreview">

<div id="previewContent"></div>

<p
id="previewFileName"
class="preview-name"
></p>

<button
type="button"
id="removeMediaBtn"
class="remove-media-button"
>

❌ Remove Media

</button>

</div>


<!-- =====================================================
     UPLOAD PROGRESS
===================================================== -->

<div id="uploadArea">

<div class="progress-container">

<div id="uploadProgress"></div>

</div>

<p id="uploadText">

Preparing upload...

</p>

</div>


<!-- =====================================================
     PUBLISH BUTTON
===================================================== -->

<button
type="button"
id="publishBtn"
class="publish-button"
>

📢 Publish Post

</button>


<!-- =====================================================
     STATUS MESSAGE
===================================================== -->

<p
id="message"
aria-live="polite"
></p>


<!-- =====================================================
     BACK BUTTON
===================================================== -->

<div class="back">

<a href="feed.html">

<button
type="button"
class="back-button"
>

⬅ Back to Community

</button>

</a>

</div>

</div>


<script type="module">
/* =====================================================
   PART 3 OF 6
   FIREBASE IMPORTS AND PAGE SETUP
===================================================== */


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  auth,
  db,
  collection,
  addDoc,
  doc,
  getDoc,
  onAuthStateChanged
} from "./firebase.js";


import {
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =====================================================
   CLOUDINARY SETTINGS
===================================================== */

const cloudName =
"glq2nymz";


const uploadPreset =
"sabasaba_community";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser =
null;


let currentProfile =
{};


let selectedMediaFile =
null;


let selectedMediaType =
"none";


let mediaPreviewUrl =
"";


let activeUploadRequest =
null;


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const nameInput =
document.getElementById(
  "name"
);


const categoryInput =
document.getElementById(
  "category"
);


const postInput =
document.getElementById(
  "post"
);


const mediaFileInput =
document.getElementById(
  "mediaFile"
);


const mediaPreview =
document.getElementById(
  "mediaPreview"
);


const previewContent =
document.getElementById(
  "previewContent"
);


const previewFileName =
document.getElementById(
  "previewFileName"
);


const removeMediaBtn =
document.getElementById(
  "removeMediaBtn"
);


const uploadArea =
document.getElementById(
  "uploadArea"
);


const uploadProgress =
document.getElementById(
  "uploadProgress"
);


const uploadText =
document.getElementById(
  "uploadText"
);


const publishBtn =
document.getElementById(
  "publishBtn"
);


const messageElement =
document.getElementById(
  "message"
);


/* =====================================================
   GET FIRST AVAILABLE VALUE
===================================================== */

function getFirstValue(...values){

  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value).trim();

    }

  }

  return "";

}


/* =====================================================
   DISPLAY STATUS MESSAGE
===================================================== */

function showMessage(
  message,
  type = "error"
){

  messageElement.textContent =
  message;


  messageElement.className =
  type === "success"
  ? "success-message"
  : "error-message";

}


/* =====================================================
   CLEAR STATUS MESSAGE
===================================================== */

function clearMessage(){

  messageElement.textContent =
  "";

  messageElement.className =
  "";

}


/* =====================================================
   LOAD CURRENT USER PROFILE
===================================================== */

async function loadCurrentProfile(){

  currentProfile =
  {};


  if(!currentUser){

    return;

  }


  try{

    const profileReference =
    doc(
      db,
      "users",
      currentUser.uid
    );


    const profileSnapshot =
    await getDoc(
      profileReference
    );


    if(profileSnapshot.exists()){

      currentProfile =
      profileSnapshot.data();


      const savedName =
      getFirstValue(
        currentProfile.name,
        currentProfile.fullName,
        currentProfile.displayName,
        currentUser.displayName
      );


      if(savedName){

        nameInput.value =
        savedName;

      }

    }

  }catch(error){

    console.error(
      "Profile loading error:",
      error
    );

  }

}


/* =====================================================
   AUTHENTICATION STATE
===================================================== */

onAuthStateChanged(
  auth,
  async(user)=>{

    if(!user){

      window.location.replace(
        "login.html"
      );

      return;

    }


    currentUser =
    user;


    await loadCurrentProfile();

  }
);
/* =====================================================
   PART 4 OF 6
   SELECT AND PREVIEW PHOTO OR VIDEO
===================================================== */


/* =====================================================
   MEDIA FILE SELECTION
===================================================== */

mediaFileInput.addEventListener(
  "change",
  function(event){

    clearMessage();


    const file =
    event.target.files[0];


    if(!file){

      clearSelectedMedia();

      return;

    }


    const isImage =
    file.type.startsWith(
      "image/"
    );


    const isVideo =
    file.type.startsWith(
      "video/"
    );


    if(
      !isImage &&
      !isVideo
    ){

      showMessage(
        "Please select a valid photo or video."
      );


      clearSelectedMedia();

      return;

    }


    const maximumImageSize =
    10 * 1024 * 1024;


    const maximumVideoSize =
    100 * 1024 * 1024;


    if(
      isImage &&
      file.size > maximumImageSize
    ){

      showMessage(
        "The selected photo is too large. Photos must be 10 MB or smaller."
      );


      clearSelectedMedia();

      return;

    }


    if(
      isVideo &&
      file.size > maximumVideoSize
    ){

      showMessage(
        "The selected video is too large. Videos must be 100 MB or smaller."
      );


      clearSelectedMedia();

      return;

    }


    selectedMediaFile =
    file;


    selectedMediaType =
    isImage
    ? "image"
    : "video";


    if(mediaPreviewUrl){

      URL.revokeObjectURL(
        mediaPreviewUrl
      );

    }


    mediaPreviewUrl =
    URL.createObjectURL(
      file
    );


    showMediaPreview();

  }
);


/* =====================================================
   SHOW MEDIA PREVIEW
===================================================== */

function showMediaPreview(){

  previewContent.innerHTML =
  "";


  previewFileName.textContent =
  selectedMediaFile
  ? selectedMediaFile.name
  : "";


  if(
    selectedMediaType === "image"
  ){

    const image =
    document.createElement(
      "img"
    );


    image.src =
    mediaPreviewUrl;


    image.alt =
    "Selected photo preview";


    image.loading =
    "lazy";


    previewContent.appendChild(
      image
    );

  }


  if(
    selectedMediaType === "video"
  ){

    const video =
    document.createElement(
      "video"
    );


    video.src =
    mediaPreviewUrl;


    video.controls =
    true;


    video.playsInline =
    true;


    video.preload =
    "metadata";


    previewContent.appendChild(
      video
    );

  }


  mediaPreview.style.display =
  "block";

}


/* =====================================================
   CLEAR SELECTED MEDIA
===================================================== */

function clearSelectedMedia(){

  selectedMediaFile =
  null;


  selectedMediaType =
  "none";


  mediaFileInput.value =
  "";


  previewContent.innerHTML =
  "";


  previewFileName.textContent =
  "";


  mediaPreview.style.display =
  "none";


  if(mediaPreviewUrl){

    URL.revokeObjectURL(
      mediaPreviewUrl
    );


    mediaPreviewUrl =
    "";

  }

}


/* =====================================================
   REMOVE MEDIA BUTTON
===================================================== */

removeMediaBtn.addEventListener(
  "click",
  function(){

    if(activeUploadRequest){

      activeUploadRequest.abort();

      activeUploadRequest =
      null;

    }


    uploadArea.style.display =
    "none";


    uploadProgress.style.width =
    "0%";


    uploadText.textContent =
    "Preparing upload...";


    clearSelectedMedia();


    clearMessage();

  }
);
/* =====================================================
   PART 5 OF 6
   UPLOAD PHOTO OR VIDEO TO CLOUDINARY
===================================================== */


/* =====================================================
   CLOUDINARY UPLOAD FUNCTION
===================================================== */

async function uploadPostMedia(file){

  if(!currentUser){

    throw new Error(
      "You must sign in before uploading media."
    );

  }


  if(!file){

    return {

      mediaType:
      "none",

      mediaUrl:
      "",

      mediaName:
      ""

    };

  }


  const resourceType =
file.type.startsWith("video/")
? "video"
: "image";

const uploadUrl =
`https://api.cloudinary.com/v1_1/${cloudName}/${resourceType}/upload`;


  const formData =
  new FormData();


  formData.append(
    "file",
    file
  );


  formData.append(
    "upload_preset",
    uploadPreset
  );


  uploadArea.style.display =
  "block";


  uploadProgress.style.width =
  "0%";


  uploadText.textContent =
  "Uploading media: 0%";


  return new Promise(
    (resolve,reject)=>{

      const request =
      new XMLHttpRequest();


      activeUploadRequest =
      request;


      request.open(
        "POST",
        uploadUrl,
        true
      );


      request.timeout =
      300000;


/* =====================================================
   UPLOAD PROGRESS
===================================================== */

      request.upload.addEventListener(
        "progress",
        function(event){

          if(!event.lengthComputable){

            return;

          }


          const progress =
          Math.round(
            (
              event.loaded /
              event.total
            ) * 100
          );


          uploadProgress.style.width =
          `${progress}%`;


          uploadText.textContent =
          `Uploading media: ${progress}%`;

        }
      );


/* =====================================================
   UPLOAD SUCCESS
===================================================== */

      request.addEventListener(
        "load",
        function(){

          activeUploadRequest =
          null;


          try{

            const response =
            JSON.parse(
              request.responseText
            );


            if(
              request.status < 200 ||
              request.status >= 300
            ){

              throw new Error(
                response?.error?.message ||
                "Cloudinary rejected the media upload."
              );

            }


            if(!response.secure_url){

              throw new Error(
                "Cloudinary did not return a media link."
              );

            }


            const uploadedMediaType =
            response.resource_type === "video"
            ? "video"
            : "image";


            uploadProgress.style.width =
            "100%";


            uploadText.textContent =
            "Media uploaded successfully.";


            resolve({

              mediaType:
              uploadedMediaType,

              mediaUrl:
              response.secure_url,

              mediaName:
              file.name

            });

          }catch(error){

            console.error(
              "Cloudinary response error:",
              error
            );


            uploadText.textContent =
            "Media upload failed.";


            reject(error);

          }

        }
      );


/* =====================================================
   NETWORK ERROR
===================================================== */

      request.addEventListener(
        "error",
        function(){

          activeUploadRequest =
          null;


          uploadText.textContent =
          "Media upload failed.";


          reject(
            new Error(
              "The media upload failed because of a network error."
            )
          );

        }
      );


/* =====================================================
   UPLOAD TIMEOUT
===================================================== */

      request.addEventListener(
        "timeout",
        function(){

          activeUploadRequest =
          null;


          uploadText.textContent =
          "Media upload timed out.";


          reject(
            new Error(
              "The media upload took too long. Please try again."
            )
          );

        }
      );


/* =====================================================
   UPLOAD CANCELLED
===================================================== */

      request.addEventListener(
        "abort",
        function(){

          activeUploadRequest =
          null;


          uploadText.textContent =
          "Media upload cancelled.";


          reject(
            new Error(
              "The media upload was cancelled."
            )
          );

        }
      );


/* =====================================================
   START CLOUDINARY UPLOAD
===================================================== */

      request.send(
        formData
      );

    }
  );

}
/* =====================================================
   PART 6 OF 6
   PUBLISH POST TO FIRESTORE
===================================================== */


/* =====================================================
   PUBLISH POST FUNCTION
===================================================== */

async function publishPost(){

  if(!currentUser){

    showMessage(
      "Please wait while your account loads."
    );

    return;

  }


  const name =
  nameInput.value.trim();


  const category =
  categoryInput.value;


  const post =
  postInput.value.trim();


  if(name === ""){

    showMessage(
      "Please enter your name."
    );


    nameInput.focus();

    return;

  }


  if(
    post === "" &&
    !selectedMediaFile
  ){

    showMessage(
      "Please write a message or attach a photo or video."
    );


    postInput.focus();

    return;

  }


  if(post.length > 5000){

    showMessage(
      "Your post is too long. Please use 5,000 characters or fewer."
    );

    return;

  }


  const savedPicture =
  getFirstValue(
    currentProfile?.profilePicture,
    currentProfile?.picture,
    currentProfile?.photoURL,
    currentProfile?.profileImage,
    currentProfile?.profilePhoto,
    currentUser.photoURL,
    ""
  );


  const picture =
  savedPicture &&
  !savedPicture.startsWith(
    "data:image/"
  )
  ? savedPicture
  : "images/profile.png";


  publishBtn.disabled =
  true;


  publishBtn.textContent =
  "Publishing...";


  clearMessage();


  try{

    const mediaResult =
    await uploadPostMedia(
      selectedMediaFile
    );


    const imageUrl =
    mediaResult.mediaType === "image"
    ? mediaResult.mediaUrl
    : "";


    const videoUrl =
    mediaResult.mediaType === "video"
    ? mediaResult.mediaUrl
    : "";


    await addDoc(
      collection(
        db,
        "communityPosts"
      ),
      {

        userId:
        currentUser.uid,

        name:
        name,

        category:
        category,

        post:
        post,

        timestamp:
        serverTimestamp(),

        likes:
        0,

        picture:
        picture,

        mediaType:
        mediaResult.mediaType,

        mediaUrl:
        mediaResult.mediaUrl,

        mediaName:
        mediaResult.mediaName,

        imageUrl:
        imageUrl,

        videoUrl:
        videoUrl

      }
    );


    let totalPosts =
    parseInt(
      localStorage.getItem(
        "posts"
      )
    ) || 0;


    localStorage.setItem(
      "posts",
      totalPosts + 1
    );


    showMessage(
      "✅ Your post has been published successfully!",
      "success"
    );


    postInput.value =
    "";


    clearSelectedMedia();


    uploadProgress.style.width =
    "0%";


    uploadText.textContent =
    "Preparing upload...";


    uploadArea.style.display =
    "none";


    publishBtn.textContent =
    "Published";


    setTimeout(
      function(){

        window.location.href =
        "feed.html";

      },
      1200
    );

  }catch(error){

    console.error(
      "Post publishing error:",
      error
    );


    uploadArea.style.display =
    "none";


    showMessage(
      error.message ||
      "The post could not be published."
    );


    publishBtn.disabled =
    false;


    publishBtn.textContent =
    "📢 Publish Post";

  }

}


/* =====================================================
   PUBLISH BUTTON
===================================================== */

publishBtn.addEventListener(
  "click",
  publishPost
);


/* =====================================================
   CTRL + ENTER TO PUBLISH
===================================================== */

postInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.ctrlKey &&
      event.key === "Enter"
    ){

      event.preventDefault();


      publishPost();

    }

  }
);


/* =====================================================
   CLEAN PREVIEW WHEN LEAVING PAGE
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    if(mediaPreviewUrl){

      URL.revokeObjectURL(
        mediaPreviewUrl
      );

    }


    if(activeUploadRequest){

      activeUploadRequest.abort();

    }

  }
);


/* =====================================================
   END OF MODULE
===================================================== */

</script>

</body>

</html>
