<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Post</title>

<style>

body{
font-family:Arial,sans-serif;
background:#eef3f8;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#0066cc;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:12px;
margin-top:6px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

textarea{
height:180px;
resize:vertical;
}

button{
margin-top:20px;
background:#0066cc;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
font-size:18px;
}

button:hover{
background:#004d99;
}

#message{
margin-top:20px;
font-size:18px;
font-weight:bold;
color:green;
text-align:center;
}

.back{
text-align:center;
margin-top:30px;
}

.back a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>✍️ Create a Post</h1>

<label>Your Name</label>

<input type="text" id="name" placeholder="Enter your name">

<label>Category</label>

<select id="category">

<option>Encouragement</option>

<option>Bible Verse</option>

<option>Prayer Request</option>

<option>Testimony</option>

<option>Announcement</option>

<option>Question</option>

</select>

<label>Your Post</label>

<textarea id="post" placeholder="Write your message here..."></textarea>

<label>Add Photo (Coming Soon)</label>

<input type="file" disabled>

<button onclick="publishPost()">📢 Publish Post</button>

<p id="message"></p>

<div class="back">

<a href="community.html">

<button>⬅ Back to Community</button>

</a>

</div>

</div>

<script type="module">

function publishPost(){

let name = document.getElementById("name").value;
let category = document.getElementById("category").value;
let post = document.getElementById("post").value;

if(name.trim()=="" || post.trim()==""){

alert("Please enter your name and write a post.");

return;

}

// Create post object
let newPost = {

name:name,

category:category,

post:post,

date:new Date().toLocaleString(),

likes:0,

comments:[],

picture:localStorage.getItem("profilePicture") || "images/profile.png"

};

// Read existing posts
let posts =
JSON.parse(localStorage.getItem("communityPosts")) || [];

// Add newest post first
posts.unshift(newPost);

// Save
localStorage.setItem("communityPosts",
JSON.stringify(posts));

// Update profile statistics
let totalPosts =
parseInt(localStorage.getItem("posts")) || 0;

localStorage.setItem("posts",totalPosts+1);

document.getElementById("message").innerHTML=
"✅ Your post has been published successfully!";

document.getElementById("name").value="";
document.getElementById("post").value="";

setTimeout(function(){

window.location.href="feed.html";

},1200);

}

</script>

</body>
</html>
