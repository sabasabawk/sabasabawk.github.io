<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Feedback | Faith Connect</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef3f8;color:#111}
.pageHeader{padding:18px 16px;background:linear-gradient(135deg,#087bd1,#005cae);color:#fff;display:flex;align-items:center;gap:12px;box-shadow:0 3px 12px rgba(0,0,0,.18)}
.pageHeader a{color:#fff;text-decoration:none;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
.pageHeader h1{margin:0;font-size:20px}
.pageHeader p{margin:3px 0 0;color:#e7f4ff;font-size:13px}
.container{max-width:700px;margin:auto;padding:18px 16px 80px}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters button{flex:1;padding:10px;border:2px solid #d9e0e8;border-radius:12px;background:#fff;color:#4f5963;font-weight:bold;font-size:13px;cursor:pointer}
.filters button.active{border-color:#087bd1;background:#e7f3ff;color:#0873c9}
.item{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 3px 10px rgba(0,0,0,.07)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:bold}
.cat{background:#e7f3ff;color:#0873c9}
.open{background:#fff3cd;color:#755600}
.reviewed{background:#e6f4ea;color:#1e7a34}
.who{margin-top:10px;font-size:13px;font-weight:bold;color:#26333d}
.who span{display:block;font-weight:normal;color:#6b7580;font-size:12px;word-break:break-all}
.msg{margin-top:9px;font-size:14px;line-height:1.5;white-space:pre-wrap;color:#26333d}
.date{margin-top:8px;color:#8a95a1;font-size:11px}
.actions{margin-top:10px;display:flex;gap:8px}
.actions button,.actions a{padding:9px 14px;border:none;border-radius:10px;font-size:13px;font-weight:bold;cursor:pointer;text-decoration:none}
.markBtn{background:#087bd1;color:#fff}
.undoBtn{background:#e9edf1;color:#4f5963}
.replyBtn{background:#e7f3ff;color:#0873c9}
.note{text-align:center;color:#8a95a1;font-size:14px;padding:30px 10px}
.error{color:#b00020}
</style>
</head>
<body>

<header class="pageHeader">
  <a href="profile.html" aria-label="Back">←</a>
  <div>
    <h1>📋 User Feedback</h1>
    <p id="summary">Admin only</p>
  </div>
</header>

<div class="container">
  <div class="filters" id="filters">
    <button data-filter="open" class="active">Pending</button>
    <button data-filter="reviewed">Reviewed</button>
    <button data-filter="all">All</button>
  </div>
  <div id="list"><div class="note">Loading...</div></div>
</div>

<script type="module">
import {
  auth, db, doc, setDoc, collection, query, orderBy, onSnapshot, onAuthStateChanged
} from "./firebase.js";

/* Only these emails can use this page.
   NOTE: this only hides the page. Real protection is your Firestore rules. */
const ADMIN_EMAILS = ["sabasabawk@gmail.com"];

const list = document.getElementById("list");
const summary = document.getElementById("summary");
const filters = document.getElementById("filters");

let allItems = [];
let currentFilter = "open";
let started = false;

function fmt(ts){
  if(!ts) return "Just now";
  try{
    const d = typeof ts.toDate === "function" ? ts.toDate() : new Date(ts.seconds*1000);
    return d.toLocaleString(undefined,{year:"numeric",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  }catch(e){ return "Recently"; }
}

function render(){
  const open = allItems.filter(i => i.status !== "reviewed").length;
  summary.textContent = `${open} pending · ${allItems.length} total`;

  const shown = allItems.filter(i =>
    currentFilter === "all" ? true :
    currentFilter === "reviewed" ? i.status === "reviewed" :
    i.status !== "reviewed"
  );

  list.innerHTML = "";
  if(!shown.length){
    list.innerHTML = '<div class="note">Nothing here.</div>';
    return;
  }

  shown.forEach(i => {
    const reviewed = i.status === "reviewed";
    const el = document.createElement("div");
    el.className = "item";

    const top = document.createElement("div");
    top.className = "top";
    const cat = document.createElement("span");
    cat.className = "tag cat";
    cat.textContent = i.category || "Feedback";
    const st = document.createElement("span");
    st.className = "tag " + (reviewed ? "reviewed" : "open");
    st.textContent = reviewed ? "✔ Reviewed" : "Pending";
    top.append(cat, st);

    const who = document.createElement("div");
    who.className = "who";
    who.textContent = i.userName || "Unknown";
    const mail = document.createElement("span");
    mail.textContent = i.userEmail || "";
    who.appendChild(mail);

    const msg = document.createElement("div");
    msg.className = "msg";
    msg.textContent = i.message || "";

    const date = document.createElement("div");
    date.className = "date";
    date.textContent = fmt(i.timestamp);

    const actions = document.createElement("div");
    actions.className = "actions";

    const toggle = document.createElement("button");
    toggle.className = reviewed ? "undoBtn" : "markBtn";
    toggle.textContent = reviewed ? "Mark as pending" : "Mark as reviewed";
    toggle.addEventListener("click", async () => {
      toggle.disabled = true;
      try{
        await setDoc(doc(db,"feedback",i.id),{status: reviewed ? "open" : "reviewed"},{merge:true});
      }catch(err){
        console.error(err);
        alert("Could not update. Check your Firestore rules allow admin updates.");
        toggle.disabled = false;
      }
    });
    actions.appendChild(toggle);

    if(i.userEmail){
      const reply = document.createElement("a");
      reply.className = "replyBtn";
      reply.textContent = "Reply by email";
      reply.href = "mailto:" + encodeURIComponent(i.userEmail).replace(/%40/g,"@") +
        "?subject=" + encodeURIComponent("Re: your Faith Connect feedback");
      actions.appendChild(reply);
    }

    el.append(top, who, msg, date, actions);
    list.appendChild(el);
  });
}

filters.addEventListener("click", e => {
  const b = e.target.closest("button");
  if(!b) return;
  currentFilter = b.dataset.filter;
  filters.querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
  render();
});

function start(){
  if(started) return;
  started = true;
  onSnapshot(
    query(collection(db,"feedback"), orderBy("timestamp","desc")),
    snap => {
      allItems = snap.docs.map(d => ({id:d.id, ...d.data()}));
      render();
    },
    err => {
      console.error(err);
      list.innerHTML = '<div class="note error">Could not load feedback. Check your Firestore rules.</div>';
    }
  );
}

onAuthStateChanged(auth, user => {
  if(!user){ window.location.href = "login.html"; return; }
  const ok = ADMIN_EMAILS.includes((user.email || "").toLowerCase());
  if(!ok){
    summary.textContent = "No access";
    filters.style.display = "none";
    list.innerHTML = '<div class="note">This page is for administrators only.</div>';
    return;
  }
  start();
});
</script>
</body>
</html>
