<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications</title>

<style>

body{
font-family:Arial,sans-serif;
background:#eef3f8;
margin:0;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
}

.header{
background:#0066cc;
color:white;
padding:20px;
border-radius:15px;
text-align:center;
margin-bottom:20px;
}

.notification{
background:white;
padding:18px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 3px 8px rgba(0,0,0,.1);
font-size:18px;
}

.back{
text-align:center;
margin-top:25px;
}

button{
background:#0066cc;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
font-size:16px;
text-decoration:none;
display:inline-block;
}

button:hover{
background:#004d99;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>🔔 Notifications</h1>

<p>Your recent activity</p>

</div>

<div id="notificationList"></div>

<div class="back">

<button onclick="window.location.href='community.html'">⬅ Back to Community</button>

</div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
getFirestore,
collection,
query,
orderBy,
onSnapshot
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBy7eWmqoTqnNNGfV2YD9h2rabkCg_-QfU",
  authDomain: "sabasaba-gospel-ministry-414e2.firebaseapp.com",
  projectId: "sabasaba-gospel-ministry-414e2",
  storageBucket: "sabasaba-gospel-ministry-414e2.firebasestorage.app",
  messagingSenderId: "821278457946",
  appId: "1:821278457946:web:3593bd1743970f44c05863"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("notificationList");

const q = query(
collection(db,"notifications"),
orderBy("timestamp","desc")
);

onSnapshot(q,function(snapshot){

list.innerHTML="";

if(snapshot.empty){

list.innerHTML=
"<div class='notification'>No notifications yet.</div>";

return;

}

snapshot.forEach(function(doc){

const note=doc.data();

let time="";

if(note.timestamp){

time=new Date(note.timestamp.toDate()).toLocaleString();

}

list.innerHTML+=`

<div class="notification">

<div style="color:gray;font-size:14px;">
${time}
</div>

<div style="margin-top:8px;">
${note.message}
</div>

</div>

`;

});

});

</script>
</body>
</html>
