<style>

/* =====================================================
   FACEBOOK-STYLE EDGE-TO-EDGE CLEAN DESIGN
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


body{

  font-family:
  Arial,
  Helvetica,
  sans-serif;

  background:#f0f2f5;

  color:#050505;

  min-height:100vh;

}


.container{

  width:100%;

  max-width:680px;

  margin:0 auto;

  padding:0 0 80px 0;

}


/* =====================================================
   PAGE HEADER
===================================================== */

.header{

  background:#ffffff;

  color:#050505;

  padding:16px 14px;

  border-radius:0;

  border-bottom:1px solid #e4e6eb;

  text-align:left;

  margin-bottom:0;

  margin:0 0 2px;

  margin-bottom:0;

  padding:10px 12px;

  border:none;

  border-radius:6px;

  padding:8px 14px;

  font-size:13px;

  font-weight:bold;

  transition:
  background 0.2s ease;

}

}

  opacity:0.5;

  cursor:not-allowed;

  transform:none;

}


.refreshButton{

}


.refreshButton:hover{

}


.markAllButton{

  background:#e4e6eb;

  color:#050505;

}


.markAllButton:hover{

  background:#d8dadf;

}


.deleteButton{

  background:#f0f2f5;

  color:#b00020;

  padding:6px 10px;

  font-size:12px;

}


.deleteButton:hover{

  background:#fdecec;

}


.openButton{

  background:#e7f3ff;

  color:#1877f2;

  padding:6px 10px;

}


.openButton:hover{

  background:#d0e8ff;

}


.backButton{

  background:#ffffff;

  color:#050505;

  border:1px solid #ccd0d5;

  padding:10px 20px;

  font-size:14px;

  border-radius:8px;

}


.backButton:hover{

  background:#f0f2f5;

}


.retryButton{

  background:#b00020;

  color:white;

  padding:8px 14px;

  font-size:13px;

  margin-top:10px;

}


.retryButton:hover{

  background:#8f0019;

}


/* =====================================================
   NOTIFICATION CARDS
===================================================== */

#notificationList{
  background:#ffffff;
}


.notification{

  background:#ffffff;

  padding:12px 14px;

  margin-bottom:0;

  border-radius:0;

  box-shadow:none;

  border-left:none;

  border-bottom:1px solid #e4e6eb;

  transition:background 0.2s ease;

  cursor:pointer;

}


.notification:hover{

  transform:none;

  box-shadow:none;

  background:#f9fafb;

}


.notification.unread{

  background:#f0f2f5;

  border-left-color:transparent;

}


.notification.read{

  background:#ffffff;

  border-left-color:transparent;

}


.notificationHeader{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  margin-bottom:6px;

}


.notificationType{

  font-size:18px;

}


.notificationTime{

  color:#65676b;

  font-size:11px;

  text-align:right;

}


.notificationMessage{

  font-size:14px;

  line-height:1.4;

  overflow-wrap:anywhere;

  color:#050505;

}


.notificationStatus{

  display:inline-block;

  margin-top:6px;

  padding:2px 8px;

  border-radius:20px;

  font-size:11px;

  font-weight:bold;

}


.notificationStatus.unreadStatus{

  background:#1877f2;

  color:white;

}


.notificationStatus.readStatus{

  background:#e4e6eb;

  color:#65676b;

}


/* =====================================================
   NOTIFICATION ACTIONS
===================================================== */

.notificationActions{

  display:flex;

  gap:6px;

  flex-wrap:wrap;

  margin-top:10px;

}


/* =====================================================
   STATUS AND ERROR CARDS
===================================================== */

.statusCard{

  background:#ffffff;

  padding:30px 14px;

  border-radius:0;

  text-align:center;

  font-size:14px;

  box-shadow:none;

  border-bottom:1px solid #e4e6eb;

  color:#65676b;

}


.statusCard.loading{

  color:#65676b;

}


.statusCard.empty{

  color:#65676b;

}


.statusCard.error{

  background:#fdecec;

  color:#b00020;

  border:none;

  border-bottom:1px solid #e4e6eb;

}


/* =====================================================
   BACK SECTION
===================================================== */

.back{

  text-align:center;

  margin-top:20px;

  padding:0 14px;

}


/* =====================================================
   RESPONSIVE DESIGN
===================================================== */

@media(max-width:600px){

  body{

    padding:0;

  }


  .container{

    padding:0;

  }


  .header{

    padding:12px;

  }


  .header h1{

    font-size:18px;

  }


  .topActions{

    flex-direction:row;

    align-items:center;

  }


  .topActions button{

    width:auto;

  }


  .notificationCount{

    text-align:left;

  }


  .notificationActions{

    flex-direction:row;

  }

}

</style>

</head>
<body>

<div class="container">

  <!-- ==================================================
       PAGE HEADER
  =================================================== -->

  <div class="header">

    <h1>
      🔔 Notifications
    </h1>

    <p>
      Stay updated with activity in the community.
    </p>

  </div>


  <!-- ==================================================
       TOP ACTIONS
  =================================================== -->

  <div class="topActions">

    <div
      id="notificationCount"
      class="notificationCount"
    >
      Notifications: 0
    </div>


    <div style="display:flex; gap:6px;">
      <button
        id="refreshButton"
        class="refreshButton"
        type="button"
      >
        🔄 Refresh
      </button>


      <button
        id="markAllButton"
        class="markAllButton"
        type="button"
      >
        ✓ Mark All Read
      </button>
    </div>

  </div>


  <!-- ==================================================
       NOTIFICATION LIST
  =================================================== -->

  <div
    id="notificationList"
  >

    <div
      class="statusCard loading"
    >

      Loading notifications...

    </div>

  </div>


  <!-- ==================================================
       BACK BUTTON
  =================================================== -->

  <div class="back">

    <button
      id="backButton"
      class="backButton"
      type="button"
    >

      ⬅ Back to Community

    </button>

  </div>

</div>


<script type="module">
/* =====================================================
   PART 3 OF 6
   FIREBASE SETUP, AUTHENTICATION AND HELPERS
===================================================== */


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  auth,
  db,
  collection,
  query,
    where,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc,
  writeBatch,
  onAuthStateChanged
} from "./firebase.js";


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const notificationList =
document.getElementById(
  "notificationList"
);


const notificationCount =
document.getElementById(
  "notificationCount"
);


const refreshButton =
document.getElementById(
  "refreshButton"
);


const markAllButton =
document.getElementById(
  "markAllButton"
);


const backButton =
document.getElementById(
  "backButton"
);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let unsubscribeNotifications = null;

let currentNotifications = [];


/*
   If the very first snapshot never arrives
   (e.g. a weak connection), this timer swaps
   the stuck "Loading..." message for a
   friendly retry option instead of hanging
   forever.
*/

let firstLoadTimeoutId = null;

const FIRST_LOAD_TIMEOUT_MS = 9000;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  const temporaryElement =
  document.createElement("div");


  temporaryElement.textContent =
  String(value ?? "");


  return temporaryElement.innerHTML;

}


/* =====================================================
   SHOW LOADING MESSAGE
===================================================== */

function showLoadingMessage(){

  notificationList.innerHTML = `

    <div class="statusCard loading">

      Loading notifications...

    </div>

  `;

}


/* =====================================================
   SHOW EMPTY MESSAGE
===================================================== */

function showEmptyMessage(){

  notificationList.innerHTML = `

    <div class="statusCard empty">

      You have no notifications yet.

    </div>

  `;

}


/* =====================================================
   SHOW ERROR MESSAGE
===================================================== */

function showErrorMessage(message){

  notificationList.innerHTML = `

    <div class="statusCard error">

      ${escapeHTML(message)}

    </div>

  `;

}


/* =====================================================
   SHOW STUCK-CONNECTION MESSAGE WITH RETRY
===================================================== */

function showStuckLoadingMessage(){

  notificationList.innerHTML = "";


  const card =
  document.createElement("div");

  card.className =
  "statusCard error";


  const text =
  document.createElement("div");

  text.textContent =
  "This is taking longer than expected. Your connection may be weak.";


  const retryButton =
  document.createElement("button");

  retryButton.type =
  "button";

  retryButton.className =
  "retryButton";

  retryButton.textContent =
  "🔄 Retry";

  retryButton.addEventListener(
    "click",
    () => {

      showLoadingMessage();

      loadNotifications();

    }
  );


  card.appendChild(text);

  card.appendChild(retryButton);

  notificationList.appendChild(card);

}


/* =====================================================
   FIRST-LOAD TIMEOUT HELPERS
===================================================== */

function clearFirstLoadTimeout(){

  if(firstLoadTimeoutId){

    window.clearTimeout(
      firstLoadTimeoutId
    );

    firstLoadTimeoutId = null;

  }

}


function startFirstLoadTimeout(){

  clearFirstLoadTimeout();


  firstLoadTimeoutId =
  window.setTimeout(
    () => {

      firstLoadTimeoutId = null;


      if(
        currentNotifications.length === 0
      ){

        showStuckLoadingMessage();

      }

    },
    FIRST_LOAD_TIMEOUT_MS
  );

}


/* =====================================================
   UPDATE NOTIFICATION COUNT
===================================================== */

function updateNotificationCount(){

  const totalNotifications =
  currentNotifications.length;


  const unreadNotifications =
  currentNotifications.filter(
    notification =>
    notification.read !== true
  ).length;


  notificationCount.textContent =
  `Notifications: ${totalNotifications} | Unread: ${unreadNotifications}`;


  markAllButton.disabled =
  unreadNotifications === 0;

}


/* =====================================================
   STOP OLD NOTIFICATION LISTENER
===================================================== */

function stopNotificationListener(){

  if(unsubscribeNotifications){

    unsubscribeNotifications();

    unsubscribeNotifications = null;

  }


  clearFirstLoadTimeout();

}


/* =====================================================
   FORMAT NOTIFICATION DATE
===================================================== */

function formatNotificationDate(timestamp){

  if(!timestamp){

    return "Just now";

  }


  try{

    const date =
    timestamp.toDate
    ? timestamp.toDate()
    : new Date(timestamp);


    return date.toLocaleString();

  }catch(error){

    console.error(
      "Notification date error:",
      error
    );


    return "Recently";

  }

}


/* =====================================================
   GET NOTIFICATION ICON
===================================================== */

function getNotificationIcon(type){

  switch(type){

    case "like":

      return "❤️";


    case "comment":

      return "💬";


    case "follow":

      return "👤";


    case "prayer":

      return "🙏";


    default:

      return "🔔";

  }

}


/* =====================================================
   WORK OUT WHERE A NOTIFICATION SHOULD OPEN

   Uses the notification's own targetUrl when
   present (this is what feed.html already
   saves on every notification), falling back
   to a postId-based post link, then to the
   sender's profile, then to the feed as a
   last resort. This is what makes tapping a
   notification take the user to whatever
   actually triggered it, instead of always
   landing on the general Community Wall.
===================================================== */

function getNotificationDestination(
  notificationData
){

  const targetUrl =
  notificationData.targetUrl;


  if(
    targetUrl &&
    String(targetUrl).trim() !== ""
  ){

    return targetUrl;

  }


  const postId =
  notificationData.postId;


  if(postId){

    return (
      "feed.html?post=" +
      encodeURIComponent(postId)
    );

  }


  const senderId =
  notificationData.senderId;


  if(
    notificationData.type === "follow" &&
    senderId
  ){

    return (
      "user-profile.html?uid=" +
      encodeURIComponent(senderId)
    );

  }


  return "feed.html";

}


/* =====================================================
   AUTHENTICATION STATE
===================================================== */

onAuthStateChanged(
  auth,
  user => {

    currentUser =
    user || null;


    stopNotificationListener();


    if(!currentUser){

      currentNotifications = [];

      updateNotificationCount();


      showErrorMessage(
        "Please sign in to view your notifications."
      );


      refreshButton.disabled = true;

      markAllButton.disabled = true;

      return;

    }


    refreshButton.disabled = false;

    showLoadingMessage();

    loadNotifications();

  }
);
/* =====================================================
   PART 4 OF 6
   LOAD AND DISPLAY NOTIFICATIONS
===================================================== */


/* =====================================================
   LOAD CURRENT USER'S NOTIFICATIONS
===================================================== */

function loadNotifications(){

  if(!currentUser){

    showErrorMessage(
      "Please sign in to view your notifications."
    );

    return;

  }


  stopNotificationListener();


  startFirstLoadTimeout();


  const notificationsReference =
  collection(
    db,
    "notifications"
  );


  const notificationsQuery =
query(

  notificationsReference,

  where(
    "recipientId",
    "==",
    currentUser.uid
  )

);


  unsubscribeNotifications =
  onSnapshot(

    notificationsQuery,

    snapshot => {

      clearFirstLoadTimeout();


      currentNotifications = [];


      snapshot.forEach(
  notificationDocument => {

    currentNotifications.push({

      id:
      notificationDocument.id,

      ...notificationDocument.data()

    });

  }
);


/* Sort newest notifications first without Firebase index */

currentNotifications.sort(
  (notificationA, notificationB) => {

    const getTimestampValue =
    timestamp => {

      if(!timestamp){

        return 0;

      }


      if(
        typeof timestamp.toMillis ===
        "function"
      ){

        return timestamp.toMillis();

      }


      if(
        typeof timestamp.toDate ===
        "function"
      ){

        return timestamp
        .toDate()
        .getTime();

      }


      const dateValue =
      new Date(timestamp).getTime();


      return Number.isNaN(dateValue)
      ? 0
      : dateValue;

    };


    return (
      getTimestampValue(
        notificationB.timestamp
      )
      -
      getTimestampValue(
        notificationA.timestamp
      )
    );

  }
);


updateNotificationCount();


      if(currentNotifications.length === 0){

        showEmptyMessage();

        return;

      }


      displayNotifications();

    },

    error => {

      clearFirstLoadTimeout();


      console.error(
        "Notification loading error:",
        error
      );


      currentNotifications = [];

      updateNotificationCount();


      if(
        error.code ===
        "failed-precondition"
      ){

        showErrorMessage(
          "Firebase requires an index for notifications. Open the Firebase error link in the browser console and create the suggested index."
        );

        return;

      }


      if(
        error.code ===
        "permission-denied"
      ){

        showErrorMessage(
          "You do not have permission to view these notifications. Please check your Firestore security rules."
        );

        return;

      }


      showErrorMessage(
        error.message ||
        "Notifications could not be loaded."
      );

    }

  );

}


/* =====================================================
   DISPLAY ALL NOTIFICATIONS
===================================================== */

function displayNotifications(){

  notificationList.innerHTML = "";


  currentNotifications.forEach(
    notificationData => {

      const notificationCard =
      createNotificationCard(
        notificationData
      );


      notificationList.appendChild(
        notificationCard
      );

    }
  );

}


/* =====================================================
   CREATE ONE NOTIFICATION CARD
===================================================== */

function createNotificationCard(
  notificationData
){

  const card =
  document.createElement("div");


  const notificationId =
  notificationData.id || "";


  const notificationType =
  notificationData.type || "general";


  const notificationMessage =
  notificationData.message ||
  "You have a new notification.";


  const notificationTime =
  formatNotificationDate(
    notificationData.timestamp
  );


  const notificationIcon =
  getNotificationIcon(
    notificationType
  );


  const isRead =
  notificationData.read === true;


  card.className =
  isRead
  ? "notification read"
  : "notification unread";


  card.dataset.notificationId =
  notificationId;


  card.innerHTML = `

    <div class="notificationHeader">

      <div class="notificationType">

        ${escapeHTML(notificationIcon)}

      </div>


      <div class="notificationTime">

        ${escapeHTML(notificationTime)}

      </div>

    </div>


    <div class="notificationMessage">

      ${escapeHTML(notificationMessage)}

    </div>


    <span
      class="
        notificationStatus
        ${
          isRead
          ? "readStatus"
          : "unreadStatus"
        }
      "
    >

      ${
        isRead
        ? "Read"
        : "Unread"
      }

    </span>


    <div class="notificationActions">

      <button
        type="button"
        class="openButton"
      >

        Open

      </button>


      <button
        type="button"
        class="deleteButton"
      >

        🗑 Delete

      </button>

    </div>

  `;


  setupNotificationActions(
    notificationData,
    card
  );


  return card;

}
/* =====================================================
   PART 5 OF 6
   NOTIFICATION ACTIONS, REFRESH AND BACK
===================================================== */


/* =====================================================
   SET UP ONE NOTIFICATION CARD
===================================================== */

function setupNotificationActions(
  notificationData,
  card
){

  const openButton =
  card.querySelector(
    ".openButton"
  );


  const deleteButton =
  card.querySelector(
    ".deleteButton"
  );


  const notificationId =
  notificationData.id;


  /* ===================================================
     OPEN WHATEVER TRIGGERED THIS NOTIFICATION

     Marks it read, then routes to its real
     destination (the specific post, profile,
     etc.) instead of always landing on the
     general Community Wall. Tapping anywhere
     on the card does the same thing as the
     Open button — the Delete button below
     stops that click from bubbling up.
  =================================================== */

  async function openNotification(){

    if(!notificationId){

      alert(
        "This notification cannot be opened."
      );

      return;

    }


    if(openButton){

      openButton.disabled = true;

      openButton.textContent =
      "⏳ Opening...";

    }


    try{

      if(
        notificationData.read !== true
      ){

        const notificationReference =
        doc(
          db,
          "notifications",
          notificationId
        );


        await updateDoc(
          notificationReference,
          {
            read:true
          }
        );

      }


      const destination =
      getNotificationDestination(
        notificationData
      );


      window.location.href =
      destination;


    }catch(error){

      console.error(
        "Opening notification error:",
        error
      );


      alert(
        error.message ||
        "The notification could not be opened."
      );


      if(openButton){

        openButton.disabled = false;

        openButton.textContent =
        "Open";

      }

    }

  }


  if(openButton){

    openButton.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        openNotification();

      }
    );

  }


  card.addEventListener(
    "click",
    () => {

      openNotification();

    }
  );


  /* ===================================================
     DELETE ONE NOTIFICATION
  =================================================== */

  if(deleteButton){

    deleteButton.addEventListener(
      "click",
      async(event)=>{

        event.stopPropagation();


        if(!notificationId){

          alert(
            "This notification cannot be deleted."
          );

          return;

        }


        const confirmed =
        confirm(
          "Are you sure you want to delete this notification?"
        );


        if(!confirmed){

          return;

        }


        deleteButton.disabled = true;

        deleteButton.textContent =
        "⏳ Deleting...";


        try{

          const notificationReference =
          doc(
            db,
            "notifications",
            notificationId
          );


          await deleteDoc(
            notificationReference
          );

        }catch(error){

          console.error(
            "Notification deletion error:",
            error
          );


          alert(
            error.message ||
            "The notification could not be deleted."
          );


          deleteButton.disabled = false;

          deleteButton.textContent =
          "🗑 Delete";

        }

      }
    );

  }

}


/* =====================================================
   MARK ALL NOTIFICATIONS AS READ
===================================================== */

if(markAllButton){

  markAllButton.addEventListener(
    "click",
    async()=>{

      if(!currentUser){

        alert(
          "Please sign in first."
        );

        return;

      }


      const unreadNotifications =
      currentNotifications.filter(
        notification =>
        notification.read !== true
      );


      if(unreadNotifications.length === 0){

        alert(
          "All notifications are already read."
        );

        return;

      }


      markAllButton.disabled = true;

      markAllButton.textContent =
      "⏳ Marking...";


      try{

        const batch =
        writeBatch(db);


        unreadNotifications.forEach(
          notification => {

            if(!notification.id){

              return;

            }


            const notificationReference =
            doc(
              db,
              "notifications",
              notification.id
            );


            batch.update(
              notificationReference,
              {
                read:true
              }
            );

          }
        );


        await batch.commit();


        alert(
          "All notifications have been marked as read."
        );

      }catch(error){

        console.error(
          "Mark-all notification error:",
          error
        );


        alert(
          error.message ||
          "Notifications could not be marked as read."
        );

      }finally{

        markAllButton.textContent =
        "✓ Mark All Read";


        updateNotificationCount();

      }

    }
  );

}


/* =====================================================
   REFRESH BUTTON
===================================================== */

if(refreshButton){

  refreshButton.addEventListener(
    "click",
    ()=>{

      if(!currentUser){

        alert(
          "Please sign in to refresh notifications."
        );

        return;

      }


      refreshButton.disabled = true;

      refreshButton.textContent =
      "⏳ Refreshing...";


      showLoadingMessage();

      loadNotifications();


      setTimeout(
        ()=>{

          refreshButton.disabled = false;

          refreshButton.textContent =
          "🔄 Refresh";

        },
        1200
      );

    }
  );

}
/* =====================================================
   BACK BUTTON
===================================================== */

if(backButton){

  backButton.addEventListener(
    "click",
    ()=>{

      window.location.href =
      "feed.html";

    }
  );

}
/* =====================================================
   PART 6 OF 6
   CONNECTION HANDLING, CLEANUP AND CLOSING
===================================================== */


/* =====================================================
   OFFLINE MESSAGE
===================================================== */

window.addEventListener(
  "offline",
  ()=>{

    console.warn(
      "The device is offline."
    );


    if(
      currentNotifications.length === 0
    ){

      showErrorMessage(
        "You are offline. Connect to the internet to load notifications."
      );

    }

  }
);


/* =====================================================
   ONLINE RELOAD
===================================================== */

window.addEventListener(
  "online",
  ()=>{

    console.log(
      "Internet connection restored."
    );


    if(currentUser){

      showLoadingMessage();

      loadNotifications();

    }

  }
);
