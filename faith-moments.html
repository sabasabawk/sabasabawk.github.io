<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faith Moments | SABASABA Gospel Ministry</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f0f2f5; color: #050505; font-family: Arial, sans-serif; padding-bottom: 70px; }
    .header { background: #fff; padding: 12px 16px; border-bottom: 1px solid #e4e6eb; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .header h1 { font-size: 18px; color: #1877f2; }
    .create-btn { background: #1877f2; color: #fff; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold; }
    .feed-container { max-width: 600px; margin: 12px auto; padding: 0 8px; }
    .moment-card { background: #fff; border-radius: 8px; border: 1px solid #e4e6eb; margin-bottom: 12px; padding: 12px; }
    .moment-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .author-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #ddd; }
    .author-name { font-weight: bold; font-size: 14px; }
    .moment-time { font-size: 11px; color: #65676b; }
    .moment-message { font-size: 14px; line-height: 1.4; margin-bottom: 10px; white-space: pre-wrap; }
    .verse-box { background: #e7f3ff; border-left: 4px solid #1877f2; padding: 8px; font-size: 13px; margin-bottom: 10px; font-style: italic; }
    .media-box { width: 100%; background: #000; border-radius: 6px; overflow: hidden; margin-top: 8px; }
    .media-box video, .media-box img { width: 100%; max-height: 450px; object-fit: contain; display: block; }
    .video-fallback { display: block; padding: 10px; background: #000; color: #ffeb3b; text-align: center; font-size: 13px; text-decoration: none; border-top: 1px solid #333; }
    .loading, .empty { text-align: center; padding: 30px; color: #65676b; font-size: 14px; }
  </style>
</head>
<body>

  <header class="header">
    <h1>🌅 Faith Moments</h1>
    <a href="create-faith-moment.html" class="create-btn">+ Create Moment</a>
  </header>

  <main class="feed-container">
    <div id="momentsFeed">
      <div class="loading">Loading faith moments...</div>
    </div>
  </main>

  <script type="module">
    import { db, auth, collection, getDocs, query, orderBy, onAuthStateChanged } from "./firebase.js";

    const feedContainer = document.getElementById("momentsFeed");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.replace("login.html");
        return;
      }
      loadFaithMoments();
    });

    async function loadFaithMoments() {
      try {
        const q = query(collection(db, "faithMoments"), orderBy("timestamp", "desc"));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          feedContainer.innerHTML = `<div class="empty">No faith moments shared yet. Be the first to share!</div>`;
          return;
        }

        let html = "";
        const now = Date.now();

        snapshot.forEach((docSnap) => {
          const post = docSnap.data();
          
          const createdAt = post.timestamp?.toMillis ? post.timestamp.toMillis() : (post.timestamp?.seconds ? post.timestamp.seconds * 1000 : now);
          const isExpired = (now - createdAt) > (24 * 60 * 60 * 1000);
          if (isExpired) return;

          const name = post.authorName || post.name || "Community Member";
          const avatar = post.authorPicture || post.profilePicture || "https://via.placeholder.com/40";
          const timeAgo = timeSince(createdAt);

          let mediaHTML = "";
          // Strictly bypass any ImageKit URL strings if they exist
          let mediaUrl = post.videoUrl || post.imageUrl || post.mediaUrl || "";
          if (mediaUrl.includes("imagekit.io")) {
            mediaUrl = ""; // Ignore dead imagekit links
          }

          if (mediaUrl) {
            if (post.mediaType === "video" || mediaUrl.match(/\.(mp4|mov|webm|m4v)/i)) {
              mediaHTML = `
                <div class="media-box">
                  <video src="${mediaUrl}" controls preload="metadata" playsinline crossorigin="anonymous"></video>
                  <a href="${mediaUrl}" target="_blank" class="video-fallback">⚠️ Having trouble playing? Tap to open video directly.</a>
                </div>
              `;
            } else {
              mediaHTML = `
                <div class="media-box">
                  <img src="${mediaUrl}" alt="Faith moment media">
                </div>
              `;
            }
          }

          let verseHTML = post.verseReference ? `<div class="verse-box">📖 <b>${post.verseReference}</b></div>` : "";

          html += `
            <div class="moment-card">
              <div class="moment-header">
                <img src="${avatar}" class="author-avatar" alt="Avatar">
                <div>
                  <div class="author-name">${escapeHTML(name)}</div>
                  <div class="moment-time">${timeAgo} • <span style="text-transform:capitalize;">${post.momentType || 'encouragement'}</span></div>
                </div>
              </div>
              ${verseHTML}
              <div class="moment-message">${escapeHTML(post.message || "")}</div>
              ${mediaHTML}
            </div>
          `;
        });

        feedContainer.innerHTML = html || `<div class="empty">No active faith moments right now.</div>`;

      } catch (err) {
        console.error("Error loading moments:", err);
        feedContainer.innerHTML = `<div class="empty" style="color:red;">Failed to load moments. Please refresh.</div>`;
      }
    }

    function timeSince(date) {
      const seconds = Math.floor((new Date() - date) / 1000);
      let interval = seconds / 31536000;
      if (interval > 1) return Math.floor(interval) + "y ago";
      interval = seconds / 2592000;
      if (interval > 1) return Math.floor(interval) + "mo ago";
      interval = seconds / 86400;
      if (interval > 1) return Math.floor(interval) + "d ago";
      interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + "h ago";
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + "m ago";
      return "Just now";
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
