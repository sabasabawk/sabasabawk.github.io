<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Faith Moments | Faith Connect</title>

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    :root{
      --primary:#087bd1;
      --primary-dark:#0668b3;
      --primary-light:#e8f4fc;
      --background:#f2f5f8;
      --surface:#ffffff;
      --text:#1e2a33;
      --muted:#687680;
      --border:#dce4ea;
      --shadow:0 5px 18px rgba(24,55,75,.10);
    }

    body{
      min-height:100vh;
      padding-bottom:85px;

      background:var(--background);
      color:var(--text);

      font-family:Arial,Helvetica,sans-serif;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button{
      font:inherit;
      cursor:pointer;
    }

    img,
    video{
      display:block;
      max-width:100%;
    }


    /* TOP HEADER */

    .topHeader{
      position:sticky;
      top:0;
      z-index:1000;

      background:#ffffff;
      border-bottom:1px solid var(--border);
    }

    .topHeaderInner{
      width:100%;
      max-width:760px;
      min-height:62px;

      margin:auto;
      padding:8px 14px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .brandIcon{
      width:42px;
      height:42px;

      border-radius:14px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:linear-gradient(
        145deg,
        var(--primary),
        #50afea
      );

      color:white;
      font-size:21px;
    }

    .brandTitle{
      font-size:16px;
      font-weight:900;
    }

    .brandSubtitle{
      margin-top:2px;

      color:var(--muted);
      font-size:11px;
      font-weight:700;
    }

    .headerButtons{
      display:flex;
      align-items:center;
      gap:7px;
    }

    .headerButton{
      width:40px;
      height:40px;

      border:0;
      border-radius:50%;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#edf3f7;

      font-size:18px;
    }


    /* MAIN CONTAINER */

    .pageContainer{
      width:100%;
      max-width:760px;

      margin:auto;
      padding:18px 14px 32px;
    }

    .pageHeading{
      margin-bottom:16px;

      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .pageTitle{
      font-size:26px;
      font-weight:900;
    }

    .pageDescription{
      max-width:520px;
      margin-top:6px;

      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .createButton{
      flex-shrink:0;

      padding:11px 14px;

      border-radius:13px;

      background:var(--primary);
      color:white;

      font-size:13px;
      font-weight:900;

      box-shadow:0 5px 14px rgba(8,123,209,.22);
    }


    /* TODAY'S BLESSING */

    .blessingCard{
      position:relative;
      overflow:hidden;

      margin-bottom:22px;
      padding:22px;

      border-radius:22px;

      background:linear-gradient(
        135deg,
        #087bd1,
        #4da8e4
      );

      color:white;

      box-shadow:0 9px 25px rgba(8,123,209,.24);
    }

    .blessingCard::before{
      content:"";

      position:absolute;
      top:-45px;
      right:-35px;

      width:145px;
      height:145px;

      border-radius:50%;

      background:rgba(255,255,255,.11);
    }

    .blessingContent{
      position:relative;
      z-index:2;
    }

    .blessingLabel{
      display:inline-block;

      margin-bottom:13px;
      padding:7px 11px;

      border-radius:999px;

      background:rgba(255,255,255,.17);

      font-size:12px;
      font-weight:900;
    }

    .blessingText{
      font-family:Georgia,"Times New Roman",serif;

      font-size:20px;
      font-weight:700;
      line-height:1.5;
    }

    .blessingReference{
      margin-top:11px;

      font-size:13px;
      font-weight:900;
    }

    .blessingFooter{
      margin-top:17px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .blessingDate{
      font-size:11px;
      font-weight:700;
      opacity:.85;
    }

    .shareBlessingButton{
      padding:8px 12px;

      border:1px solid rgba(255,255,255,.38);
      border-radius:11px;

      background:rgba(255,255,255,.14);
      color:white;

      font-size:12px;
      font-weight:900;
    }


    /* MOMENT CIRCLES */

    .sectionHeader{
      margin-bottom:12px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .sectionTitle{
      font-size:18px;
      font-weight:900;
    }

    .sectionSubtitle{
      margin-top:3px;

      color:var(--muted);
      font-size:12px;
    }

    .refreshButton{
      width:39px;
      height:39px;

      border:0;
      border-radius:50%;

      background:#e4f1fa;
      color:var(--primary);

      font-size:18px;
    }

    .momentsRow{
      margin-bottom:18px;
      padding:3px 2px 10px;

      display:flex;
      align-items:flex-start;
      gap:13px;

      overflow-x:auto;
    }

    .momentCircle{
      width:74px;
      flex:0 0 74px;

      display:flex;
      flex-direction:column;
      align-items:center;
      gap:7px;

      text-align:center;
    }

    .momentAvatarOuter{
      position:relative;

      width:66px;
      height:66px;
      padding:3px;

      border-radius:50%;

      background:linear-gradient(
        145deg,
        var(--primary),
        #56c2ef
      );
    }

    .momentAvatar{
      width:100%;
      height:100%;

      border:3px solid white;
      border-radius:50%;

      display:flex;
      align-items:center;
      justify-content:center;

      overflow:hidden;

      background:#edf3f7;
      color:var(--primary);

      font-size:24px;
      font-weight:900;
    }

    .momentBadge{
      position:absolute;
      right:-1px;
      bottom:-2px;

      width:24px;
      height:24px;

      border:2px solid white;
      border-radius:50%;

      display:flex;
      align-items:center;
      justify-content:center;

      background:var(--primary);
      color:white;

      font-size:13px;
    }

    .momentName{
      width:100%;

      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      font-size:11px;
      font-weight:800;
    }


    /* FILTERS */

    .momentFilters{
      margin-bottom:17px;

      display:flex;
      align-items:center;
      gap:8px;

      overflow-x:auto;
    }

    .filterButton{
      flex-shrink:0;

      padding:8px 12px;

      border:1px solid var(--border);
      border-radius:999px;

      background:white;
      color:var(--muted);

      font-size:12px;
      font-weight:900;
    }

    .filterButton.active{
      border-color:var(--primary);

      background:var(--primary-light);
      color:var(--primary);
    }


    /* FEED */

    .momentsFeed{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }

    .statusCard{
      grid-column:1 / -1;

      padding:30px 18px;

      border:1px solid var(--border);
      border-radius:17px;

      background:white;

      text-align:center;

      box-shadow:var(--shadow);
    }

    .statusIcon{
      margin-bottom:10px;
      font-size:34px;
    }

    .statusTitle{
      font-size:16px;
      font-weight:900;
    }

    .statusText{
      max-width:450px;
      margin:7px auto 0;

      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }


    /* FLOATING BUTTON */

    .floatingButton{
      position:fixed;
      right:20px;
      bottom:86px;
      z-index:900;

      width:56px;
      height:56px;

      border-radius:50%;

      display:flex;
      align-items:center;
      justify-content:center;

      background:var(--primary);
      color:white;

      font-size:30px;

      box-shadow:0 8px 20px rgba(8,123,209,.30);
    }


    /* BOTTOM NAVIGATION */

    .bottomNavigation{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:850;

      background:white;
      border-top:1px solid var(--border);

      box-shadow:0 -4px 16px rgba(20,45,63,.08);
    }

    .bottomNavigationInner{
      width:100%;
      max-width:760px;
      min-height:70px;

      margin:auto;
      padding:6px;

      display:flex;
      align-items:center;
      justify-content:space-around;
    }

    .bottomNavItem{
      flex:1;

      padding:7px 2px;

      border-radius:12px;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;

      color:#66737d;

      font-size:9px;
      font-weight:900;
    }

    .bottomNavItem.active{
      background:var(--primary-light);
      color:var(--primary);
    }

    .bottomNavIcon{
      font-size:19px;
    }


    /* RESPONSIVE */

    @media(max-width:560px){

      .pageHeading{
        flex-direction:column;
      }

      .createButton{
        align-self:flex-start;
      }

      .momentsFeed{
        grid-template-columns:1fr;
      }

      .blessingText{
        font-size:18px;
      }

    }

    @media(max-width:390px){

      .pageContainer{
        padding-left:10px;
        padding-right:10px;
      }

      .brandSubtitle{
        display:none;
      }

      .bottomNavItem{
        font-size:8px;
      }

    }

  </style>

</head>
