<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - SABASABA Gospel Ministry</title>

<style>

body{
font-family:Arial,sans-serif;
background:#eef3f8;
margin:0;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 4px 12px rgba(0,0,0,.1);
}

#brandLabel{
text-align:center;
color:#ffb703;
font-size:14px;
font-weight:bold;
letter-spacing:.5px;
margin-bottom:6px;
}

h1{
text-align:center;
color:#087bd1;
}

p{
text-align:center;
color:#666;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
margin-top:25px;
padding:14px;
background:#087bd1;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#0667b1;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

#create{
text-align:center;
margin-top:20px;
}

#create a{
text-decoration:none;
color:#087bd1;
font-weight:bold;
}

#message{
margin-top:20px;
text-align:center;
font-weight:bold;
}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

#forgotPasswordRow{
text-align:center;
margin-top:14px;
}

#forgotPasswordLink{
background:none;
border:none;
padding:0;
color:#087bd1;
font-size:14px;
font-weight:bold;
text-decoration:underline;
cursor:pointer;
width:auto;
margin:0;
}

#forgotPasswordBox{
display:none;
margin-top:18px;
padding:16px;
background:#f4f8fc;
border:1px solid #d3e3f0;
border-radius:10px;
}

#forgotPasswordBox.show{
display:block;
}

#forgotPasswordBox p{
margin:0 0 4px;
text-align:left;
color:#444;
font-size:14px;
}

#resetMessage{
margin-top:12px;
text-align:center;
font-weight:bold;
font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<div id="brandLabel">Faith Connect</div>

<h1>🔐 Login</h1>

<p>Welcome back to SABASABA Gospel Ministry.</p>

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter your email">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password">

<button onclick="loginUser()">

Login

</button>

<p id="message"></p>

<div id="forgotPasswordRow">

<button
type="button"
id="forgotPasswordLink"
onclick="toggleForgotPassword()"
>
Forgot your password?
</button>

</div>

<div id="forgotPasswordBox">

<p>Enter your email and we'll send you a link to reset your password.</p>

<input
type="email"
id="resetEmail"
placeholder="Enter your email">

<button
type="button"
id="sendResetButton"
onclick="sendResetLink()"
>
Send Reset Link
</button>

<p id="resetMessage"></p>

</div>

<div id="create">

Don't have an account?

<br><br>

<a href="register.html">

Create Account

</a>

</div>

</div>

<script type="module">

import {
auth,
signInWithEmailAndPassword
} from "./firebase.js";

/*
   Imported directly from the Firebase Auth SDK
   rather than through firebase.js, the same way
   other pages pull serverTimestamp straight from
   the Firestore SDK when firebase.js doesn't
   re-export something. If firebase.js already
   re-exports sendPasswordResetEmail, this import
   can be switched to come from "./firebase.js"
   instead, but importing it this way works either
   way without needing to touch firebase.js.
*/

import {
sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

window.loginUser = async function(){

let email =
document.getElementById("email").value.trim();

let password =
document.getElementById("password").value;

try{

const userCredential =
await signInWithEmailAndPassword(
auth,
email,
password
);

localStorage.setItem("loggedIn","true");
localStorage.setItem("userEmail",email);

document.getElementById("message").style.color="green";
document.getElementById("message").innerHTML =
"✅ Login successful!";

setTimeout(function(){

/*
   FIX: this used to send successful logins to
   "community.html", which does not exist
   anywhere in this app -- the actual Community
   Wall page is feed.html.
*/

window.location.href="feed.html";

},1200);

}catch(error){

document.getElementById("message").style.color="red";
document.getElementById("message").innerHTML =
error.message;

}

};


/* =====================================================
   FORGOT PASSWORD
===================================================== */

window.toggleForgotPassword = function(){

const box =
document.getElementById("forgotPasswordBox");

const resetEmailInput =
document.getElementById("resetEmail");

const emailInput =
document.getElementById("email");


const isOpening =
!box.classList.contains("show");


box.classList.toggle("show");


if(
isOpening &&
emailInput.value.trim() &&
!resetEmailInput.value.trim()
){

/*
   Pre-fills the reset box with whatever the
   person already typed in the main email
   field, so they don't have to type it twice.
*/

resetEmailInput.value =
emailInput.value.trim();

}

};


window.sendResetLink = async function(){

const resetEmailInput =
document.getElementById("resetEmail");

const resetMessage =
document.getElementById("resetMessage");

const sendResetButton =
document.getElementById("sendResetButton");

const enteredEmail =
resetEmailInput.value.trim();


if(!enteredEmail){

resetMessage.style.color =
"red";

resetMessage.innerHTML =
"Please enter your email address.";

return;

}


sendResetButton.disabled =
true;

sendResetButton.textContent =
"Sending...";

resetMessage.innerHTML =
"";


try{

await sendPasswordResetEmail(
auth,
enteredEmail
);

resetMessage.style.color =
"green";

resetMessage.innerHTML =
"✅ A password reset link has been sent. Please check your email inbox (and spam folder).";

}catch(error){

resetMessage.style.color =
"red";


/*
   Firebase intentionally does not confirm or
   deny whether an email address has an account,
   for privacy reasons -- so most errors here are
   shown in a friendly, generic way rather than
   exposing Firebase's raw error codes.
*/

if(
String(error?.code || "").includes(
"invalid-email"
)
){

resetMessage.innerHTML =
"Please enter a valid email address.";

}else{

resetMessage.innerHTML =
"If an account exists for that email, a reset link has been sent.";

}

}finally{

sendResetButton.disabled =
false;

sendResetButton.textContent =
"Send Reset Link";

}

};

</script>

</body>
</html>
