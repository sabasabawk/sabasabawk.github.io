<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - SABASABA Gospel Ministry</title>

<style>

body{
font-family:Arial,sans-serif;
background:#eef3f8;
margin:0;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 4px 12px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#0066cc;
}

p{
text-align:center;
color:#666;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
margin-top:25px;
padding:14px;
background:#0066cc;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#004d99;
}

#create{
text-align:center;
margin-top:20px;
}

#create a{
text-decoration:none;
color:#0066cc;
font-weight:bold;
}

#message{
margin-top:20px;
text-align:center;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>🔐 Login</h1>

<p>Welcome back to SABASABA Gospel Ministry.</p>

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter your email">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password">

<button onclick="loginUser()">

Login

</button>

<p id="message"></p>

<div id="create">

Don't have an account?

<br><br>

<a href="register.html">

Create Account

</a>

</div>

</div>

<script>

function loginUser(){

let email=document.getElementById("email").value.trim();

let password=document.getElementById("password").value;

let user=
JSON.parse(localStorage.getItem("registeredUser"));

if(user==null){

alert("No account found. Please register first.");

return;

}

if(email===user.email && password===user.password){

localStorage.setItem("loggedIn","true");

localStorage.setItem("userName",user.fullname);

localStorage.setItem("userEmail",user.email);

document.getElementById("message").innerHTML=
"✅ Login successful!";

setTimeout(function(){

window.location.href="community.html";

},1200);

}else{

document.getElementById("message").style.color="red";

document.getElementById("message").innerHTML=
"❌ Incorrect email or password.";

}

}

</script>

</body>
</html>
