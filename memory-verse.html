<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Verse - SABASABA Gospel Ministry</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    text-align:center;
}

header{
    background:#1e3a8a;
    color:white;
    padding:20px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    max-width:600px;
    margin:20px auto;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

#verseText{
    font-size:22px;
    line-height:1.6;
    color:#333;
}

#verseRef{
    margin-top:15px;
    font-weight:bold;
    color:#1e3a8a;
}

button{
    background:#1e3a8a;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin-top:15px;
}

button:hover{
    opacity:0.9;
}

footer{
    margin-top:30px;
    padding:15px;
    color:#666;
}
</style>
</head>

<body>

<header>
    <h1>📖 Memory Verse</h1>
    <p>SABASABA Gospel Ministry</p>
</header>

<div class="container">
    <div class="card">
        <h2 id="verseText"></h2>
        <p id="verseRef"></p>

        <button onclick="nextVerse()">Next Verse</button>
    </div>
</div>

<footer>
    SABASABA Gospel Ministry<br>
    sabasabawk.github.io
</footer>

<script>
const verses = [
{
text:"For I know the plans I have for you, declares the Lord, plans to prosper you and not to harm you, plans to give you hope and a future.",
ref:"Jeremiah 29:11"
},
{
text:"The Lord is my shepherd; I shall not want.",
ref:"Psalm 23:1"
},
{
text:"I can do all things through Christ who strengthens me.",
ref:"Philippians 4:13"
},
{
text:"Be strong and courageous. Do not be afraid or discouraged, for the Lord your God will be with you wherever you go.",
ref:"Joshua 1:9"
},
{
text:"Trust in the Lord with all your heart and lean not on your own understanding.",
ref:"Proverbs 3:5"
}
];

let currentVerse = 0;

function showVerse(){
document.getElementById("verseText").innerHTML =
verses[currentVerse].text;

document.getElementById("verseRef").innerHTML =
verses[currentVerse].ref;
}

function nextVerse(){
currentVerse++;

if(currentVerse >= verses.length){
currentVerse = 0;
}

showVerse();
}

showVerse();
</script>

</body>
</html>
