<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Memory Verse - SABASABA Gospel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    header {
      background: #1e3a8a;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    .verse-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      text-align: center;
    }

    .verse {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .reference {
      color: #555;
      margin-bottom: 20px;
    }

    button {
      background: #1e3a8a;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #3749a6;
    }
  </style>
</head>
<body>

<header>
  <h2>SABASABA Gospel Ministry</h2>
  <p>Memory Verse</p>
</header>

<div class="container">
  <div class="verse-card">
    <div class="verse" id="verseText">
      "I can do all things through Christ who strengthens me."
    </div>
    <div class="reference" id="verseRef">
      Philippians 4:13
    </div>

    <button onclick="newVerse()">Next Verse</button>
  </div>
</div>

<script>
  const verses = [
    { text: "I can do all things through Christ who strengthens me.", ref: "Philippians 4:13" },
    { text: "The Lord is my shepherd; I shall not want.", ref: "Psalm 23:1" },
    { text: "For God so loved the world that He gave His only Son.", ref: "John 3:16" },
    { text: "Trust in the Lord with all your heart.", ref: "Proverbs 3:5" }
  ];

  function newVerse() {
    const random = Math.floor(Math.random() * verses.length);
    document.getElementById("verseText").innerText = verses[random].text;
    document.getElementById("verseRef").innerText = verses[random].ref;
  }
</script>

</body>
</html>
