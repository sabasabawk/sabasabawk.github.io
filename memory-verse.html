<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Verse - SABASABA Gospel Ministry</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(to bottom,#eef3ff,#f7f9fc);
    text-align:center;
}

/* HEADER */
header{
    background:linear-gradient(135deg,#0b3d91,#1e90ff);
    color:white;
    padding:25px;
    border-bottom-left-radius:25px;
    border-bottom-right-radius:25px;
}

header h1{
    font-size:28px;
}

/* CONTAINER */
.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

/* CARD */
.card{
    background:white;
    padding:25px;
    margin-top:20px;
    border-radius:15px;
    box-shadow:0 6px 15px rgba(0,0,0,0.1);
}

/* VERSE */
#verseText{
    font-size:22px;
    line-height:1.6;
    color:#333;
}

#verseRef{
    margin-top:10px;
    font-weight:bold;
    color:#0b3d91;
}

/* PROGRESS */
.progress-container{
    width:100%;
    background:#ddd;
    height:16px;
    border-radius:10px;
    margin-top:15px;
    overflow:hidden;
}

#progressBar{
    height:100%;
    width:0%;
    background:green;
    transition:0.4s;
}

#progressText{
    font-weight:bold;
    margin-top:10px;
    color:#0b3d91;
}

/* BUTTONS */
.buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:15px;
}

button{
    padding:10px 14px;
    border:none;
    border-radius:8px;
    background:#0b3d91;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1e90ff;
    transform:scale(1.05);
}

/* LIST */
.list{
    text-align:left;
    margin-top:10px;
    max-height:200px;
    overflow:auto;
}

.item{
    padding:8px;
    border-bottom:1px solid #eee;
    font-size:14px;
}

/* FOOTER */
footer{
    margin-top:30px;
    padding:15px;
    background:#0b3d91;
    color:white;
    border-top-left-radius:20px;
    border-top-right-radius:20px;
}
</style>
</head>

<body>

<header>
    <h1>📖 Memory Verse</h1>
    <p>SABASABA Gospel Ministry</p>
</header>

<div class="container">

<div class="card">
    <h2 id="verseText">Loading...</h2>
    <p id="verseRef"></p>

    <div class="progress-container">
        <div id="progressBar"></div>
    </div>
    <p id="progressText"></p>

    <div class="buttons">
        <button onclick="prevVerse()">⬅ Prev</button>
        <button onclick="nextVerse()">Next ➡</button>
        <button onclick="randomVerse()">🔀 Random</button>
        <button onclick="markLearned()">✅ Learned</button>
        <button onclick="toggleFavorite()">⭐ Favorite</button>
        <button onclick="shareVerse()">📤 Share</button>
    </div>
</div>

<div class="card">
    <h2>📌 Learned Verses</h2>
    <div id="learnedList" class="list"></div>
</div>

</div>

<footer>
SABASABA Gospel Ministry<br>
sabasabawk.github.io
</footer>

<script>
const verses = [
{ text:"I can do all things through Christ who strengthens me.", ref:"Philippians 4:13" },
{ text:"The Lord is my shepherd; I shall not want.", ref:"Psalm 23:1" },
{ text:"For I know the plans I have for you, declares the Lord.", ref:"Jeremiah 29:11" },
{ text:"Be strong and courageous. Do not be afraid.", ref:"Joshua 1:9" },
{ text:"Trust in the Lord with all your heart.", ref:"Proverbs 3:5" },
{ text:"The Lord is my light and my salvation; whom shall I fear?", ref:"Psalm 27:1" },
{ text:"God is our refuge and strength, an ever-present help in trouble.", ref:"Psalm 46:1" },
{ text:"And we know that in all things God works for the good.", ref:"Romans 8:28" },
{ text:"If God is for us, who can be against us?", ref:"Romans 8:31" },
{ text:"Cast all your anxiety on Him because He cares for you.", ref:"1 Peter 5:7" },

{ text:"The fear of the Lord is the beginning of wisdom.", ref:"Proverbs 9:10" },
{ text:"Jesus Christ is the same yesterday, today, and forever.", ref:"Hebrews 13:8" },
{ text:"I am the way, the truth, and the life.", ref:"John 14:6" },
{ text:"With God all things are possible.", ref:"Matthew 19:26" },
{ text:"Let your light shine before others.", ref:"Matthew 5:16" },

{ text:"The Lord will fight for you; you need only to be still.", ref:"Exodus 14:14" },
{ text:"The joy of the Lord is your strength.", ref:"Nehemiah 8:10" },
{ text:"Do not worry about tomorrow.", ref:"Matthew 6:34" },
{ text:"Faith comes by hearing, and hearing by the word of God.", ref:"Romans 10:17" },
{ text:"We walk by faith, not by sight.", ref:"2 Corinthians 5:7" },

{ text:"Create in me a clean heart, O God.", ref:"Psalm 51:10" },
{ text:"The Lord is close to the brokenhearted.", ref:"Psalm 34:18" },
{ text:"Come to me, all you who are weary.", ref:"Matthew 11:28" },
{ text:"For God so loved the world that He gave His only Son.", ref:"John 3:16" },
{ text:"The truth will set you free.", ref:"John 8:32" },

{ text:"Pray without ceasing.", ref:"1 Thessalonians 5:17" },
{ text:"Give thanks in all circumstances.", ref:"1 Thessalonians 5:18" },
{ text:"Love your neighbor as yourself.", ref:"Mark 12:31" },
{ text:"Blessed are the pure in heart.", ref:"Matthew 5:8" },
{ text:"Seek first the kingdom of God.", ref:"Matthew 6:33" },

{ text:"The Lord is good, a refuge in times of trouble.", ref:"Nahum 1:7" },
{ text:"He gives strength to the weary.", ref:"Isaiah 40:29" },
{ text:"Those who hope in the Lord will renew their strength.", ref:"Isaiah 40:31" },
{ text:"The Lord is my strength and my shield.", ref:"Psalm 28:7" },
{ text:"Be still, and know that I am God.", ref:"Psalm 46:10" },

{ text:"Do everything in love.", ref:"1 Corinthians 16:14" },
{ text:"Love is patient, love is kind.", ref:"1 Corinthians 13:4" },
{ text:"God is love.", ref:"1 John 4:8" },
{ text:"If we confess our sins, He is faithful and just.", ref:"1 John 1:9" },
{ text:"The Lord preserves all who love Him.", ref:"Psalm 145:20" },

{ text:"He heals the brokenhearted and binds up their wounds.", ref:"Psalm 147:3" },
{ text:"The Lord is faithful to all His promises.", ref:"Psalm 145:13" },
{ text:"Your word is a lamp to my feet.", ref:"Psalm 119:105" },
{ text:"I have hidden your word in my heart.", ref:"Psalm 119:11" },
{ text:"Jesus said, 'Follow me.'", ref:"Matthew 4:19" }
];
let index = 0;
let learned = JSON.parse(localStorage.getItem("learned") || "[]");
let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");

function showVerse(){
    document.getElementById("verseText").innerText = verses[index].text;
    document.getElementById("verseRef").innerText = verses[index].ref;
    updateProgress();
    renderLearned();
}

function nextVerse(){
    index = (index + 1) % verses.length;
    showVerse();
}

function prevVerse(){
    index = (index - 1 + verses.length) % verses.length;
    showVerse();
}

function randomVerse(){
    index = Math.floor(Math.random() * verses.length);
    showVerse();
}

function markLearned(){
    let v = verses[index];
    if(!learned.some(x => x.ref === v.ref)){
        learned.push(v);
        localStorage.setItem("learned", JSON.stringify(learned));
    }
    updateProgress();
    renderLearned();
}

function toggleFavorite(){
    let v = verses[index];
    let exists = favorites.some(x => x.ref === v.ref);

    if(exists){
        favorites = favorites.filter(x => x.ref !== v.ref);
    } else {
        favorites.push(v);
    }

    localStorage.setItem("favorites", JSON.stringify(favorites));
}

function shareVerse(){
    let v = verses[index];
    let text = `${v.text} - ${v.ref}`;
    navigator.clipboard.writeText(text);
    alert("Verse copied to clipboard!");
}

function updateProgress(){
    let percent = Math.round((learned.length / verses.length) * 100);
    document.getElementById("progressBar").style.width = percent + "%";
    document.getElementById("progressText").innerText =
        `${learned.length} / ${verses.length} learned (${percent}%)`;
}

function renderLearned(){
    let box = document.getElementById("learnedList");
    box.innerHTML = "";

    learned.forEach(v=>{
        let div = document.createElement("div");
        div.className = "item";
        div.innerText = v.text + " - " + v.ref;
        box.appendChild(div);
    });
}

showVerse();
</script>

</body>
</html>
