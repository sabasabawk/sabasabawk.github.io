<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Memory Verse</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4f6f9;
      margin: 0;
    }

    header {
      background: #1e3a8a;
      color: white;
      padding: 20px;
    }

    .card {
      background: white;
      margin: 30px auto;
      padding: 20px;
      width: 90%;
      max-width: 500px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    button {
      padding: 12px;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>📖 Memory Verse</h1>
</header>

<div class="card">
  <h2 id="verseText">Loading...</h2>
  <p id="verseRef"></p>

  <button onclick="nextVerse()">Next Verse</button>
</div>

<script>
  const verses = [
    ["Jeremiah 29:11", "For I know the plans I have for you declares the Lord."],
    ["Psalm 23:1", "The Lord is my shepherd; I shall not want."],
    ["Philippians 4:13", "I can do all things through Christ who strengthens me."],
    ["Joshua 1:9", "Be strong and courageous. Do not be afraid."]
  ];

  let index = 0;

  function showVerse() {
    document.getElementById("verseRef").innerText = verses[index][0];
    document.getElementById("verseText").innerText = verses[index][1];
  }

  function nextVerse() {
    index = (index + 1) % verses.length;
    showVerse();
  }

  showVerse();
</script>

</body>
</html>
