
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Messages | SABASABA Gospel Ministry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.header{
background:#0066cc;
color:white;
padding:25px;
border-radius:18px;
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:30px;
margin-bottom:8px;
}

.header p{
font-size:16px;
opacity:.95;
}

.searchBox{
margin-bottom:20px;
}

.searchBox input{
width:100%;
padding:14px;
font-size:16px;
border:1px solid #ccc;
border-radius:12px;
outline:none;
}

.searchBox input:focus{
border-color:#0066cc;
}

.chatList{
display:flex;
flex-direction:column;
gap:15px;
}

.chatCard{
display:flex;
align-items:center;
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
cursor:pointer;
transition:.25s;
}

.chatCard:hover{
transform:translateY(-2px);
}

.avatar{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
margin-right:15px;
background:#ddd;
}

.info{
flex:1;
}

.info h3{
color:#0066cc;
font-size:18px;
margin-bottom:5px;
}

.info p{
font-size:15px;
color:#666;
}

.time{
font-size:12px;
color:gray;
margin-left:10px;
white-space:nowrap;
}

.empty{
background:white;
padding:40px;
border-radius:15px;
text-align:center;
color:#777;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.newChat{
position:fixed;
right:25px;
bottom:25px;
width:65px;
height:65px;
border:none;
border-radius:50%;
background:#0066cc;
color:white;
font-size:34px;
cursor:pointer;
box-shadow:0 5px 12px rgba(0,0,0,.25);
}

.back{
text-align:center;
margin-top:30px;
}

.back button{
background:#0066cc;
color:white;
border:none;
padding:12px 24px;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>💬 Private Messages</h1>

<p>Your conversations with other believers</p>

</div>

<div class="searchBox">

<input
type="text"
id="searchInput"
placeholder="Search conversations...">

</div>

<div
id="chatList"
class="chatList">

<div class="empty">

Loading conversations...

</div>

</div>

<button
class="newChat"
onclick="location.href='findmembers.html'">

+

</button>

<div class="back">

<a href="community.html">

<button>

⬅ Back to Community

</button>

</a>

</div>

</div>

<script type="module">

import {
auth,
db,
collection,
query,
orderBy,
onSnapshot,
doc,
getDoc,
onAuthStateChanged
} from "./firebase.js";

const chatList = document.getElementById("chatList");
const searchInput = document.getElementById("searchInput");

let currentUser = null;
let conversations = [];

onAuthStateChanged(auth, (user)=>{

if(!user){
location.href="login.html";
return;
}

currentUser = user;
loadChats();

});

async function loadChats(){

const q = query(
collection(db,"messages"),
orderBy("timestamp","desc")
);

onSnapshot(q, async(snapshot)=>{

conversations = [];
const seen = new Set();
for(const messageDoc of snapshot.docs){

const msg = messageDoc.data();

let otherUid = null;

if(msg.senderId === currentUser.uid){

otherUid = msg.receiverId;

}else if(msg.receiverId === currentUser.uid){

otherUid = msg.senderId;

}else{

continue;

}

if(seen.has(otherUid)){

continue;

}

seen.add(otherUid);

try{

const userSnap = await getDoc(
doc(db,"users",otherUid)
);

if(!userSnap.exists()){

continue;

}

const other = userSnap.data();

conversations.push({

uid: otherUid,
name: other.fullName || "Unknown User",
photo: other.profilePicture || "images/profile.png",
lastMessage: msg.message || "",
timestamp: msg.timestamp

});

}catch(error){

console.log(error);

}

}
renderChats(conversations);

});

}

function renderChats(list){

chatList.innerHTML = "";

if(list.length === 0){

chatList.innerHTML = `

<div class="empty">
No conversations yet.
</div>

`;

return;

}

list.forEach(chat=>{

chatList.innerHTML += `

<div class="chat-card"
onclick="location.href='chat.html?uid=${chat.uid}'">

<img
class="avatar"
src="${chat.photo}">

<div class="chat-info">

<h3>${chat.name}</h3>

<p>${chat.lastMessage}</p>

</div>

</div>

`;

});

}

searchInput.addEventListener("input",()=>{

const keyword = searchInput.value.toLowerCase();

const filtered = conversations.filter(chat=>

chat.name.toLowerCase().includes(keyword)

);

renderChats(filtered);

});

</script>

</body>

</html>
