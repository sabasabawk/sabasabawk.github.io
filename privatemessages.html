<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Private Messages | SABASABA Gospel Ministry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.header{
background:#0066cc;
color:white;
padding:22px;
border-radius:18px;
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:30px;
margin-bottom:8px;
}

.header p{
opacity:.95;
}

.searchBox{
margin-bottom:20px;
}

.searchBox input{
width:100%;
padding:14px;
font-size:16px;
border-radius:12px;
border:1px solid #ccc;
outline:none;
}

.searchBox input:focus{

border-color:#0066cc;

}

.chatList{

display:flex;
flex-direction:column;
gap:15px;

}

.chatCard{

display:flex;
align-items:center;
background:white;
padding:15px;
border-radius:15px;
cursor:pointer;
box-shadow:0 3px 10px rgba(0,0,0,.08);
transition:.25s;

}

.chatCard:hover{

transform:translateY(-2px);

}

.avatar{

width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
margin-right:15px;
background:#ddd;

}

.info{

flex:1;

}

.info h3{

color:#0066cc;
font-size:18px;
margin-bottom:5px;

}

.info p{

color:#666;
font-size:15px;

}

.time{

font-size:12px;
color:gray;

}

.empty{

background:white;
padding:40px;
text-align:center;
border-radius:15px;
color:#777;

}

.newChat{

position:fixed;
right:25px;
bottom:25px;
width:65px;
height:65px;
border:none;
border-radius:50%;
background:#0066cc;
color:white;
font-size:34px;
cursor:pointer;

}

.back{

text-align:center;
margin-top:30px;

}

.back button{

background:#0066cc;
color:white;
padding:12px 24px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>💬 Private Messages</h1>

<p>Your conversations with other believers</p>

</div>

<div class="searchBox">

<input
id="searchInput"
type="text"
placeholder="Search conversations...">

</div>

<div
id="chatList"
class="chatList">

<div class="empty">

Loading conversations...

</div>

</div>

<button
class="newChat"
onclick="location.href='findmembers.html'">

+

</button>

<div class="back">

<a href="community.html">

<button>

⬅ Back to Community

</button>

</a>

</div>

</div>

<script type="module">
import {
    auth,
    db,
    collection,
    query,
    where,
    onSnapshot,
    doc,
    getDoc,
    onAuthStateChanged
} from "./firebase.js";

// Error tracking for debugging
window.onerror = function(message) {
    alert("Error: " + message);
};

console.log("Private Messages loaded");

const chatList = document.getElementById("chatList");
const searchInput = document.getElementById("searchInput");

let currentUser = null;
let allChats = [];

// 1. Check if user is authenticated
onAuthStateChanged(auth, (user) => {
    if (!user) {
        console.log("No user found, redirecting to login...");
        location.href = "login.html";
        return;
    }

    currentUser = user;
    console.log("Logged in user:", currentUser.uid);
    loadChats();
});

// 2. Load and listen to messages involving the current user
function loadChats() {
    console.log("Loading chats...");
    
    // Fetch all messages from the global collection
    const messagesRef = collection(db, "messages");
    
    // We listen to the messages collection. For a highly scaleable app, you'd use optimized queries, 
    // but reading the message stream and filtering for sender/receiver gets you up and running immediately.
    onSnapshot(messagesRef, async (snapshot) => {
        const conversationsMap = new Map();

        // Process all messages to find unique conversations involving the current user
        snapshot.docs.forEach(docSnap => {
            const msg = docSnap.data();
            
            // Only care about messages sent BY or TO the current user
            if (msg.senderId === currentUser.uid || msg.receiverId === currentUser.uid) {
                const otherUid = msg.senderId === currentUser.uid ? msg.receiverId : msg.senderId;
                
                // Track the latest message for this specific contact
                const existingMsg = conversationsMap.get(otherUid);
                if (!existingMsg || (msg.timestamp?.seconds > existingMsg.timestamp?.seconds)) {
                    conversationsMap.set(otherUid, msg);
                }
            }
        });

        // Clear and rebuild our list array
        allChats = [];

        // 3. Fetch user details (Name & Photo) for each unique conversation partner
        for (const [otherUid, msg] of conversationsMap.entries()) {
            try {
                const userSnap = await getDoc(doc(db, "users", otherUid));
                let name = "Unknown User";
                let photo = "images/profile.png";

                if (userSnap.exists()) {
                    const userData = userSnap.data();
                    name = userData.fullName || userData.name || "Unknown User";
                    photo = userData.profilePicture || userData.photoURL || "images/profile.png";
                }

                allChats.push({
                    uid: otherUid,
                    name: name,
                    photo: photo,
                    lastMessage: msg.message || "",
                    timestamp: msg.timestamp || null
                });
            } catch (error) {
                console.error("Error fetching user data for " + otherUid, error);
            }
        }

        // Sort conversations by newest message first
        allChats.sort((a, b) => {
            const ta = a.timestamp?.seconds || 0;
            const tb = b.timestamp?.seconds || 0;
            return tb - ta;
        });

        renderChats();
    });
}

// 4. Render the active chats into HTML
function renderChats() {
    chatList.innerHTML = "";

    if (allChats.length === 0) {
        chatList.innerHTML = `
            <div class="empty">
                No conversations yet. Click the '+' button to start one!
            </div>
        `;
        return;
    }

    allChats.forEach(chat => {
        let time = "";
        if (chat.timestamp?.toDate) {
            const d = chat.timestamp.toDate();
            time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }

        chatList.innerHTML += `
            <div class="chatCard" onclick="location.href='chat.html?uid=${chat.uid}'">
                <img class="avatar" src="${chat.photo}" onerror="this.src='images/profile.png'">
                <div class="info">
                    <h3>${chat.name}</h3>
                    <p>${chat.lastMessage}</p>
                </div>
                <div class="time">${time}</div>
            </div>
        `;
    });
}

// 5. Handle Live Searching
searchInput.addEventListener("input", () => {
    const keyword = searchInput.value.toLowerCase();
    
    // Filter out chats that match search
    const filtered = allChats.filter(chat => 
        chat.name.toLowerCase().includes(keyword)
    );

    // Temp swap array just to render the search results cleanly
    const originalChats = allChats;
    allChats = filtered;
    renderChats();
    allChats = originalChats; 
});
</script>


</body>
</html>
