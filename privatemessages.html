<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Private Messages | SABASABA Gospel Ministry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.header{
background:#0066cc;
color:white;
padding:22px;
border-radius:18px;
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:30px;
margin-bottom:8px;
}

.header p{
opacity:.95;
}

.searchBox{
margin-bottom:20px;
}

.searchBox input{
width:100%;
padding:14px;
font-size:16px;
border-radius:12px;
border:1px solid #ccc;
outline:none;
}

.searchBox input:focus{

border-color:#0066cc;

}

.chatList{

display:flex;
flex-direction:column;
gap:15px;

}

.chatCard{

display:flex;
align-items:center;
background:white;
padding:15px;
border-radius:15px;
cursor:pointer;
box-shadow:0 3px 10px rgba(0,0,0,.08);
transition:.25s;

}

.chatCard:hover{

transform:translateY(-2px);

}

.avatar{

width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
margin-right:15px;
background:#ddd;

}

.info{

flex:1;

}

.info h3{

color:#0066cc;
font-size:18px;
margin-bottom:5px;

}

.info p{

color:#666;
font-size:15px;

}

.time{

font-size:12px;
color:gray;

}

.empty{

background:white;
padding:40px;
text-align:center;
border-radius:15px;
color:#777;

}

.newChat{

position:fixed;
right:25px;
bottom:25px;
width:65px;
height:65px;
border:none;
border-radius:50%;
background:#0066cc;
color:white;
font-size:34px;
cursor:pointer;

}

.back{

text-align:center;
margin-top:30px;

}

.back button{

background:#0066cc;
color:white;
padding:12px 24px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>💬 Private Messages</h1>

<p>Your conversations with other believers</p>

</div>

<div class="searchBox">

<input
id="searchInput"
type="text"
placeholder="Search conversations...">

</div>

<div
id="chatList"
class="chatList">

<div class="empty">

Loading conversations...

</div>

</div>

<button
class="newChat"
onclick="location.href='findmembers.html'">

+

</button>

<div class="back">

<a href="community.html">

<button>

⬅ Back to Community

</button>

</a>

</div>

</div>

<script type="module">
import{
auth,
db,
collection,
query,
where,
onSnapshot,
doc,
getDoc,
onAuthStateChanged
}from "./firebase.js";
window.onerror = function(message){
    alert(message);
};

console.log("Private Messages loaded");
const chatList=document.getElementById("chatList");
const searchInput=document.getElementById("searchInput");

let currentUser=null;
let allChats=[];

onAuthStateChanged(auth,(user)=>{

if(!user){

location.href="login.html";
return;

}

currentUser=user;

loadChats();
onAuthStateChanged(auth, (user)=>{

console.log("Logged in user:", user);

if(!user){
    location.href="login.html";
    return;
}

currentUser = user;
loadChats();

});
function loadChats(){

const q=query(

collection(db,"messages"),

where("senderId","==",currentUser.uid)

);

const q2=query(

collection(db,"messages"),

where("receiverId","==",currentUser.uid)

);

listen(q);
listen(q2);

}

function listen(q){

onSnapshot(q,async(snapshot)=>{

await buildConversationList(snapshot.docs);

});

}

async function buildConversationList(messageDocs){

allChats=[];

const usersLoaded=new Set();
for(const messageDoc of messageDocs){

const msg=messageDoc.data();

let otherUid=null;

if(msg.senderId===currentUser.uid){

otherUid=msg.receiverId;

}else{

otherUid=msg.senderId;

}

if(usersLoaded.has(otherUid)){

continue;

}

usersLoaded.add(otherUid);

try{

const userSnap=await getDoc(
doc(db,"users",otherUid)
);

if(!userSnap.exists()){

continue;

}

const other=userSnap.data();

allChats.push({

uid:otherUid,
name:other.fullName||"Unknown User",
photo:other.profilePicture||"images/profile.png",
lastMessage:msg.message||"",
timestamp:msg.timestamp||null
async function loadChats(){

console.log("Loading chats...");

const q = query(
    collection(db,"messages"),
    orderBy("timestamp","desc")
);

onSnapshot(q, async(snapshot)=>{

console.log("Messages found:", snapshot.size);

...
});

}catch(error){

console.error(error);

}

}

renderChats();

}
function renderChats(){

chatList.innerHTML="";

if(allChats.length===0){

chatList.innerHTML=`
<div class="empty">
No conversations yet.
</div>
`;

return;

}

allChats.sort((a,b)=>{

const ta=a.timestamp?.seconds||0;
const tb=b.timestamp?.seconds||0;

return tb-ta;

});

allChats.forEach(chat=>{

let time="";

if(chat.timestamp?.toDate){

const d=chat.timestamp.toDate();

time=d.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});

}

chatList.innerHTML+=`

<div class="chatCard"
onclick="location.href='chat.html?uid=${chat.uid}'">

<img
class="avatar"
src="${chat.photo}"
onerror="this.src='images/profile.png'">

<div class="info">

<h3>${chat.name}</h3>

<p>${chat.lastMessage}</p>

</div>

<div class="time">

${time}

</div>

</div>

`;

});

}

searchInput.addEventListener("input",()=>{

const keyword=
searchInput.value.toLowerCase();

const filtered=allChats.filter(chat=>

chat.name.toLowerCase().includes(keyword)

);

const backup=allChats;

allChats=filtered;

renderChats();

allChats=backup;

});

</script>

</body>
</html>
