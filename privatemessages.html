<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Private Messages | SABASABA Gospel Ministry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.header{
background:#0066cc;
color:white;
padding:22px;
border-radius:18px;
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:30px;
margin-bottom:8px;
}

.header p{
opacity:.95;
}

.searchBox{
margin-bottom:20px;
}

.searchBox input{
width:100%;
padding:14px;
font-size:16px;
border-radius:12px;
border:1px solid #ccc;
outline:none;
}

.searchBox input:focus{

border-color:#0066cc;

}

.chatList{

display:flex;
flex-direction:column;
gap:15px;

}

.chatCard{

display:flex;
align-items:center;
background:white;
padding:15px;
border-radius:15px;
cursor:pointer;
box-shadow:0 3px 10px rgba(0,0,0,.08);
transition:.25s;

}

.chatCard:hover{

transform:translateY(-2px);

}

.avatar{

width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
margin-right:15px;
background:#ddd;

}

.info{

flex:1;

}

.info h3{

color:#0066cc;
font-size:18px;
margin-bottom:5px;

}

.info p{

color:#666;
font-size:15px;

}

.time{

font-size:12px;
color:gray;

}

.empty{

background:white;
padding:40px;
text-align:center;
border-radius:15px;
color:#777;

}

.newChat{

position:fixed;
right:25px;
bottom:25px;
width:65px;
height:65px;
border:none;
border-radius:50%;
background:#0066cc;
color:white;
font-size:34px;
cursor:pointer;

}

.back{

text-align:center;
margin-top:30px;

}

.back button{

background:#0066cc;
color:white;
padding:12px 24px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>💬 Private Messages</h1>

<p>Your conversations with other believers</p>

</div>

<div class="searchBox">

<input
id="searchInput"
type="text"
placeholder="Search conversations...">

</div>

<div
id="chatList"
class="chatList">

<div class="empty">

Loading conversations...

</div>

</div>

<button
class="newChat"
onclick="location.href='findmembers.html'">

+

</button>

<div class="back">

<a href="community.html">

<button>

⬅ Back to Community

</button>

</a>

</div>

</div>

<script type="module">
import {
    auth,
    db,
    collection,
    query,
    where,
    onSnapshot,
    doc,
    getDoc,
    onAuthStateChanged
} from "./firebase.js";

// Active alert debugger to catch structural problems immediately
window.onerror = function(message) {
    alert("Inbox Sync Debugger: " + message);
};

const chatList = document.getElementById("chatList");
const searchInput = document.getElementById("searchInput");

let currentUser = null;
let allChats = [];

onAuthStateChanged(auth, (user) => {
    if (!user) {
        location.href = "login.html";
        return;
    }
    currentUser = user;
    loadConversationsAlternative();
});

function loadConversationsAlternative() {
    console.log("Checking conversations for user:", currentUser.uid);

    // Fallback Method: Listen directly to the global conversations collection
    const conversationsRef = collection(db, "conversations");

    onSnapshot(conversationsRef, async (snapshot) => {
        const updatedChats = [];
        console.log("Total total system conversations detected: ", snapshot.size);

        for (const docSnap of snapshot.docs) {
            const convoData = docSnap.data();
            const participants = convoData.participants || [];

            // Direct array check without relying on a rigid Firestore query structure
            if (participants.includes(currentUser.uid)) {
                const otherUid = participants.find(id => id !== currentUser.uid);
                if (!otherUid) continue;

                try {
                    const userSnap = await getDoc(doc(db, "users", otherUid));
                    let name = "Unknown User";
                    let photo = "images/profile.png";

                    if (userSnap.exists()) {
                        const userData = userSnap.data();
                        name = userData.fullName || userData.name || "Unknown User";
                        photo = userData.profilePicture || userData.photoURL || "images/profile.png";
                    }

                    updatedChats.push({
                        uid: otherUid,
                        name: name,
                        photo: photo,
                        lastMessage: convoData.lastMessage || "No text yet",
                        timestamp: convoData.timestamp || null
                    });
                } catch (err) {
                    console.error("Failed fetching profile payload:", err);
                }
            }
        }

        // Sort descending by timestamp
        updatedChats.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
        allChats = updatedChats;
        renderChats();
    }, (error) => {
        // If Firestore blocks the query due to a missing index, this alert tells you exactly why!
        alert("Firestore read error: " + error.message);
    });
}

function renderChats() {
    chatList.innerHTML = "";
    const keyword = searchInput.value.trim().toLowerCase();
    
    const chatsToDisplay = allChats.filter(chat => {
        if (!keyword) return true;
        return chat.name.toLowerCase().includes(keyword);
    });

    if (chatsToDisplay.length === 0) {
        chatList.innerHTML = `
            <div class="empty">
                ${keyword ? 'No matching conversation paths.' : 'No conversations yet.'}
            </div>
        `;
        return;
    }

    chatsToDisplay.forEach(chat => {
        let time = "";
        if (chat.timestamp?.toDate) {
            const d = chat.timestamp.toDate();
            time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }

        chatList.innerHTML += `
            <div class="chatCard" onclick="location.href='chat.html?uid=${chat.uid}'">
                <img class="avatar" src="${chat.photo}" onerror="this.src='images/profile.png'">
                <div class="info">
                    <h3>${chat.name}</h3>
                    <p>${chat.lastMessage}</p>
                </div>
                <div class="time">${time}</div>
            </div>
        `;
    });
}

searchInput.addEventListener("input", renderChats);
</script>


</body>
</html>
