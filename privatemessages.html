<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Private Messages</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.header{
background:#0066cc;
color:white;
padding:20px;
border-radius:18px;
text-align:center;
margin-bottom:20px;
}

.search{
margin-bottom:20px;
}

.search input{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
outline:none;
}

.chatList{
display:flex;
flex-direction:column;
gap:15px;
}

.chatCard{
display:flex;
align-items:center;
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
cursor:pointer;
transition:.25s;
}

.chatCard:hover{
transform:translateY(-2px);
}

.avatar{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
margin-right:15px;
}

.info{
flex:1;
}

.info h3{
color:#0066cc;
margin-bottom:5px;
}

.info p{
color:#666;
font-size:15px;
}

.time{
font-size:12px;
color:gray;
}

.empty{
background:white;
padding:40px;
border-radius:15px;
text-align:center;
color:#777;
}

.newChat{
position:fixed;
bottom:25px;
right:25px;
width:65px;
height:65px;
border:none;
border-radius:50%;
background:#0066cc;
color:white;
font-size:34px;
cursor:pointer;
}

.back{
margin-top:30px;
text-align:center;
}

.back button{
background:#0066cc;
color:white;
border:none;
padding:12px 24px;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>💬 Private Messages</h1>

<p>Your conversations</p>

</div>

<div class="search">

<input
id="searchInput"
placeholder="Search conversations...">

</div>

<div
id="chatList"
class="chatList">

<div class="empty">

Loading conversations...

</div>

</div>

<button
class="newChat"
onclick="location.href='findmembers.html'">

+

</button>

<div class="back">

<a href="community.html">

<button>

⬅ Back to Community

</button>

</a>

</div>

</div>

<script type="module">
import {
auth,
db,
collection,
query,
where,
orderBy,
onSnapshot,
doc,
getDoc,
onAuthStateChanged
} from "./firebase.js";

const chatList =
document.getElementById("chatList");

const searchInput =
document.getElementById("searchInput");

let allChats = [];

onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href="login.html";
return;

}

// NOTE: removed orderBy from the query to avoid requiring a composite index.
// We will sort conversations client-side by timestamp instead.
const q = query(
 collection(db, "conversations"),
 where("participants", "array-contains", user.uid)
);

onSnapshot(q, async(snapshot)=>{

allChats = [];

// map docs to plain objects and sort by timestamp (descending)
const docs = snapshot.docs.map(d => ({ id: d.id, ...(d.data()) }));

docs.sort((a, b) => {
  const aTs = a.timestamp && typeof a.timestamp.toMillis === 'function' ? a.timestamp.toMillis() : (a.timestamp && typeof a.timestamp.toDate === 'function' ? a.timestamp.toDate().getTime() : 0);
  const bTs = b.timestamp && typeof b.timestamp.toMillis === 'function' ? b.timestamp.toMillis() : (b.timestamp && typeof b.timestamp.toDate === 'function' ? b.timestamp.toDate().getTime() : 0);
  return bTs - aTs;
});

for(const conversation of docs){

const otherUid =
conversation.participants?.find(
uid => uid !== user.uid
);

if(!otherUid) continue;

const userSnap = await getDoc(
 doc(db,"users",otherUid)
);

if(!userSnap.exists()) continue;

const other = userSnap.data();

allChats.push({

uid:otherUid,
name:other.fullName || "Unknown User",
photo:
other.profilePicture ||
"images/profile.png",

lastMessage:
conversation.lastMessage || "",

timestamp:
conversation.timestamp || null

});

}

renderChats(allChats);

});

});
function renderChats(chats){

chatList.innerHTML = "";

if(chats.length === 0){

chatList.innerHTML = `
<div class="empty">
No conversations yet.
</div>
`;

return;

}

chats.forEach(chat=>{

let timeText = "";

if(chat.timestamp && chat.timestamp.toDate){

const d = chat.timestamp.toDate();

timeText =
d.toLocaleDateString() + " " +
d.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});

}

chatList.innerHTML += `

<div class="chatCard"
onclick="location.href='chat.html?uid=${chat.uid}'">

<img
class="avatar"
src="${chat.photo}"
onerror="this.src='images/profile.png'">

<div class="info">

<h3>${chat.name}</h3>

<p>${chat.lastMessage}</p>

</div>

<div class="time">

${timeText}

</div>

</div>

`;

});

}

searchInput.addEventListener("input",()=>{

const keyword =
searchInput.value.trim().toLowerCase();

const filtered = allChats.filter(chat=>

chat.name.toLowerCase().includes(keyword)

);

renderChats(filtered);

});

</script>

</body>
</html>
