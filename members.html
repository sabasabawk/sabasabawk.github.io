<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Members | Faith Connect</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f0f2f5; color: #050505; font-family: Arial, sans-serif; padding-bottom: 70px; }

.header { background: #fff; padding: 12px 16px; border-bottom: 1px solid #e4e6eb; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 18px; color: #1877f2; font-weight: bold; }
.back-btn { text-decoration: none; color: #1877f2; font-weight: bold; font-size: 14px; }

.container { max-width: 600px; margin: 12px auto; padding: 0 8px; }

.search-box { background: #fff; padding: 10px 14px; border-radius: 20px; border: 1px solid #e4e6eb; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
.search-input { width: 100%; border: none; outline: none; font-size: 14px; background: transparent; }

.members-list { display: flex; flex-direction: column; gap: 8px; }

.member-card { 
  background: #fff; 
  border-radius: 8px; 
  border: 1px solid #e4e6eb; 
  padding: 10px 12px; 
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
  box-shadow: 0 1px 2px rgba(0,0,0,0.02); 
}

.member-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
.member-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #e4e6eb; flex-shrink: 0; }
.member-details { overflow: hidden; }
.member-name { font-weight: bold; font-size: 14px; color: #050505; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.member-role { font-size: 11px; color: #65676b; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.member-actions { display: flex; gap: 6px; flex-shrink: 0; }
.btn-msg { background: #1877f2; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; text-decoration: none; }
.btn-profile { background: #e4e6eb; color: #050505; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; text-decoration: none; }

.loading, .empty { text-align: center; padding: 30px; color: #65676b; font-size: 14px; background: #fff; border-radius: 8px; border: 1px solid #e4e6eb; }
</style>
</head>
<body>

  <header class="header">
    <a href="feed.html" class="back-btn">← Back</a>
    <h1>Find Members</h1>
    <div style="width: 40px;"></div>
  </header>

  <main class="container">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Search members by name...">
    </div>

    <div class="members-list" id="membersList">
      <div class="loading">Loading members...</div>
    </div>
  </main>

  <script type="module">
    import { db, auth, collection, getDocs, query, orderBy, onAuthStateChanged } from "./firebase.js";

    const membersListContainer = document.getElementById("membersList");
    const searchInput = document.getElementById("searchInput");
    let allMembers = [];
    let currentUserId = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.replace("login.html");
        return;
      }
      currentUserId = user.uid;
      loadMembers();
    });

    async function loadMembers() {
      try {
        const q = query(collection(db, "users"), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);

        allMembers = [];
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          if (docSnap.id !== currentUserId) {
            allMembers.push({ id: docSnap.id, ...data });
          }
        });

        renderMembers(allMembers);
      } catch (err) {
        console.error("Error loading members:", err);
        membersListContainer.innerHTML = `<div class="empty" style="color:red;">Failed to load members.</div>`;
      }
    }

    function renderMembers(members) {
      if (members.length === 0) {
        membersListContainer.innerHTML = `<div class="empty">No other members found.</div>`;
        return;
      }

      let html = "";
      members.forEach((m) => {
        const name = m.name || m.fullName || "Faith Connect Member";
        const avatar = m.picture || m.profilePicture || "https://via.placeholder.com/50";
        const role = m.bio || m.role || "Believer in Christ";

        html += `
          <div class="member-card">
            <div class="member-info">
              <img src="${avatar}" class="member-avatar" alt="Avatar">
              <div class="member-details">
                <div class="member-name">${escapeHTML(name)}</div>
                <div class="member-role">${escapeHTML(role)}</div>
              </div>
            </div>
            <div class="member-actions">
              <a href="chat-room.html?userId=${m.id}" class="btn-msg">Message</a>
              <a href="profile-view.html?userId=${m.id}" class="btn-profile">Profile</a>
            </div>
          </div>
        `;
      });

      membersListContainer.innerHTML = html;
    }

    searchInput.addEventListener("input", (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allMembers.filter(m => {
        const name = (m.name || m.fullName || "").toLowerCase();
        return name.includes(term);
      });
      renderMembers(filtered);
    });

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
