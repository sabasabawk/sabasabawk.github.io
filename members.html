<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Find Members | SABASABA Gospel Ministry</title>

<style>

/* =====================================================
   FACEBOOK-STYLE EDGE-TO-EDGE CLEAN DESIGN
===================================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f0f2f5;
color:#050505;
min-height:100vh;
}

.container{
max-width:680px;
margin:auto;
padding:0 0 80px 0;
}

.header{
background:#ffffff;
color:#050505;
padding:16px 14px;
border-bottom:1px solid #e4e6eb;
text-align:left;
border-radius:0;
margin-bottom:0;
}

.header h1{
font-size:20px;
color:#050505;
margin-bottom:2px;
}

.header p{
font-size:13px;
color:#65676b;
line-height:1.4;
}

.searchBox{
background:#ffffff;
padding:10px 12px;
border-bottom:1px solid #e4e6eb;
margin-bottom:0;
}

.searchBox input{
width:100%;
padding:10px 16px;
border-radius:20px;
border:none;
font-size:15px;
outline:none;
background:#f0f2f5;
color:#050505;
}

.searchBox input:focus{
background:#e4e6eb;
}

/* =====================================================
   MEMBER ROWS (FLAT EDGE-TO-EDGE LIST)
===================================================== */

.memberGrid{
display:flex;
flex-direction:column;
background:#ffffff;
gap:0;
}

.memberCard{
background:#ffffff;
border-radius:0;
padding:12px 14px;
text-align:left;
box-shadow:none;
border-bottom:1px solid #e4e6eb;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
transition:background .2s;
}

.memberCard:hover{
background:#f2f4f7;
transform:none;
}

.leftInfo{
display:flex;
align-items:center;
min-width:0;
flex:1;
gap:12px;
}

.memberPhoto{
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
background:#e5e9ed;
flex-shrink:0;
margin:0;
border:none;
}

.textDetails{
min-width:0;
flex:1;
}

.memberCard h2{
color:#050505;
margin-bottom:2px;
font-size:15px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.memberInfo{
color:#65676b;
margin-bottom:0;
font-size:13px;
line-height:1.3;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.buttonRow{
display:flex;
align-items:center;
gap:6px;
flex-shrink:0;
}

.messageBtn,
.profileBtn{
border:none;
padding:8px 12px;
border-radius:6px;
font-size:13px;
font-weight:bold;
cursor:pointer;
display:flex;
align-items:center;
gap:4px;
white-space:nowrap;
transition:background .2s;
}

.messageBtn{
background:#e4e6eb;
color:#050505;
}

.messageBtn:hover{
background:#d8dadf;
}

.profileBtn{
background:#1877f2;
color:#ffffff;
}

.profileBtn:hover{
background:#166fe5;
}

.empty{
background:#ffffff;
padding:30px 14px;
text-align:center;
border-radius:0;
border-bottom:1px solid #e4e6eb;
color:#65676b;
font-size:14px;
}

.back{
margin-top:20px;
padding:0 14px;
text-align:center;
}

.back a{
text-decoration:none;
}

.back button{
background:#ffffff;
color:#050505;
border:1px solid #ccd0d5;
padding:10px 20px;
border-radius:8px;
font-size:14px;
font-weight:bold;
cursor:pointer;
transition:background .2s;
}

.back button:hover{
background:#f0f2f5;
}

@media(max-width:600px){

.container{
padding:0;
}

.header{
padding:12px;
}

.header h1{
font-size:18px;
}

.memberCard{
padding:10px 12px;
}

.memberPhoto{
width:44px;
height:44px;
}

.memberCard h2{
font-size:14px;
}

.memberInfo{
font-size:12px;
}

.messageBtn,
.profileBtn{
padding:6px 10px;
font-size:12px;
}

}

@media(max-width:400px){

.buttonRow{
flex-direction:column;
align-items:stretch;
gap:4px;
}

.messageBtn,
.profileBtn{
justify-content:center;
padding:6px 8px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>👥 Find Members</h1>

<p>
Connect with Christians around the world. View profiles and start private conversations.
</p>

</div>

<div class="searchBox">

<input
id="searchInput"
type="text"
placeholder="Search members by name or country...">

</div>

<div
id="memberGrid"
class="memberGrid">

<div class="empty">

Loading members...

</div>

</div>

<div class="back">

<a href="community.html">

<button type="button">

⬅ Back to Community

</button>

</a>

</div>

</div>
<script type="module">

import{
auth,
db,
collection,
getDocs,
onAuthStateChanged
}from "./firebase.js";

const memberGrid=document.getElementById("memberGrid");
const searchInput=document.getElementById("searchInput");

let allMembers=[];

onAuthStateChanged(auth,async(user)=>{

if(!user){

location.href="login.html";
return;

}

loadMembers(user.uid);

});

async function loadMembers(currentUid){

memberGrid.innerHTML=`
<div class="empty">
Loading members...
</div>
`;

try{

const snapshot=await getDocs(collection(db,"users"));

allMembers=[];

snapshot.forEach(doc=>{

const data=doc.data();

if(doc.id===currentUid)return;

allMembers.push({

uid:doc.id,

name:data.fullName||data.displayName||data.name||"Community Member",

country:data.country||data.location||"",

photo:data.profilePicture||data.photoURL||"images/profile.png"

});

});

renderMembers(allMembers);

}catch(error){

memberGrid.innerHTML=`
<div class="empty">
Failed to load members. Please try again.
</div>
`;

console.error(error);

}

}

function renderMembers(list){

memberGrid.innerHTML="";

if(list.length===0){

memberGrid.innerHTML=`
<div class="empty">
No members found.
</div>
`;

return;

}

list.forEach(member=>{

const card=document.createElement("div");
card.className="memberCard";

const safeName=escapeHTML(member.name);
const safeCountry=escapeHTML(member.country);

card.innerHTML=`

<div class="leftInfo">

<img
class="memberPhoto"
src="${member.photo}"
onerror="this.src='images/profile.png'"
alt="${safeName}">

<div class="textDetails">

<h2>${safeName}</h2>

<div class="memberInfo">

${safeCountry || "Member"}

</div>

</div>

</div>

<div class="buttonRow">

<button
class="messageBtn"
type="button"
onclick="location.href='chat.html?uid=${member.uid}'">

💬 Message

</button>

<button
class="profileBtn"
type="button"
onclick="location.href='profileview.html?uid=${member.uid}'">

👤 View Profile

</button>

</div>

`;

memberGrid.appendChild(card);

});

}

function escapeHTML(value){
return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

searchInput.addEventListener("input",()=>{

const keyword=searchInput.value.toLowerCase().trim();

const filtered=allMembers.filter(member=>

member.name.toLowerCase().includes(keyword)

||

member.country.toLowerCase().includes(keyword)

);

renderMembers(filtered);

});

</script>
</body>

</html>
