<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Find Members | SABASABA Gospel Ministry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f0f2f5;
color:#050505;
}

.container{
max-width:680px;
margin:auto;
padding:0 0 30px;
}

/* ---------- TOP BAR ---------- */

.topBar{
position:sticky;
top:0;
z-index:100;
display:flex;
align-items:center;
gap:10px;
padding:10px 12px;
background:#ffffff;
border-bottom:1px solid #e4e6eb;
}

.topBack{
width:38px;
height:38px;
flex-shrink:0;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#f0f2f5;
color:#050505;
text-decoration:none;
font-size:20px;
font-weight:bold;
}

.topTitle{
min-width:0;
flex:1;
}

.topTitle h1{
font-size:18px;
color:#0866c6;
}

.topTitle p{
margin-top:2px;
font-size:12px;
color:#65676b;
}

/* ---------- SEARCH ---------- */

.searchBox{
padding:10px 12px;
background:#ffffff;
border-bottom:1px solid #e4e6eb;
}

.searchBox input{
width:100%;
padding:11px 14px;
border-radius:22px;
border:1px solid #ccd0d5;
background:#f0f2f5;
font-size:15px;
outline:none;
}

.searchBox input:focus{
border-color:#1877f2;
background:#ffffff;
}

.countText{
padding:10px 14px 6px;
color:#65676b;
font-size:12px;
font-weight:bold;
}

/* ---------- MEMBER LIST ---------- */

.memberGrid{
background:#ffffff;
border-top:1px solid #e4e6eb;
border-bottom:1px solid #e4e6eb;
}

.memberCard{
display:flex;
align-items:center;
gap:12px;
padding:12px;
border-bottom:1px solid #f0f2f5;
}

.memberCard:last-child{
border-bottom:0;
}

.memberPhoto{
width:60px;
height:60px;
flex-shrink:0;
border-radius:50%;
object-fit:cover;
background:#e7f3ff;
cursor:pointer;
}

.memberDetails{
min-width:0;
flex:1;
}

.memberName{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
color:#050505;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.memberInfo{
margin-top:2px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
color:#65676b;
font-size:13px;
min-height:16px;
}

.buttonRow{
display:flex;
gap:8px;
margin-top:8px;
}

.messageBtn,
.profileBtn{
flex:1;
min-height:34px;
padding:7px 8px;
border:none;
border-radius:8px;
font-size:13px;
font-weight:bold;
cursor:pointer;
white-space:nowrap;
}

.messageBtn{
background:#1877f2;
color:#ffffff;
}

.messageBtn:hover{
background:#166fe5;
}

.profileBtn{
background:#e4e6eb;
color:#050505;
}

.profileBtn:hover{
background:#d8dadf;
}

.empty{
padding:36px 16px;
text-align:center;
color:#65676b;
font-size:15px;
}

.back{
margin-top:20px;
text-align:center;
padding:0 12px;
}

.back a{
display:block;
text-decoration:none;
}

.back button{
width:100%;
background:#ffffff;
color:#050505;
border:1px solid #ccd0d5;
padding:12px;
border-radius:8px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

@media(max-width:360px){

.memberPhoto{
width:52px;
height:52px;
}

.messageBtn,
.profileBtn{
font-size:12px;
padding:7px 4px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="topBar">

<a href="feed.html" class="topBack" aria-label="Back">←</a>

<div class="topTitle">
<h1>👥 Find Members</h1>
<p>Connect with Christians around the world</p>
</div>

</div>

<div class="searchBox">

<input
id="searchInput"
type="text"
placeholder="Search members by name or country...">

</div>

<div id="countText" class="countText"></div>

<div
id="memberGrid"
class="memberGrid">

<div class="empty">
Loading members...
</div>

</div>

<div class="back">

<a href="community.html">

<button>
⬅ Back to Community
</button>

</a>

</div>

</div>

<script type="module">

import{
auth,
db,
collection,
getDocs,
onAuthStateChanged
}from "./firebase.js";

/* Blue head shown when someone has no picture or the picture is broken */

const DEFAULT_AVATAR =
"data:image/svg+xml;charset=utf-8," +
encodeURIComponent(
'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
'<defs><clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath></defs>' +
'<circle cx="100" cy="100" r="100" fill="#e7f3ff"/>' +
'<g clip-path="url(#c)" fill="#1877f2">' +
'<circle cx="100" cy="76" r="38"/>' +
'<path d="M24 200c0-44 33-76 76-76s76 32 76 76z"/></g></svg>'
);

function escapeHTML(value){

return String(value || "").replace(
/[&<>"']/g,
function(character){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[character];

}
);

}

const memberGrid = document.getElementById("memberGrid");
const searchInput = document.getElementById("searchInput");
const countText = document.getElementById("countText");

let allMembers = [];

onAuthStateChanged(auth, async (user) => {

if(!user){

location.href = "login.html";
return;

}

loadMembers(user.uid);

});

async function loadMembers(currentUid){

memberGrid.innerHTML = `
<div class="empty">
Loading members...
</div>
`;

try{

const snapshot = await getDocs(collection(db, "users"));

allMembers = [];

snapshot.forEach(userDoc => {

const data = userDoc.data();

if(userDoc.id === currentUid) return;

allMembers.push({

uid: userDoc.id,

name:
data.fullName ||
data.name ||
"Unknown Member",

country: data.country || "",

photo:
data.profilePicture ||
data.picture ||
data.photoURL ||
""

});

});

allMembers.sort(function(first, second){

return first.name.localeCompare(second.name);

});

renderMembers(allMembers);

}catch(error){

memberGrid.innerHTML = `
<div class="empty">
Failed to load members.
</div>
`;

console.error(error);

}

}

function renderMembers(list){

countText.textContent =
list.length === 1
? "1 member"
: list.length + " members";

if(list.length === 0){

memberGrid.innerHTML = `
<div class="empty">
No members found.
</div>
`;

return;

}

memberGrid.innerHTML = list.map(member => `

<div class="memberCard">

<img
class="memberPhoto"
loading="lazy"
alt="${escapeHTML(member.name)}"
data-uid="${escapeHTML(member.uid)}"
src="${escapeHTML(member.photo || DEFAULT_AVATAR)}">

<div class="memberDetails">

<div
class="memberName"
data-uid="${escapeHTML(member.uid)}">
${escapeHTML(member.name)}
</div>

<div class="memberInfo">
${escapeHTML(member.country)}
</div>

<div class="buttonRow">

<button
class="messageBtn"
type="button"
data-uid="${escapeHTML(member.uid)}">
💬 Message
</button>

<button
class="profileBtn"
type="button"
data-uid="${escapeHTML(member.uid)}">
👤 Profile
</button>

</div>

</div>

</div>

`).join("");

/* any broken picture becomes the blue head */

memberGrid.querySelectorAll("img.memberPhoto").forEach(image => {

image.addEventListener(
"error",
function(){

if(image.src !== DEFAULT_AVATAR){

image.src = DEFAULT_AVATAR;

}

},
{ once:true }
);

});

}

memberGrid.addEventListener("click", function(event){

const messageButton =
event.target.closest(".messageBtn");

if(messageButton){

location.href =
"chat.html?uid=" +
encodeURIComponent(messageButton.dataset.uid);

return;

}

const profileTarget =
event.target.closest(
".profileBtn, .memberPhoto, .memberName"
);

if(profileTarget && profileTarget.dataset.uid){

location.href =
"profileview.html?uid=" +
encodeURIComponent(profileTarget.dataset.uid);

}

});

searchInput.addEventListener("input", () => {

const keyword = searchInput.value.toLowerCase();

const filtered = allMembers.filter(member =>

member.name.toLowerCase().includes(keyword)

||

member.country.toLowerCase().includes(keyword)

);

renderMembers(filtered);

});

</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js')
      .catch((error) => {
        console.error('Service Worker registration failed:', error);
      });
  });
}
</script>

</body>

</html>
