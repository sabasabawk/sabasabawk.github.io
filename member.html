<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Member Profile</title>

<style>

body{
font-family:Arial,sans-serif;
background:#eef3f8;
margin:0;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.profile{
text-align:center;
}

.profile img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:3px solid #0066cc;
}

.profile h1{
color:#0066cc;
margin:15px 0 5px;
}

.section{
margin-top:25px;
padding-top:15px;
border-top:1px solid #ddd;
}

.post{
background:#f4f8fc;
padding:15px;
margin-top:10px;
border-radius:10px;
}

button{
background:#0066cc;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
margin-top:20px;
margin-right:10px;
}

button:hover{
background:#004d99;
}

</style>

</head>

<body>

<div class="container">

<div class="profile">

<img id="memberPicture" src="images/profile.png">

<h1 id="memberName">Member</h1>

</div>

<div class="section">

<h2>📝 Posts</h2>

<div id="memberPosts"></div>

</div>

<a href="search.html">
<button>⬅ Back</button>
</a>

</div>

<script>

let selected =
localStorage.getItem("selectedMember");

let posts =
JSON.parse(localStorage.getItem("communityPosts")) || [];

document.getElementById("memberName").innerText =
selected;

let postArea =
document.getElementById("memberPosts");

posts.forEach(function(post){

if(post.name===selected){

document.getElementById("memberPicture").src =
post.picture;

postArea.innerHTML += `
<div class="post">

<b>${post.category}</b>

<br><br>

${post.post}

</div>
`;

}

});

</script>

</body>
</html>
