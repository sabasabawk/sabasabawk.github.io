<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search Members</title>

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
margin:0;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.header{
background:linear-gradient(160deg,#0a3d8f 0%,#2196f3 100%);
color:white;
padding:25px;
border-radius:18px;
text-align:center;
margin-bottom:20px;
}

.header .brand{
color:#ffd54f;
font-weight:bold;
font-size:14px;
letter-spacing:1px;
text-transform:uppercase;
margin-bottom:6px;
}

.header h1{
margin:0;
}

.header p{
margin:8px 0 0;
}

.search-box{
margin-bottom:20px;
}

.search-box input{
width:100%;
padding:14px;
font-size:16px;
border:1px solid #ccc;
border-radius:10px;
}

/* ---------- MEMBER CARD (Message button stays inside the card) ---------- */

.member{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
background:white;
padding:15px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.left{
display:flex;
align-items:center;
min-width:0;
flex:1;
}

.avatar{
width:60px;
height:60px;
flex-shrink:0;
border-radius:50%;
object-fit:cover;
background:#e7f3ff;
margin-right:15px;
}

.info{
min-width:0;
flex:1;
}

.info h3{
margin:0;
color:#0066cc;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.info p{
margin:5px 0 0;
color:#666;
font-size:14px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.message-btn{
flex-shrink:0;
background:#0066cc;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
font-size:14px;
}

.message-btn:hover{
background:#004d99;
}

.loadMoreRow{
text-align:center;
margin:10px 0 20px;
}

.loadMoreRow button{
background:#e5f1ff;
color:#0056a6;
border:none;
padding:12px 22px;
border-radius:10px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.loadMoreRow button:hover{
background:#cfe5ff;
}

.loadMoreRow button:disabled{
opacity:.6;
cursor:not-allowed;
}

.statusText{
text-align:center;
color:#666;
padding:15px;
}

.back{
text-align:center;
margin-top:30px;
}

.back button{
background:#0066cc;
color:white;
padding:12px 24px;
border:none;
border-radius:10px;
cursor:pointer;
}

@media(max-width:480px){

body{
padding:12px;
}

.avatar{
width:50px;
height:50px;
margin-right:10px;
}

.message-btn{
padding:9px 12px;
font-size:13px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="brand">Faith Connect</div>

<h1>🔍 Search Members</h1>

<p>Find believers and start a private conversation.</p>

</div>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search by name...">

</div>

<div id="membersList">

<div class="statusText">
Loading members...
</div>

</div>

<div
class="loadMoreRow"
id="loadMoreRow"
style="display:none;">

<button
type="button"
id="loadMoreButton">
Load more members
</button>

</div>

<div class="back">

<a href="messages.html">

<button>

⬅ Back to Messages

</button>

</a>

</div>

</div>

<script type="module">

import {
db,
collection,
query,
orderBy,
limit,
startAfter,
getDocs
} from "./firebase.js";

/* Blue head shown when someone has no picture or the picture is broken */

const DEFAULT_AVATAR =
"data:image/svg+xml;charset=utf-8," +
encodeURIComponent(
'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
'<defs><clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath></defs>' +
'<circle cx="100" cy="100" r="100" fill="#e7f3ff"/>' +
'<g clip-path="url(#c)" fill="#1877f2">' +
'<circle cx="100" cy="76" r="38"/>' +
'<path d="M24 200c0-44 33-76 76-76s76 32 76 76z"/></g></svg>'
);

function escapeHTML(value){

return String(value || "").replace(
/[&<>"']/g,
function(character){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[character];

}
);

}

const membersList =
document.getElementById("membersList");

const searchInput =
document.getElementById("searchInput");

const loadMoreRow =
document.getElementById("loadMoreRow");

const loadMoreButton =
document.getElementById("loadMoreButton");

/*
Only this many members load at first.
Tapping "Load more" fetches the next batch.
*/

const MEMBERS_PER_PAGE = 40;

let members = [];
let lastVisibleDoc = null;
let noMoreMembers = false;
let isLoadingMembers = false;

/*
Local cache so the first page of members shows
instantly on repeat visits. The live read still
runs and replaces it right away.
*/

const MEMBERS_CACHE_KEY =
"sabasaba_members_cache_v1";

const MEMBERS_CACHE_MAX_AGE_MS =
30 * 60 * 1000;

function saveMembersCache(memberList){

try{

window.localStorage.setItem(

MEMBERS_CACHE_KEY,

JSON.stringify({

savedAt: Date.now(),

members: memberList

})

);

}catch(error){

console.warn(
"Members cache could not be saved:",
error
);

}

}

function loadMembersCache(){

try{

const rawCache =
window.localStorage.getItem(MEMBERS_CACHE_KEY);

if(!rawCache){

return null;

}

const parsedCache =
JSON.parse(rawCache);

const cacheAge =
Date.now() - (parsedCache.savedAt || 0);

if(cacheAge > MEMBERS_CACHE_MAX_AGE_MS){

return null;

}

if(

!Array.isArray(parsedCache.members) ||

parsedCache.members.length === 0

){

return null;

}

return parsedCache.members;

}catch(error){

console.warn(
"Members cache could not be read:",
error
);

return null;

}

}

async function loadMembers(isLoadMore = false){

if(isLoadingMembers || noMoreMembers){
return;
}

isLoadingMembers = true;

loadMoreButton.disabled = true;

loadMoreButton.textContent =
"Loading...";

try{

const usersReference =
collection(db,"users");

let membersQuery;

if(isLoadMore && lastVisibleDoc){

membersQuery = query(
usersReference,
orderBy("fullName"),
startAfter(lastVisibleDoc),
limit(MEMBERS_PER_PAGE)
);

}else{

membersQuery = query(
usersReference,
orderBy("fullName"),
limit(MEMBERS_PER_PAGE)
);

}

const snapshot =
await getDocs(membersQuery);

const newMembers = [];

snapshot.forEach(docSnapshot=>{

newMembers.push({
id: docSnapshot.id,
...docSnapshot.data()
});

});

if(isLoadMore){

members = members.concat(newMembers);

}else{

members = newMembers;

}

if(snapshot.docs.length > 0){

lastVisibleDoc =
snapshot.docs[snapshot.docs.length - 1];

}

noMoreMembers =
snapshot.docs.length < MEMBERS_PER_PAGE;

loadMoreRow.style.display =
noMoreMembers ? "none" : "block";

displayMembers(members);

if(!isLoadMore){

saveMembersCache(newMembers);

}

}catch(error){

console.error(
"Error loading members:",
error
);

membersList.innerHTML = `

<div class="statusText">
Members could not be loaded. Please try again.
</div>

`;

}finally{

isLoadingMembers = false;

loadMoreButton.disabled = false;

loadMoreButton.textContent =
"Load more members";

}

}

function displayMembers(list){

if(list.length === 0){

membersList.innerHTML = `

<div class="statusText">
No members found.
</div>

`;

return;

}

membersList.innerHTML =
list.map(user => `

<div class="member">

<div class="left">

<img
class="avatar"
loading="lazy"
alt=""
src="${escapeHTML(user.profilePicture || user.picture || user.photoURL || DEFAULT_AVATAR)}">

<div class="info">

<h3>${escapeHTML(user.fullName || user.name || "Unknown User")}</h3>

<p>${escapeHTML(user.email || "")}</p>

</div>

</div>

<button
class="message-btn"
type="button"
data-uid="${escapeHTML(user.id)}">

💬 Message

</button>

</div>

`).join("");

/* any broken picture becomes the blue head */

membersList.querySelectorAll("img.avatar").forEach(image => {

image.addEventListener(
"error",
function(){

if(image.src !== DEFAULT_AVATAR){

image.src = DEFAULT_AVATAR;

}

},
{ once:true }
);

});

}

membersList.addEventListener("click", function(event){

const messageButton =
event.target.closest(".message-btn");

if(messageButton){

window.location.href =
"chat.html?uid=" +
encodeURIComponent(messageButton.dataset.uid);

}

});

searchInput.addEventListener("input",function(){

const keyword =
this.value.toLowerCase();

/*
Search filters the members already loaded.
If someone isn't found, tap "Load more"
first, then search again.
*/

const filtered =
members.filter(user=>

(user.fullName || user.name || "")
.toLowerCase()
.includes(keyword)

);

displayMembers(filtered);

});

loadMoreButton.addEventListener(
"click",
()=>{

loadMembers(true);

}
);

const cachedMembers =
loadMembersCache();

if(cachedMembers){

members = cachedMembers;

displayMembers(members);

}

loadMembers(false);

</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js')
      .catch((error) => {
        console.error('Service Worker registration failed:', error);
      });
  });
}
</script>

</body>
</html>
