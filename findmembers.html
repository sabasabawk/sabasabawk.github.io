<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Find Members | SABASABA Gospel Ministry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.header{

background:linear-gradient(135deg,#0066cc,#004d99);
color:white;
padding:35px;
border-radius:20px;
text-align:center;
margin-bottom:25px;

}

.header h1{

font-size:38px;
margin-bottom:10px;

}

.header p{

font-size:18px;
line-height:1.6;

}

.searchBox{

margin-bottom:25px;

}

.searchBox input{

width:100%;
padding:15px;
border-radius:12px;
border:1px solid #ccc;
font-size:17px;
outline:none;

}

.searchBox input:focus{

border-color:#0066cc;

}

.memberGrid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;

}

.memberCard{

background:white;
border-radius:18px;
padding:20px;
text-align:center;
box-shadow:0 4px 12px rgba(0,0,0,.08);
transition:.3s;

}

.memberCard:hover{

transform:translateY(-5px);

}

.memberPhoto{

width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
background:#ddd;
margin:auto;
margin-bottom:15px;

}

.memberCard h2{

color:#0066cc;
margin-bottom:8px;
font-size:24px;

}

.memberInfo{

color:#666;
margin-bottom:18px;
font-size:16px;
line-height:1.5;

}

.buttonRow{

display:flex;
gap:10px;

}

.messageBtn{

flex:1;
background:#0066cc;
color:white;
border:none;
padding:12px;
border-radius:10px;
font-size:16px;
cursor:pointer;

}

.profileBtn{

flex:1;
background:#28a745;
color:white;
border:none;
padding:12px;
border-radius:10px;
font-size:16px;
cursor:pointer;

}

.messageBtn:hover{

background:#004d99;

}

.profileBtn:hover{

background:#1f7f36;

}

.empty{

background:white;
padding:40px;
text-align:center;
border-radius:18px;
color:#777;
font-size:18px;

}

.back{

margin-top:30px;
text-align:center;

}

.back button{

background:#0066cc;
color:white;
border:none;
padding:14px 30px;
border-radius:10px;
font-size:17px;
cursor:pointer;

}

@media(max-width:700px){

.buttonRow{

flex-direction:column;

}

.header h1{

font-size:30px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>👥 find Members</h1>

<p>

Connect with Christians around the world.
View profiles and start private conversations.

</p>

</div>

<div class="searchBox">

<input
id="searchInput"
type="text"
placeholder="Search members...">

</div>

<div
id="memberGrid"
class="memberGrid">

<div class="empty">

Loading members...

</div>

</div>

<div class="back">

<a href="community.html">

<button>

⬅ Back to Community

</button>

</a>

</div>

</div>
<script type="module">

import{
auth,
db,
collection,
getDocs,
onAuthStateChanged
}from "./firebase.js";

const memberGrid=document.getElementById("memberGrid");
const searchInput=document.getElementById("searchInput");

let allMembers=[];

onAuthStateChanged(auth,async(user)=>{

if(!user){

location.href="login.html";
return;

}

loadMembers(user.uid);

});

async function loadMembers(currentUid){

memberGrid.innerHTML=`
<div class="empty">
Loading members...
</div>
`;

try{

const snapshot=await getDocs(collection(db,"users"));

allMembers=[];

snapshot.forEach(doc=>{

const data=doc.data();

if(doc.id===currentUid)return;

allMembers.push({

uid:doc.id,

name:data.fullName||"Unknown Member",

country:data.country||"",

photo:data.profilePicture||"images/profile.png"

});

});

renderMembers(allMembers);

}catch(error){

memberGrid.innerHTML=`
<div class="empty">
Failed to load members.
</div>
`;

console.error(error);

}

}

function renderMembers(list){

memberGrid.innerHTML="";

if(list.length===0){

memberGrid.innerHTML=`
<div class="empty">
No members found.
</div>
`;

return;

}

list.forEach(member=>{

memberGrid.innerHTML+=`

<div class="memberCard">

<img
class="memberPhoto"
src="${member.photo}"
onerror="this.src='images/profile.png'">

<h2>${member.name}</h2>

<div class="memberInfo">

${member.country}

</div>

<div class="buttonRow">

<button
class="messageBtn"
onclick="location.href='chat.html?uid=${member.uid}'">

💬 Message

</button>

<button
class="profileBtn"
onclick="location.href='profileview.html?uid=${member.uid}'">

👤 View Profile

</button>

</div>

</div>

`;

});

}

searchInput.addEventListener("input",()=>{

const keyword=searchInput.value.toLowerCase();

const filtered=allMembers.filter(member=>

member.name.toLowerCase().includes(keyword)

||

member.country.toLowerCase().includes(keyword)

);

renderMembers(filtered);

});

</script>
</body>

</html>
