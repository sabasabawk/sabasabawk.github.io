<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Members | Faith Connect</title>

<style>

/* =====================================================
   FACEBOOK-STYLE EDGE-TO-EDGE CLEAN DESIGN
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f0f2f5;
  color:#050505;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:680px;
  margin:0 auto;
  padding-bottom:100px;
}

/* =====================================================
   HEADER & SEARCH BAR
===================================================== */

.header{
  background:#ffffff;
  padding:16px 14px;
  border-bottom:1px solid #e4e6eb;
}

.header .brand{
  color:#0873c9;
  font-weight:bold;
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:4px;
}

.header h1{
  margin:0;
  font-size:20px;
  color:#050505;
}

.header p{
  margin:4px 0 0;
  color:#65676b;
  font-size:13px;
}

.search-box{
  background:#ffffff;
  padding:10px 12px;
  border-bottom:1px solid #e4e6eb;
}

.search-box input{
  width:100%;
  padding:10px 16px;
  font-size:15px;
  border:none;
  border-radius:20px;
  background:#f0f2f5;
  outline:none;
}

.search-box input:focus{
  background:#e4e6eb;
}

/* =====================================================
   MEMBER ITEM ROWS & AVATAR FALLBACKS
===================================================== */

#membersList{
  width:100%;
  background:#ffffff;
}

.member{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#ffffff;
  padding:12px 14px;
  border-bottom:1px solid #e4e6eb;
  gap:12px;
}

.left{
  display:flex;
  align-items:center;
  min-width:0;
  flex:1;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#e5e9ed;
  flex-shrink:0;
  margin-right:12px;
}

.avatarFallback{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#e4e6eb;
  color:#65676b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  flex-shrink:0;
  margin-right:12px;
}

.info{
  min-width:0;
  flex:1;
}

.info h3{
  margin:0;
  color:#050505;
  font-size:15px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.info p{
  margin:2px 0 0;
  color:#65676b;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.message-btn{
  background:#e4e6eb;
  color:#050505;
  border:none;
  padding:8px 14px;
  border-radius:6px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  flex-shrink:0;
  transition:background .2s ease;
}

.message-btn:hover{
  background:#d8dadf;
}

/* =====================================================
   LOAD MORE & FOOTER
===================================================== */

.loadMoreRow{
  text-align:center;
  padding:16px;
  background:#ffffff;
  border-bottom:1px solid #e4e6eb;
}

.loadMoreRow button{
  background:#f0f2f5;
  color:#0873c9;
  border:none;
  padding:10px 20px;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.loadMoreRow button:hover{
  background:#e4e6eb;
}

.loadMoreRow button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.statusText{
  text-align:center;
  color:#65676b;
  padding:24px 14px;
  font-size:15px;
}

.back{
  text-align:center;
  margin-top:20px;
  padding:0 14px;
}

.back a{
  text-decoration:none;
}

.back button{
  background:#ffffff;
  color:#050505;
  padding:10px 20px;
  border:1px solid #ccd0d5;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="brand">Faith Connect</div>
    <h1>🔍 Search Members</h1>
    <p>Find believers and start a private conversation.</p>
  </div>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Search by name or email..."
    >
  </div>

  <div id="membersList">
    <div class="statusText">Loading members...</div>
  </div>

  <div class="loadMoreRow" id="loadMoreRow" style="display:none;">
    <button type="button" id="loadMoreButton">Load more members</button>
  </div>

  <div class="back">
    <a href="messages.html">
      <button>⬅ Back to Messages</button>
    </a>
  </div>

</div>

<script type="module">

import {
  db,
  collection,
  query,
  limit,
  startAfter,
  getDocs
} from "./firebase.js";

const membersList = document.getElementById("membersList");
const searchInput = document.getElementById("searchInput");
const loadMoreRow = document.getElementById("loadMoreRow");
const loadMoreButton = document.getElementById("loadMoreButton");

const MEMBERS_PER_PAGE = 40;

let members = [];
let lastVisibleDoc = null;
let noMoreMembers = false;
let isLoadingMembers = false;

const MEMBERS_CACHE_KEY = "sabasaba_members_cache_v1";
const MEMBERS_CACHE_MAX_AGE_MS = 30 * 60 * 1000;

function saveMembersCache(memberList){
  try{
    window.localStorage.setItem(
      MEMBERS_CACHE_KEY,
      JSON.stringify({
        savedAt: Date.now(),
        members: memberList
      })
    );
  }catch(error){
    console.warn("Members cache could not be saved:", error);
  }
}

function loadMembersCache(){
  try{
    const rawCache = window.localStorage.getItem(MEMBERS_CACHE_KEY);
    if(!rawCache) return null;

    const parsedCache = JSON.parse(rawCache);
    const cacheAge = Date.now() - (parsedCache.savedAt || 0);

    if(cacheAge > MEMBERS_CACHE_MAX_AGE_MS) return null;

    if(!Array.isArray(parsedCache.members) || parsedCache.members.length === 0){
      return null;
    }

    return parsedCache.members;
  }catch(error){
    console.warn("Members cache could not be read:", error);
    return null;
  }
}

async function loadMembers(isLoadMore = false){

  if(isLoadingMembers || noMoreMembers) return;

  isLoadingMembers = true;
  loadMoreButton.disabled = true;
  loadMoreButton.textContent = "Loading...";

  try{
    const usersReference = collection(db, "users");
    let membersQuery;

    if(isLoadMore && lastVisibleDoc){
      membersQuery = query(
        usersReference,
        startAfter(lastVisibleDoc),
        limit(MEMBERS_PER_PAGE)
      );
    }else{
      membersQuery = query(
        usersReference,
        limit(MEMBERS_PER_PAGE)
      );
    }

    const snapshot = await getDocs(membersQuery);
    const newMembers = [];

    snapshot.forEach(docSnapshot => {
      newMembers.push({
        id: docSnapshot.id,
        ...docSnapshot.data()
      });
    });

    if(isLoadMore){
      members = members.concat(newMembers);
    }else{
      members = newMembers;
    }

    if(snapshot.docs.length > 0){
      lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];
    }

    noMoreMembers = snapshot.docs.length < MEMBERS_PER_PAGE;
    loadMoreRow.style.display = noMoreMembers ? "none" : "block";

    displayMembers(members);

    if(!isLoadMore){
      saveMembersCache(newMembers);
    }

  }catch(error){
    console.error("Error loading members:", error);
    membersList.innerHTML = `
      <div class="statusText">
        Members could not be loaded. Please try again.
      </div>
    `;
  }finally{
    isLoadingMembers = false;
    loadMoreButton.disabled = false;
    loadMoreButton.textContent = "Load more members";
  }
}

function displayMembers(list){

  if(list.length === 0){
    membersList.innerHTML = `
      <div class="statusText">No members found.</div>
    `;
    return;
  }

  membersList.innerHTML = list.map(user => {
    const name = escapeHTML(user.fullName || user.displayName || user.name || "Community Member");
    const email = escapeHTML(user.email || "");
    const picture = user.profilePicture || user.picture || user.photoURL || "";

    // Robust Avatar Markup: Displays profile photo or falls back to centered silhouette
    const avatarMarkup = picture
      ? `<img class="avatar" loading="lazy" src="${picture}" alt="${name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
         <div class="avatarFallback" style="display:none;">👤</div>`
      : `<div class="avatarFallback">👤</div>`;

    return `
      <div class="member">
        <div class="left">
          ${avatarMarkup}
          <div class="info">
            <h3>${name}</h3>
            <p>${email}</p>
          </div>
        </div>
        <button
          class="message-btn"
          onclick="window.location.href='chat.html?uid=${user.id}'">
          💬 Message
        </button>
      </div>
    `;
  }).join("");
}

function escapeHTML(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

searchInput.addEventListener("input", function(){
  const keyword = this.value.toLowerCase().trim();

  const filtered = members.filter(user => {
    const name = (user.fullName || user.displayName || user.name || "").toLowerCase();
    const email = (user.email || "").toLowerCase();
    return name.includes(keyword) || email.includes(keyword);
  });

  displayMembers(filtered);
});

loadMoreButton.addEventListener("click", () => {
  loadMembers(true);
});

// Load cached copy immediately if available
const cachedMembers = loadMembersCache();
if(cachedMembers){
  members = cachedMembers;
  displayMembers(members);
}

// Fetch live members
loadMembers(false);

</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then((registration) => {
          console.log('Service Worker registered:', registration.scope);
        })
        .catch((error) => {
          console.error('Service Worker registration failed:', error);
        });
    });
  }
</script>

</body>
</html>
