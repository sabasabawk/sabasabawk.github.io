<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search Members</title>

<style>

body{
font-family:Arial,sans-serif;
background:#eef3f8;
margin:0;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.header{
background:#0066cc;
color:white;
padding:25px;
border-radius:18px;
text-align:center;
margin-bottom:20px;
}

.search-box{
margin-bottom:20px;
}

.search-box input{
width:100%;
padding:14px;
font-size:16px;
border:1px solid #ccc;
border-radius:10px;
box-sizing:border-box;
}

.member{
display:flex;
align-items:center;
justify-content:space-between;
background:white;
padding:15px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.left{
display:flex;
align-items:center;
}

.avatar{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
background:#ddd;
margin-right:15px;
}

.info h3{
margin:0;
color:#0066cc;
}

.info p{
margin:5px 0 0;
color:#666;
font-size:14px;
}

.message-btn{
background:#0066cc;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
}

.message-btn:hover{
background:#004d99;
}

.loadMoreRow{
text-align:center;
margin:10px 0 20px;
}

.loadMoreRow button{
background:#e5f1ff;
color:#0056a6;
border:none;
padding:12px 22px;
border-radius:10px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.loadMoreRow button:hover{
background:#cfe5ff;
}

.loadMoreRow button:disabled{
opacity:.6;
cursor:not-allowed;
}

.statusText{
text-align:center;
color:#666;
padding:15px;
}

.back{
text-align:center;
margin-top:30px;
}

.back button{
background:#0066cc;
color:white;
padding:12px 24px;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>🔍 Search Members</h1>

<p>Find believers and start a private conversation.</p>

</div>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search by name...">

</div>

<div id="membersList">

<div class="statusText">
Loading members...
</div>

</div>

<div
class="loadMoreRow"
id="loadMoreRow"
style="display:none;">

<button
type="button"
id="loadMoreButton">
Load more members
</button>

</div>

<div class="back">

<a href="messages.html">

<button>

⬅ Back to Messages

</button>

</a>

</div>

</div>

<script type="module">

import {
db,
collection,
query,
orderBy,
limit,
startAfter,
getDocs
} from "./firebase.js";

const membersList =
document.getElementById("membersList");

const searchInput =
document.getElementById("searchInput");

const loadMoreRow =
document.getElementById("loadMoreRow");

const loadMoreButton =
document.getElementById("loadMoreButton");

/*
PAGE SIZE

Instead of downloading every member account
in the whole app at once (which is what was
causing the slowness), only this many load
to start. Tapping "Load more" fetches the
next batch.
*/

const MEMBERS_PER_PAGE = 40;

let members = [];
let lastVisibleDoc = null;
let noMoreMembers = false;
let isLoadingMembers = false;

async function loadMembers(isLoadMore = false){

if(isLoadingMembers || noMoreMembers){
return;
}

isLoadingMembers = true;

loadMoreButton.disabled = true;

loadMoreButton.textContent =
"Loading...";

try{

const usersReference =
collection(db,"users");

let membersQuery;

if(isLoadMore && lastVisibleDoc){

membersQuery = query(
usersReference,
orderBy("fullName"),
startAfter(lastVisibleDoc),
limit(MEMBERS_PER_PAGE)
);

}else{

membersQuery = query(
usersReference,
orderBy("fullName"),
limit(MEMBERS_PER_PAGE)
);

}

const snapshot =
await getDocs(membersQuery);

const newMembers = [];

snapshot.forEach(docSnapshot=>{

newMembers.push({
id: docSnapshot.id,
...docSnapshot.data()
});

});

if(isLoadMore){

members = members.concat(newMembers);

}else{

members = newMembers;

}

if(snapshot.docs.length > 0){

lastVisibleDoc =
snapshot.docs[snapshot.docs.length - 1];

}

noMoreMembers =
snapshot.docs.length < MEMBERS_PER_PAGE;

loadMoreRow.style.display =
noMoreMembers ? "none" : "block";

displayMembers(members);

}catch(error){

console.error(
"Error loading members:",
error
);

membersList.innerHTML = `

<div class="statusText">
Members could not be loaded. Please try again.
</div>

`;

}finally{

isLoadingMembers = false;

loadMoreButton.disabled = false;

loadMoreButton.textContent =
"Load more members";

}

}

function displayMembers(list){

if(list.length === 0){

membersList.innerHTML = `

<div class="statusText">
No members found.
</div>

`;

return;

}

membersList.innerHTML =
list.map(user => `

<div class="member">

<div class="left">

<img
class="avatar"
loading="lazy"
src="${user.profilePicture || 'images/profile.png'}"
onerror="this.src='images/profile.png';">

<div class="info">

<h3>${user.fullName || "Unknown User"}</h3>

<p>${user.email || ""}</p>

</div>

</div>

<button
class="message-btn"
onclick="window.location.href='chat.html?uid=${user.id}'">

💬 Message

</button>

</div>

`).join("");

}

searchInput.addEventListener("input",function(){

const keyword =
this.value.toLowerCase();

/*
Search filters the members already loaded.
If someone isn't found, tap "Load more"
first to bring in additional members, then
search again.
*/

const filtered =
members.filter(user=>

(user.fullName || "")
.toLowerCase()
.includes(keyword)

);

displayMembers(filtered);

});

loadMoreButton.addEventListener(
"click",
()=>{

loadMembers(true);

}
);

loadMembers(false);

</script>

</body>
</html>
