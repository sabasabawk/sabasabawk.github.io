<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search Members | Faith Connect</title>

<style>

/* =====================================================
   FACEBOOK-STYLE EDGE-TO-EDGE CLEAN DESIGN
===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f0f2f5;
  color:#050505;
  min-height:100vh;
}

.container{
  max-width:680px;
  margin:auto;
  padding:0 0 80px 0;
}

.header{
  background:#ffffff;
  color:#050505;
  padding:16px 14px;
  text-align:left;
  border-bottom:1px solid #e4e6eb;
  border-radius:0;
  margin-bottom:0;
}

.header h1{
  font-size:20px;
  color:#050505;
  margin:0;
}

.search-wrapper{
  background:#ffffff;
  padding:10px 12px;
  border-bottom:1px solid #e4e6eb;
}

input{
  width:100%;
  padding:10px 16px;
  font-size:15px;
  border:none;
  border-radius:20px;
  background:#f0f2f5;
  color:#050505;
  outline:none;
  margin-bottom:0;
}

input:focus{
  background:#e4e6eb;
}

#results{
  background:#ffffff;
  width:100%;
}

.member{
  background:white;
  padding:12px 14px;
  border-bottom:1px solid #e4e6eb;
  border-radius:0;
  box-shadow:none;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  transition:background .2s;
}

.member:hover{
  background:#f2f4f7;
}

.member:active{
  background:#e4e6eb;
}

.member img{
  width:48px;
  height:48px;
  border-radius:50%;
  margin-right:0;
  object-fit:cover;
  border:none;
  background:#e5e9ed;
  flex-shrink:0;
}

.member-info{
  min-width:0;
  flex:1;
}

.name{
  font-size:15px;
  font-weight:bold;
  color:#050505;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.category{
  font-size:13px;
  color:#65676b;
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.back-container{
  text-align:center;
  margin-top:20px;
  padding:0 14px;
}

button.back-btn{
  background:#ffffff;
  color:#050505;
  border:1px solid #ccd0d5;
  padding:10px 20px;
  border-radius:8px;
  cursor:pointer;
  margin-top:0;
  font-size:14px;
  font-weight:bold;
  transition:background .2s;
}

button.back-btn:hover{
  background:#f0f2f5;
}

@media(max-width:600px){
  .container{
    padding:0;
  }
  .header{
    padding:12px;
  }
  .member{
    padding:10px 12px;
  }
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>🔍 Search Members</h1>
</div>

<div class="search-wrapper">
<input
type="text"
id="searchBox"
placeholder="Search member..."
onkeyup="searchMembers()">
</div>

<div id="results"></div>

<div class="back-container">
<a href="community.html" style="text-decoration:none;">
<button class="back-btn">⬅ Back to Community</button>
</a>
</div>

</div>

<script>

let posts =
JSON.parse(localStorage.getItem("communityPosts")) || [];

function searchMembers(){

let keyword =
document.getElementById("searchBox").value.toLowerCase().trim();

let results =
document.getElementById("results");

results.innerHTML="";

let shown=[];

posts.forEach(function(post){

let name = post.name || "Community Member";
let category = post.category || "";
let picture = post.picture || "images/profile.png";

if(
name.toLowerCase().includes(keyword)
&&
!shown.includes(name)
){

shown.push(name);

results.innerHTML+=`

<div class="member"
onclick="openMember('${name.replaceAll("'", "\\'")}')">

<img src="${picture}" onerror="this.src='images/profile.png';">

<div class="member-info">

<div class="name">${escapeHTML(name)}</div>

<div class="category">${escapeHTML(category)}</div>

</div>

</div>

`;

}

});

if(results.innerHTML === ""){
results.innerHTML = `
<div style="text-align:center; padding:30px; color:#65676b; font-size:14px;">
No members found matching your search.
</div>
`;
}

}

function escapeHTML(value){
return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

searchMembers();

function openMember(name){

localStorage.setItem(
"selectedMember",
name
);

window.location.href="member.html";

}
</script>

</body>
</html>
