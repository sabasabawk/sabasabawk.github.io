<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Faith Connect private voice call.">
<title>Voice Call | SABASABA Gospel Ministry</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#087bd1;--muted:#b6c8d6;--border:rgba(255,255,255,.12);--success:#35b46f;--danger:#e34f4f;--warning:#f0b948}
body{min-height:100vh;background:radial-gradient(circle at top,#16486c,#071522 58%);color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
.hidden{display:none !important}

.topHeader{position:relative;z-index:100;width:100%;background:rgba(4,18,29,.78);border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}
.topHeaderInner{width:100%;max-width:760px;min-height:64px;margin:auto;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.backButton{width:42px;height:42px;flex-shrink:0;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.09);color:#fff;font-size:22px;font-weight:900}
.headerTitleArea{min-width:0;flex:1;text-align:center}
.headerTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px;font-weight:900}
.headerSubtitle{margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:10px;font-weight:800}
.securityIcon{width:42px;height:42px;flex-shrink:0;border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);font-size:18px}

.callPage{width:100%;max-width:760px;min-height:calc(100vh - 64px);margin:auto;padding:24px 16px 30px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:20px}
.callInformation{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
.callStatus{min-height:28px;padding:7px 13px;border:1px solid var(--border);border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);color:var(--muted);font-size:11px;font-weight:900}
.callStatus.ringing{color:#ffe39b}.callStatus.connected{color:#9df0bc}.callStatus.ended{color:#ffaaaa}
.memberProfile{margin-top:30px;display:flex;flex-direction:column;align-items:center}
.memberAvatarFrame{width:164px;height:164px;padding:7px;border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.30),rgba(255,255,255,.06));box-shadow:0 12px 35px rgba(0,0,0,.38)}
.memberAvatarFrame.ringing{animation:ringPulse 1.6s ease-in-out infinite}
@keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.18),0 12px 35px rgba(0,0,0,.38)}50%{box-shadow:0 0 0 18px rgba(255,255,255,0),0 12px 35px rgba(0,0,0,.38)}}
.memberAvatar{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#dce4ea}
.memberName{margin-top:20px;max-width:100%;font-size:25px;font-weight:900;line-height:1.25;overflow-wrap:anywhere}
.memberCountry{margin-top:7px;color:var(--muted);font-size:12px;font-weight:800}
.callTimer{margin-top:16px;min-height:30px;color:#dff3ff;font-size:18px;font-weight:900;letter-spacing:1px}
.callMessage{width:100%;max-width:520px;margin-top:18px;padding:14px;border:1px solid var(--border);border-radius:17px;background:rgba(255,255,255,.08);color:var(--muted);text-align:center;font-size:12px;font-weight:800;line-height:1.55}
.callMessage.error{border-color:rgba(227,79,79,.55);background:rgba(227,79,79,.14);color:#ffbaba}
.remoteAudio{display:none}
.connectionIndicator{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:10px;font-weight:800}
.connectionDot{width:9px;height:9px;border-radius:50%;background:#748b9a}
.connectionDot.connecting{background:var(--warning);animation:blink 1s ease-in-out infinite}
.connectionDot.connected{background:var(--success)}
.connectionDot.failed{background:var(--danger)}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.permissionNotice{width:100%;max-width:520px;margin-top:16px;padding:13px 14px;border:1px solid rgba(240,185,72,.45);border-radius:17px;background:rgba(240,185,72,.13);color:#ffe5a9;text-align:center;font-size:11px;font-weight:800;line-height:1.55}

.controlsArea{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:18px}
.activeCallControls{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.callControlButton{min-height:88px;padding:12px 8px;border:1px solid var(--border);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.08);color:#fff;font-size:11px;font-weight:900}
.callControlButton.active{border-color:rgba(53,180,111,.55);background:rgba(53,180,111,.18);color:#a9f5c5}
.callControlButton.warning{border-color:rgba(240,185,72,.52);background:rgba(240,185,72,.16);color:#ffe39b}
.callControlButton:disabled{cursor:not-allowed;opacity:.48}
.callControlIcon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.10);font-size:22px}
.endCallButton{width:76px;height:76px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--danger);color:#fff;font-size:30px;box-shadow:0 10px 28px rgba(227,79,79,.36)}
.endCallButton:disabled{cursor:not-allowed;opacity:.55}
.incomingCallControls{width:100%;display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.incomingCallControls.show{display:grid}
.incomingAction{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}
.incomingActionButton{width:76px;height:76px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.incomingActionButton.accept{background:var(--success)}
.incomingActionButton.reject{background:var(--danger)}
.incomingActionButton:disabled{cursor:not-allowed;opacity:.55}
.incomingActionLabel{color:var(--muted);font-size:11px;font-weight:900}
.outgoingCallControls{width:100%;display:flex;align-items:center;justify-content:center}
@media(max-width:520px){.memberAvatarFrame{width:142px;height:142px}.memberName{font-size:22px}.activeCallControls{gap:9px}.callControlButton{min-height:80px;font-size:10px}.callControlIcon{width:44px;height:44px;font-size:20px}.endCallButton,.incomingActionButton{width:70px;height:70px;font-size:27px}}
@media(max-width:360px){.memberAvatarFrame{width:125px;height:125px}.memberName{font-size:20px}.activeCallControls{gap:6px}.callControlButton{min-height:74px;font-size:9px}}

/* ===== MINIMIZE (keep the call alive while using the app) ===== */
#miniBar{position:fixed;top:0;left:0;right:0;z-index:2147483000;height:52px;display:flex;align-items:center;gap:8px;padding:6px 8px;background:#0b6b3a;color:#fff;font-family:Arial,Helvetica,sans-serif}
#miniBar.hidden{display:none !important}
.miniReturn{flex:1;min-width:0;height:40px;border:0;border-radius:20px;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;font-weight:800;text-align:left}
.miniDot{width:9px;height:9px;border-radius:50%;background:#7cffb0;flex-shrink:0;animation:miniBlink 1.2s ease-in-out infinite}
@keyframes miniBlink{0%,100%{opacity:.35}50%{opacity:1}}
#miniName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.miniHint{font-size:10px;opacity:.8;white-space:nowrap}
.miniEnd{width:40px;height:40px;border:0;border-radius:50%;background:#e74c3c;font-size:18px;flex-shrink:0}
#appFrame{position:fixed;top:52px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 52px);border:0;background:#fff;z-index:2147482000}
#appFrame.hidden{display:none !important}
#miniToast{position:fixed;left:50%;bottom:24px;z-index:2147483001;transform:translateX(-50%);max-width:88%;padding:11px 16px;border-radius:14px;background:rgba(0,0,0,.85);color:#fff;font:700 13px Arial,Helvetica,sans-serif;text-align:center}
body.callMinimized>*:not(#miniBar):not(#appFrame):not(#miniToast):not(audio):not(script){visibility:hidden;pointer-events:none}
</style>
</head>
<body>

<header class="topHeader"><div class="topHeaderInner">
  <button id="backButton" class="backButton" type="button" aria-label="Go back">←</button>
  <div class="headerTitleArea">
    <div id="headerTitle" class="headerTitle">Voice Call</div>
    <div id="headerSubtitle" class="headerSubtitle">Faith Connect private call</div>
  </div>
  <button id="minimizeButton" class="backButton" type="button" aria-label="Minimize call" title="Minimize">⌄</button>
  <div class="securityIcon" title="Private voice call">🔒</div>
</div></header>

<main class="callPage">
  <section class="callInformation">
    <div id="callStatus" class="callStatus" aria-live="polite">Preparing call...</div>
    <div class="memberProfile">
      <div id="memberAvatarFrame" class="memberAvatarFrame">
        <img id="memberAvatar" class="memberAvatar" src="images/profile.png" alt="Call participant">
      </div>
      <h1 id="memberName" class="memberName">Faith Connect Member</h1>
      <div id="memberCountry" class="memberCountry hidden"></div>
      <div id="callTimer" class="callTimer">00:00</div>
    </div>
    <div class="connectionIndicator">
      <span id="connectionDot" class="connectionDot"></span>
      <span id="connectionText">Waiting for connection</span>
    </div>
    <div id="permissionNotice" class="permissionNotice">Allow microphone access when your browser asks.</div>
    <div id="callMessage" class="callMessage hidden" aria-live="polite"></div>
  </section>

  <section class="controlsArea">
    <div id="activeCallControls" class="activeCallControls">
      <button id="muteButton" class="callControlButton" type="button" disabled>
        <span id="muteIcon" class="callControlIcon">🎙️</span><span id="muteLabel">Mute</span>
      </button>
      <button id="speakerButton" class="callControlButton" type="button" disabled>
        <span id="speakerIcon" class="callControlIcon">🔊</span><span id="speakerLabel">Speaker</span>
      </button>
      <button id="audioRouteButton" class="callControlButton" type="button" disabled>
        <span id="audioRouteIcon" class="callControlIcon">🎧</span><span id="audioRouteLabel">Audio</span>
      </button>
    </div>

    <div id="incomingCallControls" class="incomingCallControls">
      <div class="incomingAction">
        <button id="rejectCallButton" class="incomingActionButton reject" type="button" aria-label="Reject call">📵</button>
        <span class="incomingActionLabel">Reject</span>
      </div>
      <div class="incomingAction">
        <button id="acceptCallButton" class="incomingActionButton accept" type="button" aria-label="Accept call">📞</button>
        <span class="incomingActionLabel">Accept</span>
      </div>
    </div>

    <div id="outgoingCallControls" class="outgoingCallControls">
      <button id="endCallButton" class="endCallButton" type="button" aria-label="End call" disabled>📵</button>
    </div>
  </section>
</main>

<audio id="remoteAudio" class="remoteAudio" autoplay playsinline></audio>

<script type="module">
import{
  auth, db, collection, doc, getDoc, addDoc, setDoc, updateDoc,
  onSnapshot, serverTimestamp, onAuthStateChanged
}from "./firebase.js";
if(window.self!==window.top){ throw new Error("Call pages cannot open inside the call window."); }

/* =====================================================
   WEBRTC SERVERS
   !!! Replace the TURN entries with your OWN credentials
   (Metered.ca, Twilio, Cloudflare...). The "openrelay"
   entries below are public test servers and may be
   rate-limited or discontinued.
===================================================== */
const TURN_SERVERS=[
  {urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turns:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"}
];

const rtcConfiguration={
  iceServers:[
    {urls:"stun:stun.l.google.com:19302"},
    {urls:"stun:stun1.l.google.com:19302"},
    ...TURN_SERVERS
  ],
  iceCandidatePoolSize:10
};

/* ===== ELEMENTS ===== */
const $=id=>document.getElementById(id);
const backButton=$("backButton"),headerTitle=$("headerTitle"),headerSubtitle=$("headerSubtitle"),
callStatus=$("callStatus"),memberAvatarFrame=$("memberAvatarFrame"),memberAvatar=$("memberAvatar"),
memberName=$("memberName"),memberCountry=$("memberCountry"),callTimer=$("callTimer"),
connectionDot=$("connectionDot"),connectionText=$("connectionText"),permissionNotice=$("permissionNotice"),
callMessage=$("callMessage"),activeCallControls=$("activeCallControls"),incomingCallControls=$("incomingCallControls"),
outgoingCallControls=$("outgoingCallControls"),muteButton=$("muteButton"),muteIcon=$("muteIcon"),muteLabel=$("muteLabel"),
speakerButton=$("speakerButton"),speakerIcon=$("speakerIcon"),speakerLabel=$("speakerLabel"),
audioRouteButton=$("audioRouteButton"),audioRouteIcon=$("audioRouteIcon"),audioRouteLabel=$("audioRouteLabel"),
rejectCallButton=$("rejectCallButton"),acceptCallButton=$("acceptCallButton"),endCallButton=$("endCallButton"),
remoteAudio=$("remoteAudio");

/* ===== STATE ===== */
let currentUser=null,currentProfile={},otherMemberId="",otherMemberProfile={},callId="",callRole="caller",callData={};
let localStream=null,remoteStream=null,peerConnection=null;
let unsubscribeCall=null,unsubscribeCallerCandidates=null,unsubscribeReceiverCandidates=null;
let microphoneMuted=false,speakerMuted=false;
let callStartedAt=null,callTimerInterval=null;
let callActionRunning=false,pageIsClosing=false,outgoingCallStarted=false;
let receiverAnswerApplied=false,lastCallStatus="",callFinished=false;
const processedCallerCandidateIds=new Set(),processedReceiverCandidateIds=new Set();
const pendingCallerCandidates=[],pendingReceiverCandidates=[];
const FINAL_STATUSES=["ended","rejected","cancelled","missed","failed"];

function getFirstValue(...values){
  for(const v of values){ if(v!==undefined&&v!==null&&String(v).trim()!=="") return String(v).trim(); }
  return "";
}

/* ===== ICE DIAGNOSTICS (own line, never overwritten) ===== */
const iceDebug=document.createElement("div");
iceDebug.style.cssText="margin-top:8px;font-size:11px;line-height:1.4;color:#9fb3c8;text-align:center;word-break:break-word;padding:0 12px;";
connectionText.parentElement.insertAdjacentElement("afterend",iceDebug);
const iceInfo={state:"new",conn:"new",host:0,srflx:0,relay:0,remote:0,err:""};
function renderIceDebug(){ iceDebug.textContent="ICE: "+iceInfo.state+" | conn: "+iceInfo.conn+" | local host "+iceInfo.host+", stun "+iceInfo.srflx+", turn "+iceInfo.relay+" | remote "+iceInfo.remote+(iceInfo.err?" | err "+iceInfo.err:""); }
function attachIceDiagnostics(pc){
  pc.addEventListener("icecandidate",e=>{
    if(!e.candidate) return;
    const t=e.candidate.type||((e.candidate.candidate||"").match(/ typ (\w+)/)||[])[1];
    if(t==="host") iceInfo.host++; else if(t==="srflx") iceInfo.srflx++; else if(t==="relay") iceInfo.relay++;
    renderIceDebug();
  });
  pc.addEventListener("icecandidateerror",e=>{ if(!/^(READ|WRITE)/.test(iceInfo.err)) iceInfo.err="TURN "+(e.errorCode||"")+" "+(e.url||"").replace(/^turns?:|^stuns?:/,"").slice(0,24); renderIceDebug(); });
}
renderIceDebug();

/* ===== URL ===== */
const urlParameters=new URLSearchParams(window.location.search);
const requestedMemberId=getFirstValue(urlParameters.get("user"),urlParameters.get("uid"));
const requestedCallId=getFirstValue(urlParameters.get("call"),urlParameters.get("callId"));
let urlIsValid=true;
if(requestedCallId){ callId=requestedCallId; callRole="receiver"; }
else if(requestedMemberId){ otherMemberId=requestedMemberId; callRole="caller"; }
else{ urlIsValid=false; }

/* ===== UI HELPERS ===== */
function showCallMessage(m,isError=false){
  callMessage.textContent=m; callMessage.classList.remove("hidden","error");
  if(isError) callMessage.classList.add("error");
}
function hideCallMessage(){ callMessage.textContent=""; callMessage.classList.add("hidden"); callMessage.classList.remove("error"); }
function updateCallStatus(status,text){ callStatus.className="callStatus"; if(status) callStatus.classList.add(status); callStatus.textContent=text; }
function updateConnectionDisplay(state){
  connectionDot.className="connectionDot";
  if(state==="connecting"){ connectionDot.classList.add("connecting"); connectionText.textContent="Connecting voice call"; }
  else if(state==="connected"){ connectionDot.classList.add("connected"); connectionText.textContent="Voice call connected"; }
  else if(state==="failed"){ connectionDot.classList.add("failed"); connectionText.textContent="Connection failed"; }
  else if(state==="ended"){ connectionDot.classList.add("failed"); connectionText.textContent="Call ended"; }
  else connectionText.textContent="Waiting for connection";
}
function showCallError(message){
  showCallMessage(message,true);
  updateCallStatus("ended","Call unavailable");
  updateConnectionDisplay("failed");
  permissionNotice.classList.add("hidden");
  incomingCallControls.classList.remove("show");
  activeCallControls.classList.add("hidden");
  outgoingCallControls.classList.remove("hidden");
  endCallButton.disabled=false;
}
async function loadUserProfile(userId){
  if(!userId) return {};
  try{
    const s=await getDoc(doc(db,"users",userId));
    if(s.exists()) return {id:s.id,...s.data()};
  }catch(e){ console.error("Profile loading error:",e); }
  return {id:userId};
}
function displayOtherMember(){
  const name=getFirstValue(otherMemberProfile.fullName,otherMemberProfile.name,otherMemberProfile.displayName,callData.callerName,"Faith Connect Member");
  const pic=getFirstValue(otherMemberProfile.profilePicture,otherMemberProfile.picture,otherMemberProfile.photoURL,otherMemberProfile.photoUrl,callData.callerPicture,"images/profile.png");
  const country=getFirstValue(otherMemberProfile.country,otherMemberProfile.location);
  memberName.textContent=name; memberAvatar.src=pic; headerTitle.textContent=name;
  if(country){ memberCountry.textContent="🌍 "+country; memberCountry.classList.remove("hidden"); }
  else{ memberCountry.textContent=""; memberCountry.classList.add("hidden"); }
}
memberAvatar.addEventListener("error",()=>{ memberAvatar.src="images/profile.png"; },{once:true});

/* ===== TIMER ===== */
function startCallTimer(){
  if(callTimerInterval) return;
  callStartedAt=Date.now(); callTimer.textContent="00:00";
  callTimerInterval=setInterval(()=>{
    const t=Math.floor((Date.now()-callStartedAt)/1000);
    callTimer.textContent=String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
  },1000);
}
function stopCallTimer(){ if(callTimerInterval) clearInterval(callTimerInterval); callTimerInterval=null; }

/* ===== MICROPHONE ===== */
async function requestMicrophone(){
  if(localStream) return localStream;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error("Microphone access is not supported by this browser.");
  try{
    localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
    permissionNotice.classList.add("hidden");
    muteButton.disabled=false;
    return localStream;
  }catch(error){
    console.error("Microphone error:",error);
    if(error?.name==="NotAllowedError") throw new Error("Microphone permission was denied. Allow microphone access and try again.");
    if(error?.name==="NotFoundError") throw new Error("No microphone was found on this device.");
    throw new Error("The microphone could not be opened.");
  }
}

/* ===== PEER CONNECTION ===== */
async function createPeerConnection(){
  if(peerConnection) return peerConnection;
  peerConnection=new RTCPeerConnection(rtcConfiguration);
  attachIceDiagnostics(peerConnection);
  remoteStream=new MediaStream();
  remoteAudio.srcObject=remoteStream;

  const mic=await requestMicrophone();
  mic.getTracks().forEach(t=>peerConnection.addTrack(t,mic));

  peerConnection.addEventListener("track",event=>{
    const streams=event.streams&&event.streams.length?event.streams:[];
    streams.forEach(s=>s.getTracks().forEach(track=>{
      if(!remoteStream.getTracks().some(x=>x.id===track.id)) remoteStream.addTrack(track);
    }));
    if(!streams.length&&event.track&&!remoteStream.getTracks().some(x=>x.id===event.track.id)) remoteStream.addTrack(event.track);
    remoteAudio.play().catch(e=>console.log("Audio needs a tap:",e));
  });

  peerConnection.addEventListener("connectionstatechange",()=>{
    if(!peerConnection) return;
    const state=peerConnection.connectionState;
    console.log("Voice connection state:",state); iceInfo.conn=state; renderIceDebug();
    if(state==="connected"){
      updateConnectionDisplay("connected"); updateCallStatus("connected","Connected");
      memberAvatarFrame.classList.remove("ringing"); hideCallMessage();
      enableConnectedCallControls(); startCallTimer();
      markConnected();
    }else if(state==="connecting"){ updateConnectionDisplay("connecting"); }
    else if(state==="failed"){
      updateConnectionDisplay("failed");
      showCallMessage("The voice connection failed. Check your internet and try again.",true);
    }else if(state==="disconnected"){ connectionText.textContent="Voice connection interrupted"; }
  });

  peerConnection.addEventListener("iceconnectionstatechange",()=>{
    if(!peerConnection) return;
    const s=peerConnection.iceConnectionState;
    console.log("Voice ICE state:",s);
    /* Visible on screen so problems can be diagnosed on a phone */
    iceInfo.state=s; renderIceDebug();
    if(s==="failed"){
      updateConnectionDisplay("failed");
      showCallMessage("The two phones could not reach each other. A TURN server is probably needed.",true);
    }
  });

  return peerConnection;
}

function enableConnectedCallControls(){
  muteButton.disabled=false; speakerButton.disabled=false; audioRouteButton.disabled=false; endCallButton.disabled=false;
  activeCallControls.classList.remove("hidden");
  incomingCallControls.classList.remove("show");
  outgoingCallControls.classList.remove("hidden");
}

async function markConnected(){
  if(!callId||lastCallStatus==="connected"||callFinished) return;
  try{
    await updateDoc(doc(db,"voiceCalls",callId),{status:"connected",updatedAt:serverTimestamp()});
    lastCallStatus="connected";
  }catch(e){ console.log("Could not mark connected:",e); }
}

/* ===== CLEANUP ===== */
function cleanupPeerConnection(){
  if(peerConnection){ try{ peerConnection.close(); }catch(e){ console.error(e); } }
  peerConnection=null;
}
function cleanupLocalMedia(){
  if(localStream) localStream.getTracks().forEach(t=>t.stop());
  localStream=null;
}
function cleanupRemoteAudio(){
  remoteAudio.pause(); remoteAudio.srcObject=null;
  if(remoteStream) remoteStream.getTracks().forEach(t=>t.stop());
  remoteStream=null;
}
function stopCallDocumentListener(){ if(typeof unsubscribeCall==="function") unsubscribeCall(); unsubscribeCall=null; }
function stopCallerCandidateListener(){ if(typeof unsubscribeCallerCandidates==="function") unsubscribeCallerCandidates(); unsubscribeCallerCandidates=null; }
function stopReceiverCandidateListener(){ if(typeof unsubscribeReceiverCandidates==="function") unsubscribeReceiverCandidates(); unsubscribeReceiverCandidates=null; }
function cleanupVoiceCallResources(){
  stopCallTimer(); stopCallDocumentListener(); stopCallerCandidateListener(); stopReceiverCandidateListener();
  cleanupPeerConnection(); cleanupLocalMedia(); cleanupRemoteAudio();
}
function resetIceCandidateState(){
  processedCallerCandidateIds.clear(); processedReceiverCandidateIds.clear();
  pendingCallerCandidates.length=0; pendingReceiverCandidates.length=0;
}

/* ===== ICE CANDIDATES ===== */
function peerHasRemoteDescription(){ return Boolean(peerConnection&&peerConnection.remoteDescription&&peerConnection.remoteDescription.type); }
async function addRemoteIceCandidate(data,pending){
  if(!data||!peerConnection) return;
  try{
    const c=new RTCIceCandidate(data); iceInfo.remote++; renderIceDebug();
    if(peerHasRemoteDescription()) await peerConnection.addIceCandidate(c); else pending.push(c);
  }catch(e){ console.error("Remote ICE error:",e); }
}
async function applyPendingCandidates(pending){
  if(!peerConnection||!peerHasRemoteDescription()) return;
  while(pending.length){
    const c=pending.shift();
    try{ await peerConnection.addIceCandidate(c); }catch(e){ console.error("Pending ICE error:",e); }
  }
}
function watchCandidates(subcollection,processed,pending){
  return onSnapshot(collection(db,"voiceCalls",callId,subcollection),snap=>{
    snap.docChanges().forEach(change=>{
      if(change.type!=="added"||processed.has(change.doc.id)) return;
      processed.add(change.doc.id);
      addRemoteIceCandidate(change.doc.data(),pending);
    });
  },err=>{ console.error("listener error:",err); iceInfo.err="READ "+(err.code||err.message); renderIceDebug(); });
}
function startCallerCandidateListener(){ stopCallerCandidateListener(); if(callId) unsubscribeCallerCandidates=watchCandidates("callerCandidates",processedCallerCandidateIds,pendingCallerCandidates); }
function startReceiverCandidateListener(){ stopReceiverCandidateListener(); if(callId) unsubscribeReceiverCandidates=watchCandidates("receiverCandidates",processedReceiverCandidateIds,pendingReceiverCandidates); }

/* ===== OUTGOING CALL ===== */
function getCurrentCallerInformation(){
  return {
    callerName:getFirstValue(currentProfile.fullName,currentProfile.name,currentProfile.displayName,currentUser?.displayName,currentUser?.email,"Faith Connect Member"),
    callerPicture:getFirstValue(currentProfile.profilePicture,currentProfile.picture,currentProfile.photoURL,currentProfile.photoUrl,currentUser?.photoURL,"images/profile.png"),
    callerCountry:getFirstValue(currentProfile.country,currentProfile.location)
  };
}

async function prepareOutgoingCall(){
  if(!otherMemberId||otherMemberId===currentUser.uid){ showCallError("You cannot start a voice call with this account."); return; }
  otherMemberProfile=await loadUserProfile(otherMemberId);
  displayOtherMember();
  updateCallStatus("ringing","Starting voice call...");
  memberAvatarFrame.classList.add("ringing");
  updateConnectionDisplay("connecting");
  endCallButton.disabled=false;
  await startOutgoingCall();
}

async function startOutgoingCall(){
  if(outgoingCallStarted||callActionRunning) return;
  outgoingCallStarted=true; callActionRunning=true;
  hideCallMessage();
  headerSubtitle.textContent="Outgoing private voice call";
  try{
    const connection=await createPeerConnection();
    const ref=doc(collection(db,"voiceCalls"));
    callId=ref.id;
    const caller=getCurrentCallerInformation();
    const receiverName=getFirstValue(otherMemberProfile.fullName,otherMemberProfile.name,otherMemberProfile.displayName,"Faith Connect Member");
    const receiverPicture=getFirstValue(otherMemberProfile.profilePicture,otherMemberProfile.picture,otherMemberProfile.photoURL,otherMemberProfile.photoUrl,"images/profile.png");

    connection.addEventListener("icecandidate",async event=>{
      if(!event.candidate||!callId) return;
      try{ await addDoc(collection(db,"voiceCalls",callId,"callerCandidates"),event.candidate.toJSON()); }
      catch(e){ console.error("Caller ICE save error:",e); iceInfo.err="WRITE "+(e.code||e.message); renderIceDebug(); }
    });

    const offerDescription=await connection.createOffer({offerToReceiveAudio:true});
    await connection.setLocalDescription(offerDescription);
    const offer={type:offerDescription.type,sdp:offerDescription.sdp};

    await setDoc(ref,{
      callerId:currentUser.uid,callerName:caller.callerName,callerPicture:caller.callerPicture,callerCountry:caller.callerCountry,
      receiverId:otherMemberId,receiverName,receiverPicture,
      type:"voice",callType:"voice",status:"ringing",offer,answer:null,
      acceptedAt:null,endedAt:null,endedBy:null,
      createdAt:serverTimestamp(),updatedAt:serverTimestamp()
    });

    callData={id:callId,callerId:currentUser.uid,receiverId:otherMemberId,status:"ringing",offer};
    startCallDocumentListener();
    startReceiverCandidateListener();
    updateCallStatus("ringing","Ringing...");
    showCallMessage("Calling "+receiverName+"...");
    outgoingCallControls.classList.remove("hidden");
    incomingCallControls.classList.remove("show");
    activeCallControls.classList.add("hidden");
    console.log("Outgoing voice call created:",callId);
  }catch(error){
    console.error("Outgoing call error:",error);
    outgoingCallStarted=false;
    if(/microphone/i.test(error?.message||"")) showCallError(error.message);
    else if(error?.code==="permission-denied") showCallError("Firebase denied permission to create the voice call.");
    else showCallError("The voice call could not be started. Please try again.");
    cleanupPeerConnection(); cleanupLocalMedia();
  }finally{ callActionRunning=false; }
}

/* ===== INCOMING CALL ===== */
async function prepareIncomingCall(){
  try{
    const snap=await getDoc(doc(db,"voiceCalls",callId));
    if(!snap.exists()){ showCallError("This voice call no longer exists."); return; }
    callData={id:snap.id,...snap.data()};
    if(callData.receiverId!==currentUser.uid){ showCallError("You are not the receiver of this voice call."); return; }
    const st=getFirstValue(callData.status,"ringing").toLowerCase();
    if(FINAL_STATUSES.includes(st)){ showCallError("This voice call has already ended."); return; }
    otherMemberId=callData.callerId;
    otherMemberProfile=await loadUserProfile(otherMemberId);
    displayOtherMember();
    updateCallStatus("ringing","Incoming voice call");
    headerSubtitle.textContent="Incoming private voice call";
    memberAvatarFrame.classList.add("ringing");
    updateConnectionDisplay("connecting");
    incomingCallControls.classList.add("show");
    outgoingCallControls.classList.add("hidden");
    activeCallControls.classList.add("hidden");
    permissionNotice.classList.remove("hidden");
    startCallDocumentListener();
  }catch(error){
    console.error("Incoming call loading error:",error);
    showCallError("The incoming voice call could not be opened.");
  }
}

async function acceptIncomingCall(){
  if(callActionRunning||!currentUser||!callId) return;
  callActionRunning=true;
  acceptCallButton.disabled=true; rejectCallButton.disabled=true; acceptCallButton.textContent="…";
  hideCallMessage();
  updateCallStatus("ringing","Connecting...");
  updateConnectionDisplay("connecting");
  try{
    const ref=doc(db,"voiceCalls",callId);
    const snap=await getDoc(ref);
    if(!snap.exists()) throw new Error("This voice call no longer exists.");
    const latest=snap.data();
    if(latest.receiverId!==currentUser.uid) throw new Error("You are not allowed to accept this call.");
    if(FINAL_STATUSES.includes(getFirstValue(latest.status).toLowerCase())) throw new Error("This voice call has already ended.");
    if(!latest.offer) throw new Error("The caller's voice connection information is missing.");
    callData={id:callId,...latest};

    const connection=await createPeerConnection();
    connection.addEventListener("icecandidate",async event=>{
      if(!event.candidate||!callId) return;
      try{ await addDoc(collection(db,"voiceCalls",callId,"receiverCandidates"),event.candidate.toJSON()); }
      catch(e){ console.error("Receiver ICE save error:",e); iceInfo.err="WRITE "+(e.code||e.message); renderIceDebug(); }
    });

    await connection.setRemoteDescription(new RTCSessionDescription(latest.offer));
    startCallerCandidateListener();
    const answerDescription=await connection.createAnswer();
    await connection.setLocalDescription(answerDescription);
    const answer={type:answerDescription.type,sdp:answerDescription.sdp};

    await updateDoc(ref,{answer,status:"accepted",acceptedAt:serverTimestamp(),updatedAt:serverTimestamp()});
    callData.answer=answer; callData.status="accepted";
    startCallDocumentListener();

    incomingCallControls.classList.remove("show");
    outgoingCallControls.classList.remove("hidden");
    activeCallControls.classList.remove("hidden");
    endCallButton.disabled=false;
    memberAvatarFrame.classList.remove("ringing");
    showCallMessage("Voice call accepted. Connecting audio...");
    remoteAudio.play().catch(()=>{});
  }catch(error){
    console.error("Accept error:",error);
    if(error?.code==="permission-denied") showCallError("Firebase denied permission to accept this voice call.");
    else showCallError(error?.message||"The voice call could not be accepted.");
    cleanupPeerConnection(); cleanupLocalMedia(); cleanupRemoteAudio();
  }finally{
    callActionRunning=false;
    acceptCallButton.disabled=false; rejectCallButton.disabled=false; acceptCallButton.textContent="📞";
  }
}

async function rejectIncomingCall(){
  if(callActionRunning||!currentUser||!callId) return;
  callActionRunning=true;
  acceptCallButton.disabled=true; rejectCallButton.disabled=true; rejectCallButton.textContent="…";
  try{
    await updateDoc(doc(db,"voiceCalls",callId),{status:"rejected",endedAt:serverTimestamp(),endedBy:currentUser.uid,updatedAt:serverTimestamp()});
    callFinished=true;
    updateCallStatus("ended","Call rejected"); updateConnectionDisplay("ended");
    memberAvatarFrame.classList.remove("ringing");
    incomingCallControls.classList.remove("show"); activeCallControls.classList.add("hidden");
    outgoingCallControls.classList.remove("hidden"); endCallButton.disabled=true;
    showCallMessage("You rejected this voice call.");
    cleanupVoiceCallResources();
    setTimeout(()=>{ window.location.href="messages.html"; },1200);
  }catch(error){
    console.error("Reject error:",error);
    showCallMessage(error?.code==="permission-denied"?"Firebase denied permission to reject this call.":"The voice call could not be rejected.",true);
    acceptCallButton.disabled=false; rejectCallButton.disabled=false; rejectCallButton.textContent="📵";
  }finally{ callActionRunning=false; }
}
acceptCallButton.addEventListener("click",acceptIncomingCall);
rejectCallButton.addEventListener("click",rejectIncomingCall);

/* ===== ANSWER (caller) — flag set BEFORE await to avoid a race ===== */
async function applyReceiverAnswer(answerData){
  if(callRole!=="caller"||!answerData||!peerConnection||receiverAnswerApplied) return;
  receiverAnswerApplied=true;
  try{
    await peerConnection.setRemoteDescription(new RTCSessionDescription(answerData));
    await applyPendingCandidates(pendingReceiverCandidates);
    updateConnectionDisplay("connecting");
    updateCallStatus("ringing","Connecting...");
    hideCallMessage();
    console.log("Receiver answer applied.");
  }catch(error){
    receiverAnswerApplied=false;
    console.error("Answer error:",error);
    showCallMessage("The receiver answered, but the voice connection could not be completed.",true);
    updateConnectionDisplay("failed");
  }
}

/* ===== LIVE CALL DOCUMENT ===== */
function finishCallScreen(statusText,messageText){
  callFinished=true;
  stopCallTimer();
  memberAvatarFrame.classList.remove("ringing");
  incomingCallControls.classList.remove("show");
  activeCallControls.classList.add("hidden");
  outgoingCallControls.classList.remove("hidden");
  muteButton.disabled=true; speakerButton.disabled=true; audioRouteButton.disabled=true; endCallButton.disabled=true;
  updateCallStatus("ended",statusText); updateConnectionDisplay("ended");
  if(messageText) showCallMessage(messageText);
  cleanupVoiceCallResources();
}

async function handleLiveCallStatus(status,d){
  if(callFinished) return;
  switch(status){
    case "ringing":
      updateCallStatus("ringing",callRole==="caller"?"Ringing...":"Incoming voice call");
      updateConnectionDisplay("connecting");
      memberAvatarFrame.classList.add("ringing");
      if(callRole==="receiver"){
        incomingCallControls.classList.add("show"); outgoingCallControls.classList.add("hidden"); activeCallControls.classList.add("hidden");
      }else{
        incomingCallControls.classList.remove("show"); outgoingCallControls.classList.remove("hidden");
        activeCallControls.classList.add("hidden"); endCallButton.disabled=false;
      }
      break;
    case "accepted":
    case "connecting":
      memberAvatarFrame.classList.remove("ringing");
      incomingCallControls.classList.remove("show");
      outgoingCallControls.classList.remove("hidden");
      activeCallControls.classList.remove("hidden");
      endCallButton.disabled=false;
      if(!peerConnection||peerConnection.connectionState!=="connected"){
        updateCallStatus("ringing","Connecting...");
        updateConnectionDisplay("connecting");
      }
      if(callRole==="caller"){
        if(d.answer&&!receiverAnswerApplied) await applyReceiverAnswer(d.answer);
        await applyPendingCandidates(pendingReceiverCandidates);
      }else{
        await applyPendingCandidates(pendingCallerCandidates);
      }
      break;
    case "connected":
      memberAvatarFrame.classList.remove("ringing");
      if(callRole==="caller"&&d.answer&&!receiverAnswerApplied) await applyReceiverAnswer(d.answer);
      if(peerConnection&&peerConnection.connectionState==="connected"){
        updateCallStatus("connected","Connected"); updateConnectionDisplay("connected");
        enableConnectedCallControls(); startCallTimer();
      }
      break;
    case "rejected": finishCallScreen("Call rejected",callRole==="caller"?"The member rejected your voice call.":"You rejected this voice call."); break;
    case "cancelled": finishCallScreen("Call cancelled",callRole==="receiver"?"The caller cancelled the voice call.":"The voice call was cancelled."); break;
    case "ended":{
      const by=getFirstValue(d.endedBy);
      let msg="The voice call has ended.";
      if(currentUser&&by===currentUser.uid) msg="You ended the voice call."; else if(by) msg="The other member ended the voice call.";
      finishCallScreen("Call ended",msg); break;
    }
    case "missed": finishCallScreen("Missed call",callRole==="caller"?"The member did not answer your voice call.":"You missed this voice call."); break;
    case "failed":
      updateCallStatus("ended","Connection failed"); updateConnectionDisplay("failed");
      showCallMessage("The voice connection failed. End the call and try again.",true);
      endCallButton.disabled=false; break;
    default: console.log("Unknown status:",status);
  }
}

async function processCallDocument(d){
  if(!d) return;
  callData={id:callId,...d};
  const status=getFirstValue(d.status,"ringing").toLowerCase();
  if(callRole==="caller"&&d.answer&&!receiverAnswerApplied) await applyReceiverAnswer(d.answer);
  await handleLiveCallStatus(status,d);
  if(status!=="connected"||lastCallStatus!=="connected") lastCallStatus=status;
}

function startCallDocumentListener(){
  stopCallDocumentListener();
  if(!callId) return;
  unsubscribeCall=onSnapshot(doc(db,"voiceCalls",callId),async snap=>{
    if(!snap.exists()){ showCallError("This voice call no longer exists."); cleanupVoiceCallResources(); return; }
    try{ await processCallDocument(snap.data()); }catch(e){ console.error("Call document error:",e); }
  },error=>{
    console.error("Call document listener error:",error);
    if(error?.code==="permission-denied") showCallError("Firebase denied access to this voice call.");
    else showCallMessage("The live call status could not be updated.",true);
  });
}

/* ===== MUTE / SPEAKER / AUDIO ROUTE ===== */
muteButton.addEventListener("click",()=>{
  if(!localStream) return;
  const tracks=localStream.getAudioTracks(); if(!tracks.length) return;
  microphoneMuted=!microphoneMuted;
  tracks.forEach(t=>{ t.enabled=!microphoneMuted; });
  muteButton.classList.toggle("warning",microphoneMuted);
  muteButton.classList.toggle("active",!microphoneMuted);
  muteIcon.textContent=microphoneMuted?"🔇":"🎙️";
  muteLabel.textContent=microphoneMuted?"Unmute":"Mute";
});

speakerButton.addEventListener("click",()=>{
  speakerMuted=!speakerMuted;
  remoteAudio.muted=speakerMuted;
  speakerButton.classList.toggle("warning",speakerMuted);
  speakerButton.classList.toggle("active",!speakerMuted);
  speakerIcon.textContent=speakerMuted?"🔈":"🔊";
  speakerLabel.textContent=speakerMuted?"Unmute Sound":"Speaker";
  if(!speakerMuted) remoteAudio.play().catch(()=>{});
});

audioRouteButton.addEventListener("click",async()=>{
  if(typeof remoteAudio.setSinkId==="function"&&navigator.mediaDevices?.enumerateDevices){
    try{
      const devices=await navigator.mediaDevices.enumerateDevices();
      const outs=devices.filter(d=>d.kind==="audiooutput");
      if(outs.length>1){
        const list=outs.map((d,i)=>(i+1)+". "+(d.label||"Audio output "+(i+1))).join("\n");
        const v=window.prompt("Choose an audio output:\n\n"+list,"1");
        if(v===null) return;
        const idx=Number(v)-1;
        if(!Number.isInteger(idx)||!outs[idx]){ alert("Please select a valid audio output number."); return; }
        await remoteAudio.setSinkId(outs[idx].deviceId);
        return;
      }
    }catch(e){ console.error("Audio output error:",e); }
  }
  alert("Use your phone's volume, speaker, Bluetooth or headphone controls to choose the audio output.");
});

/* Mobile browsers block autoplay until a tap — unlock on first touch */
document.addEventListener("click",()=>{ if(remoteAudio.srcObject) remoteAudio.play().catch(()=>{}); });

/* ===== END CALL ===== */
function getCallEndStatus(){
  const st=getFirstValue(callData.status,lastCallStatus,"ringing").toLowerCase();
  if(st==="ringing"&&callRole==="caller") return "cancelled";
  if(st==="ringing"&&callRole==="receiver") return "rejected";
  return "ended";
}

async function endVoiceCall(forcedStatus=""){
  if(callActionRunning||pageIsClosing||callFinished) return;
  callActionRunning=true;
  endCallButton.disabled=true; acceptCallButton.disabled=true; rejectCallButton.disabled=true;
  const finalStatus=forcedStatus||getCallEndStatus();
  callFinished=true;
  try{
    if(callId) await updateDoc(doc(db,"voiceCalls",callId),{status:finalStatus,endedAt:serverTimestamp(),endedBy:currentUser?.uid||"",updatedAt:serverTimestamp()});
  }catch(e){ console.error("End call error:",e); }

  memberAvatarFrame.classList.remove("ringing");
  incomingCallControls.classList.remove("show"); activeCallControls.classList.add("hidden"); outgoingCallControls.classList.remove("hidden");
  updateConnectionDisplay("ended");
  if(finalStatus==="cancelled"){ updateCallStatus("ended","Call cancelled"); showCallMessage("You cancelled the voice call."); }
  else if(finalStatus==="rejected"){ updateCallStatus("ended","Call rejected"); showCallMessage("You rejected the voice call."); }
  else{ updateCallStatus("ended","Call ended"); showCallMessage("The voice call has ended."); }
  cleanupVoiceCallResources(); resetIceCandidateState();
  callActionRunning=false;
  setTimeout(leaveToPreviousPage,900);
}
endCallButton.addEventListener("click",()=>endVoiceCall());

backButton.addEventListener("click",async()=>{
  if(isCallActive()){ minimizeCall(); return; }
  if(callId&&!pageIsClosing&&!callFinished){ await endVoiceCall(); return; }
  if(window.history.length>1) window.history.back(); else window.location.href="messages.html";
});

/* ===== PAGE LEAVE: cancel a call that is still ringing ===== */
function leavePage(){
  if(pageIsClosing) return;
  pageIsClosing=true;
  if(callId&&currentUser&&!callFinished){
    const st=getFirstValue(callData.status,lastCallStatus,"ringing").toLowerCase();
    const nextStatus=FINAL_STATUSES.includes(st)?"":(st==="ringing"?(callRole==="caller"?"cancelled":"rejected"):"ended");
    if(nextStatus){
      updateDoc(doc(db,"voiceCalls",callId),{status:nextStatus,endedAt:serverTimestamp(),endedBy:currentUser.uid,updatedAt:serverTimestamp()}).catch(()=>{});
    }
  }
  cleanupVoiceCallResources(); resetIceCandidateState();
}
window.addEventListener("pagehide",leavePage);
window.addEventListener("beforeunload",leavePage);
window.addEventListener("pageshow",e=>{ if(e.persisted) window.location.reload(); });

/* =====================================================
   MINIMIZE: keep the call running while the member uses
   other pages (chat, feed...) inside a window under a
   green "tap to return" bar. Also: screen stays awake,
   system Back button never kills an active call.
   ===================================================== */
const MINI_HOME="messages.html";
const miniBar=document.createElement("div");
miniBar.id="miniBar"; miniBar.className="hidden";
miniBar.innerHTML='<button type="button" id="miniReturn" class="miniReturn"><span class="miniDot"></span><span id="miniName"></span><span id="miniTime">00:00</span><span class="miniHint">Tap to return</span></button><button type="button" id="miniEnd" class="miniEnd" aria-label="End call">📵</button>';
const appFrame=document.createElement("iframe");
appFrame.id="appFrame"; appFrame.className="hidden"; appFrame.setAttribute("title","Faith Connect");
document.body.append(appFrame,miniBar);
let callMinimized=false,guardPushed=false,wakeLock=null;

function isCallActive(){
  if(callFinished||!callId) return false;
  const st=getFirstValue(callData&&callData.status,lastCallStatus,"").toLowerCase();
  return st==="accepted"||st==="connected"||Boolean(peerConnection&&peerConnection.connectionState==="connected");
}
function showMiniToast(text){
  let t=document.getElementById("miniToast");
  if(!t){ t=document.createElement("div"); t.id="miniToast"; document.body.appendChild(t); }
  t.textContent=text; t.classList.remove("hidden");
  clearTimeout(showMiniToast.timer); showMiniToast.timer=setTimeout(()=>t.classList.add("hidden"),2800);
}
function minimizeCall(){
  if(!isCallActive()||callMinimized) return;
  callMinimized=true;
  const n=document.getElementById("memberName");
  document.getElementById("miniName").textContent=(n&&n.textContent)||"Call";
  document.getElementById("miniTime").textContent=callTimer.textContent||"00:00";
  document.body.classList.add("callMinimized");
  if(!appFrame.getAttribute("src")) appFrame.setAttribute("src",MINI_HOME);
  appFrame.classList.remove("hidden"); miniBar.classList.remove("hidden");
}
function expandCall(){
  if(!callMinimized) return;
  callMinimized=false;
  document.body.classList.remove("callMinimized");
  appFrame.classList.add("hidden"); miniBar.classList.add("hidden");
  try{ playRemoteMedia&&playRemoteMedia(); }catch(e){}
}
appFrame.addEventListener("load",()=>{
  try{
    if(/(voice|video)-call\.html$/.test(appFrame.contentWindow.location.pathname)){
      appFrame.setAttribute("src",MINI_HOME);
      showMiniToast("You are already in a call. End it first.");
    }
  }catch(e){}
});
document.getElementById("miniReturn").addEventListener("click",expandCall);
document.getElementById("miniEnd").addEventListener("click",()=>{ expandCall(); endVoiceCall(); });
const minimizeButton=document.getElementById("minimizeButton");
if(minimizeButton) minimizeButton.addEventListener("click",()=>{
  if(isCallActive()) minimizeCall(); else showMiniToast("You can minimize once the call is connected.");
});

/* Android Back button: minimize / expand instead of leaving the page */
window.addEventListener("popstate",()=>{
  if(!guardPushed) return;
  if(isCallActive()){ history.pushState({callGuard:1},""); callMinimized?expandCall():minimizeCall(); }
  else guardPushed=false;
});
/* Screen stays on during a call */
async function keepAwake(){
  try{
    if("wakeLock" in navigator&&!wakeLock&&document.visibilityState==="visible"){
      wakeLock=await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release",()=>{ wakeLock=null; });
    }
  }catch(e){ wakeLock=null; }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&isCallActive()) keepAwake(); });
setInterval(()=>{
  if(!isCallActive()) return;
  if(!guardPushed){ history.pushState({callGuard:1},""); guardPushed=true; }
  keepAwake();
  if(callMinimized) document.getElementById("miniTime").textContent=callTimer.textContent||"00:00";
},1000);
function leaveToPreviousPage(){
  let target=MINI_HOME;
  try{ if(document.referrer&&new URL(document.referrer).origin===location.origin&&!/-call\.html/.test(document.referrer)) target=document.referrer; }catch(e){}
  window.location.replace(target);
}


/* ===== START ===== */
if(!urlIsValid){
  showCallError("The voice-call information is missing.");
}else{
  onAuthStateChanged(auth,async user=>{
    currentUser=user||null;
    if(!currentUser){ window.location.href="login.html"; return; }
    currentProfile=await loadUserProfile(currentUser.uid);
    if(callRole==="caller") await prepareOutgoingCall(); else await prepareIncomingCall();
  },error=>{
    console.error("Authentication error:",error);
    showCallError("Your account could not be confirmed. Please sign in again.");
  });
}
console.log("Faith Connect voice-call page ready.");
