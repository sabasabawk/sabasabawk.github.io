<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="description"
  content="SABASABA Gospel Ministry Community Wall"
>

<title>
  Community Wall | SABASABA Gospel Ministry
</title>

<link rel="stylesheet" href="feed.css">


</head>
<!-- =====================================================
   PART 5 OF 10
   COMPLETE HTML PAGE STRUCTURE
===================================================== -->

<body>


<!-- =====================================================
   TOP APPLICATION BAR
===================================================== -->

<nav class="appTopBar">

  <div class="appTopBarInner">

    <a
      href="index.html"
      class="appBrand"
    >

      <span class="appBrandText">
        Faith Connect
      </span>

    </a>


    <div class="topBarActions">

      <a
        href="members.html"
        class="topIconLink"
        aria-label="Search community members"
        title="Search members"
      >
        🔍
      </a>


      <a
        href="notification.html"
        class="topIconLink"
        aria-label="Open notifications"
        title="Notifications"
      >
        🔔

        <span
          id="notificationBadge"
          class="notificationBadge"
          aria-label="Unread notifications"
        >
          0
        </span>
      </a>


      <a
        href="messages.html"
        class="topIconLink"
        aria-label="Open conversations"
        title="Messages"
      >
        💬
      </a>

    </div>

  </div>

</nav>


<!-- =====================================================
   MAIN PAGE CONTENT
===================================================== -->

<div class="pageContainer">


  <!-- =================================================
       MOMENTS STRIP (like Facebook/Instagram Stories)
  ================================================== -->

  <section class="momentsSection">

    <div
      id="momentsRow"
      class="momentsRow"
      aria-label="Faith Moments"
    >

      <a
        href="create-faith-moment.html"
        class="momentCard createMomentCard"
      >

        <div
          id="quickMomentAvatar"
          class="createMomentCardTop"
        ></div>

        <div class="createMomentCardPlusButton">
          ＋
        </div>

        <div class="createMomentCardBottom">
          Create Moment
        </div>

      </a>

    </div>

  </section>


  <!-- =================================================
       POSTS CONTAINER
  ================================================== -->

  <main id="postsContainer">

    <div class="statusCard loading">
      Loading community posts...
    </div>

  </main>


  <!-- =================================================
       LOAD MORE SENTINEL
       (invisible marker — triggers loading the
       next batch of older posts when scrolled
       into view; also shows "no more posts")
  ================================================== -->

  <div id="loadMoreSentinel"></div>

</div>


<!-- =====================================================
   FLOATING CREATE POST BUTTON
===================================================== -->

<a
  href="createpost.html"
  class="floatingCreateButton"
  aria-label="Create a new post"
  title="Create post"
>
  +
</a>


<!-- =====================================================
   BOTTOM NAVIGATION
===================================================== -->

<nav class="bottomNavigation">

  <div class="bottomNavigationInner">


    <a
      href="index.html"
      class="bottomNavItem"
    >

      <span class="bottomNavIcon">
        🏠
      </span>

      <span>
        Home
      </span>

    </a>


    <a
      href="learn.html"
      class="bottomNavItem"
    >

      <span class="bottomNavIcon">
        📚
      </span>

      <span>
        Learn
      </span>

    </a>


    <a
      href="groups.html"
      class="bottomNavItem"
    >

      <span class="bottomNavIcon">
        📖
      </span>

      <span>
        Groups
      </span>

    </a>


    <a
      href="faith-moments.html"
      class="bottomNavItem"
    >

      <span class="bottomNavIcon">
        🌅
      </span>

      <span>
        Moments
      </span>

    </a>


    <a
      href="prayer-wall.html"
      class="bottomNavItem"
    >

      <span class="bottomNavIcon">
        🙏
      </span>

      <span>
        Prayer
      </span>

    </a>


    <a
      href="profile.html"
      class="bottomNavItem"
    >

      <span class="bottomNavIcon">
        👤
      </span>

      <span>
        Profile
      </span>

    </a>

  </div>

</nav>


<!-- =====================================================
   FULLSCREEN PHOTO VIEWER
===================================================== -->

<div
  id="photoViewer"
  aria-hidden="true"
  role="dialog"
  aria-modal="true"
  aria-label="Community post photo viewer"
>

  <button
    type="button"
    id="closePhotoViewer"
    aria-label="Close photo viewer"
  >
    ×
  </button>


  <button
    type="button"
    id="photoViewerPrevButton"
    class="photoViewerNavButton photoViewerPrevButton hidden"
    aria-label="Previous photo"
  >
    ‹
  </button>


  <button
    type="button"
    id="photoViewerNextButton"
    class="photoViewerNavButton photoViewerNextButton hidden"
    aria-label="Next photo"
  >
    ›
  </button>


  <div
    id="photoViewerCounter"
    class="photoViewerCounter hidden"
  ></div>


  <img
    id="photoViewerImage"
    src=""
    alt="Full-size community post photo"
  >


  <video
    id="photoViewerVideo"
    controls
    playsinline
  ></video>

</div>


<!-- =====================================================
   REELS-STYLE VIDEO VIEWER
   (tap a video once, then scroll down for the
   next one — each plays automatically with sound,
   no need to tap again, like Instagram Reels)
===================================================== -->

<div
  id="videoReelViewer"
  class="videoReelViewer"
  aria-hidden="true"
  role="dialog"
  aria-modal="true"
  aria-label="Video viewer"
>

  <button
    type="button"
    id="closeVideoReelViewer"
    class="closeReelButton"
    aria-label="Close video viewer"
  >
    ×
  </button>


  <div
    id="videoReelTrack"
    class="videoReelTrack"
  ></div>

</div>


<!-- =====================================================
   REPORT POST MODAL
===================================================== -->

<div
  id="reportModal"
  aria-hidden="true"
  role="dialog"
  aria-modal="true"
  aria-label="Report this post"
>

  <div class="reportModalCard">

    <h2>
      🚩 Report this post
    </h2>

    <p>
      Let us know why you're reporting this post. Our
      team will review it.
    </p>


    <div id="reportReasonList">

      <button
        type="button"
        class="reportReasonOption"
        data-reason="Spam"
      >
        Spam or misleading
      </button>

      <button
        type="button"
        class="reportReasonOption"
        data-reason="Abusive language"
      >
        Abusive or hateful language
      </button>

      <button
        type="button"
        class="reportReasonOption"
        data-reason="False teaching"
      >
        False teaching or misinformation
      </button>

      <button
        type="button"
        class="reportReasonOption"
        data-reason="Inappropriate content"
      >
        Inappropriate content
      </button>

      <button
        type="button"
        class="reportReasonOption"
        data-reason="Other"
      >
        Other
      </button>

    </div>


    <div class="reportModalActions">

      <button
        type="button"
        id="reportCancelButton"
      >
        Cancel
      </button>

      <button
        type="button"
        id="reportSubmitButton"
        disabled
      >
        Submit report
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
   OPEN JAVASCRIPT MODULE
===================================================== -->

<script type="module" src="feed.js"></script>
<script src="swipe-nav.js"></script>
</body>

</html>
