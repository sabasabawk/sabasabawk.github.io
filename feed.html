<script type="module">
/* =====================================================
   PART 4 OF 6
   FIREBASE SETUP, USER PROFILE AND POST LOADING
===================================================== */


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  auth,
  db,
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  onAuthStateChanged
} from "./firebase.js";


import {
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const postsContainer =
document.getElementById(
  "postsContainer"
);


const refreshButton =
document.getElementById(
  "refreshButton"
);


const quickPostButton =
document.getElementById(
  "quickPostButton"
);


const quickPostAvatar =
document.getElementById(
  "quickPostAvatar"
);


const photoViewer =
document.getElementById(
  "photoViewer"
);


const photoViewerImage =
document.getElementById(
  "photoViewerImage"
);


const closePhotoViewerButton =
document.getElementById(
  "closePhotoViewer"
);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let currentUserProfile = {};

let unsubscribePosts = null;

const likeListeners =
new Map();


const defaultProfilePicture =
"images/profile.png";


/* =====================================================
   GET FIRST AVAILABLE VALUE
===================================================== */

function getFirstValue(...values){

  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value).trim();

    }

  }

  return "";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  const temporaryElement =
  document.createElement("div");


  temporaryElement.textContent =
  String(value ?? "");


  return temporaryElement.innerHTML;

}


/* =====================================================
   STATUS MESSAGES
===================================================== */

function showLoadingMessage(){

  postsContainer.innerHTML = `

    <div class="statusCard">

      Loading community posts...

    </div>

  `;

}


function showEmptyMessage(){

  postsContainer.innerHTML = `

    <div class="statusCard empty">

      No community posts are available yet.

      <br><br>

      Be the first person to share encouragement,
      testimony or prayer.

    </div>

  `;

}


function showErrorMessage(message){

  postsContainer.innerHTML = `

    <div class="statusCard error">

      ${escapeHTML(message)}

    </div>

  `;

}


/* =====================================================
   IMAGE FALLBACK
===================================================== */

function addProfileImageFallback(
  imageElement
){

  if(!imageElement){

    return;

  }


  imageElement.addEventListener(
    "error",
    ()=>{

      /*
        Prevent an endless error loop if the
        default profile image is also missing.
      */

      imageElement.onerror = null;


      imageElement.src =
      defaultProfilePicture;

    },
    {
      once:true
    }
  );

}


/* =====================================================
   LOAD CURRENT USER PROFILE
===================================================== */

async function loadCurrentUserProfile(){

  currentUserProfile = {};


  if(!currentUser){

    if(quickPostAvatar){

      quickPostAvatar.src =
      defaultProfilePicture;

    }

    return;

  }


  try{

    const profileReference =
    doc(
      db,
      "users",
      currentUser.uid
    );


    const profileSnapshot =
    await getDoc(
      profileReference
    );


    if(profileSnapshot.exists()){

      currentUserProfile =
      profileSnapshot.data();

    }


    const profilePicture =
    getFirstValue(
      currentUserProfile.profilePicture,
      currentUserProfile.picture,
      currentUserProfile.photoURL,
      currentUserProfile.profileImage,
      currentUserProfile.profilePhoto,
      currentUser.photoURL,
      defaultProfilePicture
    );


    if(quickPostAvatar){

      quickPostAvatar.src =
      profilePicture;

    }

  }catch(error){

    console.error(
      "Current user profile loading error:",
      error
    );


    if(quickPostAvatar){

      quickPostAvatar.src =
      defaultProfilePicture;

    }

  }

}


/* =====================================================
   QUICK CREATE POST BUTTON
===================================================== */

if(quickPostButton){

  quickPostButton.addEventListener(
    "click",
    ()=>{

      if(!currentUser){

        window.location.href =
        "login.html";

        return;

      }


      window.location.href =
      "createpost.html";

    }
  );

}


/* =====================================================
   QUICK PROFILE IMAGE FALLBACK
===================================================== */

addProfileImageFallback(
  quickPostAvatar
);


/* =====================================================
   AUTHENTICATION STATE
===================================================== */

onAuthStateChanged(
  auth,
  async(user)=>{

    currentUser =
    user || null;


    await loadCurrentUserProfile();


    initializeFeed();

  }
);


/* =====================================================
   STOP OLD POST LISTENER
===================================================== */

function stopPostsListener(){

  if(unsubscribePosts){

    unsubscribePosts();

    unsubscribePosts = null;

  }

}


/* =====================================================
   STOP ALL LIKE LISTENERS
===================================================== */

function stopAllLikeListeners(){

  for(
    const unsubscribeLike
    of likeListeners.values()
  ){

    unsubscribeLike();

  }


  likeListeners.clear();

}


/* =====================================================
   INITIALIZE FEED
===================================================== */

function initializeFeed(){

  stopPostsListener();

  stopAllLikeListeners();

  loadCommunityPosts();

}


/* =====================================================
   LOAD COMMUNITY POSTS
===================================================== */

function loadCommunityPosts(){

  showLoadingMessage();

  stopPostsListener();

  stopAllLikeListeners();


  try{

    const postsReference =
    collection(
      db,
      "communityPosts"
    );


    const postsQuery =
    query(
      postsReference,
      orderBy(
        "timestamp",
        "desc"
      )
    );


    unsubscribePosts =
    onSnapshot(

      postsQuery,

      async(snapshot)=>{

        try{

          if(snapshot.empty){

            showEmptyMessage();

            return;

          }


          postsContainer.innerHTML = "";


          for(
            const postDocument
            of snapshot.docs
          ){

            const postData = {

              id:
              postDocument.id,

              ...postDocument.data()

            };


            const postCard =
            await createPostCard(
              postData
            );


            postsContainer.appendChild(
              postCard
            );

          }


          window.setTimeout(
            scrollToSharedPost,
            300
          );

        }catch(error){

          console.error(
            "Post display error:",
            error
          );


          showErrorMessage(
            error.message ||
            "Posts were found, but they could not be displayed."
          );

        }

      },

      (error)=>{

        console.error(
          "Firestore post-loading error:",
          error
        );


        let message =
        "Community posts could not be loaded.";


        if(
          error.code ===
          "permission-denied"
        ){

          message =
          "Firebase denied permission to read community posts.";

        }else if(
          error.code ===
          "failed-precondition"
        ){

          message =
          "Firebase requires a Firestore index for this query.";

        }else if(
          error.code ===
          "unavailable"
        ){

          message =
          "Firebase is temporarily unavailable. Please check your internet connection.";

        }else if(error.message){

          message =
          error.message;

        }


        showErrorMessage(
          message
        );

      }

    );

  }catch(error){

    console.error(
      "Community feed initialization error:",
      error
    );


    showErrorMessage(
      error.message ||

/* =====================================================
   FORMAT POST DATE
===================================================== */

function formatPostDate(value){

  if(!value){

    return "Recently";

  }


  try{

    let date;


    if(
      typeof value.toDate ===
      "function"
    ){

      date =
      value.toDate();

    }else if(value.seconds){

      date =
      new Date(
        value.seconds * 1000
      );

    }else{

      date =
      new Date(value);

    }


    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return "Recently";

    }


    return date.toLocaleString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }catch(error){

    console.error(
      "Post date formatting error:",
      error
    );


    return "Recently";

  }

}

/* =====================================================
   LISTEN FOR LIKES
===================================================== */

function listenForLikes(
  postId,
  likeButton
){

  const oldListener =
  likeListeners.get(
    postId
  );


  if(oldListener){

    oldListener();

  }


  const likesReference =
  collection(
    db,
    "communityPosts",
    postId,
    "likes"
  );


  const unsubscribeLike =
  onSnapshot(

    likesReference,

    (snapshot)=>{

      const likeCount =
      snapshot.size;


      const currentUserLiked =
      Boolean(
        currentUser &&
        snapshot.docs.some(
          likeDocument =>
          likeDocument.id === currentUser.uid
        )
      );


      likeButton.classList.toggle(
        "liked",
        currentUserLiked
      );


      const likeIcon =
      currentUserLiked
      ? "❤️"
      : "🤍";


      likeButton.textContent =
      `${likeIcon} Like${likeCount > 0 ? ` (${likeCount})` : ""}`;

    },

    (error)=>{

      console.error(
        `Like listener error for post ${postId}:`,
        error
      );

    }

  );


  likeListeners.set(
    postId,
    unsubscribeLike
  );

}


/* =====================================================
   LIKE OR UNLIKE POST
===================================================== */

async function togglePostLike(
  postId,
  likeButton
){

  if(!currentUser){

    alert(
      "Please sign in before liking a post."
    );


    window.location.href =
    "login.html";


    return;

  }


  likeButton.disabled =
  true;


  try{

    const likeReference =
    doc(
      db,
      "communityPosts",
      postId,
      "likes",
      currentUser.uid
    );


    const likeSnapshot =
    await getDoc(
      likeReference
    );


    if(likeSnapshot.exists()){

      await deleteDoc(
        likeReference
      );

    }else{

      await setDoc(
        likeReference,
        {
          userId:
          currentUser.uid,

          timestamp:
          serverTimestamp()
        }
      );

    }

  }catch(error){

    console.error(
      "Like update error:",
      error
    );


    alert(
      error.message ||
      "The like could not be updated."
    );

  }finally{

    likeButton.disabled =
    false;

  }

}


/* =====================================================
   SHARE COMMUNITY POST
===================================================== */

async function shareCommunityPost(
  postId,
  message
){

  const postURL =
  `${window.location.origin}${window.location.pathname}?post=${encodeURIComponent(postId)}`;


  const shareData = {

    title:
    "SABASABA Gospel Ministry",

    text:
    message ||
    "View this Community Wall post.",

    url:
    postURL

  };


  try{

    if(navigator.share){

      await navigator.share(
        shareData
      );

      return;

    }


    await navigator.clipboard.writeText(
      postURL
    );


    alert(
      "Post link copied."
    );

  }catch(error){

    if(
      error.name !==
      "AbortError"
    ){

      console.error(
        "Post sharing error:",
        error
      );


      window.prompt(
        "Copy this post link:",
        postURL
      );

    }

  }

}


/* =====================================================
   EDIT COMMUNITY POST
===================================================== */

async function editCommunityPost(
  postId,
  oldMessage
){

  if(!currentUser){

    return;

  }


  const newMessage =
  window.prompt(
    "Edit your post:",
    oldMessage
  );


  if(newMessage === null){

    return;

  }


  const cleanedMessage =
  newMessage.trim();


  if(!cleanedMessage){

    alert(
      "The post message cannot be empty."
    );

    return;

  }


  try{

    const postReference =
    doc(
      db,
      "communityPosts",
      postId
    );


    const postSnapshot =
    await getDoc(
      postReference
    );


    if(!postSnapshot.exists()){

      alert(
        "This post no longer exists."
      );

      return;

    }


    const postData =
    postSnapshot.data();


    const ownerId =
    getFirstValue(
      postData.userId,
      postData.authorId,
      postData.uid
    );


    if(ownerId !== currentUser.uid){

      alert(
        "You can edit only your own posts."
      );

      return;

    }


    await updateDoc(
      postReference,
      {
        message:
        cleanedMessage,

        updatedAt:
        serverTimestamp()
      }
    );


    alert(
      "Post updated successfully."
    );

  }catch(error){

    console.error(
      "Post editing error:",
      error
    );


    alert(
      error.message ||
      "The post could not be updated."
    );

  }

}


/* =====================================================
   DELETE COMMUNITY POST
===================================================== */

async function deleteCommunityPost(
  postId
){

  if(!currentUser){

    return;

  }


  const confirmed =
  window.confirm(
    "Are you sure you want to delete this post?"
  );


  if(!confirmed){

    return;

  }


  try{

    const postReference =
    doc(
      db,
      "communityPosts",
      postId
    );


    const postSnapshot =
    await getDoc(
      postReference
    );


    if(!postSnapshot.exists()){

      alert(
        "This post has already been deleted."
      );

      return;

    }


    const postData =
    postSnapshot.data();


    const ownerId =
    getFirstValue(
      postData.userId,
      postData.authorId,
      postData.uid
    );


    if(ownerId !== currentUser.uid){

      alert(
        "You can delete only your own posts."
      );

      return;

    }


    await deleteDoc(
      postReference
    );


    alert(
      "Post deleted successfully."
    );

  }catch(error){

    console.error(
      "Post deletion error:",
      error
    );


    alert(
      error.message ||
      "The post could not be deleted."
    );

  }

}

/* =====================================================
   OPEN PHOTO VIEWER
===================================================== */

function openPhotoViewer(
  imageURL
){

  if(
    !photoViewer ||
    !photoViewerImage ||
    !imageURL
  ){

    return;

  }


  photoViewerImage.src =
  imageURL;


  photoViewer.classList.add(
    "open"
  );


  photoViewer.setAttribute(
    "aria-hidden",
    "false"
  );


  document.body.style.overflow =
  "hidden";

}


/* =====================================================
   CLOSE PHOTO VIEWER
===================================================== */

function closePhotoViewer(){

  if(
    !photoViewer ||
    !photoViewerImage
  ){

    return;

  }


  photoViewer.classList.remove(
    "open"
  );


  photoViewer.setAttribute(
    "aria-hidden",
    "true"
  );


  photoViewerImage.src =
  "";


  document.body.style.overflow =
  "";

}


/* =====================================================
   PHOTO VIEWER CLOSE BUTTON
===================================================== */

if(closePhotoViewerButton){

  closePhotoViewerButton.addEventListener(
    "click",
    closePhotoViewer
  );

}


/* =====================================================
   CLOSE VIEWER BY CLICKING BACKGROUND
===================================================== */

if(photoViewer){

  photoViewer.addEventListener(
    "click",
    event=>{

      if(
        event.target ===
        photoViewer
      ){

        closePhotoViewer();

      }

    }
  );

}


/* =====================================================
   CLOSE VIEWER WITH ESCAPE KEY
===================================================== */

document.addEventListener(
  "keydown",
  event=>{

    if(
      event.key ===
      "Escape"
    ){

      closePhotoViewer();

    }

  }
);


/* =====================================================
   SCROLL TO A SHARED POST
===================================================== */

function scrollToSharedPost(){

  const pageParameters =
  new URLSearchParams(
    window.location.search
  );


  const sharedPostId =
  pageParameters.get(
    "post"
  );


  if(!sharedPostId){

    return;

  }


  const sharedPost =
  document.getElementById(
    `post-${sharedPostId}`
  );


  if(!sharedPost){

    return;

  }


  sharedPost.scrollIntoView(
    {
      behavior:"smooth",
      block:"center"
    }
  );


  sharedPost.animate(
    [
      {
        transform:"scale(1)",
        boxShadow:
        "0 6px 20px rgba(0,0,0,.10)"
      },
      {
        transform:"scale(1.02)",
        boxShadow:
        "0 0 0 4px rgba(8,123,209,.28)"
      },
      {
        transform:"scale(1)",
        boxShadow:
        "0 6px 20px rgba(0,0,0,.10)"
      }
    ],
    {
      duration:1500,
      iterations:1
    }
  );

}

      element.classList &&
      element.classList.contains(
        "communityPostImage"
      )
    ){

    }

);


/* =====================================================
   PAUSE VIDEOS WHEN PAGE IS HIDDEN
===================================================== */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.visibilityState !==
      "hidden"
    ){

      return;

    }


    const videos =
    document.querySelectorAll(
      ".communityPostVideo"
    );


    videos.forEach(
      video=>{

        if(!video.paused){

          video.pause();

        }

      }
    );

  }
);
