<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"

<title>Community Wall</title>


<style>

/* =====================================================
   GENERAL PAGE
===================================================== */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  background:#eef3f8;
  color:#222;
}

button{
  font-family:inherit;
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.pageContainer{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:22px 18px 50px;
}


/* =====================================================
   COMMUNITY WALL HEADER
===================================================== */

.wallHeader{
  background:linear-gradient(
    135deg,
    #087bd1,
    #0055a5
  );
  color:white;
  padding:38px 24px;
  border-radius:30px;
  text-align:center;
  box-shadow:0 10px 24px rgba(0,0,0,.16);
}

.wallHeader h1{
  margin:0;
  font-size:42px;
  line-height:1.2;
}

.wallHeader p{
  margin:22px auto 0;
  max-width:560px;
  font-size:24px;
  line-height:1.55;
}


/* =====================================================
   REFRESH CONTROL
===================================================== */

.feedControls{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:28px 0;
}

#refreshButton{
  min-width:230px;
  padding:17px 30px;
  border:none;
  border-radius:18px;
  background:#22a943;
  color:white;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
}

#refreshButton:hover{
  background:#188b35;
}

#refreshButton:active{
  transform:scale(.98);
}

#refreshButton:disabled{
  opacity:.7;
  cursor:not-allowed;
}


/* =====================================================
   POSTS CONTAINER
===================================================== */

#postsContainer{
  width:100%;
}


/* =====================================================
   LOADING, EMPTY AND ERROR BOXES
===================================================== */

.statusCard{
  background:white;
  padding:45px 25px;
  border-radius:28px;
  text-align:center;
  font-size:22px;
  color:#777;
  box-shadow:0 7px 20px rgba(0,0,0,.09);
}

.statusCard.error{
  color:#b00020;
}

.statusCard.empty{
  color:#555;
}


/* =====================================================
   POST CARD
===================================================== */

.postCard{
  background:white;
  margin-bottom:28px;
  padding:26px;
  border-radius:28px;
  box-shadow:0 7px 22px rgba(0,0,0,.11);
  overflow:hidden;
}

.postHeader{
  display:flex;
  align-items:center;
  gap:16px;
}

.authorPicture{
  width:82px;
  height:82px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid #d8efff;
  cursor:pointer;
  flex-shrink:0;
}

.authorInformation{
  min-width:0;
}

.authorName{
  color:#0873c9;
  font-size:25px;
  font-weight:bold;
  line-height:1.2;
  cursor:pointer;
  word-break:break-word;
}

.postDetails{
  margin-top:8px;
  color:#777;
  font-size:18px;
  line-height:1.45;
}


/* =====================================================
   POST CATEGORY
===================================================== */

.postCategory{
  display:inline-block;
  margin-top:24px;
  padding:10px 18px;
  border-radius:25px;
  background:#e7f3ff;
  color:#0873c9;
  font-size:18px;
  font-weight:bold;
}


/* =====================================================
   POST MESSAGE
===================================================== */

.postMessage{
  margin-top:26px;
  font-size:21px;
  line-height:1.75;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}


/* =====================================================
   PART 1 OF 6
   POST PHOTO AND VIDEO STYLING
===================================================== */


/* =====================================================
   POST IMAGE
===================================================== */

.communityPostImage{
  display:block;
  width:100%;
  max-height:520px;
  margin-top:24px;
  border-radius:18px;
  object-fit:contain;
  background:#111;
  cursor:pointer;
}


/* =====================================================
   POST VIDEO
===================================================== */

.communityPostVideo{
  display:block;
  width:100%;
  max-height:520px;
  margin-top:24px;
  border-radius:18px;
  object-fit:contain;
  background:#000;
}


/* =====================================================
   MEDIA ERROR MESSAGE
===================================================== */

.communityMediaError{
  margin-top:24px;
  padding:22px 16px;
  border-radius:18px;
  background:#f5f5f5;
  color:#777;
  text-align:center;
  font-size:17px;
  line-height:1.5;
}


/* =====================================================
   FULLSCREEN PHOTO VIEWER
===================================================== */

#photoViewer{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.94);
}

#photoViewer.open{
  display:flex;
}

#photoViewerImage{
  display:block;
  max-width:100%;
  max-height:90vh;
  object-fit:contain;
}

#closePhotoViewer{
  position:absolute;
  top:16px;
  right:16px;
  width:48px;
  height:48px;
  margin:0;
  padding:0;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:white;
  font-size:28px;
  line-height:48px;
  cursor:pointer;
}

#closePhotoViewer:hover{
  background:rgba(255,255,255,.32);
}


/* =====================================================
   POST ACTION BUTTONS
===================================================== */

.postActions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:28px;
  padding-top:20px;
  border-top:1px solid #ddd;
}

.postActions button{
  border:none;
  border-radius:14px;
  padding:13px 8px;
  background:#edf3f8;
  color:#333;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

}

.likeButton.liked{

  color:#c2183b;
}

}

.deleteButton{
  background:#ffe0e0 !important;
  color:#b00020 !important;
}

  background:#ffe49b !important;
}

.deleteButton:hover{
  background:#ffcaca !important;
}
.postActions button:disabled{

  cursor:not-allowed;

   BACK BUTTON
===================================================== */

.backSection{
  display:flex;
  justify-content:center;
  margin-top:35px;
}

  padding:17px 28px;

  border-radius:18px;
  background:#707070;
  color:white;

  font-weight:bold;

  .authorName{
    font-size:22px;

  .postDetails{

  .postActions{
    grid-template-columns:1fr;

  .postActions button{

  #backButton{

function getFirstValue(...values){

      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value).trim();

    }

  }

  return "";

}


/* =====================================================

===================================================== */

function escapeHTML(value){

  const temporaryElement =
  document.createElement("div");

  temporaryElement.textContent =
  String(value ?? "");

  return temporaryElement.innerHTML;

}

function stopAllLikeListeners(){

  for(
    const unsubscribeLike
    of likeListeners.values()
  ){

    unsubscribeLike();

  }

  likeListeners.clear();

}


/* =====================================================
   INITIALIZE COMMUNITY FEED
===================================================== */

function initializeFeed(){

  stopPostsListener();

  stopAllLikeListeners();

  loadCommunityPosts();

}


/* =====================================================
   LOAD COMMUNITY POSTS
===================================================== */

function loadCommunityPosts(){

  showLoadingMessage();

  stopPostsListener();

  stopAllLikeListeners();


  try{

    const postsReference =
    collection(
      db,
      "communityPosts"
    );


    const postsQuery =
    query(
      postsReference,
      orderBy(
        "timestamp",
        "desc"
      )
    );


    unsubscribePosts =
    onSnapshot(

      postsQuery,

      async(snapshot)=>{

        try{

          if(snapshot.empty){

            showEmptyMessage();

            return;

          }


          postsContainer.innerHTML = "";


          for(
            const postDocument
            of snapshot.docs
          ){

            const postData = {

              id:
              postDocument.id,

              ...postDocument.data()

            };


            const postCard =
            await createPostCard(
              postData
            );


            postsContainer.appendChild(
              postCard
            );

          }


          setTimeout(
            scrollToSharedPost,
            300
          );

        }catch(error){

          console.error(
            "Post display error:",
            error
          );


          showErrorMessage(
            error.message ||
            "Posts were found, but they could not be displayed."
          );

        }

      },

      (error)=>{

        console.error(
          "Firestore post-loading error:",
          error
        );


        let message =
        "Community posts could not be loaded.";


        if(
          error.code ===
          "permission-denied"
        ){

          message =
          "Firebase denied permission to read community posts.";

        }else if(
          error.code ===
          "failed-precondition"
        ){

          message =
          "Firebase requires a Firestore index for this query.";

        }else if(
          error.code ===
          "unavailable"
        ){

          message =
          "Firebase is temporarily unavailable. Please check your internet connection.";

        }else if(error.message){

          message =
          error.message;

        }


        showErrorMessage(
          message
        );

      }

    );

  }catch(error){

    console.error(
      "Community feed initialization error:",
      error
    );


    showErrorMessage(
      error.message ||
      "An unexpected error occurred while opening the Community Wall."
    );

  }

}


/* =====================================================
   FORMAT POST DATE
===================================================== */

function formatPostDate(value){

  if(!value){

    return "Recently";

  }


  try{

    let date;


    if(
      typeof value.toDate ===
      "function"
    ){

      date =
      value.toDate();

    }else if(value.seconds){

      date =
      new Date(
        value.seconds * 1000
      );

    }else{

      date =
      new Date(value);

    }


    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return "Recently";

    }


    return date.toLocaleString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }catch(error){

    console.error(
      "Post date error:",
      error
    );

    return "Recently";

  }

}


/* =====================================================
   LOAD POST AUTHOR PROFILE
===================================================== */

async function loadPostAuthorProfile(postData){

  const authorId =
  getFirstValue(
    postData.userId,
    postData.authorId,
    postData.uid
  );


  let authorProfile = {

    uid:
    authorId,

    name:
    getFirstValue(
      postData.name,
      postData.fullName,
      postData.displayName,
      "Community Member"
    ),

    picture:
    getFirstValue(
      postData.picture,
      postData.profilePicture,
      postData.photoURL,
      defaultProfilePicture
    ),

    country:
    getFirstValue(
      postData.country
    )

  };


  if(!authorId){

    return authorProfile;

  }


  try{

    const profileReference =
    doc(
      db,
      "users",
      authorId
    );


    const profileSnapshot =
    await getDoc(
      profileReference
    );


    if(profileSnapshot.exists()){

      const profileData =
      profileSnapshot.data();


      authorProfile = {

        uid:
        authorId,

        name:
        getFirstValue(
          profileData.name,
          profileData.fullName,
          profileData.displayName,
          authorProfile.name
        ),

        picture:
        getFirstValue(
          profileData.profilePicture,
          profileData.picture,
          profileData.photoURL,
          profileData.profileImage,
          profileData.profilePhoto,
          authorProfile.picture,
          defaultProfilePicture
        ),

        country:
        getFirstValue(
          profileData.country,
          authorProfile.country
        )

      };

    }

  }catch(error){

    console.error(
      "Post author profile error:",
      error
    );

  }


  return authorProfile;

}


/* =====================================================
   READ POST VALUES
===================================================== */

function getPostMessage(postData){

  return getFirstValue(
    postData.post,
    postData.message,
    postData.content,
    postData.text,
    postData.description
  );

}


function getPostCategory(postData){

  return getFirstValue(
    postData.category,
    postData.postCategory,
    postData.type
  );

}


/* =====================================================
   READ POST IMAGE
===================================================== */

function getPostImage(postData){

  return getFirstValue(
    postData.imageUrl,
    postData.imageURL,
    postData.postImage,
    postData.photoUrl,
    postData.photoURL,
    postData.image,
    postData.mediaType === "image"
      ? postData.mediaUrl
      : ""
  );

}


/* =====================================================
   READ POST VIDEO
===================================================== */

function getPostVideo(postData){

  return getFirstValue(
    postData.videoUrl,
    postData.videoURL,
    postData.postVideo,
    postData.video,
    postData.mediaType === "video"
      ? postData.mediaUrl
      : ""
  );

}

/* =====================================================
   STOP ONE OLD LIKE LISTENER
===================================================== */

function stopLikeListener(postId){

  const oldListener =
  likeListeners.get(postId);


  if(oldListener){

    oldListener()
    likeListeners.delete(postId);

  }

}
/* =====================================================
   CREATE LIKE NOTIFICATION
===================================================== */

async function createLikeNotification(
  postData
){

  if(
    !currentUser ||
    !postData ||
    !postData.id
  ){

    return;

  }


  const postOwnerId =
  getFirstValue(
    postData.userId,
    postData.authorId,
    postData.uid
  );


  if(!postOwnerId){

    console.warn(
      "Like notification skipped: post owner is missing."
    );

    return;

  }


  /*
    Do not notify someone for liking
    their own post.
  */

  if(
    postOwnerId ===
    currentUser.uid
  ){

    return;

  }


  const senderName =
  getFirstValue(
    currentUserProfile?.name,
    currentUserProfile?.fullName,
    currentUserProfile?.displayName,
    currentUser.displayName,
    "A community member"
  );


  const senderPicture =
  getFirstValue(
    currentUserProfile?.profilePicture,
    currentUserProfile?.picture,
    currentUserProfile?.photoURL,
    currentUserProfile?.profileImage,
    currentUserProfile?.profilePhoto,
    currentUser.photoURL,
    defaultProfilePicture
  );


  /*
    This fixed document ID prevents the same
    user from creating many duplicate like
    notifications for the same post.
  */

  const notificationId =
  `${postData.id}_${currentUser.uid}_like`;


  const notificationReference =
  doc(
    db,
    "notifications",
    notificationId
  );


  try{

    await setDoc(
      notificationReference,
      {

        recipientId:
        postOwnerId,

        senderId:
        currentUser.uid,

        senderName:
        senderName,

        senderPicture:
        senderPicture,

        type:
        "like",

        postId:
        postData.id,

        message:
        `${senderName} liked your post.`,

        read:
        false,

        timestamp:
        serverTimestamp()

      }
    );

  }catch(error){

    console.error(
      "Like notification creation error:",
      error
    );

    /*
      Do not stop the Like feature if
      notification creation fails.
    */

  }

}

/* =====================================================
   SET UP LIKE BUTTON
===================================================== */

function setupLikeButton(
  postData,
  postCard
){

  const likeButton =
  postCard.querySelector(
    ".likeButton"
  );


  if(!likeButton){

    return;

  }


  const postId =
  postData.id;


  if(!postId){

    likeButton.disabled = true;

    likeButton.textContent =
    "🤍 Like unavailable";

    return;

  }


  stopLikeListener(postId);


  const likesReference =
  collection(
    db,
    "communityPosts",
    postId,
    "likes"
  );


  const unsubscribeLikes =
  onSnapshot(

    likesReference,

    (snapshot)=>{

      const totalLikes =
      snapshot.size;


      let currentUserLiked =
      false;


      if(currentUser){

        currentUserLiked =
        snapshot.docs.some(
          likeDocument =>
          likeDocument.id ===
          currentUser.uid
        );

      }


      likeButton.dataset.liked =
      currentUserLiked
      ? "true"
      : "false";


      likeButton.classList.toggle(
        "liked",
        currentUserLiked
      );


      likeButton.textContent =
      currentUserLiked
      ? `❤️ Liked (${totalLikes})`
      : `🤍 Like (${totalLikes})`;

    },

    (error)=>{

      console.error(
        "Like listener error:",
        error
      );


      const oldLikeCount =
      Number(
        postData.likes
      ) || 0;


      likeButton.dataset.liked =
      "false";


      likeButton.classList.remove(
        "liked"
      );


      likeButton.textContent =
      `🤍 Like (${oldLikeCount})`;

    }

  );


  likeListeners.set(
    postId,
    unsubscribeLikes
  );


  likeButton.addEventListener(
    "click",
    async()=>{

      if(!currentUser){

        alert(
          "Please sign in before liking a post."
        );

        return;

      }


      const userLikeReference =
      doc(
        db,
        "communityPosts",
        postId,
        "likes",
        currentUser.uid
      );


      const hasLiked =
      likeButton.dataset.liked ===
      "true";


      likeButton.disabled = true;


      try{

        if(hasLiked){

          await deleteDoc(
            userLikeReference
          );

        }else{

          const likerName =
          getFirstValue(
            currentUserProfile?.name,
            currentUserProfile?.fullName,
            currentUserProfile?.displayName,
            currentUser.displayName,
            "Community Member"
          );


          const likerPicture =
          getFirstValue(
            currentUserProfile?.profilePicture,
            currentUserProfile?.picture,
            currentUserProfile?.photoURL,
            currentUserProfile?.profileImage,
            currentUserProfile?.profilePhoto,
            currentUser.photoURL,
            defaultProfilePicture
          );


          await setDoc(
            userLikeReference,
            {

              userId:
              currentUser.uid,

              name:
              likerName,

              picture:
              likerPicture,

              likedAt:
              serverTimestamp()

            }
          );
await createLikeNotification(
  postData
);
        }

      }catch(error){

        console.error(
          "Like update error:",
          error
        );


        alert(
          error.message ||
          "The Like could not be updated."
        );

      }finally{

        likeButton.disabled = false;

      }

    }
  );

}


/* =====================================================
   COMMENTS, SHARE, EDIT AND DELETE
===================================================== */

function setupPostActions(
  postData,
  postCard
){

  const commentButton =
  postCard.querySelector(
    ".commentButton"
  );


  const shareButton =
  postCard.querySelector(
    ".shareButton"
  );


  const editButton =
  postCard.querySelector(
    ".editButton"
  );


  const deleteButton =
  postCard.querySelector(
    ".deleteButton"
  );


  const postId =
  postData.id;


  /* ===================================================
     COMMENTS
  =================================================== */

  if(commentButton){

    commentButton.addEventListener(
      "click",
      ()=>{

        if(!postId){

          alert(
            "This post cannot be opened."
          );

          return;

        }


        window.location.href =
        "comments.html?postId=" +
        encodeURIComponent(postId);

      }
    );

  }


  /* ===================================================
     SHARE
  =================================================== */

  if(shareButton){

    shareButton.addEventListener(
      "click",
      async()=>{

        if(!postId){

          alert(
            "This post cannot be shared."
          );

          return;

        }


        const postLink =
        window.location.origin +
        window.location.pathname +
        "?postId=" +
        encodeURIComponent(postId);


        const postMessage =
        getPostMessage(postData);


        const shareText =
        postMessage
        ? postMessage.slice(0,180)
        : "View this community post";


        try{

          if(navigator.share){

            await navigator.share({

              title:
              "SABASABA Community Post",

              text:
              shareText,

              url:
              postLink

            });

          }else if(navigator.clipboard){

            await navigator.clipboard.writeText(
              postLink
            );


            alert(
              "Post link copied successfully."
            );

          }else{

            prompt(
              "Copy this post link:",
              postLink
            );

          }

        }catch(error){

          if(error.name === "AbortError"){

            return;

          }


          console.error(
            "Post sharing error:",
            error
          );


          prompt(
            "Copy this post link:",
            postLink
          );

        }

      }
    );

  }


  /* ===================================================
     EDIT OWNER'S POST
  =================================================== */

  if(editButton){

    editButton.addEventListener(
      "click",
      async()=>{

        if(
          !currentUser ||
          currentUser.uid !== postData.userId
        ){

          alert(
            "You can only edit your own posts."
          );

          return;

        }


        const currentMessage =
        getPostMessage(postData);


        const editedMessage =
        prompt(
          "Edit your post:",
          currentMessage
        );


        if(editedMessage === null){

          return;

        }


        const cleanMessage =
        editedMessage.trim();


        if(cleanMessage === ""){

          alert(
            "The post cannot be empty."
          );

          return;

        }


        if(cleanMessage.length > 5000){

          alert(
            "Please use 5,000 characters or fewer."
          );

          return;

        }


        editButton.disabled = true;

        editButton.textContent =
        "⏳ Saving...";


        try{

          const postReference =
          doc(
            db,
            "communityPosts",
            postId
          );


          await updateDoc(
            postReference,
            {

              post:
              cleanMessage,

              editedAt:
              serverTimestamp()

            }
          );


          alert(
            "Your post has been updated successfully."
          );

        }catch(error){

          console.error(
            "Post editing error:",
            error
          );


          alert(
            error.message ||
            "The post could not be updated."
          );

        }finally{

          editButton.disabled = false;

          editButton.textContent =
          "✏️ Edit";

        }

      }
    );

  }


  /* ===================================================
     DELETE OWNER'S POST
  =================================================== */

  if(deleteButton){

    deleteButton.addEventListener(
      "click",
      async()=>{

        if(
          !currentUser ||
          currentUser.uid !== postData.userId
        ){

          alert(
            "You can only delete your own posts."
          );

          return;

        }


        const confirmed =
        confirm(
          "Are you sure you want to delete this post? This action cannot be undone."
        );


        if(!confirmed){

          return;

        }


        deleteButton.disabled = true;

        deleteButton.textContent =
        "⏳ Deleting...";


        try{

          const postReference =
          doc(
            db,
            "communityPosts",
            postId
          );


          await deleteDoc(
            postReference
          );


          alert(
            "Your post has been deleted successfully."
          );

        }catch(error){

          console.error(
            "Post deletion error:",
            error
          );


          alert(
            error.message ||
            "The post could not be deleted."
          );


          deleteButton.disabled = false;

          deleteButton.textContent =
          "🗑️ Delete";

        }

      }
    );

  }

}

/* =====================================================
   OPEN SHARED POST
===================================================== */

function scrollToSharedPost(){

  const parameters =
  new URLSearchParams(
    window.location.search
  );


  const sharedPostId =
  parameters.get("postId");


  if(!sharedPostId){

    return;

  }


  let sharedPost = null;


  try{

    sharedPost =
    document.querySelector(
      `[data-post-id="${CSS.escape(sharedPostId)}"]`
    );

  }catch(error){

    console.error(
      "Shared post selector error:",
      error
    );

    return;

  }


  if(!sharedPost){

    return;

  }


  sharedPost.scrollIntoView({

    behavior:"smooth",

    block:"center"

  });


  sharedPost.style.outline =
  "4px solid #0874d1";


  sharedPost.style.outlineOffset =
  "4px";


  setTimeout(
    ()=>{

      sharedPost.style.outline =
      "none";


      sharedPost.style.outlineOffset =
      "0";

    },
    3500
  );

}
