<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Community Wall | SABASABA Gospel Ministry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.header{

background:linear-gradient(135deg,#0066cc,#004d99);
color:white;
padding:30px;
border-radius:18px;
text-align:center;
margin-bottom:20px;

}

.header h1{

font-size:34px;
margin-bottom:10px;

}

.header p{

font-size:17px;

}

.topBar{

display:flex;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;

}

.createBtn{

flex:1;
background:#0066cc;
color:white;
border:none;
padding:15px;
border-radius:10px;
font-size:17px;
cursor:pointer;

}

.refreshBtn{

background:#28a745;
color:white;
border:none;
padding:15px 20px;
border-radius:10px;
font-size:17px;
cursor:pointer;

}

.post{

background:white;
border-radius:18px;
padding:20px;
margin-bottom:20px;
box-shadow:0 4px 12px rgba(0,0,0,.08);

}

.postHeader{

display:flex;
align-items:center;
margin-bottom:15px;

}

.postHeader img{

width:55px;
height:55px;
border-radius:50%;
object-fit:cover;
margin-right:15px;
background:#ddd;

}

.postName{

font-size:20px;
font-weight:bold;
color:#0066cc;

}

.postTime{

font-size:13px;
color:gray;
margin-top:3px;

}

.postText{

font-size:17px;
line-height:1.7;
margin:15px 0;
white-space:pre-wrap;

}

.postImage{

width:100%;
border-radius:15px;
margin-top:15px;
display:none;

}

.actions{

display:flex;
justify-content:space-between;
gap:10px;
margin-top:18px;
flex-wrap:wrap;

}

.actions button{

flex:1;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;

}

.likeBtn{

background:#1877f2;
color:white;

}

.commentBtn{

background:#28a745;
color:white;

}

.shareBtn{

background:#ff9800;
color:white;

}

.empty{

background:white;
padding:40px;
text-align:center;
border-radius:18px;
color:#777;

}

.back{

margin-top:30px;
text-align:center;

}

.back button{

padding:14px 30px;
background:#666;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;

}

@media(max-width:700px){

.actions{

flex-direction:column;

}

.header h1{

font-size:28px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>📰 Community Wall</h1>

<p>

Share God's Word, testimonies, encouragement and prayer with believers around the world.

</p>

</div>

<div class="topBar">

<button
class="createBtn"
onclick="location.href='createpost.html'">

✍️ Create New Post

</button>

<button
class="refreshBtn"
onclick="location.reload()">

🔄 Refresh

</button>

</div>

<div id="postsContainer">

<div class="empty">

Loading community posts...

</div>

</div>

<div class="back">

<button
onclick="location.href='community.html'">

⬅ Back to Community

</button>

</div>

</div>
<script type="module">

import{
auth,
db,
collection,
query,
orderBy,
onSnapshot,
onAuthStateChanged
}from "./firebase.js";

const postsContainer=document.getElementById("postsContainer");

onAuthStateChanged(auth,(user)=>{

if(!user){

location.href="login.html";
return;

}

loadPosts();

});

function loadPosts(){

const q=query(
collection(db,"communityPosts"),
orderBy("timestamp","desc")
);

onSnapshot(q,(snapshot)=>{

postsContainer.innerHTML="";

if(snapshot.empty){

postsContainer.innerHTML=`

<div class="empty">

No community posts yet.<br><br>

Be the first believer to share something!

</div>

`;

return;

}

snapshot.forEach(docSnap=>{

const post=docSnap.data();

const card=document.createElement("div");

card.className="post";

const imageHTML=post.image
?`<img class="postImage" src="${post.image}" style="display:block;">`
:"";

const profilePicture=post.profilePicture||"images/profile.png";

const country=post.country||"";

const fullName=post.fullName||"Anonymous";

let time="Just now";

if(post.timestamp?.toDate){

time=post.timestamp.toDate().toLocaleString();

}

card.innerHTML=`

<div class="postHeader">

<img src="${profilePicture}">

<div>

<div class="postName">

${fullName}

</div>

<div class="postTime">

${country} • ${time}

</div>

</div>

</div>

<div class="postText">

${post.text||""}

</div>

${imageHTML}

<div class="actions">

<button class="likeBtn">

❤️ Like (${post.likes||0})

</button>

<button class="commentBtn">

💬 Comment (${post.comments||0})

</button>

<button class="shareBtn">

📤 Share

</button>

</div>

`;

postsContainer.appendChild(card);

});

});

}

</script>

</body>

</html>
