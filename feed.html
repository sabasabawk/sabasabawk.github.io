<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community Feed</title>

<style>

body{
font-family:Arial,sans-serif;
background:#eef3f8;
margin:0;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
}

.header{
background:#0066cc;
color:white;
padding:20px;
border-radius:15px;
text-align:center;
margin-bottom:20px;
}

.post{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.profile{
display:flex;
align-items:center;
margin-bottom:15px;
}

.avatar{
font-size:45px;
margin-right:15px;
}

.name{
font-weight:bold;
font-size:20px;
}

.time{
color:gray;
font-size:14px;
}

.post p{
font-size:18px;
line-height:1.6;
}

.actions{
display:flex;
justify-content:space-around;
margin-top:20px;
border-top:1px solid #ddd;
padding-top:15px;
}

.comments{
margin-top:15px;
padding-top:10px;
border-top:1px solid #ddd;
}

.comments p{
margin:6px 0;
}

button{
background:#0066cc;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#004d99;
}

.back{
text-align:center;
margin-top:30px;
}

.back a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>📰 Community Feed</h1>
<p>Welcome to the SABASABA Gospel Ministry Community</p>
</div>

<div id="feedContainer"></div>

<div class="back">
<a href="community.html">
<button>⬅ Back to Community</button>
</a>
</div>

</div>

<script type="module">

let feed=document.getElementById("feedContainer");

// Welcome post

feed.innerHTML=`

<div class="post">

<div class="profile">

<div class="avatar">👤</div>

<div>

<div class="name">SABASABA Gospel Ministry</div>

<div class="time">Today</div>

</div>

</div>

<p>

📖 Welcome to our Christian Community!

Here you can encourage one another, share Bible verses, testimonies, prayer requests, and grow together in Christ.

May God bless every member.

</p>

<div class="actions">

<button onclick="alert('Welcome to the Community!')">
👍 Like
</button>

<button onclick="alert('Leave an encouraging comment!')">
💬 Comment
</button>

<button onclick="alert('Share this ministry with others!')">
📤 Share
</button>

</div>

</div>

`;

let posts=JSON.parse(localStorage.getItem("communityPosts"))||[];

posts.forEach(function(post,index){

feed.innerHTML+=`

<div class="post">

<div class="profile">

<img
src="${post.picture}"
style="width:55px;height:55px;border-radius:50%;margin-right:15px;object-fit:cover;border:2px solid #0066cc;">

<div>

<div class="name">${post.name}</div>

<div class="time">${post.date}</div>

</div>

</div>

<p>

<b>Category:</b> ${post.category}

<br><br>

${post.post}

</p>

<div class="actions">

<button onclick="likePost(${index})">
👍 <span id="likes${index}">${post.likes}</span>
</button>

<button onclick="commentPost(${index})">
💬 Comment
</button>

<button onclick="sharePost('${post.name}')">
📤 Share
</button>

<button onclick="deletePost(${index})">
🗑 Delete
</button>

</div>

<div class="comments">

<h4>💬 Comments</h4>

<div id="comments${index}">

${post.comments.map(function(c){

return `
<p>
🗨️ ${c}
<br>
<button onclick="replyComment(${index})">↩ Reply</button>
</p>
`;

}).join("")}

</div>

</div>

</div>

`;

});
function addNotification(message){

let notifications =
JSON.parse(localStorage.getItem("notifications")) || [];

notifications.push(message);

localStorage.setItem(
"notifications",
JSON.stringify(notifications)
);

}
function likePost(index){

let posts=JSON.parse(localStorage.getItem("communityPosts"))||[];

posts[index].likes++;addNotification("❤️ Someone liked " + posts[index].name + "'s post.");

localStorage.setItem("communityPosts",JSON.stringify(posts));

document.getElementById("likes"+index).innerText=posts[index].likes;

}

function commentPost(index){

let comment=prompt("Write your comment");

if(comment==null || comment.trim()=="") return;

let posts=JSON.parse(localStorage.getItem("communityPosts"))||[];

posts[index].comments.push(comment);addNotification("💬 New comment on " + posts[index].name + "'s post.");

localStorage.setItem("communityPosts",JSON.stringify(posts));

location.reload();

}

function sharePost(name){

alert("Thanks for sharing " + name + "'s post.");

}

function deletePost(index){

let answer = confirm(
"Are you sure you want to delete this post?"
);

if(!answer){
return;
}

let posts =
JSON.parse(localStorage.getItem("communityPosts")) || [];

posts.splice(index,1);

localStorage.setItem(
"communityPosts",
JSON.stringify(posts)
);

alert("✅ Post deleted successfully!");

location.reload();

}
function replyComment(index){

let reply = prompt("Write your reply:");

if(reply==null || reply.trim()==""){
return;
}

let posts =
JSON.parse(localStorage.getItem("communityPosts")) || [];

posts[index].comments.push("↪ " + reply);addNotification("↩ New reply on " + posts[index].name + "'s post.");

localStorage.setItem(
"communityPosts",
JSON.stringify(posts)
);

alert("✅ Reply added successfully!");

location.reload();

}
window.likePost = likePost;
window.commentPost = commentPost;
window.sharePost = sharePost;
window.deletePost = deletePost;
window.replyComment = replyComment;
window.addNotification = addNotification;
</script>

</body>
</html>
