/* =====================================================
   RETURN FIRST AVAILABLE VALUE
===================================================== */

function getFirstValue(...values){

  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value).trim();

    }

  }

  return "";

}

/* =====================================================
   PROTECT PROFILE PICTURES
===================================================== */

function protectProfilePicture(imageElement){

  if(!imageElement){

    return;

  }

  imageElement.addEventListener(
    "error",
    function(){

      imageElement.src =
      defaultProfilePicture;

    },
    {
      once:true
    }
  );

}

/* =====================================================
   LOAD LATEST AUTHOR PROFILE PICTURE
===================================================== */

async function loadLatestAuthorPicture(
  authorId,
  imageElement
){

  if(
    !authorId ||
    !imageElement
  ){

    return;

  }


  try{

    let profileData = {};


    /* Use an already loaded profile */

    if(
      userProfileCache.has(
        authorId
      )
    ){

      profileData =
      userProfileCache.get(
        authorId
      );

    }else{

      const profileReference =
      doc(
        db,
        "users",
        authorId
      );


      const profileSnapshot =
      await getDoc(
        profileReference
      );


      if(profileSnapshot.exists()){

        profileData =
        profileSnapshot.data();

      }


      userProfileCache.set(
        authorId,
        profileData
      );

    }


    const latestProfilePicture =
    getFirstValue(
      profileData.profilePicture,
      profileData.picture,
      profileData.photoURL,
      profileData.photoUrl,
      profileData.profileImage,
      profileData.profilePhoto,
      profileData.imageUrl
    );


    if(latestProfilePicture){

      imageElement.src =
      latestProfilePicture;

    }

  }catch(error){

    console.error(
      "Error loading author profile picture:",
      error
    );

  }

}
/* =====================================================
   FORMAT FIREBASE DATE
===================================================== */

function formatPostDate(timestamp){

  if(!timestamp){

    return "Recently";

  }

  try{

    let postDate;

    if(typeof timestamp.toDate === "function"){

      postDate =
      timestamp.toDate();

    }else if(timestamp.seconds){

      postDate =
      new Date(
        timestamp.seconds * 1000
      );

    }else{

      postDate =
      new Date(timestamp);

    }

    if(
      Number.isNaN(
        postDate.getTime()
      )
    ){

      return "Recently";

    }

    return postDate.toLocaleString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }catch(error){

    console.error(
      "Date formatting error:",
      error
    );

    return "Recently";

  }

}

/* =====================================================
   SHOW UNREAD NOTIFICATION NUMBER
===================================================== */

function startNotificationListener(){

  stopNotificationListener();

  if(!currentUser){

    notificationBadge.style.display =
    "none";

    notificationBadge.textContent =
    "0";

    return;

  }

  const unreadNotificationsQuery =
  query(
    collection(
      db,
      "notifications"
    ),
    where(
      "recipientId",
      "==",
      currentUser.uid
    ),
    where(
      "read",
      "==",
      false
    )
  );

  unsubscribeNotifications =
  onSnapshot(

    unreadNotificationsQuery,

    function(snapshot){

      const totalUnread =
      snapshot.size;

      if(totalUnread > 0){

        notificationBadge.style.display =
        "flex";

        notificationBadge.textContent =
        totalUnread > 99
        ? "99+"
        : String(totalUnread);

      }else{

        notificationBadge.style.display =
        "none";

        notificationBadge.textContent =
        "0";

      }

    },

    function(error){

      console.error(
        "Notification badge error:",
        error
      );

      notificationBadge.style.display =
      "none";

    }

  );

}

/* =====================================================
   LOAD POSTS
===================================================== */

function loadCommunityPosts(){

  try{

    const postsReference =
    collection(
      db,
      "communityPosts"
    );

    const postsQuery =
    query(
      postsReference,
      orderBy(
        "timestamp",
        "desc"
      )
    );


    unsubscribePosts =
    onSnapshot(

      postsQuery,

      function(snapshot){

        postsContainer.innerHTML =
        "";

        if(snapshot.empty){

          showEmptyMessage();

          return;

        }


        snapshot.forEach(
          function(postDocument){

            try{

              const postData = {

                id:
                postDocument.id,

                ...postDocument.data()

              };


              const postCard =
              createPostCard(
                postData
              );


              postsContainer.appendChild(
                postCard
              );

            }catch(error){

              console.error(
                "Error creating post card:",
                error
              );

            }

          }
        );


        if(
          postsContainer.children.length ===
          0
        ){

          showErrorMessage(
            "Community posts were found, but they could not be displayed."
          );

          return;

        }


        scrollToSharedPost();

      },


      function(error){

        console.error(
          "Error loading community posts:",
          error
        );


        if(
          error.code ===
          "permission-denied"
        ){

          showErrorMessage(
            "Firebase permission denied access to community posts."
          );

          return;

        }


        if(
          error.code ===
          "failed-precondition"
        ){

          showErrorMessage(
            "Firebase requires an index before community posts can be displayed."
          );

          return;

        }


        if(
          error.code ===
          "unavailable"
        ){

          showErrorMessage(
            "The Community Wall is temporarily unavailable. Check your internet connection and try again."
          );

          return;

        }


        showErrorMessage(
          "Community posts could not be loaded. Please try again."
        );

      }

    );

  }catch(error){

    console.error(
      "Community feed setup error:",
      error
    );

    showErrorMessage(
      "The Community Wall could not be started."
    );

  }

}

/* =====================================================
   CREATE POST CARD
===================================================== */

function createPostCard(postData){

  const postCard =
  document.createElement("article");

  postCard.className =
  "postCard";

  postCard.id =
  `post-${postData.id}`;

  postCard.dataset.postId =
  postData.id;


  /* =================================================
     AUTHOR DETAILS
  ================================================= */

  const authorId =
  getFirstValue(
    postData.userId,
    postData.authorId,
    postData.uid
  );

  const authorName =
  getFirstValue(
    postData.name,
    postData.fullName,
    postData.displayName,
    "Community Member"
  );

  const authorPicture =
  getFirstValue(
    postData.picture,
    postData.profilePicture,
    postData.photoURL,
    postData.photoUrl,
    defaultProfilePicture
  );

  const authorCountry =
  getFirstValue(
    postData.country
  );

  const postDate =
  formatPostDate(
    postData.timestamp
  );


  /* =================================================
     POST CONTENT
  ================================================= */

  const postMessage =
  getFirstValue(
    postData.post,
    postData.message,
    postData.content,
    postData.text,
    postData.description
  );

  const postCategory =
  getFirstValue(
    postData.category,
    postData.postCategory,
    postData.type,
    "General"
  );


  /* =================================================
     MEDIA DETAILS
  ================================================= */

  const mediaType =
  getFirstValue(
    postData.mediaType
  ).toLowerCase();

  let imageUrl = "";

  let videoUrl = "";


  if(mediaType === "image"){

    imageUrl =
    getFirstValue(
      postData.imageUrl,
      postData.imageURL,
      postData.photoUrl,
      postData.photoURL,
      postData.postImage,
      postData.image,
      postData.mediaUrl
    );

  }else if(mediaType === "video"){

    videoUrl =
    getFirstValue(
      postData.videoUrl,
      postData.videoURL,
      postData.postVideo,
      postData.video,
      postData.mediaUrl
    );

  }else{

    imageUrl =
    getFirstValue(
      postData.imageUrl,
      postData.imageURL,
      postData.photoUrl,
      postData.photoURL,
      postData.postImage,
      postData.image
    );

    videoUrl =
    getFirstValue(
      postData.videoUrl,
      postData.videoURL,
      postData.postVideo,
      postData.video
    );

  }


  /* =================================================
     LIKES
  ================================================= */

  const likes =
  Array.isArray(postData.likes)
  ? postData.likes
  : [];

  const userHasLiked =
  Boolean(
    currentUser &&
    likes.includes(currentUser.uid)
  );


  /* =================================================
     POST HEADER
  ================================================= */

  const postHeader =
  document.createElement("div");

  postHeader.className =
  "postHeader";


  const profileImage =
  document.createElement("img");

  profileImage.className =
  "authorPicture";

  profileImage.src =
  authorPicture;

  profileImage.alt =
  `${authorName}'s profile picture`;

  protectProfilePicture(
  profileImage
);


/* Load the author's latest profile picture
   from users/{authorId} */

loadLatestAuthorPicture(
  authorId,
  profileImage
);


  const authorInformation =
  document.createElement("div");

  authorInformation.className =
  "authorInformation";


  const authorNameElement =
  document.createElement("div");

  authorNameElement.className =
  "authorName";

  authorNameElement.textContent =
  authorName;


  const postDetails =
  document.createElement("div");

  postDetails.className =
  "postDetails";

  postDetails.textContent =
  authorCountry
  ? `${authorCountry} • ${postDate}`
  : postDate;


  authorInformation.appendChild(
    authorNameElement
  );

  authorInformation.appendChild(
    postDetails
  );

  postHeader.appendChild(
    profileImage
  );

  postHeader.appendChild(
    authorInformation
  );

  postCard.appendChild(
    postHeader
  );


  /* =================================================
     POST CATEGORY
  ================================================= */

  if(postCategory){

    const categoryElement =
    document.createElement("div");

    categoryElement.className =
    "postCategory";

    categoryElement.textContent =
    postCategory;

    postCard.appendChild(
      categoryElement
    );

  }


  /* =================================================
     POST MESSAGE
  ================================================= */

  if(postMessage){

    const messageElement =
    document.createElement("div");

    messageElement.className =
    "postMessage";

    messageElement.textContent =
    postMessage;

    postCard.appendChild(
      messageElement
    );

  }


  /* =================================================
     PHOTO OR VIDEO
  ================================================= */

  const mediaContainer =
  document.createElement("div");

  mediaContainer.className =
  "postMediaContainer";


  if(imageUrl){

    const postImage =
    document.createElement("img");

    postImage.className =
    "communityPostImage";

    postImage.src =
    imageUrl;

    postImage.alt =
    "Community post photo";

    postImage.loading =
    "lazy";

    postImage.dataset.fullImage =
    imageUrl;

    postImage.addEventListener(
      "error",
      function(){

        mediaContainer.remove();

      },
      {
        once:true
      }
    );

    mediaContainer.appendChild(
      postImage
    );

  }else if(videoUrl){

    const postVideo =
    document.createElement("video");

    postVideo.className =
    "communityPostVideo";

    postVideo.src =
    videoUrl;

    postVideo.controls =
    true;

    postVideo.preload =
    "metadata";

    postVideo.playsInline =
    true;

    postVideo.addEventListener(
      "error",
      function(){

        mediaContainer.remove();

      },
      {
        once:true
      }
    );

    mediaContainer.appendChild(
      postVideo
    );

  }


  if(mediaContainer.children.length > 0){

    postCard.appendChild(
      mediaContainer
    );

  }


  /* =================================================
     LIKE, COMMENT AND SHARE BUTTONS
  ================================================= */

  const actionsContainer =
  document.createElement("div");

  actionsContainer.className =
  "postActions";


  const likeButton =
  document.createElement("button");

  likeButton.type =
  "button";

  likeButton.className =
  userHasLiked
  ? "likeButton liked"
  : "likeButton";

  likeButton.dataset.postId =
postData.id;

likeButton.dataset.authorId =
authorId;

likeButton.dataset.likes =
JSON.stringify(likes);

  likeButton.innerHTML =
  `❤️ <span>${likes.length}</span>`;


  const commentButton =
  document.createElement("button");

  commentButton.type =
  "button";

  commentButton.className =
  "commentButton";

  commentButton.dataset.postId =
  postData.id;

  commentButton.innerHTML =
  "💬 Comment";


  const shareButton =
  document.createElement("button");

  shareButton.type =
  "button";

  shareButton.className =
  "shareButton";

  shareButton.dataset.postId =
  postData.id;

  shareButton.dataset.message =
  postMessage;

  shareButton.innerHTML =
  "🔗 Share";


  actionsContainer.appendChild(
    likeButton
  );

  actionsContainer.appendChild(
    commentButton
  );

  actionsContainer.appendChild(
    shareButton
  );

  postCard.appendChild(
    actionsContainer
  );


  /* =================================================
     OWNER EDIT AND DELETE BUTTONS
  ================================================= */

  if(
    currentUser &&
    authorId === currentUser.uid
  ){

    const ownerActions =
    document.createElement("div");

    ownerActions.className =
    "postActions ownerActions";


    const editButton =
    document.createElement("button");

    editButton.type =
    "button";

    editButton.className =
    "editButton";

    editButton.dataset.postId =
    postData.id;

    editButton.dataset.message =
    postMessage;

    editButton.innerHTML =
    "✏️ Edit";


    const deleteButton =
    document.createElement("button");

    deleteButton.type =
    "button";

    deleteButton.className =
    "deleteButton";

    deleteButton.dataset.postId =
    postData.id;

    deleteButton.innerHTML =
    "🗑️ Delete";


    ownerActions.appendChild(
      editButton
    );

    ownerActions.appendChild(
      deleteButton
    );

    postCard.appendChild(
      ownerActions
    );

  }


  /* =================================================
     OPEN MEMBER PROFILE
  ================================================= */

  if(authorId){

    profileImage.addEventListener(
      "click",
      function(){

        window.location.href =
        `profile.html?uid=${encodeURIComponent(authorId)}`;

      }
    );


    authorNameElement.addEventListener(
      "click",
      function(){

        window.location.href =
        `profile.html?uid=${encodeURIComponent(authorId)}`;

      }
    );

  }


  return postCard;

}

/* =====================================================
   CREATE LIKE NOTIFICATION
===================================================== */

async function createLikeNotification(
  recipientId,
  postId
){

  if(
    !currentUser ||
    !recipientId ||
    !postId
  ){

    return;

  }


  /* Do not notify users about their own likes */

  if(recipientId === currentUser.uid){

    return;

  }


  const senderName =
  getFirstValue(
    currentProfile.fullName,
    currentProfile.name,
    currentUser.displayName,
    currentUser.email,
    "A community member"
  );


  try{

    await addDoc(
      collection(
        db,
        "notifications"
      ),
      {
        recipientId:
        recipientId,

        senderId:
        currentUser.uid,

        senderName:
        senderName,

        type:
        "like",

        postId:
postId,

targetUrl:
`feed.html?post=${encodeURIComponent(postId)}`,

message:
`${senderName} liked your post.`,

        read:
        false,

        timestamp:
        serverTimestamp()
      }
    );

  }catch(error){

    console.error(
      "Error creating like notification:",
      error
    );

  }

}

/* =====================================================
   SHARE A POST
===================================================== */

async function handleShareButton(button){

  const postId =
  button.dataset.postId;

  if(!postId){

    return;

  }


  const postMessage =
  button.dataset.message || "";


  const postUrl =
  `${window.location.origin}${window.location.pathname}?post=${encodeURIComponent(postId)}`;


  const shareText =
  postMessage
  ? `${postMessage}\n\nSABASABA Gospel Ministry`
  : "See this post on SABASABA Gospel Ministry.";


  try{

    if(navigator.share){

      await navigator.share(
        {
          title:
          "SABASABA Gospel Ministry",

          text:
          shareText,

          url:
          postUrl
        }
      );

      return;

    }


    if(
      navigator.clipboard &&
      window.isSecureContext
    ){

      await navigator.clipboard.writeText(
        postUrl
      );

      alert(
        "Post link copied."
      );

      return;

    }


    window.prompt(
      "Copy this post link:",
      postUrl
    );

  }catch(error){

    if(error.name !== "AbortError"){

      console.error(
        "Error sharing post:",
        error
      );

      alert(
        "The post could not be shared."
      );

    }

  }

}


/* =====================================================
   EDIT A POST
===================================================== */

async function handleEditButton(button){

  if(!currentUser){

    window.location.href =
    "login.html";

    return;

  }


  const postId =
  button.dataset.postId;

  const oldMessage =
  button.dataset.message || "";


  if(!postId){

    return;

  }


  const newMessage =
  window.prompt(
    "Edit your post:",
    oldMessage
  );


  if(newMessage === null){

    return;

  }


  const cleanedMessage =
  newMessage.trim();


  if(!cleanedMessage){

    alert(
      "The post cannot be empty."
    );

    return;

  }


  button.disabled =
  true;


  try{

    const postReference =
    doc(
      db,
      "communityPosts",
      postId
    );


    await updateDoc(
      postReference,
      {
        post:
        cleanedMessage
      }
    );


    button.dataset.message =
    cleanedMessage;

  }catch(error){

    console.error(
      "Error editing post:",
      error
    );

    alert(
      "The post could not be edited."
    );

  }finally{

    button.disabled =
    false;

  }

}

    return;

  }


  const postId =
  button.dataset.postId;


  if(!postId){

    return;

  }


  const confirmed =
  window.confirm(
    "Are you sure you want to delete this post?"
  );


  if(!confirmed){

    return;

  }


  button.disabled =
  true;


  try{

    const postReference =
    doc(
      db,
      "communityPosts",
      postId
    );


    await deleteDoc(
      postReference
    );

  }catch(error){

    console.error(
      "Error deleting post:",
      error
    );

    alert(
      "The post could not be deleted."
    );

    button.disabled =
    false;

  }

}


/* =====================================================
   OPEN PHOTO VIEWER
===================================================== */

function openPhotoViewer(imageUrl){

  if(!imageUrl){

    return;

  }


  photoViewerImage.src =
  imageUrl;


  photoViewer.classList.add(
    "open"
  );


  photoViewer.setAttribute(
    "aria-hidden",
    "false"
  );


  document.body.style.overflow =
  "hidden";


  closePhotoViewerButton.focus();

}


/* =====================================================
   CLOSE PHOTO VIEWER
===================================================== */

function hidePhotoViewer(){

  photoViewer.classList.remove(
    "open"
  );


  photoViewer.setAttribute(
    "aria-hidden",
    "true"
  );


  photoViewerImage.src =
  "";


  document.body.style.overflow =
  "";

}

closePhotoViewerButton.addEventListener(

);


photoViewer.addEventListener(
  "click",

    if(event.target === photoViewer){

);

/* =====================================================
   SCROLL TO A SHARED POST
===================================================== */

function scrollToSharedPost(){

  const urlParameters =
  new URLSearchParams(
    window.location.search
  );


  const sharedPostId =
  urlParameters.get("post");


  if(!sharedPostId){

    return;

  }


  const sharedPost =
  document.getElementById(
    `post-${sharedPostId}`
  );


  if(!sharedPost){

    return;

  }


  window.setTimeout(
    function(){

      sharedPost.scrollIntoView(
        {
          behavior:
          "smooth",

          block:
          "center"
        }
      );

    },
    150
  );

}

/* =========================================
   AUTO-PLAY VISIBLE COMMUNITY VIDEOS
========================================= */

let videoObserver = null;

function startVideoAutoPlay() {

  // Stop the previous observer if it exists
  if (videoObserver) {
    videoObserver.disconnect();
  }

  const communityVideos =
    document.querySelectorAll(".communityPostVideo");

  if (!communityVideos.length) {
    return;
  }

  videoObserver = new IntersectionObserver(

    (entries) => {

      entries.forEach((entry) => {

        const video = entry.target;

        /*
          Start when at least 70% of the
          video is visible on the screen.
        */
        if (
          entry.isIntersecting &&
          entry.intersectionRatio >= 0.7
        ) {

          // Pause every other video
          communityVideos.forEach((otherVideo) => {

            if (otherVideo !== video) {
              otherVideo.pause();
            }

          });

          /*
            Autoplay normally requires
            the video to begin muted.
          */
          video.muted = true;

          const playPromise = video.play();

          if (
            playPromise !== undefined
          ) {

            playPromise.catch((error) => {

              console.log(
                "Video autoplay was blocked:",
                error
              );

            });

          }

        } else {

          // Pause when it leaves the screen
          video.pause();

        }

      });

    },

    {
      threshold: [0, 0.25, 0.5, 0.7, 1]
    }

  );

  communityVideos.forEach((video) => {

    video.muted = true;
    video.playsInline = true;

    videoObserver.observe(video);

  });

}
