<body>

<main class="pageContainer">

<section class="wallHeader">

<h1>📰 Community Wall</h1>

<p>
Share God's Word, testimonies, encouragement and prayer with believers around the world.
</p>

</section>

<section class="wallControls">

<button
type="button"
id="createPostButton"
class="controlButton createPostButton">

id="refreshButton"

</button>

id="postsContainer"

Loading community posts...

id="backButton"

</button>

</main>
 <script type="module">

/* =====================================================
   PART 1 OF 6
   FIREBASE SETUP, PAGE ELEMENTS AND AUTHENTICATION
===================================================== */

import {
  auth,
  db,
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  getDoc,
  setDoc,
  deleteDoc,
  onAuthStateChanged
} from "./firebase.js";

import {
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const postsContainer =
document.getElementById("postsContainer");

const createPostButton =
document.getElementById("createPostButton");

const refreshButton =
document.getElementById("refreshButton");

const backButton =
document.getElementById("backButton");


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let currentUserProfile = null;

let unsubscribePosts = null;

const likeListeners =
new Map();

const defaultProfilePicture =
"images/profile.png";


/* =====================================================
   HTML SAFETY
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* =====================================================
   LOADING MESSAGE
===================================================== */

function showLoadingMessage(){

  postsContainer.innerHTML = `

    <div class="loadingMessage">

      Loading community posts...

    </div>

  `;

}


/* =====================================================
   EMPTY MESSAGE
===================================================== */

function showEmptyMessage(){

  postsContainer.innerHTML = `

    <div class="emptyMessage">

      <strong>No community posts yet.</strong>

      <br><br>

      Be the first person to share God's Word,
      a testimony, encouragement or prayer.

    </div>

  `;

}


/* =====================================================
   ERROR MESSAGE
===================================================== */

function showErrorMessage(message){

  postsContainer.innerHTML = `

    <div class="errorMessage">

      <strong>Community posts could not be loaded.</strong>

      <br><br>

      ${escapeHTML(message)}

    </div>

  `;

}


/* =====================================================
   GET FIRST AVAILABLE VALUE
===================================================== */

function getFirstValue(...values){

  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value).trim();

    }

  }

  return "";

}


/* =====================================================
   LOAD CURRENT USER PROFILE
===================================================== */

async function loadCurrentUserProfile(){

  if(!currentUser){

    currentUserProfile = null;

    return;

  }


  try{

    const profileReference =
    doc(
      db,
      "users",
      currentUser.uid
    );


    const profileSnapshot =
    await getDoc(profileReference);


    if(profileSnapshot.exists()){

      currentUserProfile = {

        uid:
        currentUser.uid,

        ...profileSnapshot.data()

      };

    }else{

      currentUserProfile = {

        uid:
        currentUser.uid,

        name:
        currentUser.displayName ||
        "Community Member",

        email:
        currentUser.email || "",

        profilePicture:
        currentUser.photoURL ||
        defaultProfilePicture

      };

    }

  }catch(error){

    console.error(
      "Profile loading error:",
      error
    );


    currentUserProfile = {

      uid:
      currentUser.uid,

      name:
      currentUser.displayName ||
      "Community Member",

      email:
      currentUser.email || "",

      profilePicture:
      currentUser.photoURL ||
      defaultProfilePicture

    };

  }

}


/* =====================================================
   START FEED AFTER AUTHENTICATION
===================================================== */

showLoadingMessage();


onAuthStateChanged(
  auth,

  async(user)=>{

    currentUser =
    user || null;


    await loadCurrentUserProfile();


    /*
      initializeFeed() is written in Part 2.
    */

    initializeFeed();

  },

  (error)=>{

    console.error(
      "Authentication error:",
      error
    );


    showErrorMessage(
      "Authentication failed. Please refresh the page."
    );

  }
);
/* =====================================================
   PART 2 OF 6
   LOAD COMMUNITY POSTS FROM FIRESTORE
===================================================== */


/* =====================================================
   STOP OLD POST LISTENER
===================================================== */

function stopPostsListener(){

  if(unsubscribePosts){

    unsubscribePosts();

    unsubscribePosts = null;

  }

}


/* =====================================================
   STOP OLD LIKE LISTENERS
===================================================== */

function stopAllLikeListeners(){

  for(
    const unsubscribeLike
    of likeListeners.values()
  ){

    unsubscribeLike();

  }


  likeListeners.clear();

}


/* =====================================================
   INITIALIZE FEED
===================================================== */

function initializeFeed(){

  stopPostsListener();

  stopAllLikeListeners();

  loadCommunityPosts();

}


/* =====================================================
   LOAD COMMUNITY POSTS
===================================================== */

function loadCommunityPosts(){

  showLoadingMessage();

  stopPostsListener();

  stopAllLikeListeners();


  try{

    const postsReference =
    collection(
      db,
      "communityPosts"
    );


    /*
      Your create-post page saves the date
      inside the field named "timestamp".
    */

    const postsQuery =
    query(
      postsReference,
      orderBy(
        "timestamp",
        "desc"
      )
    );


    unsubscribePosts =
    onSnapshot(

      postsQuery,

      async(snapshot)=>{

        try{

          if(snapshot.empty){

            showEmptyMessage();

            return;

          }


          postsContainer.innerHTML = "";


          for(
            const postDocument
            of snapshot.docs
          ){

            const postData = {

              id:
              postDocument.id,

              ...postDocument.data()

            };


            /*
              createPostCard() is written
              in Part 3.
            */

            const postCard =
            await createPostCard(
              postData
            );


            postsContainer.appendChild(
              postCard
            );

          }


          /*
            scrollToSharedPost() is written
            in Part 5.
          */

          setTimeout(
            ()=>{

              if(
                typeof scrollToSharedPost ===
                "function"
              ){

                scrollToSharedPost();

              }

            },
            300
          );

        }catch(error){

          console.error(
            "Post display error:",
            error
          );


          showErrorMessage(
            error.message ||
            "The posts were found, but they could not be displayed."
          );

        }

      },

      (error)=>{

        console.error(
          "Firestore posts error:",
          error
        );


        let message =
        "Please check your internet connection and try again.";


        if(
          error.code ===
          "permission-denied"
        ){

          message =
          "Firebase denied permission to read community posts. Check your Firestore security rules.";

        }else if(
          error.code ===
          "failed-precondition"
        ){

          message =
          "Firebase needs an index for the community posts query.";

        }else if(
          error.code ===
          "unavailable"
        ){

          message =
          "Firebase is temporarily unavailable. Please try again.";

        }else if(error.message){

          message =
          error.message;

        }


        showErrorMessage(
          message
        );

      }

    );

  }catch(error){

    console.error(
      "Feed initialization error:",
      error
    );


    showErrorMessage(
      error.message ||
      "An unexpected error occurred while loading community posts."
    );

  }

}


/* =====================================================
   REFRESH BUTTON
===================================================== */

refreshButton.addEventListener(
  "click",
  ()=>{

    refreshButton.disabled = true;

    refreshButton.textContent =
    "⏳ Refreshing...";


    initializeFeed();


    setTimeout(
      ()=>{

        refreshButton.disabled = false;

        refreshButton.textContent =
        "🔄 Refresh";

      },
      1200
    );

  }
);
/* =====================================================
   PART 3 OF 6
   CREATE AND DISPLAY EACH COMMUNITY POST
===================================================== */


/* =====================================================
   FORMAT POST DATE
===================================================== */

function formatPostDate(value){

  if(!value){

    return "Recently";

  }


  try{

    let date;


    if(
      typeof value.toDate ===
      "function"
    ){

      date =
      value.toDate();

    }else if(value.seconds){

      date =
      new Date(
        value.seconds * 1000
      );

    }else{

      date =
      new Date(value);

    }


    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return "Recently";

    }


    return date.toLocaleString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }catch(error){

    console.error(
      "Date formatting error:",
      error
    );


    return "Recently";

  }

}


/* =====================================================
   LOAD THE POST AUTHOR'S PROFILE
===================================================== */

async function loadPostAuthorProfile(postData){

  const authorId =
  getFirstValue(
    postData.userId,
    postData.authorId,
    postData.uid,
    postData.ownerId
  );


  let authorProfile = {

    uid:
    authorId,

    name:
    getFirstValue(
      postData.name,
      postData.fullName,
      postData.authorName,
      postData.displayName,
      "Community Member"
    ),

    picture:
    getFirstValue(
      postData.picture,
      postData.profilePicture,
      postData.profilePhoto,
      postData.photoURL,
      defaultProfilePicture
    ),

    country:
    getFirstValue(
      postData.country
    )

  };


  if(!authorId){

    return authorProfile;

  }


  try{

    const profileReference =
    doc(
      db,
      "users",
      authorId
    );


    const profileSnapshot =
    await getDoc(
      profileReference
    );


    if(profileSnapshot.exists()){

      const profileData =
      profileSnapshot.data();


      authorProfile = {

        uid:
        authorId,

        name:
        getFirstValue(
          profileData.name,
          profileData.fullName,
          profileData.displayName,
          authorProfile.name
        ),

        picture:
        getFirstValue(
          profileData.profilePicture,
          profileData.picture,
          profileData.photoURL,
          profileData.profileImage,
          profileData.profilePhoto,
          authorProfile.picture,
          defaultProfilePicture
        ),

        country:
        getFirstValue(
          profileData.country,
          authorProfile.country
        )

      };

    }

  }catch(error){

    console.error(
      "Author profile loading error:",
      error
    );

  }


  return authorProfile;

}


/* =====================================================
   READ POST VALUES
===================================================== */

function getPostMessage(postData){

  return getFirstValue(
    postData.post,
    postData.message,
    postData.postText,
    postData.content,
    postData.text,
    postData.description
  );

}


function getPostCategory(postData){

  return getFirstValue(
    postData.category,
    postData.postCategory,
    postData.type
  );

}


function getPostImage(postData){

  return getFirstValue(
    postData.imageUrl,
    postData.imageURL,
    postData.postImage,
    postData.photoUrl,
    postData.photoURL,
    postData.image
  );

}


/* =====================================================
   CREATE ONE POST CARD
===================================================== */

async function createPostCard(postData){

  const authorProfile =
  await loadPostAuthorProfile(
    postData
  );


  const postMessage =
  getPostMessage(
    postData
  );


  const postCategory =
  getPostCategory(
    postData
  );


  const postImage =
  getPostImage(
    postData
  );


  const postDate =
  formatPostDate(
    postData.timestamp ||
    postData.createdAt ||
    postData.dateCreated ||
    postData.postedAt
  );


  const postCard =
  document.createElement(
    "article"
  );


  postCard.className =
  "postCard";


  postCard.dataset.postId =
  postData.id || "";


  postCard.dataset.authorId =
  authorProfile.uid || "";


  const safePostId =
  escapeHTML(
    postData.id || ""
  );


  const safeAuthorId =
  escapeHTML(
    authorProfile.uid || ""
  );


  const safeAuthorName =
  escapeHTML(
    authorProfile.name ||
    "Community Member"
  );


  const safeAuthorPicture =
  escapeHTML(
    authorProfile.picture ||
    defaultProfilePicture
  );


  const safeCountry =
  escapeHTML(
    authorProfile.country || ""
  );


  const safePostMessage =
  escapeHTML(
    postMessage || ""
  );


  const safePostCategory =
  escapeHTML(
    postCategory || ""
  );


  const safePostImage =
  escapeHTML(
    postImage || ""
  );


  const safePostDate =
  escapeHTML(
    postDate
  );


  postCard.innerHTML = `

    <div class="postHeader">

      <img
        class="authorPicture"
        src="${safeAuthorPicture}"
        alt="${safeAuthorName}'s profile picture"
        data-author-id="${safeAuthorId}"
      >

      <div class="authorInformation">

        <div
          class="authorName"
          data-author-id="${safeAuthorId}"
        >
          ${safeAuthorName}
        </div>

        <div class="postDetails">

          ${
            safeCountry
            ? `${safeCountry} • `
            : ""
          }

          ${safePostDate}

        </div>

      </div>

    </div>


    ${
      safePostCategory
      ? `

        <div class="postCategory">
          ${safePostCategory}
        </div>

      `
      : ""
    }


    ${
      safePostMessage
      ? `

        <div class="postMessage">
          ${safePostMessage}
        </div>

      `
      : ""
    }


    ${
      safePostImage
      ? `

        <img
          class="communityPostImage"
          src="${safePostImage}"
          alt="Community post image"
          loading="lazy"
        >

      `
      : ""
    }


    <div class="postActions">

      <button
        type="button"
        class="likeButton"
        data-post-id="${safePostId}"
      >
        🤍 Like (0)
      </button>

      <button
        type="button"
        class="commentButton"
        data-post-id="${safePostId}"
      >
        💬 Comments
      </button>

      <button
        type="button"
        class="shareButton"
        data-post-id="${safePostId}"
      >
        ↗ Share
      </button>

    </div>

  `;


  /* ===================================================
     FALLBACK PROFILE PICTURE
  =================================================== */

  const authorPicture =
  postCard.querySelector(
    ".authorPicture"
  );


  if(authorPicture){

    authorPicture.addEventListener(
      "error",
      ()=>{

        authorPicture.src =
        defaultProfilePicture;

      },
      {
        once:true
      }
    );

  }


  /* ===================================================
     REMOVE BROKEN POST IMAGE
  =================================================== */

  const communityPostImage =
  postCard.querySelector(
    ".communityPostImage"
  );


  if(communityPostImage){

    communityPostImage.addEventListener(
      "error",
      ()=>{

        communityPostImage.remove();

      },
      {
        once:true
      }
    );

  }


  /* ===================================================
     OPEN MEMBER PROFILE
  =================================================== */

  const openAuthorProfile = ()=>{

    const authorId =
    authorProfile.uid;


    if(!authorId){

      alert(
        "This member's profile is unavailable."
      );

      return;

    }


    window.location.href =
    "profile.html?uid=" +
    encodeURIComponent(
      authorId
    );

  };


  if(authorPicture){

    authorPicture.addEventListener(
      "click",
      openAuthorProfile
    );

  }


  const authorName =
  postCard.querySelector(
    ".authorName"
  );


  if(authorName){

    authorName.addEventListener(
      "click",
      openAuthorProfile
    );

  }


  /*
    setupLikeButton() is written in Part 4.
    setupPostActions() is written in Part 5.
  */

  setupLikeButton(
    postData,
    postCard
  );


  setupPostActions(
    postData,
    postCard
  );


  return postCard;

}
/* =====================================================
   PART 4 OF 6
   COMPLETE LIKE SYSTEM
===================================================== */


/* =====================================================
   STOP OLD LIKE LISTENER FOR ONE POST
===================================================== */

function stopLikeListener(postId){

  const oldListener =
  likeListeners.get(postId);


  if(oldListener){

    oldListener();

    likeListeners.delete(postId);

  }

}


/* =====================================================
   SET UP LIKE BUTTON
===================================================== */

function setupLikeButton(
  postData,
  postCard
){

  const likeButton =
  postCard.querySelector(
    ".likeButton"
  );


  if(!likeButton){

    return;

  }


  const postId =
  postData.id;


  if(!postId){

    likeButton.disabled = true;

    likeButton.textContent =
    "🤍 Like unavailable";

    return;

  }


  stopLikeListener(
    postId
  );


  const likesReference =
  collection(
    db,
    "communityPosts",
    postId,
    "likes"
  );


  /* ===================================================
     LIVE LIKE COUNT
  =================================================== */

  const unsubscribeLikes =
  onSnapshot(

    likesReference,

    (snapshot)=>{

      const totalLikes =
      snapshot.size;


      let currentUserLiked =
      false;


      if(currentUser){

        currentUserLiked =
        snapshot.docs.some(
          likeDocument =>
          likeDocument.id ===
          currentUser.uid
        );

      }


      likeButton.dataset.liked =
      currentUserLiked
      ? "true"
      : "false";


      likeButton.classList.toggle(
        "liked",
        currentUserLiked
      );


      likeButton.textContent =
      currentUserLiked
      ? `❤️ Liked (${totalLikes})`
      : `🤍 Like (${totalLikes})`;

    },

    (error)=>{

      console.error(
        `Like listener error for post ${postId}:`,
        error
      );


      const oldLikes =
      Number(
        postData.likes
      ) || 0;


      likeButton.dataset.liked =
      "false";


      likeButton.classList.remove(
        "liked"
      );


      likeButton.textContent =
      `🤍 Like (${oldLikes})`;

    }

  );


  likeListeners.set(
    postId,
    unsubscribeLikes
  );


  /* ===================================================
     LIKE BUTTON CLICK
  =================================================== */

  likeButton.addEventListener(
    "click",
    async()=>{

      if(!currentUser){

        alert(
          "Please sign in before liking a post."
        );

        return;

      }


      const userLikeReference =
      doc(
        db,
        "communityPosts",
        postId,
        "likes",
        currentUser.uid
      );


      const hasLiked =
      likeButton.dataset.liked ===
      "true";


      likeButton.disabled =
      true;


      try{

        if(hasLiked){

          await deleteDoc(
            userLikeReference
          );

        }else{

          const likerName =
          getFirstValue(
            currentUserProfile?.name,
            currentUserProfile?.fullName,
            currentUserProfile?.displayName,
            currentUser.displayName,
            "Community Member"
          );


          const likerPicture =
          getFirstValue(
            currentUserProfile?.profilePicture,
            currentUserProfile?.picture,
            currentUserProfile?.photoURL,
            currentUserProfile?.profileImage,
            currentUserProfile?.profilePhoto,
            currentUser.photoURL,
            defaultProfilePicture
          );


          await setDoc(
            userLikeReference,
            {

              userId:
              currentUser.uid,

              name:
              likerName,

              picture:
              likerPicture,

              likedAt:
              serverTimestamp()

            }
          );

        }

      }catch(error){

        console.error(
          "Like update error:",
          error
        );


        let message =
        "The Like could not be updated. Please try again.";


        if(
          error.code ===
          "permission-denied"
        ){

          message =
          "Firebase denied permission to update the Like. Check your Firestore security rules.";

        }else if(error.message){

          message =
          error.message;

        }


        alert(
          message
        );

      }finally{

        likeButton.disabled =
        false;

      }

    }
  );

}

/* =====================================================
   SET UP COMMENTS AND SHARE FOR EACH POST
===================================================== */

function setupPostActions(
  postData,
  postCard
){

  const commentButton =
  postCard.querySelector(
    ".commentButton"
  );


  const shareButton =
  postCard.querySelector(
    ".shareButton"
  );


  const postId =
  postData.id;


  /* ===================================================
     OPEN COMMENTS PAGE
  =================================================== */

  if(commentButton){

    commentButton.addEventListener(
      "click",
      ()=>{

        if(!postId){

          alert(
            "This post cannot be opened."
          );

          return;

        }


        window.location.href =
        "comments.html?postId=" +
        encodeURIComponent(
          postId
        );

      }
    );

  }


  /* ===================================================
     SHARE POST
  =================================================== */

  if(shareButton){

    shareButton.addEventListener(
      "click",
      async()=>{

        if(!postId){

          alert(
            "This post cannot be shared."
          );

          return;

        }


        const postLink =
        window.location.origin +
        window.location.pathname +
        "?postId=" +
        encodeURIComponent(
          postId
        );


        const postMessage =
        getPostMessage(
          postData
        );


        const shareText =
        postMessage
        ? postMessage.slice(
            0,
            180
          )
        : "View this community post";


        try{

          if(navigator.share){

            await navigator.share({

              title:
              "SABASABA Community Post",

              text:
              shareText,

              url:
              postLink

            });

          }else if(
            navigator.clipboard
          ){

            await navigator.clipboard.writeText(
              postLink
            );


            alert(
              "Post link copied successfully."
            );

          }else{

            prompt(
              "Copy this post link:",
              postLink
            );

          }

        }catch(error){

          if(
            error.name ===
            "AbortError"
          ){

            return;

          }


          console.error(
            "Post sharing error:",
            error
          );


          try{

            if(
              navigator.clipboard
            ){

              await navigator.clipboard.writeText(
                postLink
              );


              alert(
                "Post link copied successfully."
              );

            }else{

              prompt(
                "Copy this post link:",
                postLink
              );

            }

          }catch(copyError){

            console.error(
              "Copying link error:",
              copyError
            );


            prompt(
              "Copy this post link:",
              postLink
            );

          }

        }

      }
    );

  }

}

/* =====================================================
   OPEN A POST FROM A SHARED LINK
===================================================== */

function scrollToSharedPost(){

  const parameters =
  new URLSearchParams(
    window.location.search
  );


  const sharedPostId =
  parameters.get(
    "postId"
  );


  if(!sharedPostId){

    return;

  }


  let sharedPost = null;


  try{

    sharedPost =
    document.querySelector(

      `[data-post-id="${CSS.escape(sharedPostId)}"]`

    );

  }catch(error){

    console.error(
      "Shared post selector error:",
      error
    );

    return;

  }


  if(!sharedPost){

    return;

  }


  sharedPost.scrollIntoView({

    behavior:
    "smooth",

    block:
    "center"

  });


  sharedPost.style.outline =
  "4px solid #0874d1";


  sharedPost.style.outlineOffset =
  "4px";


  setTimeout(
    ()=>{

      sharedPost.style.outline =
      "none";


      sharedPost.style.outlineOffset =
      "0";

    },
    3500
  );

}
