<script type="module">

/* =====================================================
   PART 1: FIREBASE SETUP AND PAGE INITIALIZATION
===================================================== */

import{
  auth,
  db,
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  getDoc,
  setDoc,
  deleteDoc,
  serverTimestamp,
  onAuthStateChanged
}from "./firebase.js";


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const postsContainer =
document.getElementById("postsContainer");

const createPostButton =
document.getElementById("createPostButton");

const refreshButton =
document.getElementById("refreshButton");

const backButton =
document.getElementById("backButton");


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let currentUserProfile = null;

let unsubscribePosts = null;

const defaultProfilePicture =
"https://cdn-icons-png.flaticon.com/512/149/149071.png";


/* =====================================================
   SHOW LOADING MESSAGE
===================================================== */

function showLoadingMessage(){

  postsContainer.innerHTML = `

    <div class="loadingMessage">

      Loading community posts...

    </div>

  `;

}


/* =====================================================
   SHOW ERROR MESSAGE
===================================================== */

function showErrorMessage(message){

  postsContainer.innerHTML = `

    <div class="errorMessage">

      <strong>Community posts could not be loaded.</strong>

      <br><br>

      ${message}

    </div>

  `;

}


/* =====================================================
   LOAD CURRENT USER PROFILE
===================================================== */

async function loadCurrentUserProfile(){

  if(!currentUser){

    currentUserProfile = null;

    return;

  }

  try{

    const userReference =
    doc(
      db,
      "users",
      currentUser.uid
    );

    const userSnapshot =
    await getDoc(userReference);


    if(userSnapshot.exists()){

      currentUserProfile = {
        id:userSnapshot.id,
        ...userSnapshot.data()
      };

    }else{

      currentUserProfile = {

        id:currentUser.uid,

        uid:currentUser.uid,

        fullName:
        currentUser.displayName ||
        "Community Member",

        email:
        currentUser.email || "",

        profilePhoto:
        currentUser.photoURL ||
        defaultProfilePicture

      };

    }

  }catch(error){

    console.error(
      "Current profile loading error:",
      error
    );

    currentUserProfile = {

      id:currentUser.uid,

      uid:currentUser.uid,

      fullName:
      currentUser.displayName ||
      "Community Member",

      email:
      currentUser.email || "",

      profilePhoto:
      currentUser.photoURL ||
      defaultProfilePicture

    };

  }

}


/* =====================================================
   AUTHENTICATION CHECK
===================================================== */

showLoadingMessage();


onAuthStateChanged(
  auth,
  async(user)=>{

    currentUser = user || null;

    await loadCurrentUserProfile();

    loadCommunityPosts();

  },
  (error)=>{

    console.error(
      "Authentication error:",
      error
    );

    showErrorMessage(
      "Authentication failed. Please refresh the page."
    );

  }
);

/* =====================================================
   PART 2: LOAD COMMUNITY POSTS
===================================================== */

function loadCommunityPosts(){

  showLoadingMessage();


  /* Stop the previous listener before creating another */

  if(unsubscribePosts){

    unsubscribePosts();

    unsubscribePosts = null;

  }


  try{

    const postsCollection =
    collection(
      db,
      "communityPosts"
    );


    const postsQuery =
    query(
      postsCollection,
      orderBy("createdAt","desc")
    );


    unsubscribePosts =
    onSnapshot(
      postsQuery,

      async(snapshot)=>{

        if(snapshot.empty){

          postsContainer.innerHTML = `

            <div class="emptyMessage">

              <strong>No community posts yet.</strong>

              <br><br>

              Be the first person to share God's Word,
              a testimony, encouragement or prayer.

            </div>

          `;

          return;

        }


        postsContainer.innerHTML = "";


        for(const postDocument of snapshot.docs){

          const postData = {

            id:postDocument.id,

            ...postDocument.data()

          };

for(const postDocument of snapshot.docs){

  const postData = {

    id:postDocument.id,

    ...postDocument.data()

  };


  const postCard =
  await createPostCard(postData);


  postsContainer.appendChild(
    postCard
  );

}


setTimeout(
  scrollToSharedPost,
  300
);

        }

      },

      (error)=>{

        console.error(
          "Community posts listener error:",
          error
        );


        let errorMessage =
        "Please check your internet connection and try again.";


        if(error.code === "permission-denied"){

          errorMessage =
          "Firestore permission was denied. Please check your Firestore security rules.";

        }else if(error.code === "failed-precondition"){

          errorMessage =
          "Firestore needs an index for these posts. Check the Firebase console error message.";

        }else if(error.message){

          errorMessage =
          error.message;

        }


        showErrorMessage(
          errorMessage
        );

      }
    );

  }catch(error){

    console.error(
      "Community posts loading error:",
      error
    );


    showErrorMessage(

      error.message ||

      "An unexpected error occurred while loading posts."

    );

  }

}


/* =====================================================
   MANUAL REFRESH
===================================================== */

refreshButton.addEventListener(
  "click",
  ()=>{

    refreshButton.disabled = true;

    refreshButton.textContent =
    "⏳ Refreshing...";


    loadCommunityPosts();


    setTimeout(
      ()=>{

        refreshButton.disabled = false;

        refreshButton.textContent =
        "🔄 Refresh";

      },
      1200
    );

  }
);
/* =====================================================
   PART 3: CREATE AND DISPLAY EACH POST
===================================================== */


/* Prevent HTML code from being inserted through posts */

function escapeHTML(value){

  return String(value ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* =====================================================
   FORMAT POST DATE
===================================================== */

function formatPostDate(dateValue){

  if(!dateValue){

    return "Recently";

  }

  try{

    let date;


    if(typeof dateValue.toDate === "function"){

      date = dateValue.toDate();

    }else if(dateValue.seconds){

      date =
      new Date(
        dateValue.seconds * 1000
      );

    }else{

      date =
      new Date(dateValue);

    }


    if(Number.isNaN(date.getTime())){

      return "Recently";

    }


    return date.toLocaleString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }catch(error){

    console.error(
      "Date formatting error:",
      error
    );

    return "Recently";

  }

}


/* =====================================================
   LOAD POST AUTHOR PROFILE
===================================================== */

async function loadPostAuthorProfile(postData){

  const authorId =

  postData.authorId ||

  postData.userId ||

  postData.uid ||

  postData.ownerId ||

  "";


  let authorProfile = {

    uid:authorId,

    fullName:

    postData.authorName ||

    postData.fullName ||

    postData.userName ||

    postData.name ||

    "Community Member",

    profilePhoto:

    postData.authorPhoto ||

    postData.profilePhoto ||

    postData.photoURL ||

    postData.userPhoto ||

    defaultProfilePicture,

    country:

    postData.country || ""

  };


  if(!authorId){

    return authorProfile;

  }


  try{

    const userReference =
    doc(
      db,
      "users",
      authorId
    );


    const userSnapshot =
    await getDoc(userReference);


    if(userSnapshot.exists()){

      const userData =
      userSnapshot.data();


      authorProfile = {

        uid:authorId,

        fullName:

        userData.fullName ||

        userData.displayName ||

        userData.name ||

        authorProfile.fullName,

        profilePhoto:

        userData.profilePhoto ||

        userData.photoURL ||

        userData.photo ||

        authorProfile.profilePhoto,

        country:

        userData.country ||

        authorProfile.country

      };

    }

  }catch(error){

    console.error(
      "Post author profile loading error:",
      error
    );

  }


  return authorProfile;

}


/* =====================================================
   GET POST VALUES
===================================================== */

function getPostMessage(postData){

  return (

    postData.message ||

    postData.postText ||

    postData.content ||

    postData.text ||

    postData.description ||

    ""

  );

}


function getPostImage(postData){

  return (

    postData.imageUrl ||

    postData.imageURL ||

    postData.postImage ||

    postData.photoUrl ||

    postData.photoURL ||

    postData.image ||

    ""

  );

}


function getPostCategory(postData){

  return (

    postData.category ||

    postData.postCategory ||

    postData.type ||

    ""

  );

}


/* =====================================================
   CREATE ONE POST CARD
===================================================== */

async function createPostCard(postData){

  const authorProfile =
  await loadPostAuthorProfile(postData);


  const postMessage =
  getPostMessage(postData);


  const postImage =
  getPostImage(postData);


  const postCategory =
  getPostCategory(postData);


  const postDate =
  formatPostDate(

    postData.createdAt ||

    postData.timestamp ||

    postData.dateCreated ||

    postData.postedAt

  );


  const safeAuthorName =
  escapeHTML(authorProfile.fullName);


  const safeAuthorPhoto =
  escapeHTML(

    authorProfile.profilePhoto ||

    defaultProfilePicture

  );


  const safeCountry =
  escapeHTML(authorProfile.country);


  const safeMessage =
  escapeHTML(postMessage);


  const safeImage =
  escapeHTML(postImage);


  const safeCategory =
  escapeHTML(postCategory);


  const safeAuthorId =
  escapeHTML(authorProfile.uid);


  const safePostId =
  escapeHTML(postData.id);


  const postCard =
  document.createElement("article");


  postCard.className =
  "postCard";


  postCard.dataset.postId =
  postData.id;


  postCard.dataset.authorId =
  authorProfile.uid || "";


  postCard.innerHTML = `

    <div class="postHeader">

      <img
        class="authorPicture"
        src="${safeAuthorPhoto}"
        alt="${safeAuthorName}'s profile picture"
        data-author-id="${safeAuthorId}"
      >

      <div class="authorInformation">

        <div
          class="authorName"
          data-author-id="${safeAuthorId}"
        >

          ${safeAuthorName}

        </div>

        <div class="postDetails">

          ${safeCountry
            ? `${safeCountry} • `
            : ""
          }

          ${escapeHTML(postDate)}

        </div>

      </div>

    </div>


    ${safeCategory
      ? `

        <div class="postCategory">

          ${safeCategory}

        </div>

      `
      : ""
    }


    ${safeMessage
      ? `

        <div class="postMessage">

          ${safeMessage}

        </div>

      `
      : ""
    }


    ${safeImage
      ? `

        <img
          class="communityPostImage"
          src="${safeImage}"
          alt="Community post image"
          loading="lazy"
        >

      `
      : ""
    }


    <div class="postActions">

      <button
        type="button"
        class="likeButton"
        data-post-id="${safePostId}"
      >

        🤍 Like (0)

      </button>


      <button
        type="button"
        class="commentButton"
        data-post-id="${safePostId}"
      >

        💬 Comments

      </button>


      <button
        type="button"
        class="shareButton"
        data-post-id="${safePostId}"
      >

        ↗ Share

      </button>

    </div>

  `;


  /* Use default picture when an image cannot load */

  const authorPicture =
  postCard.querySelector(
    ".authorPicture"
  );


  authorPicture.addEventListener(
    "error",
    ()=>{

      authorPicture.src =
      defaultProfilePicture;

    },
    {
      once:true
    }
  );


  /* Hide a broken post image */

  const communityPostImage =
  postCard.querySelector(
    ".communityPostImage"
  );


  if(communityPostImage){

    communityPostImage.addEventListener(
      "error",
      ()=>{

        communityPostImage.remove();

      },
      {
        once:true
      }
    );

  }


  /* Open the author's profile */

  const openProfile = ()=>{

    const authorId =
    authorProfile.uid;


    if(!authorId){

      alert(
        "This member's profile is unavailable."
      );

      return;

    }


    window.location.href =

    "profile.html?uid=" +

    encodeURIComponent(authorId);

  };


  authorPicture.addEventListener(
    "click",
    openProfile
  );


  const authorName =
  postCard.querySelector(
    ".authorName"
  );


  authorName.addEventListener(
    "click",
    openProfile
  );


  /*
    Part 4 will activate the real Like button.

    Part 5 will activate Comments and Share.
  */

  if(
    typeof setupLikeButton ===
    "function"
  ){

    setupLikeButton(
      postData,
      postCard
    );

  }


  if(
    typeof setupPostActions ===
    "function"
  ){

    setupPostActions(
      postData,
      postCard
    );

  }


  return postCard;

}
/* =====================================================
   PART 4: REAL LIKE SYSTEM
===================================================== */


/*
  Store every Like listener so that duplicate listeners
  can be stopped when posts are loaded again.
*/

const likeListeners =
new Map();


/* =====================================================
   STOP AN OLD LIKE LISTENER
===================================================== */

function stopOldLikeListener(postId){

  const oldListener =
  likeListeners.get(postId);


  if(oldListener){

    oldListener();

    likeListeners.delete(postId);

  }

}


/* =====================================================
   SET UP THE LIKE BUTTON
===================================================== */

function setupLikeButton(postData,postCard){

  const likeButton =
  postCard.querySelector(".likeButton");


  if(!likeButton){

    return;

  }


  const postId =
  postData.id;


  if(!postId){

    likeButton.disabled = true;

    likeButton.textContent =
    "🤍 Like unavailable";

    return;

  }


  /*
    Stop a previous listener for this post before
    starting a new listener.
  */

  stopOldLikeListener(postId);


  const likesCollection =
  collection(
    db,
    "communityPosts",
    postId,
    "likes"
  );


  /*
    Listen continuously to the number of Likes.
  */

  const unsubscribeLikes =
  onSnapshot(

    likesCollection,

    (snapshot)=>{

      const totalLikes =
      snapshot.size;


      const userHasLiked =

      currentUser

      ? snapshot.docs.some(

          likeDocument =>

          likeDocument.id ===
          currentUser.uid

        )

      : false;


      likeButton.textContent =

      userHasLiked

      ? `❤️ Liked (${totalLikes})`

      : `🤍 Like (${totalLikes})`;


      likeButton.classList.toggle(
        "liked",
        userHasLiked
      );


      likeButton.dataset.liked =
      userHasLiked
      ? "true"
      : "false";

    },

    (error)=>{

      console.error(
        `Likes loading error for post ${postId}:`,
        error
      );


      likeButton.textContent =
      "🤍 Like";


      likeButton.classList.remove(
        "liked"
      );

    }

  );


  likeListeners.set(
    postId,
    unsubscribeLikes
  );


  /* ===================================================
     LIKE BUTTON CLICK
  =================================================== */

  likeButton.addEventListener(
    "click",
    async()=>{

      if(!currentUser){

        alert(
          "Please sign in before liking a post."
        );

        return;

      }


      const currentUserLike =
      doc(
        db,
        "communityPosts",
        postId,
        "likes",
        currentUser.uid
      );


      const userHasLiked =

      likeButton.dataset.liked ===
      "true";


      likeButton.disabled = true;


      try{

        if(userHasLiked){

          /*
            Remove the Like.
          */

          await deleteDoc(
            currentUserLike
          );

        }else{

          /*
            Add the Like.
          */

          await setDoc(
            currentUserLike,
            {

              userId:
              currentUser.uid,

              uid:
              currentUser.uid,

              fullName:

              currentUserProfile?.fullName ||

              currentUser.displayName ||

              "Community Member",

              profilePhoto:

              currentUserProfile?.profilePhoto ||

              currentUser.photoURL ||

              defaultProfilePicture,

              likedAt:
              serverTimestamp()

            }
          );

        }

      }catch(error){

        console.error(
          "Like update error:",
          error
        );


        let message =
        "The Like could not be updated. Please try again.";


        if(
          error.code ===
          "permission-denied"
        ){

          message =
          "Firebase denied permission to update this Like. Please check your Firestore rules.";

        }


        alert(message);

      }finally{

        likeButton.disabled = false;

      }

    }
  );

}


/* =====================================================
   CLEAN UP LISTENERS WHEN LEAVING THE PAGE
===================================================== */

window.addEventListener(
  "beforeunload",
  ()=>{

    for(
      const unsubscribeLike
      of likeListeners.values()
    ){

      unsubscribeLike();

    }


    likeListeners.clear();


    if(unsubscribePosts){

      unsubscribePosts();

      unsubscribePosts = null;

    }

  }
);
/* =====================================================
   PART 5: COMMENTS, SHARE AND PAGE BUTTONS
===================================================== */


/* =====================================================
   SET UP COMMENTS AND SHARE FOR EACH POST
===================================================== */

function setupPostActions(postData,postCard){

  const commentButton =
  postCard.querySelector(".commentButton");

  const shareButton =
  postCard.querySelector(".shareButton");


  const postId =
  postData.id;


  /* ===================================================
     OPEN COMMENTS PAGE
  =================================================== */

  if(commentButton){

    commentButton.addEventListener(
      "click",
      ()=>{

        if(!postId){

          alert(
            "This post cannot be opened."
          );

          return;

        }


        window.location.href =

        "comments.html?postId=" +

        encodeURIComponent(postId);

      }
    );

  }


  /* ===================================================
     SHARE POST
  =================================================== */

  if(shareButton){

    shareButton.addEventListener(
      "click",
      async()=>{

        if(!postId){

          alert(
            "This post cannot be shared."
          );

          return;

        }


        const postLink =

        window.location.origin +

        window.location.pathname +

        "?postId=" +

        encodeURIComponent(postId);


        const postMessage =
        getPostMessage(postData);


        const shareText =

        postMessage

        ? postMessage.slice(0,180)

        : "View this community post";


        try{

          if(navigator.share){

            await navigator.share({

              title:
              "SABASABA Community Post",

              text:
              shareText,

              url:
              postLink

            });

          }else{

            await navigator.clipboard.writeText(
              postLink
            );


            alert(
              "Post link copied successfully."
            );

          }

        }catch(error){

          if(
            error.name ===
            "AbortError"
          ){

            return;

          }


          console.error(
            "Post sharing error:",
            error
          );


          try{

            await navigator.clipboard.writeText(
              postLink
            );


            alert(
              "Post link copied successfully."
            );

          }catch(copyError){

            console.error(
              "Post link copying error:",
              copyError
            );


            prompt(
              "Copy this post link:",
              postLink
            );

          }

        }

      }
    );

  }

}

/* =====================================================
   OPEN A SPECIFIC POST FROM A SHARED LINK
===================================================== */

function scrollToSharedPost(){

  const parameters =
  new URLSearchParams(
    window.location.search
  );


  const sharedPostId =
  parameters.get("postId");


  if(!sharedPostId){

    return;

  }


  const sharedPost =
  document.querySelector(

    `[data-post-id="${CSS.escape(sharedPostId)}"]`

  );


  if(!sharedPost){

    return;

  }


  sharedPost.scrollIntoView({

    behavior:"smooth",

    block:"center"

  });


  sharedPost.style.outline =
  "4px solid #0874d1";


  setTimeout(
    ()=>{

      sharedPost.style.outline =
      "none";

    },
    3500
  );

}
