<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Community Wall | SABASABA Gospel Ministry
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#eef3f8;
color:#222;
min-height:100vh;
}

button{
font-family:inherit;
cursor:pointer;
}

.pageContainer{
width:100%;
max-width:920px;
margin:0 auto;
padding:20px;
}

.wallHeader{
background:linear-gradient(135deg,#0874d1,#004d99);
color:white;
padding:38px 25px;
border-radius:24px;
text-align:center;
margin-bottom:24px;
box-shadow:0 7px 18px rgba(0,0,0,.15);
}

.wallHeader h1{
font-size:38px;
margin-bottom:14px;
}

.wallHeader p{
max-width:730px;
margin:auto;
font-size:18px;
line-height:1.65;
}

.wallControls{
display:flex;
align-items:center;
gap:14px;
margin-bottom:25px;
}

.controlButton{
border:none;
color:white;
padding:17px 16px;
border-radius:14px;
font-size:18px;
font-weight:bold;
box-shadow:0 4px 10px rgba(0,0,0,.12);
transition:.2s;
}

.controlButton:active{
transform:scale(.98);
}

.createPostButton{
flex:1;
background:#0874d1;
}

.createPostButton:hover{
background:#005eb8;
}

.refreshButton{
min-width:155px;
background:#28a745;
}

.refreshButton:hover{
background:#218838;
}
.postsContainer{
width:100%;
}

.loadingMessage,
.emptyMessage,
.errorMessage{
background:white;
padding:45px 25px;
text-align:center;
border-radius:22px;
font-size:18px;
line-height:1.6;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.loadingMessage,
.emptyMessage{
color:#777;
}

.errorMessage{
color:#b00020;
}

.postCard{
background:white;
border-radius:22px;
padding:22px;
margin-bottom:24px;
box-shadow:0 5px 15px rgba(0,0,0,.10);
overflow:hidden;
}

.postHeader{
display:flex;
align-items:center;
gap:14px;
margin-bottom:17px;
}

.authorPicture{
width:62px;
height:62px;
border-radius:50%;
object-fit:cover;
background:#ddd;
border:3px solid #e5edf5;
flex-shrink:0;
cursor:pointer;
}

.authorInformation{
flex:1;
min-width:0;
}

.authorName{
font-size:21px;
font-weight:bold;
color:#0066cc;
cursor:pointer;
word-break:break-word;
}

.authorName:hover{
text-decoration:underline;
}

.postDetails{
font-size:14px;
color:#777;
margin-top:5px;
line-height:1.45;
}

.postCategory{
display:inline-block;
padding:7px 13px;
margin-bottom:13px;
background:#eaf3ff;
color:#0066cc;
border-radius:20px;
font-size:14px;
font-weight:bold;
}

.postMessage{
font-size:17px;
line-height:1.75;
white-space:pre-wrap;
word-break:break-word;
margin-bottom:15px;
}

.communityPostImage{
display:block;
width:100%;
max-height:620px;
object-fit:cover;
border-radius:16px;
margin-top:15px;
background:#eee;
}

.postActions{
display:flex;
gap:10px;
margin-top:20px;
padding-top:16px;
border-top:1px solid #e5e5e5;
}

.postActions button{
flex:1;
border:none;
padding:13px 8px;
border-radius:12px;
font-size:16px;
font-weight:bold;
color:white;
}

.likeButton{
background:#1877f2;
}

.commentButton{
background:#28a745;
}

.shareButton{
background:#ff9800;
}
.backSection{
text-align:center;
margin:32px 0;
}

.backButton{
padding:15px 30px;
border:none;
border-radius:13px;
background:#666;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.backButton:hover{
background:#555;
}

@media(max-width:700px){

.pageContainer{
padding:16px;
}

.wallHeader{
padding:31px 18px;
}

.wallHeader h1{
font-size:31px;
}

.wallHeader p{
font-size:17px;
}

.wallControls{
gap:10px;
}

.controlButton{
font-size:16px;
padding:15px 10px;
}

.refreshButton{
min-width:0;
flex:.65;
}

.postCard{
padding:19px;
}

.authorPicture{
width:58px;
height:58px;
}

.postActions{
flex-direction:column;
}

.postActions button{
width:100%;
}

}

</style>

</head>

<body>

<main class="pageContainer">

<section class="wallHeader">

<h1>📰 Community Wall</h1>

<p>

Share God's Word, testimonies, encouragement and prayer with believers around the world.

</p>

</section>

<section class="wallControls">

<button
type="button"
id="createPostButton"
class="controlButton createPostButton">

✍️ Create New Post

</button>

<button
type="button"
id="refreshButton"
class="controlButton refreshButton">

🔄 Refresh

</button>

</section>

<section
id="postsContainer"
class="postsContainer">

<div class="loadingMessage">

Loading community posts...

</div>

</section>

<section class="backSection">

<button
type="button"
id="backButton"
class="backButton">

⬅ Back to Community

</button>

</section>

</main>
<script type="module">

import{
auth,
db,
collection,
onSnapshot,
onAuthStateChanged
}from "./firebase.js";

const postsContainer=
document.getElementById("postsContainer");

const createPostButton=
document.getElementById("createPostButton");

const refreshButton=
document.getElementById("refreshButton");

const backButton=
document.getElementById("backButton");

let unsubscribePosts=null;

createPostButton.addEventListener("click",()=>{

location.href="createpost.html";

});

refreshButton.addEventListener("click",()=>{

location.reload();

});

backButton.addEventListener("click",()=>{

location.href="community.html";

});

onAuthStateChanged(auth,(user)=>{

if(!user){

location.href="login.html";
return;

}

startCommunityWall();

});

function startCommunityWall(){

if(unsubscribePosts){

unsubscribePosts();

}

postsContainer.innerHTML=`

<div class="loadingMessage">

Loading community posts...

</div>

`;

unsubscribePosts=onSnapshot(

collection(db,"communityPosts"),

(snapshot)=>{

const posts=[];

snapshot.forEach((doc)=>{

posts.push({

id:doc.id,
...doc.data()

});

});

posts.sort((a,b)=>{

return getPostTime(b)-getPostTime(a);

});

renderPosts(posts);

},

(error)=>{

console.error(error);

postsContainer.innerHTML=`

<div class="errorMessage">

Unable to load community posts.

<br><br>

${error.message}

</div>

`;

}

);

}

function renderPosts(posts){

postsContainer.innerHTML="";

if(posts.length===0){

postsContainer.innerHTML=`

<div class="emptyMessage">

No community posts yet.

<br><br>

Be the first believer to encourage others.

</div>

`;

return;

}
posts.forEach((post)=>{

const name=
post.name||
post.fullName||
"Anonymous";

const picture=
post.picture||
post.profilePicture||
"images/profile.png";

const message=
post.post||
post.text||
"";

const image=
post.image||
post.postImage||
"";

const country=
post.country||
"";

const category=
post.category||
"";

const likes=
typeof post.likes==="number"
?post.likes
:0;

const comments=
Array.isArray(post.comments)
?post.comments.length
:(typeof post.comments==="number"
?post.comments
:0);

const date=getDisplayDate(post);

const card=document.createElement("article");

card.className="postCard";

card.innerHTML=`

<div class="postHeader">

<img
class="authorPicture"
src="${picture}"
alt="Profile Picture"
onerror="this.src='images/profile.png'">

<div class="authorInformation">

<div class="authorName">

${name}

</div>

<div class="postDetails">

${country}${country?" • ":""}${date}

</div>

</div>

</div>

${category?`

<div class="postCategory">

${category}

</div>

`:""}

<div class="postMessage">

${message}

</div>

${image?`

<img
class="communityPostImage"
src="${image}"
alt="Community Post"
onerror="this.style.display='none'">

`:""}

<div class="postActions">

<button class="likeButton">

❤️ Like (${likes})

</button>

<button class="commentButton">

💬 Comment (${comments})

</button>

<button class="shareButton">

📤 Share

</button>

</div>

`;

postsContainer.appendChild(card);

});
const postCards=
postsContainer.querySelectorAll(".postCard");

postCards.forEach((card,index)=>{

const post=posts[index];

const authorPicture=
card.querySelector(".authorPicture");

const authorName=
card.querySelector(".authorName");

const likeButton=
card.querySelector(".likeButton");

const commentButton=
card.querySelector(".commentButton");

const shareButton=
card.querySelector(".shareButton");

const userId=
post.userId||
post.uid||
post.authorId||
"";

function openMemberProfile(){

if(!userId){

alert("This member's profile is not available.");
return;

}

location.href=
"profileview.html?uid="+encodeURIComponent(userId);

}

authorPicture.addEventListener(
"click",
openMemberProfile
);

authorName.addEventListener(
"click",
openMemberProfile
);

likeButton.addEventListener("click",()=>{

alert("The Like feature will be connected next.");

});

commentButton.addEventListener("click",()=>{

location.href=
"comments.html?postId="+encodeURIComponent(post.id);

});

shareButton.addEventListener("click",async()=>{

const postAuthor=
post.name||
post.fullName||
"Community Member";

const postMessage=
post.post||
post.text||
"";

const shareText=
postAuthor+"\n\n"+postMessage;

try{

if(navigator.share){

await navigator.share({

title:"SABASABA Gospel Ministry",

text:shareText,

url:location.href

});

return;

}

if(navigator.clipboard){

await navigator.clipboard.writeText(shareText);

alert("✅ Post copied. You can now share it.");

return;

}

alert("Sharing is not supported on this device.");

}catch(error){

if(error.name!=="AbortError"){

console.error("Share error:",error);

alert("The post could not be shared.");

}

}

});

});

}
function getPostTime(post){

if(post.timestamp?.toMillis){

return post.timestamp.toMillis();

}

if(post.timestamp?.toDate){

return post.timestamp.toDate().getTime();

}

if(typeof post.timestamp==="number"){

return post.timestamp;

}

if(post.date){

const parsedDate=Date.parse(post.date);

if(!Number.isNaN(parsedDate)){

return parsedDate;

}

}

return 0;

}

function getDisplayDate(post){

if(post.timestamp?.toDate){

return post.timestamp
.toDate()
.toLocaleString();

}

if(post.date){

return String(post.date);

}

return "Recently";

}

</script>

</body>

</html>
