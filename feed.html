<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community Feed</title>

<style>

body{
font-family:Arial,sans-serif;
background:#eef3f8;
margin:0;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
}

.header{
background:#0066cc;
color:white;
padding:20px;
border-radius:15px;
text-align:center;
margin-bottom:20px;
}

.post{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.profile{
display:flex;
align-items:center;
margin-bottom:15px;
}

.avatar{
font-size:45px;
margin-right:15px;
}

.name{
font-weight:bold;
font-size:20px;
}

.time{
color:gray;
font-size:14px;
}

.post p{
font-size:18px;
line-height:1.6;
}

.actions{
display:flex;
justify-content:space-around;
margin-top:20px;
border-top:1px solid #ddd;
padding-top:15px;
}

.comments{
margin-top:15px;
padding-top:10px;
border-top:1px solid #ddd;
}

.comments p{
margin:6px 0;
}

button{
background:#0066cc;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#004d99;
}

.back{
text-align:center;
margin-top:30px;
}

.back a{
text-decoration:none;
}

.loading{
text-align:center;
padding:40px;
font-size:18px;
color:#666;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>📰 Community Feed</h1>
<p>Welcome to the SABASABA Gospel Ministry Community</p>
</div>

<div id="feedContainer"></div>

<div class="back">
<a href="community.html">
<button>⬅ Back to Community</button>
</a>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
getFirestore,
collection,
query,
orderBy,
onSnapshot,
doc,
updateDoc,
deleteDoc,
getDoc,
increment
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

// Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBy7eWmqoTqnNNGfV2YD9h2rabkCg_-QfU",
  authDomain: "sabasaba-gospel-ministry-414e2.firebaseapp.com",
  projectId: "sabasaba-gospel-ministry-414e2",
  storageBucket: "sabasaba-gospel-ministry-414e2.firebasestorage.app",
  messagingSenderId: "821278457946",
  appId: "1:821278457946:web:3593bd1743970f44c05863"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
async function addNotification(message){

try{

await addDoc(collection(db,"notifications"),{

message: message,

timestamp: serverTimestamp()

});

}catch(error){

console.error("Notification Error:", error);

}

}
let feed = document.getElementById("feedContainer");

// Load posts from Firestore
async function loadPosts() {
  feed.innerHTML = '<div class="loading">Loading community posts...</div>';
  
  try {
    const q = query(collection(db, "communityPosts"), orderBy("timestamp", "desc"));
    
    onSnapshot(q, (querySnapshot) => {
      feed.innerHTML = `
        <div class="post">
          <div class="profile">
            <div class="avatar">👤</div>
            <div>
              <div class="name">SABASABA Gospel Ministry</div>
              <div class="time">Today</div>
            </div>
          </div>
          <p>
            📖 Welcome to our Christian Community!
            Here you can encourage one another, share Bible verses, testimonies, prayer requests, and grow together in Christ.
            May God bless every member.
          </p>
          <div class="actions">
            <button onclick="alert('Welcome to the Community!')">
              👍 Like
            </button>
            <button onclick="alert('Leave an encouraging comment!')">
              💬 Comment
            </button>
            <button onclick="alert('Share this ministry with others!')">
              📤 Share
            </button>
          </div>
        </div>
      `;
      
      querySnapshot.forEach((docSnap) => {
        const post = docSnap.data();
        post.id = docSnap.id;
        
        feed.innerHTML += `
          <div class="post">
            <div class="profile">
              <img
              src="${post.picture || '👤'}"
              style="width:55px;height:55px;border-radius:50%;margin-right:15px;object-fit:cover;border:2px solid #0066cc;">
              <div>
                <div class="name">${post.name}</div>
                <div class="time">${new Date(post.timestamp?.toDate?.() || new Date()).toLocaleDateString()}</div>
              </div>
            </div>
            <p>
              <b>Category:</b> ${post.category}
              <br><br>
              ${post.post}
            </p>
            <div class="actions">
              <button onclick="likePost('${post.id}')">
                👍 <span id="likes${post.id}">${post.likes || 0}</span>
              </button>
              <button onclick="commentPost('${post.id}')">
                💬 Comment
              </button>
              <button onclick="sharePost('${post.name}')">
                📤 Share
              </button>
              <button onclick="deletePost('${post.id}')">
                🗑 Delete
              </button>
            </div>
            <div class="comments">
              <h4>💬 Comments</h4>
              <div id="comments${post.id}">
                ${(post.comments || []).map(c => `
                  <p>
                    🗨️ ${c}
                    <br>
                    <button onclick="replyComment('${post.id}')">↩ Reply</button>
                  </p>
                `).join("")}
              </div>
            </div>
          </div>
        `;
      });
    });
  } catch (error) {
    console.error("Error loading posts:", error);
    feed.innerHTML = '<div class="loading">Error loading posts. Please refresh the page.</div>';
  }
}

// Like post
window.likePost = async function(postId){

try{

const postRef = doc(db,"communityPosts",postId);

await updateDoc(postRef,{
likes: increment(1)
});

}catch(error){

console.error(error);

alert("Unable to like this post.");

}

};

// Comment on post
window.commentPost = async function(postId) {
  const comment = prompt("Write your comment");
  
  if(comment == null || comment.trim() == "") return;
  
  try {
    const postRef = doc(db, "communityPosts", postId);
    const postSnap = await getDoc(postRef);
    const post = postSnap.data();
    
    await updateDoc(postRef, {
      comments: [...(post.comments || []), comment]
    });
  } catch (error) {
    console.error("Error adding comment:", error);
    alert("Error adding comment");
  }
};

// Share post
window.sharePost = function(name) {
  alert("Thanks for sharing " + name + "'s post.");
};

// Delete post
window.deletePost = async function(postId) {
  const answer = confirm("Are you sure you want to delete this post?");
  
  if(!answer) return;
  
  try {
    await deleteDoc(doc(db, "communityPosts", postId));
    alert("✅ Post deleted successfully!");
  } catch (error) {
    console.error("Error deleting post:", error);
    alert("Error deleting post");
  }
};

// Reply to comment
window.replyComment = async function(postId) {
  const reply = prompt("Write your reply:");
  
  if(reply == null || reply.trim() == "") return;
  
  try {
    const postRef = doc(db, "communityPosts", postId);
    const postSnap = await getDoc(postRef);
    const post = postSnap.data();
    
    await updateDoc(postRef, {
      comments: [...(post.comments || []), "↪ " + reply]
    });
    alert("✅ Reply added successfully!");
  } catch (error) {
    console.error("Error adding reply:", error);
    alert("Error adding reply");
  }
};

// Load posts on page load
loadPosts();

</script>

</body>
</html>
