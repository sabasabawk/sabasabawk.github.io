<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Community Wall | SABASABA Gospel Ministry
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#eef3f8;
color:#222;
min-height:100vh;
}

button{
font-family:inherit;
cursor:pointer;
}

.pageContainer{
width:100%;
max-width:920px;
margin:0 auto;
padding:20px;
}

.wallHeader{
background:linear-gradient(135deg,#0874d1,#004d99);
color:white;
padding:38px 25px;
border-radius:24px;
text-align:center;
margin-bottom:24px;
box-shadow:0 7px 18px rgba(0,0,0,.15);
}

.wallHeader h1{
font-size:38px;
margin-bottom:14px;
}

.wallHeader p{
max-width:730px;
margin:auto;
font-size:18px;
line-height:1.65;
}

.wallControls{
display:flex;
align-items:center;
gap:14px;
margin-bottom:25px;
}

.controlButton{
border:none;
color:white;
padding:17px 16px;
border-radius:14px;
font-size:18px;
font-weight:bold;
box-shadow:0 4px 10px rgba(0,0,0,.12);
transition:.2s;
}

.controlButton:active{
transform:scale(.98);
}
.likeButton.liked{
  background:#ffe9ee;
  color:#d6003d;
  font-weight:bold;
}

.likeButton:disabled{
  opacity:0.6;
  cursor:not-allowed;
}
.createPostButton{
flex:1;
background:#0874d1;
}

.createPostButton:hover{
background:#005eb8;
}

.refreshButton{
min-width:155px;
background:#28a745;
}

.refreshButton:hover{
background:#218838;
}
.postsContainer{
width:100%;
}

.loadingMessage,
.emptyMessage,
.errorMessage{
background:white;
padding:45px 25px;
text-align:center;
border-radius:22px;
font-size:18px;
line-height:1.6;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.loadingMessage,
.emptyMessage{
color:#777;
}

.errorMessage{
color:#b00020;
}

.postCard{
background:white;
border-radius:22px;
padding:22px;
margin-bottom:24px;
box-shadow:0 5px 15px rgba(0,0,0,.10);
overflow:hidden;
}

.postHeader{
display:flex;
align-items:center;
gap:14px;
margin-bottom:17px;
}

.authorPicture{
width:62px;
height:62px;
border-radius:50%;
object-fit:cover;
background:#ddd;
border:3px solid #e5edf5;
flex-shrink:0;
cursor:pointer;
}

.authorInformation{
flex:1;
min-width:0;
}

.authorName{
font-size:21px;
font-weight:bold;
color:#0066cc;
cursor:pointer;
word-break:break-word;
}

.authorName:hover{
text-decoration:underline;
}

.postDetails{
font-size:14px;
color:#777;
margin-top:5px;
line-height:1.45;
}

.postCategory{
display:inline-block;
padding:7px 13px;
margin-bottom:13px;
background:#eaf3ff;
color:#0066cc;
border-radius:20px;
font-size:14px;
font-weight:bold;
}

.postMessage{
font-size:17px;
line-height:1.75;
white-space:pre-wrap;
word-break:break-word;
margin-bottom:15px;
}

.communityPostImage{
display:block;
width:100%;
max-height:620px;
object-fit:cover;
border-radius:16px;
margin-top:15px;
background:#eee;
}

.postActions{
display:flex;
gap:10px;
margin-top:20px;
padding-top:16px;
border-top:1px solid #e5e5e5;
}

.postActions button{
flex:1;
border:none;
padding:13px 8px;
border-radius:12px;
font-size:16px;
font-weight:bold;
color:white;
}

.likeButton{
background:#1877f2;
}

.commentButton{
background:#28a745;
}

.shareButton{
background:#ff9800;
}
.backSection{
text-align:center;
margin:32px 0;
}

.backButton{
padding:15px 30px;
border:none;
border-radius:13px;
background:#666;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.backButton:hover{
background:#555;
}

@media(max-width:700px){

.pageContainer{
padding:16px;
}

.wallHeader{
padding:31px 18px;
}

.wallHeader h1{
font-size:31px;
}

.wallHeader p{
font-size:17px;
}

.wallControls{
gap:10px;
}

.controlButton{
font-size:16px;
padding:15px 10px;
}

.refreshButton{
min-width:0;
flex:.65;
}

.postCard{
padding:19px;
}

.authorPicture{
width:58px;
height:58px;
}

.postActions{
flex-direction:column;
}

.postActions button{
width:100%;
}

}

</style>

</head>

<body>

<main class="pageContainer">

<section class="wallHeader">

<h1>📰 Community Wall</h1>

<p>
Share God's Word, testimonies, encouragement and prayer with believers around the world.
</p>

</section>

<section class="wallControls">

<button
type="button"
id="createPostButton"
class="controlButton createPostButton">
✍️ Create New Post
</button>

<button
type="button"
id="refreshButton"
class="controlButton refreshButton">
🔄 Refresh
</button>

</section>

<section
id="postsContainer"
class="postsContainer">

<div class="loadingMessage">
Loading community posts...
</div>

</section>

<section class="backSection">

<button
type="button"
id="backButton"
class="backButton">
⬅ Back to Community
</button>

</section>

</main>

<script type="module">

import{
  auth,
  db,
  collection,
  onSnapshot,
  onAuthStateChanged,
  doc,
  getDoc,
  setDoc,
  deleteDoc
}from "./firebase.js";



/* ========================================
   PAGE ELEMENTS
======================================== */

const postsContainer =
document.getElementById("postsContainer");

const createPostButton =
document.getElementById("createPostButton");

const refreshButton =
document.getElementById("refreshButton");

const backButton =
document.getElementById("backButton");


/* ========================================
   COMMUNITY WALL VARIABLES
======================================== */

let currentUser = null;

let unsubscribePosts = null;
let postListeners = [];

/* ========================================
   PAGE BUTTONS
======================================== */

if(createPostButton){

  createPostButton.addEventListener("click",()=>{

    location.href = "createpost.html";

  });

}


if(refreshButton){

  refreshButton.addEventListener("click",()=>{

    location.reload();

  });

}


if(backButton){

  backButton.addEventListener("click",()=>{

    location.href = "community.html";

  });

}


/* ========================================
   CHECK USER LOGIN
======================================== */

onAuthStateChanged(auth,(user)=>{

  if(!user){

    location.href = "login.html";

    return;

  }

  currentUser = user;

  startCommunityWall();

});
/* ========================================
   LOAD COMMUNITY POSTS
======================================== */

function startCommunityWall(){

  if(!postsContainer){

    console.error(
      "The postsContainer element was not found."
    );

    return;

  }


  /* Stop the previous Firebase listener */

  if(unsubscribePosts){

    unsubscribePosts();

    unsubscribePosts = null;

  }


  /* Show loading message */

  postsContainer.innerHTML = `

    <div class="loadingMessage">

      Loading community posts...

    </div>

  `;


  /* Listen for posts from Firebase */

  unsubscribePosts = onSnapshot(

    collection(db,"communityPosts"),

    (snapshot)=>{

      const posts = [];


      snapshot.forEach((postDocument)=>{

        posts.push({

          id:postDocument.id,

          ...postDocument.data()

        });

      });


      /* Show newest posts first */

      posts.sort((firstPost,secondPost)=>{

        return (
          getPostTime(secondPost) -
          getPostTime(firstPost)
        );

      });


      renderPosts(posts);

    },


    (error)=>{

      console.error(
        "Community posts error:",
        error
      );


      postsContainer.innerHTML = `

        <div class="errorMessage">

          Unable to load community posts.

          <br><br>

          ${escapeHTML(error.message)}

        </div>

      `;

    }

  );

}
/* ========================================
   DISPLAY COMMUNITY POSTS
======================================== */

function renderPosts(posts){

  postListeners.forEach(
    unsubscribeListener =>{

      unsubscribeListener();

    }
  );

  postListeners = [];

  postsContainer.innerHTML = "";


  /* Show message when there are no posts */

  if(posts.length === 0){

    postsContainer.innerHTML = `

      <div class="emptyMessage">

        No community posts yet.

        <br><br>

        Be the first believer to encourage others.

      </div>

    `;

    return;

  }


  posts.forEach((post)=>{


    /* ========================================
       READ POST INFORMATION
    ======================================== */

    const name = getFirstValue(

      post.name,
      post.fullName,
      post.displayName,
      post.authorName,
      "Anonymous"

    );


    const picture = getFirstValue(

      post.picture,
      post.profilePicture,
      post.photoURL,
      post.profileImage,
      post.profilePhoto,
      post.userPicture,
      post.authorPicture,
      "images/profile.png"

    );


    const message = getFirstValue(

      post.post,
      post.text,
      post.message,
      post.content,
      ""

    );


    const postImage = getFirstValue(

      post.image,
      post.postImage,
      post.imageURL,
      post.imageUrl,
      post.photo,
      ""

    );


    const country = getFirstValue(

      post.country,
      post.location,
      ""

    );


    const category = getFirstValue(

      post.category,
      post.postCategory,
      ""

    );


    const userId = getFirstValue(

      post.userId,
      post.uid,
      post.authorId,
      post.ownerId,
      ""

    );


    const likes =

      typeof post.likes === "number"

      ? post.likes

      : 0;



    const date = getDisplayDate(post);


    /* ========================================
       CREATE POST CARD
    ======================================== */

    const card = document.createElement("article");

    card.className = "postCard";

    card.dataset.postId = post.id;

    card.dataset.userId = userId;


    card.innerHTML = `

      <div class="postHeader">

        <img
          class="authorPicture"
          src="${escapeAttribute(picture)}"
          alt="Profile Picture"
          loading="lazy"
        >

        <div class="authorInformation">

          <div class="authorName">

            ${escapeHTML(name)}

          </div>

          <div class="postDetails">

            ${
              country
              ? escapeHTML(country) + " • "
              : ""
            }

            ${escapeHTML(date)}

          </div>

        </div>

      </div>


      ${
        category
        ? `

          <div class="postCategory">

            ${escapeHTML(category)}

          </div>

        `
        : ""
      }


      ${
        message
        ? `

          <div class="postMessage">

            ${formatPostMessage(message)}

          </div>

        `
        : ""
      }


      ${
        postImage
        ? `

          <img
            class="communityPostImage"
            src="${escapeAttribute(postImage)}"
            alt="Community Post"
            loading="lazy"
          >

        `
        : ""
      }


      <div class="postActions">

        <button
  type="button"
  class="likeButton"
>
  🤍 Like
</button>


        <button
          type="button"
          class="commentButton"
        >

          💬 Comment (${comments})

        </button>


        <button
          type="button"
          class="shareButton"
        >

          📤 Share

        </button>

      </div>

    `;


    postsContainer.appendChild(card);


    /* Part 4 will connect all buttons and pictures */

    connectPostCard(card,post);

  });

}
/* ========================================
   CONNECT EACH POST CARD
======================================== */

function connectPostCard(card,post){

  const authorPicture =
  card.querySelector(".authorPicture");

  const authorName =
  card.querySelector(".authorName");

  const communityPostImage =
  card.querySelector(".communityPostImage");

  const likeButton =
  card.querySelector(".likeButton");

  const commentButton =
  card.querySelector(".commentButton");

  const shareButton =
  card.querySelector(".shareButton");


  const userId = getFirstValue(

    post.userId,
    post.uid,
    post.authorId,
    post.ownerId,
    ""

  );


  /* ========================================
     PROFILE-PICTURE ERROR
  ======================================== */

  if(authorPicture){

    authorPicture.addEventListener("error",()=>{

      if(
        !authorPicture.src.endsWith(
          "images/profile.png"
        )
      ){

        authorPicture.src =
        "images/profile.png";

      }

    });


    authorPicture.addEventListener(
      "click",
      openMemberProfile
    );

  }


  if(authorName){

    authorName.addEventListener(
      "click",
      openMemberProfile
    );

  }


  function openMemberProfile(){

    if(!userId){

      alert(
        "This member's profile is not available."
      );

      return;

    }

    location.href =
    "profileview.html?uid=" +
    encodeURIComponent(userId);

  }


  /* ========================================
     POST-IMAGE ERROR
  ======================================== */

  if(communityPostImage){

    communityPostImage.addEventListener(
      "error",
      ()=>{

        communityPostImage.style.display =
        "none";

      }
    );

  }


  /* ========================================
     LIKE BUTTON
  ======================================== */

  if(likeButton){

  const likesCollection =
  collection(
    db,
    "communityPosts",
    post.id,
    "likes"
  );

  const currentUserLike =
  doc(
    db,
    "communityPosts",
    post.id,
    "likes",
    currentUser.uid
  );


  /* Listen to the number of likes */

  const unsubscribeLikes =
  onSnapshot(
    likesCollection,
    (snapshot)=>{

      const totalLikes =
      snapshot.size;

      const userHasLiked =
      snapshot.docs.some(
        likeDocument =>
        likeDocument.id === currentUser.uid
      );


      likeButton.innerText =

      userHasLiked
      ? "❤️ Liked (" + totalLikes + ")"
      : "🤍 Like (" + totalLikes + ")";


      likeButton.classList.toggle(
        "liked",
        userHasLiked
      );

    },
    (error)=>{

      console.error(
        "Likes loading error:",
        error
      );

    }
  );


  likeButton.addEventListener(
    "click",
    async()=>{

      if(!currentUser){

        alert(
          "Please log in before liking a post."
        );

        return;

      }


      likeButton.disabled = true;


      try{

        const likeSnapshot =
        await getDoc(currentUserLike);


        if(likeSnapshot.exists()){

          await deleteDoc(
            currentUserLike
          );

        }else{

          await setDoc(
            currentUserLike,
            {
              userId:currentUser.uid,
              likedAt:new Date().toISOString()
            }
          );

        }

      }catch(error){

        console.error(
          "Like error:",
          error
        );

        alert(
          "The Like could not be saved."
        );

      }finally{

        likeButton.disabled = false;

      }

    }
  );


  postListeners.push(
  unsubscribeLikes
);


  /* ========================================
     COMMENT BUTTON
  ======================================== */

  if(commentButton){

    commentButton.addEventListener("click",()=>{

      location.href =
      "comments.html?postId=" +
      encodeURIComponent(post.id);

    });

  }


  /* ========================================
     SHARE BUTTON
  ======================================== */

  if(shareButton){

    shareButton.addEventListener(
      "click",
      async()=>{

        const postAuthor = getFirstValue(

          post.name,
          post.fullName,
          post.displayName,
          post.authorName,
          "Community Member"

        );


        const postMessage = getFirstValue(

          post.post,
          post.text,
          post.message,
          post.content,
          ""

        );


        const shareText =

        postAuthor +
        "\n\n" +
        postMessage;


        const shareURL =

        location.origin +
        location.pathname +
        "?postId=" +
        encodeURIComponent(post.id);


        try{

          if(navigator.share){

            await navigator.share({

              title:
              "SABASABA Gospel Ministry",

              text:shareText,

              url:shareURL

            });

            return;

          }


          if(navigator.clipboard){

            await navigator.clipboard.writeText(

              shareText +
              "\n\n" +
              shareURL

            );

            alert(
              "✅ Post copied. You can now share it."
            );

            return;

          }


          alert(
            "Sharing is not supported on this device."
          );

        }catch(error){

          if(error.name !== "AbortError"){

            console.error(
              "Share error:",
              error
            );

            alert(
              "The post could not be shared."
            );

          }

        }

      }
    );

  }

}


/* ========================================
   GET FIRST AVAILABLE VALUE
======================================== */

function getFirstValue(...values){

  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value).trim();

    }

  }

  return "";

}


/* ========================================
   PROTECT HTML TEXT
======================================== */

function escapeHTML(value){

  return String(value)

  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* ========================================
   PROTECT IMAGE ATTRIBUTES
======================================== */

function escapeAttribute(value){

  return escapeHTML(value);

}


/* ========================================
   FORMAT POST MESSAGE
======================================== */

function formatPostMessage(message){

  return escapeHTML(message)

  .replace(/\n/g,"<br>");

}


/* ========================================
   GET POST TIME FOR SORTING
======================================== */

function getPostTime(post){

  const timestamp =

  post.timestamp ||
  post.createdAt ||
  post.dateCreated ||
  post.postedAt;


  if(timestamp?.toMillis){

    return timestamp.toMillis();

  }


  if(timestamp?.toDate){

    return timestamp
    .toDate()
    .getTime();

  }


  if(typeof timestamp === "number"){

    return timestamp;

  }


  if(typeof timestamp === "string"){

    const parsedTimestamp =
    Date.parse(timestamp);

    if(!Number.isNaN(parsedTimestamp)){

      return parsedTimestamp;

    }

  }


  if(post.date){

    const parsedDate =
    Date.parse(post.date);

    if(!Number.isNaN(parsedDate)){

      return parsedDate;

    }

  }


  return 0;

}


/* ========================================
   DISPLAY POST DATE
======================================== */

function getDisplayDate(post){

  const timestamp =

  post.timestamp ||
  post.createdAt ||
  post.dateCreated ||
  post.postedAt;


  if(timestamp?.toDate){

    return timestamp
    .toDate()
    .toLocaleString();

  }


  if(typeof timestamp === "number"){

    return new Date(timestamp)
    .toLocaleString();

  }


  if(typeof timestamp === "string"){

    const parsedTimestamp =
    Date.parse(timestamp);

    if(!Number.isNaN(parsedTimestamp)){

      return new Date(parsedTimestamp)
      .toLocaleString();

    }

  }


  if(post.date){

    return String(post.date);

  }


  return "Recently";

}


/* ========================================
   STOP FIREBASE LISTENER WHEN LEAVING
======================================== */

window.addEventListener("beforeunload",()=>{

  if(unsubscribePosts){

    unsubscribePosts();

  }

});

</script>

</body>

</html>
