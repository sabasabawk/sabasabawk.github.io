<script type="module">
/* =====================================================
   PART 4 OF 6
   FIREBASE SETUP, USER PROFILE AND BASIC FUNCTIONS
===================================================== */


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  auth,
  db,
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  getDoc,
  updateDoc,
  deleteDoc,
  onAuthStateChanged
} from "./firebase.js";


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const postsContainer =
document.getElementById("postsContainer");

const refreshButton =
document.getElementById("refreshButton");

const quickPostButton =
document.getElementById("quickPostButton");

const quickPostAvatar =
document.getElementById("quickPostAvatar");

const photoViewer =
document.getElementById("photoViewer");

const photoViewerImage =
document.getElementById("photoViewerImage");

const closePhotoViewer =
document.getElementById("closePhotoViewer");


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let currentProfile = {};

let unsubscribePosts = null;

const defaultProfilePicture =
"images/profile.png";


/* =====================================================
   GET FIRST AVAILABLE VALUE
===================================================== */

function getFirstValue(...values){

  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value).trim();

    }

  }

  return "";

}


/* =====================================================
   DISPLAY LOADING MESSAGE
===================================================== */

function showLoadingMessage(){

  postsContainer.innerHTML = `

    <div class="statusCard">

      Loading community posts...

    </div>

  `;

}


/* =====================================================
   DISPLAY EMPTY MESSAGE
===================================================== */

function showEmptyMessage(){

  postsContainer.innerHTML = `

    <div class="statusCard empty">

      No community posts are available yet.

      <br><br>

      Be the first person to share a testimony,
      prayer, encouragement, photo or video.

    </div>

  `;

}


/* =====================================================
   DISPLAY ERROR MESSAGE
===================================================== */

function showErrorMessage(message){

  postsContainer.innerHTML = "";

  const errorCard =
  document.createElement("div");

  errorCard.className =
  "statusCard error";

  errorCard.textContent =
  message;

  postsContainer.appendChild(
    errorCard
  );

}


/* =====================================================
   PROFILE PICTURE ERROR HANDLING
===================================================== */

function protectProfilePicture(imageElement){

  if(!imageElement){

    return;

  }

  imageElement.addEventListener(
    "error",
    function(){

      imageElement.src =
      defaultProfilePicture;

    }
  );

}


/* =====================================================
   LOAD CURRENT USER PROFILE
===================================================== */

async function loadCurrentUserProfile(){

  currentProfile = {};

  if(!currentUser){

    quickPostAvatar.src =
    defaultProfilePicture;

    return;

  }

  try{

    const profileReference =
    doc(
      db,
      "users",
      currentUser.uid
    );

    const profileSnapshot =
    await getDoc(
      profileReference
    );

    if(profileSnapshot.exists()){

      currentProfile =
      profileSnapshot.data();

    }

    const profilePicture =
    getFirstValue(
      currentProfile.picture,
      currentProfile.profilePicture,
      currentProfile.photoURL,
      currentUser.photoURL,
      defaultProfilePicture
    );

    quickPostAvatar.src =
    profilePicture;

  }catch(error){

    console.error(
      "Error loading profile:",
      error
    );

    quickPostAvatar.src =
    defaultProfilePicture;

  }

}


/* =====================================================
   FORMAT POST DATE
===================================================== */

function formatPostDate(timestamp){

  if(!timestamp){

    return "Recently";

  }

  try{

    let postDate;

    if(
      typeof timestamp.toDate ===
      "function"
    ){

      postDate =
      timestamp.toDate();

    }else if(timestamp.seconds){

      postDate =
      new Date(
        timestamp.seconds * 1000
      );

    }else{

      postDate =
      new Date(timestamp);

    }

    if(
      Number.isNaN(
        postDate.getTime()
      )
    ){

      return "Recently";

    }

    return postDate.toLocaleString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }catch(error){

    console.error(
      "Date formatting error:",
      error
    );

    return "Recently";

  }

}


/* =====================================================
   QUICK POST BUTTON
===================================================== */

quickPostButton.addEventListener(
  "click",
  function(){

    if(!currentUser){

      window.location.href =
      "login.html";

      return;

    }

    window.location.href =
    "createpost.html";

  }
);


/* =====================================================
   PROTECT QUICK PROFILE PICTURE
===================================================== */

protectProfilePicture(
  quickPostAvatar
);


/* =====================================================
   AUTHENTICATION LISTENER
===================================================== */

onAuthStateChanged(
  auth,
  async function(user){

    currentUser =
    user || null;

    await loadCurrentUserProfile();

    startCommunityFeed();

  }
);
/* =====================================================
   PART 5 OF 6
   LOAD POSTS AND CREATE POST CARDS
===================================================== */


/* =====================================================
   STOP CURRENT POSTS LISTENER
===================================================== */

function stopPostsListener(){

  if(unsubscribePosts){

    unsubscribePosts();

    unsubscribePosts =
    null;

  }

}


/* =====================================================
   START COMMUNITY FEED
===================================================== */

function startCommunityFeed(){

  stopPostsListener();

  showLoadingMessage();

  loadCommunityPosts();

}


/* =====================================================
   LOAD COMMUNITY POSTS
===================================================== */

function loadCommunityPosts(){

  const postsReference =
  collection(
    db,
    "communityPosts"
  );

  const postsQuery =
  query(
    postsReference,
    orderBy(
      "timestamp",
      "desc"
    )
  );

  unsubscribePosts =
  onSnapshot(

    postsQuery,

    function(snapshot){

      postsContainer.innerHTML =
      "";

      if(snapshot.empty){

        showEmptyMessage();

        return;

      }

      snapshot.forEach(
        function(postDocument){

          const postData = {

            id:
            postDocument.id,

            ...postDocument.data()

          };

          const postCard =
          createPostCard(postData);

          postsContainer.appendChild(
            postCard
          );

        }
      );

      scrollToSharedPost();

    },

    function(error){

      console.error(
        "Error loading posts:",
        error
      );

      if(
        error.code ===
        "permission-denied"
      ){

        showErrorMessage(
          "Firebase permission has denied access to community posts."
        );

        return;

      }

      if(
        error.code ===
        "failed-precondition"
      ){

        showErrorMessage(
          "Firebase requires an index before the posts can be displayed."
        );

        return;

      }

      showErrorMessage(
        "Community posts could not be loaded. Please try again."
      );

    }

  );

}


/* =====================================================
   CREATE A COMMUNITY POST CARD
===================================================== */

function createPostCard(postData){

  const postCard =
  document.createElement("article");

  postCard.className =
  "postCard";

  postCard.id =
  `post-${postData.id}`;

  postCard.dataset.postId =
  postData.id;


  /* =================================================
     POST OWNER DETAILS
  ================================================= */

  const authorId =
  getFirstValue(
    postData.userId,
    postData.authorId,
    postData.uid
  );

  const authorName =
  getFirstValue(
    postData.name,
    postData.fullName,
    postData.displayName,
    "Community Member"
  );

  const authorPicture =
  getFirstValue(
    postData.picture,
    postData.profilePicture,
    postData.photoURL,
    defaultProfilePicture
  );

  const authorCountry =
  getFirstValue(
    postData.country
  );

  const postDate =
  formatPostDate(
    postData.timestamp
  );


  /* =================================================
     POST CONTENT
  ================================================= */

  const postMessage =
  getFirstValue(
    postData.post,
    postData.message,
    postData.content,
    postData.text,
    postData.description
  );

  const postCategory =
  getFirstValue(
    postData.category,
    "General"
  );


  /* =================================================
     MEDIA INFORMATION
  ================================================= */

  const mediaType =
  getFirstValue(
    postData.mediaType
  ).toLowerCase();

  let imageUrl = "";

  let videoUrl = "";


  if(mediaType === "image"){

    imageUrl =
    getFirstValue(
      postData.imageUrl,
      postData.mediaUrl
    );

  }else if(mediaType === "video"){

    videoUrl =
    getFirstValue(
      postData.videoUrl,
      postData.mediaUrl
    );

  }else{

    imageUrl =
    getFirstValue(
      postData.imageUrl
    );

    videoUrl =
    getFirstValue(
      postData.videoUrl
    );

  }


  /* =================================================
     NUMBER OF LIKES
  ================================================= */

  const likes =
  Array.isArray(postData.likes)
  ? postData.likes
  : [];

  const userHasLiked =
  Boolean(
    currentUser &&
    likes.includes(currentUser.uid)
  );


  /* =================================================
     POST HEADER
  ================================================= */

  const postHeader =
  document.createElement("div");

  postHeader.className =
  "postHeader";


  const profileImage =
  document.createElement("img");

  profileImage.className =
  "authorPicture";

  profileImage.src =
  authorPicture;

  profileImage.alt =
  `${authorName}'s profile picture`;

  protectProfilePicture(
    profileImage
  );


  const authorInformation =
  document.createElement("div");

  authorInformation.className =
  "authorInformation";


  const authorNameElement =
  document.createElement("div");

  authorNameElement.className =
  "authorName";

  authorNameElement.textContent =
  authorName;


  const postDetails =
  document.createElement("div");

  postDetails.className =
  "postDetails";

  postDetails.textContent =
  authorCountry
  ? `${authorCountry} • ${postDate}`
  : postDate;


  authorInformation.appendChild(
    authorNameElement
  );

  authorInformation.appendChild(
    postDetails
  );

  postHeader.appendChild(
    profileImage
  );

  postHeader.appendChild(
    authorInformation
  );

  postCard.appendChild(
    postHeader
  );


  /* =================================================
     CATEGORY
  ================================================= */

  if(postCategory){

    const categoryElement =
    document.createElement("div");

    categoryElement.className =
    "postCategory";

    categoryElement.textContent =
    postCategory;

    postCard.appendChild(
      categoryElement
    );

  }


  /* =================================================
     WRITTEN MESSAGE
  ================================================= */

  if(postMessage){

    const messageElement =
    document.createElement("div");

    messageElement.className =
    "postMessage";

    messageElement.textContent =
    postMessage;

    postCard.appendChild(
      messageElement
    );

  }


  /* =================================================
     POST PHOTO OR VIDEO
  ================================================= */

  const mediaContainer =
  document.createElement("div");

  mediaContainer.className =
  "postMediaContainer";


  if(imageUrl){

    const postImage =
    document.createElement("img");

    postImage.className =
    "communityPostImage";

    postImage.src =
    imageUrl;

    postImage.alt =
    "Community post photo";

    postImage.loading =
    "lazy";

    postImage.dataset.fullImage =
    imageUrl;

    postImage.addEventListener(
      "error",
      function(){

        mediaContainer.remove();

      },
      {
        once:true
      }
    );

    mediaContainer.appendChild(
      postImage
    );

  }else if(videoUrl){

    const postVideo =
    document.createElement("video");

    postVideo.className =
    "communityPostVideo";

    postVideo.src =
    videoUrl;

    postVideo.controls =
    true;

    postVideo.preload =
    "metadata";

    postVideo.playsInline =
    true;

    postVideo.addEventListener(
      "error",
      function(){

        mediaContainer.remove();

      },
      {
        once:true
      }
    );

    mediaContainer.appendChild(
      postVideo
    );

  }


  if(mediaContainer.children.length > 0){

    postCard.appendChild(
      mediaContainer
    );

  }


  /* =================================================
     POST ACTION BUTTONS
  ================================================= */

  const actionsContainer =
  document.createElement("div");

  actionsContainer.className =
  "postActions";


  const likeButton =
  document.createElement("button");

  likeButton.type =
  "button";

  likeButton.className =
  userHasLiked
  ? "likeButton liked"
  : "likeButton";

  likeButton.dataset.postId =
  postData.id;

  likeButton.dataset.likes =
  JSON.stringify(likes);

  likeButton.innerHTML =
  `❤️ <span>${likes.length}</span>`;


  const commentButton =
  document.createElement("button");

  commentButton.type =
  "button";

  commentButton.className =
  "commentButton";

  commentButton.dataset.postId =
  postData.id;

  commentButton.innerHTML =
  "💬 Comment";


  const shareButton =
  document.createElement("button");

  shareButton.type =
  "button";

  shareButton.className =
  "shareButton";

  shareButton.dataset.postId =
  postData.id;

  shareButton.dataset.message =
  postMessage;

  shareButton.innerHTML =
  "🔗 Share";


  actionsContainer.appendChild(
    likeButton
  );

  actionsContainer.appendChild(
    commentButton
  );

  actionsContainer.appendChild(
    shareButton
  );

  postCard.appendChild(
    actionsContainer
  );


  /* =================================================
     EDIT AND DELETE BUTTONS FOR POST OWNER
  ================================================= */

  if(
    currentUser &&
    authorId === currentUser.uid
  ){

    const ownerActions =
    document.createElement("div");

    ownerActions.className =
    "postActions ownerActions";


    const editButton =
    document.createElement("button");

    editButton.type =
    "button";

    editButton.className =
    "editButton";

    editButton.dataset.postId =
    postData.id;

    editButton.dataset.message =
    postMessage;

    editButton.innerHTML =
    "✏️ Edit";


    const deleteButton =
    document.createElement("button");

    deleteButton.type =
    "button";

    deleteButton.className =
    "deleteButton";

    deleteButton.dataset.postId =
    postData.id;

    deleteButton.innerHTML =
    "🗑️ Delete";


    ownerActions.appendChild(
      editButton
    );

    ownerActions.appendChild(
      deleteButton
    );

    postCard.appendChild(
      ownerActions
    );

  }


  /* =================================================
     OPEN MEMBER PROFILE
  ================================================= */

  if(authorId){

    profileImage.addEventListener(
      "click",
      function(){

        window.location.href =
        `profile.html?uid=${encodeURIComponent(authorId)}`;

      }
    );

    authorNameElement.addEventListener(
      "click",
      function(){

        window.location.href =
        `profile.html?uid=${encodeURIComponent(authorId)}`;

      }
    );

  }


  return postCard;

}
/* =====================================================
   PART 6A OF 6
   POST ACTIONS, PHOTO VIEWER AND REFRESH
===================================================== */


/* =====================================================
   LIKE A POST
===================================================== */

async function handleLikeButton(button){

  if(!currentUser){

    window.location.href =
    "login.html";

    return;

  }

  const postId =
  button.dataset.postId;

  let likes = [];

  try{

    likes =
    JSON.parse(
      button.dataset.likes || "[]"
    );

  }catch(error){

    likes = [];

  }

  const userId =
  currentUser.uid;

  const userAlreadyLiked =
  likes.includes(userId);

  const updatedLikes =
  userAlreadyLiked
  ? likes.filter(
      function(id){

        return id !== userId;

      }
    )
  : [
      ...likes,
      userId
    ];

  button.disabled =
  true;

  try{

    const postReference =
    doc(
      db,
      "communityPosts",
      postId
    );

    await updateDoc(
      postReference,
      {
        likes:
        updatedLikes
      }
    );

  }catch(error){

    console.error(
      "Error updating likes:",
      error
    );

    alert(
      "The like could not be updated."
    );

  }finally{

    button.disabled =
    false;

  }

}


/* =====================================================
   OPEN COMMENTS PAGE
===================================================== */

function handleCommentButton(button){

  const postId =
  button.dataset.postId;

  window.location.href =
  `comments.html?postId=${encodeURIComponent(postId)}`;

}


/* =====================================================
   SHARE A POST
===================================================== */

async function handleShareButton(button){

  const postId =
  button.dataset.postId;

  const postMessage =
  button.dataset.message || "";

  const postUrl =
  `${window.location.origin}${window.location.pathname}?post=${encodeURIComponent(postId)}`;

  const shareText =
  postMessage
  ? `${postMessage}\n\nSABASABA Gospel Ministry`
  : "See this post on SABASABA Gospel Ministry.";

  try{

    if(navigator.share){

      await navigator.share(
        {
          title:
          "SABASABA Gospel Ministry",

          text:
          shareText,

          url:
          postUrl
        }
      );

      return;

    }

    await navigator.clipboard.writeText(
      postUrl
    );

    alert(
      "Post link copied."
    );

  }catch(error){

    if(
      error.name !==
      "AbortError"
    ){

      console.error(
        "Error sharing post:",
        error
      );

      alert(
        "The post could not be shared."
      );

    }

  }

}


/* =====================================================
   EDIT A POST
===================================================== */

async function handleEditButton(button){

  if(!currentUser){

    window.location.href =
    "login.html";

    return;

  }

  const postId =
  button.dataset.postId;

  const oldMessage =
  button.dataset.message || "";

  const newMessage =
  window.prompt(
    "Edit your post:",
    oldMessage
  );

  if(newMessage === null){

    return;

  }

  const cleanedMessage =
  newMessage.trim();

  if(!cleanedMessage){

    alert(
      "The post cannot be empty."
    );

    return;

  }

  button.disabled =
  true;

  try{

    const postReference =
    doc(
      db,
      "communityPosts",
      postId
    );

    await updateDoc(
      postReference,
      {
        post:
        cleanedMessage
      }
    );

  }catch(error){

    console.error(
      "Error editing post:",
      error
    );

    alert(
      "The post could not be edited."
    );

  }finally{

    button.disabled =
    false;

  }

}


/* =====================================================
   DELETE A POST
===================================================== */

async function handleDeleteButton(button){

  if(!currentUser){

    window.location.href =
    "login.html";

    return;

  }

  const postId =
  button.dataset.postId;

  const confirmed =
  window.confirm(
    "Are you sure you want to delete this post?"
  );

  if(!confirmed){

    return;

  }

  button.disabled =
  true;

  try{

    const postReference =
    doc(
      db,
      "communityPosts",
      postId
    );

    await deleteDoc(
      postReference
    );

  }catch(error){

    console.error(
      "Error deleting post:",
      error
    );

    alert(
      "The post could not be deleted."
    );

    button.disabled =
    false;

  }

}


/* =====================================================
   POST ACTION EVENT LISTENER
===================================================== */

postsContainer.addEventListener(
  "click",
  function(event){

    const likeButton =
    event.target.closest(
      ".likeButton"
    );

    if(likeButton){

      handleLikeButton(
        likeButton
      );

      return;

    }

    const commentButton =
    event.target.closest(
      ".commentButton"
    );

    if(commentButton){

      handleCommentButton(
        commentButton
      );

      return;

    }

    const shareButton =
    event.target.closest(
      ".shareButton"
    );

    if(shareButton){

      handleShareButton(
        shareButton
      );

      return;

    }

    const editButton =
    event.target.closest(
      ".editButton"
    );

    if(editButton){

      handleEditButton(
        editButton
      );

      return;

    }

    const deleteButton =
    event.target.closest(
      ".deleteButton"
    );

    if(deleteButton){

      handleDeleteButton(
        deleteButton
      );

      return;

    }

    const postImage =
    event.target.closest(
      ".communityPostImage"
    );

    if(postImage){

      openPhotoViewer(
        postImage.dataset.fullImage ||
        postImage.src
      );

    }

  }
);


/* =====================================================
   OPEN PHOTO VIEWER
===================================================== */

function openPhotoViewer(imageUrl){

  if(!imageUrl){

    return;

  }

  photoViewerImage.src =
  imageUrl;

  photoViewer.classList.add(
    "open"
  );

  photoViewer.setAttribute(
    "aria-hidden",
    "false"
  );

  document.body.style.overflow =
  "hidden";

}


/* =====================================================
   CLOSE PHOTO VIEWER
===================================================== */

function closePhotoViewer(){

  photoViewer.classList.remove(
    "open"
  );

  photoViewer.setAttribute(
    "aria-hidden",
    "true"
  );

  photoViewerImage.src =
  "";

  document.body.style.overflow =
  "";

}


/* =====================================================
   PHOTO VIEWER EVENTS
===================================================== */

closePhotoViewerButton.addEventListener(
  "click",
  closePhotoViewer
);


photoViewer.addEventListener(
  "click",
  function(event){

    if(event.target === photoViewer){

      closePhotoViewer();

    }

  }
);


document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape" &&
      photoViewer.classList.contains("open")
    ){

      closePhotoViewer();

    }

  }
);

   REFRESH COMMUNITY WALL
===================================================== */

refreshButton.addEventListener(

    refreshButton.disabled =
    true;

    refreshButton.textContent =
    "⏳";

    startCommunityFeed();

    window.setTimeout(
      function(){

        refreshButton.disabled =

        refreshButton.textContent =
        "🔄";

      },
      1000
    );

  }
);


/* =====================================================
   SCROLL TO SHARED POST
===================================================== */

function scrollToSharedPost(){

  const urlParameters =
  new URLSearchParams(
    window.location.search
  );

  const sharedPostId =
  urlParameters.get("post");

  if(!sharedPostId){

    return;

  }

  const sharedPost =
  document.getElementById(
    `post-${sharedPostId}`
  );

  if(!sharedPost){

    return;

  }

  sharedPost.scrollIntoView(
    {
      behavior:
      "smooth",

      block:
      "center"
    }
  );

}
