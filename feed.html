<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Community Wall</title>


<style>

/* =====================================================
   GENERAL PAGE
===================================================== */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  background:#eef3f8;
  color:#222;
}

button{
  font-family:inherit;
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.pageContainer{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:22px 18px 50px;
}


/* =====================================================
   COMMUNITY WALL HEADER
===================================================== */

.wallHeader{
  background:linear-gradient(
    135deg,
    #087bd1,
    #0055a5
  );
  color:white;
  padding:38px 24px;
  border-radius:30px;
  text-align:center;
  box-shadow:0 10px 24px rgba(0,0,0,.16);
}

.wallHeader h1{
  margin:0;
  font-size:42px;
  line-height:1.2;
}

.wallHeader p{
  margin:22px auto 0;
  max-width:560px;
  font-size:24px;
  line-height:1.55;
}


/* =====================================================
   REFRESH CONTROL
===================================================== */

.feedControls{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:28px 0;
}

#refreshButton{
  min-width:230px;
  padding:17px 30px;
  border:none;
  border-radius:18px;
  background:#22a943;
  color:white;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
}

#refreshButton:hover{
  background:#188b35;
}

#refreshButton:active{
  transform:scale(.98);
}

#refreshButton:disabled{
  opacity:.7;
  cursor:not-allowed;
}


/* =====================================================
   POSTS CONTAINER
===================================================== */

#postsContainer{
  width:100%;
}


/* =====================================================
   LOADING, EMPTY AND ERROR BOXES
===================================================== */

.statusCard{
  background:white;
  padding:45px 25px;
  border-radius:28px;
  text-align:center;
  font-size:22px;
  color:#777;
  box-shadow:0 7px 20px rgba(0,0,0,.09);
}

.statusCard.error{
  color:#b00020;
}

.statusCard.empty{
  color:#555;
}


/* =====================================================
   POST CARD
===================================================== */

.postCard{
  background:white;
  margin-bottom:28px;
  padding:26px;
  border-radius:28px;
  box-shadow:0 7px 22px rgba(0,0,0,.11);
  overflow:hidden;
}

.postHeader{
  display:flex;
  align-items:center;
  gap:16px;
}

.authorPicture{
  width:82px;
  height:82px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid #d8efff;
  cursor:pointer;
  flex-shrink:0;
}

.authorInformation{
  min-width:0;
}

.authorName{
  color:#0873c9;
  font-size:25px;
  font-weight:bold;
  line-height:1.2;
  cursor:pointer;
  word-break:break-word;
}

.postDetails{
  margin-top:8px;
  color:#777;
  font-size:18px;
  line-height:1.45;
}


/* =====================================================
   POST CATEGORY
===================================================== */

.postCategory{
  display:inline-block;
  margin-top:24px;
  padding:10px 18px;
  border-radius:25px;
  background:#e7f3ff;
  color:#0873c9;
  font-size:18px;
  font-weight:bold;
}


/* =====================================================
   POST MESSAGE
===================================================== */

.postMessage{
  margin-top:26px;
  font-size:21px;
  line-height:1.75;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}


/* =====================================================
   POST IMAGE
===================================================== */

.communityPostImage{
  display:block;
  width:100%;
  max-height:520px;
  margin-top:24px;
  border-radius:18px;
  object-fit:cover;
}


/* =====================================================
   POST ACTION BUTTONS
===================================================== */

.postActions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:28px;
  padding-top:20px;
  border-top:1px solid #ddd;
}

.postActions button{
  border:none;
  border-radius:14px;
  padding:13px 8px;
  background:#edf3f8;
  color:#333;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.postActions button:hover{
  background:#ddeaf4;
}

.likeButton.liked{
  background:#ffe4e8;
  color:#c2183b;
}

.postActions button:disabled{
  opacity:.65;
  cursor:not-allowed;
}


/* =====================================================
   BACK BUTTON
===================================================== */

.backSection{
  display:flex;
  justify-content:center;
  margin-top:35px;
}

#backButton{
  min-width:320px;
  padding:17px 28px;
  border:none;
  border-radius:18px;
  background:#707070;
  color:white;
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
}

#backButton:hover{
  background:#555;
}


/* =====================================================
   MOBILE DESIGN
===================================================== */

@media(max-width:600px){

  .pageContainer{
    padding:20px 14px 45px;
  }

  .wallHeader{
    padding:32px 18px;
    border-radius:26px;
  }

  .wallHeader h1{
    font-size:34px;
  }

  .wallHeader p{
    font-size:20px;
  }

  .postCard{
    padding:21px;
    border-radius:25px;
  }

  .authorPicture{
    width:70px;
    height:70px;
  }

  .authorName{
    font-size:22px;
  }

  .postDetails{
    font-size:16px;
  }

  .postMessage{
    font-size:19px;
  }

  .postActions{
    grid-template-columns:1fr;
  }

  .postActions button{
    font-size:17px;
  }

  #backButton{
    min-width:100%;
  }

}

</style>

</head>

<body>

<div class="pageContainer">

    <!-- ==========================================
         COMMUNITY HEADER
    =========================================== -->

    <header class="wallHeader">

        <h1>
            📰 Community Wall
        </h1>

        <p>
            Share God's Word, testimonies,
            encouragement and prayer with
            believers around the world.
        </p>

    </header>


    <!-- ==========================================
         REFRESH BUTTON
    =========================================== -->

    <div class="feedControls">

        <button
            type="button"
            id="refreshButton">

            🔄 Refresh

        </button>

    </div>


    <!-- ==========================================
         POSTS WILL APPEAR HERE
    =========================================== -->

    <main
        id="postsContainer">

        <div class="statusCard">

            Loading community posts...

        </div>

    </main>


    <!-- ==========================================
         BACK BUTTON
    =========================================== -->

    <div class="backSection">

        <button
            type="button"
            id="backButton">

            ← Back to Community

        </button>

    </div>

</div>


<script type="module">

/* =====================================================
   PART 3 OF 6
   FIREBASE SETUP AND BASIC HELPERS
===================================================== */

import {
  auth,
  db,
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  getDoc,
  setDoc,
  deleteDoc,
  onAuthStateChanged
} from "./firebase.js";

import {
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =====================================================
   PAGE ELEMENTS
===================================================== */

const postsContainer =
document.getElementById(
  "postsContainer"
);

const refreshButton =
document.getElementById(
  "refreshButton"
);

const backButton =
document.getElementById(
  "backButton"
);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let currentUserProfile = {};

let unsubscribePosts = null;

const likeListeners =
new Map();

const defaultProfilePicture =
"images/profile.png";


/* =====================================================
   GET FIRST AVAILABLE VALUE
===================================================== */

function getFirstValue(...values){

  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value).trim();

    }

  }

  return "";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  const temporaryElement =
  document.createElement("div");

  temporaryElement.textContent =
  String(value ?? "");

  return temporaryElement.innerHTML;

}


/* =====================================================
   STATUS MESSAGES
===================================================== */

function showLoadingMessage(){

  postsContainer.innerHTML = `

    <div class="statusCard">
      Loading community posts...
    </div>

  `;

}


function showEmptyMessage(){

  postsContainer.innerHTML = `

    <div class="statusCard empty">
      No community posts are available yet.
    </div>

  `;

}


function showErrorMessage(message){

  postsContainer.innerHTML = `

    <div class="statusCard error">
      ${escapeHTML(message)}
    </div>

  `;

}


/* =====================================================
   LOAD CURRENT USER PROFILE
===================================================== */

async function loadCurrentUserProfile(){

  currentUserProfile = {};


  if(!currentUser){

    return;

  }


  try{

    const profileReference =
    doc(
      db,
      "users",
      currentUser.uid
    );


    const profileSnapshot =
    await getDoc(
      profileReference
    );


    if(profileSnapshot.exists()){

      currentUserProfile =
      profileSnapshot.data();

    }

  }catch(error){

    console.error(
      "Current profile loading error:",
      error
    );

  }

}


/* =====================================================
   AUTHENTICATION STATE
===================================================== */

onAuthStateChanged(
  auth,
  async(user)=>{

    currentUser = user || null;

    await loadCurrentUserProfile();

    initializeFeed();

  }
);
    /* =====================================================
   PART 4 OF 6
   LOAD POSTS AND CREATE POST CARDS
===================================================== */


/* =====================================================
   STOP OLD POST LISTENER
===================================================== */

function stopPostsListener(){

  if(unsubscribePosts){

    unsubscribePosts();

    unsubscribePosts = null;

  }

}


/* =====================================================
   STOP ALL LIKE LISTENERS
===================================================== */

function stopAllLikeListeners(){

  for(
    const unsubscribeLike
    of likeListeners.values()
  ){

    unsubscribeLike();

  }

  likeListeners.clear();

}


/* =====================================================
   INITIALIZE COMMUNITY FEED
===================================================== */

function initializeFeed(){

  stopPostsListener();

  stopAllLikeListeners();

  loadCommunityPosts();

}


/* =====================================================
   LOAD COMMUNITY POSTS
===================================================== */

function loadCommunityPosts(){

  showLoadingMessage();

  stopPostsListener();

  stopAllLikeListeners();


  try{

    const postsReference =
    collection(
      db,
      "communityPosts"
    );


    const postsQuery =
    query(
      postsReference,
      orderBy(
        "timestamp",
        "desc"
      )
    );


    unsubscribePosts =
    onSnapshot(

      postsQuery,

      async(snapshot)=>{

        try{

          if(snapshot.empty){

            showEmptyMessage();

            return;

          }


          postsContainer.innerHTML = "";


          for(
            const postDocument
            of snapshot.docs
          ){

            const postData = {

              id:
              postDocument.id,

              ...postDocument.data()

            };


            const postCard =
            await createPostCard(
              postData
            );


            postsContainer.appendChild(
              postCard
            );

          }


          setTimeout(
            scrollToSharedPost,
            300
          );

        }catch(error){

          console.error(
            "Post display error:",
            error
          );


          showErrorMessage(
            error.message ||
            "Posts were found, but they could not be displayed."
          );

        }

      },

      (error)=>{

        console.error(
          "Firestore post-loading error:",
          error
        );


        let message =
        "Community posts could not be loaded.";


        if(
          error.code ===
          "permission-denied"
        ){

          message =
          "Firebase denied permission to read community posts.";

        }else if(
          error.code ===
          "failed-precondition"
        ){

          message =
          "Firebase requires a Firestore index for this query.";

        }else if(
          error.code ===
          "unavailable"
        ){

          message =
          "Firebase is temporarily unavailable. Please check your internet connection.";

        }else if(error.message){

          message =
          error.message;

        }


        showErrorMessage(
          message
        );

      }

    );

  }catch(error){

    console.error(
      "Community feed initialization error:",
      error
    );


    showErrorMessage(
      error.message ||
      "An unexpected error occurred while opening the Community Wall."
    );

  }

}


/* =====================================================
   FORMAT POST DATE
===================================================== */

function formatPostDate(value){

  if(!value){

    return "Recently";

  }


  try{

    let date;


    if(
      typeof value.toDate ===
      "function"
    ){

      date =
      value.toDate();

    }else if(value.seconds){

      date =
      new Date(
        value.seconds * 1000
      );

    }else{

      date =
      new Date(value);

    }


    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return "Recently";

    }


    return date.toLocaleString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }catch(error){

    console.error(
      "Post date error:",
      error
    );

    return "Recently";

  }

}


/* =====================================================
   LOAD POST AUTHOR PROFILE
===================================================== */

async function loadPostAuthorProfile(postData){

  const authorId =
  getFirstValue(
    postData.userId,
    postData.authorId,
    postData.uid
  );


  let authorProfile = {

    uid:
    authorId,

    name:
    getFirstValue(
      postData.name,
      postData.fullName,
      postData.displayName,
      "Community Member"
    ),

    picture:
    getFirstValue(
      postData.picture,
      postData.profilePicture,
      postData.photoURL,
      defaultProfilePicture
    ),

    country:
    getFirstValue(
      postData.country
    )

  };


  if(!authorId){

    return authorProfile;

  }


  try{

    const profileReference =
    doc(
      db,
      "users",
      authorId
    );


    const profileSnapshot =
    await getDoc(
      profileReference
    );


    if(profileSnapshot.exists()){

      const profileData =
      profileSnapshot.data();


      authorProfile = {

        uid:
        authorId,

        name:
        getFirstValue(
          profileData.name,
          profileData.fullName,
          profileData.displayName,
          authorProfile.name
        ),

        picture:
        getFirstValue(
          profileData.profilePicture,
          profileData.picture,
          profileData.photoURL,
          profileData.profileImage,
          profileData.profilePhoto,
          authorProfile.picture,
          defaultProfilePicture
        ),

        country:
        getFirstValue(
          profileData.country,
          authorProfile.country
        )

      };

    }

  }catch(error){

    console.error(
      "Post author profile error:",
      error
    );

  }


  return authorProfile;

}


/* =====================================================
   READ POST VALUES
===================================================== */

function getPostMessage(postData){

  return getFirstValue(
    postData.post,
    postData.message,
    postData.content,
    postData.text,
    postData.description
  );

}


function getPostCategory(postData){

  return getFirstValue(
    postData.category,
    postData.postCategory,
    postData.type
  );

}


function getPostImage(postData){

  return getFirstValue(
    postData.imageUrl,
    postData.imageURL,
    postData.postImage,
    postData.photoUrl,
    postData.photoURL,
    postData.image
  );

}


/* =====================================================
   CREATE ONE POST CARD
===================================================== */

async function createPostCard(postData){

  const authorProfile =
  await loadPostAuthorProfile(
    postData
  );


  const postMessage =
  getPostMessage(
    postData
  );


  const postCategory =
  getPostCategory(
    postData
  );


  const postImage =
  getPostImage(
    postData
  );


  const postDate =
  formatPostDate(
    postData.timestamp ||
    postData.createdAt
  );


  const postCard =
  document.createElement(
    "article"
  );


  postCard.className =
  "postCard";


  postCard.dataset.postId =
  postData.id || "";


  const safePostId =
  escapeHTML(
    postData.id || ""
  );


  const safeAuthorId =
  escapeHTML(
    authorProfile.uid || ""
  );


  const safeAuthorName =
  escapeHTML(
    authorProfile.name ||
    "Community Member"
  );


  const safeAuthorPicture =
  escapeHTML(
    authorProfile.picture ||
    defaultProfilePicture
  );


  const safeCountry =
  escapeHTML(
    authorProfile.country || ""
  );


  const safePostCategory =
  escapeHTML(
    postCategory || ""
  );


  const safePostMessage =
  escapeHTML(
    postMessage || ""
  );


  const safePostImage =
  escapeHTML(
    postImage || ""
  );


  const safePostDate =
  escapeHTML(
    postDate
  );


  postCard.innerHTML = `

    <div class="postHeader">

      <img
        class="authorPicture"
        src="${safeAuthorPicture}"
        alt="${safeAuthorName}'s profile picture"
        data-author-id="${safeAuthorId}"
      >

      <div class="authorInformation">

        <div
          class="authorName"
          data-author-id="${safeAuthorId}"
        >
          ${safeAuthorName}
        </div>

        <div class="postDetails">

          ${
            safeCountry
            ? `${safeCountry} • `
            : ""
          }

          ${safePostDate}

        </div>

      </div>

    </div>


    ${
      safePostCategory
      ? `

        <div class="postCategory">
          ${safePostCategory}
        </div>

      `
      : ""
    }


    ${
      safePostMessage
      ? `

        <div class="postMessage">
          ${safePostMessage}
        </div>

      `
      : ""
    }


    ${
      safePostImage
      ? `

        <img
          class="communityPostImage"
          src="${safePostImage}"
          alt="Community post image"
          loading="lazy"
        >

      `
      : ""
    }


    <div class="postActions">

      <button
        type="button"
        class="likeButton"
        data-post-id="${safePostId}"
      >
        🤍 Like (0)
      </button>

      <button
        type="button"
        class="commentButton"
        data-post-id="${safePostId}"
      >
        💬 Comments
      </button>

      <button
        type="button"
        class="shareButton"
        data-post-id="${safePostId}"
      >
        ↗ Share
      </button>

    </div>

  `;


  const authorPicture =
  postCard.querySelector(
    ".authorPicture"
  );


  if(authorPicture){

    authorPicture.addEventListener(
      "error",
      ()=>{

        authorPicture.src =
        defaultProfilePicture;

      },
      {
        once:true
      }
    );

  }


  const communityPostImage =
  postCard.querySelector(
    ".communityPostImage"
  );


  if(communityPostImage){

    communityPostImage.addEventListener(
      "error",
      ()=>{

        communityPostImage.remove();

      },
      {
        once:true
      }
    );

  }


  const openAuthorProfile = ()=>{

    if(!authorProfile.uid){

      return;

    }


    window.location.href =
    "profile.html?uid=" +
    encodeURIComponent(
      authorProfile.uid
    );

  };


  if(authorPicture){

    authorPicture.addEventListener(
      "click",
      openAuthorProfile
    );

  }


  const authorName =
  postCard.querySelector(
    ".authorName"
  );


  if(authorName){

    authorName.addEventListener(
      "click",
      openAuthorProfile
    );

  }


  setupLikeButton(
    postData,
    postCard
  );


  setupPostActions(
    postData,
    postCard
  );


  return postCard;

}     
/* =====================================================
   PART 5 OF 6
   LIKE, COMMENTS, SHARE, REFRESH AND BACK
===================================================== */


/* =====================================================
   STOP ONE OLD LIKE LISTENER
===================================================== */

function stopLikeListener(postId){

  const oldListener =
  likeListeners.get(postId);


  if(oldListener){

    oldListener();

    likeListeners.delete(postId);

  }

}


/* =====================================================
   SET UP LIKE BUTTON
===================================================== */

function setupLikeButton(
  postData,
  postCard
){

  const likeButton =
  postCard.querySelector(
    ".likeButton"
  );


  if(!likeButton){

    return;

  }


  const postId =
  postData.id;


  if(!postId){

    likeButton.disabled = true;

    likeButton.textContent =
    "🤍 Like unavailable";

    return;

  }


  stopLikeListener(postId);


  const likesReference =
  collection(
    db,
    "communityPosts",
    postId,
    "likes"
  );


  const unsubscribeLikes =
  onSnapshot(

    likesReference,

    (snapshot)=>{

      const totalLikes =
      snapshot.size;


      let currentUserLiked =
      false;


      if(currentUser){

        currentUserLiked =
        snapshot.docs.some(
          likeDocument =>
          likeDocument.id ===
          currentUser.uid
        );

      }


      likeButton.dataset.liked =
      currentUserLiked
      ? "true"
      : "false";


      likeButton.classList.toggle(
        "liked",
        currentUserLiked
      );


      likeButton.textContent =
      currentUserLiked
      ? `❤️ Liked (${totalLikes})`
      : `🤍 Like (${totalLikes})`;

    },

    (error)=>{

      console.error(
        "Like listener error:",
        error
      );


      const oldLikeCount =
      Number(
        postData.likes
      ) || 0;


      likeButton.dataset.liked =
      "false";


      likeButton.classList.remove(
        "liked"
      );


      likeButton.textContent =
      `🤍 Like (${oldLikeCount})`;

    }

  );


  likeListeners.set(
    postId,
    unsubscribeLikes
  );


  likeButton.addEventListener(
    "click",
    async()=>{

      if(!currentUser){

        alert(
          "Please sign in before liking a post."
        );

        return;

      }


      const userLikeReference =
      doc(
        db,
        "communityPosts",
        postId,
        "likes",
        currentUser.uid
      );


      const hasLiked =
      likeButton.dataset.liked ===
      "true";


      likeButton.disabled = true;


      try{

        if(hasLiked){

          await deleteDoc(
            userLikeReference
          );

        }else{

          const likerName =
          getFirstValue(
            currentUserProfile?.name,
            currentUserProfile?.fullName,
            currentUserProfile?.displayName,
            currentUser.displayName,
            "Community Member"
          );


          const likerPicture =
          getFirstValue(
            currentUserProfile?.profilePicture,
            currentUserProfile?.picture,
            currentUserProfile?.photoURL,
            currentUserProfile?.profileImage,
            currentUserProfile?.profilePhoto,
            currentUser.photoURL,
            defaultProfilePicture
          );


          await setDoc(
            userLikeReference,
            {

              userId:
              currentUser.uid,

              name:
              likerName,

              picture:
              likerPicture,

              likedAt:
              serverTimestamp()

            }
          );

        }

      }catch(error){

        console.error(
          "Like update error:",
          error
        );


        alert(
          error.message ||
          "The Like could not be updated."
        );

      }finally{

        likeButton.disabled = false;

      }

    }
  );

}


/* =====================================================
   COMMENTS AND SHARE
===================================================== */

function setupPostActions(
  postData,
  postCard
){

  const commentButton =
  postCard.querySelector(
    ".commentButton"
  );


  const shareButton =
  postCard.querySelector(
    ".shareButton"
  );


  const postId =
  postData.id;


  if(commentButton){

    commentButton.addEventListener(
      "click",
      ()=>{

        if(!postId){

          alert(
            "This post cannot be opened."
          );

          return;

        }


        window.location.href =
        "comments.html?postId=" +
        encodeURIComponent(postId);

      }
    );

  }


  if(shareButton){

    shareButton.addEventListener(
      "click",
      async()=>{

        if(!postId){

          alert(
            "This post cannot be shared."
          );

          return;

        }


        const postLink =
        window.location.origin +
        window.location.pathname +
        "?postId=" +
        encodeURIComponent(postId);


        const postMessage =
        getPostMessage(postData);


        const shareText =
        postMessage
        ? postMessage.slice(0,180)
        : "View this community post";


        try{

          if(navigator.share){

            await navigator.share({

              title:
              "SABASABA Community Post",

              text:
              shareText,

              url:
              postLink

            });

          }else if(navigator.clipboard){

            await navigator.clipboard.writeText(
              postLink
            );


            alert(
              "Post link copied successfully."
            );

          }else{

            prompt(
              "Copy this post link:",
              postLink
            );

          }

        }catch(error){

          if(error.name === "AbortError"){

            return;

          }


          console.error(
            "Post sharing error:",
            error
          );


          prompt(
            "Copy this post link:",
            postLink
          );

        }

      }
    );

  }

}


/* =====================================================
   REFRESH BUTTON
===================================================== */

if(refreshButton){

  refreshButton.addEventListener(
    "click",
    ()=>{

      refreshButton.disabled = true;

      refreshButton.textContent =
      "⏳ Refreshing...";


      initializeFeed();


      setTimeout(
        ()=>{

          refreshButton.disabled = false;

          refreshButton.textContent =
          "🔄 Refresh";

        },
        1200
      );

    }
  );

}


/* =====================================================
   BACK BUTTON
===================================================== */

if(backButton){

  backButton.addEventListener(
    "click",
    ()=>{

      window.location.href =
      "community.html";

    }
  );

}


/* =====================================================
   OPEN SHARED POST
===================================================== */

function scrollToSharedPost(){

  const parameters =
  new URLSearchParams(
    window.location.search
  );


  const sharedPostId =
  parameters.get("postId");


  if(!sharedPostId){

    return;

  }


  let sharedPost = null;


  try{

    sharedPost =
    document.querySelector(
      `[data-post-id="${CSS.escape(sharedPostId)}"]`
    );

  }catch(error){

    console.error(
      "Shared post selector error:",
      error
    );

    return;

  }


  if(!sharedPost){

    return;

  }


  sharedPost.scrollIntoView({

    behavior:"smooth",

    block:"center"

  });


  sharedPost.style.outline =
  "4px solid #0874d1";


  sharedPost.style.outlineOffset =
  "4px";


  setTimeout(
    ()=>{

      sharedPost.style.outline =
      "none";


      sharedPost.style.outlineOffset =
      "0";

    },
    3500
  );

}

    console.log(

    initializeFeed();

  }
);

===================================================== */

    console.error(
      "Community Wall error:",
      event.error ||
      event.message

  }

===================================================== */

window.addEventListener(

===================================================== */

    stopPostsListener();
