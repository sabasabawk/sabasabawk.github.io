<style>

/* =====================================================
   PART 1 OF 10
   DOCUMENT SETUP, GENERAL PAGE AND TOP BAR
===================================================== */


/* =====================================================
   GENERAL RESET
===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:#eef3f8;
  color:#222222;
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

button{
  cursor:pointer;
}

img,
video{
  max-width:100%;
}

a{
  color:inherit;
}


/* =====================================================
   MAIN APPLICATION TOP BAR
===================================================== */

.appTopBar{
  position:sticky;
  top:0;
  z-index:900;
  width:100%;
  background:#ffffff;
  border-bottom:1px solid #d7e0e8;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.appTopBarInner{
  width:100%;
  max-width:760px;
  min-height:64px;
  margin:auto;
  padding:8px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}


/* =====================================================
   MINISTRY BRAND
===================================================== */

.appBrand{
  min-width:0;
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
}

.appLogo{
  width:48px;
  height:48px;
  flex-shrink:0;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ffffff;
  border:2px solid #087bd1;
  box-shadow:0 3px 9px rgba(0,0,0,.16);
}

.appLogoImage{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  border-radius:50%;
}

.appBrandText{
  min-width:0;
  color:#075daa;
  font-size:17px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* =====================================================
   TOP BAR ACTION BUTTONS
===================================================== */

.topBarActions{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:7px;
}

.topIconLink{
  position:relative;
  width:42px;
  height:42px;
  flex-shrink:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#edf3f8;
  color:#1f2933;
  text-decoration:none;
  font-size:20px;
  transition:
    background .2s ease,
    transform .2s ease;
}

.topIconLink:hover{
  background:#dce9f4;
  transform:translateY(-1px);
}

.topIconLink:active{
  transform:scale(.96);
}


/* =====================================================
   NOTIFICATION NUMBER BADGE
===================================================== */

.notificationBadge{
  position:absolute;
  top:-3px;
  right:-3px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:20px;
  display:none;
  align-items:center;
  justify-content:center;
  background:#e60023;
  color:#ffffff;
  border:2px solid #ffffff;
  font-size:11px;
  font-weight:bold;
  line-height:1;
}


/* =====================================================
   MAIN PAGE CONTAINER
===================================================== */

.pageContainer{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:16px 14px 115px;
}


/* =====================================================
   ACCESSIBILITY
===================================================== */

button:focus-visible,
a:focus-visible{
  outline:3px solid rgba(8,123,209,.35);
  outline-offset:3px;
}


/* =====================================================
   SMALL-SCREEN TOP BAR
===================================================== */

@media(max-width:600px){

  .appTopBarInner{
    padding-left:10px;
    padding-right:10px;
  }

  .appBrandText{
    font-size:15px;
  }

  .topIconLink{
    width:39px;
    height:39px;
    font-size:18px;
  }

  .pageContainer{
    padding-left:10px;
    padding-right:10px;
  }

}
/* =====================================================
   PART 2 OF 10
   QUICK POST BOX, COMMUNITY WALL HEADER
   AND STATUS CARDS
===================================================== */


/* =====================================================
   QUICK POST BOX
===================================================== */

.quickPostBox{
  width:100%;
  padding:16px;
  background:#ffffff;
  border-radius:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.09);
}

.quickPostRow{
  display:flex;
  align-items:center;
  gap:12px;
}

.quickPostAvatar{
  width:52px;
  height:52px;
  flex-shrink:0;
  border-radius:50%;
  object-fit:cover;
  background:#e5e9ed;
  border:3px solid #d8efff;
}

.quickPostButton{
  flex:1;
  min-width:0;
  min-height:50px;
  padding:12px 17px;
  border:1px solid #d3dce4;
  border-radius:28px;
  background:#f4f6f8;
  color:#65717c;
  text-align:left;
  font-size:16px;
  line-height:1.4;
  transition:
    background .2s ease,
    border-color .2s ease;
}

.quickPostButton:hover{
  background:#e9eef3;
  border-color:#bfcdd9;
}

.quickPostButton:active{
  transform:scale(.995);
}


/* =====================================================
   MOMENTS STRIP (STORIES-STYLE)
===================================================== */

.momentsSection{
  margin-top:16px;
}

.momentsRow{
  display:flex;
  align-items:flex-start;
  gap:13px;
  overflow-x:auto;
  overscroll-behavior-inline:contain;
  padding:2px 2px 6px;
  scrollbar-width:thin;
  scrollbar-color:#c4d5e1 transparent;
}

.momentsRow::-webkit-scrollbar{
  height:5px;
}

.momentsRow::-webkit-scrollbar-track{
  background:transparent;
}

.momentsRow::-webkit-scrollbar-thumb{
  border-radius:999px;
  background:#c4d5e1;
}

.momentCircleButton{
  width:72px;
  flex:0 0 72px;
  border:0;
  background:transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  color:#222222;
  text-align:center;
  text-decoration:none;
  cursor:pointer;
}

.momentAvatarOuter{
  position:relative;
  width:64px;
  height:64px;
  padding:3px;
  border-radius:50%;
  background:linear-gradient(145deg,#087bd1,#55c1f1);
  box-shadow:0 5px 14px rgba(30,75,104,.15);
  transition:transform .2s ease;
}

.momentCircleButton:hover .momentAvatarOuter{
  transform:translateY(-2px);
}

.momentCircleButton:active .momentAvatarOuter{
  transform:scale(.95);
}

.momentAvatarInner{
  width:100%;
  height:100%;
  border:3px solid #ffffff;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e7eef3;
  color:#60727f;
  font-size:20px;
  font-weight:900;
}

.momentAvatarInner img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.momentTypeBadge{
  position:absolute;
  right:-2px;
  bottom:-2px;
  min-width:23px;
  height:23px;
  padding:0 5px;
  border:2px solid #ffffff;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ffffff;
  font-size:12px;
  box-shadow:0 3px 9px rgba(0,0,0,.16);
}

.momentName{
  width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:11px;
  font-weight:bold;
  line-height:1.25;
}

.createMomentCircle .momentAvatarOuter{
  background:linear-gradient(145deg,#dce8f0,#eef4f8);
}

.createMomentCircle .momentAvatarInner{
  background:#ffffff;
  color:#087bd1;
  font-size:26px;
}

.createMomentCircle .momentTypeBadge{
  background:#087bd1;
  color:#ffffff;
  font-size:14px;
  font-weight:900;
}


/* =====================================================
   COMMUNITY WALL HEADER
===================================================== */

.wallTitleBar{
  margin:18px 0;
  padding:16px 18px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:linear-gradient(
    135deg,
    #087bd1,
    #0055a5
  );
  color:#ffffff;
  box-shadow:0 6px 16px rgba(0,0,0,.14);
}

.wallTitleText{
  min-width:0;
}

.wallTitleText h1{
  font-size:22px;
  line-height:1.25;
}

.wallTitleText p{
  margin-top:4px;
  color:#e7f4ff;
  font-size:13px;
  line-height:1.5;
}


/* =====================================================
   REFRESH BUTTON
===================================================== */

.refreshButton{
  width:46px;
  height:46px;
  flex-shrink:0;
  border:none;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ffffff;
  color:#0873c9;
  font-size:21px;
  box-shadow:0 3px 9px rgba(0,0,0,.15);
  transition:
    transform .2s ease,
    background .2s ease;
}

.refreshButton:hover{
  background:#eef6ff;
  transform:rotate(20deg);
}

.refreshButton:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}


/* =====================================================
   POSTS CONTAINER
===================================================== */

#postsContainer{
  width:100%;
}


/* =====================================================
   STATUS CARDS
===================================================== */

.statusCard{
  margin-top:18px;
  padding:36px 24px;
  border-radius:22px;
  background:#ffffff;
  color:#66717c;
  text-align:center;
  font-size:17px;
  line-height:1.7;
  box-shadow:0 6px 18px rgba(0,0,0,.09);
}

.statusCard.error{
  color:#b00020;
}

.statusCard.empty{
  color:#4f5963;
}

.statusCard.loading{
  color:#0873c9;
}


/* =====================================================
   LOAD MORE / END OF FEED
===================================================== */

#loadMoreSentinel{
  width:100%;
  padding:20px;
  text-align:center;
  color:#8a95a1;
  font-size:14px;
}


/* =====================================================
   SMALL SCREEN
===================================================== */

@media(max-width:600px){

  .quickPostBox{
    padding:14px;
  }

  .quickPostAvatar{
    width:48px;
    height:48px;
  }

  .quickPostButton{
    font-size:15px;
  }

  .wallTitleBar{
    padding:14px 16px;
  }

  .wallTitleText h1{
    font-size:20px;
  }

  .wallTitleText p{
    font-size:12px;
  }

  .statusCard{
    padding:30px 18px;
    font-size:16px;
  }

}
/* =====================================================
   PART 3 OF 10
   POST CARD, MEDIA AND ACTION BUTTONS
===================================================== */


/* =====================================================
   COMMUNITY POST CARD
===================================================== */

.postCard{
  width:100%;
  margin-bottom:20px;
  padding:18px;
  background:#ffffff;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.09);
  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.postCard:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(0,0,0,.12);
}


/* =====================================================
   POST HEADER
===================================================== */

.postHeader{
  display:flex;
  align-items:center;
  gap:12px;
}

.authorPicture{
  width:56px;
  height:56px;
  flex-shrink:0;
  border-radius:50%;
  object-fit:cover;
  background:#e5e9ed;
  border:3px solid #d8efff;
  cursor:pointer;
}

.authorInformation{
  min-width:0;
  flex:1;
}

.authorName{
  color:#0873c9;
  font-size:18px;
  font-weight:bold;
  line-height:1.3;
  word-break:break-word;
  cursor:pointer;
}


/* =====================================================
   VERIFIED ACCOUNT BADGE
===================================================== */

.authorNameRow{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}

.verifiedBadge{
  display:none;
  min-height:20px;
  padding:4px 7px;
  border-radius:999px;
  align-items:center;
  justify-content:center;
  gap:3px;
  background:#e7f3ff;
  color:#0873c9;
  font-size:9px;
  font-weight:bold;
  line-height:1;
  white-space:nowrap;
}

.verifiedBadge.show{
  display:inline-flex;
}

.verifiedBadge.ministry{
  background:#eaf7ee;
  color:#27874f;
}

.authorName:hover{
  text-decoration:underline;
}

.postDetails{
  margin-top:4px;
  color:#747f89;
  font-size:13px;
  line-height:1.5;
}


/* =====================================================
   POST CATEGORY
===================================================== */

.postCategory{
  display:inline-block;
  margin-top:15px;
  padding:7px 12px;
  border-radius:18px;
  background:#e7f3ff;
  color:#0873c9;
  font-size:13px;
  font-weight:bold;
}


/* =====================================================
   POST MESSAGE
===================================================== */

.postMessage{
  margin-top:15px;
  color:#20252a;
  font-size:17px;
  line-height:1.7;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.postMessage:empty{
  display:none;
}


/* =====================================================
   POST MEDIA
===================================================== */

.postMediaContainer{
  width:100%;
  margin-top:16px;
}

.postMediaContainer:empty{
  display:none;
}

.communityPostImage,
.communityPostVideo{
  display:block;
  width:100%;
  max-height:560px;
  border-radius:16px;
  background:#000000;
  object-fit:contain;
}

.communityPostImage{
  cursor:pointer;
}

.communityPostVideo{
  outline:none;
}

.communityPostVideoWrapper{
  position:relative;
  width:100%;
  max-height:560px;
  border-radius:16px;
  overflow:hidden;
  background:#000000;
  cursor:pointer;
}

.communityPostVideoWrapper .communityPostVideo{
  width:100%;
  max-height:560px;
  border-radius:0;
}

.videoExpandOverlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.08);
  color:#ffffff;
  font-size:52px;
  text-shadow:0 2px 10px rgba(0,0,0,.5);
  pointer-events:none;
  opacity:.85;
  transition:opacity .2s ease;
}


/* =====================================================
   MAIN ACTION BUTTONS
===================================================== */

.postActions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:18px;
  padding-top:15px;
  border-top:1px solid #e1e6eb;
}

.postActions button{
  min-height:44px;
  padding:10px 8px;
  border:none;
  border-radius:12px;
  background:#edf3f8;
  color:#35414c;
  font-size:13px;
  font-weight:bold;
  transition:
    background .2s ease,
    transform .2s ease;
}

.postActions button:hover{
  background:#dce9f4;
  transform:translateY(-1px);
}

.postActions button:active{
  transform:scale(.98);
}

.postActions button:disabled{
  opacity:.65;
  cursor:not-allowed;
}


/* =====================================================
   LIKE BUTTON
===================================================== */

.likeButton.liked{
  background:#ffe5ea;
  color:#c2183b;
}


/* =====================================================
   OWNER ACTIONS
===================================================== */

.ownerActions{
  grid-template-columns:repeat(2,1fr);
  margin-top:10px;
  padding-top:0;
  border-top:none;
}

.editButton{
  background:#fff3cd !important;
  color:#755600 !important;
}

.editButton:hover{
  background:#ffe8a3 !important;
}

.deleteButton{
  background:#ffe1e1 !important;
  color:#b00020 !important;
}

.deleteButton:hover{
  background:#ffd2d2 !important;
}


/* =====================================================
   SMALL SCREEN
===================================================== */

@media(max-width:600px){

  .postCard{
    padding:16px;
    border-radius:18px;
  }

  .authorPicture{
    width:52px;
    height:52px;
  }

  .authorName{
    font-size:17px;
  }

  .postMessage{
    font-size:16px;
  }

  .postActions button{
    font-size:12px;
    min-height:42px;
  }

}
/* =====================================================
   PART 4 OF 10
   FLOATING BUTTON, BOTTOM NAVIGATION,
   PHOTO VIEWER AND RESPONSIVE DESIGN
===================================================== */


/* =====================================================
   FLOATING CREATE POST BUTTON
===================================================== */

.floatingCreateButton{
  position:fixed;
  right:18px;
  bottom:96px;
  z-index:850;
  width:60px;
  height:60px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(
    135deg,
    #087bd1,
    #0055a5
  );
  color:#ffffff;
  text-decoration:none;
  font-size:32px;
  font-weight:bold;
  box-shadow:0 8px 22px rgba(0,0,0,.28);
  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.floatingCreateButton:hover{
  transform:translateY(-2px) scale(1.04);
}

.floatingCreateButton:active{
  transform:scale(.96);
}


/* =====================================================
   BOTTOM NAVIGATION
===================================================== */

.bottomNavigation{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:900;
  background:#ffffff;
  border-top:1px solid #d7dee6;
  box-shadow:0 -3px 14px rgba(0,0,0,.10);
}

.bottomNavigationInner{
  width:100%;
  max-width:760px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(6,1fr);
}

.bottomNavItem{
  min-width:0;
  padding:8px 3px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:#66717c;
  text-align:center;
  text-decoration:none;
  font-size:10px;
  font-weight:bold;
  transition:
    background .2s ease,
    color .2s ease;
}

.bottomNavItem:hover{
  background:#f2f7fb;
}

.bottomNavItem.active{
  color:#0873c9;
}

.bottomNavIcon{
  font-size:21px;
  line-height:1;
}


/* =====================================================
   FULL SCREEN PHOTO VIEWER
===================================================== */

#photoViewer{
  position:fixed;
  inset:0;
  z-index:1200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.95);
}

#photoViewer.open{
  display:flex;
}

#photoViewerImage{
  display:block;
  max-width:100%;
  max-height:92vh;
  object-fit:contain;
}

#photoViewerVideo{
  display:none;
  max-width:100%;
  max-height:92vh;
  background:#000000;
}


/* =====================================================
   REELS-STYLE VIDEO VIEWER
===================================================== */

.videoReelViewer{
  position:fixed;
  inset:0;
  z-index:1300;
  display:none;
  background:#000000;
}

.videoReelViewer.open{
  display:block;
}

.videoReelTrack{
  width:100%;
  height:100%;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
}

.videoReelSlide{
  position:relative;
  width:100%;
  height:100%;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000000;
}

.videoReelSlide video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000000;
}

.closeReelButton{
  position:fixed;
  top:15px;
  right:15px;
  z-index:1310;
  width:48px;
  height:48px;
  border:none;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.22);
  color:#ffffff;
  font-size:28px;
  cursor:pointer;
  transition:background .2s ease;
}

.closeReelButton:hover{
  background:rgba(255,255,255,.35);
}

#closePhotoViewer{
  position:absolute;
  top:15px;
  right:15px;
  width:48px;
  height:48px;
  border:none;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.22);
  color:#ffffff;
  font-size:28px;
  cursor:pointer;
  transition:background .2s ease;
}

#closePhotoViewer:hover{
  background:rgba(255,255,255,.35);
}


/* =====================================================
   MOBILE RESPONSIVE DESIGN
===================================================== */

@media(max-width:600px){

  .floatingCreateButton{
    width:56px;
    height:56px;
    right:15px;
    bottom:88px;
    font-size:30px;
  }

  .bottomNavItem{
    font-size:9px;
  }

  .bottomNavIcon{
    font-size:20px;
  }

  #closePhotoViewer{
    width:44px;
    height:44px;
    font-size:26px;
  }

}

   END OF STYLES
===================================================== */

</style>

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser =
null;


let currentProfile =
{};


let unsubscribePosts =
null;


let unsubscribeNotifications =
null;


let unsubscribeMomentsStrip =
null;


const defaultProfilePicture =
"images/profile.png";


/* Stores loaded user profiles temporarily */

/* =====================================================
   PAGINATION STATE
   (this is what stops the app loading every
   post at once — only POSTS_PER_PAGE load
   to start, more load as the user scrolls)
===================================================== */

const POSTS_PER_PAGE =
20;


let lastVisibleDocument =
null;


let isLoadingMorePosts =
false;


let noMorePostsAvailable =
false;


let postsLoadObserver =
null;


/*
   Older posts loaded via scrolling are kept
   here permanently, separate from the live
   top-page cache. This is what fixes the bug
   where liking/commenting on any post used to
   silently wipe out everything the user had
   already scrolled down to load.
*/

let latestPostsDocsCache =
[];


let olderPostsDocs =
[];


/* =====================================================
   RETURN FIRST AVAILABLE VALUE
===================================================== */

function getFirstValue(
  ...values
){

  for(
    const value
    of values
  ){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(
        value
      ).trim();

    }

  }


  return "";

}


/* =====================================================
   SHOW LOADING MESSAGE
===================================================== */

/* =====================================================
   PROTECT PROFILE PICTURES
===================================================== */

function protectProfilePicture(
  imageElement
){

  if(!imageElement){

    return;

  }


  imageElement.addEventListener(
    "error",
    function(){

      imageElement.src =
      defaultProfilePicture;

    },
    {
      once:true
    }
  );

}


/* =====================================================
   FORMAT FIREBASE DATE
===================================================== */

function formatPostDate(
  timestamp
){

  if(!timestamp){

    return "Recently";

  }


  try{

    let postDate;


    if(
      typeof timestamp.toDate ===
      "function"
    ){

      postDate =
      timestamp.toDate();

    }else if(
      timestamp.seconds
    ){

      postDate =
      new Date(
        timestamp.seconds *
        1000
      );

    }else{

      postDate =
      new Date(
        timestamp
      );

    }


    if(
      Number.isNaN(
        postDate.getTime()
      )
    ){

      return "Recently";

    }


    return postDate.toLocaleString(
      undefined,
      {
        year:
        "numeric",

        month:
        "short",

        day:
        "numeric",

        hour:
        "numeric",

        minute:
        "2-digit"
      }
    );

  }catch(error){

    console.error(
      "Date formatting error:",
      error
    );


    return "Recently";

  }

}
/* =====================================================
   PART 7 OF 10
   AUTHENTICATION, CURRENT USER PROFILE
   AND QUICK POST NAVIGATION
===================================================== */


/* =====================================================
   LOAD CURRENT USER PROFILE
===================================================== */

async function loadCurrentUserProfile(){

  currentProfile = {};

  if(!currentUser){

    quickPostAvatar.src =
    defaultProfilePicture;

    return;

  }


  try{

    const profileReference =
    doc(
      db,

    );


    const profileSnapshot =
    await getDoc(
      profileReference
    );


    if(
      profileSnapshot.exists()
    ){

      currentProfile =
      profileSnapshot.data();

    }


    const profilePicture =
    getFirstValue(
      currentProfile.picture,
      currentProfile.profilePicture,
      currentProfile.photoURL,
      currentProfile.photoUrl,
      currentUser.photoURL,
      defaultProfilePicture
    );


    quickPostAvatar.src =
    profilePicture;


    if(quickMomentAvatar){

      quickMomentAvatar.innerHTML =
      `<img src="${profilePicture}" alt="Your profile picture">`;

    }

  }catch(error){

    console.error(

    );


    quickPostAvatar.src =
    defaultProfilePicture;

  }

}


/* =====================================================
   QUICK POST BUTTON
===================================================== */

quickPostButton.addEventListener(

/* =====================================================
   STOP CURRENT FIRESTORE LISTENER
===================================================== */

function stopPostsListener(){

  if(
    typeof unsubscribePosts ===
    "function"
  ){

    unsubscribePosts();

  }


  unsubscribePosts =
  null;

}


/* =====================================================
   START COMMUNITY FEED
===================================================== */

function startCommunityFeed(){

  stopPostsListener();


  if(
    postsLoadObserver
  ){

    postsLoadObserver.disconnect();

  }


  /*
     Reset pagination so a refresh
     starts back at the newest posts.
  */

  lastVisibleDocument =
  null;


  noMorePostsAvailable =
  false;


  isLoadingMorePosts =
  false;


  latestPostsDocsCache =
  [];


  olderPostsDocs =
  [];


  loadMoreSentinel.textContent =
  "";


  showLoadingMessage();


  loadCommunityPosts();

}


/* =====================================================
   STOP NOTIFICATION LISTENER
===================================================== */

function stopNotificationListener(){

  if(
    typeof unsubscribeNotifications ===
    "function"
  ){

    unsubscribeNotifications();

  }


  unsubscribeNotifications =
  null;

}


/* =====================================================
   SHOW UNREAD NOTIFICATION NUMBER
===================================================== */

function startNotificationListener(){

  stopNotificationListener();


  if(!currentUser){

    notificationBadge.style.display =
    "none";


    notificationBadge.textContent =
    "0";


    return;

  }


  const unreadNotificationsQuery =
  query(

    collection(
      db,
      "notifications"
    ),

    where(
      "recipientId",
      "==",
      currentUser.uid
    ),

    where(
      "read",
      "==",
      false
    )

  );


  unsubscribeNotifications =
  onSnapshot(

    unreadNotificationsQuery,


    function(snapshot){

      const totalUnread =
      snapshot.size;


      if(totalUnread > 0){

        notificationBadge.style.display =
        "flex";


        notificationBadge.textContent =
        totalUnread > 99
        ? "99+"
        : String(totalUnread);

      }else{

        notificationBadge.style.display =
        "none";


        notificationBadge.textContent =
        "0";

      }

    },


    function(error){

      console.error(
        "Notification badge error:",

      );


      notificationBadge.style.display =
      "none";

    }

  );

}


/* =====================================================
   AUTHENTICATION LISTENER
===================================================== */

onAuthStateChanged(

  auth,


  async function(user){

    currentUser =
    user || null;


    await loadCurrentUserProfile();


    startNotificationListener();


    startCommunityFeed();


    startMomentsStripListener();

  },

    );

    currentProfile =
    {};

    defaultProfilePicture;


    startCommunityFeed();

  }

);
/* =====================================================
   PART 8 OF 10
   LOAD COMMUNITY POSTS FROM FIRESTORE
   (FIRST PAGE = LIVE / REALTIME,
   OLDER PAGES = LOADED ON SCROLL)
===================================================== */


/* =====================================================
   LOAD FIRST PAGE OF POSTS (REALTIME)

   Only the newest POSTS_PER_PAGE posts are
   subscribed to live. This is what fixes the
   slow opening — the app no longer downloads
   every post that has ever been made.
===================================================== */

function renderCommunityPosts(){

  postsContainer.innerHTML =
  "";


  const combinedDocs =
  latestPostsDocsCache.concat(
    olderPostsDocs
  );


  if(
    combinedDocs.length === 0
  ){

    showEmptyMessage();

    return;

  }


  combinedDocs.forEach(
    function(postDocument){

      try{

        const postData = {

          id:
          postDocument.id,

          ...postDocument.data()

        };


        const postCard =
        createPostCard(
          postData
        );


        postsContainer.appendChild(
          postCard
        );

      }catch(error){

        console.error(
          "Error creating post card:",
          error
        );

      }

    }
  );


  if(
    postsContainer.children.length ===
    0
  ){

    showErrorMessage(
      "Community posts were found, but they could not be displayed."
    );

    return;

  }


  startVideoAutoPlay();

}


function loadCommunityPosts(){

  try{

    const postsReference =
    collection(
      db,
      "communityPosts"
    );


    const firstPageQuery =
    query(
      postsReference,
      orderBy(
        "timestamp",
        "desc"
      ),
      limit(
        POSTS_PER_PAGE
      )
    );


    unsubscribePosts =
    onSnapshot(

      firstPageQuery,


      function(snapshot){

        latestPostsDocsCache =
        snapshot.docs;


        /*
           Only the first page determines
           whether more posts exist, UNLESS
           the user has already scrolled and
           loaded older pages — in that case,
           leave that decision alone, since
           this live update only re-checks the
           newest 20 posts, not the full list.
        */

        if(
          olderPostsDocs.length ===
          0
        ){

          if(
            snapshot.docs.length > 0
          ){

            lastVisibleDocument =
            snapshot.docs[
              snapshot.docs.length - 1
            ];

          }


          /*
             Only mark the feed as truly
             finished when there are zero
             posts at all — otherwise, even
             a small number of posts should
             still loop endlessly on scroll.
          */

          noMorePostsAvailable =
          snapshot.docs.length ===
          0;

        }


        renderCommunityPosts();


        updateLoadMoreSentinel();


        scrollToSharedPost();

      },


      function(error){

        console.error(
          "Error loading community posts:",
          error
        );


        if(
          error.code ===
          "permission-denied"
        ){

          showErrorMessage(
            "Firebase permission denied access to community posts."
          );

          return;

        }


        if(
          error.code ===
          "failed-precondition"
        ){

          showErrorMessage(
            "Firebase requires an index before community posts can be displayed."
          );

          return;

        }


        if(
          error.code ===
          "unavailable"
        ){

          showErrorMessage(
            "The Community Wall is temporarily unavailable. Check your internet connection and try again."
          );

          return;

        }


        showErrorMessage(
          "Community posts could not be loaded. Please try again."
        );

      }

    );

  }catch(error){

    console.error(
      "Community feed setup error:",
      error
    );


    showErrorMessage(
      "The Community Wall could not be started."
    );

  }

}


/* =====================================================
   LOAD OLDER POSTS (CALLED WHEN THE USER
   SCROLLS NEAR THE BOTTOM OF THE FEED)

   This uses a one-time read (getDocs), not a
   live listener — older posts do not need to
   update in realtime, which keeps this fast
   and cheap on Firestore reads.
===================================================== */

async function loadMoreCommunityPosts(){

  if(
    isLoadingMorePosts ||
    noMorePostsAvailable
  ){

    return;

  }


  isLoadingMorePosts =
  true;


  loadMoreSentinel.textContent =
  "Loading more posts...";


  try{

    const postsReference =
    collection(
      db,
      "communityPosts"
    );


    /*
       If there is a known cursor, keep
       going deeper into the list. Once
       that cursor runs out (lastVisibleDocument
       is null), start again from the very
       newest post — this loop is what makes
       the feed scroll endlessly instead of
       stopping once everything has been shown.
    */

    const nextPageQuery =
    lastVisibleDocument

    ? query(
        postsReference,
        orderBy(
          "timestamp",
          "desc"
        ),
        startAfter(
          lastVisibleDocument
        ),
        limit(
          POSTS_PER_PAGE
        )
      )

    : query(
        postsReference,
        orderBy(
          "timestamp",
          "desc"
        ),
        limit(
          POSTS_PER_PAGE
        )
      );


    const snapshot =
    await getDocs(
      nextPageQuery
    );


    if(snapshot.empty){

      /*
         Only genuinely stop scrolling when
         there are zero posts in the whole
         community — otherwise this means we
         reached the end of the list, so loop
         back to the start on the next scroll.
      */

      if(
        latestPostsDocsCache.length === 0 &&
        olderPostsDocs.length === 0
      ){

        noMorePostsAvailable =
        true;

      }else{

        lastVisibleDocument =
        null;

      }


      updateLoadMoreSentinel();


      return;

    }


    olderPostsDocs =
    olderPostsDocs.concat(
      snapshot.docs
    );


    renderCommunityPosts();


    /*
       Fewer posts than a full page means we
       just reached the end — loop back to
       the start next time instead of stopping.
    */

    lastVisibleDocument =
    snapshot.docs.length <
    POSTS_PER_PAGE

    ? null

    : snapshot.docs[
        snapshot.docs.length - 1
      ];


  }catch(error){

    console.error(
      "Error loading more community posts:",
      error
    );


    loadMoreSentinel.textContent =
    "Could not load more posts. Scroll to try again.";


    isLoadingMorePosts =
    false;


    return;

  }


  isLoadingMorePosts =
  false;


  updateLoadMoreSentinel();

}


/* =====================================================
   UPDATE THE LOAD-MORE SENTINEL TEXT
===================================================== */

function updateLoadMoreSentinel(){

  if(noMorePostsAvailable){

    loadMoreSentinel.textContent =
    postsContainer.children.length >
    0
    ? ""
    : "Be the first to share something with the community 🙏";

  }else{

    loadMoreSentinel.textContent =
    "";

  }

}


/* =====================================================
   WATCH FOR THE SENTINEL SCROLLING INTO VIEW
   AND LOAD THE NEXT PAGE AUTOMATICALLY
===================================================== */

postsLoadObserver =
new IntersectionObserver(

  function(entries){

    entries.forEach(
      function(entry){

        if(
          entry.isIntersecting
        ){

          loadMoreCommunityPosts();

        }

      }
    );

  },

  {
    rootMargin:
    "300px"
  }

);


postsLoadObserver.observe(
  loadMoreSentinel
);
/* =====================================================
   PART 9 OF 10
   CREATE EACH COMMUNITY POST CARD
===================================================== */


/* =====================================================
   CREATE POST CARD
===================================================== */

function createPostCard(postData){

  const postCard =
  document.createElement("article");

  postCard.className =
  "postCard";

  postCard.id =
  `post-${postData.id}`;

  postCard.dataset.postId =
  postData.id;


  /* =================================================
     AUTHOR DETAILS
  ================================================= */

  const authorId =
  getFirstValue(
    postData.userId,
    postData.authorId,
    postData.uid
  );


  const authorName =
  getFirstValue(
    postData.name,
    postData.fullName,
    postData.displayName,
    "Community Member"
  );


  const authorPicture =
  getFirstValue(
    postData.picture,
    postData.profilePicture,
    postData.photoURL,
    postData.photoUrl,
    defaultProfilePicture
  );


  const authorCountry =
  getFirstValue(
    postData.country
  );


  const postDate =
  formatPostDate(
    postData.timestamp
  );


  /* =================================================
     POST CONTENT
  ================================================= */

  const postMessage =
  getFirstValue(
    postData.post,
    postData.message,
    postData.content,
    postData.text,
    postData.description
  );


  const postCategory =
  getFirstValue(
    postData.category,
    postData.postCategory,
    postData.type,
    "General"
  );


  /* =================================================
     MEDIA DETAILS
  ================================================= */

  const mediaType =
  getFirstValue(
    postData.mediaType
  ).toLowerCase();


  let imageUrl =
  "";

  let videoUrl =
  "";


  if(mediaType === "image"){

    imageUrl =
    getFirstValue(
      postData.imageUrl,
      postData.imageURL,
      postData.photoUrl,
      postData.photoURL,
      postData.postImage,
      postData.image,
      postData.mediaUrl
    );

  }else if(mediaType === "video"){

    videoUrl =
    getFirstValue(

/* =====================================================
   CREATE LIKE NOTIFICATION
===================================================== */

async function createLikeNotification(
  recipientId,
  postId
){

  if(
    !currentUser ||
    !recipientId ||
    !postId
  ){

    return;

  }


  /* Do not notify users about their own likes */

  if(
    recipientId ===
    currentUser.uid
  ){

    return;

  }


  const senderName =
  getFirstValue(
    currentProfile.fullName,
    currentProfile.name,
    currentUser.displayName,
    currentUser.email,
    "A community member"
  );


  try{

    await addDoc(
      collection(
        db,
        "notifications"
      ),
      {

        recipientId:
        recipientId,

        senderId:
        currentUser.uid,

        senderName:
        senderName,

        type:
        "like",

        postId:
        postId,

        targetUrl:
        `feed.html?post=${encodeURIComponent(postId)}`,

        message:
        `${senderName} liked your post.`,

        read:
        false,

        timestamp:
        serverTimestamp()

      }
    );

  }catch(error){

    console.error(
      "Error creating like notification:",
      error
    );

  }

}


/* =====================================================
   LIKE OR UNLIKE A POST
===================================================== */

async function handleLikeButton(
  button
){

  if(!currentUser){

    window.location.href =
    "login.html";

    return;

  }


  const postId =
  button.dataset.postId;


  const postAuthorId =
  button.dataset.authorId ||
  "";


  if(!postId){

    return;

  }


  let likes =
  [];


  try{

    const savedLikes =
    JSON.parse(
      button.dataset.likes ||
      "[]"
    );


    likes =
    Array.isArray(
      savedLikes
    )
    ? savedLikes
    : [];

  }catch(error){

    console.error(
      "Could not read post likes:",
      error
    );


    likes =
    [];

  }


  const currentUserId =
  currentUser.uid;


  const userAlreadyLiked =
  likes.includes(
    currentUserId
  );


  const updatedLikes =
  userAlreadyLiked

  ? likes.filter(
      function(userId){

        return (
          userId !==
          currentUserId
        );

      }
    )

  : [
      ...likes,
      currentUserId
    ];


  button.disabled =
  true;


  try{

    const postReference =
    doc(
      db,
      "communityPosts",
      postId
    );


    await updateDoc(
      postReference,
      {
        likes:
        updatedLikes
      }
    );


    button.dataset.likes =
    JSON.stringify(
      updatedLikes
    );


    button.classList.toggle(
      "liked",
      !userAlreadyLiked
    );


    const likeCount =
    button.querySelector(
      "span"
    );


    if(likeCount){

      likeCount.textContent =
      updatedLikes.length;

    }


    /* Create notification only
       when adding a like */

    if(!userAlreadyLiked){

      await createLikeNotification(
        postAuthorId,
        postId
      );

    }

  }catch(error){

    console.error(
      "Error updating likes:",
      error
    );


    alert(
      "The like could not be updated."
    );

  }finally{

    button.disabled =
    false;

  }

}

/* =====================================================
   SHARE A POST
===================================================== */

async function handleShareButton(
  button
){

  const postId =
  button.dataset.postId;


  if(!postId){

    return;

  }


  const postMessage =
  button.dataset.message ||
  "";


  const postUrl =
  `${window.location.origin}${window.location.pathname}?post=${encodeURIComponent(postId)}`;


  const shareText =
  postMessage

  ? `${postMessage}\n\nSABASABA Gospel Ministry`

  : "See this post on SABASABA Gospel Ministry.";


  try{

    if(
      navigator.share
    ){

      await navigator.share(
        {

          title:
          "SABASABA Gospel Ministry",

          text:
          shareText,

          url:
          postUrl

        }
      );


      return;

    }


    if(
      navigator.clipboard &&
      window.isSecureContext
    ){

      await navigator.clipboard.writeText(
        postUrl
      );


      alert(
        "Post link copied."
      );


      return;

    }


    window.prompt(
      "Copy this post link:",
      postUrl
    );

  }catch(error){

    if(
      error.name !==
      "AbortError"
    ){

      console.error(
        "Error sharing post:",
        error
      );


      alert(
        "The post could not be shared."
      );

    }

  }

}

  button
){

  if(!currentUser){

  const oldMessage =
  button.dataset.message ||

  const newMessage =

  const cleanedMessage =
  newMessage.trim();


  if(!cleanedMessage){

    alert(
      "The post cannot be empty."
    );

    return;

  button.disabled =

  try{

    const postReference =

      postReference,

    );


    alert(

    );

  }finally{

/* =====================================================
   REELS-STYLE VIDEO VIEWER

   Tap a video once and it opens full-screen.
   Scrolling down moves to the next video in the
   feed, which starts playing automatically with
   sound — no need to tap again, like Instagram
   Reels or TikTok.
===================================================== */

let reelScrollObserver =
null;


function collectFeedVideoUrls(){

  const videoElements =
  document.querySelectorAll(
    ".communityPostVideoWrapper video"
  );


  const videoUrls =
  [];


  videoElements.forEach(
    function(videoElement){

      if(
        videoElement.src &&
        !videoUrls.includes(
          videoElement.src
        )
      ){

        videoUrls.push(
          videoElement.src
        );

      }

    }
  );


  return videoUrls;

}


function openVideoReelViewer(
  startingVideoUrl
){

  const videoUrls =
  collectFeedVideoUrls();


  if(
    videoUrls.length === 0
  ){

    return;

  }


  videoReelTrack.innerHTML =
  "";


  videoUrls.forEach(
    function(videoUrl){

      const slide =
      document.createElement(
        "div"
      );

      slide.className =
      "videoReelSlide";


      const videoElement =
      document.createElement(
        "video"
      );

      videoElement.src =
      videoUrl;

      videoElement.controls =
      true;

      videoElement.loop =
      true;

      videoElement.playsInline =
      true;

      videoElement.preload =
      "metadata";

      videoElement.muted =
      false;


      slide.appendChild(
        videoElement
      );


      videoReelTrack.appendChild(
        slide
      );

    }
  );


  videoReelViewer.classList.add(
    "open"
  );


  videoReelViewer.setAttribute(
    "aria-hidden",
    "false"
  );


  document.body.style.overflow =
  "hidden";


  const startingIndex =
  Math.max(
    0,
    videoUrls.indexOf(
      startingVideoUrl
    )
  );


  const allSlides =
  videoReelTrack.querySelectorAll(
    ".videoReelSlide"
  );


  if(
    allSlides[startingIndex]
  ){

    allSlides[startingIndex].scrollIntoView(
      {
        behavior:
        "auto"
      }
    );

  }


  startReelAutoplayObserver();

}


function startReelAutoplayObserver(){

  if(
    reelScrollObserver
  ){

    reelScrollObserver.disconnect();

  }


  const allReelVideos =
  videoReelTrack.querySelectorAll(
    "video"
  );


  reelScrollObserver =
  new IntersectionObserver(

    function(entries){

      entries.forEach(
        function(entry){

          const video =
          entry.target;


          if(
            entry.isIntersecting &&
            entry.intersectionRatio >=
            0.6
          ){

            allReelVideos.forEach(
              function(otherVideo){

                if(
                  otherVideo !==
                  video
                ){

                  otherVideo.pause();

                }

              }
            );


            const playPromise =
            video.play();


            if(
              playPromise !==
              undefined
            ){

              playPromise.catch(
                function(){

                }
              );

            }

          }else{

            video.pause();

          }

        }
      );

    },

    {
      threshold:[
        0,
        0.6,
        1
      ]
    }

  );


  allReelVideos.forEach(
    function(videoElement){

      reelScrollObserver.observe(
        videoElement
      );

    }
  );

}


function closeVideoReelViewer(){

  if(
    reelScrollObserver
  ){

    reelScrollObserver.disconnect();

    reelScrollObserver =
    null;

  }


  videoReelTrack
  .querySelectorAll(
    "video"
  )
  .forEach(
    function(videoElement){

      videoElement.pause();

    }
  );


  videoReelViewer.classList.remove(
    "open"
  );


  videoReelViewer.setAttribute(
    "aria-hidden",
    "true"
  );


  videoReelTrack.innerHTML =
  "";


  document.body.style.overflow =
  "";

}

async function scrollToSharedPost(){

  const urlParameters =
  new URLSearchParams(
    window.location.search
  );


  const sharedPostId =
  urlParameters.get(
    "post"
  );


  if(!sharedPostId){

    return;

  }


  let sharedPost =
  document.getElementById(
    `post-${sharedPostId}`
  );


  /*
     The post is not in the currently loaded
     batch (pagination only loads the newest
     posts first) — fetch this one post
     directly and place it at the top of the
     feed so a notification link always
     reaches the exact post it points to.
  */

  if(!sharedPost){

    try{

      const postReference =
      doc(
        db,
        "communityPosts",
        sharedPostId
      );


      const postSnapshot =
      await getDoc(
        postReference
      );


      if(
        postSnapshot.exists()
      ){

        const postData = {

          id:
          postSnapshot.id,

          ...postSnapshot.data()

        };


        const postCard =
        createPostCard(
          postData
        );


        postsContainer.insertBefore(
          postCard,
          postsContainer.firstChild
        );


        sharedPost =
        postCard;

      }

    }catch(error){

      console.error(
        "Error loading shared post:",
        error
      );

    }

  }


  if(!sharedPost){

    return;

  }


  window.setTimeout(
    function(){

      sharedPost.scrollIntoView(
        {

          behavior:
          "smooth",

          block:
          "center"

        }
      );

    },
    150
  );

}

/* =====================================================
   AUTO-PLAY VISIBLE COMMUNITY VIDEOS
===================================================== */

let videoObserver =
null;


function startVideoAutoPlay(){

  if(videoObserver){

    videoObserver.disconnect();

  }


  const communityVideos =
  document.querySelectorAll(
    ".communityPostVideo"
  );


  if(
    !communityVideos.length
  ){

    return;

  }


  videoObserver =
  new IntersectionObserver(

    function(entries){

      entries.forEach(
        function(entry){

          const video =
          entry.target;


          if(
            entry.isIntersecting &&
            entry.intersectionRatio >=
            0.7
          ){

            communityVideos.forEach(
              function(otherVideo){

                if(
                  otherVideo !==
                  video
                ){

                  otherVideo.pause();

                }

              }
            );


            video.muted =
            true;


            const playPromise =
            video.play();


            if(
              playPromise !==
              undefined
            ){

              playPromise.catch(
                function(error){

                  console.log(
                    "Video autoplay was blocked:",
                    error
                  );

                }
              );

            }

          }else{

            video.pause();

          }

        }
      );

    },

    {
      threshold:[
        0,
        0.25,
        0.5,
        0.7,
        1
      ]
    }

  );


  communityVideos.forEach(
    function(video){

      video.muted =
      true;


      video.playsInline =
      true;


      videoObserver.observe(
        video
      );

    }
  );

}


/* =====================================================
   FAITH MOMENTS STRIP
   (Instagram/Facebook-style horizontal strip.
   Pulls active moments — those less than 24 hours
   old — from the same "faithMoments" collection
   used by faith-moments.html. Tapping a circle
   opens that moment in the full viewer there.)
===================================================== */

function isMomentStillActiveForStrip(
  momentData
){

  const rawTimestamp =
  momentData.timestamp ||
  momentData.createdAt;

  if(!rawTimestamp){

    return true;

  }

  let createdDate;

  if(
    typeof rawTimestamp.toDate ===
    "function"
  ){

    createdDate =
    rawTimestamp.toDate();

  }else if(
    rawTimestamp.seconds
  ){

    createdDate =
    new Date(
      rawTimestamp.seconds * 1000
    );

  }else{

    createdDate =
    new Date(
      rawTimestamp
    );

  }

  if(
    Number.isNaN(
      createdDate.getTime()
    )
  ){

    return true;

  }

  const twentyFourHours =
  24 * 60 * 60 * 1000;

  return (
    createdDate.getTime() +
    twentyFourHours
  ) > Date.now();

}


function getStripMomentTypeIcon(
  type
){

  const normalizedType =
  String(
    type || ""
  ).toLowerCase();

  const icons = {

    verse:"📖",
    prayer:"🙏",
    testimony:"💬",
    photo:"🖼️",
    video:"🎥"

  };

  return icons[normalizedType] || "✨";

}


function getStripInitials(
  name
){

  const cleanName =
  String(
    name || "Faith Member"
  ).trim();

  const words =
  cleanName
  .split(/\s+/)
  .filter(Boolean);

  if(words.length === 0){

    return "F";

  }

  return words
  .slice(0,2)
  .map(
    function(word){

      return word.charAt(0).toUpperCase();

    }
  )
  .join("");

}


function renderMomentsStrip(
  momentsSnapshot
){

  momentsRow
  .querySelectorAll(
    ".memberMomentCircle"
  )
  .forEach(
    function(element){

      element.remove();

    }
  );


  const momentsByUser =
  new Map();


  momentsSnapshot.forEach(
    function(momentDoc){

      const momentData =
      momentDoc.data();


      if(
        !isMomentStillActiveForStrip(
          momentData
        )
      ){

        return;

      }


      const privacy =
      String(
        momentData.privacy ||
        "everyone"
      ).toLowerCase();


      const momentUserId =
      momentData.userId ||
      momentData.authorId ||
      momentData.uid ||
      "";


      const isOwnMoment =
      Boolean(
        currentUser &&
        momentUserId === currentUser.uid
      );


      if(
        privacy !== "everyone" &&
        !isOwnMoment
      ){

        return;

      }


      if(
        !momentUserId ||
        momentsByUser.has(momentUserId)
      ){

        return;

      }


      momentsByUser.set(
        momentUserId,
        {
          id:momentDoc.id,
          ...momentData
        }
      );

    }
  );


  momentsByUser.forEach(
    function(momentData){

      const name =
      getFirstValue(
        momentData.name,
        momentData.fullName,
        momentData.displayName,
        "Faith Connect Member"
      );


      const picture =
      getFirstValue(
        momentData.profilePicture,
        momentData.picture,
        momentData.photoURL
      );


      const typeIcon =
      getStripMomentTypeIcon(
        momentData.type ||
        momentData.momentType
      );


      const circleLink =
      document.createElement(
        "a"
      );


      circleLink.href =
      `faith-moments.html?moment=${encodeURIComponent(
        momentData.id
      )}`;


      circleLink.className =
      "momentCircleButton memberMomentCircle";


      circleLink.innerHTML = `

        <div class="momentAvatarOuter">

          <div class="momentAvatarInner">

            ${
              picture
              ? `<img src="${picture}" alt="${name}">`
              : getStripInitials(name)
            }

          </div>

          <span class="momentTypeBadge">
            ${typeIcon}
          </span>

        </div>

        <span class="momentName">
          ${name}
        </span>

      `;


      momentsRow.appendChild(
        circleLink
      );

    }
  );

}


function stopMomentsStripListener(){

  if(
    typeof unsubscribeMomentsStrip ===
    "function"
  ){

    unsubscribeMomentsStrip();

  }

  unsubscribeMomentsStrip =
  null;

}


function startMomentsStripListener(){

  stopMomentsStripListener();


  const momentsQuery =
  query(
    collection(
      db,
      "faithMoments"
    ),
    orderBy(
      "timestamp",
      "desc"
    ),
    limit(30)
  );


  unsubscribeMomentsStrip =
  onSnapshot(

    momentsQuery,

    function(snapshot){

      renderMomentsStrip(
        snapshot
      );

    },

    function(error){

      console.error(
        "Faith Moments strip error:",
        error
      );

    }

  );

}
