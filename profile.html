<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>My Profile | SABASABA Gospel Ministry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
}

.container{
max-width:850px;
margin:25px auto;
padding:20px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.header{
background:linear-gradient(135deg,#0066cc,#004d99);
padding:35px;
text-align:center;
color:white;
}

.header h1{
font-size:32px;
margin-bottom:8px;
}

.content{
padding:30px;
}

.photoBox{
text-align:center;
margin-bottom:25px;
}

.photoBox img{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
border:5px solid #0066cc;
background:#ddd;
}

.photoBox input{
margin-top:15px;
}

.group{
margin-bottom:20px;
}

.group label{
display:block;
margin-bottom:8px;
font-weight:bold;
color:#0066cc;
}

.group input,
.group textarea{

width:100%;
padding:14px;
font-size:16px;
border:1px solid #ccc;
border-radius:10px;
outline:none;

}

.group textarea{
height:140px;
resize:none;
}

.saveBtn{
width:100%;
padding:16px;
border:none;
border-radius:10px;
background:#0066cc;
color:white;
font-size:18px;
cursor:pointer;
}

.saveBtn:hover{
background:#004d99;
}

.backBtn{
width:100%;
padding:16px;
margin-top:15px;
border:none;
border-radius:10px;
background:#666;
color:white;
font-size:17px;
cursor:pointer;
}

.backBtn:hover{
background:#555;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="header">

<h1>👤 My Profile</h1>

<p>Edit your personal information</p>

</div>

<div class="content">

<div class="photoBox">

<img
id="profileImage"
src="images/profile.png">

<br>

<input
id="profileFile"
type="file"
accept="image/*">

</div>

<div class="group">

<label>Full Name</label>

<input
id="fullName"
type="text">

</div>

<div class="group">

<label>Country</label>

<input
id="country"
type="text"
placeholder="Example: Tanzania">

</div>

<div class="group">

<label>Email</label>

<input
id="email"
type="email"
readonly>

</div>

<div class="group">

<label>About Me</label>

<textarea
id="about"
placeholder="Tell other believers about yourself..."></textarea>

</div>

<button
id="saveBtn"
class="saveBtn"
type="button">

💾 Save Changes

</button>

<button
class="backBtn"
onclick="location.href='community.html'">

⬅ Back to Community

</button>

</div>

</div>

</div>

<script type="module">

import{
  auth,
  db,
  doc,
  getDoc,
  setDoc,
  onAuthStateChanged
}from "./firebase.js";


/* ========================================
   CLOUDINARY SETTINGS
======================================== */

const cloudName =
"glq2nymz";

const uploadPreset =
"sabasaba_community";


/* ========================================
   PAGE ELEMENTS
======================================== */

const profileImage =
document.getElementById("profileImage");

const profileFile =
document.getElementById("profileFile");

const fullName =
document.getElementById("fullName");

const country =
document.getElementById("country");

const email =
document.getElementById("email");

const about =
document.getElementById("about");

const saveBtn =
document.getElementById("saveBtn");


/* ========================================
   PAGE STATE
======================================== */

let currentUser = null;

let currentPhotoURL =
"images/profile.png";

let previewURL = null;

let isSaving = false;


/* ========================================
   LOAD CURRENT PROFILE
======================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.href =
      "login.html";

      return;

    }


    currentUser = user;

    email.value =
    user.email || "";


    try{

      const profileReference =
      doc(
        db,
        "users",
        user.uid
      );

      const profileSnapshot =
      await getDoc(
        profileReference
      );


      if(profileSnapshot.exists()){

        const data =
        profileSnapshot.data();


        fullName.value =
        data.fullName ||
        data.name ||
        data.displayName ||
        user.displayName ||
        "";


        country.value =
        data.country ||
        data.location ||
        "";


        about.value =
        data.about ||
        data.bio ||
        "";


        currentPhotoURL =
        data.profilePicture ||
        data.picture ||
        data.photoURL ||
        user.photoURL ||
        "images/profile.png";


        profileImage.src =
        currentPhotoURL;

      }else{

        fullName.value =
        user.displayName || "";

        currentPhotoURL =
        user.photoURL ||
        "images/profile.png";

        profileImage.src =
        currentPhotoURL;

      }


      saveBtn.disabled = false;

    }catch(error){

      console.error(
        "Profile loading error:",
        error
      );

      alert(
        "Unable to load your profile: " +
        (error.message || "Unknown error")
      );

    }

  }
);


/* ========================================
   PREVIEW SELECTED PICTURE
======================================== */

profileFile.addEventListener(
  "change",
  () => {

    const file =
    profileFile.files?.[0];


    if(!file){
      return;
    }


    if(
      !file.type.startsWith("image/")
    ){

      alert(
        "Please choose a valid image file."
      );

      profileFile.value = "";
      return;

    }


    const maximumSize =
    5 * 1024 * 1024;


    if(file.size > maximumSize){

      alert(
        "The picture is too large. Please choose an image smaller than 5 MB."
      );

      profileFile.value = "";
      return;

    }


    if(previewURL){

      URL.revokeObjectURL(
        previewURL
      );

    }


    previewURL =
    URL.createObjectURL(file);

    profileImage.src =
    previewURL;

  }
);


/* ========================================
   UPLOAD PROFILE PICTURE TO CLOUDINARY
======================================== */

function uploadProfilePicture(file){

  return new Promise(
    (resolve,reject) => {

      const uploadURL =
      `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`;


      const formData =
      new FormData();


      formData.append(
        "file",
        file
      );


      formData.append(
        "upload_preset",
        uploadPreset
      );


      formData.append(
        "folder",
        "sabasaba/profile-pictures"
      );


      const request =
      new XMLHttpRequest();


      request.open(
        "POST",
        uploadURL,
        true
      );


      request.upload.addEventListener(
        "progress",
        event => {

          if(!event.lengthComputable){
            return;
          }


          const progress =
          Math.round(
            (
              event.loaded /
              event.total
            ) * 100
          );


          saveBtn.textContent =
          `Uploading picture... ${progress}%`;

        }
      );


      request.addEventListener(
        "load",
        () => {

          try{

            const response =
            JSON.parse(
              request.responseText || "{}"
            );


            if(
              request.status < 200 ||
              request.status >= 300 ||
              !response.secure_url
            ){

              const cloudinaryError =
              response?.error?.message ||
              "Cloudinary could not upload the profile picture.";


              reject(
                new Error(
                  cloudinaryError
                )
              );

              return;

            }


            resolve(
              response.secure_url
            );

          }catch(error){

            reject(
              new Error(
                "Cloudinary returned an invalid response."
              )
            );

          }

        }
      );


      request.addEventListener(
        "error",
        () => {

          reject(
            new Error(
              "The picture upload failed because of a network problem."
            )
          );

        }
      );


      request.addEventListener(
        "abort",
        () => {

          reject(
            new Error(
              "The picture upload was cancelled."
            )
          );

        }
      );


      request.send(
        formData
      );

    }
  );

}


/* ========================================
   SAVE PROFILE
======================================== */

saveBtn.addEventListener(
  "click",
  async () => {

    if(isSaving){
      return;
    }


    if(!currentUser){

      alert(
        "Please wait while your account loads."
      );

      return;

    }


    const enteredName =
    fullName.value.trim();


    if(!enteredName){

      alert(
        "Please enter your full name."
      );

      fullName.focus();
      return;

    }


    isSaving = true;

    saveBtn.disabled = true;

    saveBtn.textContent =
    "Saving...";


    try{

      let photoURL =
      currentPhotoURL;


      const selectedFile =
      profileFile.files?.[0];


      if(selectedFile){

        photoURL =
        await uploadProfilePicture(
          selectedFile
        );

      }


      saveBtn.textContent =
      "Updating profile...";


      await setDoc(

        doc(
          db,
          "users",
          currentUser.uid
        ),

        {

          uid:
          currentUser.uid,

          fullName:
          enteredName,

          name:
          enteredName,

          displayName:
          enteredName,

          country:
          country.value.trim(),

          about:
          about.value.trim(),

          bio:
          about.value.trim(),

          email:
          currentUser.email ||
          email.value.trim(),

          profilePicture:
          photoURL,

          picture:
          photoURL,

          photoURL:
          photoURL

        },

        {
          merge:true
        }

      );


      currentPhotoURL =
      photoURL;

      profileImage.src =
      photoURL;

      profileFile.value = "";


      if(previewURL){

        URL.revokeObjectURL(
          previewURL
        );

        previewURL = null;

      }


      alert(
        "✅ Profile updated successfully!"
      );

    }catch(error){

      console.error(
        "Profile saving error:",
        error
      );


      alert(
        getFriendlyErrorMessage(
          error
        )
      );

    }finally{

      isSaving = false;

      saveBtn.disabled =
      !currentUser;

      saveBtn.textContent =
      "💾 Save Changes";

    }

  }
);


/* ========================================
   FRIENDLY ERROR MESSAGES
======================================== */

function getFriendlyErrorMessage(error){

  const errorCode =
  String(
    error?.code || ""
  ).toLowerCase();


  const errorMessage =
  String(
    error?.message || ""
  );


  const lowerMessage =
  errorMessage.toLowerCase();


  if(
    errorCode.includes(
      "permission-denied"
    )
  ){

    return "Firestore denied permission to update your profile.";

  }


  if(
    lowerMessage.includes(
      "upload preset"
    )
  ){

    return "The Cloudinary upload preset is incorrect or is not set to unsigned.";

  }


  if(
    lowerMessage.includes(
      "too large"
    ) ||
    lowerMessage.includes(
      "file size"
    )
  ){

    return "Cloudinary rejected the picture because it is too large.";

  }


  if(
    lowerMessage.includes(
      "network"
    )
  ){

    return "A network error occurred. Check your internet connection and try again.";

  }


  return errorMessage ||
  "The profile could not be saved.";

}


/* ========================================
   CLEAN UP PREVIEW
======================================== */

window.addEventListener(
  "pagehide",
  () => {

    if(previewURL){

      URL.revokeObjectURL(
        previewURL
      );

    }

  }
);

</script>
</body>

</html>
