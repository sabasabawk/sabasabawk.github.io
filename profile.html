<script type="module">

import{
  auth,
  db,
  doc,
  getDoc,
  setDoc,
  deleteDoc,
  collection,
  query,
  where,
  getDocs,
  serverTimestamp,
  onAuthStateChanged
}from "./firebase.js";

import{
  deleteUser,
  reauthenticateWithCredential,
  EmailAuthProvider
}from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* ========================================
   IMAGEKIT SETTINGS
   (replaces the old Cloudinary settings —
   Cloudinary's free credit limit was
   exceeded and the account was scheduled
   for deactivation, which is why profile
   picture uploads stopped working)
======================================== */

const imagekitPublicKey =
"public_RMynf3IEhbVAkjTfzqWnp5moKCY=";

const imagekitAuthEndpoint =
"https://sabasabawk-github-io.vercel.app/api/imagekit-auth";

const imagekitUploadUrl =
"https://upload.imagekit.io/api/v1/files/upload";


/* ========================================
   PAGE ELEMENTS
======================================== */

const statusBanner =
document.getElementById("statusBanner");

const profileImage =
document.getElementById("profileImage");

const profileFile =
document.getElementById("profileFile");

const fullName =
document.getElementById("fullName");

const country =
document.getElementById("country");

const email =
document.getElementById("email");

const about =
document.getElementById("about");

const saveBtn =
document.getElementById("saveBtn");


/* ========================================
   PAGE STATE
======================================== */

let currentUser = null;

let currentPhotoURL =
"images/profile.png";

let previewURL = null;

let isSaving = false;


/* ========================================
   STATUS BANNER HELPERS
======================================== */

function showLoadingStatus(message){

  statusBanner.className =
  "statusBanner show loading";

  statusBanner.innerHTML =
  message;

}


function showErrorStatus(message){

  statusBanner.className =
  "statusBanner show error";

  statusBanner.innerHTML = "";


  const text =
  document.createElement("span");

  text.textContent =
  message;


  const retryButton =
  document.createElement("button");

  retryButton.type =
  "button";

  retryButton.textContent =
  "Retry";

  retryButton.addEventListener(
    "click",
    () => {

      if(currentUser){

        loadProfile(
          currentUser
        );

      }

    }
  );


  statusBanner.appendChild(
    text
  );

  statusBanner.appendChild(
    retryButton
  );

}


function hideStatus(){

  statusBanner.className =
  "statusBanner";

  statusBanner.innerHTML =
  "";

}


/* ========================================
   SMALL DELAY HELPER
======================================== */

function wait(milliseconds){

  return new Promise(
    resolve =>
    window.setTimeout(
      resolve,
      milliseconds
    )
  );

}


/* ========================================
   LOAD PROFILE, WITH AUTOMATIC RETRIES

   Firestore can briefly report the client
   as "offline" right after a page load on a
   slow or unstable connection. Instead of
   failing immediately, this retries a few
   times with a short pause before showing
   any error to the user.
======================================== */

const MAX_LOAD_ATTEMPTS =
4;


async function loadProfile(user){

  saveBtn.disabled = true;


  for(
    let attempt = 1;
    attempt <= MAX_LOAD_ATTEMPTS;
    attempt++
  ){

    if(attempt === 1){

      showLoadingStatus(
        "Loading your profile..."
      );

    }else{

      showLoadingStatus(
        `Connection is slow, retrying (${attempt}/${MAX_LOAD_ATTEMPTS})...`
      );

    }


    try{

      const profileReference =
      doc(
        db,
        "users",
        user.uid
      );

      const profileSnapshot =
      await getDoc(
        profileReference
      );


      if(profileSnapshot.exists()){

        const data =
        profileSnapshot.data();


        fullName.value =
        data.fullName ||
        data.name ||
        data.displayName ||
        user.displayName ||
        "";


        country.value =
        data.country ||
        data.location ||
        "";


        about.value =
        data.about ||
        data.bio ||
        "";


        currentPhotoURL =
        data.profilePicture ||
        data.picture ||
        data.photoURL ||
        user.photoURL ||
        "images/profile.png";


        profileImage.src =
        currentPhotoURL;

      }else{

        fullName.value =
        user.displayName || "";

        currentPhotoURL =
        user.photoURL ||
        "images/profile.png";

        profileImage.src =
        currentPhotoURL;

      }


      hideStatus();

      saveBtn.disabled = false;


      return;


    }catch(error){

      console.error(
        `Profile loading error (attempt ${attempt}):`,
        error
      );


      const isOfflineError =
      String(
        error?.message || ""
      ).toLowerCase().includes(
        "offline"
      ) ||
      String(
        error?.code || ""
      ).toLowerCase().includes(
        "unavailable"
      );


      const isLastAttempt =
      attempt === MAX_LOAD_ATTEMPTS;


      if(
        !isOfflineError ||
        isLastAttempt
      ){

        email.value =
        user.email || "";


        showErrorStatus(
          isOfflineError

          ? "Your connection seems weak right now, so your profile could not be loaded. Check your signal or WiFi and tap Retry."

          : getFriendlyErrorMessage(
              error
            )

        );


        saveBtn.disabled =
        false;


        return;

      }


      await wait(
        1200 * attempt
      );

    }

  }

}


/* ========================================
   AUTH STATE
======================================== */

onAuthStateChanged(
  auth,
  user => {

    if(!user){

      window.location.href =
      "login.html";

      return;

    }


    currentUser = user;

    email.value =
    user.email || "";


    loadProfile(
      user
    );

  }
);


/* ========================================
   PREVIEW SELECTED PICTURE
======================================== */

profileFile.addEventListener(
  "change",
  () => {

    const file =
    profileFile.files?.[0];


    if(!file){
      return;
    }


    if(
      !file.type.startsWith("image/")
    ){

      alert(
        "Please choose a valid image file."
      );

      profileFile.value = "";
      return;

    }


    const maximumSize =
    5 * 1024 * 1024;


    if(file.size > maximumSize){

      alert(
        "The picture is too large. Please choose an image smaller than 5 MB."
      );

      profileFile.value = "";
      return;

    }


    if(previewURL){

      URL.revokeObjectURL(
        previewURL
      );

    }


    previewURL =
    URL.createObjectURL(file);

    profileImage.src =
    previewURL;

  }
);


/* ========================================
   GET IMAGEKIT UPLOAD AUTHENTICATION
======================================== */

async function getImagekitAuthParameters(){

  const response =
  await fetch(
    imagekitAuthEndpoint
  );


  if(!response.ok){

    throw new Error(
      "Could not authenticate the picture upload. Please try again."
    );

  }


  return response.json();

}


/* ========================================
   UPLOAD PROFILE PICTURE TO IMAGEKIT
======================================== */

async function uploadProfilePicture(file){

  const authParameters =
  await getImagekitAuthParameters();


  return new Promise(
    (resolve,reject) => {

      const formData =
      new FormData();


      formData.append(
        "file",
        file
      );


      formData.append(
        "fileName",
        file.name
      );


      formData.append(
        "publicKey",
        imagekitPublicKey
      );


      formData.append(
        "signature",
        authParameters.signature
      );


      formData.append(
        "expire",
        authParameters.expire
      );


      formData.append(
        "token",
        authParameters.token
      );


      formData.append(
        "folder",
        "/sabasaba-community/profile-pictures"
      );


      const request =
      new XMLHttpRequest();


      request.open(
        "POST",
        imagekitUploadUrl,
        true
      );


      request.upload.addEventListener(
        "progress",
        event => {

          if(!event.lengthComputable){
            return;
          }


          const progress =
          Math.round(
            (
              event.loaded /
              event.total
            ) * 100
          );


          saveBtn.textContent =
          `Uploading picture... ${progress}%`;

        }
      );


      request.addEventListener(
        "load",
        () => {

          try{

            const response =
            JSON.parse(
              request.responseText || "{}"
            );


            if(
              request.status < 200 ||
              request.status >= 300 ||
              !response.url
            ){

              const imagekitError =
              response?.message ||
              "ImageKit could not upload the profile picture.";


              reject(
                new Error(
                  imagekitError
                )
              );

              return;

            }


            resolve(
              response.url
            );

          }catch(error){

            reject(
              new Error(
                "ImageKit returned an invalid response."
              )
            );

          }

        }
      );


      request.addEventListener(
        "error",
        () => {

          reject(
            new Error(
              "The picture upload failed because of a network problem."
            )
          );

        }
      );


      request.addEventListener(
        "abort",
        () => {

          reject(
            new Error(
              "The picture upload was cancelled."
            )
          );

        }
      );


      request.send(
        formData
      );

    }
  );

}


/* ========================================
   SAVE PROFILE
======================================== */

saveBtn.addEventListener(
  "click",
  async () => {

    if(isSaving){
      return;
    }


    if(!currentUser){

      alert(
        "Please wait while your account loads."
      );

      return;

    }


    const enteredName =
    fullName.value.trim();


    if(!enteredName){

      alert(
        "Please enter your full name."
      );

      fullName.focus();
      return;

    }


    isSaving = true;

    saveBtn.disabled = true;

    saveBtn.textContent =
    "Saving...";


    try{

      let photoURL =
      currentPhotoURL;


      const selectedFile =
      profileFile.files?.[0];


      if(selectedFile){

        photoURL =
        await uploadProfilePicture(
          selectedFile
        );

      }


      saveBtn.textContent =
      "Updating profile...";


      await setDoc(

        doc(
          db,
          "users",
          currentUser.uid
        ),

        {

          uid:
          currentUser.uid,

          fullName:
          enteredName,

          name:
          enteredName,

          displayName:
          enteredName,

          country:
          country.value.trim(),

          about:
          about.value.trim(),

          bio:
          about.value.trim(),

          email:
          currentUser.email ||
          email.value.trim(),

          profilePicture:
          photoURL,

          picture:
          photoURL,

          photoURL:
          photoURL

        },

        {
          merge:true
        }

      );


      currentPhotoURL =
      photoURL;

      profileImage.src =
      photoURL;

      profileFile.value = "";


      if(previewURL){

        URL.revokeObjectURL(
          previewURL
        );

        previewURL = null;

      }


      alert(
        "✅ Profile updated successfully!"
      );

    }catch(error){

      console.error(
        "Profile saving error:",
        error
      );


      alert(
        getFriendlyErrorMessage(
          error
        )
      );

    }finally{

      isSaving = false;

      saveBtn.disabled =
      !currentUser;

      saveBtn.textContent =
      "💾 Save Changes";

    }

  }
);


/* ========================================
   FRIENDLY ERROR MESSAGES
======================================== */

function getFriendlyErrorMessage(error){

  const errorCode =
  String(
    error?.code || ""
  ).toLowerCase();


  const errorMessage =
  String(
    error?.message || ""
  );


  const lowerMessage =
  errorMessage.toLowerCase();


  if(
    errorCode.includes(
      "permission-denied"
    )
  ){

    return "Firestore denied permission to update your profile.";

  }


  if(
    lowerMessage.includes(
      "authenticate"
    )
  ){

    return "The picture upload could not be authenticated. Please try again in a moment.";

  }


  if(
    lowerMessage.includes(
      "too large"
    ) ||
    lowerMessage.includes(
      "file size"
    )
  ){

    return "ImageKit rejected the picture because it is too large.";

  }


  if(
    lowerMessage.includes(
      "network"
    ) ||
    lowerMessage.includes(
      "offline"
    )
  ){

    return "A network error occurred. Check your internet connection and try again.";

  }


  return errorMessage ||
  "The profile could not be saved.";

}


/* ========================================
   DELETE MY ACCOUNT
======================================== */

const deleteAccountBtn =
document.getElementById("deleteAccountBtn");

const deleteModal =
document.getElementById("deleteModal");

const deletePassword =
document.getElementById("deletePassword");

const deleteStatus =
document.getElementById("deleteStatus");

const deleteCancelBtn =
document.getElementById("deleteCancelBtn");

const deleteConfirmBtn =
document.getElementById("deleteConfirmBtn");

let isDeleting = false;


/*
   Content created by the member that is
   removed together with the account.
   [collection name, field holding the user id]
*/

const CONTENT_TO_DELETE = [
  ["communityPosts","userId"],
  ["communityPosts","authorId"],
  ["communityPosts","uid"],
  ["comments","userId"],
  ["comments","authorId"],
  ["faithMoments","userId"],
  ["faithMoments","authorId"],
  ["prayerRequests","userId"],
  ["prayerRequests","authorId"],
  ["notifications","recipientId"]
];


function openDeleteModal(){

  deletePassword.value = "";

  deleteStatus.textContent = "";

  deleteModal.classList.add("open");

  deletePassword.focus();

}


function closeDeleteModal(){

  if(isDeleting){
    return;
  }

  deleteModal.classList.remove("open");

}


function setDeleteBusy(busy){

  isDeleting = busy;

  deleteConfirmBtn.disabled = busy;

  deleteCancelBtn.disabled = busy;

  deletePassword.disabled = busy;

}


async function deleteDocumentsWhere(
  collectionName,
  fieldName,
  userId
){

  try{

    const snapshot =
    await getDocs(
      query(
        collection(
          db,
          collectionName
        ),
        where(
          fieldName,
          "==",
          userId
        )
      )
    );

    for(const documentSnapshot of snapshot.docs){

      try{

        await deleteDoc(
          documentSnapshot.ref
        );

      }catch(error){

        console.warn(
          `Could not delete ${collectionName}/${documentSnapshot.id}:`,
          error
        );

      }

    }

  }catch(error){

    console.warn(
      `Could not search ${collectionName}.${fieldName}:`,
      error
    );

  }

}


function getDeleteErrorMessage(error){

  const code =
  String(error?.code || "").toLowerCase();

  if(
    code.includes("wrong-password") ||
    code.includes("invalid-credential") ||
    code.includes("invalid-login")
  ){

    return "That password is not correct.";

  }

  if(code.includes("too-many-requests")){

    return "Too many attempts. Please wait a few minutes and try again.";

  }

  if(code.includes("network")){

    return "Network problem. Check your connection and try again.";

  }

  return "Something went wrong. Please try again.";

}


deleteAccountBtn.addEventListener(
  "click",
  openDeleteModal
);


deleteCancelBtn.addEventListener(
  "click",
  closeDeleteModal
);


deleteModal.addEventListener(
  "click",
  event => {

    if(event.target === deleteModal){

      closeDeleteModal();

    }

  }
);


deleteConfirmBtn.addEventListener(
  "click",
  async () => {

    if(isDeleting){
      return;
    }

    const user =
    auth.currentUser;

    if(!user || !user.email){

      deleteStatus.textContent =
      "Please sign in again, then try once more.";

      return;

    }

    const password =
    deletePassword.value;

    if(!password){

      deleteStatus.textContent =
      "Please enter your password.";

      return;

    }

    setDeleteBusy(true);


    /* 1. Confirm the password */

    try{

      deleteStatus.textContent =
      "Checking your password...";

      await reauthenticateWithCredential(
        user,
        EmailAuthProvider.credential(
          user.email,
          password
        )
      );

    }catch(error){

      console.error(
        "Re-authentication failed:",
        error
      );

      deleteStatus.textContent =
      getDeleteErrorMessage(error);

      setDeleteBusy(false);

      return;

    }


    try{

      /* 2. Delete the member's content */

      deleteStatus.textContent =
      "Deleting your posts and content...";

      for(const [collectionName,fieldName] of CONTENT_TO_DELETE){

        await deleteDocumentsWhere(
          collectionName,
          fieldName,
          user.uid
        );

      }


      /* 3. Delete (or, if rules forbid it, erase)
            the profile document */

      deleteStatus.textContent =
      "Deleting your profile...";

      const profileReference =
      doc(
        db,
        "users",
        user.uid
      );

      try{

        await deleteDoc(
          profileReference
        );

      }catch(error){

        console.warn(
          "Profile could not be deleted, erasing its details instead:",
          error
        );

        await setDoc(
          profileReference,
          {
            fullName:"Deleted Member",
            name:"Deleted Member",
            displayName:"Deleted Member",
            country:"",
            about:"",
            bio:"",
            email:"",
            profilePicture:"",
            picture:"",
            photoURL:"",
            deleted:true,
            deletedAt:serverTimestamp()
          },
          {
            merge:true
          }
        );

      }


      /* 4. Delete the sign-in account itself */

      deleteStatus.textContent =
      "Deleting your account...";

      await deleteUser(
        user
      );

      alert(
        "Your account has been deleted."
      );

      window.location.href =
      "login.html";

    }catch(error){

      console.error(
        "Account deletion error:",
        error
      );

      deleteStatus.textContent =
      "Your account could not be fully deleted. Please try again, or email sabasabawk@gmail.com for help.";

      setDeleteBusy(false);

    }

  }
);


/* ========================================
   CLEAN UP PREVIEW
======================================== */

window.addEventListener(
  "pagehide",
  () => {

    if(previewURL){

      URL.revokeObjectURL(
        previewURL
      );

    }

  }
);

</script>

          .then((registration) => {

          })
          .catch((error) => {
