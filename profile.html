.group input,

font-size:16px;

.backBtn:hover{

</head>

<button

  }

      fullName.value =

      country.value =
      data.country || "";

      about.value =
      data.about || "";

      currentPhotoURL =
      data.profilePicture ||
      user.photoURL ||
      "images/profile.png";

      profileImage.src =
      currentPhotoURL;

    }

  }catch(error){

    console.error(
      "Profile loading error:",
      error
    );

    alert(
      "Unable to load your profile: " +
      error.message
    );

  }

  profileImage.src =
  previewURL;

</html>
