<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<style>

body{
font-family:Arial,sans-serif;
background:#eef3f8;
margin:0;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
background:white;
border-radius:20px;
padding:30px;
box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.profile{
text-align:center;
}

.avatar{
font-size:100px;
margin-bottom:15px;
}

h1{
color:#0066cc;
margin-bottom:5px;
}

.email{
color:gray;
font-size:18px;
margin-bottom:20px;
}

.section{
background:#f4f8fc;
padding:20px;
border-radius:12px;
margin-top:20px;
}

.section h2{
color:#0066cc;
margin-top:0;
}

.stat-box{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
margin-top:20px;
}

.stat{
background:#0066cc;
color:white;
padding:20px;
border-radius:12px;
width:45%;
margin-bottom:15px;
text-align:center;
}

.stat h3{
font-size:30px;
margin:0;
}

button{
background:#0066cc;
color:white;
border:none;
padding:12px 22px;
border-radius:8px;
cursor:pointer;
font-size:17px;
margin-top:20px;
}

button:hover{
background:#004d99;
}

.back{
text-align:center;
margin-top:30px;
}

.back a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<div class="profile">

<img id="profileImage"
src="images/profile.png"
style="width:150px;height:150px;border-radius:50%;border:4px solid #0066cc;object-fit:cover;">


<h1 id="userName">Guest User</h1>
<div class="email" id="userEmail">
guest@sabasabawk.github.io
</div>
<br>

<input
type="file"
id="imageUpload"
accept="image/*">
<a href="editprofile.html">
<button>
📝 Edit Profile
</button>
</a>

</div>

<div class="section">

<h2>📖 Favorite Bible Verse</h2>

<p id="favoriteVerse">

"I can do all things through Christ which strengtheneth me."

</p>

</div>

<div class="section">

<h2>🙏 Personal Testimony</h2>

<p id="testimonyText">

Share your testimony here to encourage other believers.

</p>

</div>

<div class="stat-box">

<div class="stat">

<h3>0</h3>

Posts

</div>

<div class="stat">

<h3>0</h3>

Likes

</div>

<div class="stat">

<h3>0</h3>

Comments

</div>

<div class="stat">

<h3>0</h3>

Certificates

</div>

</div>

<div class="section">

<h2>📚 Courses Completed</h2>

<ul>

<li>None yet</li>

</ul>

</div>

<div class="back">

<a href="community.html">

<button>⬅ Back to Community</button>

</a>

</div>

</div>
<script type="module">
const upload = document.getElementById("imageUpload");
const profileImage = document.getElementById("profileImage");

// Load saved image
const savedImage = localStorage.getItem("profileImage");

if(savedImage){
profileImage.src = savedImage;
}

upload.addEventListener("change", function(){

const file = this.files[0];

if(file){

const reader = new FileReader();

reader.onload = function(e){

profileImage.src = e.target.result;

localStorage.setItem("profileImage", e.target.result);

};

reader.readAsDataURL(file);

}

});
// Load saved profile

let savedName = localStorage.getItem("userName");
let savedEmail = localStorage.getItem("userEmail");

if(savedName){
document.getElementById("userName").innerText = savedName;
}

if(savedEmail){
document.getElementById("userEmail").innerText = savedEmail;
}

// Edit profile

function editProfile(){

let name = prompt(
"Enter your full name:",
document.getElementById("userName").innerText
);

if(name==null) return;

let email = prompt(
"Enter your email:",
document.getElementById("userEmail").innerText
);

if(email==null) return;

document.getElementById("userName").innerText = name;

document.getElementById("userEmail").innerText = email;

localStorage.setItem("userName",name);

localStorage.setItem("userEmail",email);

alert("✅ Profile updated successfully!");

}
</script>
<script>

let loggedIn = localStorage.getItem("loggedIn");

if(loggedIn!="true"){

alert("Please login first.");

window.location.href="login.html";

}

let name = localStorage.getItem("userName");
let email = localStorage.getItem("userEmail");

if(name){
document.getElementById("userName").innerText = name;
}

if(email){
document.getElementById("userEmail").innerText = email;
}
// Favorite Bible Verse
let verse = localStorage.getItem("favoriteVerse");

if(verse){
document.getElementById("favoriteVerse").innerText = verse;
}

// Personal Testimony
let testimony = localStorage.getItem("testimony");

if(testimony){
document.getElementById("testimonyText").innerText = testimony;
}
let picture =
localStorage.getItem("profilePicture");

if(picture){
document.getElementById("profileImage").src =
picture;
}
</script>
</body>
</html>
