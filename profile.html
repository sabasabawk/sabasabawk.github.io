head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Profile | SABASABA Gospel Ministry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
}

.container{

max-width:850px;
margin:30px auto;
padding:20px;

}

.card{

background:white;
border-radius:20px;
box-shadow:0 4px 12px rgba(0,0,0,.10);
overflow:hidden;

}

.header{

background:linear-gradient(135deg,#0066cc,#004d99);
color:white;
padding:35px;
text-align:center;

}

.header h1{

font-size:34px;
margin-bottom:8px;

}

.header p{

font-size:17px;

}

.content{

padding:30px;

}

.photoBox{

text-align:center;
margin-bottom:30px;

}

.photoBox img{

width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
border:5px solid #0066cc;
background:#ddd;

}

.photoBox input{

margin-top:15px;

}

.group{

margin-bottom:22px;

}

.group label{

display:block;
margin-bottom:8px;
font-weight:bold;
color:#0066cc;

}

.group input,
.group textarea{

width:100%;
padding:14px;
font-size:16px;
border:1px solid #ccc;
border-radius:10px;
outline:none;

}

.group input:focus,
.group textarea:focus{

border-color:#0066cc;

}

.group textarea{

height:140px;
resize:vertical;

}

.saveBtn{

width:100%;
padding:16px;
border:none;
border-radius:10px;
background:#0066cc;
color:white;
font-size:18px;
cursor:pointer;

}

.saveBtn:hover{

background:#004d99;

}

.back{

margin-top:20px;
text-align:center;

}

.back button{

padding:12px 28px;
background:#777;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;

}

@media(max-width:700px){

.content{

padding:20px;

}

.header h1{

font-size:28px;

}

.photoBox img{

width:120px;
height:120px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="header">

<h1>👤 My Profile</h1>

<p>

Manage your personal information

</p>

</div>

<div class="content">

<div class="photoBox">

<img
id="profileImage"
src="images/profile.png">

<br>

<input
type="file"
id="profileFile"
accept="image/*">

</div>

<div class="group">

<label>

Full Name

</label>

<input
type="text"
id="fullName">

</div>

<div class="group">

<label>

Country

</label>

<input
type="text"
id="country"
placeholder="Example: Tanzania">

</div>

<div class="group">

<label>

Email

</label>

<input
type="email"
id="email"
readonly>

</div>

<div class="group">

<label>

About Me

</label>

<textarea
id="about"
placeholder="Tell other believers something about yourself..."></textarea>

</div>

<button
class="saveBtn"
id="saveBtn">

💾 Save Changes

</button>

<div class="back">

<button
onclick="location.href='community.html'">

⬅ Back to Community

</button>

</div>

</div>

</div>

</div>
<script type="module">

import{
auth,
db,
doc,
getDoc,
onAuthStateChanged
}from "./firebase.js";

const profileImage=document.getElementById("profileImage");
const profileFile=document.getElementById("profileFile");

const fullName=document.getElementById("fullName");
const country=document.getElementById("country");
const email=document.getElementById("email");
const about=document.getElementById("about");

let currentUser=null;

onAuthStateChanged(auth,async(user)=>{

if(!user){

location.href="login.html";
return;

}

currentUser=user;

loadProfile();

});

async function loadProfile(){

try{

const userSnap=await getDoc(
doc(db,"users",currentUser.uid)
);

if(!userSnap.exists()) return;

const data=userSnap.data();

profileImage.src=
data.profilePicture||"images/profile.png";

fullName.value=
data.fullName||"";

country.value=
data.country||"";

email.value=
data.email||currentUser.email||"";

about.value=
data.about||"";

}catch(error){

console.error(error);

alert(error.message);

}

}

// Preview selected image before uploading

profileFile.addEventListener("change",()=>{

const file=profileFile.files[0];

if(!file) return;

profileImage.src=URL.createObjectURL(file);

});

</script>
<script type="module">

import{
ref,
uploadBytes,
getDownloadURL,
updateDoc,
doc
}from "./firebase.js";

const saveBtn=document.getElementById("saveBtn");

saveBtn.addEventListener("click",async()=>{

try{

saveBtn.disabled=true;
saveBtn.innerText="Saving...";

let profilePicture=profileImage.src;

const file=profileFile.files[0];

if(file){

const storageRef=ref(
storage,
"profilePictures/"+currentUser.uid
);

await uploadBytes(storageRef,file);

profilePicture=await getDownloadURL(storageRef);

}

await updateDoc(
doc(db,"users",currentUser.uid),
{

fullName:fullName.value.trim(),

country:country.value.trim(),

about:about.value.trim(),

email:email.value.trim(),

profilePicture:profilePicture

}

);

alert("✅ Profile updated successfully.");

saveBtn.disabled=false;
saveBtn.innerText="💾 Save Changes";

}catch(error){

console.error(error);

alert(error.message);

saveBtn.disabled=false;
saveBtn.innerText="💾 Save Changes";

}

});

</script>

</body>

</html>
<script type="module">

import{
auth,
db,
storage,
doc,
getDoc,
onAuthStateChanged
}from "./firebase.js";

const profileImage=document.getElementById("profileImage");
const profileFile=document.getElementById("profileFile");

const fullName=document.getElementById("fullName");
const country=document.getElementById("country");
const email=document.getElementById("email");
const about=document.getElementById("about");

const saveBtn=document.getElementById("saveBtn");

let currentUser=null;

onAuthStateChanged(auth,async(user)=>{

if(!user){

location.href="login.html";
return;

}

currentUser=user;

email.value=user.email||"";

try{

const snap=await getDoc(doc(db,"users",user.uid));

if(snap.exists()){

const data=snap.data();

fullName.value=data.fullName||"";
country.value=data.country||"";
about.value=data.about||"";

if(data.profilePicture){

profileImage.src=data.profilePicture;

}

}

}catch(error){

console.error(error);
alert(error.message);

}

});

profileFile.addEventListener("change",()=>{

const file=profileFile.files[0];

if(file){

profileImage.src=URL.createObjectURL(file);

}

});

</script>

import{
ref,

getDownloadURL,
updateDoc
}from "./firebase.js";

let photoURL=profileImage.src;

const file=profileFile.files[0];

if(file){

const storageRef=ref(
storage,
"profilePictures/"+currentUser.uid
);

await uploadBytes(storageRef,file);

photoURL=await getDownloadURL(storageRef);

}

await updateDoc(

{

fullName:fullName.value.trim(),

profilePicture:photoURL

}

);

}catch(error){

console.error(error);

alert(error.message);

saveBtn.disabled=false;
saveBtn.innerText="💾 Save Changes";

}

});

</script>

</html>
