<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>My Profile | SABASABA Gospel Ministry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eef3f8;
}

.container{
max-width:850px;
margin:25px auto;
padding:20px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.header{
background:linear-gradient(135deg,#0066cc,#004d99);
padding:35px;
text-align:center;
color:white;
}

.header h1{
font-size:32px;
margin-bottom:8px;
}

.content{
padding:30px;
}

.photoBox{
text-align:center;
margin-bottom:25px;
}

.photoBox img{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
border:5px solid #0066cc;
background:#ddd;
}

.photoBox input{
margin-top:15px;
}

.group{
margin-bottom:20px;
}

.group label{
display:block;
margin-bottom:8px;
font-weight:bold;
color:#0066cc;
}

.group input,
.group textarea{

width:100%;
padding:14px;
font-size:16px;
border:1px solid #ccc;
border-radius:10px;
outline:none;

}

.group textarea{
height:140px;
resize:none;
}

.saveBtn{
width:100%;
padding:16px;
border:none;
border-radius:10px;
background:#0066cc;
color:white;
font-size:18px;
cursor:pointer;
}

.saveBtn:hover{
background:#004d99;
}

.backBtn{
width:100%;
padding:16px;
margin-top:15px;
border:none;
border-radius:10px;
background:#666;
color:white;
font-size:17px;
cursor:pointer;
}

.backBtn:hover{
background:#555;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="header">

<h1>👤 My Profile</h1>

<p>Edit your personal information</p>

</div>

<div class="content">

<div class="photoBox">

<img
id="profileImage"
src="images/profile.png">

<br>

<input
id="profileFile"
type="file"
accept="image/*">

</div>

<div class="group">

<label>Full Name</label>

<input
id="fullName"
type="text">

</div>

<div class="group">

<label>Country</label>

<input
id="country"
type="text"
placeholder="Example: Tanzania">

</div>

<div class="group">

<label>Email</label>

<input
id="email"
type="email"
readonly>

</div>

<div class="group">

<label>About Me</label>

<textarea
id="about"
placeholder="Tell other believers about yourself..."></textarea>

</div>

<button
id="saveBtn"
class="saveBtn">

💾 Save Changes

</button>

<button
class="backBtn"
onclick="location.href='community.html'">

⬅ Back to Community

</button>

</div>

</div>

</div>
<script type="module">

import{
auth,
db,
storage,
doc,
getDoc,
updateDoc,
ref,
uploadBytes,
getDownloadURL,
onAuthStateChanged
}from "./firebase.js";

const profileImage=document.getElementById("profileImage");
const profileFile=document.getElementById("profileFile");

const fullName=document.getElementById("fullName");
const country=document.getElementById("country");
const email=document.getElementById("email");
const about=document.getElementById("about");

const saveBtn=document.getElementById("saveBtn");

let currentUser=null;

onAuthStateChanged(auth,async(user)=>{

if(!user){

location.href="login.html";
return;

}

currentUser=user;

email.value=user.email||"";

try{

const snap=await getDoc(doc(db,"users",user.uid));

if(snap.exists()){

const data=snap.data();

fullName.value=data.fullName||"";
country.value=data.country||"";
about.value=data.about||"";

if(data.profilePicture){

profileImage.src=data.profilePicture;

}

}

}catch(error){

console.error(error);
alert(error.message);

}

});

profileFile.addEventListener("change",()=>{

const file=profileFile.files[0];

if(file){

profileImage.src=URL.createObjectURL(file);

}

});

saveBtn.addEventListener("click",async()=>{

try{

saveBtn.disabled=true;
saveBtn.innerText="Saving...";

let photoURL=profileImage.src;

const file=profileFile.files[0];

if(file){

const storageRef=ref(storage,"profilePictures/"+currentUser.uid);

await uploadBytes(storageRef,file);

photoURL=await getDownloadURL(storageRef);

}

await updateDoc(

doc(db,"users",currentUser.uid),

{

fullName:fullName.value.trim(),

country:country.value.trim(),

about:about.value.trim(),

email:email.value,

profilePicture:photoURL

}

);

alert("✅ Profile updated successfully!");

saveBtn.disabled=false;
saveBtn.innerText="💾 Save Changes";

}catch(error){

console.error(error);

alert(error.message);

saveBtn.disabled=false;
saveBtn.innerText="💾 Save Changes";

}

});

</script>

</body>

</html>
