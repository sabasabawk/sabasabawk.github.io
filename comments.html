<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Comments page for SABASABA Gospel Ministry Community"
  >

  <title>
    Comments | SABASABA Gospel Ministry
  </title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    :root {

      --primary-color: #0b5d3b;
      --primary-dark: #063d28;
      --primary-light: #e8f5ee;

      --secondary-color: #f4b400;

      --danger-color: #c62828;
      --danger-light: #fdecec;

      --background-color: #f4f7f5;
      --card-color: #ffffff;

      --text-color: #1f2933;
      --muted-text: #667085;

      --border-color: #d8e1dc;

      --shadow:
        0 4px 16px rgba(0, 0, 0, 0.08);

      --small-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);

    }


    body {

      min-height: 100vh;

      background:
        var(--background-color);

      color:
        var(--text-color);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      line-height: 1.6;

    }


    button,
    textarea,
    input {

      font-family:
        inherit;

    }


    button {

      cursor: pointer;

    }


    button:disabled {

      cursor: not-allowed;
      opacity: 0.65;

    }


    .page-container {

      width: 100%;
      max-width: 760px;

      margin: 0 auto;

      padding:
        18px 14px 40px;

    }


    /* =====================================================
       PAGE HEADER
    ===================================================== */

    .page-header {

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      background:
        linear-gradient(
          135deg,
          var(--primary-color),
          var(--primary-dark)
        );

      color: white;

      border-radius: 16px;

      padding: 18px;

      margin-bottom: 18px;

      box-shadow:
        var(--shadow);

    }


    .header-text {

      flex: 1;

    }


    .header-text h1 {

      font-size: 24px;
      line-height: 1.25;

      margin-bottom: 4px;

    }


    .header-text p {

      font-size: 14px;
      opacity: 0.9;

    }


    .header-button {

      border: none;

      background:
        rgba(255, 255, 255, 0.18);

      color: white;

      min-width: 44px;
      height: 44px;

      border-radius: 12px;

      font-size: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        background 0.2s ease,
        transform 0.2s ease;

    }


    .header-button:hover {

      background:
        rgba(255, 255, 255, 0.28);

      transform:
        translateY(-1px);

    }


    /* =====================================================
       POST PREVIEW
    ===================================================== */

    .post-preview {

      background:
        var(--card-color);

      border:
        1px solid var(--border-color);

      border-radius: 16px;

      padding: 16px;

      margin-bottom: 18px;

      box-shadow:
        var(--small-shadow);

    }


    .post-author-row {

      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 12px;

    }


    .post-author-picture {

      width: 48px;
      height: 48px;

      border-radius: 50%;

      object-fit: cover;

      border:
        2px solid var(--primary-light);

      background:
        #eeeeee;

    }


    .post-author-information {

      flex: 1;
      min-width: 0;

    }


    .post-author-name {

      font-size: 16px;
      font-weight: 700;

      color:
        var(--primary-dark);

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

    }


    .post-date {

      color:
        var(--muted-text);

      font-size: 12px;

    }


    .post-text {

      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;

      margin-bottom: 12px;

    }


    /* =====================================================
       COMMENTS SECTION
    ===================================================== */

    .comments-section {

      background:
        var(--card-color);

      border:
        1px solid var(--border-color);

      border-radius: 16px;

      padding: 16px;

      margin-bottom: 18px;

      box-shadow:
        var(--small-shadow);

    }


    .comments-heading-row {

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      margin-bottom: 16px;

    }


    .comments-heading {

      font-size: 19px;

      color:
        var(--primary-dark);

    }


    .comments-count {

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      font-size: 13px;
      font-weight: 700;

      padding:
        5px 10px;

      border-radius: 999px;

    }


    .comments-list {

      display: flex;
      flex-direction: column;
      gap: 12px;

    }


    /* =====================================================
       COMMENT CARD
    ===================================================== */

    .comment-card {

      display: flex;
      align-items: flex-start;
      gap: 10px;

      padding: 12px;

      border:
        1px solid var(--border-color);

      border-radius: 14px;

      background:
        #fbfdfc;

      transition:
        background 0.6s ease;

    }


    /*
      Brief highlight flash used to point out a
      comment when someone taps a "Replying to"
      quote and jumps to the original comment.
    */

    .comment-card.highlighted {

      background:
        #eef8f1;

      border-color:
        var(--primary-color);

    }


    .comment-picture {

      width: 42px;
      height: 42px;

      border-radius: 50%;

      object-fit: cover;

      flex-shrink: 0;

      border:
        2px solid var(--primary-light);

      background:
        #eeeeee;

    }


    .comment-content {

      flex: 1;
      min-width: 0;

    }


    .comment-top-row {

      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;

      margin-bottom: 4px;

    }


    .comment-author {

      font-size: 14px;
      font-weight: 700;

      color:
        var(--primary-dark);

      overflow-wrap: anywhere;

    }


    .comment-time {

      color:
        var(--muted-text);

      font-size: 11px;

      white-space: nowrap;

    }


    .comment-message {

      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;

      margin-bottom: 8px;

    }


    /* =====================================================
       QUOTED REPLY REFERENCE
       (shown at the top of a comment that is
       itself a reply to another comment)
    ===================================================== */

    .reply-quote {

      display: block;

      width: 100%;

      text-align: left;

      border: none;

      border-left:
        3px solid var(--primary-color);

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      border-radius: 8px;

      padding:
        6px 10px;

      margin-bottom: 8px;

      font-size: 12px;
      line-height: 1.4;

    }


    .reply-quote:hover {

      background:
        #d9efe2;

    }


    .reply-quote-name {

      font-weight: 700;

      margin-bottom: 2px;

    }


    .reply-quote-text {

      color:
        var(--muted-text);

      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;

    }


    .comment-actions {

      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;

    }


    .comment-action-button {

      border: none;
      background: transparent;

      color:
        var(--primary-color);

      font-size: 12px;
      font-weight: 700;

      padding:
        3px 5px;

      border-radius: 6px;

    }


    .comment-action-button:hover {

      background:
        var(--primary-light);

    }


    .delete-comment-button {

      color:
        var(--danger-color);

    }


    .delete-comment-button:hover {

      background:
        var(--danger-light);

    }


    /* =====================================================
       REPLY-TO PREVIEW BANNER
       (appears above the comment box once the
       user taps "Reply" on someone's comment —
       same idea as WhatsApp's reply preview)
    ===================================================== */

    .reply-preview-banner {

      display: none;

      align-items: flex-start;

      justify-content: space-between;

      gap: 10px;

      background:
        var(--primary-light);

      border-left:
        3px solid var(--primary-color);

      border-radius: 10px;

      padding:
        10px 12px;

      margin-bottom: 10px;

    }


    .reply-preview-banner.show {

      display: flex;

    }


    .reply-preview-text {

      min-width: 0;

      font-size: 13px;

      color:
        var(--text-color);

    }


    .reply-preview-name {

      font-weight: 700;

      color:
        var(--primary-dark);

      margin-bottom: 2px;

    }


    .reply-preview-snippet {

      color:
        var(--muted-text);

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

    }


    .cancel-reply-button {

      flex-shrink: 0;

      border: none;

      background:
        rgba(11, 93, 59, 0.12);

      color:
        var(--primary-dark);

      width: 26px;
      height: 26px;

      border-radius: 50%;

      font-size: 15px;
      font-weight: 700;

      display: flex;
      align-items: center;
      justify-content: center;

    }


    .cancel-reply-button:hover {

      background:
        rgba(11, 93, 59, 0.22);

    }


    /* =====================================================
       COMMENT FORM
    ===================================================== */

    .comment-form-card {

      background:
        var(--card-color);

      border:
        1px solid var(--border-color);

      border-radius: 16px;

      padding: 16px;

      margin-bottom: 18px;

      box-shadow:
        var(--small-shadow);

      position: sticky;
      bottom: 10px;

    }


    .comment-form {

      display: flex;
      align-items: flex-end;
      gap: 10px;

    }


    .comment-input {

      flex: 1;

      width: 100%;
      min-height: 48px;
      max-height: 160px;

      resize: vertical;

      border:
        1px solid var(--border-color);

      border-radius: 12px;

      padding:
        12px 13px;

      font-size: 15px;

      color:
        var(--text-color);

      background:
        #ffffff;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;

    }


    .comment-input:focus {

      border-color:
        var(--primary-color);

      box-shadow:
        0 0 0 3px
        rgba(11, 93, 59, 0.12);

    }


    .comment-input::placeholder {

      color:
        #98a2ad;

    }


    .submit-comment-button {

      min-width: 94px;
      min-height: 48px;

      border: none;

      border-radius: 12px;

      padding:
        11px 16px;

      background:
        var(--primary-color);

      color: white;

      font-size: 14px;
      font-weight: 700;

      transition:
        background 0.2s ease,
        transform 0.2s ease;

    }


    .submit-comment-button:hover {

      background:
        var(--primary-dark);

      transform:
        translateY(-1px);

    }


    .form-message {

      margin-top: 10px;

      font-size: 13px;

      display: none;

    }


    .form-message.success {

      display: block;

      color:
        var(--primary-color);

    }


    .form-message.error {

      display: block;

      color:
        var(--danger-color);

    }


    /* =====================================================
       STATUS MESSAGES
    ===================================================== */

    .status-card {

      text-align: center;

      padding:
        26px 16px;

      border:
        1px dashed var(--border-color);

      border-radius: 14px;

      background:
        #fbfdfc;

      color:
        var(--muted-text);

    }


    .status-icon {

      display: block;

      font-size: 34px;

      margin-bottom: 8px;

    }


    .loading-spinner {

      width: 32px;
      height: 32px;

      margin:
        0 auto 12px;

      border:
        4px solid var(--primary-light);

      border-top-color:
        var(--primary-color);

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    /* =====================================================
       GENERAL BUTTONS
    ===================================================== */

    .navigation-button {

      width: 100%;

      border: none;

      border-radius: 12px;

      padding:
        13px 16px;

      background:
        var(--primary-dark);

      color: white;

      font-size: 15px;
      font-weight: 700;

    }


    .navigation-button:hover {

      background:
        var(--primary-color);

    }


    .hidden {

      display: none !important;

    }


    /* =====================================================
       RESPONSIVE DESIGN
    ===================================================== */

    @media (max-width: 600px) {

      .page-container {

        padding:
          10px 9px 30px;

      }


      .page-header {

        border-radius: 12px;

        padding: 15px;

      }


      .header-text h1 {

        font-size: 21px;

      }


      .post-preview,
      .comments-section,
      .comment-form-card {

        border-radius: 12px;

        padding: 13px;

      }


      .comment-form {

        align-items: stretch;
        flex-direction: column;

      }


      .submit-comment-button {

        width: 100%;

      }


      .comment-form-card {

        bottom: 5px;

      }


      .comment-top-row {

        flex-direction: column;
        gap: 1px;

      }


      .comment-time {

        white-space: normal;

      }

    }

  </style>

</head>
<body>

  <main class="page-container">

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <header class="page-header">

      <div class="header-text">

        <h1>
          Community Comments
        </h1>

        <p>
          Join the conversation with SABASABA Gospel Ministry.
        </p>

      </div>


      <button
        id="refreshButton"
        class="header-button"
        type="button"
        aria-label="Refresh comments"
        title="Refresh comments"
      >
        🔄
      </button>

    </header>


    <!-- =====================================================
         POST PREVIEW
    ====================================================== -->

    <section
      id="postPreview"
      class="post-preview"
    >

      <div
        id="postLoadingMessage"
        class="status-card"
      >

        <div class="loading-spinner"></div>

        <p>
          Loading post...
        </p>

      </div>


      <div
        id="postContent"
        class="hidden"
      >

        <div class="post-author-row">

          <img
            id="postAuthorPicture"
            class="post-author-picture"
            src="images/profile.png"
            alt="Post author profile picture"
          >


          <div class="post-author-information">

            <div
              id="postAuthorName"
              class="post-author-name"
            >
              Community Member
            </div>

            <div
              id="postDate"
              class="post-date"
            >
              Just now
            </div>

          </div>

        </div>


        <div
          id="postText"
          class="post-text"
        ></div>

      </div>

    </section>


    <!-- =====================================================
         COMMENTS SECTION
    ====================================================== -->

    <section class="comments-section">

      <div class="comments-heading-row">

        <h2 class="comments-heading">
          Comments
        </h2>

        <span
          id="commentsCount"
          class="comments-count"
        >
          0 comments
        </span>

      </div>


      <div
        id="commentsList"
        class="comments-list"
      >

        <div class="status-card">

          <div class="loading-spinner"></div>

          <p>
            Loading comments...
          </p>

        </div>

      </div>

    </section>


    <!-- =====================================================
         COMMENT FORM
    ====================================================== -->

    <section
      id="commentFormCard"
      class="comment-form-card"
    >

      <!-- =================================================
           REPLY-TO PREVIEW
           Shown only after tapping "Reply" on a
           specific comment — same idea as WhatsApp's
           quoted reply preview above the keyboard.
      ================================================== -->

      <div
        id="replyPreviewBanner"
        class="reply-preview-banner"
      >

        <div class="reply-preview-text">

          <div class="reply-preview-name">
            Replying to
            <span id="replyPreviewName"></span>
          </div>

          <div
            id="replyPreviewSnippet"
            class="reply-preview-snippet"
          ></div>

        </div>


        <button
          id="cancelReplyButton"
          class="cancel-reply-button"
          type="button"
          aria-label="Cancel reply"
          title="Cancel reply"
        >
          ×
        </button>

      </div>


      <form
        id="commentForm"
        class="comment-form"
      >

        <textarea
          id="commentInput"
          class="comment-input"
          name="comment"
          placeholder="Write your comment..."
          maxlength="1000"
          required
        ></textarea>


        <button
          id="submitCommentButton"
          class="submit-comment-button"
          type="submit"
        >
          Post Comment
        </button>

      </form>


      <p
        id="formMessage"
        class="form-message"
      ></p>

    </section>


    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <button
      id="backButton"
      class="navigation-button"
      type="button"
    >
      ← Back to Community Wall
    </button>

  </main>


  <script type="module">
/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {

  auth,
  db,

  collection,
  addDoc,
  getDoc,
  doc,
  updateDoc,
  deleteDoc,
  setDoc,
  increment,

  query,
  orderBy,
  onSnapshot,

  serverTimestamp,

  onAuthStateChanged

} from "./firebase.js";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let currentUserProfile = null;

let currentPost = null;

let unsubscribeComments = null;

const defaultProfilePicture =
  "images/profile.png";


/*
  Holds { id, name, snippet } for the comment
  currently being replied to, or null when the
  comment box is a normal top-level comment.
*/

let replyingTo = null;


/*
  Keeps the latest loaded comments available by
  ID, so tapping a "Replying to" quote can look
  up the name/snippet of the original comment
  without another network read.
*/

const loadedCommentsById =
new Map();


/* =====================================================
   HTML ELEMENTS
===================================================== */

const postPreview =
document.getElementById(
  "postPreview"
);

const postLoadingMessage =
document.getElementById(
  "postLoadingMessage"
);

const postContent =
document.getElementById(
  "postContent"
);

const postAuthorPicture =
document.getElementById(
  "postAuthorPicture"
);

const postAuthorName =
document.getElementById(
  "postAuthorName"
);

const postDate =
document.getElementById(
  "postDate"
);

const postText =
document.getElementById(
  "postText"
);

const commentsList =
document.getElementById(
  "commentsList"
);

const commentsCount =
document.getElementById(
  "commentsCount"
);

const commentForm =
document.getElementById(
  "commentForm"
);

const commentInput =
document.getElementById(
  "commentInput"
);

const submitCommentButton =
document.getElementById(
  "submitCommentButton"
);

const formMessage =
document.getElementById(
  "formMessage"
);

const refreshButton =
document.getElementById(
  "refreshButton"
);

const backButton =
document.getElementById(
  "backButton"
);

const replyPreviewBanner =
document.getElementById(
  "replyPreviewBanner"
);

const replyPreviewName =
document.getElementById(
  "replyPreviewName"
);

const replyPreviewSnippet =
document.getElementById(
  "replyPreviewSnippet"
);

const cancelReplyButton =
document.getElementById(
  "cancelReplyButton"
);


/* =====================================================
   GET POST ID
===================================================== */

const urlParameters =
new URLSearchParams(
  window.location.search
);

const postId =
urlParameters.get(
  "postId"
);


/* =====================================================
   HELPER FUNCTIONS
===================================================== */

function escapeHTML(text){

  const div =
  document.createElement("div");

  div.textContent =
  text ?? "";

  return div.innerHTML;

}


function getFirstValue(
  ...values
){

  for(
    const value
    of values
  ){

    if(

      value !== undefined &&
      value !== null &&
      value !== ""

    ){

      return value;

    }

  }

  return "";

}


function formatDate(
  timestamp
){

  if(
    !timestamp
  ){

    return "";

  }

  try{

    const date =

    timestamp.toDate
      ? timestamp.toDate()
      : new Date(timestamp);

    return date.toLocaleString();

  }catch{

    return "";

  }

}


/*
  Shortens a comment's text down to a small
  preview, the same way WhatsApp trims a long
  message inside a reply quote.
*/

function truncateForPreview(
  text,
  maxLength = 80
){

  const cleanedText =
  String(
    text || ""
  ).trim();


  if(
    cleanedText.length <= maxLength
  ){

    return cleanedText;

  }


  return `${cleanedText.slice(0,maxLength)}…`;

}


/* =====================================================
   LOAD USER
===================================================== */

onAuthStateChanged(

  auth,

  async(user)=>{

    if(!user){

      location.href =
      "login.html";

      return;

    }

    currentUser = user;

    try{

      const profile =

      await getDoc(

        doc(
          db,
          "users",
          user.uid
        )

      );

      if(
        profile.exists()
      ){

        currentUserProfile =
        profile.data();

      }

    }catch(error){

      console.error(error);

    }

    loadPost();

    loadComments();

  }

);
/* =====================================================
   LOAD POST
===================================================== */

async function loadPost(){

  if(!postId){

    postLoadingMessage.innerHTML = `
      <span class="status-icon">⚠️</span>
      <p>Post ID is missing.</p>
    `;

    return;

  }

  try{

    const postReference =
    doc(
      db,
      "communityPosts",
      postId
    );


    const postSnapshot =
    await getDoc(
      postReference
    );


    if(
      !postSnapshot.exists()
    ){

      postLoadingMessage.innerHTML = `
        <span class="status-icon">⚠️</span>
        <p>This post was not found.</p>
      `;

      return;

    }


    currentPost = {

      id:
      postSnapshot.id,

      ...postSnapshot.data()

    };


    displayPost(
      currentPost
    );

  }catch(error){

    console.error(
      "Post loading error:",
      error
    );


    postLoadingMessage.innerHTML = `
      <span class="status-icon">❌</span>
      <p>Unable to load this post.</p>
    `;

  }

}


/* =====================================================
   DISPLAY POST
===================================================== */

function displayPost(
  postData
){

  const authorName =
  getFirstValue(

    postData.authorName,
    postData.userName,
    postData.name,
    postData.displayName,
    "Community Member"

  );


  const authorPicture =
  getFirstValue(

    postData.authorPicture,
    postData.userPicture,
    postData.profilePicture,
    postData.photoURL,
    postData.photoUrl,
    postData.picture,
    defaultProfilePicture

  );


  const message =
  getFirstValue(

    postData.text,
    postData.message,
    postData.content,
    postData.postText,
    postData.post,
    ""

  );


  const createdAt =
  getFirstValue(

    postData.createdAt,
    postData.timestamp,
    postData.postedAt,
    null

  );


  postAuthorName.textContent =
  authorName;


  postAuthorPicture.src =
  authorPicture;


  postAuthorPicture.onerror =
  function(){

    this.src =
    defaultProfilePicture;

  };


  postDate.textContent =
  formatDate(
    createdAt
  ) || "Recently";


  postText.textContent =
  message;


  postLoadingMessage.classList.add(
    "hidden"
  );


  postContent.classList.remove(
    "hidden"
  );

}


/* =====================================================
   STOP COMMENTS LISTENER
===================================================== */

function stopCommentsListener(){

  if(
    typeof unsubscribeComments
    === "function"
  ){

    unsubscribeComments();

    unsubscribeComments = null;

  }

}


/* =====================================================
   LOAD COMMENTS
===================================================== */

function loadComments(){

  if(!postId){

    showCommentsError(
      "Post ID is missing."
    );

    return;

  }


  stopCommentsListener();


  commentsList.innerHTML = `

    <div class="status-card">

      <div class="loading-spinner"></div>

      <p>
        Loading comments...
      </p>

    </div>

  `;


  const commentsReference =
  collection(
    db,
    "communityPosts",
    postId,
    "comments"
  );


  const commentsQuery =
  query(

    commentsReference,

    orderBy(
      "timestamp",
      "asc"
    )

  );


  unsubscribeComments =
  onSnapshot(

    commentsQuery,

    (snapshot)=>{

      const comments = [];


      loadedCommentsById.clear();


      snapshot.forEach(

        (commentDocument)=>{

          const commentData = {

            id:
            commentDocument.id,

            ...commentDocument.data()

          };


          comments.push(
            commentData
          );


          loadedCommentsById.set(
            commentData.id,
            commentData
          );

        }

      );


      displayComments(
        comments
      );


      updateCommentsCount(
        comments.length
      );

    },

    (error)=>{

      console.error(
        "Comments listener error:",
        error
      );


      if(
        error.code ===
        "failed-precondition"
      ){

        showCommentsError(
          "A Firebase index may be required."
        );

        return;

      }


      if(
        error.code ===
        "permission-denied"
      ){

        showCommentsError(
          "You do not have permission to read these comments."
        );

        return;

      }


      showCommentsError(
        "Unable to load comments."
      );

    }

  );

}


/* =====================================================
   DISPLAY COMMENTS
===================================================== */

function displayComments(
  comments
){

  commentsList.innerHTML =
  "";


  if(
    comments.length === 0
  ){

    commentsList.innerHTML = `

      <div class="status-card">

        <span class="status-icon">
          💬
        </span>

        <p>
          No comments yet.
        </p>

        <p>
          Be the first person to comment.
        </p>

      </div>

    `;

    return;

  }


  comments.forEach(

    (commentData)=>{

      const commentCard =
      createCommentCard(
        commentData
      );


      commentsList.appendChild(
        commentCard
      );


      setupCommentActions(
        commentData,
        commentCard
      );

    }

  );

}


/* =====================================================
   CREATE COMMENT CARD
===================================================== */

function createCommentCard(
  commentData
){

  const commentCard =
  document.createElement(
    "article"
  );


  commentCard.className =
  "comment-card";


  commentCard.dataset.commentId =
  commentData.id;


  const commentOwnerId =
  getFirstValue(

    commentData.userId,
    commentData.authorId,
    commentData.uid,
    commentData.senderId

  );


  const commenterName =
  getFirstValue(

    commentData.name,
    commentData.userName,
    commentData.authorName,
    commentData.displayName,
    "Community Member"

  );


  const commenterPicture =
  getFirstValue(

    commentData.picture,
    commentData.userPicture,
    commentData.profilePicture,
    commentData.photoURL,
    defaultProfilePicture

  );


  const commentMessage =
  getFirstValue(

    commentData.text,
    commentData.comment,
    commentData.message,
    commentData.content,
    ""

  );


  const commentTimestamp =
  getFirstValue(

    commentData.timestamp,
    commentData.createdAt,
    commentData.commentedAt,
    null

  );


  const isOwner =

  currentUser &&
  commentOwnerId ===
  currentUser.uid;


  /*
    If this comment is a reply to another one,
    show a small quoted reference at the top —
    tapping it jumps to and briefly highlights
    the original comment, the same way tapping
    a quoted reply works in WhatsApp.
  */

  const replyToId =
  getFirstValue(

    commentData.replyToId

  );


  const replyToName =
  getFirstValue(

    commentData.replyToName

  );


  const replyToSnippet =
  getFirstValue(

    commentData.replyToSnippet

  );


  const replyQuoteHTML =

  replyToId

  ? `

      <button
        type="button"
        class="reply-quote"
        data-reply-target-id="${escapeHTML(replyToId)}"
      >

        <div class="reply-quote-name">
          ↩ ${escapeHTML(
            replyToName ||
            "a comment"
          )}
        </div>

        <div class="reply-quote-text">
          ${escapeHTML(
            replyToSnippet ||
            ""
          )}
        </div>

      </button>

    `

  : "";


  commentCard.innerHTML = `

    <img
      class="comment-picture"
      src="${escapeHTML(commenterPicture)}"
      alt="${escapeHTML(commenterName)}"
    >


    <div class="comment-content">

      <div class="comment-top-row">

        <div class="comment-author">
          ${escapeHTML(commenterName)}
        </div>

        <div class="comment-time">
          ${escapeHTML(
            formatDate(
              commentTimestamp
            ) || "Recently"
          )}
        </div>

      </div>


      ${replyQuoteHTML}


      <div class="comment-message">
        ${escapeHTML(commentMessage)}
      </div>


      <div class="comment-actions">

        <button
          class="
            comment-action-button
            reply-comment-button
          "
          type="button"
        >
          ↩ Reply
        </button>


        ${
          isOwner
          ? `

            <button
              class="
                comment-action-button
                edit-comment-button
              "
              type="button"
            >
              ✏️ Edit
            </button>


            <button
              class="
                comment-action-button
                delete-comment-button
              "
              type="button"
            >
              🗑️ Delete
            </button>

          `
          : ""
        }

      </div>

    </div>

  `;


  const picture =
  commentCard.querySelector(
    ".comment-picture"
  );


  if(picture){

    picture.onerror =
    function(){

      this.src =
      defaultProfilePicture;

    };

  }


  return commentCard;

}

/* =====================================================
   CREATE COMMENT NOTIFICATION
===================================================== */

async function createCommentNotification(
  commentId,
  commentText
){

  if(
    !currentUser ||
    !currentPost ||
    !postId
  ){

    return;

  }


  const postOwnerId =
  getPostOwnerId();


  if(!postOwnerId){

    console.warn(
      "Comment notification skipped: post owner ID is missing."
    );

    return;

  }


  /*
    Do not create a notification when someone
    comments on their own post.
  */

  if(
    postOwnerId ===
    currentUser.uid
  ){

    return;

  }


  const senderName =
  getCurrentUserName();


  const senderPicture =
  getCurrentUserPicture();


  try{

    await addDoc(

      collection(
        db,
        "notifications"
      ),

      {

        recipientId:
        postOwnerId,

        senderId:
        currentUser.uid,

        senderName:
        senderName,

        senderPicture:
        senderPicture,

        type:
        "comment",

        postId:
        postId,

        commentId:
        commentId,

        commentText:
        commentText,

        message:
        `${senderName} commented on your post.`,

        read:
        false,

        timestamp:
        serverTimestamp()

      }

    );

  }catch(error){

    console.error(
      "Comment notification creation error:",
      error
    );


    /*
      The comment must remain posted even when
      notification creation fails.
    */

  }

}


/* =====================================================
   CREATE REPLY NOTIFICATION

   Separate from the ordinary "commented on your
   post" notification above — this tells the
   specific person being replied to, not just the
   post owner, and is skipped if they are the same
   person (they would already get the other one).
===================================================== */

async function createReplyNotification(
  commentId,
  commentText
){

  if(
    !currentUser ||
    !replyingTo ||
    !postId
  ){

    return;

  }


  const originalComment =
  loadedCommentsById.get(
    replyingTo.id
  );


  if(!originalComment){

    return;

  }


  const originalCommenterId =
  getFirstValue(

    originalComment.userId,
    originalComment.authorId,
    originalComment.uid,
    originalComment.senderId

  );


  if(
    !originalCommenterId ||
    originalCommenterId ===
    currentUser.uid ||
    originalCommenterId ===
    getPostOwnerId()
  ){

    /*
      Skip when replying to yourself, or when the
      person is already the post owner — they get
      the regular comment notification above and
      do not need two.
    */

    return;

  }


  const senderName =
  getCurrentUserName();


  const senderPicture =
  getCurrentUserPicture();


  try{

    await addDoc(

      collection(
        db,
        "notifications"
      ),

      {

        recipientId:
        originalCommenterId,

        senderId:
        currentUser.uid,

        senderName:
        senderName,

        senderPicture:
        senderPicture,

        type:
        "comment_reply",

        postId:
        postId,

        commentId:
        commentId,

        commentText:
        commentText,

        message:
        `${senderName} replied to your comment.`,

        read:
        false,

        timestamp:
        serverTimestamp()

      }

    );

  }catch(error){

    console.error(
      "Reply notification creation error:",
      error
    );

  }

}


/* =====================================================
   SUBMIT COMMENT
===================================================== */

commentForm.addEventListener(

  "submit",

  async(event)=>{

    event.preventDefault();


    if(!currentUser){

      showFormMessage(
        "Please sign in before commenting."
      );

      return;

    }


    if(!postId){

      showFormMessage(
        "The post ID is missing."
      );

      return;

    }


    if(!currentPost){

      showFormMessage(
        "Please wait for the post to finish loading."
      );

      return;

    }


    const commentText =
    commentInput.value.trim();


    if(!commentText){

      showFormMessage(
        "Please write a comment."
      );

      commentInput.focus();

      return;

    }


    if(
      commentText.length > 1000
    ){

      showFormMessage(
        "Your comment is too long."
      );

      return;

    }


    submitCommentButton.disabled =
    true;


    submitCommentButton.textContent =
    "Posting...";


    /*
      Captured before the "await" calls below,
      since clearReplyTarget() resets the shared
      replyingTo variable once the comment is
      saved — this keeps the notification and the
      saved fields consistent with what the
      banner showed when Post Comment was tapped.
    */

    const activeReplyTarget =
    replyingTo;


    try{

      const commenterName =
      getCurrentUserName();


      const commenterPicture =
      getCurrentUserPicture();


      const commentReference =
      await addDoc(

        collection(
          db,
          "communityPosts",
          postId,
          "comments"
        ),

        {

          userId:
          currentUser.uid,

          authorId:
          currentUser.uid,

          name:
          commenterName,

          authorName:
          commenterName,

          picture:
          commenterPicture,

          authorPicture:
          commenterPicture,

          text:
          commentText,

          comment:
          commentText,

          timestamp:
          serverTimestamp(),

          createdAt:
          serverTimestamp(),

          edited:
          false,

          replyToId:
          activeReplyTarget?.id ||
          "",

          replyToName:
          activeReplyTarget?.name ||
          "",

          replyToSnippet:
          activeReplyTarget?.snippet ||
          ""

        }

      );


      /*
        Update the comment count stored on the
        post itself, so the Community Wall can
        show "💬 Comment (3)" without having to
        read every comment for every post.
      */

      try{

        await updateDoc(

          doc(
            db,
            "communityPosts",
            postId
          ),

          {
            commentsCount:
            increment(1)
          }

        );

      }catch(error){

        console.error(
          "Comment count update error:",
          error
        );

        /*
          The comment itself is already saved —
          a failed count update should not be
          shown to the user as an error.
        */

      }


      /*
        Create the notification only after
        the comment has been saved successfully.
      */

      await createCommentNotification(

        commentReference.id,
        commentText

      );


      if(activeReplyTarget){

        replyingTo =
        activeReplyTarget;


        await createReplyNotification(

          commentReference.id,
          commentText

        );

      }


      commentInput.value =
      "";


      clearReplyTarget();


      showFormMessage(
        "Your comment was posted.",
        "success"
      );


      commentInput.focus();

    }catch(error){

      console.error(
        "Comment posting error:",
        error
      );


      if(
        error.code ===
        "permission-denied"
      ){

        showFormMessage(
          "You do not have permission to post comments."
        );

      }else{

        showFormMessage(
          "Unable to post your comment. Please try again."
        );

      }

    }finally{

      submitCommentButton.disabled =
      false;


      submitCommentButton.textContent =
      "Post Comment";

    }

  }

);


/* =====================================================
   SET UP COMMENT ACTIONS
===================================================== */

function setupCommentActions(
  commentData,
  commentCard
){

  if(
    !commentData ||
    !commentCard
  ){

    return;

  }


  /* =====================================================
     REPLY TO THIS COMMENT
     (available to everyone, not just the comment
     owner — this is the button that solves the
     "respond to a specific person" request)
  ===================================================== */

  const replyButton =
  commentCard.querySelector(
    ".reply-comment-button"
  );


  if(replyButton){

    replyButton.addEventListener(

      "click",

      ()=>{

        if(!currentUser){

          showFormMessage(
            "Please sign in before replying."
          );

          return;

        }


        setReplyTarget(
          commentData
        );

      }

    );

  }


  if(
    !currentUser ||
    !commentData
  ){

    return;

  }


  const commentOwnerId =
  getFirstValue(

    commentData.userId,
    commentData.authorId,
    commentData.uid,
    commentData.senderId

  );


  if(
    commentOwnerId !==
    currentUser.uid
  ){

    return;

  }


  const editButton =
  commentCard.querySelector(
    ".edit-comment-button"
  );


  const deleteButton =
  commentCard.querySelector(
    ".delete-comment-button"
  );


  /* =====================================================
     EDIT COMMENT
  ===================================================== */

  if(editButton){

    editButton.addEventListener(

      "click",

      async()=>{

        const oldCommentText =
        getFirstValue(

          commentData.text,
          commentData.comment,
          commentData.message,
          commentData.content,
          ""

        );


        const newCommentText =
        window.prompt(

          "Edit your comment:",

          oldCommentText

        );


        /*
          Cancel was pressed.
        */

        if(
          newCommentText === null
        ){

          return;

        }


        const cleanedCommentText =
        newCommentText.trim();


        if(!cleanedCommentText){

          window.alert(
            "A comment cannot be empty."
          );

          return;

        }


        if(
          cleanedCommentText.length > 1000
        ){

          window.alert(
            "Your comment is too long."
          );

          return;

        }


        if(
          cleanedCommentText ===
          oldCommentText
        ){

          return;

        }


        editButton.disabled =
        true;


        editButton.textContent =
        "Saving...";


        try{

          const commentReference =
          doc(

            db,
            "communityPosts",
            postId,
            "comments",
            commentData.id

          );


          const latestCommentSnapshot =
          await getDoc(
            commentReference
          );


          if(
            !latestCommentSnapshot.exists()
          ){

            throw new Error(
              "This comment no longer exists."
            );

          }


          const latestCommentData =
          latestCommentSnapshot.data();


          const latestOwnerId =
          getFirstValue(

            latestCommentData.userId,
            latestCommentData.authorId,
            latestCommentData.uid,
            latestCommentData.senderId

          );


          if(
            latestOwnerId !==
            currentUser.uid
          ){

            throw new Error(
              "You can only edit your own comment."
            );

          }


          await updateDoc(

            commentReference,

            {

              text:
              cleanedCommentText,

              comment:
              cleanedCommentText,

              edited:
              true,

              editedAt:
              serverTimestamp()

            }

          );

        }catch(error){

          console.error(
            "Comment editing error:",
            error
          );


          window.alert(
            error.message ||
            "Unable to edit this comment."
          );

        }finally{

          editButton.disabled =
          false;


          editButton.textContent =
          "✏️ Edit";

        }

      }

    );

  }


  /* =====================================================
     DELETE COMMENT
  ===================================================== */

  if(deleteButton){

    deleteButton.addEventListener(

      "click",

      async()=>{

        const confirmation =
        window.confirm(
          "Are you sure you want to delete this comment?"
        );


        if(!confirmation){

          return;

        }


        deleteButton.disabled =
        true;


        deleteButton.textContent =
        "Deleting...";


        try{

          const commentReference =
          doc(

            db,
            "communityPosts",
            postId,
            "comments",
            commentData.id

          );


          const latestCommentSnapshot =
          await getDoc(
            commentReference
          );


          if(
            !latestCommentSnapshot.exists()
          ){

            throw new Error(
              "This comment has already been deleted."
            );

          }


          const latestCommentData =
          latestCommentSnapshot.data();


          const latestOwnerId =
          getFirstValue(

            latestCommentData.userId,
            latestCommentData.authorId,
            latestCommentData.uid,
            latestCommentData.senderId

          );


          if(
            latestOwnerId !==
            currentUser.uid
          ){

            throw new Error(
              "You can only delete your own comment."
            );

          }


          await deleteDoc(
            commentReference
          );


          /*
            If the user had this exact comment
            open as their reply target, clear the
            banner so they cannot submit a reply
            pointing at a comment that no longer
            exists.
          */

          if(
            replyingTo &&
            replyingTo.id ===
            commentData.id
          ){

            clearReplyTarget();

          }


          try{

            await updateDoc(

              doc(
                db,
                "communityPosts",
                postId
              ),

              {
                commentsCount:
                increment(-1)
              }

            );

          }catch(error){

            console.error(
              "Comment count update error:",
              error
            );

          }

        }catch(error){

          console.error(
            "Comment deletion error:",
            error
          );


          window.alert(
            error.message ||
            "Unable to delete this comment."
          );


          deleteButton.disabled =
          false;


          deleteButton.textContent =
          "🗑️ Delete";

        }

      }

    );

  }

}

  "offline",

  ()=>{

    showFormMessage(

      "You are currently offline.",

      "error"

    );

  }

);


/* =====================================================
   PAGE CLEANUP
===================================================== */

window.addEventListener(

  "beforeunload",

  ()=>{

    stopCommentsListener();

  }

);


/* =====================================================
   GLOBAL ERROR HANDLING
===================================================== */

window.addEventListener(

  "error",

  (event)=>{

    console.error(

      "JavaScript Error:",

      event.error

    );

  }

);


window.addEventListener(

  "unhandledrejection",

  (event)=>{

    console.error(

      "Unhandled Promise:",

      event.reason

    );

  }

);


/* =====================================================
   PAGE READY
===================================================== */

console.log(

  "comments.html loaded successfully."

);

  </script>

</body>

</html>
