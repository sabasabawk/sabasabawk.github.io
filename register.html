
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register</title>

<style>

body{
font-family:Arial,sans-serif;
background:#eef3f8;
margin:0;
padding:20px;
}

.container{
max-width:450px;
margin:auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#0066cc;
}

input{
width:100%;
padding:12px;
margin-top:15px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
font-size:16px;
}

button{
width:100%;
margin-top:20px;
padding:12px;
background:#0066cc;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#004d99;
}

#message{
margin-top:20px;
text-align:center;
font-weight:bold;
}

.link{
text-align:center;
margin-top:20px;
}

.link a{
text-decoration:none;
color:#0066cc;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>Create Account</h1>

<input
type="text"
id="name"
placeholder="Full Name">

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="alert('Button clicked'); register();">
Create Account
</button>

<div id="message"></div>

<div class="link">

Already have an account?

<a href="login.html">
Login
</a>

</div>

</div>

<script type="module">

import {
  auth,
  db,
  createUserWithEmailAndPassword,
  doc,
  setDoc,
  serverTimestamp
} from "./firebase.js";


window.register = async function(){

  const name =
  document
  .getElementById("name")
  .value
  .trim();


  const email =
  document
  .getElementById("email")
  .value
  .trim();


  const password =
  document
  .getElementById("password")
  .value;


  const message =
  document.getElementById("message");


  if(
    name === "" ||
    email === "" ||
    password === ""
  ){

    message.style.color =
    "red";

    message.innerHTML =
    "Please fill in all fields.";

    return;

  }


  if(password.length < 6){

    message.style.color =
    "red";

    message.innerHTML =
    "Password must contain at least 6 characters.";

    return;

  }


  message.style.color =
  "";

  message.innerHTML =
  "Creating your account...";


  try{

    const userCredential =
    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );


    const user =
    userCredential.user;


    await setDoc(

      doc(
        db,
        "users",
        user.uid
      ),

      {

        fullName:
        name,

        email:
        email,

        bio:
        "",

        about:
        "",

        country:
        "",

        favoriteVerse:
        "",

        profilePicture:
        "",

        totalPosts:
        0,

        certificates:
        0,

        joinedAt:
        serverTimestamp()

      }

    );


    localStorage.setItem(
      "userName",
      name
    );


    localStorage.setItem(
      "userEmail",
      email
    );


    message.style.color =
    "green";

    message.innerHTML =
    "✅ Registration successful!";


    setTimeout(()=>{

      window.location.href =
      "login.html";

    },1500);


  }catch(error){

    console.error(
      "Registration error:",
      error
    );


    message.style.color =
    "red";


    if(
      error.code ===
      "auth/email-already-in-use"
    ){

      message.innerHTML =
      "This email address is already registered.";

    }else if(
      error.code ===
      "auth/invalid-email"
    ){

      message.innerHTML =
      "Please enter a valid email address.";

    }else if(
      error.code ===
      "auth/weak-password"
    ){

      message.innerHTML =
      "Please choose a stronger password.";

    }else{

      message.innerHTML =
      error.message ||
      "Registration failed.";

    }

  }

};

</script>

</body>
</html>
