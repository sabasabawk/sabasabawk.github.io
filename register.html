
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register</title>

<style>

body{
font-family:Arial,sans-serif;
background:#eef3f8;
margin:0;
padding:20px;
}

.container{
max-width:450px;
margin:auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#0066cc;
}

input{
width:100%;
padding:12px;
margin-top:15px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
font-size:16px;
}

button{
width:100%;
margin-top:20px;
padding:12px;
background:#0066cc;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#004d99;
}

#message{
margin-top:20px;
text-align:center;
font-weight:bold;
}

.link{
text-align:center;
margin-top:20px;
}

.link a{
text-decoration:none;
color:#0066cc;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>Create Account</h1>

<input
type="text"
id="name"
placeholder="Full Name">

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="alert('Button clicked'); register();">
Create Account
</button>

<div id="message"></div>

<div class="link">

Already have an account?

<a href="login.html">
Login
</a>

</div>

</div>

<script type="module">

import {
auth,
createUserWithEmailAndPassword
}
from "./firebase.js";

window.register = function(){

let name =
document.getElementById("name").value;

let email =
document.getElementById("email").value;

let password =
document.getElementById("password").value;

if(name=="" || email=="" || password==""){

document.getElementById("message").innerHTML =
"Please fill in all fields.";

return;

}

createUserWithEmailAndPassword(auth,email,password)

.then((userCredential)=>{

localStorage.setItem("userName",name);
localStorage.setItem("userEmail",email);

document.getElementById("message").style.color="green";

document.getElementById("message").innerHTML =
"✅ Registration successful!";

setTimeout(function(){

window.location.href="login.html";

},1500);

})

.catch((error)=>{

document.getElementById("message").style.color="red";

document.getElementById("message").innerHTML =
error.message;

});

}

</script>

</body>
</html>
