<style>

.callMessage.error{border-color:rgba(231,76,60,.60);background:rgba(95,20,20,.88);color:#ffc1c1}

.videoControlsArea{position:absolute;left:0;right:0;bottom:0;z-index:190;width:100%;padding:18px 12px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:15px;background:linear-gradient(to top,rgba(2,10,17,.98),rgba(2,10,17,.75),transparent)}
.activeVideoControls{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.videoControlButton{min-height:76px;padding:9px 4px;border:1px solid rgba(255,255,255,.14);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:rgba(255,255,255,.09);color:#fff;font-size:10px;font-weight:900;backdrop-filter:blur(8px)}
.videoControlButton.active{border-color:rgba(46,204,113,.58);background:rgba(46,204,113,.18);color:#baf7cf}
.videoControlButton.warning{border-color:rgba(245,176,65,.62);background:rgba(245,176,65,.18);color:#ffe5a5}

.videoControlIcon{width:45px;height:45px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.11);font-size:21px}
.controlLabel{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.endVideoCallButton{width:74px;height:74px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--danger);color:#fff;font-size:29px;box-shadow:0 10px 28px rgba(231,76,60,.40)}

.incomingVideoActionButton.reject{background:var(--danger)}
.incomingVideoActionButton:disabled{cursor:not-allowed;opacity:.55}

@media(max-width:520px){.videoCallHeader{padding-left:9px;padding-right:9px}.backButton,.securityIcon{width:40px;height:40px}.callStatusArea{top:72px;width:calc(100% - 125px)}.activeVideoControls{gap:6px}.videoControlButton{min-height:69px;border-radius:15px;font-size:9px}.videoControlIcon{width:40px;height:40px;font-size:18px}.callMessage{bottom:125px}}

#miniName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

body.callMinimized>*:not(#miniBar):not(#appFrame):not(#miniToast):not(audio):not(script){visibility:hidden;pointer-events:none}
</style>

<script type="module">
import{
  auth, db, collection, addDoc, doc, getDoc, setDoc, updateDoc,
  onSnapshot, serverTimestamp, onAuthStateChanged
}from "./firebase.js";
if(window.self!==window.top){ throw new Error("Call pages cannot open inside the call window."); }

/* =====================================================
   WEBRTC SERVERS
   !!! Replace the TURN entries with your OWN credentials
   (Metered.ca, Twilio, Cloudflare...). The "openrelay"
   entries are public test servers and may be limited.
===================================================== */
const TURN_SERVERS=[
  {urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turns:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"}
];
const rtcConfiguration={
  iceServers:[
    {urls:"stun:stun.l.google.com:19302"},
    {urls:"stun:stun1.l.google.com:19302"},
    {urls:"stun:stun2.l.google.com:19302"},
    ...TURN_SERVERS
  ],
  iceCandidatePoolSize:10
};

/* ===== ELEMENTS ===== */
const $=id=>document.getElementById(id);
const remoteVideo=$("remoteVideo"),localVideo=$("localVideo"),remotePlaceholder=$("remotePlaceholder"),remoteAvatar=$("remoteAvatar"),
remoteName=$("remoteName"),remoteCountry=$("remoteCountry"),headerTitle=$("headerTitle"),headerSubtitle=$("headerSubtitle"),
callStatus=$("callStatus"),callTimer=$("callTimer"),connectionDot=$("connectionDot"),connectionText=$("connectionText"),
callMessage=$("callMessage"),microphoneButton=$("microphoneButton"),cameraButton=$("cameraButton"),switchCameraButton=$("switchCameraButton"),
speakerButton=$("speakerButton"),rejectVideoCallButton=$("rejectVideoCallButton"),acceptVideoCallButton=$("acceptVideoCallButton"),
endVideoCallButton=$("endVideoCallButton"),backButton=$("backButton"),remoteAudio=$("remoteAudio"),
activeVideoControls=$("activeVideoControls"),incomingVideoControls=$("incomingVideoControls"),outgoingVideoControls=$("outgoingVideoControls"),
microphoneIcon=$("microphoneIcon"),microphoneLabel=$("microphoneLabel"),cameraIcon=$("cameraIcon"),cameraLabel=$("cameraLabel"),
switchCameraIcon=$("switchCameraIcon"),speakerIcon=$("speakerIcon"),speakerLabel=$("speakerLabel"),localPreview=$("localPreview");

/* ===== STATE ===== */
let currentUser=null,currentProfile={},otherUserId="",otherProfile={},callId="",callRole="caller",callData={};
let peerConnection=null,localStream=null,remoteStream=null,currentFacingMode="user";
let microphoneMuted=false,cameraDisabled=false,speakerMuted=false;
let unsubscribeCall=null,unsubscribeCallerCandidates=null,unsubscribeReceiverCandidates=null;
let callTimerInterval=null,callStartedAt=null;
let pageClosing=false,outgoingCallStarted=false,callActionRunning=false;
let receiverAnswerApplied=false,lastCallStatus="",callFinished=false;
const processedCallerCandidateIds=new Set(),processedReceiverCandidateIds=new Set();
const pendingCallerCandidates=[],pendingReceiverCandidates=[];
const FINAL_STATUSES=["ended","rejected","cancelled","missed","failed"];

function getFirstValue(...values){
  for(const v of values){ if(v!==undefined&&v!==null&&String(v).trim()!=="") return String(v).trim(); }
  return "";
}

/* ===== ICE DIAGNOSTICS (own line, never overwritten) ===== */
const iceDebug=document.createElement("div");
iceDebug.style.cssText="margin-top:8px;font-size:11px;line-height:1.4;color:#9fb3c8;text-align:center;word-break:break-word;padding:0 12px;";
connectionText.parentElement.insertAdjacentElement("afterend",iceDebug);
const iceInfo={state:"new",conn:"new",host:0,srflx:0,relay:0,remote:0,err:""};
function renderIceDebug(){ iceDebug.textContent="ICE: "+iceInfo.state+" | conn: "+iceInfo.conn+" | local host "+iceInfo.host+", stun "+iceInfo.srflx+", turn "+iceInfo.relay+" | remote "+iceInfo.remote+(iceInfo.err?" | err "+iceInfo.err:""); }
function attachIceDiagnostics(pc){
  pc.addEventListener("icecandidate",e=>{
    if(!e.candidate) return;
    const t=e.candidate.type||((e.candidate.candidate||"").match(/ typ (\w+)/)||[])[1];
    if(t==="host") iceInfo.host++; else if(t==="srflx") iceInfo.srflx++; else if(t==="relay") iceInfo.relay++;
    renderIceDebug();
  });
  pc.addEventListener("icecandidateerror",e=>{ if(!/^(READ|WRITE)/.test(iceInfo.err)) iceInfo.err="TURN "+(e.errorCode||"")+" "+(e.url||"").replace(/^turns?:|^stuns?:/,"").slice(0,24); renderIceDebug(); });
}
renderIceDebug();

/* ===== URL ===== */
const params=new URLSearchParams(window.location.search);
otherUserId=params.get("user")||params.get("uid")||"";
callId=params.get("call")||"";
callRole=callId?"receiver":"caller";

/* ===== UI HELPERS ===== */
function showCallMessage(m,isError=false){ callMessage.textContent=m; callMessage.classList.remove("hidden","error"); if(isError) callMessage.classList.add("error"); }
function hideCallMessage(){ callMessage.textContent=""; callMessage.classList.add("hidden"); callMessage.classList.remove("error"); }
function updateCallStatus(status,text){ callStatus.className="callStatus"; if(status) callStatus.classList.add(status); callStatus.textContent=text; }
function updateConnectionDisplay(state){
  connectionDot.className="connectionDot";
  if(state==="connecting"){ connectionDot.classList.add("connecting"); connectionText.textContent="Connecting video call"; }
  else if(state==="connected"){ connectionDot.classList.add("connected"); connectionText.textContent="Video call connected"; }
  else if(state==="failed"){ connectionDot.classList.add("failed"); connectionText.textContent="Connection failed"; }
  else if(state==="ended"){ connectionDot.classList.add("failed"); connectionText.textContent="Call ended"; }
  else connectionText.textContent="Waiting for connection";
}
function showCallError(message){
  showCallMessage(message,true);
  updateCallStatus("ended","Call unavailable");
  updateConnectionDisplay("failed");
  activeVideoControls.classList.add("hidden");
  incomingVideoControls.classList.remove("show");
  outgoingVideoControls.classList.remove("hidden");
  endVideoCallButton.disabled=false;
}
async function loadUserProfile(userId){
  if(!userId) return {};
  try{ const s=await getDoc(doc(db,"users",userId)); if(s.exists()) return {id:s.id,...s.data()}; }
  catch(e){ console.error("Profile loading error:",e); }
  return {id:userId};
}
const getProfileName=(p,f="Faith Connect Member")=>getFirstValue(p?.fullName,p?.name,p?.displayName,p?.username,f);
const getProfilePicture=p=>getFirstValue(p?.profilePicture,p?.picture,p?.photoURL,p?.photoUrl,p?.imageUrl,"images/profile.png");
const getProfileCountry=p=>getFirstValue(p?.country,p?.location);

function displayOtherMember(){
  const name=getProfileName(otherProfile);
  remoteName.textContent=name; headerTitle.textContent=name;
  remoteAvatar.src=getProfilePicture(otherProfile);
  const c=getProfileCountry(otherProfile);
  if(c){ remoteCountry.textContent="🌍 "+c; remoteCountry.classList.remove("hidden"); }
  else{ remoteCountry.textContent=""; remoteCountry.classList.add("hidden"); }
}
remoteAvatar.addEventListener("error",()=>{ remoteAvatar.src="images/profile.png"; },{once:true});
function showRemotePlaceholder(){ remotePlaceholder.classList.remove("hidden"); remoteVideo.classList.add("hidden"); }
function showRemoteVideo(){ remotePlaceholder.classList.add("hidden"); remoteVideo.classList.remove("hidden"); }

function updateMicrophoneButton(){
  microphoneButton.classList.toggle("warning",microphoneMuted); microphoneButton.classList.toggle("active",!microphoneMuted);
  microphoneIcon.textContent=microphoneMuted?"🔇":"🎙️"; $("microphoneLabel").textContent=microphoneMuted?"Unmute":"Mute";
}
function updateCameraButton(){
  cameraButton.classList.toggle("warning",cameraDisabled); cameraButton.classList.toggle("active",!cameraDisabled);
  cameraIcon.textContent=cameraDisabled?"🚫":"📹"; cameraLabel.textContent=cameraDisabled?"Start Camera":"Stop Camera";
  localPreview.classList.toggle("hidden",cameraDisabled||!localStream);
}
function updateSpeakerButton(){
  speakerButton.classList.toggle("warning",speakerMuted); speakerButton.classList.toggle("active",!speakerMuted);
  speakerIcon.textContent=speakerMuted?"🔈":"🔊"; speakerLabel.textContent=speakerMuted?"Unmute Sound":"Speaker";
}

/* ===== TIMER ===== */
function startCallTimer(){
  if(callTimerInterval) return;
  callStartedAt=Date.now(); callTimer.textContent="00:00";
  callTimerInterval=setInterval(()=>{
    const t=Math.floor((Date.now()-callStartedAt)/1000),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;
    const p=n=>String(n).padStart(2,"0");
    callTimer.textContent=h>0?`${p(h)}:${p(m)}:${p(s)}`:`${p(m)}:${p(s)}`;
  },1000);
}
function stopCallTimer(){ if(callTimerInterval) clearInterval(callTimerInterval); callTimerInterval=null; callStartedAt=null; }

/* ===== CAMERA + MICROPHONE ===== */
async function requestLocalMedia(){
  if(localStream) return localStream;
  if(!navigator.mediaDevices||typeof navigator.mediaDevices.getUserMedia!=="function")
    throw new Error("Camera and microphone access are not supported by this browser.");
  try{
    localStream=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},
      video:{facingMode:{ideal:currentFacingMode},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:24,max:30}}
    });
    localVideo.srcObject=localStream; localVideo.muted=true; localVideo.playsInline=true;
    await localVideo.play().catch(()=>{});
    microphoneMuted=false; cameraDisabled=false;
    updateMicrophoneButton(); updateCameraButton();
    return localStream;
  }catch(error){
    console.error("Camera/microphone error:",error);
    if(error?.name==="NotAllowedError"||error?.name==="PermissionDeniedError") throw new Error("Camera or microphone permission was denied. Allow access in your browser settings and try again.");
    if(error?.name==="NotFoundError"||error?.name==="DevicesNotFoundError") throw new Error("No camera or microphone was found on this device.");
    if(error?.name==="NotReadableError"||error?.name==="TrackStartError") throw new Error("The camera or microphone is being used by another application.");
    if(error?.name==="OverconstrainedError") throw new Error("Your device camera does not support the requested video settings.");
    throw new Error("The camera and microphone could not be opened.");
  }
}
const getLocalAudioTrack=()=>localStream?localStream.getAudioTracks()[0]||null:null;
const getLocalVideoTrack=()=>localStream?localStream.getVideoTracks()[0]||null:null;

/* ===== PEER CONNECTION ===== */
function playRemoteMedia(){
  remoteVideo.play().catch(()=>{});
  remoteAudio.play().catch(()=>{});
}
function checkRemoteVideoTrack(){
  if(!remoteStream){ showRemotePlaceholder(); return; }
  const active=remoteStream.getVideoTracks().find(t=>t.readyState==="live"&&t.muted!==true);
  if(active) showRemoteVideo(); else showRemotePlaceholder();
}
function addRemoteTrack(track){
  if(!track||!remoteStream) return;
  if(!remoteStream.getTracks().some(x=>x.id===track.id)) remoteStream.addTrack(track);
}
function handleRemoteTrack(event){
  if(!remoteStream){ remoteStream=new MediaStream(); remoteVideo.srcObject=remoteStream; remoteAudio.srcObject=remoteStream; }
  if(event.streams&&event.streams.length) event.streams.forEach(s=>s.getTracks().forEach(addRemoteTrack));
  else if(event.track) addRemoteTrack(event.track);
  if(event.track){
    event.track.addEventListener("unmute",()=>{ if(event.track.kind==="video") showRemoteVideo(); playRemoteMedia(); });
    event.track.addEventListener("mute",()=>{ if(event.track.kind==="video") checkRemoteVideoTrack(); });
    event.track.addEventListener("ended",()=>{ if(event.track.kind==="video") checkRemoteVideoTrack(); });
  }
  playRemoteMedia(); checkRemoteVideoTrack();
}
function handleConnectionState(){
  if(!peerConnection) return;
  const state=peerConnection.connectionState;
  console.log("Video connection state:",state); iceInfo.conn=state; renderIceDebug();
  if(state==="connecting"){ updateConnectionDisplay("connecting"); updateCallStatus("ringing","Connecting..."); }
  else if(state==="connected"){
    updateConnectionDisplay("connected"); updateCallStatus("connected","Connected"); hideCallMessage();
    enableVideoControls(); startCallTimer(); playRemoteMedia(); checkRemoteVideoTrack(); markConnected();
  }else if(state==="disconnected"){
    connectionText.textContent="Connection interrupted"; showCallMessage("The connection was interrupted. Trying to reconnect...");
  }else if(state==="failed"){
    updateConnectionDisplay("failed"); updateCallStatus("ended","Connection failed");
    showCallMessage("The video connection failed. End the call and try again.",true);
  }
}
function handleIceConnectionState(){
  if(!peerConnection) return;
  const s=peerConnection.iceConnectionState;
  console.log("Video ICE state:",s);
  iceInfo.state=s; renderIceDebug();
  if(s==="failed"){
    connectionDot.className="connectionDot failed";
    showCallMessage("The two phones could not reach each other. A TURN server is probably needed.",true);
  }
}
async function createPeerConnection(){
  if(peerConnection) return peerConnection;
  peerConnection=new RTCPeerConnection(rtcConfiguration);
  attachIceDiagnostics(peerConnection);
  remoteStream=new MediaStream();
  remoteVideo.srcObject=remoteStream; remoteAudio.srcObject=remoteStream;
  const media=await requestLocalMedia();
  media.getTracks().forEach(t=>peerConnection.addTrack(t,media));
  peerConnection.addEventListener("track",handleRemoteTrack);
  peerConnection.addEventListener("connectionstatechange",handleConnectionState);
  peerConnection.addEventListener("iceconnectionstatechange",handleIceConnectionState);
  return peerConnection;
}

function enableVideoControls(){
  [microphoneButton,cameraButton,switchCameraButton,speakerButton].forEach(b=>b.disabled=false);
  endVideoCallButton.disabled=false;
  activeVideoControls.classList.remove("hidden");
  incomingVideoControls.classList.remove("show");
  outgoingVideoControls.classList.remove("hidden");
}
function disableVideoControls(){ [microphoneButton,cameraButton,switchCameraButton,speakerButton].forEach(b=>b.disabled=true); }

async function markConnected(){
  if(!callId||lastCallStatus==="connected"||callFinished) return;
  try{ await updateDoc(doc(db,"videoCalls",callId),{status:"connected",updatedAt:serverTimestamp()}); lastCallStatus="connected"; }
  catch(e){ console.log("Could not mark connected:",e); }
}

/* ===== CLEANUP ===== */
function cleanupLocalMedia(){
  if(localStream) localStream.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} });
  localStream=null; localVideo.pause(); localVideo.srcObject=null; localPreview.classList.add("hidden");
}
function cleanupRemoteMedia(){
  remoteVideo.pause(); remoteAudio.pause(); remoteVideo.srcObject=null; remoteAudio.srcObject=null;
  if(remoteStream) remoteStream.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} });
  remoteStream=null; showRemotePlaceholder();
}
function cleanupPeerConnection(){
  if(!peerConnection) return;
  try{
    peerConnection.removeEventListener("track",handleRemoteTrack);
    peerConnection.removeEventListener("connectionstatechange",handleConnectionState);
    peerConnection.removeEventListener("iceconnectionstatechange",handleIceConnectionState);
    peerConnection.close();
  }catch(e){ console.error(e); }
  peerConnection=null;
}
function stopCallDocumentListener(){ if(typeof unsubscribeCall==="function") unsubscribeCall(); unsubscribeCall=null; }
function stopCallerCandidateListener(){ if(typeof unsubscribeCallerCandidates==="function") unsubscribeCallerCandidates(); unsubscribeCallerCandidates=null; }
function stopReceiverCandidateListener(){ if(typeof unsubscribeReceiverCandidates==="function") unsubscribeReceiverCandidates(); unsubscribeReceiverCandidates=null; }
function cleanupVideoCallResources(){
  stopCallTimer(); stopCallDocumentListener(); stopCallerCandidateListener(); stopReceiverCandidateListener();
  cleanupPeerConnection(); cleanupLocalMedia(); cleanupRemoteMedia();
}
function resetIceCandidateState(){
  processedCallerCandidateIds.clear(); processedReceiverCandidateIds.clear();
  pendingCallerCandidates.length=0; pendingReceiverCandidates.length=0;
}

/* ===== ICE CANDIDATES ===== */
const peerHasRemoteDescription=()=>Boolean(peerConnection&&peerConnection.remoteDescription&&peerConnection.remoteDescription.type);
async function addRemoteIceCandidate(data,pending){
  if(!data||!peerConnection) return;
  try{
    const c=new RTCIceCandidate(data); iceInfo.remote++; renderIceDebug();
    if(peerHasRemoteDescription()) await peerConnection.addIceCandidate(c); else pending.push(c);
  }catch(e){ console.error("Remote ICE error:",e); }
}
async function applyPendingCandidates(pending){
  if(!peerConnection||!peerHasRemoteDescription()) return;
  while(pending.length){
    const c=pending.shift();
    try{ await peerConnection.addIceCandidate(c); }catch(e){ console.error("Pending ICE error:",e); }
  }
}
function watchCandidates(sub,processed,pending){
  return onSnapshot(collection(db,"videoCalls",callId,sub),snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type!=="added"||processed.has(ch.doc.id)) return;
      processed.add(ch.doc.id); addRemoteIceCandidate(ch.doc.data(),pending);
    });
  },err=>{ console.error("listener error:",err); iceInfo.err="READ "+(err.code||err.message); renderIceDebug(); });
}
function startCallerCandidateListener(){ stopCallerCandidateListener(); if(callId) unsubscribeCallerCandidates=watchCandidates("callerCandidates",processedCallerCandidateIds,pendingCallerCandidates); }
function startReceiverCandidateListener(){ stopReceiverCandidateListener(); if(callId) unsubscribeReceiverCandidates=watchCandidates("receiverCandidates",processedReceiverCandidateIds,pendingReceiverCandidates); }

/* ===== OUTGOING ===== */
function getCurrentCallerInformation(){
  return {
    callerName:getProfileName(currentProfile,getFirstValue(currentUser?.displayName,currentUser?.email,"Faith Connect Member")),
    callerPicture:getFirstValue(getProfilePicture(currentProfile),currentUser?.photoURL,"images/profile.png"),
    callerCountry:getProfileCountry(currentProfile)
  };
}
async function prepareOutgoingCall(){
  if(!currentUser||!otherUserId){ showCallError("The member information is missing."); return; }
  if(otherUserId===currentUser.uid){ showCallError("You cannot start a video call with your own account."); return; }
  try{
    otherProfile=await loadUserProfile(otherUserId);
    displayOtherMember();
    headerSubtitle.textContent="Outgoing private video call";
    updateCallStatus("ringing","Starting video call...");
    updateConnectionDisplay("connecting");
    showRemotePlaceholder();
    endVideoCallButton.disabled=false;
    await startOutgoingVideoCall();
  }catch(error){
    console.error("Outgoing preparation error:",error);
    showCallError(error?.message||"The video call could not be prepared.");
  }
}
async function startOutgoingVideoCall(){
  if(outgoingCallStarted||callActionRunning) return;
  outgoingCallStarted=true; callActionRunning=true;
  try{
    const connection=await createPeerConnection();
    const ref=doc(collection(db,"videoCalls"));
    callId=ref.id;
    const caller=getCurrentCallerInformation();

    connection.addEventListener("icecandidate",async event=>{
      if(!event.candidate||!callId) return;
      try{ await addDoc(collection(db,"videoCalls",callId,"callerCandidates"),event.candidate.toJSON()); }
      catch(e){ console.error("Caller ICE save error:",e); iceInfo.err="WRITE "+(e.code||e.message); renderIceDebug(); }
    });

    const offer=await connection.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:true});
    await connection.setLocalDescription(offer);

    await setDoc(ref,{
      type:"video",callType:"video",
      callerId:currentUser.uid,callerName:caller.callerName,callerPicture:caller.callerPicture,callerCountry:caller.callerCountry,
      receiverId:otherUserId,receiverName:getProfileName(otherProfile),receiverPicture:getProfilePicture(otherProfile),receiverCountry:getProfileCountry(otherProfile),
      offer:{type:offer.type,sdp:offer.sdp},answer:null,status:"ringing",
      acceptedAt:null,endedAt:null,endedBy:null,
      createdAt:serverTimestamp(),updatedAt:serverTimestamp()
    });

    callData={id:callId,callerId:currentUser.uid,receiverId:otherUserId,status:"ringing"};
    startCallDocumentListener();
    startReceiverCandidateListener();
    updateCallStatus("ringing","Calling...");
    showCallMessage("Calling "+getProfileName(otherProfile)+"...");
    console.log("Outgoing video call created:",callId);
  }catch(error){
    console.error("Outgoing call error:",error);
    outgoingCallStarted=false;
    showCallError(error?.code==="permission-denied"?"Firebase denied permission to create the video call.":(error?.message||"Unable to start video call."));
    cleanupPeerConnection(); cleanupLocalMedia(); cleanupRemoteMedia();
  }finally{ callActionRunning=false; }
}

/* ===== INCOMING ===== */
async function prepareIncomingCall(){
  if(!currentUser||!callId){ showCallError("The incoming video-call information is missing."); return; }
  try{
    const snap=await getDoc(doc(db,"videoCalls",callId));
    if(!snap.exists()){ showCallError("This video call no longer exists."); return; }
    callData={id:snap.id,...snap.data()};
    if(callData.receiverId!==currentUser.uid){ showCallError("You are not the receiver of this video call."); return; }
    if(FINAL_STATUSES.includes(getFirstValue(callData.status,"ringing").toLowerCase())){ showCallError("This video call has already ended."); return; }
    otherUserId=getFirstValue(callData.callerId);
    otherProfile=await loadUserProfile(otherUserId);
    otherProfile={...otherProfile,
      fullName:getFirstValue(otherProfile.fullName,otherProfile.name,callData.callerName),
      profilePicture:getFirstValue(otherProfile.profilePicture,otherProfile.photoURL,callData.callerPicture),
      country:getFirstValue(otherProfile.country,callData.callerCountry)};
    displayOtherMember();
    headerSubtitle.textContent="Incoming private video call";
    updateCallStatus("ringing","Incoming video call");
    updateConnectionDisplay("connecting");
    showRemotePlaceholder();
    incomingVideoControls.classList.add("show");
    outgoingVideoControls.classList.add("hidden");
    activeVideoControls.classList.add("hidden");
    acceptVideoCallButton.disabled=false; rejectVideoCallButton.disabled=false;
    startCallDocumentListener();
  }catch(error){
    console.error("Incoming preparation error:",error);
    showCallError(error?.message||"The incoming video call could not be opened.");
  }
}

async function acceptIncomingVideoCall(){
  if(callActionRunning||!currentUser||!callId) return;
  callActionRunning=true;
  acceptVideoCallButton.disabled=true; rejectVideoCallButton.disabled=true; acceptVideoCallButton.textContent="…";
  hideCallMessage(); updateCallStatus("ringing","Connecting..."); updateConnectionDisplay("connecting");
  try{
    const ref=doc(db,"videoCalls",callId);
    const snap=await getDoc(ref);
    if(!snap.exists()) throw new Error("This video call no longer exists.");
    const latest=snap.data();
    if(latest.receiverId!==currentUser.uid) throw new Error("You are not allowed to accept this video call.");
    if(FINAL_STATUSES.includes(getFirstValue(latest.status).toLowerCase())) throw new Error("This video call has already ended.");
    if(!latest.offer) throw new Error("The caller's connection information is missing.");
    callData={id:callId,...latest};

    const connection=await createPeerConnection();
    connection.addEventListener("icecandidate",async event=>{
      if(!event.candidate||!callId) return;
      try{ await addDoc(collection(db,"videoCalls",callId,"receiverCandidates"),event.candidate.toJSON()); }
      catch(e){ console.error("Receiver ICE save error:",e); iceInfo.err="WRITE "+(e.code||e.message); renderIceDebug(); }
    });

    await connection.setRemoteDescription(new RTCSessionDescription(latest.offer));
    startCallerCandidateListener();
    await applyPendingCandidates(pendingCallerCandidates);
    const answerDescription=await connection.createAnswer();
    await connection.setLocalDescription(answerDescription);
    const answer={type:answerDescription.type,sdp:answerDescription.sdp};

    await updateDoc(ref,{answer,status:"accepted",acceptedAt:serverTimestamp(),updatedAt:serverTimestamp()});
    callData.answer=answer; callData.status="accepted";
    startCallDocumentListener();

    incomingVideoControls.classList.remove("show");
    outgoingVideoControls.classList.remove("hidden");
    activeVideoControls.classList.remove("hidden");
    endVideoCallButton.disabled=false;
    showCallMessage("Video call accepted. Connecting camera and sound...");
    playRemoteMedia();
  }catch(error){
    console.error("Accept error:",error);
    showCallError(error?.code==="permission-denied"?"Firebase denied permission to accept this video call.":(error?.message||"The video call could not be accepted."));
    cleanupPeerConnection(); cleanupLocalMedia(); cleanupRemoteMedia();
  }finally{
    callActionRunning=false;
    acceptVideoCallButton.disabled=false; rejectVideoCallButton.disabled=false; acceptVideoCallButton.textContent="📹";
  }
}

async function rejectIncomingVideoCall(){
  if(callActionRunning||!currentUser||!callId) return;
  callActionRunning=true;
  acceptVideoCallButton.disabled=true; rejectVideoCallButton.disabled=true; rejectVideoCallButton.textContent="…";
  try{
    await updateDoc(doc(db,"videoCalls",callId),{status:"rejected",endedBy:currentUser.uid,endedAt:serverTimestamp(),updatedAt:serverTimestamp()});
    callFinished=true; callData.status="rejected";
    updateCallStatus("ended","Call rejected"); updateConnectionDisplay("ended");
    incomingVideoControls.classList.remove("show"); activeVideoControls.classList.add("hidden");
    outgoingVideoControls.classList.remove("hidden"); endVideoCallButton.disabled=true;
    showCallMessage("You rejected this video call.");
    cleanupVideoCallResources();
    setTimeout(()=>{ window.location.href="messages.html"; },1200);
  }catch(error){
    console.error("Reject error:",error);
    showCallMessage(error?.message||"The video call could not be rejected.",true);
    acceptVideoCallButton.disabled=false; rejectVideoCallButton.disabled=false; rejectVideoCallButton.textContent="📵";
  }finally{ callActionRunning=false; }
}
acceptVideoCallButton.addEventListener("click",acceptIncomingVideoCall);
rejectVideoCallButton.addEventListener("click",rejectIncomingVideoCall);

/* ===== ANSWER (caller) — flag set BEFORE await ===== */
async function applyReceiverAnswer(answerData){
  if(callRole!=="caller"||!answerData||!peerConnection||receiverAnswerApplied) return;
  receiverAnswerApplied=true;
  try{
    await peerConnection.setRemoteDescription(new RTCSessionDescription(answerData));
    await applyPendingCandidates(pendingReceiverCandidates);
    updateCallStatus("ringing","Connecting..."); updateConnectionDisplay("connecting"); hideCallMessage();
    console.log("Receiver video answer applied.");
  }catch(error){
    receiverAnswerApplied=false;
    console.error("Answer error:",error);
    updateConnectionDisplay("failed");
    showCallMessage("The member answered, but the video connection could not be completed.",true);
  }
}

/* ===== LIVE CALL DOCUMENT ===== */
function finishCallScreen(statusText,messageText){
  callFinished=true;
  stopCallTimer();
  incomingVideoControls.classList.remove("show"); activeVideoControls.classList.add("hidden"); outgoingVideoControls.classList.remove("hidden");
  disableVideoControls(); endVideoCallButton.disabled=true;
  updateCallStatus("ended",statusText); updateConnectionDisplay("ended");
  if(messageText) showCallMessage(messageText);
  cleanupVideoCallResources();
}
async function handleLiveCallStatus(status,d){
  if(callFinished) return;
  switch(status){
    case "ringing":
      updateCallStatus("ringing",callRole==="caller"?"Ringing...":"Incoming video call");
      updateConnectionDisplay("connecting"); showRemotePlaceholder();
      if(callRole==="receiver"){ incomingVideoControls.classList.add("show"); outgoingVideoControls.classList.add("hidden"); activeVideoControls.classList.add("hidden"); }
      else{ incomingVideoControls.classList.remove("show"); outgoingVideoControls.classList.remove("hidden"); activeVideoControls.classList.add("hidden"); endVideoCallButton.disabled=false; }
      break;
    case "accepted":
    case "connecting":
      incomingVideoControls.classList.remove("show"); outgoingVideoControls.classList.remove("hidden"); activeVideoControls.classList.remove("hidden");
      endVideoCallButton.disabled=false;
      if(!peerConnection||peerConnection.connectionState!=="connected"){ updateCallStatus("ringing","Connecting..."); updateConnectionDisplay("connecting"); }
      if(callRole==="caller"){
        if(d.answer&&!receiverAnswerApplied) await applyReceiverAnswer(d.answer);
        await applyPendingCandidates(pendingReceiverCandidates);
      }else await applyPendingCandidates(pendingCallerCandidates);
      break;
    case "connected":
      if(callRole==="caller"&&d.answer&&!receiverAnswerApplied) await applyReceiverAnswer(d.answer);
      if(peerConnection&&peerConnection.connectionState==="connected"){
        updateCallStatus("connected","Connected"); updateConnectionDisplay("connected"); enableVideoControls(); startCallTimer();
      }
      break;
    case "rejected": finishCallScreen("Call rejected",callRole==="caller"?"The member rejected your video call.":"You rejected this video call."); break;
    case "cancelled": finishCallScreen("Call cancelled",callRole==="receiver"?"The caller cancelled the video call.":"The video call was cancelled."); break;
    case "ended":{
      const by=getFirstValue(d.endedBy);
      let msg="The video call has ended.";
      if(currentUser&&by===currentUser.uid) msg="You ended the video call."; else if(by) msg="The other member ended the video call.";
      finishCallScreen("Call ended",msg); break;
    }
    case "missed": finishCallScreen("Missed call",callRole==="caller"?"The member did not answer your video call.":"You missed this video call."); break;
    case "failed":
      disableVideoControls(); updateCallStatus("ended","Connection failed"); updateConnectionDisplay("failed");
      showCallMessage("The video connection failed. End the call and try again.",true); endVideoCallButton.disabled=false; break;
    default: console.log("Unknown status:",status);
  }
}
async function processCallDocument(d){
  if(!d) return;
  callData={id:callId,...d};
  const status=getFirstValue(d.status,"ringing").toLowerCase();
  if(callRole==="caller"&&d.answer&&!receiverAnswerApplied) await applyReceiverAnswer(d.answer);
  await handleLiveCallStatus(status,d);
  if(status!=="connected"||lastCallStatus!=="connected") lastCallStatus=status;
}
function startCallDocumentListener(){
  stopCallDocumentListener();
  if(!callId) return;
  unsubscribeCall=onSnapshot(doc(db,"videoCalls",callId),async snap=>{
    if(!snap.exists()){ showCallError("This video call no longer exists."); cleanupVideoCallResources(); return; }
    try{ await processCallDocument(snap.data()); }catch(e){ console.error("Call document error:",e); }
  },error=>{
    console.error("Call document listener error:",error);
    if(error?.code==="permission-denied") showCallError("Firebase denied access to this video call.");
    else showCallMessage("The live video-call status could not be updated.",true);
  });
}

/* ===== CONTROLS ===== */
microphoneButton.addEventListener("click",()=>{
  const t=getLocalAudioTrack();
  if(!t){ showCallMessage("No microphone track is available.",true); return; }
  microphoneMuted=!microphoneMuted; t.enabled=!microphoneMuted; updateMicrophoneButton();
});
cameraButton.addEventListener("click",()=>{
  const t=getLocalVideoTrack();
  if(!t){ showCallMessage("No camera track is available.",true); return; }
  cameraDisabled=!cameraDisabled; t.enabled=!cameraDisabled; updateCameraButton();
});
speakerButton.addEventListener("click",()=>{
  speakerMuted=!speakerMuted;
  remoteAudio.muted=speakerMuted; /* remoteVideo stays muted: audio comes from remoteAudio */
  updateSpeakerButton();
  if(!speakerMuted) playRemoteMedia();
});

async function switchCamera(){
  if(callActionRunning||!localStream||!peerConnection) return;
  callActionRunning=true; switchCameraButton.disabled=true;
  const next=currentFacingMode==="user"?"environment":"user";
  try{
    const old=localStream.getVideoTracks();
    old.forEach(t=>{ localStream.removeTrack(t); t.stop(); }); /* release camera first (needed on many phones) */
    const rep=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:next},width:{ideal:1280},height:{ideal:720}}});
    const newTrack=rep.getVideoTracks()[0];
    if(!newTrack) throw new Error("The selected camera could not be opened.");
    const sender=peerConnection.getSenders().find(s=>s.track?s.track.kind==="video":true&&s.dtmf===undefined);
    const videoSender=peerConnection.getSenders().find(s=>s.track&&s.track.kind==="video")||peerConnection.getTransceivers().find(t=>t.receiver.track.kind==="video")?.sender;
    if(videoSender) await videoSender.replaceTrack(newTrack);
    localStream.addTrack(newTrack);
    localVideo.srcObject=localStream;
    localVideo.classList.toggle("backCamera",next==="environment");
    await localVideo.play().catch(()=>{});
    currentFacingMode=next; cameraDisabled=false; newTrack.enabled=true; updateCameraButton();
    switchCameraIcon.textContent=next==="environment"?"🔙":"🔄";
    showCallMessage(next==="environment"?"Back camera selected.":"Front camera selected.");
    setTimeout(hideCallMessage,1200);
  }catch(error){
    console.error("Camera switch error:",error);
    showCallMessage("Unable to switch the camera on this device.",true);
  }finally{ callActionRunning=false; switchCameraButton.disabled=false; }
}
switchCameraButton.addEventListener("click",switchCamera);

remoteVideo.addEventListener("playing",()=>{ checkRemoteVideoTrack(); speakerButton.disabled=false; });
remoteVideo.addEventListener("loadedmetadata",playRemoteMedia);
document.addEventListener("click",()=>{ if(remoteStream) playRemoteMedia(); }); /* mobile autoplay unlock */

/* ===== END CALL ===== */
function getFinalCallStatus(){
  const st=getFirstValue(callData?.status,lastCallStatus,"ringing").toLowerCase();
  if(st==="ringing"&&callRole==="caller") return "cancelled";
  if(st==="ringing"&&callRole==="receiver") return "rejected";
  return "ended";
}
async function endVideoCall(forcedStatus=""){
  if(callActionRunning||pageClosing||callFinished) return;
  callActionRunning=true;
  endVideoCallButton.disabled=true; acceptVideoCallButton.disabled=true; rejectVideoCallButton.disabled=true;
  const finalStatus=forcedStatus||getFinalCallStatus();
  callFinished=true;
  try{
    if(callId) await updateDoc(doc(db,"videoCalls",callId),{status:finalStatus,endedBy:currentUser?.uid||"",endedAt:serverTimestamp(),updatedAt:serverTimestamp()});
  }catch(e){ console.error("End call error:",e); }
  callData.status=finalStatus;
  incomingVideoControls.classList.remove("show"); activeVideoControls.classList.add("hidden"); outgoingVideoControls.classList.remove("hidden");
  disableVideoControls(); updateConnectionDisplay("ended");
  if(finalStatus==="cancelled"){ updateCallStatus("ended","Call cancelled"); showCallMessage("You cancelled the video call."); }
  else if(finalStatus==="rejected"){ updateCallStatus("ended","Call rejected"); showCallMessage("You rejected the video call."); }
  else{ updateCallStatus("ended","Call ended"); showCallMessage("The video call has ended."); }
  cleanupVideoCallResources(); resetIceCandidateState();
  callActionRunning=false;
  setTimeout(leaveToPreviousPage,900);
}
endVideoCallButton.addEventListener("click",()=>endVideoCall());
backButton.addEventListener("click",async()=>{
  if(isCallActive()){ minimizeCall(); return; }
  if(callId&&!pageClosing&&!callFinished){ await endVideoCall(); return; }
  if(window.history.length>1) window.history.back(); else window.location.href="messages.html";
});

/* ===== PAGE LEAVE: cancel a call that is still ringing ===== */
function leavePage(){
  if(pageClosing) return;
  pageClosing=true;
  if(callId&&currentUser&&!callFinished){
    const st=getFirstValue(callData?.status,lastCallStatus,"ringing").toLowerCase();
    const next=FINAL_STATUSES.includes(st)?"":(st==="ringing"?(callRole==="caller"?"cancelled":"rejected"):"ended");
    if(next) updateDoc(doc(db,"videoCalls",callId),{status:next,endedBy:currentUser.uid,endedAt:serverTimestamp(),updatedAt:serverTimestamp()}).catch(()=>{});
  }
  cleanupVideoCallResources(); resetIceCandidateState();
}
window.addEventListener("pagehide",leavePage);
window.addEventListener("beforeunload",leavePage);
window.addEventListener("pageshow",e=>{ if(e.persisted) window.location.reload(); });

/* =====================================================
   MINIMIZE: keep the call running while the member uses
   other pages (chat, feed...) inside a window under a
   green "tap to return" bar. Also: screen stays awake,
   system Back button never kills an active call.
   ===================================================== */
const MINI_HOME="messages.html";
const miniBar=document.createElement("div");
miniBar.id="miniBar"; miniBar.className="hidden";
miniBar.innerHTML='<button type="button" id="miniReturn" class="miniReturn"><span class="miniDot"></span><span id="miniName"></span><span id="miniTime">00:00</span><span class="miniHint">Tap to return</span></button><button type="button" id="miniEnd" class="miniEnd" aria-label="End call">📵</button>';
const appFrame=document.createElement("iframe");
appFrame.id="appFrame"; appFrame.className="hidden"; appFrame.setAttribute("title","Faith Connect");
document.body.append(appFrame,miniBar);
let callMinimized=false,guardPushed=false,wakeLock=null;

function isCallActive(){
  if(callFinished||!callId) return false;
  const st=getFirstValue(callData&&callData.status,lastCallStatus,"").toLowerCase();
  return st==="accepted"||st==="connected"||Boolean(peerConnection&&peerConnection.connectionState==="connected");
}
function showMiniToast(text){
  let t=document.getElementById("miniToast");
  if(!t){ t=document.createElement("div"); t.id="miniToast"; document.body.appendChild(t); }
  t.textContent=text; t.classList.remove("hidden");
  clearTimeout(showMiniToast.timer); showMiniToast.timer=setTimeout(()=>t.classList.add("hidden"),2800);
}
function minimizeCall(){
  if(!isCallActive()||callMinimized) return;
  callMinimized=true;
  const n=document.getElementById("remoteName");
  document.getElementById("miniName").textContent=(n&&n.textContent)||"Call";
  document.getElementById("miniTime").textContent=callTimer.textContent||"00:00";
  document.body.classList.add("callMinimized");
  if(!appFrame.getAttribute("src")) appFrame.setAttribute("src",MINI_HOME);
  appFrame.classList.remove("hidden"); miniBar.classList.remove("hidden");
}
function expandCall(){
  if(!callMinimized) return;
  callMinimized=false;
  document.body.classList.remove("callMinimized");
  appFrame.classList.add("hidden"); miniBar.classList.add("hidden");
  try{ playRemoteMedia&&playRemoteMedia(); }catch(e){}
}
appFrame.addEventListener("load",()=>{
  try{
    if(/(voice|video)-call\.html$/.test(appFrame.contentWindow.location.pathname)){
      appFrame.setAttribute("src",MINI_HOME);
      showMiniToast("You are already in a call. End it first.");
    }
  }catch(e){}
});
document.getElementById("miniReturn").addEventListener("click",expandCall);
document.getElementById("miniEnd").addEventListener("click",()=>{ expandCall(); endVideoCall(); });
const minimizeButton=document.getElementById("minimizeButton");
if(minimizeButton) minimizeButton.addEventListener("click",()=>{
  if(isCallActive()) minimizeCall(); else showMiniToast("You can minimize once the call is connected.");
});

/* Android Back button: minimize / expand instead of leaving the page */
window.addEventListener("popstate",()=>{
  if(!guardPushed) return;
  if(isCallActive()){ history.pushState({callGuard:1},""); callMinimized?expandCall():minimizeCall(); }
  else guardPushed=false;
});
/* Screen stays on during a call */
async function keepAwake(){
  try{
    if("wakeLock" in navigator&&!wakeLock&&document.visibilityState==="visible"){
      wakeLock=await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release",()=>{ wakeLock=null; });
    }
  }catch(e){ wakeLock=null; }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&isCallActive()) keepAwake(); });
setInterval(()=>{
  if(!isCallActive()) return;
  if(!guardPushed){ history.pushState({callGuard:1},""); guardPushed=true; }
  keepAwake();
  if(callMinimized) document.getElementById("miniTime").textContent=callTimer.textContent||"00:00";
},1000);
function leaveToPreviousPage(){
  let target=MINI_HOME;
  try{ if(document.referrer&&new URL(document.referrer).origin===location.origin&&!/-call\.html/.test(document.referrer)) target=document.referrer; }catch(e){}
  window.location.replace(target);
}
/* Picture-in-picture: video keeps showing over other apps */
const pipButton=document.getElementById("pipButton");
async function enterPip(){
  try{
    if(document.pictureInPictureElement){ await document.exitPictureInPicture(); return; }
    if(remoteVideo.classList.contains("hidden")){ showMiniToast("Video appears when the other camera is on."); return; }
    await remoteVideo.requestPictureInPicture();
  }catch(e){ showMiniToast("Picture-in-picture is not available here."); }
}
if(pipButton){
  if(!document.pictureInPictureEnabled) pipButton.classList.add("hidden");
  else pipButton.addEventListener("click",enterPip);
}
try{ navigator.mediaSession.setActionHandler("enterpictureinpicture",()=>{ enterPip(); }); }catch(e){}


/* ===== START ===== */
disableVideoControls(); showRemotePlaceholder(); updateMicrophoneButton(); updateCameraButton(); updateSpeakerButton();
onAuthStateChanged(auth,async user=>{
  currentUser=user||null;
  if(!currentUser){ window.location.href="login.html"; return; }
  try{
    currentProfile=await loadUserProfile(currentUser.uid);
    if(callRole==="receiver") await prepareIncomingCall(); else await prepareOutgoingCall();
  }catch(error){
    console.error("Preparation error:",error);
    showCallError("The video call could not be prepared.");
  }
},error=>{
  console.error("Authentication error:",error);
  showCallError("Your account could not be confirmed. Please sign in again.");
});
console.log("Faith Connect video-call page ready.");
