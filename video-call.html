<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <meta
    name="description"
    content="Faith Connect private video call."
  >

  <title>
    Video Call | SABASABA Gospel Ministry
  </title>


  <style>

    /* =====================================================
       PART 1 OF 6
       GENERAL PAGE, VARIABLES, HEADER,
       REMOTE VIDEO AND LOCAL VIDEO PREVIEW
    ===================================================== */


    /* =====================================================
       GENERAL RESET
    ===================================================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }


    :root{

      --primary:#087bd1;
      --primary-dark:#0667b1;
      --primary-light:#e9f5fd;

      --background:#050d14;
      --surface:#102536;
      --surface-light:#17364c;

      --text:#ffffff;
      --muted:#b6c8d6;

      --border:
        rgba(255,255,255,.14);

      --success:#35b46f;
      --danger:#e34f4f;
      --warning:#f0b948;

      --shadow:
        0 12px 32px
        rgba(0,0,0,.38);

      --radius-large:26px;
      --radius-medium:17px;
      --radius-small:12px;

    }


    html,
    body{

      width:100%;
      height:100%;

    }


    html{
      scroll-behavior:smooth;
    }


    body{

      min-height:100vh;

      overflow:hidden;

      background:#050d14;
      color:var(--text);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display:flex;
      flex-direction:column;

    }


    button,
    input{
      font:inherit;
    }


    button{
      cursor:pointer;
    }


    button,
    a{
      -webkit-tap-highlight-color:transparent;
    }


    a{
      color:inherit;
      text-decoration:none;
    }


    img,
    video{
      display:block;
      max-width:100%;
    }


    /* =====================================================
       ACCESSIBILITY
    ===================================================== */

    button:focus-visible,
    a:focus-visible{

      outline:
        3px solid
        rgba(255,255,255,.42);

      outline-offset:3px;

    }


    /* =====================================================
       TOP HEADER
    ===================================================== */

    .topHeader{

      position:relative;
      z-index:300;

      width:100%;
      flex-shrink:0;

      background:
        rgba(4,18,29,.86);

      border-bottom:
        1px solid var(--border);

      backdrop-filter:
        blur(14px);

    }


    .topHeaderInner{

      width:100%;
      min-height:64px;

      margin:auto;
      padding:8px 13px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:11px;

    }


    /* =====================================================
       BACK BUTTON
    ===================================================== */

    .backButton{

      width:42px;
      height:42px;
      flex-shrink:0;

      border:
        1px solid
        var(--border);

      border-radius:50%;

      display:flex;
      align-items:center;
      justify-content:center;

      background:
        rgba(255,255,255,.10);

      color:#ffffff;

      font-size:22px;
      font-weight:900;

      transition:
        background .2s ease,
        transform .2s ease;

    }


    .backButton:hover{

      background:
        rgba(255,255,255,.19);

    }


    .backButton:active{
      transform:scale(.95);
    }


    /* =====================================================
       HEADER TITLE
    ===================================================== */

    .headerTitleArea{

      min-width:0;
      flex:1;

      text-align:center;

    }


    .headerTitle{

      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      font-size:16px;
      font-weight:900;

    }


    .headerSubtitle{

      margin-top:3px;

      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      color:var(--muted);

      font-size:10px;
      font-weight:800;

    }


    /* =====================================================
       SECURITY ICON
    ===================================================== */

    .securityIcon{

      width:42px;
      height:42px;
      flex-shrink:0;

      border:
        1px solid
        var(--border);

      border-radius:14px;

      display:flex;
      align-items:center;
      justify-content:center;

      background:
        rgba(255,255,255,.08);

      color:#ffffff;

      font-size:18px;

    }


    /* =====================================================
       VIDEO CALL PAGE
    ===================================================== */

    .videoCallPage{

      position:relative;

      min-height:0;
      flex:1;

      overflow:hidden;

      display:flex;
      flex-direction:column;

      background:
        radial-gradient(
          circle at top,
          #153f5c,
          #050d14 62%
        );

    }


    /* =====================================================
       REMOTE VIDEO AREA
    ===================================================== */

    .remoteVideoArea{

      position:absolute;
      inset:0;

      overflow:hidden;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#050d14;

    }


    .remoteVideo{

      width:100%;
      height:100%;

      object-fit:cover;

      background:#050d14;

    }


    .remoteVideo.hidden{
      display:none;
    }


    /* =====================================================
       REMOTE VIDEO PLACEHOLDER
    ===================================================== */

    .remoteVideoPlaceholder{

      position:absolute;
      inset:0;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:14px;

      padding:
        80px
        20px
        150px;

      text-align:center;

      background:
        radial-gradient(
          circle at top,
          #174b70,
          #071522 60%
        );

    }


    .remoteVideoPlaceholder.hidden{
      display:none;
    }


    .remoteAvatarFrame{

      width:150px;
      height:150px;

      padding:6px;

      border-radius:50%;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.30),
          rgba(255,255,255,.07)
        );

      box-shadow:
        0 14px 38px
        rgba(0,0,0,.40);

    }


    .remoteAvatarFrame.ringing{

      animation:
        videoRingPulse
        1.6s
        ease-in-out
        infinite;

    }


    @keyframes videoRingPulse{

      0%,
      100%{

        box-shadow:
          0 0 0 0
          rgba(53,180,111,.25),
          0 14px 38px
          rgba(0,0,0,.40);

      }

      50%{

        box-shadow:
          0 0 0 20px
          rgba(53,180,111,0),
          0 14px 38px
          rgba(0,0,0,.40);

      }

    }


    .remoteAvatar{

      width:100%;
      height:100%;

      border-radius:50%;

      object-fit:cover;

      background:#dce4ea;

    }


    .remoteMemberName{

      max-width:100%;

      font-size:24px;
      font-weight:900;
      line-height:1.25;

      overflow-wrap:anywhere;

    }


    .remoteMemberCountry{

      color:var(--muted);

      font-size:12px;
      font-weight:800;

    }


    .remoteMemberCountry.hidden{
      display:none;
    }


    /* =====================================================
       CALL STATUS AREA
    ===================================================== */

    .callStatusArea{

      position:absolute;

      top:18px;
      left:50%;

      z-index:100;

      width:
        calc(
          100% - 120px
        );

      max-width:520px;

      transform:
        translateX(-50%);

      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;

      pointer-events:none;

    }


    .callStatus{

      min-height:29px;

      padding:
        7px
        13px;

      border:
        1px solid
        var(--border);

      border-radius:999px;

      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;

      background:
        rgba(4,18,29,.72);

      color:var(--muted);

      font-size:11px;
      font-weight:900;

      backdrop-filter:
        blur(10px);

    }


    .callStatus.ringing{
      color:#ffe39b;
    }


    .callStatus.connected{
      color:#9df0bc;
    }


    .callStatus.ended{
      color:#ffaaaa;
    }


    .callTimer{

      min-height:24px;

      color:#ffffff;

      font-size:15px;
      font-weight:900;

      letter-spacing:1px;

      text-shadow:
        0 2px 5px
        rgba(0,0,0,.65);

    }


    /* =====================================================
       LOCAL VIDEO PREVIEW
    ===================================================== */

    .localVideoContainer{

      position:absolute;

      top:22px;
      right:13px;

      z-index:150;

      width:112px;
      height:158px;

      overflow:hidden;

      border:
        2px solid
        rgba(255,255,255,.80);

      border-radius:17px;

      background:#102536;

      box-shadow:
        0 8px 24px
        rgba(0,0,0,.42);

      transition:
        width .2s ease,
        height .2s ease,
        transform .2s ease;

    }


    .localVideoContainer:active{
      transform:scale(.97);
    }


    .localVideo{

      width:100%;
      height:100%;

      object-fit:cover;

      background:#102536;

      transform:scaleX(-1);

    }


    .localVideo.backCamera{
      transform:none;
    }


    .localVideo.hidden{
      display:none;
    }


    /* =====================================================
       LOCAL CAMERA OFF PLACEHOLDER
    ===================================================== */

    .localCameraPlaceholder{

      position:absolute;
      inset:0;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;

      padding:8px;

      background:
        linear-gradient(
          145deg,
          #17364c,
          #0a1d2b
        );

      color:#d5e8f5;

      text-align:center;

      font-size:10px;
      font-weight:900;

    }


    .localCameraPlaceholder.hidden{
      display:none;
    }


    .localCameraPlaceholderIcon{
      font-size:28px;
    }


    /* =====================================================
       LOCAL VIDEO LABEL
    ===================================================== */

    .localVideoLabel{

      position:absolute;

      left:6px;
      bottom:6px;

      padding:
        4px
        7px;

      border-radius:999px;

      background:
        rgba(0,0,0,.58);

      color:#ffffff;

      font-size:8px;
      font-weight:900;

    }


    /* =====================================================
       CALL INFORMATION MESSAGE
    ===================================================== */

    .callMessage{

      position:absolute;

      left:50%;
      bottom:128px;

      z-index:120;

      width:
        calc(
          100% - 30px
        );

      max-width:520px;

      transform:
        translateX(-50%);

      padding:13px;

      border:
        1px solid
        var(--border);

      border-radius:
        var(--radius-medium);

      background:
        rgba(4,18,29,.78);

      color:var(--muted);

      text-align:center;

      font-size:11px;
      font-weight:800;
      line-height:1.55;

      backdrop-filter:
        blur(10px);

    }


    .callMessage.error{

      border-color:
        rgba(227,79,79,.60);

      background:
        rgba(96,20,20,.84);

      color:#ffc0c0;

    }


    .callMessage.hidden{
      display:none;
    }


    /* =====================================================
       PERMISSION NOTICE
    ===================================================== */

    .permissionNotice{

      position:absolute;

      left:50%;
      bottom:128px;

      z-index:125;

      width:
        calc(
          100% - 30px
        );

      max-width:520px;

      transform:
        translateX(-50%);

      padding:
        13px
        14px;

      border:
        1px solid
        rgba(240,185,72,.48);

      border-radius:
        var(--radius-medium);

      background:
        rgba(83,59,13,.86);

      color:#ffe5a9;

      text-align:center;

      font-size:11px;
      font-weight:800;
      line-height:1.55;

      backdrop-filter:
        blur(10px);

    }


    .permissionNotice.hidden{
      display:none;
    }


    /* =====================================================
       HIDDEN ELEMENT
    ===================================================== */

    .hidden{
      display:none !important;
    }


    /* =====================================================
       RESPONSIVE DESIGN
    ===================================================== */

    @media(max-width:520px){

      .topHeaderInner{

        padding-left:10px;
        padding-right:10px;

      }


      .remoteAvatarFrame{

        width:132px;
        height:132px;

      }


      .remoteMemberName{
        font-size:21px;
      }


      .localVideoContainer{

        top:14px;
        right:9px;

        width:95px;
        height:137px;

        border-radius:15px;

      }


      .callStatusArea{

        top:13px;

        width:
          calc(
            100% - 110px
          );

      }


      .callMessage,
      .permissionNotice{

        bottom:118px;

      }

    }


    @media(max-width:380px){

      .localVideoContainer{

        width:84px;
        height:122px;

      }


      .callStatusArea{

        width:
          calc(
            100% - 98px
          );

      }


      .callStatus{

        padding:
          6px
          9px;

        font-size:9px;

      }


      .remoteAvatarFrame{

        width:116px;
        height:116px;

      }


      .remoteMemberName{
        font-size:19px;
      }

    }

  </style>
<style>

/* =====================================================
   PART 2 OF 6
   VIDEO CALL CONTROLS, CAMERA BUTTON,
   MICROPHONE, CAMERA SWITCH,
   ACCEPT, REJECT AND END CALL
===================================================== */


/* =====================================================
   CALL CONTROLS AREA
===================================================== */

.videoControlsArea{

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  z-index:200;

  width:100%;

  padding:
    18px
    14px
    calc(
      18px +
      env(safe-area-inset-bottom)
    );

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;

  background:
    linear-gradient(
      to top,
      rgba(3,12,20,.96),
      rgba(3,12,20,.72),
      rgba(3,12,20,0)
    );

}


/* =====================================================
   ACTIVE VIDEO CALL CONTROLS
===================================================== */

.activeVideoControls{

  width:100%;
  max-width:560px;

  display:grid;
  grid-template-columns:
    repeat(
      4,
      minmax(0,1fr)
    );

  gap:10px;

}


.videoControlButton{

  min-height:78px;

  padding:
    9px
    5px;

  border:
    1px solid
    var(--border);

  border-radius:18px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;

  background:
    rgba(255,255,255,.10);

  color:#ffffff;

  font-size:10px;
  font-weight:900;

  backdrop-filter:
    blur(9px);

  transition:
    background .2s ease,
    border-color .2s ease,
    color .2s ease,
    transform .2s ease;

}


.videoControlButton:hover{

  background:
    rgba(255,255,255,.18);

}


.videoControlButton:active{
  transform:scale(.96);
}


.videoControlButton.active{

  border-color:
    rgba(53,180,111,.60);

  background:
    rgba(53,180,111,.20);

  color:#b6f7ce;

}


.videoControlButton.warning{

  border-color:
    rgba(240,185,72,.62);

  background:
    rgba(240,185,72,.20);

  color:#ffe39b;

}


.videoControlButton.danger{

  border-color:
    rgba(227,79,79,.68);

  background:
    rgba(227,79,79,.20);

  color:#ffc1c1;

}


.videoControlButton:disabled{

  cursor:not-allowed;
  opacity:.48;

}


.videoControlIcon{

  width:46px;
  height:46px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    rgba(255,255,255,.12);

  font-size:21px;

}


/* =====================================================
   CAMERA OFF BUTTON STATE
===================================================== */

.videoControlButton.cameraOff{

  border-color:
    rgba(227,79,79,.62);

  background:
    rgba(227,79,79,.18);

  color:#ffb8b8;

}


/* =====================================================
   MICROPHONE MUTED BUTTON STATE
===================================================== */

.videoControlButton.microphoneMuted{

  border-color:
    rgba(240,185,72,.60);

  background:
    rgba(240,185,72,.18);

  color:#ffe29a;

}


/* =====================================================
   SWITCH CAMERA BUTTON
===================================================== */

.switchCameraButton{

  position:relative;

}


.switchCameraButton.switching{

  pointer-events:none;
  opacity:.65;

}


.switchCameraButton.switching
.videoControlIcon{

  animation:
    switchCameraSpin
    .8s
    linear
    infinite;

}


@keyframes switchCameraSpin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}


/* =====================================================
   END VIDEO CALL BUTTON
===================================================== */

.endVideoCallButton{

  width:76px;
  height:76px;

  border:0;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--danger);
  color:#ffffff;

  font-size:30px;

  box-shadow:
    0 10px 30px
    rgba(227,79,79,.42);

  transition:
    background .2s ease,
    transform .2s ease;

}


.endVideoCallButton:hover{
  background:#c93d3d;
}


.endVideoCallButton:active{
  transform:scale(.94);
}


.endVideoCallButton:disabled{

  cursor:not-allowed;
  opacity:.54;

}


/* =====================================================
   OUTGOING VIDEO CALL CONTROLS
===================================================== */

.outgoingVideoControls{

  width:100%;

  display:flex;
  align-items:center;
  justify-content:center;

}


.outgoingVideoControls.hidden{
  display:none;
}


/* =====================================================
   INCOMING VIDEO CALL CONTROLS
===================================================== */

.incomingVideoControls{

  width:100%;
  max-width:460px;

  display:none;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:28px;

}


.incomingVideoControls.show{
  display:grid;
}


.incomingVideoAction{

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:9px;

}


.incomingVideoActionButton{

  width:76px;
  height:76px;

  border:0;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#ffffff;

  font-size:29px;

  box-shadow:
    0 10px 28px
    rgba(0,0,0,.34);

  transition:
    filter .2s ease,
    transform .2s ease;

}


.incomingVideoActionButton:hover{
  filter:brightness(1.08);
}


.incomingVideoActionButton:active{
  transform:scale(.94);
}


.incomingVideoActionButton.accept{
  background:var(--success);
}


.incomingVideoActionButton.reject{
  background:var(--danger);
}


.incomingVideoActionButton:disabled{

  cursor:not-allowed;
  opacity:.55;

}


.incomingVideoActionLabel{

  color:#d6e3ec;

  font-size:11px;
  font-weight:900;

}


/* =====================================================
   CONNECTION INDICATOR
===================================================== */

.connectionIndicator{

  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  color:var(--muted);

  font-size:10px;
  font-weight:800;

}


.connectionDot{

  width:9px;
  height:9px;

  border-radius:50%;

  background:#748b9a;

}


.connectionDot.connecting{

  background:var(--warning);

  animation:
    connectionBlink
    1s
    ease-in-out
    infinite;

}


.connectionDot.connected{
  background:var(--success);
}


.connectionDot.failed{
  background:var(--danger);
}


@keyframes connectionBlink{

  0%,
  100%{
    opacity:.35;
  }

  50%{
    opacity:1;
  }

}


/* =====================================================
   CAMERA PERMISSION ERROR
===================================================== */

.cameraPermissionError{

  position:absolute;

  left:50%;
  bottom:128px;

  z-index:130;

  width:
    calc(
      100% - 30px
    );

  max-width:520px;

  transform:
    translateX(-50%);

  padding:
    13px
    14px;

  border:
    1px solid
    rgba(227,79,79,.58);

  border-radius:
    var(--radius-medium);

  background:
    rgba(92,17,17,.88);

  color:#ffc4c4;

  text-align:center;

  font-size:11px;
  font-weight:800;
  line-height:1.55;

  backdrop-filter:
    blur(10px);

}


.cameraPermissionError.hidden{
  display:none;
}


/* =====================================================
   CALL CONTROL LABEL
===================================================== */

.controlLabel{

  max-width:100%;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

}


/* =====================================================
   RESPONSIVE DESIGN
===================================================== */

@media(max-width:520px){

  .videoControlsArea{

    padding-left:9px;
    padding-right:9px;

    gap:13px;

  }


  .activeVideoControls{
    gap:7px;
  }


  .videoControlButton{

    min-height:70px;

    padding-left:3px;
    padding-right:3px;

    border-radius:15px;

    font-size:9px;

  }


  .videoControlIcon{

    width:42px;
    height:42px;

    font-size:19px;

  }


  .endVideoCallButton,
  .incomingVideoActionButton{

    width:70px;
    height:70px;

    font-size:27px;

  }


  .cameraPermissionError{
    bottom:118px;
  }

}


@media(max-width:380px){

  .activeVideoControls{
    gap:5px;
  }


  .videoControlButton{

    min-height:65px;

    font-size:8px;

  }


  .videoControlIcon{

    width:38px;
    height:38px;

    font-size:17px;

  }


  .incomingVideoControls{
    gap:18px;
  }


  .endVideoCallButton,
  .incomingVideoActionButton{

    width:66px;
    height:66px;

    font-size:25px;

  }

}

</style>

===================================================== -->

</head>

<body>


<!-- =====================================================
   VIDEO CALL PAGE
===================================================== -->

<main class="videoCallPage">


  <!-- =================================================
       REMOTE VIDEO AREA
  ================================================== -->

  <section class="remoteVideoArea">

    <video
      id="remoteVideo"
      class="remoteVideo"
      autoplay
      playsinline
    ></video>


    <!-- Remote video placeholder -->

    <div
      id="remoteVideoPlaceholder"
      class="remoteVideoPlaceholder"
    >

      <div
        id="remoteAvatarFrame"
        class="remoteAvatarFrame"
      >

        <img
          id="remoteAvatar"
          class="remoteAvatar"
          src="images/profile.png"
          alt="Call participant profile picture"
        >

      </div>


      <h1
        id="remoteMemberName"
        class="remoteMemberName"
      >
        Faith Connect Member
      </h1>


      <div
        id="remoteMemberCountry"

/* =====================================================
   REQUEST CAMERA AND MICROPHONE ACCESS
===================================================== */

async function requestLocalMedia(){

  if(localStream){

    return localStream;

  }


  if(
    !navigator.mediaDevices ||
    typeof navigator.mediaDevices.getUserMedia !==
    "function"
  ){

    throw new Error(
      "Camera and microphone access are not supported by this browser."
    );

  }


  try{

    localStream =
    await navigator.mediaDevices
    .getUserMedia(
      getVideoMediaConstraints()
    );


    if(localVideo){

      localVideo.srcObject =
      localStream;


      localVideo.muted =
      true;


      localVideo.playsInline =
      true;


      await localVideo.play()
      .catch(
        function(error){

          console.log(
            "Local video playback is waiting for user interaction:",
            error
          );

        }
      );

    }


    microphoneMuted =
    false;


    cameraDisabled =
    false;


    showLocalVideo();


    updateMicrophoneButton();


    updateCameraButton();


    if(cameraPermissionError){

      cameraPermissionError.classList.add(
        "hidden"
      );

    }


    return localStream;

  }catch(error){

    console.error(
      "Camera or microphone permission error:",
      error
    );


    showLocalCameraOff();


    if(cameraPermissionError){

      cameraPermissionError.classList.remove(
        "hidden"
      );

    }


    if(
      error?.name ===
      "NotAllowedError" ||
      error?.name ===
      "PermissionDeniedError"
    ){

      throw new Error(
        "Camera or microphone permission was denied. Allow access and try again."
      );

    }


    if(
      error?.name ===
      "NotFoundError" ||
      error?.name ===
      "DevicesNotFoundError"
    ){

      throw new Error(
        "No camera or microphone was found on this device."
      );

    }


    if(
      error?.name ===
      "NotReadableError" ||
      error?.name ===
      "TrackStartError"
    ){

      throw new Error(
        "The camera or microphone is being used by another application."
      );

    }


    if(
      error?.name ===
      "OverconstrainedError"
    ){

      throw new Error(
        "This device camera does not support the requested video settings."

/* =====================================================
   CREATE WEBRTC PEER CONNECTION
===================================================== */

async function createPeerConnection(){

  if(peerConnection){

    return peerConnection;

  }


  peerConnection =
  new RTCPeerConnection(
    rtcConfiguration
  );


  remoteStream =
  new MediaStream();


  remoteVideo.srcObject =
  remoteStream;


  /*
     Open this device's camera and microphone.
  */

  const mediaStream =
  await requestLocalMedia();


  /*
     Add camera and microphone tracks
     to the WebRTC connection.
  */

  mediaStream
  .getTracks()
  .forEach(
    function(track){

      peerConnection.addTrack(
        track,
        mediaStream
      );

    }
  );


  /*
     Receive video and audio tracks
     from the other member.
  */

  peerConnection.addEventListener(
    "track",
    handleRemoteTrack
  );


  /*
     Watch the main WebRTC connection.
  */

  peerConnection.addEventListener(
    "connectionstatechange",
    handlePeerConnectionState
  );


  /*
     Watch the ICE connection.
  */

  peerConnection.addEventListener(
    "iceconnectionstatechange",
    handleIceConnectionState
  );


  /*
     Watch ICE gathering.
  */

  peerConnection.addEventListener(
    "icegatheringstatechange",
    handleIceGatheringState
  );


  /*
     Watch WebRTC signalling.
  */

  peerConnection.addEventListener(
    "signalingstatechange",
    handleSignalingState
  );


  return peerConnection;

}


/* =====================================================
   HANDLE REMOTE TRACK
===================================================== */

function handleRemoteTrack(
  event
){

  if(!remoteStream){

    remoteStream =
    new MediaStream();


    remoteVideo.srcObject =
    remoteStream;

  }


  if(
    event.streams &&
    event.streams.length > 0
  ){

    event.streams
    .forEach(
      function(stream){

        stream
        .getTracks()
        .forEach(
          function(track){

            addTrackToRemoteStream(
              track
            );

          }
        );

      }
    );

  }else if(event.track){

    addTrackToRemoteStream(
      event.track
    );

  }


  if(event.track){

    event.track.addEventListener(
      "unmute",
      function(){

        if(
          event.track.kind ===
          "video"
        ){

          showRemoteVideo();

        }


        playRemoteVideo();

      }
    );


    event.track.addEventListener(
      "mute",
      function(){

        if(
          event.track.kind ===
          "video"
        ){

          checkRemoteVideoAvailability();

        }

      }
    );


    event.track.addEventListener(
      "ended",
      function(){

        if(
          event.track.kind ===
          "video"
        ){

          checkRemoteVideoAvailability();

        }

      }
    );

  }


  playRemoteVideo();


  checkRemoteVideoAvailability();

}


/* =====================================================
   ADD TRACK TO REMOTE STREAM
===================================================== */

function addTrackToRemoteStream(
  track
){

  if(
    !track ||
    !remoteStream
  ){

    return;

  }


  const trackAlreadyExists =
  remoteStream
  .getTracks()
  .some(
    function(existingTrack){

      return (
        existingTrack.id ===
        track.id
      );

    }
  );


  if(!trackAlreadyExists){

    remoteStream.addTrack(
      track
    );

  }

}


/* =====================================================
   PLAY REMOTE VIDEO
===================================================== */

function playRemoteVideo(){

  if(!remoteVideo){

    return;

  }


  remoteVideo.play()
  .then(
    function(){

      checkRemoteVideoAvailability();

    }
  )
  .catch(
    function(error){

      console.log(
        "Remote video playback is waiting:",
        error
      );

    }
  );

}


/* =====================================================
   CHECK REMOTE VIDEO AVAILABILITY
===================================================== */

function checkRemoteVideoAvailability(){

  if(!remoteStream){

    showRemoteVideoPlaceholder();


    return;

  }


  const activeVideoTrack =
  remoteStream
  .getVideoTracks()
  .find(
    function(track){

      return (
        track.readyState ===
        "live" &&
        track.muted !==
        true
      );

    }
  );


  if(activeVideoTrack){

    showRemoteVideo();

  }else{

    showRemoteVideoPlaceholder();

  }

}


/* =====================================================
   HANDLE PEER CONNECTION STATE
===================================================== */

function handlePeerConnectionState(){

  if(!peerConnection){

    return;

  }


  const connectionState =
  peerConnection.connectionState;


  console.log(
    "Video-call connection state:",
    connectionState
  );


  if(
    connectionState ===
    "new"
  ){

    updateConnectionDisplay(
      "waiting"
    );

  }else if(
    connectionState ===
    "connecting"
  ){

    updateConnectionDisplay(
      "connecting"
    );


    updateCallStatus(
      "ringing",
      "Connecting..."
    );

  }else if(
    connectionState ===
    "connected"
  ){

    updateConnectionDisplay(
      "connected"
    );


    updateCallStatus(
      "connected",
      "Connected"
    );


    remoteAvatarFrame.classList.remove(
      "ringing"
    );


    hideCallMessage();


    enableVideoCallControls();


    startCallTimer();


    playRemoteVideo();


    checkRemoteVideoAvailability();

  }else if(
    connectionState ===
    "disconnected"
  ){

    connectionText.textContent =
    "Video connection interrupted";


    showCallMessage(
      "The video connection was interrupted. Trying to reconnect..."
    );

  }else if(
    connectionState ===
    "failed"
  ){

    updateConnectionDisplay(
      "failed"
    );


    updateCallStatus(
      "ended",
      "Connection failed"
    );


    showCallMessage(
      "The video connection failed. End the call and try again.",
      true
    );

  }else if(
    connectionState ===
    "closed"
  ){

    updateConnectionDisplay(
      "ended"
    );


    updateCallStatus(
      "ended",
      "Call ended"
    );

  }

}


/* =====================================================
   HANDLE ICE CONNECTION STATE
===================================================== */

function handleIceConnectionState(){

  if(!peerConnection){

    return;

  }


  const iceState =
  peerConnection
  .iceConnectionState;


  console.log(
    "Video-call ICE state:",
    iceState
  );


  if(
    iceState ===
    "checking"
  ){

    updateConnectionDisplay(
      "connecting"
    );

  }else if(
    iceState ===
    "connected" ||
    iceState ===
    "completed"
  ){

    updateConnectionDisplay(
      "connected"
    );

  }else if(
    iceState ===
    "disconnected"
  ){

    connectionText.textContent =
    "Connection temporarily interrupted";

  }else if(
    iceState ===
    "failed"
  ){

    updateConnectionDisplay(
      "failed"
    );


    showCallMessage(
      "The phones could not establish a video connection.",
      true
    );

  }else if(
    iceState ===
    "closed"
  ){

    updateConnectionDisplay(
      "ended"
    );

  }

}

function cleanupPeerConnection(){

  if(!peerConnection){

  }


  try{

    peerConnection.removeEventListener(

    );


    peerConnection.removeEventListener(

    );

    );

/* =====================================================
   START CALL TIMER
===================================================== */

function startCallTimer(){

  if(callTimerInterval){

    return;

  }


  callStartedAt =
  Date.now();


  if(callTimer){

    callTimer.textContent =
    "00:00";

  }


  callTimerInterval =
  window.setInterval(
    function(){

      const totalSeconds =
      Math.floor(
        (
          Date.now() -
          callStartedAt
        ) / 1000
      );


      const hours =
      Math.floor(
        totalSeconds / 3600
      );


      const minutes =
      Math.floor(
        (
          totalSeconds % 3600
        ) / 60
      );


      const seconds =
      totalSeconds % 60;


      if(!callTimer){

        return;

      }


      if(hours > 0){

        callTimer.textContent =
        `${String(hours).padStart(
          2,
          "0"
        )}:${String(minutes).padStart(
          2,
          "0"
        )}:${String(seconds).padStart(
          2,
          "0"
        )}`;

      }else{

        callTimer.textContent =
        `${String(minutes).padStart(
          2,
          "0"
        )}:${String(seconds).padStart(
          2,
          "0"
        )}`;

      }

    },
    1000
  );

}


/* =====================================================
   STOP CALL TIMER
===================================================== */

function stopCallTimer(){

  if(callTimerInterval){

    window.clearInterval(
      callTimerInterval
    );

  }


  callTimerInterval =
  null;


  callStartedAt =
  null;

}


/* =====================================================
   RESET CALL TIMER
===================================================== */

function resetCallTimer(){

  stopCallTimer();


  if(callTimer){

    callTimer.textContent =
    "00:00";

  }

}

async function prepareOutgoingCall(){

  if(
    !currentUser ||
    !otherMemberId
  ){

    showCallError(

    );


    return;

  }


  if(
    otherMemberId ===

  ){

  }


  try{

    );

      );

    }


    showRemoteVideoPlaceholder();

      false;

    );

      error?.message ||
      "The video call could not be prepared."
    );

  }

/* =====================================================
   PREPARE INCOMING VIDEO CALL
===================================================== */

async function prepareIncomingCall(){

  if(
    !currentUser ||
    !callId
  ){

    showCallError(
      "The incoming video-call information is missing."
    );


    return;

  }


  try{

    const callReference =
    doc(
      db,
      "videoCalls",
      callId
    );


    const callSnapshot =
    await getDoc(
      callReference
    );


    if(
      !callSnapshot.exists()
    ){

      showCallError(
        "This video call no longer exists."
      );


      return;

    }


    callData = {

      id:
      callSnapshot.id,

      ...callSnapshot.data()

    };


    if(
      callData.receiverId !==
      currentUser.uid
    ){

      showCallError(
        "You are not the receiver of this video call."
      );


      return;

    }


    const currentCallStatus =
    getFirstValue(
      callData.status,
      "ringing"
    ).toLowerCase();


    if(
      currentCallStatus ===
      "ended" ||

      currentCallStatus ===
      "rejected" ||

      currentCallStatus ===
      "cancelled" ||

      currentCallStatus ===
      "missed" ||

      currentCallStatus ===
      "failed"
    ){

      showCallError(
        "This video call has already ended."
      );


      return;

    }


    otherMemberId =
    getFirstValue(
      callData.callerId
    );


    if(!otherMemberId){

      showCallError(
        "The caller information is missing."
      );


      return;

    }


    otherMemberProfile =
    await loadUserProfile(
      otherMemberId
    );


    /*
       Use the information saved inside the
       video-call document when profile details
       are incomplete.
    */

    otherMemberProfile = {

      ...otherMemberProfile,

      fullName:
      getFirstValue(
        otherMemberProfile.fullName,
        otherMemberProfile.name,
        otherMemberProfile.displayName,
        callData.callerName
      ),

      profilePicture:
      getFirstValue(
        otherMemberProfile.profilePicture,
        otherMemberProfile.picture,
        otherMemberProfile.photoURL,
        callData.callerPicture,
        "images/profile.png"
      ),

      country:
      getFirstValue(
        otherMemberProfile.country,
        otherMemberProfile.location,
        callData.callerCountry
      )

    };


    displayOtherMember();


    if(headerSubtitle){

      headerSubtitle.textContent =
      "Incoming private video call";

    }


    updateCallStatus(
      "ringing",
      "Incoming video call"
    );


    updateConnectionDisplay(
      "connecting"
    );


    if(remoteAvatarFrame){

      remoteAvatarFrame.classList.add(
        "ringing"
      );

    }


    showRemoteVideoPlaceholder();


    if(incomingVideoControls){

      incomingVideoControls.classList.add(
        "show"
      );

    }


    if(outgoingVideoControls){

      outgoingVideoControls.classList.add(
        "hidden"
      );

    }


    if(activeVideoControls){

      activeVideoControls.classList.add(
        "hidden"
      );

    }


    if(cameraPermissionError){

      cameraPermissionError.classList.add(
        "hidden"
      );

    }


    startCallDocumentListener();

  }catch(error){

    console.error(
      "Incoming video-call preparation error:",
      error
    );


    showCallError(
      error?.message ||
      "The incoming video call could not be opened."
    );

  }

}

/* =====================================================
   CREATE OUTGOING VIDEO CALL
===================================================== */

async function startOutgoingCall(){

  if(
    outgoingCallStarted ||
    callActionRunning
  ){

    return;

  }


  if(
    !currentUser ||
    !otherMemberId
  ){

    showCallError(
      "The video call could not be started."
    );


    return;

  }


  outgoingCallStarted =
  true;


  callActionRunning =
  true;


  hideCallMessage();


  updateCallStatus(
    "ringing",
    "Calling..."
  );


  updateConnectionDisplay(
    "connecting"
  );


  if(headerSubtitle){

    headerSubtitle.textContent =
    "Outgoing private video call";

  }


  try{

    /* Open the camera, microphone and WebRTC connection */

    const connection =
    await createPeerConnection();


    /* Create a new Firestore video-call reference */

    const newCallReference =
    doc(
      collection(
        db,
        "videoCalls"
      )
    );


    callId =
    newCallReference.id;


    const callerInformation =
    getCurrentCallerInformation();


    const receiverName =
    getVideoCallProfileName(
      otherMemberProfile
    );


    const receiverPicture =
    getVideoCallProfilePicture(
      otherMemberProfile
    );


    const receiverCountry =
    getVideoCallProfileCountry(
      otherMemberProfile
    );


    /* =================================================
       SAVE CALLER ICE CANDIDATES
    ================================================= */

    connection.addEventListener(
      "icecandidate",

      async function(event){

        if(
          !event.candidate ||
          !callId
        ){

          return;

        }


        try{

          await addDoc(
            collection(
              db,
              "videoCalls",
              callId,
              "callerCandidates"
            ),

            event.candidate.toJSON()
          );

        }catch(error){

          console.error(
            "Caller video ICE candidate saving error:",
            error
          );

        }

      }
    );


    /* =================================================
       CREATE WEBRTC VIDEO OFFER
    ================================================= */

    const offerDescription =
    await connection.createOffer(
      {

        offerToReceiveAudio:
        true,

        offerToReceiveVideo:
        true

      }
    );


    await connection.setLocalDescription(
      offerDescription
    );


    const offer = {

      type:
      offerDescription.type,

      sdp:
      offerDescription.sdp

    };


    /* =================================================
       SAVE VIDEO CALL DOCUMENT
    ================================================= */

    await setDoc(
      newCallReference,

      {

        callerId:
        currentUser.uid,

        callerName:
        callerInformation.callerName,

        callerPicture:
        callerInformation.callerPicture,

        callerCountry:
        callerInformation.callerCountry,

        receiverId:
        otherMemberId,

        receiverName:
        receiverName,

        receiverPicture:
        receiverPicture,

        receiverCountry:
        receiverCountry,

        type:
        "video",

        status:
        "ringing",

        offer:
        offer,

        answer:
        null,

        acceptedAt:
        null,

        connectedAt:
        null,

        endedAt:
        null,

        endedBy:
        null,

        createdAt:
        serverTimestamp(),

        updatedAt:
        serverTimestamp()

      }
    );


    callData = {

      id:
      callId,

      callerId:
      currentUser.uid,

      receiverId:
      otherMemberId,

      type:
      "video",

      status:
      "ringing",

      offer:
      offer

    };


    /* Watch the live video-call document */

    startCallDocumentListener();


    /* Listen for receiver ICE candidates */

    startReceiverCandidateListener();


    /* Update outgoing call screen */

    updateCallStatus(
      "ringing",
      "Ringing..."
    );


    updateConnectionDisplay(
      "connecting"
    );


    if(remoteAvatarFrame){

      remoteAvatarFrame.classList.add(
        "ringing"
      );

    }


    if(outgoingVideoControls){

      outgoingVideoControls.classList.remove(
        "hidden"
      );

    }


    if(incomingVideoControls){

      incomingVideoControls.classList.remove(
        "show"
      );

    }


    if(activeVideoControls){

      activeVideoControls.classList.add(
        "hidden"
      );

    }


    if(endVideoCallButton){

      endVideoCallButton.disabled =
      false;

    }


    showCallMessage(
      `Calling ${receiverName}...`
    );


    console.log(
      "Outgoing video call created:",
      callId
    );

  }catch(error){

    console.error(
      "Outgoing video-call creation error:",
      error
    );


    outgoingCallStarted =
    false;


    if(
      error?.message?.toLowerCase()
      .includes(
        "permission"
      )
    ){

      showCallError(
        error.message
      );

    }else if(
      error?.code ===
      "permission-denied"
    ){

      showCallError(
        "Firebase denied permission to create the video call."
      );

    }else{

      showCallError(
        error?.message ||
        "The video call could not be started. Please try again."
      );

    }


    cleanupPeerConnection();

    cleanupLocalMedia();

    cleanupRemoteMedia();

  }finally{

    callActionRunning =
    false;

  }

}

/* =====================================================
   ACCEPT INCOMING VIDEO CALL
===================================================== */

async function acceptIncomingVideoCall(){

  if(
    callActionRunning ||
    !currentUser ||
    !callId
  ){

    return;

  }


  callActionRunning =
  true;


  if(acceptVideoCallButton){

    acceptVideoCallButton.disabled =
    true;


    acceptVideoCallButton.textContent =
    "…";

  }


  if(rejectVideoCallButton){

    rejectVideoCallButton.disabled =
    true;

  }


  hideCallMessage();


  updateCallStatus(
    "ringing",
    "Connecting..."
  );


  updateConnectionDisplay(
    "connecting"
  );


  try{

    const callReference =
    doc(
      db,
      "videoCalls",
      callId
    );


    const callSnapshot =
    await getDoc(
      callReference
    );


    if(
      !callSnapshot.exists()
    ){

      throw new Error(
        "This video call no longer exists."
      );

    }


    const latestCallData =
    callSnapshot.data();


    if(
      latestCallData.receiverId !==
      currentUser.uid
    ){

      throw new Error(
        "You are not allowed to accept this video call."
      );

    }


    const latestStatus =
    getFirstValue(
      latestCallData.status,
      ""
    ).toLowerCase();


    if(
      latestStatus === "ended" ||
      latestStatus === "rejected" ||
      latestStatus === "cancelled" ||
      latestStatus === "missed" ||
      latestStatus === "failed"
    ){

      throw new Error(
        "This video call has already ended."
      );

    }


    if(
      !latestCallData.offer
    ){

      throw new Error(
        "The caller's video connection information is missing."
      );

    }


    callData = {

      id:
      callId,

      ...latestCallData

    };


    /* =================================================
       CREATE RECEIVER PEER CONNECTION
    ================================================= */

    const connection =
    await createPeerConnection();


    /* =================================================
       SAVE RECEIVER ICE CANDIDATES
    ================================================= */

    connection.addEventListener(
      "icecandidate",
      async function(event){

        if(
          !event.candidate ||
          !callId
        ){

          return;

        }


        try{

          await addDoc(
            collection(
              db,
              "videoCalls",
              callId,
              "receiverCandidates"
            ),
            event.candidate.toJSON()
          );

        }catch(error){

          console.error(
            "Receiver video ICE candidate saving error:",
            error
          );

        }

      }
    );


    /* =================================================
       APPLY CALLER OFFER
    ================================================= */

    const remoteOffer =
    new RTCSessionDescription(
      latestCallData.offer
    );


    await connection.setRemoteDescription(
      remoteOffer
    );


    /*
       Caller candidates may arrive before
       the caller offer has been applied.
    */

    if(
      typeof applyPendingCallerCandidates ===
      "function"
    ){

      await applyPendingCallerCandidates();

    }


    /* =================================================
       CREATE RECEIVER ANSWER
    ================================================= */

    const answerDescription =
    await connection.createAnswer();


    await connection.setLocalDescription(
      answerDescription
    );


    const answer = {

      type:
      answerDescription.type,

      sdp:
      answerDescription.sdp

    };


    /* =================================================
       SAVE ANSWER IN FIRESTORE
    ================================================= */

    await updateDoc(
      callReference,
      {

        answer:
        answer,

        status:
        "accepted",

        acceptedAt:
        serverTimestamp(),

        updatedAt:
        serverTimestamp()

      }
    );


    callData.answer =
    answer;


    callData.status =
    "accepted";


    /* =================================================
       START CALLER ICE LISTENER
    ================================================= */

    if(
      typeof startCallerCandidateListener ===
      "function"
    ){

      startCallerCandidateListener();

    }


    /* =================================================
       START LIVE CALL LISTENER
    ================================================= */

    if(
      typeof startCallDocumentListener ===
      "function"
    ){

      startCallDocumentListener();

    }


    /* =================================================
       UPDATE INCOMING CALL SCREEN
    ================================================= */

    if(incomingVideoControls){

      incomingVideoControls.classList.remove(
        "show"
      );

    }


    if(outgoingVideoControls){

      outgoingVideoControls.classList.remove(
        "hidden"
      );

    }


    if(activeVideoControls){

      activeVideoControls.classList.remove(
        "hidden"
      );

    }


    if(remoteAvatarFrame){

      remoteAvatarFrame.classList.remove(
        "ringing"
      );

    }


    if(endVideoCallButton){

      endVideoCallButton.disabled =
      false;

    }


    updateCallStatus(
      "ringing",
      "Connecting..."
    );


    updateConnectionDisplay(
      "connecting"
    );


    showCallMessage(
      "Video call accepted. Connecting camera and audio..."
    );


    if(remoteVideo){

      remoteVideo.play()
      .catch(
        function(error){

          console.log(
            "Remote video playback is waiting for connection:",
            error
          );

        }
      );

    }


    console.log(
      "Incoming video call accepted:",
      callId
    );

  }catch(error){

    console.error(
      "Incoming video-call acceptance error:",
      error
    );


    if(
      error?.code ===
      "permission-denied"
    ){

      showCallError(
        "Firebase denied permission to accept this video call."
      );

    }else{

      showCallError(
        error?.message ||
        "The video call could not be accepted."
      );

    }


    cleanupPeerConnection();


    cleanupLocalMedia();


    cleanupRemoteMedia();

  }finally{

    callActionRunning =
    false;


    if(acceptVideoCallButton){

      acceptVideoCallButton.disabled =
      false;


      acceptVideoCallButton.textContent =
      "📹";

    }


    if(rejectVideoCallButton){

      rejectVideoCallButton.disabled =
      false;

    }

  }

}

/* =====================================================
   PART 5A OF 6
   LIVE CALL DOCUMENT LISTENER
===================================================== */

function startCallDocumentListener(){

  stopCallDocumentListener();

  if(!callId){
    return;
  }

  const callReference = doc(
    db,
    "videoCalls",
    callId
  );

  unsubscribeCall = onSnapshot(

    callReference,

    async(snapshot)=>{

      if(!snapshot.exists()){

        showCallError(
          "This video call no longer exists."
        );

        cleanupVideoCallResources();
        return;
      }

      callData = {
        id:snapshot.id,
        ...snapshot.data()
      };

      const status = (
        callData.status || "ringing"
      ).toLowerCase();

      if(status === lastCallStatus){
        return;
      }

      lastCallStatus = status;

      switch(status){

        case "ringing":

          updateCallStatus(
            "ringing",
            callRole === "caller"
            ? "Ringing..."
            : "Incoming video call"
          );

          updateConnectionDisplay(
            "connecting"
          );

          break;


        case "accepted":

          updateCallStatus(
            "ringing",
            "Connecting..."
          );

          updateConnectionDisplay(
            "connecting"
          );

          if(
            callRole === "caller" &&
            callData.answer &&
            !receiverAnswerApplied
          ){

            await applyReceiverAnswer(
              callData.answer
            );

          }

          break;


        case "connected":

          updateCallStatus(
            "connected",
            "Connected"
          );

          updateConnectionDisplay(
            "connected"
          );

          enableConnectedCallControls();

          startCallTimer();

          hideCallMessage();

          break;


        case "rejected":

          finishCallScreen(
            "Call rejected",
            callRole === "caller"
            ? "The member rejected your call."
            : "You rejected the call."
          );

          break;


        case "cancelled":

          finishCallScreen(
            "Call cancelled",
            "The call was cancelled."
          );

          break;


        case "ended":

          finishCallScreen(
            "Call ended",
            "The video call has ended."
          );

          break;


        case "missed":

          finishCallScreen(
            "Missed call",
            "The call was not answered."
          );

          break;


        case "failed":

          finishCallScreen(
            "Connection failed",
            "The connection could not be established."
          );

          break;

      }

    },

    (error)=>{

      console.error(
        "Video call listener error:",
        error
      );

      showCallError(
        "Unable to monitor this video call."
      );

    }

  );

}

/* =====================================================
   CHECK IF REMOTE DESCRIPTION EXISTS
===================================================== */

function peerHasRemoteDescription(){

  return Boolean(
    peerConnection &&
    peerConnection.remoteDescription &&
    peerConnection.remoteDescription.type
  );

}


/* =====================================================
   ADD REMOTE ICE CANDIDATE
===================================================== */

async function addRemoteIceCandidate(
  candidateData,
  pendingCandidateList
){

  if(
    !candidateData ||
    !peerConnection
  ){

    return;

  }


  try{

    const candidate =
    new RTCIceCandidate(
      candidateData
    );


    if(
      peerHasRemoteDescription()
    ){

      await peerConnection.addIceCandidate(
        candidate
      );

    }else{

      pendingCandidateList.push(
        candidate
      );

    }

  }catch(error){

    console.error(
      "Unable to add remote video ICE candidate:",
      error
    );

  }

}


/* =====================================================
   APPLY PENDING ICE CANDIDATES
===================================================== */

async function applyPendingCandidates(
  pendingCandidateList
){

  if(
    !peerConnection ||
    !peerHasRemoteDescription()
  ){

    return;

  }


  while(
    pendingCandidateList.length > 0
  ){

    const candidate =
    pendingCandidateList.shift();


    try{

      await peerConnection.addIceCandidate(
        candidate
      );

    }catch(error){

      console.error(
        "Pending video ICE candidate error:",
        error
      );

    }

  }

}


/* =====================================================
   APPLY PENDING CALLER CANDIDATES
===================================================== */

async function applyPendingCallerCandidates(){

  await applyPendingCandidates(
    pendingCallerCandidates
  );

}


/* =====================================================
   APPLY PENDING RECEIVER CANDIDATES
===================================================== */

async function applyPendingReceiverCandidates(){

  await applyPendingCandidates(
    pendingReceiverCandidates
  );

}


/* =====================================================
   START CALLER CANDIDATE LISTENER
   USED BY THE RECEIVER
===================================================== */

function startCallerCandidateListener(){

  stopCallerCandidateListener();


  if(!callId){

    return;

  }


  const callerCandidatesReference =
  collection(
    db,
    "videoCalls",
    callId,
    "callerCandidates"
  );


  unsubscribeCallerCandidates =
  onSnapshot(

    callerCandidatesReference,

    function(snapshot){

      snapshot.docChanges()
      .forEach(
        function(change){

          if(
            change.type !== "added"
          ){

            return;

          }


          if(
            processedCallerCandidateIds.has(
              change.doc.id
            )
          ){

            return;

          }


          processedCallerCandidateIds.add(
            change.doc.id
          );


          addRemoteIceCandidate(
            change.doc.data(),
            pendingCallerCandidates
          );

        }
      );

    },

    function(error){

      console.error(
        "Caller video ICE listener error:",
        error
      );

    }

  );

}


/* =====================================================
   START RECEIVER CANDIDATE LISTENER
   USED BY THE CALLER
===================================================== */

function startReceiverCandidateListener(){

  stopReceiverCandidateListener();


  if(!callId){

    return;

  }


  const receiverCandidatesReference =
  collection(
    db,
    "videoCalls",
    callId,
    "receiverCandidates"
  );


  unsubscribeReceiverCandidates =
  onSnapshot(

    receiverCandidatesReference,

    function(snapshot){

      snapshot.docChanges()
      .forEach(
        function(change){

          if(
            change.type !== "added"
          ){

            return;

          }


          if(
            processedReceiverCandidateIds.has(
              change.doc.id
            )
          ){

            return;

          }


          processedReceiverCandidateIds.add(
            change.doc.id
          );


          addRemoteIceCandidate(
            change.doc.data(),
            pendingReceiverCandidates
          );

        }
      );

    },

    function(error){

      console.error(
        "Receiver video ICE listener error:",
        error
      );

    }

  );

}


/* =====================================================
   APPLY RECEIVER ANSWER TO CALLER
===================================================== */

async function applyReceiverAnswer(
  answerData
){

  if(
    callRole !== "caller" ||
    !answerData ||
    !peerConnection ||
    receiverAnswerApplied
  ){

    return;

  }


  try{

    const remoteAnswer =
    new RTCSessionDescription(
      answerData
    );


    await peerConnection.setRemoteDescription(
      remoteAnswer
    );


    receiverAnswerApplied =
    true;


    await applyPendingReceiverCandidates();


    updateCallStatus(
      "ringing",
      "Connecting..."
    );


    updateConnectionDisplay(
      "connecting"
    );


    hideCallMessage();


    console.log(
      "Receiver video answer applied."
    );

  }catch(error){

    console.error(
      "Receiver video answer error:",
      error
    );


    updateConnectionDisplay(
      "failed"
    );


    showCallMessage(
      "The member answered, but the video connection could not be completed.",
      true
    );

  }

}


/* =====================================================
   FINISH VIDEO CALL SCREEN
===================================================== */

function finishCallScreen(
  statusText,
  messageText
){

  stopCallTimer();


  if(remoteAvatarFrame){

    remoteAvatarFrame.classList.remove(
      "ringing"
    );

  }


  if(incomingVideoControls){

    incomingVideoControls.classList.remove(
      "show"
    );

  }


  if(activeVideoControls){

    activeVideoControls.classList.add(
      "hidden"
    );

  }


  if(outgoingVideoControls){

    outgoingVideoControls.classList.remove(
      "hidden"
    );

  }


  disableVideoCallControls();


  if(endVideoCallButton){

    endVideoCallButton.disabled =
    true;

  }


  updateCallStatus(
    "ended",
    statusText
  );


  updateConnectionDisplay(
    "ended"
  );


  if(messageText){

    showCallMessage(
      messageText
    );

  }


  cleanupVideoCallResources();

}


/* =====================================================
   RESET ICE CANDIDATE STATE
===================================================== */

function resetIceCandidateState(){

  processedCallerCandidateIds.clear();


  processedReceiverCandidateIds.clear();


  pendingCallerCandidates.splice(
    0,
    pendingCallerCandidates.length
  );


  pendingReceiverCandidates.splice(
    0,
    pendingReceiverCandidates.length
  );

}


/* =====================================================
   RESET LIVE CALL STATE
===================================================== */

function resetLiveCallState(){

  receiverAnswerApplied =
  false;


  lastCallStatus =
  "";

}

/* =====================================================
   HANDLE ACCEPTED STATUS
===================================================== */

async function handleAcceptedStatus(
  latestCallData
){

  if(remoteAvatarFrame){

    remoteAvatarFrame.classList.remove(
      "ringing"
    );

  }


  if(incomingVideoControls){

    incomingVideoControls.classList.remove(
      "show"
    );

  }


  if(outgoingVideoControls){

    outgoingVideoControls.classList.remove(
      "hidden"
    );

  }


  if(activeVideoControls){

    activeVideoControls.classList.remove(
      "hidden"
    );

  }


  if(endVideoCallButton){

    endVideoCallButton.disabled =
    false;

  }


  updateCallStatus(
    "ringing",
    "Connecting..."
  );


  updateConnectionDisplay(
    "connecting"
  );


  hideCallMessage();


  /*
     The caller must apply the WebRTC answer
     created by the receiver.
  */

  if(
    callRole === "caller" &&
    latestCallData.answer &&
    !receiverAnswerApplied
  ){

    await applyReceiverAnswer(
      latestCallData.answer
    );

  }


  /*
     Apply ICE candidates that arrived
     before the remote description was ready.
  */

  if(
    callRole === "caller"
  ){

    await applyPendingReceiverCandidates();

  }else{

    await applyPendingCallerCandidates();

  }


  if(
    peerConnection &&
    peerConnection.connectionState ===
    "connected"
  ){

    handleConnectedStatus();

  }

}


/* =====================================================
   HANDLE CONNECTED STATUS
===================================================== */

function handleConnectedStatus(){

  if(remoteAvatarFrame){

    remoteAvatarFrame.classList.remove(
      "ringing"
    );

  }


  if(incomingVideoControls){

    incomingVideoControls.classList.remove(
      "show"
    );

  }


  if(outgoingVideoControls){

    outgoingVideoControls.classList.remove(
      "hidden"
    );

  }


  if(activeVideoControls){

    activeVideoControls.classList.remove(
      "hidden"
    );

  }


  if(endVideoCallButton){

    endVideoCallButton.disabled =
    false;

  }


  updateCallStatus(
    "connected",
    "Connected"
  );


  updateConnectionDisplay(
    "connected"
  );


  hideCallMessage();


  enableConnectedCallControls();


  startCallTimer();


  playRemoteVideo();


  checkRemoteVideoAvailability();

}


/* =====================================================
   HANDLE REJECTED STATUS
===================================================== */

function handleRejectedStatus(){

  const message =
  callRole === "caller"
  ? "The member rejected your video call."
  : "You rejected this video call.";


  finishCallScreen(
    "Call rejected",
    message
  );

}


/* =====================================================
   HANDLE CANCELLED STATUS
===================================================== */

function handleCancelledStatus(){

  const message =
  callRole === "receiver"
  ? "The caller cancelled the video call."
  : "The video call was cancelled.";


  finishCallScreen(
    "Call cancelled",
    message
  );

}


/* =====================================================
   HANDLE ENDED STATUS
===================================================== */

function handleEndedStatus(
  latestCallData
){

  const endedBy =
  getFirstValue(
    latestCallData.endedBy
  );


  let message =
  "The video call has ended.";


  if(
    currentUser &&
    endedBy === currentUser.uid
  ){

    message =
    "You ended the video call.";

  }else if(endedBy){

    message =
    "The other member ended the video call.";

  }


  finishCallScreen(
    "Call ended",
    message
  );

}


/* =====================================================
   HANDLE MISSED STATUS
===================================================== */

function handleMissedStatus(){

  const message =
  callRole === "caller"
  ? "The member did not answer your video call."
  : "You missed this video call.";


  finishCallScreen(
    "Missed call",
    message
  );

}


/* =====================================================
   HANDLE FAILED STATUS
===================================================== */

function handleFailedStatus(){

  stopCallTimer();


  if(remoteAvatarFrame){

    remoteAvatarFrame.classList.remove(
      "ringing"
    );

  }


  if(incomingVideoControls){

    incomingVideoControls.classList.remove(
      "show"
    );

  }


  if(activeVideoControls){

    activeVideoControls.classList.add(
      "hidden"
    );

  }


  if(outgoingVideoControls){

    outgoingVideoControls.classList.remove(
      "hidden"
    );

  }


  disableVideoCallControls();


  if(endVideoCallButton){

    endVideoCallButton.disabled =
    false;

  }


  updateCallStatus(
    "ended",
    "Connection failed"
  );


  updateConnectionDisplay(
    "failed"
  );


  showCallMessage(
    "The video connection failed. End the call and try again.",
    true
  );

}


/* =====================================================
   HANDLE LIVE CALL STATUS
===================================================== */

async function handleLiveCallStatus(
  status,
  latestCallData
){

  switch(status){

    case "ringing":

      handleRingingStatus();

      break;


    case "accepted":

    case "connecting":

      await handleAcceptedStatus(
        latestCallData
      );

      break;


    case "connected":

      handleConnectedStatus();

      break;


    case "rejected":

      handleRejectedStatus();

      break;


    case "cancelled":

      handleCancelledStatus();

      break;


    case "ended":

      handleEndedStatus(
        latestCallData
      );

      break;


    case "missed":

      handleMissedStatus();

      break;


    case "failed":

      handleFailedStatus();

      break;


    default:

      console.log(
        "Unknown video-call status:",
        status
      );

  }

}


/* =====================================================
   PROCESS LIVE CALL DOCUMENT
===================================================== */

async function processCallDocument(
  latestCallData
){

  if(!latestCallData){

    return;

  }


  callData = {

    id:
    callId,

    ...latestCallData

  };


  const latestStatus =
  getFirstValue(
    latestCallData.status,
    "ringing"
  ).toLowerCase();


  if(
    callRole === "caller" &&
    latestCallData.answer &&
    !receiverAnswerApplied
  ){

    await applyReceiverAnswer(
      latestCallData.answer
    );

  }


  await handleLiveCallStatus(
    latestStatus,
    latestCallData
  );


  lastCallStatus =
  latestStatus;

}


/* =====================================================
   START LIVE CALL DOCUMENT LISTENER
===================================================== */

function startCallDocumentListener(){

  stopCallDocumentListener();


  if(!callId){

    return;

  }


  const callReference =
  doc(
    db,
    "videoCalls",
    callId
  );


  unsubscribeCall =
  onSnapshot(

    callReference,

    async function(snapshot){

      if(
        !snapshot.exists()
      ){

        showCallError(
          "This video call no longer exists."
        );


        cleanupVideoCallResources();


        return;

      }


      try{

        await processCallDocument(
          snapshot.data()
        );

      }catch(error){

        console.error(
          "Video-call document processing error:",
          error
        );

      }

    },

    function(error){

      console.error(
        "Video-call document listener error:",
        error
      );


      if(
        error?.code ===
        "permission-denied"
      ){

        showCallError(
          "Firebase denied access to this video call."
        );

      }else{

        showCallMessage(
          "The live video-call status could not be updated.",
          true
        );

      }

    }

  );

}

/* =====================================================

===================================================== */

let missedCallTimer =
null;


/* =====================================================
   START MISSED CALL TIMER
===================================================== */

function startMissedCallTimer(){

  stopMissedCallTimer();


  /*
     Automatically mark an unanswered outgoing
     call as missed after 60 seconds.
  */

  missedCallTimer =
  window.setTimeout(
    async function(){

      if(
        !currentUser ||
        !callId ||
        callRole !== "caller"
      ){

        return;

      }


      const currentStatus =
      getFirstValue(
        callData?.status,
        lastCallStatus,
        "ringing"
      ).toLowerCase();


      if(
        currentStatus !== "ringing"
      ){

        return;

      }


      try{

        await updateDoc(
          doc(
            db,
            "videoCalls",
            callId
          ),
          {

            status:
            "missed",

            endedAt:
            serverTimestamp(),

            endedBy:
            "",

            updatedAt:
            serverTimestamp()

          }
        );

      }catch(error){

        console.error(
          "Unable to mark video call as missed:",
          error
        );

      }

    },
    60000
  );

}


/* =====================================================
   STOP MISSED CALL TIMER
===================================================== */

function stopMissedCallTimer(){

  if(missedCallTimer){

    window.clearTimeout(
      missedCallTimer
    );

  }


  missedCallTimer =
  null;

}


/* =====================================================
   FINISH VIDEO CALL SCREEN
===================================================== */

function finishCallScreen(
  statusText,
  messageText
){

  stopCallTimer();


  stopMissedCallTimer();


  if(remoteAvatarFrame){

    remoteAvatarFrame.classList.remove(
      "ringing"
    );

  }


  if(incomingVideoControls){

    incomingVideoControls.classList.remove(
      "show"
    );

  }


  if(activeVideoControls){

    activeVideoControls.classList.add(
      "hidden"
    );

  }


  if(outgoingVideoControls){

    outgoingVideoControls.classList.remove(
      "hidden"
    );

  }


  disableVideoCallControls();


  if(endVideoCallButton){

    endVideoCallButton.disabled =
    true;

  }


  if(acceptVideoCallButton){

    acceptVideoCallButton.disabled =
    true;

  }


  if(rejectVideoCallButton){

    rejectVideoCallButton.disabled =
    true;

  }


  updateCallStatus(
    "ended",
    statusText
  );


  updateConnectionDisplay(
    "ended"
  );


  if(messageText){

    showCallMessage(
      messageText
    );

  }


  cleanupVideoCallResources();

}

/* =====================================================
   FIND VIDEO SENDER
===================================================== */

function getVideoSender(){

  if(!peerConnection){

    return null;

  }


  return (
    peerConnection
    .getSenders()
    .find(
      function(sender){

        return (
          sender.track &&
          sender.track.kind ===
          "video"
        );

      }
    ) ||
    null
  );

}


/* =====================================================
   SWITCH FRONT AND BACK CAMERA
===================================================== */

async function switchCamera(){

  if(
    callActionRunning ||
    !localStream
  ){

    return;

  }


  if(
    !navigator.mediaDevices ||
    typeof navigator.mediaDevices
    .getUserMedia !==
    "function"
  ){

    showCallMessage(
      "Camera switching is not supported by this browser.",
      true
    );

    return;

  }


  callActionRunning =
  true;


  if(switchCameraButton){

    switchCameraButton.disabled =
    true;


    switchCameraButton.classList.add(
      "switching"
    );

  }


  const newFacingMode =
  currentFacingMode ===
  "user"
  ? "environment"
  : "user";


  let replacementStream =
  null;


  try{

    replacementStream =
    await navigator.mediaDevices
    .getUserMedia(
      {

        audio:
        false,

        video:{

          facingMode:{
            ideal:
            newFacingMode
          },

          width:{
            ideal:
            1280
          },

          height:{
            ideal:
            720
          },

          frameRate:{
            ideal:
            24,
            max:
            30
          }

        }

      }
    );


    const newVideoTrack =
    replacementStream
    .getVideoTracks()[0];


    if(!newVideoTrack){

      throw new Error(
        "The new camera could not be opened."
      );

    }


    const videoSender =
    getVideoSender();


    if(videoSender){

      await videoSender.replaceTrack(
        newVideoTrack
      );

    }else if(peerConnection){

      peerConnection.addTrack(
        newVideoTrack,
        replacementStream
      );

    }


    const oldVideoTracks =
    localStream.getVideoTracks();


    oldVideoTracks.forEach(
      function(track){

        localStream.removeTrack(
          track
        );


        track.stop();

      }
    );


    localStream.addTrack(
      newVideoTrack
    );


    if(localVideo){

      localVideo.srcObject =
      localStream;


      localVideo.classList.toggle(
        "backCamera",
        newFacingMode ===
        "environment"
      );


      await localVideo.play()
      .catch(
        function(error){

          console.log(
            "Replacement camera playback error:",
            error
          );

        }
      );

    }


    currentFacingMode =
    newFacingMode;


    cameraDisabled =
    false;


    newVideoTrack.enabled =
    true;


    updateCameraControl();


    showCallMessage(
      newFacingMode ===
      "environment"
      ? "Back camera selected."
      : "Front camera selected."
    );


    window.setTimeout(
      function(){

        hideCallMessage();

      },
      1300
    );

  }catch(error){

    console.error(
      "Camera switching error:",
      error
    );


    if(replacementStream){

      replacementStream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

    }


    showCallMessage(
      "Unable to switch the camera on this device.",
      true
    );

  }finally{

    callActionRunning =
    false;


    if(switchCameraButton){

      switchCameraButton.disabled =
      false;


      switchCameraButton.classList.remove(
        "switching"
      );

    }

  }

}

  );

/* =====================================================

===================================================== */

function getCallEndStatus(){

  const currentStatus =
  getFirstValue(
    callData?.status,
    lastCallStatus,
    "ringing"
  ).toLowerCase();


  if(
    currentStatus ===
    "ringing" &&
    callRole ===
    "caller"
  ){

    return "cancelled";

  }


  if(
    currentStatus ===
    "ringing" &&
    callRole ===
    "receiver"
  ){

    return "rejected";

  }


  return "ended";

}

===================================================== */

async function endVideoCall(
  forcedStatus = ""
){

  if(
    callActionRunning ||
    pageIsClosing
  ){

    return;

  }


  callActionRunning =
  true;


  if(endVideoCallButton){

    endVideoCallButton.disabled =
    true;

  }


  if(acceptVideoCallButton){

    acceptVideoCallButton.disabled =
    true;

  }


  if(rejectVideoCallButton){

    rejectVideoCallButton.disabled =
    true;

  }


  const finalStatus =
  forcedStatus ||
  getCallEndStatus();


  try{

    if(callId){

      await updateDoc(
        doc(
          db,
          "videoCalls",
          callId
        ),
        {

          status:
          finalStatus,

          endedAt:
          serverTimestamp(),

          endedBy:
          currentUser?.uid ||
          "",

          updatedAt:
          serverTimestamp()

        }
      );

    }

  }catch(error){

    console.error(
      "Video-call ending error:",
      error
    );

  }


  callData.status =
  finalStatus;


  showFinishedVideoCallScreen(
    finalStatus
  );


  cleanupVideoCallResources();


  resetIceCandidateState();


  resetLiveCallState();


  callActionRunning =
  false;


  window.setTimeout(
    function(){

      if(
        window.history.length >
        1
      ){

        window.history.back();

      }else{

        window.location.href =
        "messages.html";

      }

    },
    900
  );

}

    false;

  }


  if(remoteAudio){

    remoteAudio.muted =
    false;

  }


  if(localVideo){

    localVideo.classList.remove(
      "backCamera",
      "hidden"
    );

  }


  updateMicrophoneControl();


  updateCameraControl();


  updateSpeakerControl();

}


/* =====================================================
   CLEAN UP VIDEO CALL PAGE
===================================================== */

function cleanUpVideoCallPage(){

  cleanupVideoCallResources();


  resetIceCandidateState();


  resetLiveCallState();

}


/* =====================================================
   RESTORE PAGE FROM BROWSER CACHE
===================================================== */

window.addEventListener(
  "pageshow",
  function(event){

    if(!event.persisted){

      return;

    }


    pageIsClosing =
    false;


    callActionRunning =
    false;


    resetVideoControlDisplay();

  }
);


/* =====================================================
   PAGE HIDE
===================================================== */

window.addEventListener(
  "pagehide",
  function(){

    pageIsClosing =
    true;


    cleanUpVideoCallPage();

  }
);


/* =====================================================
   BEFORE PAGE UNLOAD
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    pageIsClosing =
    true;


    cleanUpVideoCallPage();

  }
);


/* =====================================================
   INITIAL VIDEO CONTROL DISPLAY
===================================================== */

resetVideoControlDisplay();


disableVideoCallControls();


showRemoteVideoPlaceholder();


/* =====================================================
   VIDEO CALL PAGE READY
===================================================== */

console.log(
  "Faith Connect private video-call page is ready."
);


</script>
