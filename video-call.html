<style>

/* =====================================================
   PART 1 OF 14
   GENERAL RESET
   ROOT VARIABLES
   PAGE LAYOUT
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    background:#061421;
    color:#ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow:hidden;
}


/* =====================================================
   ROOT COLORS
===================================================== */

:root{

    --primary:#087bd1;
    --primaryDark:#0667b1;

    --success:#2ecc71;
    --danger:#e74c3c;
    --warning:#f5b041;

    --surface:#102536;

    --border:
        rgba(255,255,255,.14);

}


/* =====================================================
   PAGE
===================================================== */

.videoCallPage{

    position:relative;

    width:100%;
    height:100%;

    overflow:hidden;

    background:
    radial-gradient(
        circle at top,
        #163b58,
        #061421 72%
    );

}


/* =====================================================
   REMOTE VIDEO
===================================================== */

.remoteVideoArea{

    position:absolute;
    inset:0;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#061421;

}

.remoteVideo{

    width:100%;
    height:100%;

    object-fit:cover;

    background:#061421;

}


/* =====================================================
   REMOTE PLACEHOLDER
===================================================== */

.remotePlaceholder{

    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    gap:18px;

    padding:20px;

    text-align:center;

}


.remoteAvatar{

    width:145px;
    height:145px;

    border-radius:50%;

    object-fit:cover;

    border:
        5px solid
        rgba(255,255,255,.18);

    background:#d9d9d9;

}


.remoteName{

    font-size:30px;
    font-weight:900;

}


.remoteCountry{

    font-size:14px;

    opacity:.85;

}


/* =====================================================
   LOCAL CAMERA
===================================================== */

.localPreview{

    position:absolute;

    top:18px;
    right:16px;

    width:105px;
    height:150px;

    overflow:hidden;

    border-radius:22px;

    border:
        3px solid
        rgba(255,255,255,.75);

    background:#17364c;

    box-shadow:
        0 12px 25px
        rgba(0,0,0,.35);

}

.localVideo{

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

}


/* =====================================================
   HIDDEN
===================================================== */

.hidden{

    display:none !important;

}

</style>
<style>

/* =====================================================
   PART 2 OF 14
   HEADER, CALL STATUS, MESSAGES
   AND VIDEO CALL CONTROLS
===================================================== */


/* =====================================================
   VIDEO CALL HEADER
===================================================== */

.videoCallHeader{

    position:absolute;

    top:0;
    left:0;
    right:0;

    z-index:200;

    min-height:66px;

    padding:
        10px
        13px;

    display:flex;
    align-items:center;
    gap:11px;

    background:
        linear-gradient(
            to bottom,
            rgba(3,13,22,.88),
            rgba(3,13,22,.30),
            transparent
        );

}


/* =====================================================
   BACK BUTTON
===================================================== */

.backButton{

    width:43px;
    height:43px;

    flex-shrink:0;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        rgba(255,255,255,.12);

    color:#ffffff;

    font-size:24px;
    font-weight:900;

    cursor:pointer;

}


.backButton:active{

    transform:scale(.95);

}


/* =====================================================
   HEADER INFORMATION
===================================================== */

.headerInformation{

    min-width:0;
    flex:1;

    text-align:center;

}


.headerTitle{

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

    font-size:17px;
    font-weight:900;

}


.headerSubtitle{

    margin-top:4px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

    color:#bdd0df;

    font-size:10px;
    font-weight:800;

}


/* =====================================================
   SECURITY ICON
===================================================== */

.securityIcon{

    width:43px;
    height:43px;

    flex-shrink:0;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        rgba(255,255,255,.10);

    font-size:18px;

}


/* =====================================================
   CALL STATUS AREA
===================================================== */

.callStatusArea{

    position:absolute;

    top:78px;
    left:50%;

    z-index:180;

    width:
        calc(
            100% - 150px
        );

    max-width:480px;

    transform:
        translateX(-50%);

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;

    pointer-events:none;

}


.callStatus{

    min-height:29px;

    padding:
        7px
        13px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:999px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        rgba(4,18,29,.72);

    color:#c3d2dd;

    font-size:11px;
    font-weight:900;

    text-align:center;

    backdrop-filter:
        blur(10px);

}


.callStatus.ringing{

    color:#ffe39b;

}


.callStatus.connected{

    color:#a8f5c4;

}


.callStatus.ended{

    color:#ffb0b0;

}


/* =====================================================
   CALL TIMER
===================================================== */

.callTimer{

    min-height:22px;

    color:#ffffff;

    font-size:15px;
    font-weight:900;

    letter-spacing:1px;

    text-shadow:
        0 2px 5px
        rgba(0,0,0,.70);

}


/* =====================================================
   CONNECTION INDICATOR
===================================================== */

.connectionIndicator{

    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;

    color:#b6c8d6;

    font-size:10px;
    font-weight:800;

}


.connectionDot{

    width:9px;
    height:9px;

    flex-shrink:0;

    border-radius:50%;

    background:#78909f;

}


.connectionDot.connecting{

    background:var(--warning);

    animation:
        connectionBlink
        1s
        ease-in-out
        infinite;

}


.connectionDot.connected{

    background:var(--success);

}


.connectionDot.failed{

    background:var(--danger);

}


@keyframes connectionBlink{

    0%,
    100%{

        opacity:.35;

    }

    50%{

        opacity:1;

    }

}


/* =====================================================
   CALL MESSAGE
===================================================== */

.callMessage{

    position:absolute;

    left:50%;
    bottom:138px;

    z-index:170;

    width:
        calc(
            100% - 28px
        );

    max-width:520px;

    transform:
        translateX(-50%);

    padding:
        13px
        15px;

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius:16px;

    background:
        rgba(4,18,29,.82);

    color:#c4d4df;

    text-align:center;

    font-size:11px;
    font-weight:800;
    line-height:1.55;

    backdrop-filter:
        blur(10px);

}


.callMessage.error{

    border-color:
        rgba(231,76,60,.60);

    background:
        rgba(95,20,20,.88);

    color:#ffc1c1;

}


/* =====================================================
   VIDEO CONTROLS AREA
===================================================== */

.videoControlsArea{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:190;

    width:100%;

    padding:
        18px
        12px
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;

    background:
        linear-gradient(
            to top,
            rgba(2,10,17,.98),
            rgba(2,10,17,.75),
            transparent
        );

}


/* =====================================================
   ACTIVE VIDEO CONTROLS
===================================================== */

.activeVideoControls{

    width:100%;
    max-width:560px;

    display:grid;

    grid-template-columns:
        repeat(
            4,
            minmax(0,1fr)
        );

    gap:9px;

}


.videoControlButton{

    min-height:76px;

    padding:
        9px
        4px;

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius:18px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:7px;

    background:
        rgba(255,255,255,.09);

    color:#ffffff;

    font-size:10px;
    font-weight:900;

    cursor:pointer;

    backdrop-filter:
        blur(8px);

}


.videoControlButton:active{

    transform:scale(.96);

}


.videoControlButton.active{

    border-color:
        rgba(46,204,113,.58);

    background:
        rgba(46,204,113,.18);

    color:#baf7cf;

}


.videoControlButton.warning{

    border-color:
        rgba(245,176,65,.62);

    background:
        rgba(245,176,65,.18);

    color:#ffe5a5;

}


.videoControlButton:disabled{

    cursor:not-allowed;

    opacity:.46;

}


.videoControlIcon{

    width:45px;
    height:45px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        rgba(255,255,255,.11);

    font-size:21px;

}


.controlLabel{

    max-width:100%;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

}


/* =====================================================
   END CALL BUTTON
===================================================== */

.endVideoCallButton{

    width:74px;
    height:74px;

    border:0;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:var(--danger);
    color:#ffffff;

    font-size:29px;

    cursor:pointer;

    box-shadow:
        0 10px 28px
        rgba(231,76,60,.40);

}


.endVideoCallButton:active{

    transform:scale(.94);

}


.endVideoCallButton:disabled{

    cursor:not-allowed;

    opacity:.52;

}


/* =====================================================
   OUTGOING CALL CONTROL
===================================================== */

.outgoingVideoControls{

    width:100%;

    display:flex;
    align-items:center;
    justify-content:center;

}


/* =====================================================
   INCOMING CALL CONTROLS
===================================================== */

.incomingVideoControls{

    width:100%;
    max-width:430px;

    display:none;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:28px;

}


.incomingVideoControls.show{

    display:grid;

}


.incomingVideoAction{

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;

}


.incomingVideoActionButton{

    width:72px;
    height:72px;

    border:0;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#ffffff;

    font-size:28px;

    cursor:pointer;

    box-shadow:
        0 10px 26px
        rgba(0,0,0,.36);

}


.incomingVideoActionButton.accept{

    background:var(--success);

}


.incomingVideoActionButton.reject{

    background:var(--danger);

}


.incomingVideoActionButton:active{

    transform:scale(.94);

}


.incomingVideoActionButton:disabled{

    cursor:not-allowed;

    opacity:.55;

}


.incomingVideoActionLabel{

    color:#d2e0e9;

    font-size:11px;
    font-weight:900;

}


/* =====================================================
   MOBILE DESIGN
===================================================== */

@media(max-width:520px){

    .videoCallHeader{

        padding-left:9px;
        padding-right:9px;

    }


    .backButton,
    .securityIcon{

        width:40px;
        height:40px;

    }


    .callStatusArea{

        top:72px;

        width:
            calc(
                100% - 125px

    }


    .activeVideoControls{

        gap:6px;

    }


    .videoControlButton{

        min-height:69px;

        border-radius:15px;

    }


    .videoControlIcon{

        height:40px;

        font-size:18px;

    }


    .callMessage{

        bottom:125px;

    }

}


@media(max-width:380px){

    .remoteAvatar{

        width:120px;
        height:120px;

    }


    .remoteName{

        font-size:23px;

    }


    .localPreview{

        width:86px;
        height:125px;

        top:70px;
        right:9px;

    }


    .videoControlButton{

        min-height:64px;

        font-size:8px;

    }


    .videoControlIcon{

        width:37px;
        height:37px;

        font-size:17px;

    }

}

</style>

/* =====================================================
   GET FIRST AVAILABLE VALUE
===================================================== */

function getFirstValue(
    ...values
){

    for(const value of values){

        if(
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ){

            return String(value).trim();

        }

    }

    return "";

}


/* =====================================================
   SHOW CALL MESSAGE
===================================================== */

function showCallMessage(
    message,
    isError = false
){

    callMessage.textContent =
    message;

    callMessage.classList.remove(
        "hidden",
        "error"
    );


    if(isError){

        callMessage.classList.add(
            "error"
        );

    }

}


/* =====================================================
   HIDE CALL MESSAGE
===================================================== */

function hideCallMessage(){

    callMessage.textContent =
    "";

    callMessage.classList.add(
        "hidden"
    );

    callMessage.classList.remove(
        "error"
    );

}


/* =====================================================
   UPDATE CALL STATUS
===================================================== */

function updateCallStatus(
    status,
    text
){

    callStatus.className =
    "callStatus";


    if(status){

        callStatus.classList.add(
            status
        );

    }


    callStatus.textContent =
    text;

}


/* =====================================================
   UPDATE CONNECTION DISPLAY
===================================================== */

function updateConnectionDisplay(
    state
){

    connectionDot.className =
    "connectionDot";


    if(state === "connecting"){

        connectionDot.classList.add(

/* =====================================================
   REQUEST CAMERA AND MICROPHONE
===================================================== */

async function requestLocalMedia(){

    if(localStream){

        return localStream;

    }


    if(
        !navigator.mediaDevices ||
        typeof navigator.mediaDevices.getUserMedia !==
        "function"
    ){

        throw new Error(
            "Camera and microphone access are not supported by this browser."
        );

    }


    try{

        localStream =
        await navigator.mediaDevices.getUserMedia(
            getLocalMediaConstraints()
        );


        localVideo.srcObject =
        localStream;


        localVideo.muted =
        true;


        localVideo.playsInline =
        true;


        await localVideo.play()
        .catch(
            function(error){

                console.log(
                    "Local camera playback is waiting:",
                    error
                );

            }
        );


        microphoneMuted =
        false;


        cameraDisabled =
        false;


        updateMicrophoneButton();


        updateCameraButton();


        return localStream;

    }catch(error){

        console.error(
            "Camera or microphone opening error:",
            error
        );


        if(
            error?.name ===
            "NotAllowedError" ||
            error?.name ===
            "PermissionDeniedError"
        ){

            throw new Error(
                "Camera or microphone permission was denied. Allow access in your browser settings and try again."
            );

        }


        if(
            error?.name ===
            "NotFoundError" ||
            error?.name ===
            "DevicesNotFoundError"
        ){

            throw new Error(
                "No camera or microphone was found on this device."
            );

        }


        if(
            error?.name ===
            "NotReadableError" ||
            error?.name ===
            "TrackStartError"
        ){

            throw new Error(
                "The camera or microphone is being used by another application."
            );

        }


        if(
            error?.name ===
            "OverconstrainedError"
        ){

            throw new Error(
                "Your device camera does not support the requested video settings."
            );

        }


        throw new Error(
            "The camera and microphone could not be opened."
        );

    }

}

/* =====================================================
   CREATE PEER CONNECTION
===================================================== */

async function createPeerConnection(){

    if(peerConnection){

        return peerConnection;

    }


    peerConnection =
    new RTCPeerConnection(
        rtcConfiguration
    );


    remoteStream =
    new MediaStream();


    remoteVideo.srcObject =
    remoteStream;


    remoteAudio.srcObject =
    remoteStream;


    const mediaStream =
    await requestLocalMedia();


    mediaStream
    .getTracks()
    .forEach(
        function(track){

            peerConnection.addTrack(
                track,
                mediaStream
            );

        }
    );


    peerConnection.addEventListener(
        "track",
        handleRemoteTrack
    );


    peerConnection.addEventListener(
        "connectionstatechange",
        handleConnectionState
    );


    peerConnection.addEventListener(
        "iceconnectionstatechange",
        handleIceConnectionState
    );


    return peerConnection;

}


/* =====================================================
   HANDLE REMOTE TRACK
===================================================== */

function handleRemoteTrack(
    event
){

    if(!remoteStream){

        remoteStream =
        new MediaStream();


        remoteVideo.srcObject =
        remoteStream;


        remoteAudio.srcObject =
        remoteStream;

    }


    if(
        event.streams &&
        event.streams.length > 0
    ){

        event.streams
        .forEach(
            function(stream){

                stream
                .getTracks()
                .forEach(
                    function(track){

                        addRemoteTrack(
                            track
                        );

                    }
                );

            }
        );

    }else if(event.track){

        addRemoteTrack(
            event.track
        );

    }


    if(event.track){

        event.track.addEventListener(
            "unmute",
            function(){

                if(
                    event.track.kind ===
                    "video"
                ){

                    showRemoteVideo();

                }


                playRemoteMedia();

            }
        );


        event.track.addEventListener(
            "mute",
            function(){

                if(
                    event.track.kind ===
                    "video"
                ){

                    checkRemoteVideoTrack();

                }

            }
        );


        event.track.addEventListener(
            "ended",
            function(){

                if(
                    event.track.kind ===
                    "video"
                ){

                    checkRemoteVideoTrack();

                }

            }
        );

    }


    playRemoteMedia();


    checkRemoteVideoTrack();

}


/* =====================================================
   ADD REMOTE TRACK
===================================================== */

function addRemoteTrack(
    track
){

    if(
        !track ||
        !remoteStream
    ){

        return;

    }


    const trackExists =
    remoteStream
    .getTracks()
    .some(
        function(existingTrack){

            return (
                existingTrack.id ===
                track.id
            );

        }
    );


    if(!trackExists){

        remoteStream.addTrack(
            track
        );

    }

}


/* =====================================================
   PLAY REMOTE MEDIA
===================================================== */

function playRemoteMedia(){

    remoteVideo.play()
    .catch(
        function(error){

            console.log(
                "Remote video playback waiting:",
                error
            );

        }
    );


    remoteAudio.play()
    .catch(
        function(error){

            console.log(
                "Remote audio playback waiting:",
                error
            );

        }
    );

}


/* =====================================================
   CHECK REMOTE VIDEO TRACK
===================================================== */

function checkRemoteVideoTrack(){

    if(!remoteStream){

        showRemotePlaceholder();

        return;

    }


    const activeVideoTrack =
    remoteStream
    .getVideoTracks()
    .find(
        function(track){

            return (
                track.readyState ===
                "live" &&
                track.muted !==
                true
            );

        }
    );


    if(activeVideoTrack){

        showRemoteVideo();

    }else{

        showRemotePlaceholder();

    }

}


/* =====================================================
   HANDLE CONNECTION STATE
===================================================== */

function handleConnectionState(){

    if(!peerConnection){

        return;

    }


    const state =
    peerConnection.connectionState;


    console.log(
        "Video-call connection state:",
        state
    );


    if(state === "connecting"){

        updateConnectionDisplay(
            "connecting"
        );


        updateCallStatus(
            "ringing",
            "Connecting..."
        );

    }else if(state === "connected"){

        updateConnectionDisplay(
            "connected"
        );


        updateCallStatus(
            "connected",
            "Connected"
        );


        hideCallMessage();


        enableVideoControls();


        startCallTimer();


        playRemoteMedia();


        checkRemoteVideoTrack();

    }else if(state === "disconnected"){

        connectionText.textContent =
        "Connection interrupted";


        showCallMessage(
            "The connection was interrupted. Trying to reconnect..."
        );

    }else if(state === "failed"){

        updateConnectionDisplay(
            "failed"
        );


        updateCallStatus(
            "ended",
            "Connection failed"
        );


        showCallMessage(
            "The video connection failed. End the call and try again.",
            true
        );

    }else if(state === "closed"){

        updateConnectionDisplay(
            "ended"
        );


        updateCallStatus(
            "ended",
            "Call ended"
        );

    }

}


/* =====================================================
   HANDLE ICE CONNECTION STATE
===================================================== */

function handleIceConnectionState(){

    if(!peerConnection){

        return;

    }


    const iceState =
    peerConnection.iceConnectionState;


    console.log(
        "Video-call ICE state:",
        iceState
    );


    if(
        iceState === "checking"
    ){

        updateConnectionDisplay(
            "connecting"
        );

    }else if(
        iceState === "connected" ||
        iceState === "completed"
    ){

        updateConnectionDisplay(
            "connected"
        );

    }else if(
        iceState === "disconnected"
    ){

        connectionText.textContent =
        "Connection temporarily interrupted";

    }else if(
        iceState === "failed"
    ){

        updateConnectionDisplay(
            "failed"
        );


        showCallMessage(
            "The two devices could not establish a video connection.",
            true
        );

    }else if(
        iceState === "closed"
    ){

        updateConnectionDisplay(
            "ended"
        );

    }

}

/* =====================================================
   START CALL TIMER
===================================================== */

function startCallTimer(){

    if(callTimerInterval){

        return;

    }


    callStartedAt =
    Date.now();


    callTimer.textContent =
    "00:00";


    callTimerInterval =
    window.setInterval(
        function(){

            const totalSeconds =
            Math.floor(
                (
                    Date.now() -
                    callStartedAt
                ) / 1000
            );


            const hours =
            Math.floor(
                totalSeconds /
                3600
            );


            const minutes =
            Math.floor(
                (
                    totalSeconds %
                    3600
                ) / 60
            );


            const seconds =
            totalSeconds %
            60;


            if(hours > 0){

                callTimer.textContent =
                `${String(hours).padStart(
                    2,
                    "0"
                )}:${String(minutes).padStart(
                    2,
                    "0"
                )}:${String(seconds).padStart(
                    2,
                    "0"
                )}`;

            }else{

                callTimer.textContent =
                `${String(minutes).padStart(
                    2,
                    "0"
                )}:${String(seconds).padStart(
                    2,
                    "0"
                )}`;

            }

        },
        1000
    );

}


/* =====================================================
   STOP CALL TIMER
===================================================== */

function stopCallTimer(){

    if(callTimerInterval){

        window.clearInterval(
            callTimerInterval
        );

    }


    callTimerInterval =
    null;


    callStartedAt =
    null;

}

/* =====================================================
   PREPARE INCOMING VIDEO CALL
===================================================== */

async function prepareIncomingCall(){

    if(
        !currentUser ||
        !callId
    ){

        showCallError(
            "The incoming video-call information is missing."
        );


        return;

    }


    try{

        const callReference =
        doc(
            db,
            "videoCalls",
            callId
        );


        const callSnapshot =
        await getDoc(
            callReference
        );


        if(!callSnapshot.exists()){

            showCallError(
                "This video call no longer exists."
            );


            return;

        }


        callData = {

            id:
            callSnapshot.id,

            ...callSnapshot.data()

        };


        if(
            callData.receiverId !==
            currentUser.uid
        ){

            showCallError(
                "You are not the receiver of this video call."
            );


            return;

        }


        const currentStatus =
        getFirstValue(
            callData.status,
            "ringing"
        ).toLowerCase();


        if(
            currentStatus === "ended" ||
            currentStatus === "rejected" ||
            currentStatus === "cancelled" ||
            currentStatus === "missed" ||
            currentStatus === "failed"
        ){

            showCallError(
                "This video call has already ended."
            );


            return;

        }


        otherUserId =
        getFirstValue(
            callData.callerId
        );


        otherProfile =
        await loadUserProfile(
            otherUserId
        );


        otherProfile = {

            ...otherProfile,

            fullName:
            getFirstValue(
                otherProfile.fullName,
                otherProfile.name,
                callData.callerName
            ),

            profilePicture:
            getFirstValue(
                otherProfile.profilePicture,
                otherProfile.photoURL,
                callData.callerPicture
            ),

            country:
            getFirstValue(
                otherProfile.country,
                callData.callerCountry
            )

        };


        displayOtherMember();


        headerSubtitle.textContent =
        "Incoming private video call";


        updateCallStatus(
            "ringing",
            "Incoming video call"
        );


        updateConnectionDisplay(
            "connecting"
        );


        showRemotePlaceholder();


        incomingVideoControls.classList.add(
            "show"
        );


        outgoingVideoControls.classList.add(
            "hidden"
        );

async function startOutgoingVideoCall(){

    if(
        outgoingCallStarted ||
        callActionRunning
    ){
        return;
    }

    outgoingCallStarted = true;
    callActionRunning = true;

    try{

        const connection =
        await createPeerConnection();

        const callReference =
        doc(
            collection(
                db,
                "videoCalls"
            )
        );

        callId =
        callReference.id;

        const caller =
        getCurrentCallerInformation();

        /* -----------------------------------------
           Save ICE candidates
        ----------------------------------------- */

        connection.addEventListener(
            "icecandidate",
            async(event)=>{

                if(
                    !event.candidate
                ){
                    return;
                }

                await addDoc(

                    collection(
                        db,
                        "videoCalls",
                        callId,
                        "callerCandidates"
                    ),

                    event.candidate.toJSON()

                );

            }
        );

        /* -----------------------------------------
           Create Offer
        ----------------------------------------- */

        const offer =
        await connection.createOffer({

            offerToReceiveAudio:true,
            offerToReceiveVideo:true

        });

        await connection.setLocalDescription(
            offer
        );

        /* -----------------------------------------
           Save Firestore document
        ----------------------------------------- */

        await setDoc(

            callReference,

            {

                type:"video",

                callerId:
                currentUser.uid,

                callerName:
                caller.callerName,

                callerPicture:
                caller.callerPicture,

                callerCountry:
                caller.callerCountry,

                receiverId:
                otherUserId,

                receiverName:
                getProfileName(
                    otherProfile
                ),

                receiverPicture:
                getProfilePicture(
                    otherProfile
                ),

                receiverCountry:
                getProfileCountry(
                    otherProfile
                ),

                offer:{

                    type:
                    offer.type,

                    sdp:
                    offer.sdp

                },

                answer:null,

                status:"ringing",

                createdAt:
                serverTimestamp(),

                updatedAt:
                serverTimestamp()

            }

        );

        updateCallStatus(
            "ringing",
            "Calling..."
        );

        updateConnectionDisplay(
            "connecting"
        );

        showCallMessage(
            "Calling " +
            getProfileName(
                otherProfile
            ) +
            "..."
        );

        startCallDocumentListener();

        startReceiverCandidateListener();

        console.log(
            "Outgoing call created:",
            callId
        );

    }
    catch(error){

        console.error(error);

        showCallError(
            error.message ||
            "Unable to start video call."
        );

        cleanupPeerConnection();
        cleanupLocalMedia();
        cleanupRemoteMedia();

    }
    finally{

        callActionRunning=false;

    }

}

/* =====================================================
   ACCEPT INCOMING VIDEO CALL
===================================================== */

async function acceptIncomingVideoCall(){

    if(
        callActionRunning ||
        !currentUser ||
        !callId
    ){

        return;

    }


    callActionRunning =
    true;


    acceptVideoCallButton.disabled =
    true;


    rejectVideoCallButton.disabled =
    true;


    acceptVideoCallButton.textContent =
    "…";


    hideCallMessage();


    updateCallStatus(
        "ringing",
        "Connecting..."
    );


    updateConnectionDisplay(
        "connecting"
    );


    try{

        const callReference =
        doc(
            db,
            "videoCalls",
            callId
        );


        const callSnapshot =
        await getDoc(
            callReference
        );


        if(!callSnapshot.exists()){

            throw new Error(
                "This video call no longer exists."
            );

        }


        const latestCallData =
        callSnapshot.data();


        if(
            latestCallData.receiverId !==
            currentUser.uid
        ){

            throw new Error(
                "You are not allowed to accept this video call."
            );

        }


        const latestStatus =
        getFirstValue(
            latestCallData.status,
            ""
        ).toLowerCase();


        if(
            latestStatus === "ended" ||
            latestStatus === "rejected" ||
            latestStatus === "cancelled" ||
            latestStatus === "missed" ||
            latestStatus === "failed"
        ){

            throw new Error(
                "This video call has already ended."
            );

        }


        if(!latestCallData.offer){

            throw new Error(
                "The caller's connection information is missing."
            );

        }


        callData = {

            id:
            callId,

            ...latestCallData

        };


        /*
           Create the receiver's peer connection
           and open camera and microphone.
        */

        const connection =
        await createPeerConnection();


        /*
           Save receiver ICE candidates.
        */

        connection.addEventListener(
            "icecandidate",
            async function(event){

                if(
                    !event.candidate ||
                    !callId
                ){

                    return;

                }


                try{

                    await addDoc(
                        collection(
                            db,
                            "videoCalls",
                            callId,
                            "receiverCandidates"
                        ),
                        event.candidate.toJSON()
                    );

                }catch(error){

                    console.error(
                        "Receiver ICE candidate saving error:",
                        error
                    );

                }

            }
        );


        /*
           Apply the caller's WebRTC offer.
        */

        const remoteOffer =
        new RTCSessionDescription(
            latestCallData.offer
        );


        await connection.setRemoteDescription(
            remoteOffer
        );


        /*
           Apply caller candidates that may have
           arrived before the offer was ready.
        */

        if(
            typeof applyPendingCallerCandidates ===
            "function"
        ){

            await applyPendingCallerCandidates();

        }


        /*
           Create the receiver's WebRTC answer.
        */

        const answerDescription =
        await connection.createAnswer();


        await connection.setLocalDescription(
            answerDescription
        );


        const answer = {

            type:
            answerDescription.type,

            sdp:
            answerDescription.sdp

        };


        /*
           Save the answer in Firestore.
        */

        await updateDoc(
            callReference,
            {

                answer:
                answer,

                status:
                "accepted",

                acceptedAt:
                serverTimestamp(),

                updatedAt:
                serverTimestamp()

            }
        );


        callData.answer =
        answer;


        callData.status =
        "accepted";


        /*
           Listen for caller ICE candidates.
           The function is added in Part 11.
        */

        startCallerCandidateListener();


        startCallDocumentListener();


        incomingVideoControls.classList.remove(
            "show"
        );


        outgoingVideoControls.classList.remove(
            "hidden"
        );


        activeVideoControls.classList.remove(
            "hidden"
        );


        endVideoCallButton.disabled =
        false;


        updateCallStatus(
            "ringing",
            "Connecting..."
        );


        updateConnectionDisplay(
            "connecting"
        );


        showCallMessage(
            "Video call accepted. Connecting camera and sound..."
        );


        playRemoteMedia();


        console.log(
            "Incoming video call accepted:",
            callId
        );

    }catch(error){

        console.error(
            "Incoming video-call acceptance error:",
            error
        );


        showCallError(
            error?.message ||
            "The video call could not be accepted."
        );


        cleanupPeerConnection();


        cleanupLocalMedia();


        cleanupRemoteMedia();

    }finally{

        callActionRunning =
        false;


        acceptVideoCallButton.disabled =
        false;


        rejectVideoCallButton.disabled =
        false;


        acceptVideoCallButton.textContent =
        "📹";

    }

}

/* =====================================================
   ICE CANDIDATE STATE
===================================================== */

const processedCallerCandidateIds =
new Set();


const processedReceiverCandidateIds =
new Set();


const pendingCallerCandidates =
[];


const pendingReceiverCandidates =
[];


/* =====================================================
   LIVE CALL STATE
===================================================== */

let receiverAnswerApplied =
false;


let lastCallStatus =
"";


/* =====================================================
   CHECK REMOTE DESCRIPTION
===================================================== */

function peerHasRemoteDescription(){

    return Boolean(
        peerConnection &&
        peerConnection.remoteDescription &&
        peerConnection.remoteDescription.type
    );

}


/* =====================================================
   ADD REMOTE ICE CANDIDATE
===================================================== */

async function addRemoteIceCandidate(
    candidateData,
    pendingList
){

    if(
        !candidateData ||
        !peerConnection
    ){

        return;

    }


    try{

        const candidate =
        new RTCIceCandidate(
            candidateData
        );


        if(
            peerHasRemoteDescription()
        ){

            await peerConnection.addIceCandidate(
                candidate
            );

        }else{

            pendingList.push(
                candidate
            );

        }

    }catch(error){

        console.error(
            "Remote ICE candidate error:",
            error
        );

    }

}


/* =====================================================
   APPLY PENDING ICE CANDIDATES
===================================================== */

async function applyPendingCandidates(
    pendingList
){

    if(
        !peerConnection ||
        !peerHasRemoteDescription()
    ){

        return;

    }


    while(
        pendingList.length > 0
    ){

        const candidate =
        pendingList.shift();


        try{

            await peerConnection.addIceCandidate(
                candidate
            );

        }catch(error){

            console.error(
                "Pending ICE candidate error:",
                error
            );

        }

    }

}


/* =====================================================
   APPLY PENDING CALLER CANDIDATES
===================================================== */

async function applyPendingCallerCandidates(){

    await applyPendingCandidates(
        pendingCallerCandidates
    );

}


/* =====================================================
   APPLY PENDING RECEIVER CANDIDATES
===================================================== */

async function applyPendingReceiverCandidates(){

    await applyPendingCandidates(
        pendingReceiverCandidates
    );

}


/* =====================================================
   STOP CALL DOCUMENT LISTENER
===================================================== */

function stopCallDocumentListener(){

    if(
        typeof unsubscribeCall ===
        "function"
    ){

        unsubscribeCall();

    }


    unsubscribeCall =
    null;

}


/* =====================================================
   STOP CALLER CANDIDATE LISTENER
===================================================== */

function stopCallerCandidateListener(){

    if(
        typeof unsubscribeCallerCandidates ===
        "function"
    ){

        unsubscribeCallerCandidates();

    }


    unsubscribeCallerCandidates =
    null;

}


/* =====================================================
   STOP RECEIVER CANDIDATE LISTENER
===================================================== */

function stopReceiverCandidateListener(){

    if(
        typeof unsubscribeReceiverCandidates ===
        "function"
    ){

        unsubscribeReceiverCandidates();

    }


    unsubscribeReceiverCandidates =
    null;

}


/* =====================================================
   LISTEN FOR CALLER ICE CANDIDATES
   USED BY THE RECEIVER
===================================================== */

function startCallerCandidateListener(){

    stopCallerCandidateListener();


    if(!callId){

        return;

    }


    const callerCandidatesReference =
    collection(
        db,
        "videoCalls",
        callId,
        "callerCandidates"
    );


    unsubscribeCallerCandidates =
    onSnapshot(

        callerCandidatesReference,

        function(snapshot){

            snapshot.docChanges()
            .forEach(
                function(change){

                    if(
                        change.type !==
                        "added"
                    ){

                        return;

                    }


                    if(
                        processedCallerCandidateIds.has(
                            change.doc.id
                        )
                    ){

                        return;

                    }


                    processedCallerCandidateIds.add(
                        change.doc.id
                    );


                    addRemoteIceCandidate(
                        change.doc.data(),
                        pendingCallerCandidates
                    );

                }
            );

        },

        function(error){

            console.error(
                "Caller ICE candidate listener error:",
                error
            );

        }

    );

}


/* =====================================================
   LISTEN FOR RECEIVER ICE CANDIDATES
   USED BY THE CALLER
===================================================== */

function startReceiverCandidateListener(){

    stopReceiverCandidateListener();


    if(!callId){

        return;

    }


    const receiverCandidatesReference =
    collection(
        db,
        "videoCalls",
        callId,
        "receiverCandidates"
    );


    unsubscribeReceiverCandidates =
    onSnapshot(

        receiverCandidatesReference,

        function(snapshot){

            snapshot.docChanges()
            .forEach(
                function(change){

                    if(
                        change.type !==
                        "added"
                    ){

                        return;

                    }


                    if(
                        processedReceiverCandidateIds.has(
                            change.doc.id
                        )
                    ){

                        return;

                    }


                    processedReceiverCandidateIds.add(
                        change.doc.id
                    );


                    addRemoteIceCandidate(
                        change.doc.data(),
                        pendingReceiverCandidates
                    );

                }
            );

        },

        function(error){

            console.error(
                "Receiver ICE candidate listener error:",
                error
            );

        }

    );

}


/* =====================================================
   APPLY RECEIVER ANSWER TO CALLER
===================================================== */

async function applyReceiverAnswer(
    answerData
){

    if(
        callRole !== "caller" ||
        !answerData ||
        !peerConnection ||
        receiverAnswerApplied
    ){

        return;

    }


    try{

        const remoteAnswer =
        new RTCSessionDescription(
            answerData
        );


        await peerConnection.setRemoteDescription(
            remoteAnswer
        );


        receiverAnswerApplied =
        true;


        await applyPendingReceiverCandidates();


        updateCallStatus(
            "ringing",
            "Connecting..."
        );


        updateConnectionDisplay(
            "connecting"
        );


        hideCallMessage();


        console.log(
            "Receiver video answer applied."
        );

    }catch(error){

        console.error(
            "Receiver answer application error:",
            error
        );


        updateConnectionDisplay(
            "failed"
        );


        showCallMessage(
            "The member answered, but the video connection could not be completed.",
            true
        );

    }

}


/* =====================================================
   PROCESS LIVE CALL DOCUMENT
===================================================== */

async function processCallDocument(
    latestCallData
){

    if(!latestCallData){

        return;

    }


    callData = {

        id:
        callId,

        ...latestCallData

    };


    const latestStatus =
    getFirstValue(
        latestCallData.status,
        "ringing"
    ).toLowerCase();


    if(
        callRole === "caller" &&
        latestCallData.answer &&
        !receiverAnswerApplied
    ){

        await applyReceiverAnswer(
            latestCallData.answer
        );

    }


    if(
        typeof handleLiveCallStatus ===
        "function"
    ){

        await handleLiveCallStatus(
            latestStatus,
            latestCallData
        );

    }


    lastCallStatus =
    latestStatus;

}


/* =====================================================
   START LIVE CALL DOCUMENT LISTENER
===================================================== */

function startCallDocumentListener(){

    stopCallDocumentListener();


    if(!callId){

        return;

    }


    const callReference =
    doc(
        db,
        "videoCalls",
        callId
    );


    unsubscribeCall =
    onSnapshot(

        callReference,

        async function(snapshot){

            if(!snapshot.exists()){

                showCallError(
                    "This video call no longer exists."
                );


                cleanupVideoCallResources();


                return;

            }


            try{

                await processCallDocument(
                    snapshot.data()
                );

            }catch(error){

                console.error(
                    "Live video-call processing error:",
                    error
                );

            }

        },

        function(error){

            console.error(
                "Video-call document listener error:",
                error
            );


            if(
                error?.code ===
                "permission-denied"
            ){

                showCallError(
                    "Firebase denied access to this video call."
                );

            }else{

                showCallMessage(
                    "The live video-call status could not be updated.",
                    true
                );

            }

        }

    );

}


/* =====================================================
   RESET ICE CANDIDATE STATE
===================================================== */

function resetIceCandidateState(){

    processedCallerCandidateIds.clear();


    processedReceiverCandidateIds.clear();


    pendingCallerCandidates.splice(
        0,
        pendingCallerCandidates.length
    );


    pendingReceiverCandidates.splice(
        0,
        pendingReceiverCandidates.length
    );

}


/* =====================================================
   RESET LIVE CALL STATE
===================================================== */

function resetLiveCallState(){

    receiverAnswerApplied =
    false;


    lastCallStatus =
    "";

}

/* =====================================================

function handleFailedStatus(){

        "show"

    activeVideoControls.classList.add(

    );


    outgoingVideoControls.classList.remove(

    );


    disableVideoControls();


    endVideoCallButton.disabled =
    false;


    updateCallStatus(
        "ended",
        "Connection failed"
    );


    updateConnectionDisplay(
        "failed"
    );


    showCallMessage(
        "The video connection failed. End the call and try again.",
        true
    );

}


/* =====================================================
   HANDLE LIVE CALL STATUS
===================================================== */

async function handleLiveCallStatus(
    status,
    latestCallData
){

    switch(status){

        case "ringing":

            handleRingingStatus();

            break;


        case "accepted":

        case "connecting":

            await handleAcceptedStatus(
                latestCallData
            );

            break;


        case "connected":

            handleConnectedStatus();

            break;


        case "rejected":

            handleRejectedStatus();

            break;


        case "cancelled":

            handleCancelledStatus();

            break;


        case "ended":

            handleEndedStatus(
                latestCallData
            );

            break;


        case "missed":

            handleMissedStatus();

            break;


        case "failed":

            handleFailedStatus();

            break;


        default:

            console.log(
                "Unknown video-call status:",
                status
            );

    }

}


/* =====================================================
   MARK CALL AS CONNECTED
===================================================== */

async function markCallAsConnected(){

    if(
        !callId ||
        !currentUser ||
        lastCallStatus === "connected"
    ){

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "videoCalls",
                callId
            ),
            {

                status:
                "connected",

                connectedAt:
                serverTimestamp(),

                updatedAt:
                serverTimestamp()

            }
        );


        callData.status =
        "connected";


        lastCallStatus =
        "connected";

    }catch(error){

        console.error(
            "Unable to mark video call as connected:",
            error
        );

    }

}


/* =====================================================
   WATCH CONNECTION AND MARK CONNECTED
===================================================== */

function watchConnectedPeerState(){

    if(!peerConnection){

        return;

    }


    if(
        peerConnection.connectionState ===
        "connected"
    ){

        markCallAsConnected();

        return;

    }


    peerConnection.addEventListener(
        "connectionstatechange",
        function connectedStateWatcher(){

            if(
                !peerConnection ||
                peerConnection.connectionState !==
                "connected"
            ){

                return;

            }


            markCallAsConnected();


            peerConnection.removeEventListener(
                "connectionstatechange",
                connectedStateWatcher
            );

        }
    );

}

/* =====================================================
   REPLACE VIDEO TRACK
===================================================== */

async function replaceVideoTrack(
    newVideoTrack,
    replacementStream
){

    if(
        !peerConnection ||
        !newVideoTrack
    ){

        return;

    }


    const videoSender =
    peerConnection
    .getSenders()
    .find(
        function(sender){

            return (
                sender.track &&
                sender.track.kind ===
                "video"
            );

        }
    );


    if(videoSender){

        await videoSender.replaceTrack(
            newVideoTrack
        );

    }else{

        peerConnection.addTrack(
            newVideoTrack,
            replacementStream
        );

    }

}


/* =====================================================
   SWITCH FRONT AND BACK CAMERA
===================================================== */

async function switchCamera(){

    if(
        callActionRunning ||
        !localStream
    ){

        return;

    }


    if(
        !navigator.mediaDevices ||
        typeof navigator.mediaDevices.getUserMedia !==
        "function"
    ){

        showCallMessage(
            "Camera switching is not supported by this browser.",
            true
        );


        return;

    }


    callActionRunning =
    true;


    switchCameraButton.disabled =
    true;


    switchCameraButton.classList.add(
        "switching"
    );


    const newFacingMode =
    currentFacingMode ===
    "user"
    ? "environment"
    : "user";


    try{

        const replacementStream =
        await navigator.mediaDevices.getUserMedia(
            {

                audio:
                false,

                video:{

                    facingMode:{

                        ideal:
                        newFacingMode

                    },

                    width:{

                        ideal:
                        1280

                    },

                    height:{

                        ideal:
                        720

                    }

                }

            }
        );


        const newVideoTrack =
        replacementStream
        .getVideoTracks()[0];


        if(!newVideoTrack){

            throw new Error(
                "The selected camera could not be opened."
            );

        }


        await replaceVideoTrack(
            newVideoTrack,
            replacementStream
        );


        const oldVideoTracks =
        localStream.getVideoTracks();


        oldVideoTracks.forEach(
            function(track){

                localStream.removeTrack(
                    track
                );


                track.stop();

            }
        );


        localStream.addTrack(
            newVideoTrack
        );


        localVideo.srcObject =
        localStream;


        localVideo.classList.toggle(
            "backCamera",
            newFacingMode ===
            "environment"
        );


        await localVideo.play()
        .catch(
            function(error){

                console.log(
                    "Replacement camera playback error:",
                    error
                );

            }
        );


        currentFacingMode =
        newFacingMode;


        cameraDisabled =
        false;


        newVideoTrack.enabled =
        true;


        updateCameraButton();


        switchCameraIcon.textContent =
        newFacingMode ===
        "environment"
        ? "🔙"
        : "🔄";


        showCallMessage(
            newFacingMode ===
            "environment"
            ? "Back camera selected."
            : "Front camera selected."
        );


        window.setTimeout(
            hideCallMessage,
            1200
        );

    }catch(error){

        console.error(
            "Camera switching error:",
            error
        );


        showCallMessage(
            "Unable to switch the camera on this device.",
            true
        );

    }finally{

        callActionRunning =
        false;


        switchCameraButton.disabled =
        false;


        switchCameraButton.classList.remove(
            "switching"
        );

    }

}


/* =====================================================
   SWITCH CAMERA BUTTON EVENT
===================================================== */

switchCameraButton.addEventListener(

    switchCamera
);

/* =====================================================
   DETERMINE FINAL CALL STATUS
===================================================== */

function getFinalCallStatus(){

    const currentStatus =
    getFirstValue(
        callData?.status,
        lastCallStatus,
        "ringing"
    ).toLowerCase();


    if(
        currentStatus ===
        "ringing" &&
        callRole ===
        "caller"
    ){

        return "cancelled";

    }


    if(
        currentStatus ===
        "ringing" &&
        callRole ===
        "receiver"
    ){

        return "rejected";

    }


    return "ended";

}


/* =====================================================
   CLEAN UP ALL VIDEO-CALL RESOURCES
===================================================== */

function cleanupVideoCallResources(){

    stopCallTimer();


    stopCallDocumentListener();


    stopCallerCandidateListener();


    stopReceiverCandidateListener();


    cleanupPeerConnection();


    cleanupLocalMedia();


    cleanupRemoteMedia();

}


/* =====================================================
   END, CANCEL OR REJECT VIDEO CALL
===================================================== */

async function endVideoCall(
    forcedStatus = ""
){

    if(
        callActionRunning ||
        pageClosing
    ){

        return;

    }


    callActionRunning =
    true;


    endVideoCallButton.disabled =
    true;


    acceptVideoCallButton.disabled =
    true;


    rejectVideoCallButton.disabled =
    true;


    const finalStatus =
    forcedStatus ||
    getFinalCallStatus();


    try{

        if(callId){

            await updateDoc(
                doc(
                    db,
                    "videoCalls",
                    callId
                ),
                {

                    status:
                    finalStatus,

                    endedBy:
                    currentUser?.uid ||
                    "",

                    endedAt:
                    serverTimestamp(),

                    updatedAt:
                    serverTimestamp()

                }
            );

        }

    }catch(error){

        console.error(
            "Video-call ending error:",
            error
        );

    }


    callData.status =
    finalStatus;


    incomingVideoControls.classList.remove(
        "show"
    );


    activeVideoControls.classList.add(
        "hidden"
    );


    outgoingVideoControls.classList.remove(
        "hidden"
    );


    disableVideoControls();


    updateConnectionDisplay(
        "ended"
    );


    if(
        finalStatus ===
        "cancelled"
    ){

        updateCallStatus(
            "ended",
            "Call cancelled"
        );


        showCallMessage(
            "You cancelled the video call."
        );

    }else if(
        finalStatus ===
        "rejected"
    ){

        updateCallStatus(
            "ended",
            "Call rejected"
        );


        showCallMessage(
            "You rejected the video call."
        );

    }else{

        updateCallStatus(
            "ended",
            "Call ended"
        );


        showCallMessage(
            "The video call has ended."
        );

    }


    cleanupVideoCallResources();


    resetIceCandidateState();


    resetLiveCallState();


    callActionRunning =
    false;


    window.setTimeout(
        function(){

            if(
                window.history.length >
                1
            ){

                window.history.back();

            }else{

                window.location.href =
                "messages.html";

            }

        },
        900
    );

}

   END CALL BUTTON
===================================================== */

endVideoCallButton.addEventListener(

    function(){

);

);

}

===================================================== */

        }

);
