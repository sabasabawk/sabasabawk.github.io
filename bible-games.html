<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Academy - SABASABA Gospel Ministry</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f7f7f7;
}

.header {
  background: #fff;
  text-align: center;
  padding: 15px;
  border-bottom: 2px solid #ddd;
}

.header h2 {
  color: #1e3c72;
  margin: 0;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 15px;
  margin: 12px 0;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  border: none;
  border-radius: 8px;
  background: #1e3c72;
  color: white;
  font-size: 15px;
}

button:disabled {
  background: #aaa;
}

.level-title {
  font-weight: bold;
  color: #1e3c72;
}

.badge {
  display: inline-block;
  background: gold;
  padding: 6px 10px;
  border-radius: 8px;
  margin-top: 8px;
}

.progress {
  font-weight: bold;
  color: green;
}

.footer {
  text-align: center;
  padding: 12px;
  font-size: 13px;
  background: #fff;
  border-top: 1px solid #ddd;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="header">
  <h2>🎮 SABASABA Bible Academy</h2>
  <p>SABASABA Gospel Ministry</p>
</div>

<div class="container">

  <!-- PROGRESS -->
  <div class="card">
    <h3>📊 My Progress</h3>
    <p class="progress">Points: <span id="points">0</span></p>
    <p>Unlocked Level: <span id="unlocked">1</span> / 10</p>
    <div id="badge"></div>
  </div>

  <!-- LEVELS -->
  <div id="levels"></div>

</div>

<div class="footer">
  © SABASABA Gospel Ministry | Faith • Word • Power
</div>

<script>

let points = 0;
let unlocked = 1;

const levels = [
  "Creation",
  "Noah",
  "Abraham",
  "Joseph",
  "Moses",
  "Judges",
  "Kings & Prophets",
  "Jesus Christ",
  "Apostles",
  "Revelation"
];

// LOAD DATA
function load(){
  points = parseInt(localStorage.getItem("points")) || 0;
  unlocked = parseInt(localStorage.getItem("unlocked")) || 1;
  renderLevels();
  updateUI();
}

// SAVE
function save(){
  localStorage.setItem("points", points);
  localStorage.setItem("unlocked", unlocked);
}

// UPDATE UI
function updateUI(){
  document.getElementById("points").innerText = points;
  document.getElementById("unlocked").innerText = unlocked;

  let badge = "";

  if(points >= 300){
    badge = "👑 Bible Champion";
  } else if(points >= 200){
    badge = "🥇 Bible Scholar";
  } else if(points >= 100){
    badge = "🥈 Bible Student";
  }

  document.getElementById("badge").innerHTML =
    badge ? `<div class="badge">${badge}</div>` : "";
}

// RENDER LEVELS
function renderLevels(){
  let html = "";

  levels.forEach((lvl, i) => {
    let locked = (i + 1) > unlocked;

    html += `
      <div class="card">
        <h3 class="level-title">Level ${i+1}: ${lvl}</h3>
        <button ${locked ? "disabled" : ""} onclick="play(${i})">
          ${locked ? "🔒 Locked" : "▶ Play"}
        </button>
      </div>
    `;
  });

  document.getElementById("levels").innerHTML = html;
}

// PLAY LEVEL
function play(i){

  let correct = 0;

  if(i === 0){
    if(confirm("Creation: Did God create the world in 6 days? OK=Yes Cancel=No")) correct++;
    if(confirm("Did God rest on the 7th day? OK=Yes Cancel=No")) correct++;
  }

  if(i === 1){
    if(confirm("Noah built an ark?")) correct++;
    if(confirm("Was there a flood?")) correct++;
  }

  if(i === 2){
    if(confirm("Abraham had faith in God?")) correct++;
    if(confirm("He is called father of nations?")) correct++;
  }

  if(i === 3){
    if(confirm("Joseph was sold by brothers?")) correct++;
    if(confirm("He became ruler in Egypt?")) correct++;
  }

  if(i === 4){
    if(confirm("Moses led Israel out of Egypt?")) correct++;
    if(confirm("He received 10 commandments?")) correct++;
  }

  if(i === 5){
    if(confirm("Judges ruled Israel?")) correct++;
    if(confirm("Samson was a judge?")) correct++;
  }

  if(i === 6){
    if(confirm("David was a king?")) correct++;
    if(confirm("Elijah was a prophet?")) correct++;
  }

  if(i === 7){
    if(confirm("Jesus performed miracles?")) correct++;
    if(confirm("He rose from the dead?")) correct++;
  }

  if(i === 8){
    if(confirm("Apostles preached the gospel?")) correct++;
    if(confirm("Peter was an apostle?")) correct++;
  }

  if(i === 9){
    if(confirm("Revelation is prophetic?")) correct++;
    if(confirm("Jesus will come again?")) correct++;
  }

  points += correct * 10;

  if(correct >= 2 && unlocked < 10){
    unlocked++;
    alert("Level Unlocked 🎉");
  } else {
    alert("Level Completed 👍");
  }

  save();
  updateUI();
  renderLevels();
}

// INIT
load();

</script>

</body>
</html>
